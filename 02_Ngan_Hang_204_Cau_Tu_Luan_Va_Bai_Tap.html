>\u003cp>(5) \u003cb>Khớp lệnh\u003c/b> bởi sở giao dịch theo ưu tiên giá rồi thời gian, và xác nhận cho khách hàng. \u003ci>Nghĩa vụ:\u003c/i> \u003cb>thực hiện tốt nhất\u003c/b>, thực hiện các bước hợp lý để đạt được điều kiện thuận lợi nhất hiện có.\u003c/p>\u003cp>(6) \u003cb>Bù trừ và thanh toán\u003c/b> qua trung tâm lưu ký theo chu kỳ T+n. \u003ci>Nghĩa vụ:\u003c/i> thanh toán kịp thời và xử lý đúng tài sản của khách hàng.\u003c/p>\u003cp>(7) \u003cb>Báo cáo\u003c/b> — xác nhận giao dịch và sao kê tài khoản. \u003ci>Nghĩa vụ:\u003c/i> báo cáo chính xác, kịp thời và bảo mật thông tin khách hàng xuyên suốt.\u003c/p>","rubricVi":"Bảy bước theo đúng trình tự (1,0) · một nghĩa vụ đúng gắn với ít nhất năm bước (0,8) · đề cập bảo mật hoặc dấu vết kiểm toán (0,2)."},{"id":"H6-02","ch":6,"type":"calc-essay","clo":"CLO3","marks":2,"exam":"final","q":"A stock has a reference price of VND 62,000 with a ±7% daily band. (a) Compute the ceiling and floor prices. (b) A client places an LO buy at VND 67,500 — explain what happens and why bands exist.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Ceiling = 62,000 × 1.07 = \u003cb>VND 66,340\u003c/b>.\u003cbr>Floor = 62,000 × 0.93 = \u003cb>VND 57,660\u003c/b>. (Both are then rounded to the applicable tick size.)\u003c/p>\u003cp>(b) The limit order at VND 67,500 is \u003cb>above the ceiling\u003c/b> of VND 66,340 and will therefore be \u003cb>rejected by the trading system\u003c/b> — orders outside the daily band cannot be entered. The client must resubmit at or below the ceiling price.\u003c/p>\u003cp>\u003cb>Why bands exist.\u003c/b> They limit extreme intraday volatility, giving participants time to absorb information rather than react to a disorderly move, and they reduce the risk of erroneous or manipulative orders executing at absurd prices. They also protect leveraged investors from instantaneous wipe-out and give brokers time to manage margin positions. The cost is that genuine price discovery is \u003cb>delayed\u003c/b> when material news justifies a larger move: a stock may lock limit-up or limit-down for successive sessions with little trading, which is itself a liquidity problem — investors cannot exit at any price.\u003c/p>","rubric":"(a) both figures correct (0.8) · (b) rejection explained (0.4) · at least two reasons for bands and the delayed-price-discovery cost (0.8).","qVi":"Một cổ phiếu có giá tham chiếu 62.000 đồng với biên độ ngày ±7%. (a) Tính giá trần và giá sàn. (b) Một khách hàng đặt lệnh LO mua ở 67.500 đồng — giải thích điều gì xảy ra và vì sao có biên độ giá.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Giá trần = 62.000 × 1,07 = \u003cb>66.340 đồng\u003c/b>.\u003cbr>Giá sàn = 62.000 × 0,93 = \u003cb>57.660 đồng\u003c/b>. (Cả hai sau đó được làm tròn theo bước giá áp dụng.)\u003c/p>\u003cp>(b) Lệnh giới hạn ở 67.500 đồng \u003cb>cao hơn giá trần\u003c/b> 66.340 đồng và do đó sẽ \u003cb>bị hệ thống giao dịch từ chối\u003c/b> — các lệnh ngoài biên độ ngày không thể được nhập. Khách hàng phải đặt lại ở mức bằng hoặc thấp hơn giá trần.\u003c/p>\u003cp>\u003cb>Vì sao có biên độ giá.\u003c/b> Chúng hạn chế biến động cực đoan trong phiên, cho người tham gia thời gian hấp thụ thông tin thay vì phản ứng trước một chuyển động hỗn loạn, và giảm rủi ro các lệnh nhập sai hoặc mang tính thao túng được khớp ở mức giá phi lý. Chúng cũng bảo vệ nhà đầu tư dùng đòn bẩy khỏi bị quét sạch tức thì và cho công ty môi giới thời gian quản lý các vị thế ký quỹ. Cái giá là việc khám phá giá thực sự bị \u003cb>trì hoãn\u003c/b> khi tin tức trọng yếu biện minh cho một chuyển động lớn hơn: một cổ phiếu có thể bị khóa ở giá trần hoặc giá sàn qua nhiều phiên liên tiếp với rất ít giao dịch, và bản thân điều đó cũng là một vấn đề thanh khoản — nhà đầu tư không thể thoát ra ở bất kỳ mức giá nào.\u003c/p>","rubricVi":"(a) cả hai con số đúng (0,8) · (b) giải thích việc bị từ chối (0,4) · ít nhất hai lý do có biên độ và cái giá của việc trì hoãn khám phá giá (0,8)."},{"id":"H6-03","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain why margin lending is described as pro-cyclical and what this implies for a securities company's risk management.","guide":"\u003cp>\u003cb>Model answer — the mechanism.\u003c/b> Margin loans are secured on securities whose value moves with the market. When prices fall, clients' equity falls faster than the market because of leverage; equity ratios breach the maintenance requirement; brokers issue \u003cb>margin calls\u003c/b>; clients who cannot deposit funds are \u003cb>force-sold\u003c/b>. That forced selling adds supply into an already falling market, pushing prices lower, which triggers further calls and further forced selling. The same loop runs in reverse in a rising market, as rising collateral values expand borrowing capacity and fuel further buying. Lending therefore \u003cb>amplifies\u003c/b> market movements in both directions rather than dampening them.\u003c/p>\u003cp>The effect is aggravated by \u003cb>concentration\u003c/b>: when many clients borrow against the same few popular stocks, the whole book deteriorates simultaneously and the forced selling is concentrated in exactly those names.\u003c/p>\u003cp>\u003cb>Implications for risk management.\u003c/b> Lend only against an \u003cb>eligible securities list\u003c/b> screened for liquidity, free float and volatility; impose \u003cb>concentration limits\u003c/b> per security, per client and per related group; set loan-to-value ratios \u003cb>below\u003c/b> the regulatory maximum, with larger buffers for volatile names; mark to market intra-day with automated alerts; maintain a documented call-and-force-sale procedure with clear timelines; and \u003cb>stress-test\u003c/b> the book against a market-wide fall of 20–30%, including the assumption that collateral cannot be sold at screen prices. Finally, monitor \u003cb>market-wide\u003c/b> margin balances, not merely the firm's own — a system-wide deleveraging will hit the firm's collateral values however prudent its own lending was.\u003c/p>","rubric":"Downward spiral mechanism described step by step (0.8) · concentration aggravator (0.3) · at least four concrete controls (0.7) · market-wide monitoring (0.2).","qVi":"Giải thích vì sao cho vay ký quỹ được mô tả là thuận chu kỳ và điều này hàm ý gì cho việc quản trị rủi ro của một công ty chứng khoán.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — cơ chế.\u003c/b> Các khoản vay ký quỹ được bảo đảm bằng chứng khoán mà giá trị của chúng dịch chuyển theo thị trường. Khi giá giảm, vốn chủ của khách hàng giảm nhanh hơn thị trường vì có đòn bẩy; tỷ lệ vốn chủ vi phạm yêu cầu duy trì; công ty môi giới phát hành \u003cb>lệnh gọi ký quỹ\u003c/b>; những khách hàng không thể nộp thêm tiền bị \u003cb>bán giải chấp\u003c/b>. Việc bán bắt buộc đó bổ sung nguồn cung vào một thị trường vốn đã giảm, đẩy giá xuống thấp hơn, kích hoạt thêm lệnh gọi và thêm việc bán bắt buộc. Vòng lặp tương tự chạy theo chiều ngược lại trong thị trường tăng, khi giá trị tài sản bảo đảm tăng mở rộng năng lực vay và tiếp nhiên liệu cho việc mua thêm. Cho vay do đó \u003cb>khuếch đại\u003c/b> các chuyển động của thị trường theo cả hai hướng thay vì làm dịu chúng.\u003c/p>\u003cp>Hiệu ứng bị làm trầm trọng bởi sự \u003cb>tập trung\u003c/b>: khi nhiều khách hàng cùng vay dựa trên một vài cổ phiếu phổ biến, toàn bộ danh mục xấu đi cùng lúc và việc bán bắt buộc tập trung đúng vào những mã đó.\u003c/p>\u003cp>\u003cb>Hàm ý cho quản trị rủi ro.\u003c/b> Chỉ cho vay đối với một \u003cb>danh mục chứng khoán đủ điều kiện\u003c/b> được sàng lọc theo thanh khoản, lượng cổ phần tự do lưu hành và độ biến động; áp \u003cb>giới hạn tập trung\u003c/b> theo từng chứng khoán, từng khách hàng và từng nhóm liên quan; đặt tỷ lệ cho vay trên giá trị tài sản bảo đảm \u003cb>thấp hơn\u003c/b> mức tối đa theo quy định, với dư địa lớn hơn cho các mã biến động mạnh; định giá lại trong phiên với cảnh báo tự động; duy trì một quy trình gọi ký quỹ và bán giải chấp có ghi chép với thời hạn rõ ràng; và \u003cb>kiểm tra sức chịu đựng\u003c/b> của danh mục trước một đợt giảm toàn thị trường 20–30%, bao gồm cả giả định rằng tài sản bảo đảm không thể bán được ở giá trên bảng. Cuối cùng, giám sát dư nợ ký quỹ \u003cb>toàn thị trường\u003c/b>, không chỉ của riêng công ty — một đợt giảm đòn bẩy toàn hệ thống sẽ tác động lên giá trị tài sản bảo đảm của công ty dù việc cho vay của chính họ có thận trọng đến đâu.\u003c/p>","rubricVi":"Mô tả cơ chế vòng xoáy đi xuống theo từng bước (0,8) · yếu tố làm trầm trọng là sự tập trung (0,3) · ít nhất bốn biện pháp kiểm soát cụ thể (0,7) · giám sát toàn thị trường (0,2)."},{"id":"H6-04","ch":6,"type":"case","clo":"CLO3","marks":3,"exam":"final","q":"A securities company's proprietary desk suffers a large loss that emerges only at month-end, having been concealed by the trader's own valuations. Identify the control failures and recommend the framework that should have been in place.","guide":"\u003cp>\u003cb>Model answer — control failures.\u003c/b> (1) \u003cb>No segregation of duties\u003c/b>: the trader was able to value and effectively control the recording of their own positions. Traders must never mark, confirm or settle their own trades — this is the single most important control and its absence is the direct cause here. (2) \u003cb>No independent price verification\u003c/b>: the middle office should revalue positions against independent market sources at defined intervals, investigating and escalating discrepancies. (3) \u003cb>Inadequate frequency of reporting\u003c/b>: a loss emerging only at month-end indicates positions were not marked to market \u003cb>daily\u003c/b> with daily P&L attribution — which would have shown P&L inconsistent with market moves. (4) \u003cb>Weak limit monitoring\u003c/b>: position, concentration and VaR limits appear not to have been monitored in real time, or breaches were not escalated. (5) \u003cb>Cultural and supervisory failure\u003c/b>: no effective challenge from supervisors, and possibly incentives rewarding reported profit without regard to its verification.\u003c/p>\u003cp>\u003cb>Recommended framework.\u003c/b> Strict \u003cb>segregation of duties\u003c/b> between front, middle and back office, with valuation, confirmation and settlement performed independently of the trader. \u003cb>Daily mark-to-market\u003c/b> with \u003cb>independent price verification\u003c/b> against external sources and a formal process for illiquid instruments requiring model valuation and sign-off. \u003cb>Daily P&L attribution\u003c/b> explaining profit by risk factor, so unexplained P&L is investigated — a powerful detector of mismarking. \u003cb>Real-time limit monitoring\u003c/b> — position, concentration, VaR and stop-loss — with automatic escalation of breaches to risk management and, at defined thresholds, to the board. \u003cb>Mandatory block leave\u003c/b> for traders, during which another person must manage the book, a classic method of surfacing concealment. Independent \u003cb>internal audit\u003c/b> review, and \u003cb>remuneration\u003c/b> deferred and adjustable so reported profit that later proves illusory is clawed back.\u003c/p>","rubric":"At least four control failures, including segregation of duties and independent price verification (1.4) · at least five recommended controls (1.2) · block leave or remuneration/clawback point (0.4).","qVi":"Bộ phận tự doanh của một công ty chứng khoán chịu một khoản lỗ lớn chỉ lộ ra vào cuối tháng, đã bị che giấu bởi chính các mức định giá do người giao dịch tự đưa ra. Nhận diện các thất bại kiểm soát và khuyến nghị khuôn khổ lẽ ra phải có.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các thất bại kiểm soát.\u003c/b> (1) \u003cb>Không phân tách nhiệm vụ\u003c/b>: người giao dịch đã có thể định giá và thực tế là kiểm soát việc ghi nhận các vị thế của chính mình. Người giao dịch không bao giờ được tự định giá, xác nhận hay thanh toán giao dịch của chính mình — đây là biện pháp kiểm soát quan trọng nhất và sự thiếu vắng của nó là nguyên nhân trực tiếp ở đây. (2) \u003cb>Không có kiểm chứng giá độc lập\u003c/b>: khối giữa lẽ ra phải định giá lại các vị thế theo nguồn thị trường độc lập vào các thời điểm xác định, điều tra và báo cáo lên trên các sai lệch. (3) \u003cb>Tần suất báo cáo không đủ\u003c/b>: một khoản lỗ chỉ lộ ra vào cuối tháng cho thấy các vị thế không được định giá lại theo thị trường \u003cb>hằng ngày\u003c/b> kèm phân bổ lãi/lỗ hằng ngày — điều lẽ ra đã cho thấy lãi/lỗ không nhất quán với các chuyển động của thị trường. (4) \u003cb>Giám sát hạn mức yếu\u003c/b>: các hạn mức về vị thế, tập trung và VaR dường như không được giám sát theo thời gian thực, hoặc các vi phạm không được báo cáo lên trên. (5) \u003cb>Thất bại về văn hóa và giám sát\u003c/b>: không có sự phản biện hiệu quả từ cấp trên, và có thể có các cơ chế khích lệ tưởng thưởng lợi nhuận được báo cáo mà không quan tâm tới việc kiểm chứng.\u003c/p>\u003cp>\u003cb>Khuôn khổ được khuyến nghị.\u003c/b> \u003cb>Phân tách nhiệm vụ\u003c/b> nghiêm ngặt giữa khối trước, khối giữa và khối sau, với việc định giá, xác nhận và thanh toán được thực hiện độc lập với người giao dịch. \u003cb>Định giá lại theo thị trường hằng ngày\u003c/b> kèm \u003cb>kiểm chứng giá độc lập\u003c/b> theo nguồn bên ngoài và một quy trình chính thức cho các công cụ kém thanh khoản cần định giá bằng mô hình và có phê duyệt. \u003cb>Phân bổ lãi/lỗ hằng ngày\u003c/b> giải thích lợi nhuận theo từng yếu tố rủi ro, để phần lãi/lỗ không giải thích được sẽ bị điều tra — một công cụ phát hiện việc định giá sai rất hiệu quả. \u003cb>Giám sát hạn mức theo thời gian thực\u003c/b> — vị thế, tập trung, VaR và cắt lỗ — với việc tự động báo cáo vi phạm lên bộ phận quản trị rủi ro và, ở các ngưỡng xác định, lên hội đồng quản trị. \u003cb>Nghỉ phép bắt buộc liên tục\u003c/b> đối với người giao dịch, trong thời gian đó một người khác phải quản lý sổ giao dịch, một phương pháp kinh điển để làm lộ ra việc che giấu. Rà soát của \u003cb>kiểm toán nội bộ\u003c/b> độc lập, và \u003cb>thù lao\u003c/b> được trì hoãn và có thể điều chỉnh để lợi nhuận đã báo cáo mà về sau chứng tỏ là ảo có thể được thu hồi.\u003c/p>","rubricVi":"Ít nhất bốn thất bại kiểm soát, gồm phân tách nhiệm vụ và kiểm chứng giá độc lập (1,4) · ít nhất năm biện pháp kiểm soát được khuyến nghị (1,2) · điểm về nghỉ phép bắt buộc hoặc thù lao/thu hồi (0,4)."},{"id":"H6-05","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain how a market maker manages inventory risk, and why it does not simply widen its spread indefinitely.","guide":"\u003cp>\u003cb>Model answer — managing inventory.\u003c/b> The dealer's principal tool is \u003cb>quote skewing\u003c/b>. Having accumulated an unwanted long position, it lowers \u003cb>both\u003c/b> its bid and its ask: the lower bid discourages further selling to it, while the lower ask makes buying from it more attractive. The position is thus worked back toward neutral through the flow itself, rather than by taking a directional view. Other tools are reducing quoted \u003cb>size\u003c/b> on the side generating unwanted flow, \u003cb>hedging\u003c/b> residual exposure with correlated instruments, index futures or options where available, and unwinding through other venues or block trades. Firms also impose \u003cb>inventory limits\u003c/b> and end-of-day position targets.\u003c/p>\u003cp>\u003cb>Why not simply widen the spread indefinitely.\u003c/b> The spread is a price, and the dealer competes for flow. A wider quote earns more per trade but attracts fewer trades: uninformed flow — the profitable kind — is highly price-sensitive and will route to competitors offering better prices, while \u003cb>informed\u003c/b> traders, who are trading on a view rather than on cost, are far less deterred. Widening therefore worsens the very \u003cb>adverse-selection\u003c/b> mix it was meant to address, leaving the dealer with a small volume of predominantly toxic flow. Market makers may also carry \u003cb>contractual obligations\u003c/b> to quote within a maximum spread for a minimum size. The dealer's real problem is not the width of the spread but discriminating between informed and uninformed flow, which is why it segments counterparties and manages size rather than relying on price alone.\u003c/p>","rubric":"Quote skewing explained correctly (0.7) · at least two further inventory tools (0.4) · competition for uninformed flow and the adverse-selection worsening argument (0.7) · contractual obligation (0.2).","qVi":"Giải thích một nhà tạo lập thị trường quản trị rủi ro tồn kho như thế nào, và vì sao họ không đơn giản là nới rộng chênh lệch giá vô hạn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — quản trị tồn kho.\u003c/b> Công cụ chính của nhà tạo lập là \u003cb>lệch mức yết\u003c/b>. Khi đã tích lũy một vị thế mua ngoài ý muốn, họ hạ \u003cb>cả\u003c/b> giá đặt mua lẫn giá chào bán: giá đặt mua thấp hơn làm nản việc tiếp tục bán cho họ, trong khi giá chào bán thấp hơn làm việc mua từ họ hấp dẫn hơn. Vị thế nhờ đó được đưa về trạng thái cân bằng thông qua chính dòng lệnh, thay vì bằng cách nhận định về hướng đi. Các công cụ khác là giảm \u003cb>khối lượng\u003c/b> yết ở chiều tạo ra dòng lệnh không mong muốn, \u003cb>phòng ngừa rủi ro\u003c/b> phần còn dư bằng các công cụ tương quan, hợp đồng tương lai chỉ số hoặc quyền chọn nơi có sẵn, và đóng vị thế qua các sàn khác hoặc giao dịch thỏa thuận lô lớn. Các công ty cũng áp \u003cb>hạn mức tồn kho\u003c/b> và mục tiêu vị thế cuối ngày.\u003c/p>\u003cp>\u003cb>Vì sao không đơn giản là nới rộng chênh lệch giá vô hạn.\u003c/b> Chênh lệch giá là một mức giá, và nhà tạo lập phải cạnh tranh để giành dòng lệnh. Một mức yết rộng hơn kiếm được nhiều hơn trên mỗi giao dịch nhưng thu hút ít giao dịch hơn: dòng lệnh từ bên không nắm thông tin — loại sinh lời — rất nhạy cảm với giá và sẽ chuyển sang các đối thủ chào giá tốt hơn, trong khi những người giao dịch \u003cb>nắm nhiều thông tin\u003c/b>, vốn giao dịch dựa trên một quan điểm chứ không phải chi phí, thì ít bị ngăn cản hơn nhiều. Nới rộng do đó làm xấu đi chính cơ cấu \u003cb>lựa chọn bất lợi\u003c/b> mà nó nhằm khắc phục, để lại cho nhà tạo lập một khối lượng nhỏ chủ yếu là dòng lệnh độc hại. Nhà tạo lập thị trường cũng có thể mang \u003cb>nghĩa vụ hợp đồng\u003c/b> phải yết trong một mức chênh lệch tối đa cho một khối lượng tối thiểu. Vấn đề thực sự của nhà tạo lập không phải là độ rộng của chênh lệch giá mà là việc phân biệt giữa dòng lệnh nắm thông tin và không nắm thông tin, đó là lý do họ phân khúc đối tác và quản lý khối lượng thay vì chỉ dựa vào giá.\u003c/p>","rubricVi":"Giải thích đúng việc lệch mức yết (0,7) · ít nhất hai công cụ quản trị tồn kho khác (0,4) · cạnh tranh giành dòng lệnh không nắm thông tin và lập luận làm xấu lựa chọn bất lợi (0,7) · nghĩa vụ hợp đồng (0,2)."},{"id":"K1-01","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the SIC classification of investment banks and what it tells us about the scope of the industry.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Under the US \u003cb>Standard Industrial Classification\u003c/b>, investment banks fall within industry \u003cb>6211\u003c/b> — &ldquo;Security Brokers, Dealers, and Flotation Companies&rdquo; (major group 62). It covers establishments engaged in the \u003cb>purchase, sale and brokerage\u003c/b> of securities, and those &ldquo;generally known as investment bankers&rdquo; engaged in \u003cb>originating, underwriting and distributing\u003c/b> issues of securities; commodity contracts brokers and dealers form a separate industry (6221).\u003c/p>\u003cp>\u003cb>What it tells us.\u003c/b> Three things. First, the industry is defined by \u003cb>securities activity\u003c/b> rather than by deposit-taking or lending — the classification places it alongside brokers and dealers, not banks. Second, the pairing of &ldquo;purchase and sale&rdquo; with &ldquo;brokerage&rdquo; captures the fundamental duality of the business: \u003cb>agency\u003c/b> work earning fees and commissions, and \u003cb>principal\u003c/b> work earning spreads and trading gains. Third, the breadth of the description — originating, underwriting, distributing, buying, selling, brokering — shows that the narrow definition of investment banking as underwriting alone is incomplete even in official taxonomy.\u003c/p>","rubric":"Correct groups identified (0.6) · own account / others' account duality (0.7) · implication that scope exceeds underwriting alone (0.7).","qVi":"Giải thích cách phân loại SIC đối với ngân hàng đầu tư và điều đó cho ta biết gì về phạm vi của ngành.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Theo hệ \u003cb>Phân loại Công nghiệp Tiêu chuẩn (SIC)\u003c/b> của Hoa Kỳ, ngân hàng đầu tư thuộc ngành \u003cb>6211\u003c/b> — &ldquo;Môi giới, kinh doanh chứng khoán và tổ chức phát hành hộ&rdquo; (nhóm chính 62). Ngành này gồm các cơ sở \u003cb>mua, bán và môi giới\u003c/b> chứng khoán, và những cơ sở &ldquo;thường được gọi là ngân hàng đầu tư&rdquo; chuyên \u003cb>khởi tạo, bảo lãnh và phân phối\u003c/b> các đợt phát hành chứng khoán; môi giới và kinh doanh hợp đồng hàng hoá là một ngành riêng (6221).\u003c/p>\u003cp>\u003cb>Điều đó cho ta biết gì.\u003c/b> Ba điều. Thứ nhất, ngành được định nghĩa bởi \u003cb>hoạt động chứng khoán\u003c/b> chứ không phải bởi nhận tiền gửi hay cho vay — cách phân loại đặt nó cạnh nhà môi giới và nhà tự doanh, không phải cạnh ngân hàng. Thứ hai, việc đặt &ldquo;mua và bán&rdquo; cạnh &ldquo;môi giới&rdquo; nắm bắt tính hai mặt cơ bản của ngành: công việc \u003cb>đại lý\u003c/b> kiếm phí và hoa hồng, và công việc \u003cb>chính chủ\u003c/b> kiếm chênh lệch giá và lãi giao dịch. Thứ ba, bề rộng của mô tả — khởi tạo, bảo lãnh, phân phối, mua, bán, môi giới — cho thấy định nghĩa hẹp về ngân hàng đầu tư chỉ là bảo lãnh phát hành là chưa đầy đủ, ngay cả trong hệ phân loại chính thức.\u003c/p>","rubricVi":"Xác định đúng các nhóm (0,6) · tính hai mặt tài khoản mình/người khác (0,7) · hàm ý phạm vi vượt quá chỉ bảo lãnh phát hành (0,7)."},{"id":"K1-02","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain why an investment bank's balance sheet expands and contracts with market activity, and why this matters.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The bank raises funding only against actual investment or transaction needs — the \u003cb>liability-management\u003c/b> orientation. When activity is high it warehouses underwriting positions, holds market-making inventory, extends margin loans and finances client positions, funding all of this largely through \u003cb>repo and other secured borrowing\u003c/b> against those very assets. When activity falls, the positions are unwound and the associated funding is simply not renewed. The balance sheet therefore breathes with market conditions rather than being anchored by a stable deposit base.\u003c/p>\u003cp>\u003cb>Why it matters.\u003c/b> The funding is short-term and continuously rolled, so the bank depends on daily access to the secured funding market. That access rests on two conditions: the collateral must remain liquid and reliably valued, and counterparties must remain confident in the firm's name. In a crisis both fail at once — collateral values become uncertain precisely when confidence evaporates. The bank cannot shrink an illiquid asset book fast enough to match, so a solvent institution can fail on liquidity within days. This is the mechanism that destroyed Bear Stearns and Lehman Brothers in 2008.\u003c/p>","rubric":"Liability-management mechanism with examples of assets funded (0.8) · dependence on rolling secured funding (0.5) · simultaneous failure of collateral and confidence, with the 2008 illustration (0.7).","qVi":"Giải thích vì sao bảng cân đối của một ngân hàng đầu tư nở ra và co lại theo hoạt động thị trường, và vì sao điều đó quan trọng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Ngân hàng chỉ huy động vốn đối ứng với nhu cầu đầu tư hay giao dịch thực tế — định hướng \u003cb>quản lý nợ\u003c/b>. Khi hoạt động sôi động, nó lưu kho các vị thế bảo lãnh, giữ tồn kho tạo lập thị trường, cấp các khoản vay ký quỹ và tài trợ vị thế của khách hàng, tài trợ toàn bộ phần lớn qua \u003cb>repo và các khoản vay có bảo đảm khác\u003c/b> đối ứng chính các tài sản đó. Khi hoạt động giảm, các vị thế được đóng lại và nguồn vốn liên quan đơn giản là không được tái tục. Bảng cân đối vì thế phập phồng theo điều kiện thị trường thay vì được neo bởi một nền tiền gửi ổn định.\u003c/p>\u003cp>\u003cb>Vì sao điều đó quan trọng.\u003c/b> Nguồn vốn là ngắn hạn và liên tục được đảo, nên ngân hàng phụ thuộc vào việc tiếp cận thị trường vốn có bảo đảm hằng ngày. Việc tiếp cận đó dựa trên hai điều kiện: tài sản bảo đảm phải còn thanh khoản và được định giá đáng tin cậy, và đối tác phải còn tin vào tên tuổi của công ty. Trong khủng hoảng, cả hai cùng đổ vỡ — giá trị tài sản bảo đảm trở nên bất định đúng lúc niềm tin bốc hơi. Ngân hàng không thể thu nhỏ một danh mục tài sản kém thanh khoản đủ nhanh để bù lại, nên một định chế còn khả năng thanh toán vẫn có thể sụp đổ vì thanh khoản chỉ trong vài ngày. Đây là cơ chế đã hủy diệt Bear Stearns và Lehman Brothers năm 2008.\u003c/p>","rubricVi":"Cơ chế quản lý nợ với ví dụ về tài sản được tài trợ (0,8) · sự phụ thuộc vào việc đảo vốn có bảo đảm (0,5) · sự đổ vỡ đồng thời của tài sản bảo đảm và niềm tin, với minh họa 2008 (0,7)."},{"id":"K1-03","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the difference between an agency function and a principal function, and give two examples of each with the associated risk.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> In an \u003cb>agency\u003c/b> function the bank acts \u003ci>for\u003c/i> a client, executing or advising on the client's behalf. It takes no position, so it bears no market risk; its exposure is to \u003cb>operational, execution and conduct\u003c/b> risk, and it is paid a fee or commission. Examples: \u003cb>brokerage\u003c/b> — executing client orders for commission, exposed to mis-execution and best-execution failure; and \u003cb>M&amp;A advisory\u003c/b> — advising on a transaction for a fee, exposed to reputational damage and liability for negligent advice.\u003c/p>\u003cp>In a \u003cb>principal\u003c/b> function the bank acts \u003ci>for itself\u003c/i>, committing its own balance sheet. It holds positions and bears \u003cb>market risk\u003c/b>, and is paid through a spread or trading gain. Examples: \u003cb>market making\u003c/b> — quoting two-sided prices and holding inventory, exposed to inventory and adverse-selection risk; and \u003cb>underwriting on a firm-commitment basis\u003c/b> — buying an entire issue for resale, exposed to placement risk if the issue cannot be sold at the expected price.\u003c/p>\u003cp>The distinction matters because the duties differ fundamentally: as agent the bank owes loyalty, best execution and client priority; as principal it is the client's counterparty, and its gain is the client's cost.\u003c/p>","rubric":"Clear distinction with risk and revenue type (0.8) · two valid agency examples with risk (0.5) · two valid principal examples with risk (0.5) · duty implication (0.2).","qVi":"Giải thích sự khác biệt giữa một chức năng đại lý và một chức năng chính chủ, và cho hai ví dụ của mỗi loại kèm rủi ro đi kèm.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Trong một chức năng \u003cb>đại lý\u003c/b>, ngân hàng hành động \u003ci>thay\u003c/i> khách hàng, thực hiện hoặc tư vấn thay mặt khách hàng. Nó không nắm giữ vị thế nên không gánh rủi ro thị trường; rủi ro của nó là rủi ro \u003cb>vận hành, thực hiện và ứng xử\u003c/b>, và được trả bằng phí hoặc hoa hồng. Ví dụ: \u003cb>môi giới\u003c/b> — thực hiện lệnh khách hàng để hưởng hoa hồng, chịu rủi ro thực hiện sai và không đạt thực hiện tốt nhất; và \u003cb>tư vấn M&amp;A\u003c/b> — tư vấn một giao dịch để hưởng phí, chịu rủi ro tổn hại danh tiếng và trách nhiệm về tư vấn cẩu thả.\u003c/p>\u003cp>Trong một chức năng \u003cb>chính chủ\u003c/b>, ngân hàng hành động \u003ci>cho chính mình\u003c/i>, cam kết bảng cân đối của mình. Nó nắm giữ vị thế và gánh \u003cb>rủi ro thị trường\u003c/b>, và được trả qua chênh lệch giá hoặc lãi giao dịch. Ví dụ: \u003cb>tạo lập thị trường\u003c/b> — yết giá hai chiều và giữ tồn kho, chịu rủi ro tồn kho và lựa chọn bất lợi; và \u003cb>bảo lãnh theo cam kết chắc chắn\u003c/b> — mua trọn một đợt phát hành để bán lại, chịu rủi ro phân phối nếu không bán được đợt phát hành ở mức giá kỳ vọng.\u003c/p>\u003cp>Sự phân biệt quan trọng vì nghĩa vụ khác nhau về bản chất: với vai trò đại lý, ngân hàng có nghĩa vụ trung thành, thực hiện tốt nhất và ưu tiên khách hàng; với vai trò chính chủ, nó là đối tác của khách hàng, và lãi của nó là chi phí của khách hàng.\u003c/p>","rubricVi":"Phân biệt rõ với loại rủi ro và loại doanh thu (0,8) · hai ví dụ đại lý hợp lệ kèm rủi ro (0,5) · hai ví dụ chính chủ hợp lệ kèm rủi ro (0,5) · hàm ý về nghĩa vụ (0,2)."},{"id":"K1-04","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Describe three conflicts of interest that arise between divisions of an investment bank and one control for each.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Research versus the investment-banking division.\u003c/b> Analysts face pressure to publish favourable reports on companies the bank is advising or underwriting, in order to win or protect the mandate. \u003ci>Control:\u003c/i> research reporting lines and compensation separated from banking revenue, no pre-publication review by bankers, and mandatory disclosure of banking relationships in every report.\u003c/p>\u003cp>\u003cb>(2) Research versus proprietary trading.\u003c/b> Analysts may be pressured to publish views that benefit the firm's own positions — for example a buy recommendation while the desk is selling. \u003ci>Control:\u003c/i> the information barrier plus surveillance of proprietary trading around the timing of research publication.\u003c/p>\u003cp>\u003cb>(3) The investment-banking division versus investment management.\u003c/b> When the bank underwrites an issue it has an interest in placing it, including into portfolios it manages for other clients. \u003ci>Control:\u003c/i> restrictions or outright prohibition on placing own-underwritten securities into discretionary client portfolios, with disclosure and independent suitability testing where permitted.\u003c/p>\u003cp>(A fourth valid answer is proprietary trading versus brokerage — the front-running risk — controlled by client order priority and segregated systems and personnel.)\u003c/p>","rubric":"Three genuine conflicts correctly described (1.2) · a specific and appropriate control for each (0.8).","qVi":"Mô tả ba xung đột lợi ích phát sinh giữa các bộ phận của một ngân hàng đầu tư và một biện pháp kiểm soát cho mỗi xung đột.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Nghiên cứu và khối ngân hàng đầu tư.\u003c/b> Chuyên viên phân tích chịu áp lực công bố báo cáo thuận lợi về các công ty mà ngân hàng đang tư vấn hoặc bảo lãnh, nhằm giành hoặc giữ hợp đồng. \u003ci>Kiểm soát:\u003c/i> tuyến báo cáo và thù lao của nghiên cứu tách khỏi doanh thu ngân hàng đầu tư, không cho chuyên viên tư vấn xem trước khi công bố, và bắt buộc công bố quan hệ ngân hàng đầu tư trong mọi báo cáo.\u003c/p>\u003cp>\u003cb>(2) Nghiên cứu và tự doanh.\u003c/b> Chuyên viên phân tích có thể bị ép công bố quan điểm có lợi cho vị thế của chính công ty — chẳng hạn khuyến nghị mua trong khi bàn giao dịch đang bán. \u003ci>Kiểm soát:\u003c/i> rào chắn thông tin cộng giám sát hoạt động tự doanh quanh thời điểm công bố nghiên cứu.\u003c/p>\u003cp>\u003cb>(3) Khối ngân hàng đầu tư và quản lý đầu tư.\u003c/b> Khi ngân hàng bảo lãnh một đợt phát hành, nó có lợi ích trong việc đưa đợt phát hành đó, gồm cả vào các danh mục nó quản lý cho khách hàng khác. \u003ci>Kiểm soát:\u003c/i> hạn chế hoặc cấm hẳn việc đưa chứng khoán do chính mình bảo lãnh vào danh mục khách hàng ủy thác toàn quyền, kèm công bố và kiểm tra tính phù hợp độc lập nơi được phép.\u003c/p>\u003cp>(Một câu trả lời hợp lệ thứ tư là tự doanh và môi giới — rủi ro giao dịch chạy trước lệnh — được kiểm soát bằng ưu tiên lệnh khách hàng và hệ thống, nhân sự tách biệt.)\u003c/p>","rubricVi":"Mô tả đúng ba xung đột thực sự (1,2) · một biện pháp kiểm soát cụ thể và phù hợp cho mỗi xung đột (0,8)."},{"id":"K1-05","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what the Dodd-Frank Act requires of investment banks and why each requirement was introduced.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>Dodd-Frank Wall Street Reform and Consumer Protection Act (2010)\u003c/b> was the deepest regulatory change to US financial services since 1934, enacted in response to the 2007–08 crisis. Its principal requirements for investment banks are:\u003c/p>\u003cp>\u003cb>(1) Capital.\u003c/b> Banks must support their assets with at least 5% equity. \u003ci>Why:\u003c/i> pre-crisis leverage of 30× or more meant a small fall in asset values wiped out equity; more capital absorbs loss before failure.\u003c/p>\u003cp>\u003cb>(2) Liquidity.\u003c/b> Much higher holdings of highly liquid assets convertible quickly into cash. \u003ci>Why:\u003c/i> the crisis was a funding run — firms were unable to roll short-term secured borrowing and had no liquid buffer to survive the gap.\u003c/p>\u003cp>\u003cb>(3) Annual stress tests.\u003c/b> Firms must demonstrate survival of a simulated crisis at least as severe as 2008 without government support. \u003ci>Why:\u003c/i> to end &ldquo;too big to fail&rdquo; bailouts by identifying weakness in advance.\u003c/p>\u003cp>\u003cb>(4) The Volcker Rule\u003c/b> restricting most proprietary trading. \u003ci>Why:\u003c/i> to prevent deposit-taking groups using the public safety net to fund speculative positions.\u003c/p>\u003cp>Broader objectives were consumer protection, coordination between regulators, early identification of systemic risk, and transparency of complex instruments and executive compensation. The collective effect was to lower permissible leverage and therefore structurally reduce industry ROE.\u003c/p>","rubric":"At least three requirements correctly stated (1.0) · a valid rationale for each (0.7) · ROE/leverage consequence (0.3).","qVi":"Giải thích Đạo luật Dodd-Frank yêu cầu gì đối với ngân hàng đầu tư và vì sao mỗi yêu cầu được đưa ra.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Đạo luật Cải cách Phố Wall và Bảo vệ Người tiêu dùng Dodd-Frank (2010)\u003c/b> là thay đổi quản lý sâu rộng nhất đối với dịch vụ tài chính Hoa Kỳ kể từ năm 1934, ban hành để ứng phó với khủng hoảng 2007–08. Các yêu cầu chính đối với ngân hàng đầu tư là:\u003c/p>\u003cp>\u003cb>(1) Vốn.\u003c/b> Ngân hàng phải đỡ tài sản của mình bằng ít nhất 5% vốn chủ. \u003ci>Vì sao:\u003c/i> đòn bẩy trước khủng hoảng ở mức 30× trở lên nghĩa là một sụt giảm nhỏ của giá trị tài sản đã xóa sạch vốn chủ; nhiều vốn hơn hấp thụ tổn thất trước khi đổ vỡ.\u003c/p>\u003cp>\u003cb>(2) Thanh khoản.\u003c/b> Nắm giữ nhiều hơn hẳn các tài sản có tính thanh khoản cao, chuyển nhanh thành tiền mặt. \u003ci>Vì sao:\u003c/i> khủng hoảng là một cuộc tháo chạy về vốn — các định chế không thể đảo vốn vay ngắn hạn có bảo đảm và không có bộ đệm thanh khoản để sống sót qua khoảng trống.\u003c/p>\u003cp>\u003cb>(3) Kiểm tra sức chịu đựng hằng năm.\u003c/b> Các định chế phải chứng minh khả năng sống sót qua một cuộc khủng hoảng mô phỏng nghiêm trọng ít nhất bằng 2008 mà không cần hỗ trợ của chính phủ. \u003ci>Vì sao:\u003c/i> để chấm dứt các gói cứu trợ &ldquo;quá lớn để sụp đổ&rdquo; bằng cách nhận diện điểm yếu trước.\u003c/p>\u003cp>\u003cb>(4) Quy tắc Volcker\u003c/b> hạn chế phần lớn hoạt động tự doanh. \u003ci>Vì sao:\u003c/i> để ngăn các tập đoàn nhận tiền gửi dùng lưới an toàn công để tài trợ cho các vị thế đầu cơ.\u003c/p>\u003cp>Các mục tiêu rộng hơn là bảo vệ người tiêu dùng, phối hợp giữa các cơ quan quản lý, nhận diện sớm rủi ro hệ thống, và minh bạch các công cụ phức tạp cùng thù lao của lãnh đạo. Tác động tổng hợp là hạ đòn bẩy được phép và do đó giảm ROE của ngành một cách cấu trúc.\u003c/p>","rubricVi":"Nêu đúng ít nhất ba yêu cầu (1,0) · một lý do hợp lệ cho mỗi yêu cầu (0,7) · hệ quả ROE/đòn bẩy (0,3)."},{"id":"K1-06","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what a 'restricted list' and a 'watch list' are and how they differ.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Both are maintained by the \u003cb>control room\u003c/b> within compliance to manage the risk arising from material non-public information held on the private side.\u003c/p>\u003cp>A \u003cb>restricted list\u003c/b> names securities in which the firm's activity is actively \u003cb>curtailed\u003c/b>: research may not be published or ratings changed, proprietary trading is prohibited, and solicitation of client orders may be restricted. A security is placed on it when the firm has a live mandate — for example an announced or imminent transaction — and the restriction is \u003cb>visible to the relevant staff\u003c/b>, because they must comply with it.\u003c/p>\u003cp>A \u003cb>watch list\u003c/b> is \u003cb>confidential\u003c/b> and is not circulated to business staff. It records securities on which the firm holds sensitive information, and compliance uses it to \u003cb>monitor\u003c/b> trading and research activity for signs of misuse. Its confidentiality is the point: publishing it would itself signal that a transaction is under way, which could move the market and breach the client's confidence.\u003c/p>\u003cp>In short: the restricted list \u003cb>prevents\u003c/b> activity and is disclosed internally; the watch list \u003cb>detects\u003c/b> misuse and is kept secret.\u003c/p>","rubric":"Restricted list purpose and visibility (0.8) · watch list purpose and confidentiality (0.8) · the prevent-versus-detect distinction (0.4).","qVi":"Giải thích 'danh sách hạn chế' và 'danh sách theo dõi' là gì và chúng khác nhau như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Cả hai đều do \u003cb>phòng kiểm soát\u003c/b> trong bộ phận tuân thủ duy trì nhằm quản lý rủi ro phát sinh từ thông tin trọng yếu chưa công bố mà bên riêng tư nắm giữ.\u003c/p>\u003cp>Một \u003cb>danh sách hạn chế\u003c/b> nêu các chứng khoán mà hoạt động của công ty bị \u003cb>hạn chế\u003c/b> tích cực: không được công bố nghiên cứu hay thay đổi khuyến nghị, cấm tự doanh, và việc mời chào lệnh khách hàng có thể bị hạn chế. Một chứng khoán được đưa vào đó khi công ty có một hợp đồng đang thực hiện — chẳng hạn một giao dịch đã công bố hoặc sắp diễn ra — và sự hạn chế được \u003cb>công khai cho nhân sự liên quan\u003c/b>, vì họ phải tuân thủ nó.\u003c/p>\u003cp>Một \u003cb>danh sách theo dõi\u003c/b> là \u003cb>bảo mật\u003c/b> và không được phổ biến cho nhân sự kinh doanh. Nó ghi lại các chứng khoán mà công ty nắm thông tin nhạy cảm, và bộ phận tuân thủ dùng nó để \u003cb>giám sát\u003c/b> hoạt động giao dịch và nghiên cứu tìm dấu hiệu lạm dụng. Tính bảo mật của nó là mấu chốt: công bố nó sẽ tự phát tín hiệu rằng một giao dịch đang diễn ra, điều có thể làm dịch chuyển thị trường và vi phạm sự tín nhiệm của khách hàng.\u003c/p>\u003cp>Tóm lại: danh sách hạn chế \u003cb>ngăn chặn\u003c/b> hoạt động và được công khai nội bộ; danh sách theo dõi \u003cb>phát hiện\u003c/b> lạm dụng và được giữ bí mật.\u003c/p>","rubricVi":"Mục đích và tính công khai của danh sách hạn chế (0,8) · mục đích và tính bảo mật của danh sách theo dõi (0,8) · phân biệt ngăn chặn – phát hiện (0,4)."},{"id":"K2-01","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the three components into which the gross spread is divided and what each rewards.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The gross spread — the difference between the offer price and the proceeds paid to the issuer — is conventionally split three ways.\u003c/p>\u003cp>\u003cb>(1) Management fee.\u003c/b> Paid to the lead manager or bookrunner for \u003cb>running the transaction\u003c/b>: structuring, coordinating the syndicate, managing due diligence and documentation, building and controlling the book, and setting the price and allocations. It rewards origination and execution effort.\u003c/p>\u003cp>\u003cb>(2) Underwriting fee.\u003c/b> Paid to syndicate members in proportion to their underwriting commitments, rewarding them for \u003cb>assuming placement risk\u003c/b> — the obligation to purchase securities they cannot resell. It compensates the use of the balance sheet and is the component most sensitive to deal risk.\u003c/p>\u003cp>\u003cb>(3) Selling concession.\u003c/b> Paid to whichever syndicate or selling-group member \u003cb>actually places\u003c/b> the shares with an investor. It rewards distribution effort and is typically the largest of the three.\u003c/p>\u003cp>The bookrunner takes the largest overall share because it controls the process, the book and the allocation.\u003c/p>","rubric":"Three components correctly named (0.6) · what each rewards (0.9) · bookrunner's larger share or the risk-linkage point (0.5).","qVi":"Giải thích ba thành phần mà phí bảo lãnh được chia thành và mỗi thành phần tưởng thưởng điều gì.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Phí bảo lãnh — chênh lệch giữa giá chào bán và số tiền trả cho tổ chức phát hành — theo thông lệ được chia ba phần.\u003c/p>\u003cp>\u003cb>(1) Phí quản lý.\u003c/b> Trả cho nhà quản lý chính hoặc quản lý sổ vì \u003cb>điều hành giao dịch\u003c/b>: cấu trúc, phối hợp tổ hợp, quản lý thẩm định và hồ sơ, dựng và kiểm soát sổ lệnh, và ấn định giá cùng phân bổ. Nó tưởng thưởng công sức khởi tạo và thực thi.\u003c/p>\u003cp>\u003cb>(2) Phí bảo lãnh.\u003c/b> Trả cho các thành viên tổ hợp theo tỷ lệ cam kết bảo lãnh, tưởng thưởng cho việc \u003cb>đảm nhận rủi ro phân phối\u003c/b> — nghĩa vụ mua chứng khoán không bán được. Nó bù đắp cho việc sử dụng bảng cân đối và là thành phần nhạy cảm nhất với rủi ro thương vụ.\u003c/p>\u003cp>\u003cb>(3) Hoa hồng bán.\u003c/b> Trả cho thành viên tổ hợp hoặc nhóm bán nào \u003cb>thực sự phân phối\u003c/b> cổ phần cho một nhà đầu tư. Nó tưởng thưởng công sức phân phối và thường là phần lớn nhất trong ba.\u003c/p>\u003cp>Nhà quản lý sổ nhận phần lớn nhất tổng thể vì kiểm soát quy trình, sổ lệnh và việc phân bổ.\u003c/p>","rubricVi":"Nêu đúng ba thành phần (0,6) · mỗi thành phần tưởng thưởng gì (0,9) · phần lớn hơn của nhà quản lý sổ hoặc điểm gắn với rủi ro (0,5)."},{"id":"K2-02","ch":2,"type":"calc-essay","clo":"CLO1","marks":2,"exam":"midterm","q":"A company offers 12 million shares at VND 48,000 with a 6.5% gross spread and a 15% greenshoe fully exercised. Compute total shares, gross proceeds, the fee and net proceeds.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Greenshoe shares = 15% × 12,000,000 = \u003cb>1,800,000\u003c/b>.\u003cbr>Total shares = 12,000,000 + 1,800,000 = \u003cb>13,800,000\u003c/b>.\u003c/p>\u003cp>Gross proceeds = 13,800,000 × 48,000 = \u003cb>VND 662.4 billion\u003c/b>.\u003c/p>\u003cp>Underwriting fee = 6.5% × 662.4bn = \u003cb>VND 43.056 billion\u003c/b>.\u003c/p>\u003cp>Net proceeds to the issuer = 662.4 − 43.056 = \u003cb>VND 619.344 billion\u003c/b>.\u003c/p>\u003cp>Note that exercising the greenshoe increased the issuer's gross proceeds by 1.8m × 48,000 = VND 86.4bn, so the option benefits the issuer as well as stabilising the aftermarket — it is exercised only when the share price has risen above the offer price.\u003c/p>","rubric":"Greenshoe and total shares (0.5) · gross proceeds (0.5) · fee (0.5) · net proceeds (0.3) · observation on the greenshoe's effect (0.2).","qVi":"Một công ty chào 12 triệu cổ phần giá 48.000 đồng với phí bảo lãnh 6,5% và greenshoe 15% được thực hiện toàn bộ. Tính tổng số cổ phần, số tiền thu gộp, phí và số tiền thu ròng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Cổ phần greenshoe = 15% × 12.000.000 = \u003cb>1.800.000\u003c/b>.\u003cbr>Tổng cổ phần = 12.000.000 + 1.800.000 = \u003cb>13.800.000\u003c/b>.\u003c/p>\u003cp>Số tiền thu gộp = 13.800.000 × 48.000 = \u003cb>662,4 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Phí bảo lãnh = 6,5% × 662,4 tỷ = \u003cb>43,056 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Số tiền thu ròng của tổ chức phát hành = 662,4 − 43,056 = \u003cb>619,344 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Lưu ý việc thực hiện greenshoe làm tăng số tiền thu gộp của tổ chức phát hành thêm 1,8 triệu × 48.000 = 86,4 tỷ đồng, nên quyền chọn này có lợi cho tổ chức phát hành cũng như bình ổn thị trường thứ cấp — nó chỉ được thực hiện khi giá cổ phiếu đã tăng trên giá chào bán.\u003c/p>","rubricVi":"Greenshoe và tổng cổ phần (0,5) · số tiền thu gộp (0,5) · phí (0,5) · thu ròng (0,3) · nhận xét về tác động của greenshoe (0,2)."},{"id":"K2-03","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the conditions a Vietnamese joint-stock company must satisfy to make a public offering of shares.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Under the \u003cb>Law on Securities 2019\u003c/b> the principal conditions are:\u003c/p>\u003cul>\u003cli>Paid-up \u003cb>charter capital of at least VND 30 billion\u003c/b> at the time of registration, measured at book value;\u003c/li>\u003cli>\u003cb>Profitable operations in the two preceding years\u003c/b>, with no accumulated losses up to the year of registration;\u003c/li>\u003cli>An \u003cb>offering plan and plan for the use of proceeds\u003c/b> approved by the General Meeting of Shareholders;\u003c/li>\u003cli>\u003cb>Ownership dispersion\u003c/b> — at least 15% of voting shares sold to at least 100 investors who are not major shareholders (10% where charter capital is VND 1,000 billion or more);\u003c/li>\u003cli>A commitment by \u003cb>major shareholders\u003c/b> to hold at least 20% of charter capital for at least one year from completion;\u003c/li>\u003cli>The issuer is \u003cb>not under criminal prosecution\u003c/b> or serving a criminal judgment for an economic offence;\u003c/li>\u003cli>An \u003cb>securities company advising on the registration dossier\u003c/b>, unless the issuer is itself a securities company (an adviser is required, not an underwriter); and a commitment to \u003cb>list or register for trading\u003c/b> after the offering;\u003c/li>\u003cli>An account to receive and hold the proceeds.\u003c/li>\u003c/ul>\u003cp>Candidates should verify current thresholds against the prevailing law and guiding decrees, since they are periodically amended.\u003c/p>","rubric":"At least five conditions with correct figures where applicable (1.6) · advising securities company or listing commitment (0.2) · caveat on verifying current law (0.2).","qVi":"Giải thích các điều kiện một công ty cổ phần Việt Nam phải đáp ứng để chào bán cổ phiếu ra công chúng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Theo \u003cb>Luật Chứng khoán 2019\u003c/b>, các điều kiện chính là:\u003c/p>\u003cul>\u003cli>\u003cb>Vốn điều lệ đã góp từ 30 tỷ đồng trở lên\u003c/b> tại thời điểm đăng ký, tính theo giá trị sổ sách;\u003c/li>\u003cli>\u003cb>Hoạt động kinh doanh có lãi trong hai năm liền trước\u003c/b>, không có lỗ lũy kế tính đến năm đăng ký;\u003c/li>\u003cli>Có \u003cb>phương án phát hành và phương án sử dụng vốn thu được\u003c/b> được Đại hội đồng cổ đông thông qua;\u003c/li>\u003cli>\u003cb>Phân tán sở hữu\u003c/b> — tối thiểu 15% số cổ phiếu có quyền biểu quyết được bán cho ít nhất 100 nhà đầu tư không phải cổ đông lớn (10% nếu vốn điều lệ từ 1.000 tỷ đồng trở lên);\u003c/li>\u003cli>Cam kết của \u003cb>cổ đông lớn\u003c/b> nắm giữ ít nhất 20% vốn điều lệ trong tối thiểu một năm kể từ khi hoàn tất;\u003c/li>\u003cli>Tổ chức phát hành \u003cb>không đang bị truy cứu trách nhiệm hình sự\u003c/b> hoặc chấp hành án hình sự về một tội kinh tế;\u003c/li>\u003cli>Có \u003cb>công ty chứng khoán tư vấn hồ sơ đăng ký chào bán\u003c/b>, trừ khi tổ chức phát hành tự là công ty chứng khoán (luật đòi hỏi tổ chức tư vấn, không bắt buộc tổ chức bảo lãnh); và cam kết \u003cb>niêm yết hoặc đăng ký giao dịch\u003c/b> sau đợt phát hành;\u003c/li>\u003cli>Có tài khoản để nhận và giữ số tiền thu.\u003c/li>\u003c/ul>\u003cp>Người học nên đối chiếu các ngưỡng hiện hành với luật và nghị định hướng dẫn đang có hiệu lực, vì chúng được sửa đổi định kỳ.\u003c/p>","rubricVi":"Ít nhất năm điều kiện với con số đúng khi áp dụng (1,6) · hợp đồng bảo lãnh hoặc cam kết niêm yết (0,2) · lưu ý đối chiếu luật hiện hành (0,2)."},{"id":"K2-04","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what determines the coupon on a corporate bond at issue.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The coupon is built from two elements: a \u003cb>benchmark yield\u003c/b> and a \u003cb>credit spread\u003c/b>.\u003c/p>\u003cp>The \u003cb>benchmark\u003c/b> is the yield on a government bond of comparable maturity, representing the risk-free rate for that term. It reflects monetary policy, inflation expectations and the shape of the yield curve — factors entirely outside the issuer's control.\u003c/p>\u003cp>The \u003cb>credit spread\u003c/b> is the premium demanded for lending to this issuer rather than the government. It is determined principally by the \u003cb>credit rating\u003c/b>, which summarises the probability of default and the expected recovery. It is also affected by the \u003cb>structure\u003c/b> — maturity, seniority, whether the debt is secured, the strength of covenants, and any call or conversion features — and by \u003cb>market conditions\u003c/b>: liquidity, investor appetite and the state of the credit cycle.\u003c/p>\u003cp>So: \u003cb>coupon ≈ benchmark yield + credit spread\u003c/b>. For example, a benchmark of 4.2% plus a 260bp spread gives approximately 6.8%. This is why rating advisory is a core part of DCM work: an upgrade narrows the spread and reduces funding cost across all future issuance.\u003c/p>","rubric":"Benchmark component with its drivers (0.6) · credit spread with rating as the primary driver (0.7) · structural and market factors (0.4) · the additive relationship or a worked figure (0.3).","qVi":"Giải thích điều gì quyết định lãi suất coupon của một trái phiếu doanh nghiệp lúc phát hành.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Coupon được dựng từ hai thành phần: một \u003cb>lợi suất chuẩn\u003c/b> và một \u003cb>chênh lệch tín dụng\u003c/b>.\u003c/p>\u003cp>\u003cb>Chuẩn\u003c/b> là lợi suất của một trái phiếu chính phủ có kỳ hạn tương đương, đại diện cho lãi suất phi rủi ro của kỳ hạn đó. Nó phản ánh chính sách tiền tệ, kỳ vọng lạm phát và hình dạng đường cong lợi suất — những yếu tố hoàn toàn ngoài tầm kiểm soát của tổ chức phát hành.\u003c/p>\u003cp>\u003cb>Chênh lệch tín dụng\u003c/b> là phần bù đòi hỏi để cho tổ chức phát hành này vay thay vì cho chính phủ vay. Nó được quyết định chủ yếu bởi \u003cb>mức xếp hạng tín nhiệm\u003c/b>, thứ tóm gọn xác suất vỡ nợ và mức thu hồi kỳ vọng. Nó cũng chịu tác động của \u003cb>cấu trúc\u003c/b> — kỳ hạn, thứ tự ưu tiên, có bảo đảm hay không, độ mạnh của điều khoản ràng buộc, và các đặc tính mua lại hoặc chuyển đổi — và của \u003cb>điều kiện thị trường\u003c/b>: thanh khoản, khẩu vị nhà đầu tư và trạng thái của chu kỳ tín dụng.\u003c/p>\u003cp>Vậy: \u003cb>coupon ≈ lợi suất chuẩn + chênh lệch tín dụng\u003c/b>. Ví dụ, chuẩn 4,2% cộng chênh lệch 260 điểm cơ bản cho khoảng 6,8%. Đây là lý do tư vấn xếp hạng là một phần cốt lõi của công việc DCM: một lần nâng hạng thu hẹp chênh lệch và giảm chi phí vốn trên mọi đợt phát hành tương lai.\u003c/p>","rubricVi":"Thành phần chuẩn với các yếu tố tác động (0,6) · chênh lệch tín dụng với xếp hạng là yếu tố chính (0,7) · yếu tố cấu trúc và thị trường (0,4) · quan hệ cộng hoặc một con số tính (0,3)."},{"id":"K2-05","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the difference between a strategic investor and a financial investor in a private placement, and the implications for the issuer.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>strategic investor\u003c/b> is usually an operating company in a related industry. Its motive is \u003cb>industrial\u003c/b>: access to a market, technology, distribution or supply, and it expects to hold the stake indefinitely. A \u003cb>financial investor\u003c/b> — a private equity or venture fund — invests for \u003cb>financial return\u003c/b> over a defined horizon, typically three to seven years, and requires an identifiable exit.\u003c/p>\u003cp>\u003cb>Implications for the issuer.\u003c/b> A strategic investor may pay a \u003cb>higher price\u003c/b>, because it can capture synergies a financial investor cannot, and it brings operational expertise, market access and credibility. But it may also seek influence over strategy, restrict the company's freedom to deal with its competitors, and it may ultimately want full control — the minority stake becomes a route to acquisition.\u003c/p>\u003cp>A financial investor generally brings \u003cb>governance discipline\u003c/b>, professional reporting and capital-markets expertise, and does not compete with the company. But it will press for value creation on its own timetable, will negotiate protective rights such as liquidation preference and board representation, and — critically — \u003cb>its exit must be planned for\u003c/b>, whether by IPO, trade sale or buy-back, which shapes the company's medium-term strategy.\u003c/p>","rubric":"Motive and horizon of each correctly contrasted (0.8) · at least two implications of a strategic investor (0.6) · at least two implications of a financial investor incl. exit (0.6).","qVi":"Giải thích sự khác biệt giữa một nhà đầu tư chiến lược và một nhà đầu tư tài chính trong chào bán riêng lẻ, và các hàm ý đối với tổ chức phát hành.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>nhà đầu tư chiến lược\u003c/b> thường là một công ty hoạt động trong ngành liên quan. Động cơ của họ mang tính \u003cb>công nghiệp\u003c/b>: tiếp cận một thị trường, công nghệ, phân phối hoặc nguồn cung, và họ dự kiến giữ cổ phần vô thời hạn. Một \u003cb>nhà đầu tư tài chính\u003c/b> — một quỹ vốn cổ phần tư nhân hoặc quỹ mạo hiểm — đầu tư vì \u003cb>lợi nhuận tài chính\u003c/b> trong một chân trời xác định, thường ba đến bảy năm, và cần một lối thoái vốn nhận diện được.\u003c/p>\u003cp>\u003cb>Hàm ý đối với tổ chức phát hành.\u003c/b> Nhà đầu tư chiến lược có thể trả \u003cb>giá cao hơn\u003c/b>, vì có thể nắm bắt được các cộng hưởng mà nhà đầu tư tài chính không thể, và mang lại chuyên môn vận hành, khả năng tiếp cận thị trường và uy tín. Nhưng họ cũng có thể tìm cách ảnh hưởng đến chiến lược, hạn chế quyền tự do của công ty trong việc giao dịch với đối thủ của họ, và cuối cùng có thể muốn kiểm soát toàn bộ — cổ phần thiểu số trở thành con đường tới thâu tóm.\u003c/p>\u003cp>Nhà đầu tư tài chính nói chung mang lại \u003cb>kỷ luật quản trị\u003c/b>, báo cáo chuyên nghiệp và chuyên môn thị trường vốn, và không cạnh tranh với công ty. Nhưng họ sẽ thúc ép tạo giá trị theo thời gian biểu của riêng mình, sẽ thương lượng các quyền bảo vệ như ưu tiên thanh lý và ghế hội đồng quản trị, và — quan trọng nhất — \u003cb>lối thoái vốn của họ phải được tính đến\u003c/b>, dù bằng IPO, bán cho đối tác chiến lược hay mua lại, điều này định hình chiến lược trung hạn của công ty.\u003c/p>","rubricVi":"Động cơ và chân trời của mỗi bên được so sánh đúng (0,8) · ít nhất hai hàm ý của nhà đầu tư chiến lược (0,6) · ít nhất hai hàm ý của nhà đầu tư tài chính gồm thoái vốn (0,6)."},{"id":"K2-06","ch":2,"type":"calc-essay","clo":"CLO1","marks":2,"exam":"final","q":"A startup is valued at VND 90bn pre-money and raises VND 30bn. (a) Compute the post-money valuation and the investor's stake. (b) Founders held 100% before; what do they hold after, and what is it worth?","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Post-money = pre-money + investment = 90 + 30 = \u003cb>VND 120 billion\u003c/b>.\u003cbr>Investor's stake = 30 ÷ 120 = \u003cb>25%\u003c/b>.\u003c/p>\u003cp>(b) The founders are diluted from 100% to \u003cb>75%\u003c/b>. Their holding is worth 75% × VND 120bn = \u003cb>VND 90 billion\u003c/b> — exactly the pre-money valuation.\u003c/p>\u003cp>This is the essential logic of a priced equity round: the founders' \u003ci>percentage\u003c/i> falls but the \u003ci>value\u003c/i> of their holding is unchanged at the moment of investment, because the company has received VND 30bn of new cash in exchange for the 25% issued. Dilution is only economically harmful if the company is valued too cheaply — that is, if the pre-money valuation is set below fair value, in which case the founders transfer value to the investor. This is why negotiating the pre-money valuation, rather than the percentage, is the substance of a funding round.\u003c/p>","rubric":"(a) post-money and stake (0.8) · (b) founders' percentage and value (0.7) · insight that value is preserved unless the pre-money valuation is understated (0.5).","qVi":"Một công ty khởi nghiệp được định giá 90 tỷ đồng trước vốn góp (pre-money) và huy động 30 tỷ đồng. (a) Tính định giá sau vốn góp (post-money) và tỷ lệ của nhà đầu tư. (b) Nhà sáng lập nắm 100% trước đó; họ nắm bao nhiêu sau đó, và giá trị là bao nhiêu?","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Định giá sau vốn góp = định giá trước + khoản đầu tư = 90 + 30 = \u003cb>120 tỷ đồng\u003c/b>.\u003cbr>Tỷ lệ của nhà đầu tư = 30 ÷ 120 = \u003cb>25%\u003c/b>.\u003c/p>\u003cp>(b) Nhà sáng lập bị pha loãng từ 100% xuống \u003cb>75%\u003c/b>. Phần nắm giữ của họ trị giá 75% × 120 tỷ = \u003cb>90 tỷ đồng\u003c/b> — đúng bằng định giá trước vốn góp.\u003c/p>\u003cp>Đây là logic cốt yếu của một vòng gọi vốn có định giá: \u003ci>tỷ lệ\u003c/i> của nhà sáng lập giảm nhưng \u003ci>giá trị\u003c/i> phần nắm giữ của họ không đổi tại thời điểm đầu tư, vì công ty đã nhận 30 tỷ tiền mặt mới để đổi lấy 25% phát hành. Pha loãng chỉ có hại về kinh tế nếu công ty bị định giá quá rẻ — tức là nếu định giá trước vốn góp bị đặt dưới giá trị hợp lý, khi đó nhà sáng lập chuyển giá trị cho nhà đầu tư. Đây là lý do thương lượng định giá trước vốn góp, chứ không phải tỷ lệ, mới là bản chất của một vòng gọi vốn.\u003c/p>","rubricVi":"(a) định giá sau vốn góp và tỷ lệ (0,8) · (b) tỷ lệ và giá trị của nhà sáng lập (0,7) · nhận thức rằng giá trị được bảo toàn trừ khi định giá trước vốn góp bị đặt thấp (0,5)."},{"id":"K3-01","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the difference between a merger, a consolidation and an acquisition under Vietnamese enterprise law.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Merger (sáp nhập).\u003c/b> One or more companies transfer all of their assets, rights, obligations and lawful interests to another \u003cb>existing\u003c/b> company, and then cease to exist. The receiving company survives and succeeds to everything transferred — A + B → B.\u003c/p>\u003cp>\u003cb>Consolidation (hợp nhất).\u003c/b> Two or more companies combine to form an entirely \u003cb>new\u003c/b> company, to which all assets, rights and obligations pass; \u003cb>all\u003c/b> of the original companies cease to exist — A + B → C.\u003c/p>\u003cp>\u003cb>Acquisition (mua lại).\u003c/b> One company purchases all or part of another's \u003cb>shares or assets\u003c/b> in a proportion sufficient to control it. The target does \u003cb>not\u003c/b> necessarily cease to exist — it commonly continues as a subsidiary with its own legal personality — A buys control of B, B survives.\u003c/p>\u003cp>The practical distinctions matter for whether the target's legal personality survives, whether liabilities transfer automatically by operation of law, what corporate approvals are required, and whether competition clearance is triggered.\u003c/p>","rubric":"Three forms correctly defined with the survival outcome of each (1.5) · practical significance of the distinction (0.5).","qVi":"Giải thích sự khác biệt giữa sáp nhập, hợp nhất và mua lại theo pháp luật doanh nghiệp Việt Nam.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Sáp nhập.\u003c/b> Một hoặc nhiều công ty chuyển toàn bộ tài sản, quyền, nghĩa vụ và lợi ích hợp pháp của mình sang một công ty \u003cb>đang tồn tại\u003c/b> khác, rồi chấm dứt tồn tại. Công ty nhận vẫn tồn tại và kế thừa toàn bộ những gì được chuyển giao — A + B → B.\u003c/p>\u003cp>\u003cb>Hợp nhất.\u003c/b> Hai hoặc nhiều công ty kết hợp để lập nên một công ty \u003cb>hoàn toàn mới\u003c/b>, toàn bộ tài sản, quyền và nghĩa vụ chuyển sang công ty đó; \u003cb>tất cả\u003c/b> các công ty ban đầu chấm dứt tồn tại — A + B → C.\u003c/p>\u003cp>\u003cb>Mua lại.\u003c/b> Một công ty mua toàn bộ hoặc một phần \u003cb>cổ phần hoặc tài sản\u003c/b> của công ty khác với tỷ lệ đủ để kiểm soát nó. Công ty mục tiêu \u003cb>không\u003c/b> nhất thiết chấm dứt tồn tại — thông thường nó tiếp tục như một công ty con với tư cách pháp nhân riêng — A mua quyền kiểm soát B, B vẫn tồn tại.\u003c/p>\u003cp>Các phân biệt này có ý nghĩa thực tiễn về việc tư cách pháp nhân của công ty mục tiêu có tồn tại tiếp hay không, nghĩa vụ nợ có tự động chuyển giao theo luật hay không, cần những phê duyệt nội bộ nào, và có kích hoạt thủ tục về tập trung kinh tế hay không.\u003c/p>","rubricVi":"Định nghĩa đúng ba hình thức với kết cục tồn tại của mỗi hình thức (1,5) · ý nghĩa thực tiễn của sự phân biệt (0,5)."},{"id":"K3-02","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain what a control premium is, why buyers pay it, and how an advisor tests whether it is justified.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>control premium\u003c/b> is the amount by which the offer price exceeds the target's \u003cb>unaffected\u003c/b> share price — the price prevailing before any rumour or announcement of the transaction. For listed targets it commonly runs at 20–40%.\u003c/p>\u003cp>\u003cb>Why buyers pay it.\u003c/b> Control confers rights a minority holder does not have: the ability to direct strategy, appoint management, set the capital structure and dividend policy, access and redeploy the target's cash flows, and — decisively — to \u003cb>realise synergies\u003c/b> that only a controlling owner can implement. The premium is the price of those rights.\u003c/p>\u003cp>\u003cb>How it is tested.\u003c/b> The advisor values the target \u003cb>standalone\u003c/b>, then values the \u003cb>synergies separately\u003c/b> — net of the costs to achieve them and on a realistic phasing — and discounts them to present value. The premium is justified only if \u003cb>PV(net synergies) exceeds the premium paid\u003c/b>. Since the acquirer contributes the synergies, a disciplined buyer aims to retain part of that value rather than paying the seller for all of it. The advisor should also cross-check the implied multiple against \u003cb>precedent transactions\u003c/b>, which embed control premia, and stress-test the synergy assumptions in a downside case.\u003c/p>","rubric":"Definition incl. the unaffected price (0.5) · rights conferred by control and the synergy link (0.7) · the PV(synergies) > premium test with costs to achieve (0.8).","qVi":"Giải thích thặng dư kiểm soát là gì, vì sao bên mua trả nó, và nhà tư vấn kiểm định xem nó có chính đáng hay không như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Thặng dư kiểm soát\u003c/b> là phần mà giá chào mua vượt giá cổ phiếu \u003cb>chưa bị ảnh hưởng\u003c/b> của công ty mục tiêu — mức giá tồn tại trước bất kỳ tin đồn hay công bố nào về giao dịch. Với công ty mục tiêu niêm yết, mức này thường ở 20–40%.\u003c/p>\u003cp>\u003cb>Vì sao bên mua trả nó.\u003c/b> Quyền kiểm soát trao những quyền mà cổ đông thiểu số không có: khả năng định hướng chiến lược, bổ nhiệm ban điều hành, quyết định cấu trúc vốn và chính sách cổ tức, tiếp cận và tái phân bổ dòng tiền của công ty mục tiêu, và — quyết định nhất — \u003cb>hiện thực hóa các cộng hưởng\u003c/b> mà chỉ một chủ sở hữu kiểm soát mới triển khai được. Thặng dư là giá của những quyền đó.\u003c/p>\u003cp>\u003cb>Cách kiểm định.\u003c/b> Nhà tư vấn định giá công ty mục tiêu \u003cb>độc lập\u003c/b>, rồi định giá \u003cb>cộng hưởng riêng\u003c/b> — trừ chi phí để đạt được chúng và theo một lộ trình thực tế — và chiết khấu về giá trị hiện tại. Mức thặng dư chỉ chính đáng nếu \u003cb>PV(cộng hưởng ròng) vượt mức thặng dư phải trả\u003c/b>. Vì bên thâu tóm là bên đóng góp cộng hưởng, một người mua có kỷ luật nhắm giữ lại một phần giá trị đó thay vì trả cho bên bán toàn bộ. Nhà tư vấn cũng nên đối chiếu bội số ngụ ý với \u003cb>các giao dịch tiền lệ\u003c/b>, vốn đã bao hàm thặng dư kiểm soát, và kiểm tra sức chịu đựng của các giả định cộng hưởng trong kịch bản xấu.\u003c/p>","rubricVi":"Định nghĩa gồm giá chưa bị ảnh hưởng (0,5) · các quyền do kiểm soát mang lại và liên hệ cộng hưởng (0,7) · phép thử PV(cộng hưởng) > thặng dư kèm chi phí để đạt được (0,8)."},{"id":"K3-03","ch":3,"type":"calc-essay","clo":"CLO1","marks":2,"exam":"midterm","q":"A target has 40m shares trading at an unaffected price of VND 35,000, and net debt of VND 400bn. An acquirer offers a 28% premium. Compute the offer price, the equity purchase price and the implied enterprise value.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Offer price per share = 35,000 × 1.28 = \u003cb>VND 44,800\u003c/b>.\u003c/p>\u003cp>Equity purchase price = 44,800 × 40,000,000 = \u003cb>VND 1,792 billion\u003c/b>.\u003c/p>\u003cp>Implied enterprise value = equity purchase price + net debt = 1,792 + 400 = \u003cb>VND 2,192 billion\u003c/b>.\u003c/p>\u003cp>Note why net debt is \u003cb>added\u003c/b>: the acquirer takes on the target's debt as well as buying its equity, so the true cost of acquiring the operating business is the enterprise value, not the equity price. This is also the figure that must be compared with EBITDA to compute the implied EV/EBITDA multiple and to benchmark the deal against precedent transactions.\u003c/p>","rubric":"Offer price (0.6) · equity purchase price (0.6) · enterprise value with net debt added (0.5) · explanation of why net debt is added (0.3).","qVi":"Một công ty mục tiêu có 40 triệu cổ phần giao dịch ở giá chưa bị ảnh hưởng 35.000 đồng, và nợ ròng 400 tỷ đồng. Bên thâu tóm chào mức thặng dư 28%. Tính giá chào mua, giá mua vốn chủ và giá trị doanh nghiệp ngụ ý.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Giá chào mua mỗi cổ phần = 35.000 × 1,28 = \u003cb>44.800 đồng\u003c/b>.\u003c/p>\u003cp>Giá mua vốn chủ = 44.800 × 40.000.000 = \u003cb>1.792 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Giá trị doanh nghiệp ngụ ý = giá mua vốn chủ + nợ ròng = 1.792 + 400 = \u003cb>2.192 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Lưu ý vì sao nợ ròng được \u003cb>cộng vào\u003c/b>: bên thâu tóm gánh cả nợ của công ty mục tiêu chứ không chỉ mua vốn chủ, nên chi phí thực để mua lại hoạt động kinh doanh là giá trị doanh nghiệp, không phải giá vốn chủ. Đây cũng là con số phải so với EBITDA để tính bội số EV/EBITDA ngụ ý và để đối chiếu thương vụ với các giao dịch tiền lệ.\u003c/p>","rubricVi":"Giá chào mua (0,6) · giá mua vốn chủ (0,6) · giá trị doanh nghiệp với nợ ròng được cộng vào (0,5) · giải thích vì sao cộng nợ ròng (0,3)."},{"id":"K3-04","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what a data room is, what it contains and how access is controlled.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>data room\u003c/b> — now almost always a secure \u003cb>virtual\u003c/b> data room — is the controlled repository through which a seller makes due-diligence material available to shortlisted bidders in the second round of an auction.\u003c/p>\u003cp>\u003cb>Contents.\u003c/b> Corporate documents (constitution, share register, group structure); audited and management financial statements with supporting schedules; the operating model and budgets; material contracts with customers, suppliers, lenders and landlords; employment and pension arrangements; intellectual property and licences; litigation and regulatory correspondence; tax filings; environmental and technical reports; and insurance policies.\u003c/p>\u003cp>\u003cb>Access control.\u003c/b> Entry follows execution of a \u003cb>non-disclosure agreement\u003c/b>. Permissions are set by bidder and by folder, so competitively sensitive material — customer names, pricing, key contract terms — is withheld or redacted until late in the process, particularly where the bidder is a competitor. Activity is \u003cb>logged\u003c/b>, showing which documents each bidder viewed and for how long, which also tells the seller how seriously each is engaging. Documents may be watermarked and download-disabled, and a \u003cb>clean team\u003c/b> arrangement may be used so that only designated advisors, not the competitor's operational staff, see the most sensitive data.\u003c/p>","rubric":"Definition and place in the process (0.5) · at least five categories of content (0.7) · NDA, staged permissions and logging (0.6) · clean team or redaction for competitors (0.2).","qVi":"Giải thích phòng dữ liệu là gì, chứa những gì và quyền truy cập được kiểm soát ra sao.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Phòng dữ liệu\u003c/b> — ngày nay gần như luôn là một phòng dữ liệu \u003cb>ảo\u003c/b> bảo mật — là kho lưu trữ có kiểm soát qua đó bên bán cung cấp tài liệu thẩm định cho các bên chào giá lọt danh sách ngắn ở vòng hai của cuộc đấu giá.\u003c/p>\u003cp>\u003cb>Nội dung.\u003c/b> Hồ sơ doanh nghiệp (điều lệ, sổ đăng ký cổ đông, cơ cấu tập đoàn); báo cáo tài chính đã kiểm toán và báo cáo quản trị cùng các phụ lục hỗ trợ; mô hình vận hành và ngân sách; các hợp đồng trọng yếu với khách hàng, nhà cung cấp, bên cho vay và bên cho thuê; các thỏa thuận lao động và hưu trí; sở hữu trí tuệ và giấy phép; tranh chấp và trao đổi với cơ quan quản lý; hồ sơ thuế; báo cáo môi trường và kỹ thuật; và các hợp đồng bảo hiểm.\u003c/p>\u003cp>\u003cb>Kiểm soát truy cập.\u003c/b> Việc vào phòng dữ liệu diễn ra sau khi ký \u003cb>thỏa thuận bảo mật\u003c/b>. Quyền được đặt theo từng bên chào giá và từng thư mục, nên tài liệu nhạy cảm về cạnh tranh — tên khách hàng, giá bán, điều khoản hợp đồng then chốt — được giữ lại hoặc che bớt cho tới giai đoạn muộn, đặc biệt khi bên chào giá là đối thủ. Hoạt động được \u003cb>ghi nhật ký\u003c/b>, cho thấy mỗi bên xem tài liệu nào và trong bao lâu, điều này cũng cho bên bán biết mức độ nghiêm túc của từng bên. Tài liệu có thể được đóng dấu mờ và vô hiệu hóa tải xuống, và có thể áp dụng cơ chế \u003cb>nhóm sạch\u003c/b> để chỉ các cố vấn được chỉ định, chứ không phải nhân sự vận hành của đối thủ, được xem dữ liệu nhạy cảm nhất.\u003c/p>","rubricVi":"Định nghĩa và vị trí trong quy trình (0,5) · ít nhất năm nhóm nội dung (0,7) · NDA, phân quyền theo giai đoạn và ghi nhật ký (0,6) · nhóm sạch hoặc che bớt với đối thủ (0,2)."},{"id":"K3-05","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the difference between representations and warranties, indemnities, and conditions precedent in a purchase agreement.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Representations and warranties\u003c/b> are statements of fact made by the seller about the target — that the accounts are accurate, that it owns its assets, that there is no undisclosed litigation. They allocate the risk of \u003cb>unknown\u003c/b> problems: if a warranty proves untrue the buyer has a claim for damages, measured by the reduction in the target's value. They are qualified by disclosure, by materiality thresholds and by caps and time limits.\u003c/p>\u003cp>\u003cb>Indemnities\u003c/b> address \u003cb>known or specifically identified\u003c/b> risks — a pending tax assessment, an environmental liability, a live dispute discovered in diligence. The seller undertakes to reimburse the buyer pound-for-pound if the risk crystallises, without the buyer having to prove loss of value. Indemnities are therefore the response to something diligence has \u003ci>found\u003c/i>, whereas warranties protect against what it might have \u003ci>missed\u003c/i>.\u003c/p>\u003cp>\u003cb>Conditions precedent\u003c/b> are requirements that must be \u003cb>satisfied before completion can occur\u003c/b> — competition clearance, sector-regulator approval, shareholder consent, third-party change-of-control consents, or the absence of a material adverse change. They are not compensation mechanisms; if a condition is not met, the transaction simply does not close.\u003c/p>\u003cp>In short: warranties compensate for unknown defects, indemnities for identified ones, and conditions precedent determine whether the deal happens at all.\u003c/p>","rubric":"Warranties as risk allocation for unknowns with a damages remedy (0.7) · indemnities for identified risks with pound-for-pound recovery (0.7) · conditions precedent as gating items (0.4) · summarising distinction (0.2).","qVi":"Giải thích sự khác biệt giữa cam đoan và bảo đảm, bồi hoàn, và điều kiện tiên quyết trong một hợp đồng mua bán.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Cam đoan và bảo đảm\u003c/b> là các tuyên bố về sự thật do bên bán đưa ra về công ty mục tiêu — rằng sổ sách là chính xác, rằng công ty sở hữu tài sản của mình, rằng không có tranh chấp chưa công bố. Chúng phân bổ rủi ro của những vấn đề \u003cb>chưa biết\u003c/b>: nếu một bảo đảm hóa ra không đúng, bên mua có quyền đòi bồi thường thiệt hại, đo bằng phần giảm giá trị của công ty mục tiêu. Chúng bị giới hạn bởi việc công bố, bởi ngưỡng trọng yếu và bởi mức trần cùng thời hiệu.\u003c/p>\u003cp>\u003cb>Bồi hoàn\u003c/b> xử lý các rủi ro \u003cb>đã biết hoặc được nhận diện cụ thể\u003c/b> — một khoản truy thu thuế đang chờ, một nghĩa vụ môi trường, một tranh chấp đang diễn ra được phát hiện trong thẩm định. Bên bán cam kết hoàn trả cho bên mua theo tỷ lệ một đổi một nếu rủi ro thành hiện thực, mà bên mua không phải chứng minh mức giảm giá trị. Bồi hoàn do đó là phản ứng với những gì thẩm định đã \u003ci>tìm thấy\u003c/i>, trong khi bảo đảm bảo vệ trước những gì thẩm định có thể đã \u003ci>bỏ sót\u003c/i>.\u003c/p>\u003cp>\u003cb>Điều kiện tiên quyết\u003c/b> là các yêu cầu phải được \u003cb>đáp ứng trước khi việc hoàn tất có thể diễn ra\u003c/b> — chấp thuận về cạnh tranh, phê duyệt của cơ quan quản lý ngành, chấp thuận của cổ đông, chấp thuận của bên thứ ba về thay đổi quyền kiểm soát, hoặc việc không có thay đổi bất lợi trọng yếu. Chúng không phải là cơ chế bồi thường; nếu một điều kiện không được đáp ứng, giao dịch đơn giản là không hoàn tất.\u003c/p>\u003cp>Tóm lại: bảo đảm bồi thường cho khiếm khuyết chưa biết, bồi hoàn cho khiếm khuyết đã nhận diện, và điều kiện tiên quyết quyết định thương vụ có diễn ra hay không.\u003c/p>","rubricVi":"Bảo đảm như phân bổ rủi ro cho điều chưa biết với chế tài bồi thường thiệt hại (0,7) · bồi hoàn cho rủi ro đã nhận diện với hoàn trả một đổi một (0,7) · điều kiện tiên quyết như các mục chốt chặn (0,4) · phân biệt tổng kết (0,2)."},{"id":"K3-06","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain why an LBO sponsor prefers a target with low capital expenditure requirements.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> In a leveraged buyout the acquisition debt is serviced from the \u003cb>target's own cash flow\u003c/b>. Every unit of cash the business generates has competing claims on it: interest payments, scheduled amortisation, working-capital needs, and \u003cb>capital expenditure\u003c/b>.\u003c/p>\u003cp>Capital expenditure is largely \u003cb>non-discretionary\u003c/b> in the medium term — maintenance capex must be spent to keep the asset base functioning, and cutting it merely defers the requirement while degrading the business the sponsor intends to sell. So a capital-hungry target consumes precisely the cash the structure needs for \u003cb>debt service and paydown\u003c/b>.\u003c/p>\u003cp>The consequences are twofold. First, \u003cb>less debt capacity\u003c/b>: lenders size the facilities against cash flow available after capex, so a high-capex business supports lower leverage and therefore requires a larger equity cheque, reducing the sponsor's return. Second, \u003cb>slower deleveraging\u003c/b>: since debt paydown is typically the single largest contributor to LBO equity returns, cash diverted to capex directly reduces the money multiple and IRR.\u003c/p>\u003cp>A low-capex business with stable cash flow can therefore support both higher leverage and faster deleveraging — which is why the textbook lists low capital-expenditure requirements among the core target-selection criteria, alongside strong predictable cash flow, a defensible market position and a proven management team.\u003c/p>","rubric":"Competing claims on cash flow incl. capex as non-discretionary (0.7) · reduced debt capacity and larger equity cheque (0.6) · slower deleveraging reducing returns (0.5) · link to selection criteria (0.2).","qVi":"Giải thích vì sao một nhà tài trợ LBO ưa thích công ty mục tiêu có nhu cầu chi tiêu vốn thấp.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Trong một thương vụ thâu tóm bằng đòn bẩy, khoản nợ mua lại được trả từ \u003cb>chính dòng tiền của công ty mục tiêu\u003c/b>. Mỗi đồng tiền doanh nghiệp tạo ra đều có những quyền đòi cạnh tranh nhau: trả lãi, trả gốc theo lịch, nhu cầu vốn lưu động, và \u003cb>chi tiêu vốn\u003c/b>.\u003c/p>\u003cp>Chi tiêu vốn phần lớn là \u003cb>không thể tùy nghi\u003c/b> trong trung hạn — chi tiêu vốn duy trì phải được thực hiện để giữ nền tài sản vận hành, và cắt giảm nó chỉ trì hoãn yêu cầu trong khi làm suy giảm chính doanh nghiệp mà nhà tài trợ định bán. Vậy nên một công ty mục tiêu ngốn vốn tiêu thụ đúng lượng tiền mà cấu trúc cần cho \u003cb>trả lãi và trả nợ\u003c/b>.\u003c/p>\u003cp>Hệ quả có hai mặt. Thứ nhất, \u003cb>ít năng lực vay nợ hơn\u003c/b>: bên cho vay xác định quy mô hạn mức dựa trên dòng tiền còn lại sau chi tiêu vốn, nên một doanh nghiệp chi tiêu vốn cao gánh được ít đòn bẩy hơn và do đó đòi hỏi khoản vốn chủ lớn hơn, làm giảm lợi nhuận của nhà tài trợ. Thứ hai, \u003cb>giảm nợ chậm hơn\u003c/b>: vì trả nợ thường là đóng góp đơn lẻ lớn nhất vào lợi nhuận vốn chủ trong LBO, tiền bị chuyển sang chi tiêu vốn trực tiếp làm giảm bội số tiền và IRR.\u003c/p>\u003cp>Một doanh nghiệp chi tiêu vốn thấp với dòng tiền ổn định do đó có thể gánh cả đòn bẩy cao hơn lẫn giảm nợ nhanh hơn — đó là lý do giáo trình liệt kê nhu cầu chi tiêu vốn thấp trong số các tiêu chí lựa chọn công ty mục tiêu cốt lõi, bên cạnh dòng tiền mạnh dự đoán được, vị thế thị trường bảo vệ được và đội ngũ quản lý đã được kiểm chứng.\u003c/p>","rubricVi":"Các quyền đòi cạnh tranh trên dòng tiền gồm chi tiêu vốn là không thể tùy nghi (0,7) · giảm năng lực vay nợ và khoản vốn chủ lớn hơn (0,6) · giảm nợ chậm hơn làm giảm lợi nhuận (0,5) · liên hệ tới tiêu chí lựa chọn (0,2)."},{"id":"K4-01","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the role of the supervisory bank (custodian) in a public fund and why its independence matters.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>supervisory bank\u003c/b> holds the fund's assets in \u003cb>custody, separately from the assets of the fund management company\u003c/b>, and monitors the manager's compliance with the fund charter, the prospectus and the applicable regulations. It typically also verifies the calculation of NAV, confirms that subscriptions and redemptions are processed correctly, and reports breaches to the regulator.\u003c/p>\u003cp>\u003cb>Why independence matters.\u003c/b> The arrangement separates \u003cb>decision-making\u003c/b> from \u003cb>possession\u003c/b>. The manager decides what to buy and sell but never holds the assets or the cash; the custodian holds them but has no discretion over investment. Neither party can therefore misappropriate client assets alone — a fraud would require collusion between two separately regulated institutions.\u003c/p>\u003cp>This
