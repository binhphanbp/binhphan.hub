ính nợ), \u003ci>thuế\u003c/i>, \u003ci>pháp lý\u003c/i> (quyền sở hữu, hợp đồng, tranh chấp, giấy phép), \u003ci>môi trường\u003c/i>, \u003ci>nhân sự\u003c/i> (nhân sự chủ chốt, hưu trí, nghĩa vụ lao động) và \u003ci>công nghệ thông tin/vận hành\u003c/i>. Các phát hiện đi thẳng vào giá, gói bảo đảm và bồi hoàn, cùng các điều kiện tiên quyết cụ thể.\u003c/p>","rubricVi":"Ít nhất sáu bước bên mua theo trình tự (1,2) · mục đích thẩm định (0,6) · ít nhất năm mảng phạm vi và liên hệ tới giá/bảo đảm (1,2)."},{"id":"F3-04","ch":3,"type":"calc-essay","clo":"CLO1","marks":4,"exam":"midterm","q":"Acquirer A: EPS VND 3,000, 200m shares, share price VND 45,000. Target T: net income VND 240bn, 80m shares, unaffected price VND 25,000. A offers a 30% premium, financed 50% in shares and 50% in cash borrowed at 5% after tax. After-tax synergies are VND 60bn. Compute the offer price, purchase equity value, new shares, interest, pro forma EPS and the accretion/dilution, then interpret the result.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Offer price = 25,000 × 1.30 = \u003cb>VND 32,500\u003c/b>. Purchase equity value = 32,500 × 80m = \u003cb>VND 2,600bn\u003c/b>.\u003c/p>\u003cp>Share consideration = 50% × 2,600 = 1,300bn → new shares = 1,300bn ÷ 45,000 = \u003cb>28.89m\u003c/b>.\u003cbr>Cash consideration = 1,300bn → after-tax interest = 5% × 1,300 = \u003cb>VND 65bn\u003c/b>.\u003c/p>\u003cp>Acquirer net income = 3,000 × 200m = \u003cb>VND 600bn\u003c/b>.\u003cbr>Pro forma NI = 600 + 240 + 60 − 65 = \u003cb>VND 835bn\u003c/b>.\u003cbr>Pro forma shares = 200 + 28.89 = \u003cb>228.89m\u003c/b>.\u003cbr>Pro forma EPS = 835bn ÷ 228.89m = \u003cb>VND 3,648\u003c/b>.\u003cbr>Accretion = 3,648 ÷ 3,000 − 1 = \u003cb>+21.6% accretive\u003c/b>.\u003c/p>\u003cp>\u003cb>Interpretation.\u003c/b> The deal is strongly accretive. Check why: A trades at a P/E of 45,000 ÷ 3,000 = \u003cb>15.0×\u003c/b>, while it pays 2,600bn ÷ 240bn = \u003cb>10.8×\u003c/b> for the target's earnings. Because A issues shares valued at a higher multiple than the earnings it buys, the share leg is accretive on its own; cheap after-tax debt at 5% against a target earnings yield of about 9.2% adds further accretion, and the synergies add more. The result is robust — but note that accretion is not the same as value creation: if the 30% premium exceeds the present value of the synergies, the deal can be EPS-accretive and still destroy value.\u003c/p>","rubric":"Offer price and purchase value (0.7) · new shares and interest (0.8) · pro forma NI, shares and EPS (1.2) · accretion % (0.5) · P/E interpretation and the accretion≠value caveat (0.8).","qVi":"Bên thâu tóm A: EPS 3.000 đồng, 200 triệu cổ phần, giá cổ phiếu 45.000 đồng. Công ty mục tiêu T: lợi nhuận ròng 240 tỷ đồng, 80 triệu cổ phần, giá chưa bị ảnh hưởng 25.000 đồng. A chào mức thặng dư 30%, tài trợ 50% bằng cổ phần và 50% bằng tiền mặt đi vay lãi suất 5% sau thuế. Cộng hưởng sau thuế là 60 tỷ đồng. Tính giá chào mua, giá trị vốn chủ mua lại, cổ phần mới, lãi vay, EPS hợp nhất và mức tăng/giảm lãi, rồi diễn giải kết quả.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Giá chào mua = 25.000 × 1,30 = \u003cb>32.500 đồng\u003c/b>. Giá trị vốn chủ mua lại = 32.500 × 80 triệu = \u003cb>2.600 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Thanh toán bằng cổ phần = 50% × 2.600 = 1.300 tỷ → cổ phần mới = 1.300 tỷ ÷ 45.000 = \u003cb>28,89 triệu\u003c/b>.\u003cbr>Thanh toán bằng tiền mặt = 1.300 tỷ → lãi vay sau thuế = 5% × 1.300 = \u003cb>65 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Lợi nhuận ròng của bên thâu tóm = 3.000 × 200 triệu = \u003cb>600 tỷ đồng\u003c/b>.\u003cbr>Lợi nhuận ròng hợp nhất = 600 + 240 + 60 − 65 = \u003cb>835 tỷ đồng\u003c/b>.\u003cbr>Cổ phần hợp nhất = 200 + 28,89 = \u003cb>228,89 triệu\u003c/b>.\u003cbr>EPS hợp nhất = 835 tỷ ÷ 228,89 triệu = \u003cb>3.648 đồng\u003c/b>.\u003cbr>Mức tăng lãi = 3.648 ÷ 3.000 − 1 = \u003cb>+21,6% tăng lãi\u003c/b>.\u003c/p>\u003cp>\u003cb>Diễn giải.\u003c/b> Thương vụ tăng lãi mạnh. Kiểm chứng vì sao: A giao dịch ở P/E 45.000 ÷ 3.000 = \u003cb>15,0×\u003c/b>, trong khi trả 2.600 ÷ 240 = \u003cb>10,8×\u003c/b> cho lợi nhuận của công ty mục tiêu. Vì A phát hành cổ phần được định giá ở bội số cao hơn bội số của lợi nhuận nó mua, riêng phần cổ phần đã làm tăng lãi; nợ rẻ sau thuế ở 5% so với tỷ suất lợi nhuận trên giá của công ty mục tiêu khoảng 9,2% bổ sung thêm mức tăng lãi, và cộng hưởng cộng thêm nữa. Kết quả là vững chắc — nhưng lưu ý tăng lãi không đồng nghĩa với tạo giá trị: nếu mức thặng dư 30% vượt giá trị hiện tại của các cộng hưởng, thương vụ vẫn có thể làm tăng EPS mà vẫn phá hủy giá trị.\u003c/p>","rubricVi":"Giá chào mua và giá trị mua lại (0,7) · cổ phần mới và lãi vay (0,8) · lợi nhuận ròng, cổ phần và EPS hợp nhất (1,2) · % tăng lãi (0,5) · diễn giải P/E và lưu ý tăng lãi ≠ giá trị (0,8)."},{"id":"F3-05","ch":3,"type":"essay","clo":"CLO1","marks":3,"exam":"final","q":"Explain the structure of LBO financing, ranking the instruments by seniority, and state the criteria for selecting a suitable LBO target.","guide":"\u003cp>\u003cb>Model answer — capital structure, most senior first.\u003c/b> (1) \u003cb>Senior secured bank debt\u003c/b>: \u003ci>Term Loan A\u003c/i>, amortising, shorter maturity, held by banks; \u003ci>Term Loan B\u003c/i>, longer maturity with nominal amortisation and a bullet repayment, held largely by institutional investors. (2) \u003cb>Second-lien debt\u003c/b>, secured but ranking behind the first lien on enforcement. (3) \u003cb>High-yield bonds\u003c/b>, unsecured or subordinated, longer-dated, covenant-light and callable, carrying a high coupon. (4) \u003cb>Mezzanine / PIK\u003c/b>, subordinated, more expensive, often with warrants or payment-in-kind interest giving equity upside. (5) \u003cb>Sponsor equity\u003c/b>, the residual claim. Cost rises as seniority falls, so the optimal structure maximises leverage subject to the cash flow comfortably servicing it.\u003c/p>\u003cp>\u003cb>Target selection criteria:\u003c/b> strong and predictable free cash flow (the first test, since the debt is repaid from it); a leading and defensible market position; identifiable growth opportunity; scope to improve operating efficiency; \u003cb>low capital-expenditure\u003c/b> requirements so cash is free for debt service; a solid, tangible asset base usable as collateral and providing exit optionality; a proven management team; and a market valuation that is undemanding relative to intrinsic value.\u003c/p>","rubric":"Five layers ranked correctly with A/B distinction (1.5) · cost-seniority relationship (0.4) · at least six target criteria (1.1).","qVi":"Giải thích cấu trúc tài trợ của một thương vụ LBO, xếp hạng các công cụ theo thứ tự ưu tiên, và nêu tiêu chí lựa chọn một công ty mục tiêu LBO phù hợp.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — cấu trúc vốn, ưu tiên cao nhất trước.\u003c/b> (1) \u003cb>Nợ ngân hàng có bảo đảm ưu tiên cao\u003c/b>: \u003ci>Khoản vay kỳ hạn A\u003c/i>, trả dần, kỳ hạn ngắn hơn, do ngân hàng nắm giữ; \u003ci>Khoản vay kỳ hạn B\u003c/i>, kỳ hạn dài hơn với mức trả dần danh nghĩa và một khoản trả gộp cuối kỳ, phần lớn do nhà đầu tư tổ chức nắm giữ. (2) \u003cb>Nợ thế chấp hạng hai\u003c/b>, có bảo đảm nhưng xếp sau hạng nhất khi xử lý tài sản. (3) \u003cb>Trái phiếu lợi suất cao\u003c/b>, không bảo đảm hoặc thứ cấp, kỳ hạn dài hơn, ít điều khoản ràng buộc và có thể mua lại, mang lãi suất coupon cao. (4) \u003cb>Nợ trung gian (mezzanine) / PIK\u003c/b>, thứ cấp, đắt hơn, thường kèm chứng quyền hoặc lãi trả bằng hiện vật cho phần lợi ích vốn chủ. (5) \u003cb>Vốn chủ của nhà tài trợ\u003c/b>, quyền đòi còn lại. Chi phí tăng khi thứ tự ưu tiên giảm, nên cấu trúc tối ưu tối đa hóa đòn bẩy với điều kiện dòng tiền phục vụ được nó một cách thoải mái.\u003c/p>\u003cp>\u003cb>Tiêu chí lựa chọn công ty mục tiêu:\u003c/b> dòng tiền tự do mạnh và dự đoán được (phép thử đầu tiên, vì nợ được trả từ đó); vị thế thị trường dẫn đầu và bảo vệ được; cơ hội tăng trưởng nhận diện được; dư địa cải thiện hiệu quả vận hành; \u003cb>nhu cầu chi tiêu vốn thấp\u003c/b> để tiền được dành cho trả nợ; nền tài sản hữu hình vững chắc dùng làm tài sản bảo đảm và tạo lựa chọn thoái vốn; đội ngũ quản lý đã được kiểm chứng; và mức định giá thị trường không quá cao so với giá trị nội tại.\u003c/p>","rubricVi":"Năm tầng được xếp đúng thứ tự với phân biệt A/B (1,5) · quan hệ chi phí – thứ tự ưu tiên (0,4) · ít nhất sáu tiêu chí lựa chọn (1,1)."},{"id":"F3-06","ch":3,"type":"case","clo":"CLO1","marks":4,"exam":"final","q":"A sponsor acquires a company for 9.0× EBITDA of VND 500bn, funded with 5.0× net debt. Over five years EBITDA grows to VND 700bn and net debt is reduced to VND 1,500bn. It exits at 8.5×. Compute entry equity, exit equity, the money multiple and the approximate IRR, and analyse the sources of the return.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Entry:\u003c/b> EV = 9.0 × 500 = \u003cb>VND 4,500bn\u003c/b>; net debt = 5.0 × 500 = \u003cb>VND 2,500bn\u003c/b>; sponsor equity = 4,500 − 2,500 = \u003cb>VND 2,000bn\u003c/b>.\u003c/p>\u003cp>\u003cb>Exit:\u003c/b> EV = 8.5 × 700 = \u003cb>VND 5,950bn\u003c/b>; net debt = 1,500bn; equity = 5,950 − 1,500 = \u003cb>VND 4,450bn\u003c/b>.\u003c/p>\u003cp>\u003cb>Returns:\u003c/b> money multiple = 4,450 ÷ 2,000 = \u003cb>2.23×\u003c/b>. IRR = 2.23^(1/5) − 1 ≈ \u003cb>17.4%\u003c/b>.\u003c/p>\u003cp>\u003cb>Sources of return.\u003c/b> Three levers, and here only two are positive. \u003ci>Debt paydown\u003c/i>: net debt fell from 2,500 to 1,500, transferring VND 1,000bn of value directly to equity — the largest single contributor. \u003ci>EBITDA growth\u003c/i>: earnings rose 40% from 500 to 700, worth roughly 200 × 8.5 = VND 1,700bn of enterprise value at the exit multiple. \u003ci>Multiple change\u003c/i>: the exit multiple \u003cb>contracted\u003c/b> from 9.0× to 8.5×, costing about 0.5 × 700 = VND 350bn of enterprise value — a drag.\u003c/p>\u003cp>\u003cb>Interpretation.\u003c/b> This is a robust outcome precisely because it does \u003ci>not\u003c/i> depend on multiple expansion: the return is earned through operational improvement and deleveraging, both within the sponsor's control, and survives a half-turn of multiple contraction. A thesis that requires the exit multiple to exceed the entry multiple is a bet on market conditions rather than on management, and should be stress-tested for a downside case.\u003c/p>","rubric":"Entry equity (0.7) · exit equity (0.8) · multiple and IRR (0.9) · three return levers quantified incl. the negative multiple effect (1.2) · quality-of-return judgement (0.4).","qVi":"Một nhà tài trợ thâu tóm một công ty với bội số 9,0× EBITDA 500 tỷ đồng, tài trợ với nợ ròng 5,0×. Sau năm năm EBITDA tăng lên 700 tỷ và nợ ròng giảm còn 1.500 tỷ. Nhà tài trợ thoái vốn ở bội số 8,5×. Tính vốn chủ lúc vào, vốn chủ lúc ra, bội số tiền và IRR xấp xỉ, và phân tích các nguồn của lợi nhuận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Lúc vào:\u003c/b> EV = 9,0 × 500 = \u003cb>4.500 tỷ đồng\u003c/b>; nợ ròng = 5,0 × 500 = \u003cb>2.500 tỷ đồng\u003c/b>; vốn chủ của nhà tài trợ = 4.500 − 2.500 = \u003cb>2.000 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Lúc ra:\u003c/b> EV = 8,5 × 700 = \u003cb>5.950 tỷ đồng\u003c/b>; nợ ròng = 1.500 tỷ; vốn chủ = 5.950 − 1.500 = \u003cb>4.450 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Lợi nhuận:\u003c/b> bội số tiền = 4.450 ÷ 2.000 = \u003cb>2,23×\u003c/b>. IRR = 2,23^(1/5) − 1 ≈ \u003cb>17,4%\u003c/b>.\u003c/p>\u003cp>\u003cb>Các nguồn của lợi nhuận.\u003c/b> Ba đòn bẩy, và ở đây chỉ hai đòn bẩy là dương. \u003ci>Trả nợ\u003c/i>: nợ ròng giảm từ 2.500 xuống 1.500, chuyển 1.000 tỷ giá trị trực tiếp sang vốn chủ — đóng góp đơn lẻ lớn nhất. \u003ci>Tăng trưởng EBITDA\u003c/i>: lợi nhuận tăng 40% từ 500 lên 700, tương đương khoảng 200 × 8,5 = 1.700 tỷ giá trị doanh nghiệp theo bội số lúc ra. \u003ci>Thay đổi bội số\u003c/i>: bội số lúc ra \u003cb>co lại\u003c/b> từ 9,0× xuống 8,5×, làm mất khoảng 0,5 × 700 = 350 tỷ giá trị doanh nghiệp — một lực cản.\u003c/p>\u003cp>\u003cb>Diễn giải.\u003c/b> Đây là một kết quả vững chắc chính vì nó \u003ci>không\u003c/i> phụ thuộc vào việc mở rộng bội số: lợi nhuận được kiếm qua cải thiện vận hành và giảm nợ, cả hai đều trong tầm kiểm soát của nhà tài trợ, và vẫn trụ được qua nửa vòng co bội số. Một luận điểm đòi hỏi bội số lúc ra phải vượt bội số lúc vào là một cược vào điều kiện thị trường chứ không phải vào ban điều hành, và nên được kiểm tra sức chịu đựng cho kịch bản xấu.\u003c/p>","rubricVi":"Vốn chủ lúc vào (0,7) · vốn chủ lúc ra (0,8) · bội số và IRR (0,9) · ba đòn bẩy được định lượng gồm tác động âm của bội số (1,2) · phán đoán về chất lượng lợi nhuận (0,4)."},{"id":"F4-01","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Distinguish open-end funds, closed-end funds and ETFs, and explain why a closed-end fund's price can diverge from its NAV.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> An \u003cb>open-end fund\u003c/b> continuously issues and redeems units at NAV, so the number of units and the fund's size vary with investor flows and the manager must hold liquidity to meet redemptions. A \u003cb>closed-end fund\u003c/b> has a fixed number of units traded on the secondary market with \u003cb>no redemption obligation\u003c/b>, so it can hold illiquid assets and remain fully invested. An \u003cb>ETF\u003c/b> is an open-end structure whose units trade intraday on an exchange.\u003c/p>\u003cp>\u003cb>Why closed-end prices diverge from NAV.\u003c/b> Because there is no mechanism to force convergence: an investor wanting to exit must sell to another investor at whatever price the market sets, not redeem at NAV. Price is therefore determined by secondary-market supply and demand, and closed-end funds frequently trade at a persistent \u003cb>discount\u003c/b> (reflecting fees, illiquidity of holdings and sentiment) or occasionally at a premium.\u003c/p>\u003cp>By contrast an ETF's price stays close to NAV because \u003cb>authorised participants\u003c/b> can create or redeem baskets in kind whenever a gap opens, arbitraging it away.\u003c/p>","rubric":"Three structures correctly distinguished (1.0) · absence of a redemption mechanism as the cause of divergence (0.6) · AP arbitrage contrast for ETFs (0.4).","qVi":"Phân biệt quỹ mở, quỹ đóng và ETF, và giải thích vì sao giá của quỹ đóng có thể lệch khỏi NAV của nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>quỹ mở\u003c/b> liên tục phát hành và mua lại chứng chỉ theo NAV, nên số chứng chỉ và quy mô quỹ thay đổi theo dòng vốn của nhà đầu tư và nhà quản lý phải giữ thanh khoản để đáp ứng việc mua lại. Một \u003cb>quỹ đóng\u003c/b> có số chứng chỉ cố định giao dịch trên thị trường thứ cấp và \u003cb>không có nghĩa vụ mua lại\u003c/b>, nên có thể nắm giữ tài sản kém thanh khoản và luôn được đầu tư đầy đủ. Một \u003cb>ETF\u003c/b> là cấu trúc quỹ mở với chứng chỉ giao dịch trong phiên trên sở giao dịch.\u003c/p>\u003cp>\u003cb>Vì sao giá quỹ đóng lệch khỏi NAV.\u003c/b> Vì không có cơ chế buộc giá hội tụ: một nhà đầu tư muốn thoát phải bán cho nhà đầu tư khác ở mức giá do thị trường ấn định, chứ không được mua lại theo NAV. Giá do đó được quyết định bởi cung cầu trên thị trường thứ cấp, và quỹ đóng thường xuyên giao dịch ở mức \u003cb>chiết khấu\u003c/b> dai dẳng (phản ánh phí, tính kém thanh khoản của các khoản nắm giữ và tâm lý thị trường) hoặc đôi khi ở mức thặng dư.\u003c/p>\u003cp>Ngược lại, giá ETF bám sát NAV vì \u003cb>thành viên lập quỹ được ủy quyền\u003c/b> có thể tạo hoặc hoàn trả các rổ chứng khoán bằng hiện vật bất cứ khi nào một khoảng chênh mở ra, kinh doanh chênh lệch giá để triệt tiêu nó.\u003c/p>","rubricVi":"Phân biệt đúng ba cấu trúc (1,0) · thiếu cơ chế mua lại là nguyên nhân của độ lệch (0,6) · so sánh với cơ chế chênh lệch giá của ETF (0,4)."},{"id":"F4-02","ch":4,"type":"essay","clo":"CLO2","marks":3,"exam":"final","q":"Describe the portfolio management process and the role of the investment policy statement, and explain the five characteristics of a good benchmark.","guide":"\u003cp>\u003cb>Model answer — the process.\u003c/b> \u003cb>Planning:\u003c/b> identify objectives and constraints — required return, risk tolerance and capacity, time horizon, liquidity needs, tax position, legal and unique circumstances — and record them in the \u003cb>investment policy statement (IPS)\u003c/b>. \u003cb>Execution:\u003c/b> strategic asset allocation, tactical tilts, security selection and trading. \u003cb>Feedback:\u003c/b> monitoring, rebalancing to target weights, and performance measurement and attribution.\u003c/p>\u003cp>\u003cb>Role of the IPS.\u003c/b> It converts the client's circumstances into a written mandate: it disciplines the manager, defines the benchmark, sets the review cycle, and is the objective standard against which both performance and suitability are later judged. It also protects the client from style drift and the manager from unfounded complaint.\u003c/p>\u003cp>\u003cb>A good benchmark is:\u003c/b> \u003ci>unambiguous\u003c/i> — constituents and weights are known; \u003ci>investable\u003c/i> — it could actually be held passively; \u003ci>measurable\u003c/i> — its return is computable at reasonable frequency; \u003ci>appropriate\u003c/i> — consistent with the manager's style and mandate; and \u003ci>specified in advance\u003c/i> — agreed before the evaluation period, not selected afterwards. A benchmark chosen retrospectively can flatter almost any manager.\u003c/p>","rubric":"Three phases with content (1.2) · IPS role incl. benchmark and evaluation standard (0.8) · five benchmark characteristics (1.0).","qVi":"Mô tả quy trình quản lý danh mục và vai trò của tuyên bố chính sách đầu tư, và giải thích năm đặc điểm của một chỉ số tham chiếu tốt.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — quy trình.\u003c/b> \u003cb>Lập kế hoạch:\u003c/b> xác định mục tiêu và ràng buộc — tỷ suất sinh lời yêu cầu, khả năng chịu đựng và năng lực chịu rủi ro, chân trời thời gian, nhu cầu thanh khoản, tình trạng thuế, hoàn cảnh pháp lý và đặc thù — và ghi lại chúng trong \u003cb>tuyên bố chính sách đầu tư (IPS)\u003c/b>. \u003cb>Thực thi:\u003c/b> phân bổ tài sản chiến lược, điều chỉnh chiến thuật, lựa chọn chứng khoán và giao dịch. \u003cb>Phản hồi:\u003c/b> giám sát, tái cân bằng về tỷ trọng mục tiêu, và đo lường hiệu quả cùng phân tích đóng góp.\u003c/p>\u003cp>\u003cb>Vai trò của IPS.\u003c/b> Nó chuyển hoàn cảnh của khách hàng thành một mệnh lệnh bằng văn bản: nó tạo kỷ luật cho nhà quản lý, xác định chỉ số tham chiếu, đặt chu kỳ rà soát, và là chuẩn mực khách quan để về sau đánh giá cả hiệu quả lẫn tính phù hợp. Nó cũng bảo vệ khách hàng khỏi sự trôi dạt phong cách và bảo vệ nhà quản lý khỏi khiếu nại thiếu căn cứ.\u003c/p>\u003cp>\u003cb>Một chỉ số tham chiếu tốt là:\u003c/b> \u003ci>rõ ràng\u003c/i> — biết được thành phần và tỷ trọng; \u003ci>có thể đầu tư\u003c/i> — thực sự có thể nắm giữ thụ động; \u003ci>đo lường được\u003c/i> — tính được lợi suất với tần suất hợp lý; \u003ci>phù hợp\u003c/i> — nhất quán với phong cách và mệnh lệnh của nhà quản lý; và \u003ci>xác định trước\u003c/i> — thống nhất trước kỳ đánh giá, không phải chọn sau. Một chỉ số tham chiếu chọn hồi tố có thể tô hồng hầu như bất kỳ nhà quản lý nào.\u003c/p>","rubricVi":"Ba giai đoạn với nội dung (1,2) · vai trò IPS gồm chỉ số tham chiếu và chuẩn đánh giá (0,8) · năm đặc điểm chỉ số tham chiếu (1,0)."},{"id":"F4-03","ch":4,"type":"calc-essay","clo":"CLO2","marks":3,"exam":"final","q":"Fund X returned 16% with volatility 20% and tracking error 6% against a benchmark that returned 11%. The risk-free rate is 4%. (a) Compute the Sharpe ratio and the information ratio. (b) Explain what each measures and when each is the appropriate criterion.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Sharpe = (16 − 4) ÷ 20 = 12 ÷ 20 = \u003cb>0.60\u003c/b>. Information ratio = (16 − 11) ÷ 6 = 5 ÷ 6 = \u003cb>0.83\u003c/b>.\u003c/p>\u003cp>(b) The \u003cb>Sharpe ratio\u003c/b> measures excess return over the \u003ci>risk-free rate\u003c/i> per unit of \u003cb>total risk\u003c/b> (standard deviation). It is the appropriate criterion when the portfolio represents the investor's \u003cb>entire wealth\u003c/b>, because then total volatility — systematic and specific alike — is what the investor actually experiences.\u003c/p>\u003cp>The \u003cb>information ratio\u003c/b> measures \u003cb>active return\u003c/b> against the benchmark per unit of \u003cb>tracking error\u003c/b>, the standard deviation of that active return. It is the appropriate criterion when the portfolio is one \u003cb>mandate within a larger allocation\u003c/b>, because the investor has already chosen the asset class through the benchmark and is paying the manager only for deviation from it. It therefore isolates skill rather than market exposure.\u003c/p>\u003cp>Here an IR of 0.83 is strong, indicating the manager adds meaningful value per unit of active risk. A fund can have a good Sharpe ratio simply by holding a rising market, so the two measures answer different questions and can rank managers differently.\u003c/p>","rubric":"(a) both computed correctly (1.0) · definitions incl. the correct risk denominator (1.0) · correct circumstances for each and the ranking-difference insight (1.0).","qVi":"Quỹ X đạt lợi suất 16% với độ biến động 20% và sai số theo dõi 6% so với một chỉ số tham chiếu đạt 11%. Lãi suất phi rủi ro là 4%. (a) Tính tỷ số Sharpe và tỷ số thông tin. (b) Giải thích mỗi tỷ số đo điều gì và khi nào mỗi tỷ số là tiêu chí phù hợp.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Sharpe = (16 − 4) ÷ 20 = 12 ÷ 20 = \u003cb>0,60\u003c/b>. Tỷ số thông tin = (16 − 11) ÷ 6 = 5 ÷ 6 = \u003cb>0,83\u003c/b>.\u003c/p>\u003cp>(b) \u003cb>Tỷ số Sharpe\u003c/b> đo lợi suất vượt trội trên \u003ci>lãi suất phi rủi ro\u003c/i> trên mỗi đơn vị \u003cb>rủi ro tổng\u003c/b> (độ lệch chuẩn). Nó là tiêu chí phù hợp khi danh mục đại diện cho \u003cb>toàn bộ tài sản\u003c/b> của nhà đầu tư, vì khi đó độ biến động tổng — cả hệ thống lẫn riêng biệt — mới là thứ nhà đầu tư thực sự trải nghiệm.\u003c/p>\u003cp>\u003cb>Tỷ số thông tin\u003c/b> đo \u003cb>lợi suất chủ động\u003c/b> so với chỉ số tham chiếu trên mỗi đơn vị \u003cb>sai số theo dõi\u003c/b>, tức độ lệch chuẩn của lợi suất chủ động đó. Nó là tiêu chí phù hợp khi danh mục là \u003cb>một mệnh lệnh trong một phân bổ lớn hơn\u003c/b>, vì nhà đầu tư đã chọn lớp tài sản thông qua chỉ số tham chiếu và chỉ trả tiền cho nhà quản lý vì phần lệch khỏi nó. Nó do đó tách riêng kỹ năng thay vì mức phơi nhiễm thị trường.\u003c/p>\u003cp>Ở đây IR 0,83 là mạnh, cho thấy nhà quản lý tạo thêm giá trị đáng kể trên mỗi đơn vị rủi ro chủ động. Một quỹ có thể có tỷ số Sharpe tốt đơn giản nhờ nắm giữ trong một thị trường đi lên, nên hai thước đo trả lời những câu hỏi khác nhau và có thể xếp hạng các nhà quản lý khác nhau.\u003c/p>","rubricVi":"(a) tính đúng cả hai (1,0) · định nghĩa gồm đúng mẫu số rủi ro (1,0) · hoàn cảnh phù hợp cho mỗi tỷ số và nhận thức về khác biệt xếp hạng (1,0)."},{"id":"F4-04","ch":4,"type":"essay","clo":"CLO2","marks":3,"exam":"final","q":"Describe the operations of fund management: raising capital, investing it, and the supporting arrangements — with particular attention to the role of the supervisory bank and NAV.","guide":"\u003cp>\u003cb>Model answer — raising capital.\u003c/b> Design the fund (objective, strategy, benchmark, fee schedule, term); obtain regulatory approval and appoint the \u003cb>supervisory bank / custodian\u003c/b>; prepare the prospectus and fund charter; and distribute units through the manager's channels, securities companies, banks or advisors. A public fund must meet minimum capital and minimum investor-number thresholds to be established.\u003c/p>\u003cp>\u003cb>Investing.\u003c/b> Apply the mandate and benchmark; set strategic asset allocation and tactical tilts; select securities on research; execute with best execution and cost control; observe diversification and regulatory limits such as single-issuer caps and restrictions on borrowing; then monitor and rebalance.\u003c/p>\u003cp>\u003cb>Supporting arrangements.\u003c/b> The \u003cb>supervisory bank\u003c/b> holds the fund's assets independently of the manager and monitors compliance with the charter — separating asset safekeeping from investment decision-making, which is the principal structural protection for investors. \u003cb>NAV per unit = (total assets − total liabilities) ÷ units outstanding\u003c/b>, normally struck daily; it determines subscription and redemption prices and is the base for fee calculation. Add reporting to investors and the regulator, audited annual accounts, and fee collection (management fee, plus performance fee subject to hurdle and high-water mark).\u003c/p>","rubric":"Raising capital incl. custodian appointment and prospectus (1.0) · investment process with limits (0.9) · custodian's protective role and correct NAV formula and use (1.1).","qVi":"Mô tả các nghiệp vụ quản lý quỹ: huy động vốn, đầu tư vốn, và các thu xếp hỗ trợ — đặc biệt chú ý vai trò của ngân hàng giám sát và NAV.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — huy động vốn.\u003c/b> Thiết kế quỹ (mục tiêu, chiến lược, chỉ số tham chiếu, biểu phí, thời hạn); xin phê duyệt của cơ quan quản lý và chỉ định \u003cb>ngân hàng giám sát / lưu ký\u003c/b>; chuẩn bị bản cáo bạch và điều lệ quỹ; và phân phối chứng chỉ quỹ qua kênh của công ty quản lý, công ty chứng khoán, ngân hàng hoặc nhà tư vấn. Một quỹ đại chúng phải đạt ngưỡng vốn tối thiểu và số nhà đầu tư tối thiểu để được thành lập.\u003c/p>\u003cp>\u003cb>Đầu tư.\u003c/b> Áp dụng mệnh lệnh đầu tư và chỉ số tham chiếu; đặt phân bổ tài sản chiến lược và điều chỉnh chiến thuật; lựa chọn chứng khoán dựa trên nghiên cứu; thực hiện giao dịch chú trọng thực hiện tốt nhất và kiểm soát chi phí; tuân thủ đa dạng hóa và các giới hạn theo quy định như trần với một tổ chức phát hành và hạn chế vay nợ; rồi giám sát và tái cân bằng.\u003c/p>\u003cp>\u003cb>Các thu xếp hỗ trợ.\u003c/b> \u003cb>Ngân hàng giám sát\u003c/b> nắm giữ tài sản của quỹ độc lập với công ty quản lý và giám sát việc tuân thủ điều lệ — tách bạch việc bảo quản tài sản khỏi việc ra quyết định đầu tư, đây là cơ chế bảo vệ cấu trúc chính cho nhà đầu tư. \u003cb>NAV mỗi chứng chỉ = (tổng tài sản − tổng nợ phải trả) ÷ số chứng chỉ đang lưu hành\u003c/b>, thường được xác định hằng ngày; nó quyết định giá mua và mua lại và là cơ sở tính phí. Bổ sung báo cáo cho nhà đầu tư và cơ quan quản lý, báo cáo thường niên đã kiểm toán, và việc thu phí (phí quản lý, cộng phí hiệu quả tuân theo ngưỡng và mốc cao nhất).\u003c/p>","rubricVi":"Huy động vốn gồm chỉ định ngân hàng lưu ký và bản cáo bạch (1,0) · quy trình đầu tư kèm các giới hạn (0,9) · vai trò bảo vệ của ngân hàng lưu ký và công thức NAV cùng cách dùng đúng (1,1)."},{"id":"F4-05","ch":4,"type":"case","clo":"CLO2","marks":3,"exam":"final","q":"A relationship manager recommends an in-house fund that pays the bank a distribution commission, to a 68-year-old retiree seeking capital preservation. Analyse the issues and state what the manager should have done.","guide":"\u003cp>\u003cb>Model answer — issues.\u003c/b> \u003cb>(1) Suitability.\u003c/b> The client's stated objective is capital preservation and, at 68 and retired, both risk tolerance and risk \u003ci>capacity\u003c/i> are low: a short horizon and no future earned income to recover losses. Recommending an equity-oriented or otherwise volatile fund is unsuitable regardless of its quality.\u003c/p>\u003cp>\u003cb>(2) Conflict of interest.\u003c/b> The bank earns a distribution commission on its own product, so the recommendation may be driven by the bank's revenue rather than the client's need — the classic mis-selling pattern and the sector's principal regulatory exposure.\u003c/p>\u003cp>\u003cb>(3) Disclosure.\u003c/b> The commission and the in-house nature of the product must be disclosed so the client can assess the advice.\u003c/p>\u003cp>\u003cb>(4) Fiduciary and reputational risk.\u003c/b> Mis-selling exposes the bank to compensation claims, regulatory sanction and severe reputational damage — in Vietnam a live issue in the distribution of insurance and corporate bonds through banking channels.\u003c/p>\u003cp>\u003cb>What should have happened.\u003c/b> Conduct and document a full \u003cb>client profiling\u003c/b> exercise covering assets, liabilities, income, goals, horizon, and both risk tolerance and capacity; draft an \u003cb>investment policy statement\u003c/b> recording a capital-preservation objective and its constraints; recommend products \u003cb>consistent with that IPS\u003c/b>, comparing in-house and third-party options on an objective basis; \u003cb>disclose in writing\u003c/b> any commission and the in-house relationship; obtain informed consent; and schedule periodic review. Where the only suitable products pay the bank nothing, that must not change the recommendation.\u003c/p>","rubric":"Suitability incl. tolerance vs capacity (0.9) · conflict and disclosure (0.9) · regulatory/reputational consequence (0.4) · concrete corrective process incl. profiling, IPS and written disclosure (0.8).","qVi":"Một chuyên viên quan hệ khách hàng khuyến nghị một quỹ nội bộ có trả hoa hồng phân phối cho ngân hàng, cho một người về hưu 68 tuổi có mục tiêu bảo toàn vốn. Phân tích các vấn đề và nêu điều chuyên viên lẽ ra phải làm.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các vấn đề.\u003c/b> \u003cb>(1) Tính phù hợp.\u003c/b> Mục tiêu khách hàng nêu rõ là bảo toàn vốn và, ở tuổi 68 đã nghỉ hưu, cả khả năng chịu đựng lẫn \u003ci>năng lực\u003c/i> chịu rủi ro đều thấp: chân trời ngắn và không còn thu nhập từ lao động trong tương lai để bù đắp tổn thất. Khuyến nghị một quỹ thiên về cổ phiếu hoặc biến động cao là không phù hợp bất kể chất lượng của nó.\u003c/p>\u003cp>\u003cb>(2) Xung đột lợi ích.\u003c/b> Ngân hàng hưởng hoa hồng phân phối trên sản phẩm của chính mình, nên khuyến nghị có thể xuất phát từ doanh thu của ngân hàng chứ không phải nhu cầu của khách hàng — mô hình bán sai kinh điển và là rủi ro pháp lý chính của ngành.\u003c/p>\u003cp>\u003cb>(3) Công bố thông tin.\u003c/b> Khoản hoa hồng và tính chất sản phẩm nội bộ phải được công bố để khách hàng đánh giá được lời khuyên.\u003c/p>\u003cp>\u003cb>(4) Rủi ro tín thác và danh tiếng.\u003c/b> Bán sai khiến ngân hàng đối mặt yêu cầu bồi thường, chế tài của cơ quan quản lý và tổn hại danh tiếng nghiêm trọng — tại Việt Nam đây là vấn đề nóng trong việc phân phối bảo hiểm và trái phiếu doanh nghiệp qua kênh ngân hàng.\u003c/p>\u003cp>\u003cb>Điều lẽ ra phải làm.\u003c/b> Thực hiện và ghi chép một quy trình \u003cb>lập hồ sơ khách hàng\u003c/b> đầy đủ về tài sản, nợ, thu nhập, mục tiêu, chân trời, và cả khả năng chịu đựng lẫn năng lực chịu rủi ro; soạn một \u003cb>tuyên bố chính sách đầu tư\u003c/b> ghi rõ mục tiêu bảo toàn vốn và các ràng buộc; khuyến nghị các sản phẩm \u003cb>nhất quán với IPS đó\u003c/b>, so sánh phương án nội bộ và bên thứ ba trên cơ sở khách quan; \u003cb>công bố bằng văn bản\u003c/b> mọi hoa hồng và quan hệ nội bộ; lấy sự đồng thuận trên cơ sở thông tin đầy đủ; và lên lịch rà soát định kỳ. Khi các sản phẩm phù hợp duy nhất không mang lại gì cho ngân hàng, điều đó không được làm thay đổi khuyến nghị.\u003c/p>","rubricVi":"Tính phù hợp gồm khả năng chịu đựng so với năng lực (0,9) · xung đột và công bố (0,9) · hệ quả pháp lý/danh tiếng (0,4) · quy trình khắc phục cụ thể gồm lập hồ sơ, IPS và công bố bằng văn bản (0,8)."},{"id":"F5-01","ch":5,"type":"essay","clo":"CLO2","marks":3,"exam":"final","q":"Explain the framework of fundamental analysis: PESTEL, Porter's five forces, the industry life cycle and SWOT, and how they connect to a valuation.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Fundamental analysis proceeds from the general to the specific — economy, then industry, then company.\u003c/p>\u003cp>\u003cb>PESTEL\u003c/b> examines the external macro-environment: \u003ci>Political, Economic, Social, Technological, Environmental and Legal\u003c/i> factors shaping the industry's conditions.\u003c/p>\u003cp>\u003cb>Porter's five forces\u003c/b> assess the structural profitability of the industry: rivalry among existing competitors, threat of new entrants, threat of substitutes, bargaining power of buyers and bargaining power of suppliers. High fixed costs, undifferentiated products and many similar-sized competitors intensify rivalry and compress margins.\u003c/p>\u003cp>\u003cb>The industry life cycle\u003c/b> — pioneering/growth, maturity, decline — determines the pattern of growth, reinvestment and cash generation. Growth-stage industries expand quickly but consume cash; mature industries generate stable free cash flow.\u003c/p>\u003cp>\u003cb>SWOT\u003c/b> then positions the individual company: \u003ci>Strengths and Weaknesses\u003c/i> are internal, \u003ci>Opportunities and Threats\u003c/i> external.\u003c/p>\u003cp>\u003cb>Connection to valuation.\u003c/b> These frameworks are not decorative: they supply and discipline the \u003cb>assumptions\u003c/b> in the model. Porter and the life cycle justify the revenue growth rate and the sustainable margin; PESTEL flags regulatory or tax changes affecting cash flow; SWOT and competitive advantage determine how long any excess return can persist, which drives the fade period and the \u003cb>terminal growth rate\u003c/b>. A DCF whose assumptions contradict the industry analysis is not a valuation but an arithmetic exercise.\u003c/p>","rubric":"PESTEL expanded (0.6) · five forces named (0.7) · life cycle stages and cash implications (0.6) · SWOT internal/external (0.4) · explicit link to model assumptions and terminal growth (0.7).","qVi":"Giải thích khung phân tích cơ bản: PESTEL, năm lực lượng của Porter, chu kỳ sống của ngành và SWOT, và chúng kết nối với một cuộc định giá ra sao.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Phân tích cơ bản đi từ tổng quát tới cụ thể — nền kinh tế, rồi ngành, rồi doanh nghiệp.\u003c/p>\u003cp>\u003cb>PESTEL\u003c/b> xem xét môi trường vĩ mô bên ngoài: các yếu tố \u003ci>Chính trị, Kinh tế, Xã hội, Công nghệ, Môi trường và Pháp lý\u003c/i> định hình điều kiện của ngành.\u003c/p>\u003cp>\u003cb>Năm lực lượng của Porter\u003c/b> đánh giá khả năng sinh lời mang tính cấu trúc của ngành: cạnh tranh giữa các đối thủ hiện hữu, mối đe dọa từ đối thủ mới gia nhập, mối đe dọa từ sản phẩm thay thế, sức mạnh thương lượng của người mua và sức mạnh thương lượng của nhà cung cấp. Chi phí cố định cao, sản phẩm không khác biệt và nhiều đối thủ cùng cỡ làm cạnh tranh gay gắt hơn và nén biên lợi nhuận.\u003c/p>\u003cp>\u003cb>Chu kỳ sống của ngành\u003c/b> — tiên phong/tăng trưởng, bão hòa, suy thoái — quyết định hình thái tăng trưởng, tái đầu tư và khả năng sinh tiền. Các ngành ở giai đoạn tăng trưởng mở rộng nhanh nhưng ngốn tiền; các ngành bão hòa tạo dòng tiền tự do ổn định.\u003c/p>\u003cp>\u003cb>SWOT\u003c/b> sau đó định vị từng doanh nghiệp: \u003ci>Điểm mạnh và Điểm yếu\u003c/i> là bên trong, \u003ci>Cơ hội và Thách thức\u003c/i> là bên ngoài.\u003c/p>\u003cp>\u003cb>Kết nối với định giá.\u003c/b> Các khung này không phải để trang trí: chúng cung cấp và tạo kỷ luật cho các \u003cb>giả định\u003c/b> trong mô hình. Porter và chu kỳ sống biện minh cho tốc độ tăng trưởng doanh thu và biên lợi nhuận bền vững; PESTEL báo hiệu các thay đổi pháp lý hoặc thuế ảnh hưởng tới dòng tiền; SWOT và lợi thế cạnh tranh quyết định lợi nhuận vượt trội có thể duy trì bao lâu, thứ dẫn dắt giai đoạn suy giảm dần và \u003cb>tốc độ tăng trưởng cuối kỳ\u003c/b>. Một mô hình DCF có các giả định mâu thuẫn với phân tích ngành không phải là một cuộc định giá mà chỉ là một bài tập số học.\u003c/p>","rubricVi":"PESTEL được triển khai đầy đủ (0,6) · nêu tên năm lực lượng (0,7) · các giai đoạn chu kỳ sống và hàm ý dòng tiền (0,6) · SWOT bên trong/bên ngoài (0,4) · liên hệ tường minh tới giả định mô hình và tăng trưởng cuối kỳ (0,7)."},{"id":"F5-02","ch":5,"type":"calc-essay","clo":"CLO2","marks":3,"exam":"final","q":"A company earns net income of VND 300bn on revenue of VND 2,500bn, with assets of VND 3,000bn and equity of VND 1,200bn. (a) Compute net margin, asset turnover, the equity multiplier and ROE using DuPont. (b) Explain what the decomposition tells management about the source of its returns.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Net margin = 300 ÷ 2,500 = \u003cb>12.0%\u003c/b>. Asset turnover = 2,500 ÷ 3,000 = \u003cb>0.833×\u003c/b>. Equity multiplier = 3,000 ÷ 1,200 = \u003cb>2.5×\u003c/b>.\u003cbr>ROE = 12.0% × 0.833 × 2.5 = \u003cb>25.0%\u003c/b> (check: 300 ÷ 1,200 = 25.0% ✓).\u003c/p>\u003cp>(b) DuPont separates ROE into \u003cb>profitability\u003c/b> (net margin), \u003cb>efficiency\u003c/b> (asset turnover) and \u003cb>leverage\u003c/b> (equity multiplier). Here the 25% ROE is respectable, but the decomposition shows it is being produced by a \u003ci>combination\u003c/i> of a solid 12% margin and a substantial 2.5× leverage, while asset turnover of 0.83× is modest — each dong of assets generates only 0.83 dong of revenue.\u003c/p>\u003cp>The management implication is that improving returns further has three distinct routes with very different risk: raise margins (pricing or cost control), improve asset efficiency (working-capital management, disposal of underused assets), or increase leverage. The last raises ROE arithmetically without improving the business at all, and increases financial risk — so an analyst comparing this company with a peer at the same ROE but lower leverage should conclude that the peer's returns are of \u003cb>higher quality\u003c/b>. This is precisely why ROE should never be assessed in isolation.\u003c/p>","rubric":"(a) four figures correct with the cross-check (1.4) · (b) three components named and interpreted (0.8) · leverage-inflates-ROE / quality-of-returns insight (0.8).","qVi":"Một công ty có lợi nhuận ròng 300 tỷ đồng trên doanh thu 2.500 tỷ đồng, với tài sản 3.000 tỷ đồng và vốn chủ 1.200 tỷ đồng. (a) Tính biên lợi nhuận ròng, vòng quay tài sản, hệ số nhân vốn chủ và ROE theo DuPont. (b) Giải thích phép phân rã cho ban điều hành biết gì về nguồn gốc lợi nhuận của họ.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Biên lợi nhuận ròng = 300 ÷ 2.500 = \u003cb>12,0%\u003c/b>. Vòng quay tài sản = 2.500 ÷ 3.000 = \u003cb>0,833×\u003c/b>. Hệ số nhân vốn chủ = 3.000 ÷ 1.200 = \u003cb>2,5×\u003c/b>.\u003cbr>ROE = 12,0% × 0,833 × 2,5 = \u003cb>25,0%\u003c/b> (kiểm chứng: 300 ÷ 1.200 = 25,0% ✓).\u003c/p>\u003cp>(b) DuPont tách ROE thành \u003cb>khả năng sinh lời\u003c/b> (biên lợi nhuận ròng), \u003cb>hiệu quả\u003c/b> (vòng quay tài sản) và \u003cb>đòn bẩy\u003c/b> (hệ số nhân vốn chủ). Ở đây ROE 25% là khá tốt, nhưng phép phân rã cho thấy nó được tạo ra bởi một \u003ci>sự kết hợp\u003c/i> giữa biên lợi nhuận vững chắc 12% và đòn bẩy đáng kể 2,5×, trong khi vòng quay tài sản 0,83× là khiêm tốn — mỗi đồng tài sản chỉ tạo ra 0,83 đồng doanh thu.\u003c/p>\u003cp>Hàm ý cho ban điều hành là việc cải thiện lợi nhuận thêm nữa có ba con đường riêng biệt với mức rủi ro rất khác nhau: nâng biên lợi nhuận (định giá hoặc kiểm soát chi phí), cải thiện hiệu quả tài sản (quản lý vốn lưu động, thanh lý tài sản ít dùng), hoặc tăng đòn bẩy. Con đường cuối làm tăng ROE về mặt số học mà không cải thiện doanh nghiệp chút nào, và làm tăng rủi ro tài chính — nên một chuyên viên phân tích so sánh công ty này với một công ty cùng ROE nhưng đòn bẩy thấp hơn nên kết luận rằng lợi nhuận của công ty kia có \u003cb>chất lượng cao hơn\u003c/b>. Đây chính là lý do ROE không bao giờ nên được đánh giá một cách biệt lập.\u003c/p>","rubricVi":"(a) bốn con số đúng kèm phép kiểm chứng (1,4) · (b) nêu tên và diễn giải ba cấu phần (0,8) · nhận thức đòn bẩy thổi phồng ROE / chất lượng lợi nhuận (0,8)."},{"id":"F5-03","ch":5,"type":"calc-essay","clo":"CLO2","marks":3,"exam":"final","q":"A company will pay a dividend of VND 3,200 next year, expected to grow at 6% indefinitely. Investors require 14%. (a) Compute the value per share. (b) Recompute if growth is 9%. (c) Explain why the model is so sensitive and state its limitations.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) P0 = D1 ÷ (r − g) = 3,200 ÷ (0.14 − 0.06) = 3,200 ÷ 0.08 = \u003cb>VND 40,000\u003c/b>.\u003c/p>\u003cp>(b) P0 = 3,200 ÷ (0.14 − 0.09) = 3,200 ÷ 0.05 = \u003cb>VND 64,000\u003c/b> — a 3-percentage-point change in g raises the value by \u003cb>60%\u003c/b>.\u003c/p>\u003cp>(c) \u003cb>Why so sensitive:\u003c/b> value depends on the \u003ci>difference\u003c/i> (r − g) in the denominator. As g approaches r that difference shrinks toward zero and value rises hyperbolically; small changes in either input produce large changes in output. At g ≥ r the model breaks down entirely, returning a negative or infinite value.\u003c/p>\u003cp>\u003cb>Limitations:\u003c/b> it assumes a constant growth rate in perpetuity, which no company sustains — g must be below the long-run nominal growth rate of the economy, or the firm eventually becomes larger than the economy; it requires the company to pay dividends and assumes the payout policy is stable and reflects earning power; it assumes a constant required return; and it is unusable for firms with volatile or negative earnings, or for high-growth firms in their early stage. Remedies are multi-stage models with a fading growth rate, cross-checking against comparables, and presenting a \u003cb>sensitivity table\u003c/b> across ranges of r and g rather than a single point value.\u003c/p>","rubric":"(a) 0.6 · (b) 0.6 with the % change noted · (c) denominator sensitivity explained (0.8) · at least three genuine limitations plus remedies (1.0).","qVi":"Một công ty sẽ trả cổ tức 3.200 đồng vào năm tới, dự kiến tăng trưởng 6% vô hạn. Nhà đầu tư đòi hỏi 14%. (a) Tính giá trị mỗi cổ phần. (b) Tính lại nếu tăng trưởng là 9%. (c) Giải thích vì sao mô hình nhạy cảm đến vậy và nêu các hạn chế của nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) P0 = D1 ÷ (r − g) = 3.200 ÷ (0,14 − 0,06) = 3.200 ÷ 0,08 = \u003cb>40.000 đồng\u003c/b>.\u003c/p>\u003cp>(b) P0 = 3.200 ÷ (0,14 − 0,09) = 3.200 ÷ 0,05 = \u003cb>64.000 đồng\u003c/b> — một thay đổi 3 điểm phần trăm của g làm giá trị tăng \u003cb>60%\u003c/b>.\u003c/p>\u003cp>(c) \u003cb>Vì sao nhạy cảm đến vậy:\u003c/b> giá trị phụ thuộc vào \u003ci>hiệu số\u003c/i> (r − g) ở mẫu số. Khi g tiến gần r, hiệu số đó co về 0 và giá trị tăng theo hàm hyperbol; những thay đổi nhỏ ở một trong hai đầu vào tạo ra thay đổi lớn ở đầu ra. Khi g ≥ r, mô hình sụp đổ hoàn toàn, cho ra giá trị âm hoặc vô cực.\u003c/p>\u003cp>\u003cb>Các hạn chế:\u003c/b> nó giả định một tốc độ tăng trưởng không đổi vĩnh viễn, điều không doanh nghiệp nào duy trì được — g phải thấp hơn tốc độ tăng trưởng danh nghĩa dài hạn của nền kinh tế, nếu không doanh nghiệp rốt cuộc sẽ lớn hơn cả nền kinh tế; nó đòi hỏi công ty phải trả cổ tức và giả định chính sách chi trả ổn định và phản ánh khả năng sinh lời; nó giả định tỷ suất sinh lời đòi hỏi không đổi; và nó không dùng được với các doanh nghiệp có lợi nhuận biến động hoặc âm, hay với các doanh nghiệp tăng trưởng cao ở giai đoạn đầu. Cách khắc phục là mô hình nhiều giai đoạn với tốc độ tăng trưởng suy giảm dần, đối chiếu với công ty so sánh, và trình bày một \u003cb>bảng độ nhạy\u003c/b> theo các khoảng của r và g thay vì một giá trị điểm duy nhất.\u003c/p>","rubricVi":"(a) 0,6 · (b) 0,6 có nêu mức thay đổi % · (c) giải thích độ nhạy của mẫu số (0,8) · ít nhất ba hạn chế thực sự cùng cách khắc phục (1,0)."},{"id":"F5-04","ch":5,"type":"essay","clo":"CLO2","marks":3,"exam":"final","q":"Compare the five valuation approaches in the textbook — comparables, dividend discount, discounted cash flow, asset-based and residual income — stating when each is most appropriate.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Comparables (relative valuation).\u003c/b> Applies peer trading or transaction multiples (EV/EBITDA, P/E, P/B) to the subject's metrics. Fast, market-based and easily communicated; but it imports the market's errors and requires genuinely comparable peers. Best where a good peer set exists and a market cross-check is wanted.\u003c/p>\u003cp>\u003cb>(2) Dividend discount model.\u003c/b> Values equity as the present value of expected dividends, in the constant-growth form P0 = D1 ÷ (r − g). Appropriate for mature, stable, dividend-paying companies with a payout that reflects earning power — classically utilities and banks. Unusable for non-payers.\u003c/p>\u003cp>\u003cb>(3) Discounted cash flow.\u003c/b> Values the business on projected free cash flow: FCFF discounted at WACC gives enterprise value, FCFE at the cost of equity gives equity value. The most theoretically complete and the most flexible, but assumption-heavy and dominated by the terminal value, which typically carries 60–80% of the total.\u003c/p>\u003cp>\u003cb>(4) Asset-based valuation.\u003c/b> Values net assets at market or replacement value. Appropriate for asset-heavy businesses, investment holding companies, and liquidation or distress scenarios — situations where earnings power is a poor guide to value. It ignores intangibles and going-concern value.\u003c/p>\u003cp>\u003cb>(5) Residual income.\u003c/b> Value = book value + PV of income above a charge for the cost of equity capital. Useful where cash flows are negative or erratic and dividends are not paid, and it recognises value earlier than DCF; it depends heavily on the quality and consistency of accounting.\u003c/p>\u003cp>\u003cb>Practice:\u003c/b> no single method is authoritative. Bankers present a \u003cb>range\u003c/b> — the football field — and interrogate the differences between methods, which is usually where the real insight lies.\u003c/p>","rubric":"Five methods correctly described (1.5) · appropriate circumstances for each (1.0) · limitation of at least three (0.3) · triangulation/football-field point (0.2).","qVi":"So sánh năm phương pháp định giá trong giáo trình — công ty so sánh, chiết khấu cổ tức, chiết khấu dòng tiền, dựa trên tài sản và thu nhập thặng dư — nêu khi nào mỗi phương pháp là phù hợp nhất.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Công ty so sánh (định giá tương đối).\u003c/b> Áp dụng bội số giao dịch hoặc bội số thương vụ của nhóm so sánh (EV/EBITDA, P/E, P/B) vào chỉ tiêu của đối tượng. Nhanh, dựa trên thị trường và dễ truyền đạt; nhưng nó mang theo sai lệch của thị trường và đòi hỏi một nhóm so sánh thực sự tương đồng. Tốt nhất khi có một nhóm so sánh tốt và cần một phép đối chiếu thị trường.\u003c/p>\u003cp>\u003cb>(2) Mô hình chiết khấu cổ tức.\u003c/b> Định giá vốn chủ như giá trị hiện tại của cổ tức kỳ vọng, ở dạng tăng trưởng không đổi P0 = D1 ÷ (r − g). Phù hợp với các công ty trưởng thành, ổn định, có trả cổ tức và tỷ lệ chi trả phản ánh khả năng sinh lời — kinh điển là các công ty tiện ích và ngân hàng. Không dùng được với công ty không trả cổ tức.\u003c/p>\u003cp>\u003cb>(3) Chiết khấu dòng tiền.\u003c/b> Định giá doanh nghiệp theo dòng tiền tự do dự phóng: FCFF chiết khấu theo WACC cho ra giá trị doanh nghiệp, FCFE theo chi phí vốn chủ cho ra giá trị vốn chủ. Đầy đủ nhất về lý thuyết và linh hoạt nhất, nhưng nặng giả định và bị chi phối bởi giá trị cuối kỳ, thường chiếm 60–80% tổng giá trị.\u003c/p>\u003cp>\u003cb>(4) Định giá dựa trên tài sản.\u003c/b> Định giá tài sản ròng theo giá thị trường hoặc giá thay thế. Phù hợp với các doanh nghiệp nặng tài sản, công ty đầu tư nắm giữ, và các kịch bản thanh lý hoặc kiệt quệ — những tình huống mà khả năng sinh lời là chỉ dẫn kém về giá trị. Nó bỏ qua tài sản vô hình và giá trị hoạt động liên tục.\u003c/p>\u003cp>\u003cb>(5) Thu nhập thặng dư.\u003c/b> Giá trị = giá trị sổ sách + giá trị hiện tại của thu nhập vượt một khoản phí cho chi phí vốn chủ. Hữu ích khi dòng tiền âm hoặc thất thường và không trả cổ tức, và nó ghi nhận giá trị sớm hơn DCF; nó phụ thuộc nhiều vào chất lượng và tính nhất quán của kế toán.\u003c/p>\u003cp>\u003cb>Trong thực hành:\u003c/b> không phương pháp nào là có thẩm quyền tuyệt đối. Chuyên viên ngân hàng trình bày một \u003cb>khoảng giá trị\u003c/b> — biểu đồ sân bóng — và truy vấn sự khác biệt giữa các phương pháp, nơi thường ẩn chứa nhận thức thực sự.\u003c/p>","rubricVi":"Mô tả đúng năm phương pháp (1,5) · hoàn cảnh phù hợp cho mỗi phương pháp (1,0) · hạn chế của ít nhất ba phương pháp (0,3) · điểm về đối chiếu/biểu đồ sân bóng (0,2)."},{"id":"F5-05","ch":5,"type":"essay","clo":"CLO2","marks":3,"exam":"final","q":"Explain listing: its concept, the main conditions on Vietnamese exchanges, and a balanced assessment of its advantages and disadvantages for a company.","guide":"\u003cp>\u003cb>Model answer — concept.\u003c/b> Listing is the admission of a company's securities to trading on a stock exchange once the exchange has verified that the issuer meets its qualitative and quantitative standards. \u003ci>Initial listing\u003c/i> is first admission; \u003ci>additional listing\u003c/i> registers newly issued shares; \u003ci>re-listing\u003c/i> follows a delisting; \u003ci>delisting\u003c/i> removes securities from trading.\u003c/p>\u003cp>\u003cb>Main conditions\u003c/b> (one set for the Vietnam Exchange system under Decree 155/2020, Art. 109): paid-up charter capital and market capitalisation each of at least VND 30 billion; listing approved by the General Meeting; at least two years on UPCoM unless the company made a public offering or is an equitised SOE; ROE of at least 5% in the preceding year, profitable in both preceding years, no debts overdue by more than a year and no accumulated losses; at least 15% of voting shares held by at least 100 non-major shareholders (10% for charter capital of VND 1,000 billion or more); insiders keep 100% of their shares for six months after the first trading day and 50% for the next six; an advising securities company. The exchange's listing regulation then decides where the stock is placed.\u003c/p>\u003cp>\u003cb>Advantages:\u003c/b> access to capital on better terms and an observable market price; liquidity for existing shareholders; reputation and credibility with banks, customers and partners; shares usable as acquisition currency and for employee incentives; and a framework for succession and governance discipline.\u003c/p>\u003cp>\u003cb>Disadvantages:\u003c/b> the cost of listing and of continuing compliance; extensive and continuous disclosure, including of matters a private company would prefer to keep confidential; pressure for short-term results and exposure to market sentiment; dilution and potential loss of control, with exposure to takeover; and heightened personal responsibility and scrutiny for directors.\u003c/p>","rubric":"Concept and the four listing types (0.7) · at least five conditions with figures (1.1) · four advantages (0.6) · four disadvantages (0.6).","qVi":"Giải thích niêm yết: khái niệm, các điều kiện chính trên các sở giao dịch Việt Nam, và một đánh giá cân bằng về lợi thế và bất lợi của nó đối với một doanh nghiệp.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — khái niệm.\u003c/b> Niêm yết là việc chứng khoán của một công ty được chấp thuận đưa vào giao dịch trên một sở giao dịch sau khi sở đã xác minh rằng tổ chức phát hành đáp ứng các tiêu chuẩn định tính và định lượng của mình. \u003ci>Niêm yết lần đầu\u003c/i> là lần chấp thuận đầu tiên; \u003ci>niêm yết bổ sung\u003c/i> đăng ký cổ phần mới phát hành; \u003ci>niêm yết lại\u003c/i> diễn ra sau khi bị hủy niêm yết; \u003ci>hủy niêm yết\u003c/i> loại chứng khoán khỏi giao dịch.\u003c/p>\u003cp>\u003cb>Các điều kiện chính\u003c/b> (một bộ điều kiện chung cho hệ thống Sở Giao dịch Chứng khoán Việt Nam theo Nghị định 155/2020, Điều 109): vốn điều lệ đã góp và giá trị vốn hoá đều từ 30 tỷ đồng; Đại hội đồng cổ đông thông qua việc niêm yết; đã giao dịch trên UPCoM ít nhất hai năm, trừ khi đã chào bán ra công chúng hoặc là doanh nghiệp cổ phần hoá; ROE năm liền trước ít nhất 5%, hai năm liền trước có lãi, không có nợ quá hạn trên một năm và không lỗ luỹ kế; ít nhất 15% cổ phiếu có quyền biểu quyết do ít nhất 100 cổ đông không phải cổ đông lớn nắm giữ (10% nếu vốn điều lệ từ 1.000 tỷ đồng); người nội bộ nắm giữ 100% cổ phiếu trong sáu tháng kể từ ngày giao dịch đầu tiên và 50% trong sáu tháng tiếp theo; có công ty chứng khoán tư vấn. Quy chế niêm yết của Sở sau đó quyết định cổ phiếu được xếp vào đâu.\u003c/p>\u003cp>\u003cb>Lợi thế:\u003c/b> tiếp cận vốn với điều kiện tốt hơn và một mức giá thị trường quan sát được; thanh khoản cho cổ đông hiện hữu; danh tiếng và uy tín với ngân hàng, khách hàng và đối tác; cổ phần dùng làm phương tiện thâu tóm và khích lệ người lao động; và một khuôn khổ cho việc kế thừa cùng kỷ luật quản trị.\u003c/p>\u003cp>\u003cb>Bất lợi:\u003c/b> chi phí niêm yết và tuân thủ liên tục; công bố thông tin sâu rộng và liên tục, kể cả những vấn đề mà một công ty tư nhân muốn giữ bảo mật; áp lực về kết quả ngắn hạn và rủi ro trước tâm lý thị trường; pha loãng và khả năng mất kiểm soát, kèm rủi ro bị thâu tóm; và trách nhiệm cá nhân cùng sự giám sát tăng lên đối với thành viên hội đồng quản trị.\u003c/p>","rubricVi":"Khái niệm và bốn loại niêm yết (0,7) · ít nhất năm điều kiện kèm con số (1,1) · bốn lợi thế (0,6) · bốn bất lợi (0,6)."},{"id":"F5-06","ch":5,"type":"case","clo":"CLO2","marks":4,"exam":"final","q":"A company has EBITDA of VND 600bn, net debt of VND 900bn and 300m diluted shares. Peers trade at a median 8.0× EV/EBITDA (range 6.5×–9.5×). (a) Compute the implied value per share at the median and across the range. (b) The board argues the company deserves the top of the range. Explain what evidence would justify that, and what would undermine it.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) At the \u003cb>median 8.0×\u003c/b>: EV = 8.0 × 600 = 4,800bn; equity = 4,800 − 900 = 3,900bn; per share = 3,900bn ÷ 300m = \u003cb>VND 13,000\u003c/b>.\u003cbr>At \u003cb>6.5×\u003c/b>: EV = 3,900; equity = 3,000; per share = \u003cb>VND 10,000\u003c/b>.\u003cbr>At \u003cb>9.5×\u003c/b>: EV = 5,700; equity = 4,800; per share = \u003cb>VND 16,000\u003c/b>.\u003cbr>The range is therefore VND 10,000–16,000 — a spread of 60% around a mid-point of 13,000, which itself demonstrates why a single-point multiple valuation should never be presented without a range.\u003c/p>\u003cp>\u003cb>(b) Evidence that would justify a premium multiple:\u003c/b> demonstrably higher growth than the peer median; higher and more stable margins with a track record; superior returns on capital; a defensible competitive position (Porter — high barriers, low substitution, weak buyer power); lower earnings volatility and cyclicality; stronger governance and disclosure than peers; a larger free float and better liquidity; and a cleaner balance sheet with lower refinancing risk.\u003c/p>\u003cp>\u003cb>What would undermine it:\u003c/b> growth or margins merely in line with, or below, peers; EBITDA flattered by one-off gains, capitalised costs or aggressive accounting — so a quality-of-earnings review is essential; high customer or supplier concentration; significant related-party transactions and concentrated control implying a governance discount; thin free float; higher leverage than peers, which matters because the net-debt deduction already penalises it and high leverage raises equity risk; and a peer set that is not genuinely comparable in size, geography or business mix. The honest answer to the board is that a premium must be \u003cb>earned by evidence on fundamentals\u003c/b>, not asserted; the appropriate deliverable is the range with a reasoned argument for where within it the company sits, cross-checked against a DCF.\u003c/p>","rubric":"(a) three correct valuations and the range insight (1.6) · (b) at least four justifying factors (1.2) · at least four undermining factors incl. earnings quality (1.2).","qVi":"Một công ty có EBITDA 600 tỷ đồng, nợ ròng 900 tỷ đồng và 300 triệu cổ phần pha loãng. Nhóm so sánh giao dịch ở trung vị 8,0× EV/EBITDA (khoảng 6,5×–9,5×). (a) Tính giá trị mỗi cổ phần ngụ ý ở mức trung vị và trên toàn khoảng. (b) Hội đồng quản trị lập luận công ty xứng đáng mức trên cùng của khoảng. Giải thích bằng chứng nào sẽ biện minh cho điều đó, và điều gì sẽ bác bỏ nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Ở \u003cb>trung vị 8,0×\u003c/b>: EV = 8,0 × 600 = 4.800 tỷ; vốn chủ = 4.800 − 900 = 3.900 tỷ; mỗi cổ phần = 3.900 tỷ ÷ 300 triệu = \u003cb>13.000 đồng\u003c/b>.\u003cbr>Ở \u003cb>6,5×\u003c/b>: EV = 3.900; vốn chủ = 3.000; mỗi cổ phần = \u003cb>10.000 đồng\u003c/b>.\u003cbr>Ở \u003cb>9,5×\u003c/b>: EV = 5.700; vốn chủ = 4.800; mỗi cổ phần = \u003cb>16.000 đồng\u003c/b>.\u003cbr>Khoảng giá trị do đó là 10.000–16.000 đồng — một biên độ 60% quanh điểm giữa 13.000, tự nó chứng minh vì sao một định giá theo bội số điểm duy nhất không bao giờ nên được trình bày mà không kèm khoảng.\u003c/p>\u003cp>\u003cb>(b) Bằng chứng biện minh cho một bội số cao hơn:\u003c/b> tăng trưởng cao hơn rõ rệt so với trung vị nhóm so sánh; biên lợi nhuận cao hơn và ổn định hơn với thành tích đã được chứng minh; tỷ suất sinh lời trên vốn vượt trội; vị thế cạnh tranh bảo vệ được (theo Porter — rào cản cao, ít bị thay thế, sức mạnh người mua yếu); lợi nhuận ít biến động và ít tính chu kỳ hơn; quản trị và công bố thông tin mạnh hơn nhóm so sánh; lượng cổ phần tự do lưu hành lớn hơn và thanh khoản tốt hơn; và bảng cân đối sạch hơn với rủi ro tái tài trợ thấp hơn.\u003c/p>\u003cp>\u003cb>Điều gì sẽ bác bỏ nó:\u003c/b> tăng trưởng hoặc biên lợi nhuận chỉ ngang bằng hoặc thấp hơn nhóm so sánh; EBITDA được tô hồng bởi các khoản lãi một lần, chi phí được vốn hóa hoặc kế toán mạo hiểm — nên một cuộc rà soát chất lượng lợi nhuận là thiết yếu; mức độ tập trung khách hàng hoặc nhà cung cấp cao; các giao dịch với bên liên quan đáng kể và quyền kiểm soát tập trung hàm ý một chiết khấu quản trị; lượng cổ phần tự do lưu hành mỏng; đòn bẩy cao hơn nhóm so sánh, điều này quan trọng vì việc trừ nợ ròng đã trừng phạt nó rồi và đòn bẩy cao làm tăng rủi ro vốn chủ; và một nhóm so sánh không thực sự tương đồng về quy mô, địa lý hay cơ cấu kinh doanh. Câu trả lời trung thực cho hội đồng là một mức thặng dư phải được \u003cb>chứng minh bằng bằng chứng về yếu tố cơ bản\u003c/b>, không phải bằng khẳng định; sản phẩm phù hợp là khoảng giá trị kèm lập luận có căn cứ về việc công ty nằm ở đâu trong khoảng đó, được đối chiếu với một mô hình DCF.\u003c/p>","rubricVi":"(a) ba mức định giá đúng và nhận thức về khoảng (1,6) · (b) ít nhất bốn yếu tố biện minh (1,2) · ít nhất bốn yếu tố bác bỏ gồm chất lượng lợi nhuận (1,2)."},{"id":"F6-01","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the requirements imposed on a securities company that conducts both brokerage and proprietary trading, and why they exist.","guide":"\u003cp>\u003cb>Model answer — requirements.\u003c/b> \u003cb>Client order priority\u003c/b>: client orders must be executed ahead of the firm's own. \u003cb>Separation\u003c/b>: distinct accounts, order books, systems and personnel for proprietary and client business. \u003cb>Client asset segregation\u003c/b>: client money and securities held apart from the firm's own. \u003cb>Capital adequacy\u003c/b> and compliance with position and investment limits. \u003cb>Prohibition\u003c/b> on market manipulation and on trading using inside information. \u003cb>Disclosure\u003c/b> of the firm's own transactions where required, and record-keeping sufficient to reconstruct the order sequence.\u003c/p>\u003cp>\u003cb>Why they exist.\u003c/b> The firm sees client order flow before the market does. Without priority and separation it could \u003cb>front-run\u003c/b> — trade ahead of a large client order to profit from the price impact it will cause — or allocate favourable fills to itself and poor ones to clients. Both convert a fiduciary relationship into an extraction of value from the client, destroy trust in the market's fairness, and are securities offences. The controls exist to make the conflict structurally unworkable rather than to rely on individual good faith.\u003c/p>","rubric":"At least four requirements (1.0) · front-running mechanism explained (0.6) · fairness/trust rationale (0.4).","qVi":"Giải thích các yêu cầu áp đặt lên một công ty chứng khoán vừa làm môi giới vừa tự doanh, và vì sao chúng tồn tại.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các yêu cầu.\u003c/b> \u003cb>Ưu tiên lệnh khách hàng\u003c/b>: lệnh của khách hàng phải được thực hiện trước lệnh của chính công ty. \u003cb>Tách bạch\u003c/b>: tài khoản, sổ lệnh, hệ thống và nhân sự riêng biệt cho hoạt động tự doanh và hoạt động khách hàng. \u003cb>Tách bạch tài sản khách hàng\u003c/b>: tiền và chứng khoán của khách hàng được giữ tách khỏi tài sản của công ty. \u003cb>An toàn vốn\u003c/b> và tuân thủ các giới hạn về vị thế và đầu tư. \u003cb>Cấm\u003c/b> thao túng thị trường và giao dịch sử dụng thông tin nội bộ. \u003cb>Công bố\u003c/b> các giao dịch của chính công ty khi được yêu cầu, và lưu trữ hồ sơ đủ để tái dựng trình tự lệnh.\u003c/p>\u003cp>\u003cb>Vì sao chúng tồn tại.\u003c/b> Công ty nhìn thấy dòng lệnh của khách hàng trước thị trường. Nếu không có ưu tiên và tách bạch, công ty có thể \u003cb>giao dịch chạy trước lệnh\u003c/b> — giao dịch trước một lệnh lớn của khách hàng để kiếm lời từ tác động giá mà lệnh đó sẽ gây ra — hoặc phân bổ các lệnh khớp có lợi cho chính mình và các lệnh xấu cho khách hàng. Cả hai đều biến một quan hệ tín thác thành việc rút giá trị từ khách hàng, phá hủy lòng tin vào tính công bằng của thị trường, và là các hành vi vi phạm luật chứng khoán. Các biện pháp kiểm soát tồn tại để làm cho xung đột trở nên bất khả thi về cấu trúc thay vì dựa vào thiện chí của cá nhân.\u003c/p>","rubricVi":"Ít nhất bốn yêu cầu (1,0) · giải thích cơ chế giao dịch chạy trước lệnh (0,6) · lý do về tính công bằng/lòng tin (0,4)."},{"id":"F6-02","ch":6,"type":"calc-essay","clo":"CLO3","marks":3,"exam":"final","q":"An investor buys 10,000 shares at VND 70,000 with 50% initial margin and 35% maintenance margin. (a) Compute the equity, the loan and the margin-call price. (b) If the price falls to VND 50,000, compute the account equity and equity ratio and state whether a call occurs. (c) Compute the investor's return on equity at that price and compare it with the unlevered return.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Position value = 10,000 × 70,000 = \u003cb>VND 700m\u003c/b>. Equity = 50% × 700m = \u003cb>VND 350m\u003c/b>; loan = \u003cb>VND 350m\u003c/b>.\u003cbr>Call price = 70,000 × (1 − 0.50) ÷ (1 − 0.35) = 70,000 × 0.5 ÷ 0.65 = \u003cb>VND 53,846\u003c/b>.\u003c/p>\u003cp>(b) At VND 50,000: market value = 10,000 × 50,000 = \u003cb>VND 500m\u003c/b>; equity = 500 − 350 = \u003cb>VND 150m\u003c/b>; equity ratio = 150 ÷ 500 = \u003cb>30%\u003c/b>. This is below the 35% maintenance requirement, and 50,000 is below the call price of 53,846 — a \u003cb>margin call is triggered\u003c/b>. The investor must deposit cash or securities to restore the ratio, failing which the broker will force-sell the position.\u003c/p>\u003cp>(c) Levered return = (150 − 350) ÷ 350 = \u003cb>−57.1%\u003c/b> (before interest). Unlevered return = (50,000 − 70,000) ÷ 70,000 = \u003cb>−28.6%\u003c/b>. Leverage of 2× has precisely doubled the loss.\u003c/p>\u003cp>Note the asymmetry in practice: the forced sale crystallises the loss at the bottom, removing any chance of recovery if the price rebounds — which is why margin lending is pro-cyclical and is capped by regulators.\u003c/p>","rubric":"(a) three figures (1.0) · (b) equity, ratio and correct call conclusion (1.0) · (c) both returns with the doubling insight and the forced-sale point (1.0).","qVi":"Một nhà đầu tư mua 10.000 cổ phần giá 70.000 đồng với ký quỹ ban đầu 50% và ký quỹ duy trì 35%. (a) Tính vốn chủ, khoản vay và giá gọi ký quỹ. (b) Nếu giá giảm về 50.000 đồng, tính vốn chủ tài khoản và tỷ lệ vốn chủ, và nêu có phát sinh lệnh gọi hay không. (c) Tính tỷ suất trên vốn chủ của nhà đầu tư ở mức giá đó và so sánh với tỷ suất không dùng đòn bẩy.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Giá trị vị thế = 10.000 × 70.000 = \u003cb>700 triệu đồng\u003c/b>. Vốn chủ = 50% × 700 triệu = \u003cb>350 triệu đồng\u003c/b>; khoản vay = \u003cb>350 triệu đồng\u003c/b>.\u003cbr>Giá gọi ký quỹ = 70.000 × (1 − 0,50) ÷ (1 − 0,35) = 70.000 × 0,5 ÷ 0,65 = \u003cb>53.846 đồng\u003c/b>.\u003c/p>\u003cp>(b) Ở 50.000 đồng: giá trị thị trường = 10.000 × 50.000 = \u003cb>500 triệu đồng\u003c/b>; vốn chủ = 500 − 350 = \u003cb>150 triệu đồng\u003c/b>; tỷ lệ vốn chủ = 150 ÷ 500 = \u003cb>30%\u003c/b>. Mức này dưới yêu cầu duy trì 35%, và 50.000 thấp hơn giá gọi 53.846 — \u003cb>lệnh gọi ký quỹ được kích hoạt\u003c/b>. Nhà đầu tư phải nộp thêm tiền hoặc chứng khoán để khôi phục tỷ lệ, nếu không công ty môi giới sẽ bán giải chấp vị thế.\u003c/p>\u003cp>(c) Tỷ suất có đòn bẩy = (150 − 350) ÷ 350 = \u003cb>−57,1%\u003c/b> (trước lãi vay). Tỷ suất không đòn bẩy = (50.000 − 70.000) ÷ 70.000 = \u003cb>−28,6%\u003c/b>. Đòn bẩy 2× đã nhân đôi chính xác khoản lỗ.\u003c/p>\u003cp>Lưu ý sự bất đối xứng trong thực tế: việc bán giải chấp hiện thực hóa khoản lỗ ngay tại đáy, loại bỏ mọi cơ hội hồi phục nếu giá bật lại — đó là lý do cho vay ký quỹ mang tính thuận chu kỳ và bị cơ quan quản lý đặt trần.\u003c/p>","rubricVi":"(a) ba con số (1,0) · (b) vốn chủ, tỷ lệ và kết luận đúng về lệnh gọi (1,0) · (c) cả hai tỷ suất với nhận thức về việc nhân đôi và điểm về bán giải chấp (1,0)."},{"id":"F6-03","ch":6,"type":"essay","clo":"CLO3","marks":3,"exam":"final","q":"Explain the role of a market maker in market quality, the three risks it is compensated for, and the circumstances in which it will widen its spread.","guide":"\u003cp>\u003cb>Model answer — role.\u003c/b> A market maker quotes continuous two-sided prices and stands ready to buy at its bid and sell at its ask, trading as principal from its own inventory. It supplies \u003cb>immediacy\u003c/b> — the ability to trade now rather than wait for a natural counterparty — and thereby provides liquidity and price continuity, narrows spreads, absorbs temporary order imbalances and reduces volatility. Requirements typically include minimum capital and an obligation to quote both sides within a maximum spread for a minimum size during a minimum proportion of the session.\u003c/p>\u003cp>\u003cb>Three risks compensated by the spread.\u003c/b> \u003cb>Inventory risk\u003c/b> — holding a position whose value may fall before it can be offloaded. \u003cb>Adverse selection\u003c/b> — informed traders systematically buy just before prices rise and sell just before they fall, so the dealer loses on precisely those trades; it must quote to everyone and cannot identify them. \u003cb>Order-processing cost\u003c/b> — technology, capital and clearing.\u003c/p>\u003cp>\u003cb>When spreads widen:\u003c/b> when volatility rises, since inventory can move against the dealer faster; when volume and depth are thin, making positions harder to offload; when informed trading is suspected, for example around an unexplained order imbalance or ahead of an announcement; when the dealer's inventory is already unbalanced; and when its funding or capital costs rise. The spread is therefore a direct, observable measure of market \u003cb>liquidity\u003c/b>, and it widens in a stressed market exactly when investors most want to trade.\u003c/p>","rubric":"Role incl. immediacy and obligations (1.0) · three risks correctly named and explained (1.2) · at least four widening circumstances plus the liquidity-measure conclusion (0.8).","qVi":"Giải thích vai trò của nhà tạo lập thị trường đối với chất lượng thị trường, ba loại rủi ro mà họ được bù đắp, và các hoàn cảnh khiến họ nới rộng chênh lệch giá.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — vai trò.\u003c/b> Một nhà tạo lập thị trường yết giá hai chiều liên tục và luôn sẵn sàng mua theo giá đặt mua và bán theo giá chào bán, giao dịch với vai trò chính chủ từ tồn kho của chính mình. Họ cung cấp \u003cb>tính tức thời\u003c/b> — khả năng giao dịch ngay bây giờ thay vì chờ một đối tác tự nhiên — và qua đó cung cấp thanh khoản cùng tính liên tục của giá, thu hẹp chênh lệch giá, hấp thụ mất cân đối lệnh tạm thời và giảm biến động. Các yêu cầu thường bao gồm vốn tối thiểu và nghĩa vụ yết cả hai chiều trong một mức chênh lệch tối đa cho một khối lượng tối thiểu trong một tỷ lệ tối thiểu của phiên giao dịch.\u003c/p>\u003cp>\u003cb>Ba rủi ro được bù đắp bởi chênh lệch giá.\u003c/b> \u003cb>Rủi ro tồn kho\u003c/b> — nắm giữ một vị thế mà giá trị có thể giảm trước khi đẩy đi được. \u003cb>Lựa chọn bất lợi\u003c/b> — những người giao dịch nắm nhiều thông tin sẽ mua ngay trước khi giá tăng và bán ngay trước khi giá giảm một cách có hệ thống, nên nhà tạo lập thua lỗ đúng ở những giao dịch đó; họ phải yết giá cho mọi người và không thể nhận diện được ai là ai. \u003cb>Chi phí xử lý lệnh\u003c/b> — công nghệ, vốn và bù trừ.\u003c/p>\u003cp>\u003cb>Khi nào chênh lệch giá nới rộng:\u003c/b> khi biến động tăng, vì tồn kho có thể chuyển động bất lợi nhanh hơn; khi khối lượng và độ sâu mỏng, khiến vị thế khó đẩy đi hơn; khi nghi ngờ có giao dịch từ bên nắm nhiều thông tin, ví dụ quanh một mất cân đối lệnh không giải thích được hoặc trước một công bố; khi tồn kho của nhà tạo lập đã mất cân bằng; và khi chi phí huy động vốn hoặc chi phí vốn của họ tăng. Chênh lệch giá do đó là một thước đo trực tiếp, quan sát được, của \u003cb>tính thanh khoản\u003c/b> thị trường, và nó nới rộng trong thị trường căng thẳng đúng lúc nhà đầu tư muốn giao dịch nhất.\u003c/p>","rubricVi":"Vai trò gồm tính tức thời và các nghĩa vụ (1,0) · nêu tên và giải thích đúng ba rủi ro (1,2) · ít nhất bốn hoàn cảnh nới rộng cùng kết luận về thước đo thanh khoản (0,8)."},{"id":"F6-04","ch":6,"type":"calc-essay","clo":"CLO3","marks":3,"exam":"final","q":"An investor borrows shares and sells short 5,000 shares at VND 60,000. The borrow fee is 3% per annum on the value of the borrowed stock, the position is held six months, and a dividend of VND 1,500 per share is paid during the period. (a) Compute the profit if the investor covers at VND 45,000. (b) Compute the outcome if the price instead rises to VND 85,000. (c) Explain the risks that distinguish a short position from a long position.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Borrow fee = 3% × 6/12 × (5,000 × 60,000) = 1.5% × 300m = \u003cb>VND 4.5m\u003c/b>. Dividend passed to the lender = 5,000 × 1,500 = \u003cb>VND 7.5m\u003c/b>.\u003c/p>\u003cp>(a) Gross gain = 5,000 × (60,000 − 45,000) = \u003cb>VND 75m\u003c/b>. Net profit = 75 − 4.5 − 7.5 = \u003cb>VND 63m\u003c/b>.\u003c/p>\u003cp>(b) Gross loss = 5,000 × (60,000 − 85,000) = \u003cb>−VND 125m\u003c/b>. Net = −125 − 4.5 − 7.5 = \u003cb>−VND 137m\u003c/b>, a loss of 45.7% on the notional and far more on the posted collateral.\u003c/p>\u003cp>(c) \u003cb>Distinguishing risks.\u003c/b> \u003ci>Unlimited loss\u003c/i>: a long position can fall only to zero, but a shorted share can rise without bound, so the loss is theoretically unlimited — as part (b) begins to show. \u003ci>Carrying costs\u003c/i>: the borrow fee accrues with time and can spike for hard-to-borrow stock, and all dividends must be passed through, so time works against the short seller whereas a long holder receives the dividend. \u003ci>Recall risk\u003c/i>: the lender may demand the shares back, forcing the short to cover at a moment not of its choosing. \u003ci>Short squeeze\u003c/i>: rising prices force crowded shorts to buy back simultaneously, driving the price higher still. \u003ci>Margin risk\u003c/i>: losses erode collateral and trigger calls. \u003ci>Regulatory risk\u003c/i>: authorities may restrict or ban short selling, as Vietnam does for covered short selling.\u003c/p>","rubric":"Fee and dividend computed (0.6) · (a) 0.6 · (b) 0.6 · (c) at least four distinguishing risks incl. unlimited loss and recall/squeeze (1.2).","qVi":"Một nhà đầu tư vay cổ phần và bán khống 5.000 cổ phần ở giá 60.000 đồng. Phí vay là 3%/năm trên giá trị cổ phiếu đã vay, vị thế được giữ sáu tháng, và một khoản cổ tức 1.500 đồng mỗi cổ phần được chi trả trong kỳ. (a) Tính lợi nhuận nếu nhà đầu tư mua bù ở 45.000 đồng. (b) Tính kết quả nếu giá thay vào đó tăng lên 85.000 đồng. (c) Giải thích các rủi ro phân biệt vị thế bán khống với vị thế mua.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Phí vay = 3% × 6/12 × (5.000 × 60.000) = 1,5% × 300 triệu = \u003cb>4,5 triệu đồng\u003c/b>. Cổ tức trả lại cho bên cho vay = 5.000 × 1.500 = \u003cb>7,5 triệu đồng\u003c/b>.\u003c/p>\u003cp>(a) Lãi gộp = 5.000 × (60.000 − 45.000) = \u003cb>75 triệu đồng\u003c/b>. Lợi nhuận ròng = 75 − 4,5 − 7,5 = \u003cb>63 triệu đồng\u003c/b>.\u003c/p>\u003cp>(b) Lỗ gộp = 5.000 × (60.000 − 85.000) = \u003cb>−125 triệu đồng\u003c/b>. Ròng = −125 − 4,5 − 7,5 = \u003cb>−137 triệu đồng\u003c/b>, một khoản lỗ 45,7% trên giá trị danh nghĩa và lớn hơn nhiều trên tài sản bảo đảm đã nộp.\u003c/p>\u003cp>(c) \u003cb>Các rủi ro phân biệt.\u003c/b> \u003ci>Lỗ không giới hạn\u003c/i>: một vị thế mua chỉ có thể giảm về 0, nhưng một cổ phiếu bị bán khống có thể tăng vô hạn, nên khoản lỗ về lý thuyết là không giới hạn — như phần (b) bắt đầu cho thấy. \u003ci>Chi phí nắm giữ\u003c/i>: phí vay tích lũy theo thời gian và có thể tăng vọt với cổ phiếu khó vay, và mọi khoản cổ tức đều phải trả lại, nên thời gian bất lợi cho người bán khống trong khi người nắm giữ vị thế mua lại nhận được cổ tức. \u003ci>Rủi ro thu hồi\u003c/i>: bên cho vay có thể đòi lại cổ phần, buộc người bán khống phải mua bù vào thời điểm không do họ chọn. \u003ci>Siết mua\u003c/i>: giá tăng buộc các vị thế bán khống đông đảo phải mua lại đồng thời, đẩy giá lên cao hơn nữa. \u003ci>Rủi ro ký quỹ\u003c/i>: các khoản lỗ bào mòn tài sản bảo đảm và kích hoạt lệnh gọi. \u003ci>Rủi ro pháp lý\u003c/i>: cơ quan quản lý có thể hạn chế hoặc cấm bán khống, như Việt Nam áp dụng với bán khống có bảo đảm.\u003c/p>","rubricVi":"Tính được phí và cổ tức (0,6) · (a) 0,6 · (b) 0,6 · (c) ít nhất bốn rủi ro phân biệt gồm lỗ không giới hạn và thu hồi/siết mua (1,2)."},{"id":"F6-05","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the order types used on Vietnamese exchanges and the matching priority rules, and advise when an investor should choose a limit rather than a market order.","guide":"\u003cp>\u003cb>Model answer — order types.\u003c/b> \u003cb>LO\u003c/b> (limit order) executes at the stated limit price or better: certainty of \u003ci>price\u003c/i>, not of execution. \u003cb>MP/MTL\u003c/b> (market order) executes at the best available price: certainty of \u003ci>execution\u003c/i>, not of price; any unexecuted remainder is typically converted to a limit order or cancelled. \u003cb>ATO\u003c/b> (at-the-open) participates only in the opening call auction and takes precedence over limit orders at the same price in that matching. \u003cb>ATC\u003c/b> (at-the-close) participates only in the closing call auction. All prices must fall within the daily band between the \u003cb>floor\u003c/b> and the \u003cb>ceiling\u003c/b> around the reference price.\u003c/p>\u003cp>\u003cb>Matching priority.\u003c/b> \u003cb>Price priority\u003c/b> first — the highest bid and the lowest ask are matched first; then \u003cb>time priority\u003c/b> — among orders at the same price, the earlier entry matches first. In call auctions the system selects the price maximising executed volume.\u003c/p>\u003cp>\u003cb>Advice.\u003c/b> Use a \u003cb>limit order\u003c/b> when the security is illiquid or the spread is wide, when the order is large relative to normal volume, in volatile conditions, or when a specific entry or exit level matters more than immediacy — a market order in a thin book can execute far from the last price. Use a \u003cb>market order\u003c/b> when execution certainty is paramount: closing a losing position, meeting a margin call, or trading a highly liquid stock where the spread is negligible.\u003c/p>","rubric":"Four order types with correct behaviour (0.8) · price-then-time priority (0.5) · reasoned advice covering liquidity, size and volatility (0.7).","qVi":"Giải thích các loại lệnh dùng trên các sở giao dịch Việt Nam và quy tắc ưu tiên khớp lệnh, và tư vấn khi nào nhà đầu tư nên chọn lệnh giới hạn thay vì lệnh thị trường.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các loại lệnh.\u003c/b> \u003cb>LO\u003c/b> (lệnh giới hạn) thực hiện ở mức giá giới hạn đã nêu hoặc tốt hơn: chắc chắn về \u003ci>giá\u003c/i>, không chắc chắn về việc khớp. \u003cb>MP/MTL\u003c/b> (lệnh thị trường) thực hiện ở mức giá tốt nhất hiện có: chắc chắn về \u003ci>việc khớp\u003c/i>, không chắc chắn về giá; phần chưa khớp thường được chuyển thành lệnh giới hạn hoặc bị hủy. \u003cb>ATO\u003c/b> (lệnh mở cửa) chỉ tham gia phiên khớp lệnh định kỳ mở cửa và được ưu tiên hơn lệnh giới hạn ở cùng mức giá trong lần khớp đó. \u003cb>ATC\u003c/b> (lệnh đóng cửa) chỉ tham gia phiên khớp lệnh định kỳ đóng cửa. Mọi mức giá phải nằm trong biên độ ngày giữa \u003cb>giá sàn\u003c/b> và \u003cb>giá trần\u003c/b> quanh giá tham chiếu.\u003c/p>\u003cp>\u003cb>Ưu tiên khớp lệnh.\u003c/b> \u003cb>Ưu tiên về giá\u003c/b> trước — lệnh mua giá cao nhất và lệnh bán giá thấp nhất được khớp trước; rồi \u003cb>ưu tiên về thời gian\u003c/b> — trong các lệnh cùng mức giá, lệnh nhập trước được khớp trước. Trong phiên khớp lệnh định kỳ, hệ thống chọn mức giá làm tối đa hóa khối lượng khớp.\u003c/p>\u003cp>\u003cb>Lời khuyên.\u003c/b> Dùng \u003cb>lệnh giới hạn\u003c/b> khi chứng khoán kém thanh khoản hoặc chênh lệch giá rộng, khi lệnh lớn so với khối lượng thông thường, trong điều kiện biến động, hoặc khi một mức giá vào hay ra cụ thể quan trọng hơn tính tức thời — một lệnh thị trường trong sổ lệnh mỏng có thể khớp rất xa giá gần nhất. Dùng \u003cb>lệnh thị trường\u003c/b> khi sự chắc chắn về việc khớp là tối quan trọng: đóng một vị thế thua lỗ, đáp ứng một lệnh gọi ký quỹ, hoặc giao dịch một cổ phiếu thanh khoản cao nơi chênh lệch giá không đáng kể.\u003c/p>","rubricVi":"Bốn loại lệnh với hành vi đúng (0,8) · ưu tiên giá rồi thời gian (0,5) · lời khuyên có lập luận bao quát thanh khoản, quy mô và biến động (0,7)."},{"id":"G1-01","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the difference between the 'private side' and the 'public side' of an investment bank, and describe three controls that keep them separate.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>private side\u003c/b> comprises investment-banking division staff who receive material non-public information (MNPI) from clients — for example knowledge of an unannounced acquisition or issue. The \u003cb>public side\u003c/b> comprises research, sales and trading staff, who may act only on publicly available information.\u003c/p>\u003cp>\u003cb>Three controls.\u003c/b> (1) \u003cb>Physical and system separation\u003c/b> — separate floors, access-controlled areas and segregated IT permissions so private-side files cannot be reached by public-side staff. (2) \u003cb>Restricted and watch lists\u003c/b> maintained by a control room, barring research publication and proprietary trading in affected securities. (3) \u003cb>Wall-crossing procedures\u003c/b> — a documented, time-limited process by which a public-side employee is deliberately made an insider and placed under trading restrictions until the information becomes public. Supporting controls include surveillance of trading around announcements, personal-account dealing rules and staff training.\u003c/p>","rubric":"Correct definition of both sides with MNPI (0.8) · three genuine controls (1.0) · supporting control or rationale (0.2).","qVi":"Giải thích sự khác biệt giữa 'bên riêng tư' và 'bên công khai' của một ngân hàng đầu tư, và mô tả ba biện pháp kiểm soát giữ chúng tách biệt.","guideVi":"\u003cp>\u003cb>Bài giải m
