k the manager has taken. Sharpe measures excess return over the risk-free rate per unit of that total risk, which is precisely the trade-off the client faces.\u003c/p>\u003cp>The \u003cb>information ratio\u003c/b> answers a different question: how efficiently the manager converts \u003cb>active\u003c/b> risk into \u003cb>active\u003c/b> return relative to the benchmark. It is the right measure when the portfolio is \u003cb>one mandate within a larger allocation\u003c/b> — the investor has already decided to hold that asset class through the benchmark, and is paying the manager only for deviation from it.\u003c/p>\u003cp>Here the IR of 0.75 is respectable, indicating genuine value added per unit of active risk, while the Sharpe of 0.44 is moderate. The two can rank managers differently: a manager can add value against a benchmark that is itself in an unattractive asset class, which the Sharpe ratio would reveal and the IR would not.\u003c/p>","rubric":"Both ratios computed correctly (0.8) · Sharpe identified as relevant with the total-wealth reasoning (0.6) · IR's proper context and the possibility of divergent rankings (0.6).","qVi":"Một danh mục đạt lợi suất 13% với độ biến động 18% và sai số theo dõi 4%; chỉ số tham chiếu đạt 10%; lãi suất phi rủi ro là 5%. Tính tỷ số Sharpe và tỷ số thông tin, và nêu tỷ số nào phù hợp hơn nếu đây là khoản đầu tư duy nhất của khách hàng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Tỷ số Sharpe = (13 − 5) ÷ 18 = 8 ÷ 18 = \u003cb>0,44\u003c/b>.\u003cbr>Tỷ số thông tin = (13 − 10) ÷ 4 = 3 ÷ 4 = \u003cb>0,75\u003c/b>.\u003c/p>\u003cp>\u003cb>Tỷ số nào phù hợp hơn.\u003c/b> Nếu danh mục này là khoản đầu tư \u003cb>duy nhất\u003c/b> của khách hàng, \u003cb>tỷ số Sharpe\u003c/b> là tiêu chí phù hợp. Lý do là khách hàng trải nghiệm \u003cb>toàn bộ độ biến động\u003c/b> của tài sản mình — cả rủi ro hệ thống của việc tham gia thị trường lẫn bất kỳ rủi ro riêng biệt nào mà nhà quản lý đã chấp nhận. Sharpe đo lợi suất vượt trội trên lãi suất phi rủi ro trên mỗi đơn vị rủi ro tổng đó, đúng là sự đánh đổi mà khách hàng đối mặt.\u003c/p>\u003cp>\u003cb>Tỷ số thông tin\u003c/b> trả lời một câu hỏi khác: nhà quản lý chuyển hóa rủi ro \u003cb>chủ động\u003c/b> thành lợi suất \u003cb>chủ động\u003c/b> so với chỉ số tham chiếu hiệu quả ra sao. Nó là thước đo đúng khi danh mục là \u003cb>một mệnh lệnh trong một phân bổ lớn hơn\u003c/b> — nhà đầu tư đã quyết định nắm giữ lớp tài sản đó thông qua chỉ số tham chiếu, và chỉ trả tiền cho nhà quản lý vì phần lệch khỏi nó.\u003c/p>\u003cp>Ở đây IR 0,75 là khá tốt, cho thấy giá trị gia tăng thực sự trên mỗi đơn vị rủi ro chủ động, trong khi Sharpe 0,44 là trung bình. Hai thước đo có thể xếp hạng các nhà quản lý khác nhau: một nhà quản lý có thể tạo thêm giá trị so với một chỉ số tham chiếu vốn thuộc một lớp tài sản kém hấp dẫn, điều mà tỷ số Sharpe sẽ bộc lộ còn IR thì không.\u003c/p>","rubricVi":"Tính đúng cả hai tỷ số (0,8) · xác định Sharpe là phù hợp với lập luận toàn bộ tài sản (0,6) · bối cảnh đúng của IR và khả năng xếp hạng khác nhau (0,6)."},{"id":"M4-04","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the classification of asset management services by client segment and how the service model differs.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Institutional mandates\u003c/b> serve pension funds, insurers and sovereign funds. Assets are large, the client is professional, and the service is a \u003cb>segregated account\u003c/b> managed to a precisely specified mandate and benchmark, with detailed reporting and periodic formal review. Fees are the lowest — often 0.1–0.5% — because of scale and the client's negotiating power.\u003c/p>\u003cp>\u003cb>Retail funds\u003c/b> serve the general public through \u003cb>pooled vehicles\u003c/b> — mutual funds and ETFs. The product is standardised, since it must serve many investors identically; distribution is through banks, securities companies and advisers; regulation is heaviest because investors are unsophisticated. Fees range widely, from a few basis points for index products to around 2% for active funds.\u003c/p>\u003cp>\u003cb>Private wealth\u003c/b> serves high-net-worth individuals through advisory or discretionary accounts with a dedicated relationship manager. The service is \u003cb>tailored\u003c/b> and extends beyond investment into tax, retirement, estate and succession planning. Fees are typically 0.5–1.5%. At the ultra-high-net-worth level it extends to bespoke structuring and philanthropy, and at the top to a \u003cb>family office\u003c/b> providing a full institutional service for one family.\u003c/p>\u003cp>\u003cb>Alternatives\u003c/b> — hedge funds and private equity — serve professional investors under lighter product regulation but with restricted access, illiquidity and \u003cb>performance-based\u003c/b> fees of roughly 1–2% plus 20% carry.\u003c/p>\u003cp>The pattern is that as mandates become more bespoke, less liquid and less constrained, fees rise; as they become more standardised and scalable, fees fall.\u003c/p>","rubric":"Four segments correctly identified with client type and vehicle (0.9) · service-model differences incl. tailoring and regulation (0.6) · fee levels and the organising principle (0.5).","qVi":"Giải thích cách phân loại dịch vụ quản lý tài sản theo phân khúc khách hàng và mô hình dịch vụ khác nhau ra sao.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Mệnh lệnh tổ chức\u003c/b> phục vụ quỹ hưu trí, công ty bảo hiểm và quỹ đầu tư quốc gia. Tài sản lớn, khách hàng là chuyên nghiệp, và dịch vụ là một \u003cb>tài khoản riêng biệt\u003c/b> được quản lý theo một mệnh lệnh và chỉ số tham chiếu được nêu chính xác, với báo cáo chi tiết và rà soát chính thức định kỳ. Phí thấp nhất — thường 0,1–0,5% — do quy mô và sức mạnh thương lượng của khách hàng.\u003c/p>\u003cp>\u003cb>Quỹ đại chúng\u003c/b> phục vụ công chúng qua các \u003cb>công cụ tập thể\u003c/b> — quỹ tương hỗ và ETF. Sản phẩm được chuẩn hóa, vì phải phục vụ nhiều nhà đầu tư như nhau; phân phối qua ngân hàng, công ty chứng khoán và nhà tư vấn; quản lý pháp lý nặng nhất vì nhà đầu tư không chuyên nghiệp. Phí trải rộng, từ vài điểm cơ bản cho sản phẩm chỉ số tới khoảng 2% cho quỹ chủ động.\u003c/p>\u003cp>\u003cb>Gia sản cá nhân\u003c/b> phục vụ cá nhân có tài sản lớn qua tài khoản tư vấn hoặc ủy thác toàn quyền với một chuyên viên quan hệ riêng. Dịch vụ được \u003cb>may đo\u003c/b> và mở rộng ra ngoài đầu tư sang thuế, hưu trí, di sản và kế thừa. Phí thường 0,5–1,5%. Ở mức tài sản siêu lớn, dịch vụ mở rộng tới cấu trúc theo yêu cầu riêng và hoạt động thiện nguyện, và ở đỉnh là một \u003cb>văn phòng gia đình\u003c/b> cung cấp dịch vụ đầy đủ như một tổ chức cho một gia đình duy nhất.\u003c/p>\u003cp>\u003cb>Sản phẩm thay thế\u003c/b> — quỹ đầu cơ và vốn cổ phần tư nhân — phục vụ nhà đầu tư chuyên nghiệp với quản lý sản phẩm nhẹ hơn nhưng hạn chế tiếp cận, kém thanh khoản và phí \u003cb>dựa trên hiệu quả\u003c/b> khoảng 1–2% cộng 20% lãi thưởng.\u003c/p>\u003cp>Quy luật là khi mệnh lệnh càng may đo, càng kém thanh khoản và càng ít ràng buộc thì phí càng cao; khi càng chuẩn hóa và càng mở rộng được quy mô thì phí càng thấp.\u003c/p>","rubricVi":"Nhận diện đúng bốn phân khúc với loại khách hàng và công cụ (0,9) · khác biệt về mô hình dịch vụ gồm mức may đo và quản lý pháp lý (0,6) · mức phí và nguyên tắc tổ chức (0,5)."},{"id":"M4-05","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what performance attribution analysis is and why it matters to a client.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Performance attribution\u003c/b> decomposes a portfolio's return relative to its benchmark into the specific decisions that produced it. The standard decomposition separates:\u003c/p>\u003cul>\u003cli>the \u003cb>allocation effect\u003c/b> — value added or lost by over- or under-weighting sectors, asset classes or countries relative to the benchmark; and\u003c/li>\u003cli>the \u003cb>selection effect\u003c/b> — value added or lost by choosing particular securities within each sector.\u003c/li>\u003c/ul>\u003cp>An \u003cb>interaction\u003c/b> term captures the combined result of being overweight a sector in which selection was also strong.\u003c/p>\u003cp>\u003cb>Why it matters to the client.\u003c/b> It answers whether outperformance was the result of \u003cb>repeatable skill\u003c/b> or of a single fortunate bet — a manager whose entire excess return came from one overweight sector has demonstrated something quite different from one adding value consistently across many decisions. It verifies that the manager did what they said: a manager marketed as a stock-picker whose returns come entirely from sector allocation is not following the stated process.\u003c/p>\u003cp>It also identifies where the manager genuinely adds value, informing whether to retain, redeem or restructure the mandate; and it supports the \u003cb>risk\u003c/b> discussion, since attribution shows where active risk was actually taken. Return alone cannot answer any of these questions — which is why attribution, not just performance measurement, forms part of the feedback phase of the portfolio management process.\u003c/p>","rubric":"Allocation and selection effects correctly defined (0.8) · repeatability/skill-versus-luck argument (0.5) · process verification and retention decision (0.5) · placement in the feedback phase (0.2).","qVi":"Giải thích phân tích đóng góp hiệu quả (performance attribution) là gì và vì sao nó quan trọng với khách hàng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Phân tích đóng góp hiệu quả\u003c/b> phân rã lợi suất của danh mục so với chỉ số tham chiếu thành các quyết định cụ thể đã tạo ra nó. Cách phân rã chuẩn tách:\u003c/p>\u003cul>\u003cli>\u003cb>tác động phân bổ\u003c/b> — giá trị tăng thêm hay mất đi do tăng hoặc giảm tỷ trọng các ngành, lớp tài sản hoặc quốc gia so với chỉ số tham chiếu; và\u003c/li>\u003cli>\u003cb>tác động lựa chọn\u003c/b> — giá trị tăng thêm hay mất đi do chọn các chứng khoán cụ thể trong từng ngành.\u003c/li>\u003c/ul>\u003cp>Một số hạng \u003cb>tương tác\u003c/b> nắm bắt kết quả kết hợp của việc vừa tăng tỷ trọng một ngành vừa lựa chọn tốt trong ngành đó.\u003c/p>\u003cp>\u003cb>Vì sao nó quan trọng với khách hàng.\u003c/b> Nó trả lời liệu hiệu quả vượt trội là kết quả của \u003cb>kỹ năng lặp lại được\u003c/b> hay của một cú đặt cược may mắn duy nhất — một nhà quản lý mà toàn bộ lợi suất vượt trội đến từ việc tăng tỷ trọng một ngành đã chứng minh một điều rất khác so với người tạo thêm giá trị nhất quán qua nhiều quyết định. Nó kiểm chứng rằng nhà quản lý đã làm đúng điều họ nói: một nhà quản lý được tiếp thị là người chọn cổ phiếu nhưng lợi suất hoàn toàn đến từ phân bổ ngành thì không tuân theo quy trình đã tuyên bố.\u003c/p>\u003cp>Nó cũng nhận diện nơi nhà quản lý thực sự tạo thêm giá trị, phục vụ quyết định giữ lại, rút vốn hay tái cấu trúc mệnh lệnh; và nó hỗ trợ thảo luận về \u003cb>rủi ro\u003c/b>, vì phân tích đóng góp cho thấy rủi ro chủ động thực sự đã được chấp nhận ở đâu. Chỉ riêng lợi suất không thể trả lời bất kỳ câu hỏi nào trong số đó — đó là lý do phân tích đóng góp, chứ không chỉ đo lường hiệu quả, là một phần của giai đoạn phản hồi trong quy trình quản lý danh mục.\u003c/p>","rubricVi":"Định nghĩa đúng tác động phân bổ và lựa chọn (0,8) · lập luận về khả năng lặp lại/kỹ năng so với may mắn (0,5) · kiểm chứng quy trình và quyết định giữ lại (0,5) · vị trí trong giai đoạn phản hồi (0,2)."},{"id":"M4-06","ch":4,"type":"case","clo":"CLO2","marks":3,"exam":"final","q":"A bank's wealth division is set a target to increase sales of in-house funds. Analyse the risks this creates and recommend safeguards.","guide":"\u003cp>\u003cb>Model answer — risks.\u003c/b> (1) \u003cb>Suitability failure.\u003c/b> A sales target creates pressure to recommend in-house products irrespective of whether they fit the client's objectives, risk tolerance and capacity — the definition of mis-selling. (2) \u003cb>Conflict of interest.\u003c/b> The bank earns more from its own funds than from third-party products, so the recommendation may serve the bank rather than the client, breaching the duty to place client interests first. (3) \u003cb>Concentration risk\u003c/b> for clients, whose portfolios become concentrated in one manager's products — and, if the bank is also their deposit-taker and lender, in a single institution. (4) \u003cb>Regulatory and legal exposure\u003c/b> — mis-selling attracts sanction, compensation liability and, in Vietnam, has been a live enforcement issue in the distribution of insurance and corporate bonds through banking channels. (5) \u003cb>Reputational damage\u003c/b>, which in a trust-based business is the most expensive outcome. (6) \u003cb>Adverse selection of staff behaviour\u003c/b> — targets reward volume, so the least scrupulous advisers may outperform on the metric.\u003c/p>\u003cp>\u003cb>Safeguards.\u003c/b> Make \u003cb>suitability\u003c/b> the binding constraint: no recommendation may proceed without a documented profile, an IPS and a recorded rationale linking the product to the client's stated objectives. Require advisers to present \u003cb>comparable third-party alternatives\u003c/b> on an objective basis, and to record why the recommended product was chosen. Provide \u003cb>clear written disclosure\u003c/b> of the in-house relationship and any distribution commission. Restructure \u003cb>incentives\u003c/b> so that adviser compensation is not driven by product-specific volume — balanced scorecards weighting client outcomes, retention and complaint rates. Implement \u003cb>post-sale monitoring\u003c/b>: sample file reviews, concentration reporting, complaint and early-redemption analysis, and mystery shopping. Give \u003cb>compliance\u003c/b> authority to block sales and to escalate patterns to the board. Finally, senior management should reconsider the target itself — a volume target on a proprietary product is a structurally unsound incentive, and no amount of downstream control fully neutralises it.\u003c/p>","rubric":"At least four risks incl. suitability and conflict (1.1) · at least five safeguards incl. suitability documentation, alternatives, disclosure and incentive redesign (1.4) · challenge to the target itself (0.5).","qVi":"Khối quản lý gia sản của một ngân hàng được giao chỉ tiêu tăng doanh số các quỹ nội bộ. Phân tích các rủi ro điều này tạo ra và khuyến nghị các biện pháp bảo vệ.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các rủi ro.\u003c/b> (1) \u003cb>Thất bại về tính phù hợp.\u003c/b> Một chỉ tiêu doanh số tạo áp lực khuyến nghị sản phẩm nội bộ bất kể nó có phù hợp với mục tiêu, khả năng chịu đựng và năng lực chịu rủi ro của khách hàng hay không — đúng định nghĩa của bán sai. (2) \u003cb>Xung đột lợi ích.\u003c/b> Ngân hàng kiếm được nhiều hơn từ quỹ của chính mình so với sản phẩm bên thứ ba, nên khuyến nghị có thể phục vụ ngân hàng chứ không phải khách hàng, vi phạm nghĩa vụ đặt lợi ích khách hàng lên trước. (3) \u003cb>Rủi ro tập trung\u003c/b> cho khách hàng, khi danh mục của họ trở nên tập trung vào sản phẩm của một nhà quản lý — và, nếu ngân hàng đồng thời là nơi họ gửi tiền và vay tiền, tập trung vào một định chế duy nhất. (4) \u003cb>Rủi ro pháp lý\u003c/b> — bán sai dẫn tới chế tài, trách nhiệm bồi thường và, tại Việt Nam, đã là vấn đề thực thi nóng trong việc phân phối bảo hiểm và trái phiếu doanh nghiệp qua kênh ngân hàng. (5) \u003cb>Tổn hại danh tiếng\u003c/b>, thứ trong một ngành dựa trên lòng tin là kết cục đắt giá nhất. (6) \u003cb>Lựa chọn ngược về hành vi nhân sự\u003c/b> — chỉ tiêu tưởng thưởng khối lượng, nên những chuyên viên ít nguyên tắc nhất có thể lại đứng đầu bảng.\u003c/p>\u003cp>\u003cb>Biện pháp bảo vệ.\u003c/b> Đặt \u003cb>tính phù hợp\u003c/b> làm ràng buộc bắt buộc: không khuyến nghị nào được tiến hành mà không có hồ sơ khách hàng đã lập, một IPS và một lập luận được ghi lại liên kết sản phẩm với mục tiêu đã nêu của khách hàng. Yêu cầu chuyên viên trình bày \u003cb>các phương án bên thứ ba so sánh được\u003c/b> trên cơ sở khách quan, và ghi lại vì sao sản phẩm được khuyến nghị đã được chọn. Cung cấp \u003cb>công bố bằng văn bản rõ ràng\u003c/b> về quan hệ nội bộ và mọi hoa hồng phân phối. Tái cấu trúc \u003cb>cơ chế khích lệ\u003c/b> để thù lao của chuyên viên không bị dẫn dắt bởi khối lượng theo sản phẩm — dùng thẻ điểm cân bằng có trọng số cho kết quả của khách hàng, tỷ lệ giữ chân và tỷ lệ khiếu nại. Triển khai \u003cb>giám sát sau bán\u003c/b>: rà soát hồ sơ theo mẫu, báo cáo mức độ tập trung, phân tích khiếu nại và rút vốn sớm, và khảo sát ẩn danh. Trao cho \u003cb>tuân thủ\u003c/b> thẩm quyền chặn giao dịch và báo cáo các mô hình bất thường lên hội đồng quản trị. Cuối cùng, ban lãnh đạo cấp cao nên xem lại chính chỉ tiêu đó — một chỉ tiêu khối lượng trên sản phẩm của chính mình là một cơ chế khích lệ sai về cấu trúc, và không lượng kiểm soát hạ nguồn nào vô hiệu hóa được nó hoàn toàn.\u003c/p>","rubricVi":"Ít nhất bốn rủi ro gồm tính phù hợp và xung đột (1,1) · ít nhất năm biện pháp bảo vệ gồm ghi chép tính phù hợp, phương án thay thế, công bố và thiết kế lại khích lệ (1,4) · chất vấn chính chỉ tiêu đó (0,5)."},{"id":"M5-01","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the PESTEL framework and give one Vietnamese example of each factor affecting the securities industry.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>PESTEL\u003c/b> analyses the external macro-environment shaping an industry.\u003c/p>\u003cul>\u003cli>\u003cb>Political\u003c/b> — government policy on market development and state divestment; for example the pace of SOE equitization determines the supply of new listings and advisory mandates.\u003c/li>\u003cli>\u003cb>Economic\u003c/b> — growth, interest rates, inflation and exchange rates; rising deposit rates draw retail money away from equities, reducing brokerage volumes and margin lending.\u003c/li>\u003cli>\u003cb>Social\u003c/b> — demographics and behaviour; a young, digitally literate population with rising incomes has driven rapid growth in retail brokerage accounts.\u003c/li>\u003cli>\u003cb>Technological\u003c/b> — online and mobile trading platforms have compressed commissions and shifted competition toward technology and financing services.\u003c/li>\u003cli>\u003cb>Environmental\u003c/b> — growing investor demand for ESG disclosure affects which companies attract capital and creates new advisory work.\u003c/li>\u003cli>\u003cb>Legal\u003c/b> — the Law on Securities 2019, margin regulations, corporate-bond decrees and listing conditions directly determine what firms may do and on what terms.\u003c/li>\u003c/ul>\u003cp>The purpose is not description but \u003cb>discipline\u003c/b>: PESTEL identifies which external forces could change the industry's profitability, and those judgements should then be visible in the assumptions of any valuation of a company in it.\u003c/p>","rubric":"Six factors correctly expanded (0.8) · a plausible Vietnamese example for at least five (0.8) · purpose linked to valuation assumptions (0.4).","qVi":"Giải thích khung PESTEL và cho một ví dụ tại Việt Nam cho mỗi yếu tố tác động đến ngành chứng khoán.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>PESTEL\u003c/b> phân tích môi trường vĩ mô bên ngoài định hình một ngành.\u003c/p>\u003cul>\u003cli>\u003cb>Chính trị\u003c/b> — chính sách của Nhà nước về phát triển thị trường và thoái vốn nhà nước; ví dụ, tốc độ cổ phần hóa doanh nghiệp nhà nước quyết định nguồn cung các đợt niêm yết mới và hợp đồng tư vấn.\u003c/li>\u003cli>\u003cb>Kinh tế\u003c/b> — tăng trưởng, lãi suất, lạm phát và tỷ giá; lãi suất tiền gửi tăng hút tiền của nhà đầu tư cá nhân khỏi cổ phiếu, làm giảm khối lượng môi giới và cho vay ký quỹ.\u003c/li>\u003cli>\u003cb>Xã hội\u003c/b> — nhân khẩu học và hành vi; một dân số trẻ, thành thạo công nghệ số với thu nhập tăng đã thúc đẩy tăng trưởng nhanh số tài khoản môi giới cá nhân.\u003c/li>\u003cli>\u003cb>Công nghệ\u003c/b> — nền tảng giao dịch trực tuyến và di động đã nén hoa hồng và đẩy cạnh tranh sang phía công nghệ cùng các dịch vụ tài trợ.\u003c/li>\u003cli>\u003cb>Môi trường\u003c/b> — nhu cầu ngày càng lớn của nhà đầu tư về công bố thông tin ESG ảnh hưởng tới việc doanh nghiệp nào thu hút được vốn và tạo ra công việc tư vấn mới.\u003c/li>\u003cli>\u003cb>Pháp lý\u003c/b> — Luật Chứng khoán 2019, quy định về ký quỹ, các nghị định về trái phiếu doanh nghiệp và điều kiện niêm yết trực tiếp quyết định các công ty được làm gì và với điều kiện nào.\u003c/li>\u003c/ul>\u003cp>Mục đích không phải là mô tả mà là \u003cb>tạo kỷ luật\u003c/b>: PESTEL nhận diện những lực bên ngoài nào có thể thay đổi khả năng sinh lời của ngành, và các phán đoán đó sau đó phải hiện rõ trong các giả định của bất kỳ cuộc định giá nào đối với một doanh nghiệp trong ngành.\u003c/p>","rubricVi":"Sáu yếu tố được triển khai đúng (0,8) · một ví dụ Việt Nam hợp lý cho ít nhất năm yếu tố (0,8) · mục đích gắn với giả định định giá (0,4)."},{"id":"M5-02","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the difference between horizontal and vertical analysis of financial statements and what each reveals.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Horizontal analysis\u003c/b> compares each line item \u003cb>across successive periods\u003c/b>, expressing the change in absolute or percentage terms — for example revenue rising 12% and then 15% while cost of sales rises 14% and 22%. It reveals \u003cb>trends and growth rates\u003c/b>, and, critically, \u003cb>divergences\u003c/b>: a line growing materially faster than the line it should track is a warning. Receivables growing far faster than revenue suggests collection problems or aggressive revenue recognition; inventory outpacing cost of sales suggests obsolescence or weakening demand.\u003c/p>\u003cp>\u003cb>Vertical analysis\u003c/b> — also called common-size analysis — expresses every item as a \u003cb>percentage of a base figure\u003c/b> within a single period: income-statement items as a percentage of revenue, balance-sheet items as a percentage of total assets. It reveals \u003cb>structure and composition\u003c/b>: the gross margin, the proportion of revenue consumed by each cost category, the mix of assets, and the balance between debt and equity funding.\u003c/p>\u003cp>\u003cb>Why both are needed.\u003c/b> Vertical analysis makes companies of \u003cb>different sizes comparable\u003c/b>, both against peers and against industry norms — an essential step before applying comparable-company multiples. Horizontal analysis shows the \u003cb>direction of travel\u003c/b> that a single-period snapshot conceals. Used together on several years they identify both the level and the trajectory of performance, and they are the routine first step in the financial due diligence and quality-of-earnings work that precedes any valuation.\u003c/p>","rubric":"Horizontal analysis defined with the divergence insight (0.7) · vertical analysis defined with what it reveals (0.6) · complementary use incl. cross-company comparability and the link to diligence (0.7).","qVi":"Giải thích sự khác biệt giữa phân tích ngang và phân tích dọc báo cáo tài chính và mỗi phương pháp bộc lộ điều gì.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Phân tích ngang\u003c/b> so sánh từng khoản mục \u003cb>qua các kỳ liên tiếp\u003c/b>, biểu diễn thay đổi theo số tuyệt đối hoặc phần trăm — ví dụ doanh thu tăng 12% rồi 15% trong khi giá vốn hàng bán tăng 14% rồi 22%. Nó bộc lộ \u003cb>xu hướng và tốc độ tăng trưởng\u003c/b>, và, quan trọng nhất, các \u003cb>sự phân kỳ\u003c/b>: một khoản mục tăng nhanh hơn đáng kể so với khoản mục mà nó lẽ ra phải bám theo là một cảnh báo. Khoản phải thu tăng nhanh hơn nhiều so với doanh thu gợi ý vấn đề thu hồi công nợ hoặc ghi nhận doanh thu mạo hiểm; hàng tồn kho vượt giá vốn hàng bán gợi ý hàng lỗi thời hoặc nhu cầu suy yếu.\u003c/p>\u003cp>\u003cb>Phân tích dọc\u003c/b> — còn gọi là phân tích quy mô chung — biểu diễn mỗi khoản mục dưới dạng \u003cb>phần trăm của một con số cơ sở\u003c/b> trong một kỳ duy nhất: các khoản mục báo cáo kết quả kinh doanh theo phần trăm doanh thu, các khoản mục bảng cân đối theo phần trăm tổng tài sản. Nó bộc lộ \u003cb>cấu trúc và thành phần\u003c/b>: biên lợi nhuận gộp, tỷ trọng doanh thu bị mỗi loại chi phí tiêu tốn, cơ cấu tài sản, và sự cân bằng giữa tài trợ bằng nợ và vốn chủ.\u003c/p>\u003cp>\u003cb>Vì sao cần cả hai.\u003c/b> Phân tích dọc làm cho các doanh nghiệp \u003cb>quy mô khác nhau trở nên so sánh được\u003c/b>, cả với nhóm so sánh lẫn với chuẩn ngành — một bước thiết yếu trước khi áp dụng bội số của công ty so sánh. Phân tích ngang cho thấy \u003cb>hướng đi\u003c/b> mà một ảnh chụp một kỳ duy nhất che giấu. Dùng cùng nhau trên nhiều năm, chúng nhận diện cả mức độ lẫn quỹ đạo của hiệu quả hoạt động, và là bước đầu tiên thường lệ trong công việc thẩm định tài chính và rà soát chất lượng lợi nhuận trước bất kỳ cuộc định giá nào.\u003c/p>","rubricVi":"Định nghĩa phân tích ngang với nhận thức về sự phân kỳ (0,7) · định nghĩa phân tích dọc với những gì nó bộc lộ (0,6) · sử dụng bổ trợ gồm khả năng so sánh giữa các công ty và liên hệ tới thẩm định (0,7)."},{"id":"M5-03","ch":5,"type":"calc-essay","clo":"CLO2","marks":2,"exam":"final","q":"A company will pay a dividend of VND 4,000 next year. Investors require 13%. (a) Value the share if growth is 5% forever. (b) Value it if growth is 5% for 3 years then 3% forever, with year-4 dividend of VND 4,772. (c) Comment on the difference.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Constant growth: P0 = D1 ÷ (r − g) = 4,000 ÷ (0.13 − 0.05) = 4,000 ÷ 0.08 = \u003cb>VND 50,000\u003c/b>.\u003c/p>\u003cp>(b) Two-stage. Dividends: D1 = 4,000; D2 = 4,200; D3 = 4,410.\u003cbr>Discount factors at 13%: 0.8850, 0.7831, 0.6931.\u003cbr>PV of D1–D3 = 3,540 + 3,289 + 3,057 = \u003cb>VND 9,886\u003c/b>.\u003c/p>\u003cp>Terminal value at end of year 3 = D4 ÷ (r − g₂) = 4,772 ÷ (0.13 − 0.03) = 4,772 ÷ 0.10 = \u003cb>VND 47,720\u003c/b>.\u003cbr>PV of terminal value = 47,720 × 0.6931 = \u003cb>VND 33,075\u003c/b>.\u003c/p>\u003cp>Total value = 9,886 + 33,075 = \u003cb>VND 42,961\u003c/b>.\u003c/p>\u003cp>(c) The two-stage value is about \u003cb>14% lower\u003c/b>. The reason is that the perpetual growth rate falls from 5% to 3%, which widens the perpetuity denominator from 0.08 to 0.10 — and since value is inversely proportional to that denominator, a two-percentage-point reduction in long-run growth reduces the capitalised value by roughly a fifth.\u003c/p>\u003cp>The wider lesson is that the single-stage model's assumption of \u003cb>constant growth in perpetuity\u003c/b> is rarely realistic: competitive advantage fades, and a growth rate above the long-run nominal growth of the economy cannot be sustained indefinitely. Multi-stage models make the fade explicit. In both cases the terminal value dominates — here it is 77% of the total — so the long-run growth assumption, not the near-term forecast, is what the valuation actually rests on.\u003c/p>","rubric":"(a) 0.4 · (b) explicit-period PVs and terminal value correctly discounted (0.9) · (c) explanation via the denominator and the fade rationale (0.5) · terminal-value dominance observation (0.2).","qVi":"Một công ty sẽ trả cổ tức 4.000 đồng vào năm tới. Nhà đầu tư đòi hỏi 13%. (a) Định giá cổ phần nếu tăng trưởng là 5% vĩnh viễn. (b) Định giá nếu tăng trưởng là 5% trong 3 năm rồi 3% vĩnh viễn, với cổ tức năm 4 là 4.772 đồng. (c) Bình luận về sự khác biệt.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Tăng trưởng không đổi: P0 = D1 ÷ (r − g) = 4.000 ÷ (0,13 − 0,05) = 4.000 ÷ 0,08 = \u003cb>50.000 đồng\u003c/b>.\u003c/p>\u003cp>(b) Hai giai đoạn. Cổ tức: D1 = 4.000; D2 = 4.200; D3 = 4.410.\u003cbr>Hệ số chiết khấu ở 13%: 0,8850; 0,7831; 0,6931.\u003cbr>PV của D1–D3 = 3.540 + 3.289 + 3.057 = \u003cb>9.886 đồng\u003c/b>.\u003c/p>\u003cp>Giá trị cuối kỳ tại cuối năm 3 = D4 ÷ (r − g₂) = 4.772 ÷ (0,13 − 0,03) = 4.772 ÷ 0,10 = \u003cb>47.720 đồng\u003c/b>.\u003cbr>PV của giá trị cuối kỳ = 47.720 × 0,6931 = \u003cb>33.075 đồng\u003c/b>.\u003c/p>\u003cp>Tổng giá trị = 9.886 + 33.075 = \u003cb>42.961 đồng\u003c/b>.\u003c/p>\u003cp>(c) Giá trị hai giai đoạn thấp hơn khoảng \u003cb>14%\u003c/b>. Lý do là tốc độ tăng trưởng vĩnh viễn giảm từ 5% xuống 3%, làm rộng mẫu số của công thức vĩnh viễn từ 0,08 lên 0,10 — và vì giá trị tỷ lệ nghịch với mẫu số đó, một mức giảm hai điểm phần trăm của tăng trưởng dài hạn làm giảm giá trị được vốn hóa khoảng một phần năm.\u003c/p>\u003cp>Bài học rộng hơn là giả định \u003cb>tăng trưởng không đổi vĩnh viễn\u003c/b> của mô hình một giai đoạn hiếm khi thực tế: lợi thế cạnh tranh phai nhạt, và một tốc độ tăng trưởng cao hơn tăng trưởng danh nghĩa dài hạn của nền kinh tế không thể duy trì vô hạn. Các mô hình nhiều giai đoạn làm cho sự phai nhạt đó trở nên tường minh. Trong cả hai trường hợp, giá trị cuối kỳ đều chi phối — ở đây là 77% tổng giá trị — nên giả định tăng trưởng dài hạn, chứ không phải dự phóng ngắn hạn, mới là thứ mà cuộc định giá thực sự dựa vào.\u003c/p>","rubricVi":"(a) 0,4 · (b) giá trị hiện tại giai đoạn tường minh và giá trị cuối kỳ được chiết khấu đúng (0,9) · (c) giải thích qua mẫu số và lý do phai nhạt (0,5) · nhận xét về sự chi phối của giá trị cuối kỳ (0,2)."},{"id":"M5-04","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what the residual income model is and when it is preferable to a dividend discount model.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>residual income model\u003c/b> values equity as the current \u003cb>book value\u003c/b> plus the present value of future \u003cb>residual income\u003c/b>, where residual income for a period is:\u003c/p>\u003cp>\u003cb>RI = Net income − (cost of equity × opening book value)\u003c/b>\u003c/p>\u003cp>That is, the profit earned \u003ci>in excess of\u003c/i> a capital charge for the equity employed. If a company earns exactly its cost of equity, residual income is zero and the shares are worth book value; if it earns more, the shares are worth a premium to book; if less, a discount. This is why it explains the relationship between P/B and ROE so directly.\u003c/p>\u003cp>\u003cb>When it is preferable to the DDM.\u003c/b> (1) The company \u003cb>pays no dividends\u003c/b>, or its payout bears no relation to earning power — the DDM is then unusable or arbitrary. (2) \u003cb>Cash flows are negative or erratic\u003c/b> in the forecast period, as for a growing company, making both DDM and DCF unstable. (3) A large part of value is recognised \u003cb>immediately\u003c/b> in book value rather than deferred into a terminal value, so the valuation depends less on the most uncertain assumption — a significant practical advantage, since terminal value often carries 70–80% of a DCF. (4) It suits firms whose assets are \u003cb>fairly stated\u003c/b> on the balance sheet, notably financial institutions, which is why it is common in bank valuation.\u003c/p>\u003cp>\u003cb>The limitation\u003c/b> is its dependence on \u003cb>accounting quality\u003c/b>: book value and earnings must be reliable, and adjustments are needed where accounting policy distorts them.\u003c/p>","rubric":"Formula and interpretation with the P/B–ROE link (0.8) · at least three circumstances where it is preferable (0.8) · accounting-quality limitation (0.4).","qVi":"Giải thích mô hình thu nhập thặng dư là gì và khi nào nó ưu việt hơn mô hình chiết khấu cổ tức.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Mô hình thu nhập thặng dư\u003c/b> định giá vốn chủ bằng \u003cb>giá trị sổ sách\u003c/b> hiện tại cộng giá trị hiện tại của \u003cb>thu nhập thặng dư\u003c/b> tương lai, trong đó thu nhập thặng dư của một kỳ là:\u003c/p>\u003cp>\u003cb>RI = Lợi nhuận ròng − (chi phí vốn chủ × giá trị sổ sách đầu kỳ)\u003c/b>\u003c/p>\u003cp>Tức là phần lợi nhuận kiếm được \u003ci>vượt quá\u003c/i> một khoản phí vốn cho phần vốn chủ được sử dụng. Nếu một công ty kiếm đúng bằng chi phí vốn chủ của mình, thu nhập thặng dư bằng 0 và cổ phần có giá trị bằng giá trị sổ sách; nếu kiếm nhiều hơn, cổ phần có giá trị cao hơn giá trị sổ sách; nếu ít hơn, thấp hơn. Đây là lý do nó giải thích quan hệ giữa P/B và ROE một cách trực tiếp đến vậy.\u003c/p>\u003cp>\u003cb>Khi nào ưu việt hơn mô hình chiết khấu cổ tức.\u003c/b> (1) Công ty \u003cb>không trả cổ tức\u003c/b>, hoặc tỷ lệ chi trả không liên quan gì tới khả năng sinh lời — khi đó mô hình chiết khấu cổ tức không dùng được hoặc trở nên tùy tiện. (2) \u003cb>Dòng tiền âm hoặc thất thường\u003c/b> trong giai đoạn dự phóng, như với một công ty đang tăng trưởng, khiến cả DDM lẫn DCF đều bất ổn. (3) Một phần lớn giá trị được ghi nhận \u003cb>ngay lập tức\u003c/b> trong giá trị sổ sách thay vì bị dồn vào một giá trị cuối kỳ, nên cuộc định giá ít phụ thuộc hơn vào giả định bất định nhất — một lợi thế thực tiễn đáng kể, vì giá trị cuối kỳ thường chiếm 70–80% của một mô hình DCF. (4) Nó phù hợp với các doanh nghiệp có tài sản được \u003cb>trình bày sát thực\u003c/b> trên bảng cân đối, đặc biệt là các định chế tài chính, đó là lý do nó phổ biến trong định giá ngân hàng.\u003c/p>\u003cp>\u003cb>Hạn chế\u003c/b> của nó là sự phụ thuộc vào \u003cb>chất lượng kế toán\u003c/b>: giá trị sổ sách và lợi nhuận phải đáng tin cậy, và cần điều chỉnh khi chính sách kế toán làm méo chúng.\u003c/p>","rubricVi":"Công thức và diễn giải với liên hệ P/B–ROE (0,8) · ít nhất ba hoàn cảnh ưu việt hơn (0,8) · hạn chế về chất lượng kế toán (0,4)."},{"id":"M5-05","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what a spin-off is, how it differs from a carve-out, and why a company might choose either.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>spin-off\u003c/b> distributes the shares of a subsidiary \u003cb>pro rata to the parent's existing shareholders\u003c/b>. No cash changes hands and no new investor is introduced: shareholders simply end up holding two separate listed companies instead of one. It is usually structured to be tax-efficient.\u003c/p>\u003cp>An \u003cb>equity carve-out\u003c/b> sells a \u003cb>minority stake\u003c/b> in the subsidiary to new investors through an IPO. The parent \u003cb>raises cash\u003c/b> and establishes a public market price for the subsidiary while \u003cb>retaining control\u003c/b>.\u003c/p>\u003cp>\u003cb>Choosing between them.\u003c/b> A \u003cb>spin-off\u003c/b> is preferred where the objective is purely to let the market value two dissimilar businesses separately — closing the conglomerate discount — where the parent does not need cash, and where a clean and complete separation is wanted so that each company can pursue its own strategy, capital structure and investor base.\u003c/p>\u003cp>A \u003cb>carve-out\u003c/b> is preferred where the parent \u003cb>needs capital\u003c/b>, where it wishes to retain strategic control of the subsidiary, where it wants to establish a valuation benchmark before a possible later full separation, or where the subsidiary needs its own currency to make acquisitions and incentivise management. Carve-outs are frequently a \u003cb>first step\u003c/b>, later followed by a spin-off or sale of the residual stake.\u003c/p>\u003cp>Both are responses to a \u003cb>sum-of-the-parts\u003c/b> analysis showing that the group trades below the aggregate value of its divisions.\u003c/p>","rubric":"Both transactions correctly defined incl. cash and control consequences (0.8) · reasons for choosing a spin-off (0.5) · reasons for choosing a carve-out incl. the staged approach (0.5) · SOTP as the common trigger (0.2).","qVi":"Giải thích chia tách (spin-off) là gì, nó khác chào bán một phần (carve-out) thế nào, và vì sao một công ty có thể chọn phương án nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>chia tách\u003c/b> phân phối cổ phần của công ty con \u003cb>theo tỷ lệ cho cổ đông hiện hữu của công ty mẹ\u003c/b>. Không có tiền mặt nào đổi chủ và không có nhà đầu tư mới nào được đưa vào: cổ đông đơn giản là kết thúc với việc nắm giữ hai công ty niêm yết riêng biệt thay vì một. Nó thường được cấu trúc để hiệu quả về thuế.\u003c/p>\u003cp>Một \u003cb>chào bán một phần vốn chủ\u003c/b> bán một \u003cb>tỷ lệ thiểu số\u003c/b> trong công ty con cho nhà đầu tư mới qua IPO. Công ty mẹ \u003cb>huy động được tiền mặt\u003c/b> và thiết lập một mức giá thị trường công khai cho công ty con trong khi \u003cb>vẫn giữ quyền kiểm soát\u003c/b>.\u003c/p>\u003cp>\u003cb>Lựa chọn giữa hai phương án.\u003c/b> \u003cb>Chia tách\u003c/b> được ưa chuộng khi mục tiêu thuần túy là để thị trường định giá riêng hai doanh nghiệp không tương đồng — khép lại chiết khấu tập đoàn — khi công ty mẹ không cần tiền mặt, và khi muốn một sự tách bạch sạch sẽ và trọn vẹn để mỗi công ty theo đuổi chiến lược, cấu trúc vốn và nền nhà đầu tư riêng.\u003c/p>\u003cp>\u003cb>Chào bán một phần\u003c/b> được ưa chuộng khi công ty mẹ \u003cb>cần vốn\u003c/b>, khi muốn giữ quyền kiểm soát chiến lược với công ty con, khi muốn thiết lập một mốc định giá trước một khả năng tách bạch hoàn toàn về sau, hoặc khi công ty con cần phương tiện riêng để thực hiện thâu tóm và khích lệ ban điều hành. Chào bán một phần thường là \u003cb>bước đầu tiên\u003c/b>, sau đó được tiếp nối bằng một cuộc chia tách hoặc bán phần vốn còn lại.\u003c/p>\u003cp>Cả hai đều là phản ứng trước một phân tích \u003cb>tổng các bộ phận\u003c/b> cho thấy tập đoàn giao dịch thấp hơn tổng giá trị các bộ phận của nó.\u003c/p>","rubricVi":"Định nghĩa đúng cả hai giao dịch gồm hệ quả về tiền mặt và quyền kiểm soát (0,8) · lý do chọn chia tách (0,5) · lý do chọn chào bán một phần gồm cách tiếp cận theo giai đoạn (0,5) · SOTP như yếu tố kích hoạt chung (0,2)."},{"id":"M5-06","ch":5,"type":"case","clo":"CLO2","marks":3,"exam":"final","q":"A company wishes to list but its financial statements show large loans to entities owned by the chairman's family. Analyse the problem and advise on the remedial steps.","guide":"\u003cp>\u003cb>Model answer — the problem.\u003c/b> These are \u003cb>related-party transactions\u003c/b>, and they are the single issue institutional investors scrutinise most closely in a controlled company.\u003c/p>\u003cp>The concerns are: (1) \u003cb>Value extraction\u003c/b> — company funds have been advanced to entities benefiting the controlling family, possibly on non-commercial terms, at the expense of the company and its future minority shareholders. (2) \u003cb>Recoverability\u003c/b> — the loans may be uncollectible, meaning assets and therefore equity are overstated. (3) \u003cb>Governance failure\u003c/b> — the transactions indicate the board did not act independently of the controlling shareholder. (4) \u003cb>Disclosure and legal risk\u003c/b> — such transactions must be disclosed in the prospectus, and the regulator may query them; inadequate disclosure creates prospectus liability. (5) \u003cb>Valuation impact\u003c/b> — investors will apply a \u003cb>governance discount\u003c/b>, or refuse to participate, materially reducing the achievable offer price. (6) \u003cb>Precedent\u003c/b> — investors will assume the practice continues after listing unless it is demonstrably stopped.\u003c/p>\u003cp>\u003cb>Remedial steps.\u003c/b> First, \u003cb>identify and quantify\u003c/b> every related-party balance and transaction across the group, with independent verification. Second, \u003cb>repay or unwind\u003c/b> the loans before listing — ideally settled in cash by the related parties, which is the only fully satisfactory outcome; where repayment is impossible, the balances must be provided against, with the effect on earnings and equity reflected in the accounts and in the valuation. Third, for any relationship that must continue for genuine commercial reasons, \u003cb>formalise it on documented arm's-length terms\u003c/b> with independent valuation support. Fourth, \u003cb>strengthen governance\u003c/b> so recurrence is prevented: appoint independent directors, establish an audit committee with authority over related-party approvals, adopt a written related-party policy requiring independent approval and abstention by conflicted parties, and implement internal audit. Fifth, \u003cb>disclose fully\u003c/b> in the prospectus, including the historic position and the remediation. Sixth, obtain \u003cb>auditor comfort\u003c/b> on the restated position.\u003c/p>\u003cp>\u003cb>Advice to the client.\u003c/b> This is not merely a compliance exercise. Investors price this risk directly, so cleaning it up before listing will be recovered in the offer price — the argument that usually persuades a reluctant controlling family.\u003c/p>","rubric":"At least four problems incl. value extraction, recoverability and governance (1.2) · at least four remedial steps incl. unwinding, arm's-length formalisation and governance reform (1.2) · disclosure and auditor comfort (0.3) · commercial framing of the advice (0.3).","qVi":"Một công ty muốn niêm yết nhưng báo cáo tài chính cho thấy các khoản cho vay lớn đối với những thực thể do gia đình chủ tịch sở hữu. Phân tích vấn đề và tư vấn về các bước khắc phục.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — vấn đề.\u003c/b> Đây là các \u003cb>giao dịch với bên liên quan\u003c/b>, và chúng là vấn đề mà nhà đầu tư tổ chức soi xét kỹ nhất trong một công ty có cổ đông chi phối.\u003c/p>\u003cp>Các mối lo là: (1) \u003cb>Rút giá trị\u003c/b> — vốn của công ty đã được ứng cho các thực thể mang lợi cho gia đình kiểm soát, có thể với điều kiện không theo thị trường, gây thiệt hại cho công ty và cho các cổ đông thiểu số tương lai. (2) \u003cb>Khả năng thu hồi\u003c/b> — các khoản cho vay có thể không thu hồi được, nghĩa là tài sản và do đó vốn chủ đang bị thổi phồng. (3) \u003cb>Thất bại quản trị\u003c/b> — các giao dịch cho thấy hội đồng quản trị đã không hành động độc lập với cổ đông kiểm soát. (4) \u003cb>Rủi ro công bố và pháp lý\u003c/b> — các giao dịch như vậy phải được công bố trong bản cáo bạch, và cơ quan quản lý có thể chất vấn; công bố không đầy đủ tạo ra trách nhiệm pháp lý về bản cáo bạch. (5) \u003cb>Tác động định giá\u003c/b> — nhà đầu tư sẽ áp một \u003cb>chiết khấu quản trị\u003c/b>, hoặc từ chối tham gia, làm giảm đáng kể giá chào bán đạt được. (6) \u003cb>Tiền lệ\u003c/b> — nhà đầu tư sẽ cho rằng thực tiễn này tiếp diễn sau niêm yết trừ khi nó được chứng minh là đã chấm dứt.\u003c/p>\u003cp>\u003cb>Các bước khắc phục.\u003c/b> Thứ nhất, \u003cb>nhận diện và định lượng\u003c/b> mọi số dư và giao dịch với bên liên quan trong toàn tập đoàn, có kiểm chứng độc lập. Thứ hai, \u003cb>hoàn trả hoặc gỡ bỏ\u003c/b> các khoản cho vay trước khi niêm yết — lý tưởng là được các bên liên quan thanh toán bằng tiền mặt, đây là kết cục duy nhất thỏa đáng hoàn toàn; nơi không thể hoàn trả, các số dư phải được trích lập dự phòng, với tác động lên lợi nhuận và vốn chủ được phản ánh trong sổ sách và trong định giá. Thứ ba, với bất kỳ quan hệ nào phải tiếp tục vì lý do thương mại chính đáng, \u003cb>chính thức hóa nó theo điều kiện thị trường có ghi chép\u003c/b> kèm hỗ trợ định giá độc lập. Thứ tư, \u003cb>tăng cường quản trị\u003c/b> để ngăn tái diễn: bổ nhiệm thành viên hội đồng quản trị độc lập, thiết lập một ủy ban kiểm toán có thẩm quyền đối với việc phê duyệt giao dịch với bên liên quan, ban hành một chính sách bằng văn bản về giao dịch với bên liên quan yêu cầu phê duyệt độc lập và việc rút lui của các bên có xung đột, và triển khai kiểm toán nội bộ. Thứ năm, \u003cb>công bố đầy đủ\u003c/b> trong bản cáo bạch, gồm cả tình trạng lịch sử và việc khắc phục. Thứ sáu, lấy \u003cb>ý kiến bảo đảm của kiểm toán\u003c/b> về tình trạng đã điều chỉnh.\u003c/p>\u003cp>\u003cb>Lời khuyên cho khách hàng.\u003c/b> Đây không chỉ là một bài tập tuân thủ. Nhà đầu tư định giá rủi ro này một cách trực tiếp, nên việc làm sạch nó trước khi niêm yết sẽ được thu hồi qua giá chào bán — lập luận thường thuyết phục được một gia đình kiểm soát còn e ngại.\u003c/p>","rubricVi":"Ít nhất bốn vấn đề gồm rút giá trị, khả năng thu hồi và quản trị (1,2) · ít nhất bốn bước khắc phục gồm gỡ bỏ, chính thức hóa theo điều kiện thị trường và cải cách quản trị (1,2) · công bố và ý kiến bảo đảm của kiểm toán (0,3) · cách đặt vấn đề mang tính thương mại của lời khuyên (0,3)."},{"id":"M6-01","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain what liquidity means in a securities market and the indicators used to measure it.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Liquidity\u003c/b> is the ability to trade a meaningful quantity of a security \u003cb>quickly\u003c/b>, at a price \u003cb>close to the prevailing market price\u003c/b>, and at \u003cb>low transaction cost\u003c/b>. A liquid market allows an investor to convert a position into cash without materially moving the price against themselves.\u003c/p>\u003cp>\u003cb>Indicators.\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>Bid-ask spread\u003c/b> — the most direct measure. Narrow spreads mean low cost of immediacy; spreads widen when dealers face higher inventory and adverse-selection risk.\u003c/li>\u003cli>\u003cb>Depth\u003c/b> — the volume available at and near the best bid and offer, showing how large an order the book can absorb without moving the price.\u003c/li>\u003cli>\u003cb>Trading volume and turnover ratio\u003c/b> (volume relative to free float), indicating how actively the security changes hands.\u003c/li>\u003cli>\u003cb>Price impact / slippage\u003c/b> — how far the execution price of a given order size deviates from the pre-trade price; the most direct measure for a large investor.\u003c/li>\u003cli>\u003cb>Resilience\u003c/b> — how quickly the book replenishes and the price recovers after a large trade.\u003c/li>\u003cli>\u003cb>Free float\u003c/b> — a small float structurally limits liquidity however active trading appears.\u003c/li>\u003c/ul>\u003cp>\u003cb>Why it matters.\u003c/b> Illiquid securities trade at a \u003cb>discount\u003c/b>, because investors demand compensation for the difficulty of exit. Liquidity is also \u003cb>state-dependent\u003c/b>: it evaporates precisely in stressed markets, when spreads widen, depth collapses and investors most need to sell — which is why liquidity risk must be managed in advance rather than assumed.\u003c/p>","rubric":"Definition covering speed, price and cost (0.6) · at least four indicators correctly explained (0.9) · liquidity discount and state-dependence (0.5).","qVi":"Giải thích thanh khoản trong một thị trường chứng khoán nghĩa là gì và các chỉ báo dùng để đo lường nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Thanh khoản\u003c/b> là khả năng giao dịch một khối lượng đáng kể của một chứng khoán một cách \u003cb>nhanh chóng\u003c/b>, ở mức giá \u003cb>sát với giá thị trường hiện hành\u003c/b>, và với \u003cb>chi phí giao dịch thấp\u003c/b>. Một thị trường thanh khoản cho phép nhà đầu tư chuyển một vị thế thành tiền mặt mà không làm giá dịch chuyển bất lợi đáng kể cho chính mình.\u003c/p>\u003cp>\u003cb>Các chỉ báo.\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>Chênh lệch giá đặt mua – chào bán\u003c/b> — thước đo trực tiếp nhất. Chênh lệch hẹp nghĩa là chi phí của tính tức thời thấp; chênh lệch nới rộng khi nhà tạo lập đối mặt rủi ro tồn kho và lựa chọn bất lợi cao hơn.\u003c/li>\u003cli>\u003cb>Độ sâu\u003c/b> — khối lượng có sẵn tại và gần mức giá đặt mua và chào bán tốt nhất, cho thấy sổ lệnh có thể hấp thụ một lệnh lớn đến đâu mà không làm dịch chuyển giá.\u003c/li>\u003cli>\u003cb>Khối lượng giao dịch và hệ số vòng quay\u003c/b> (khối lượng so với lượng cổ phần tự do lưu hành), cho biết chứng khoán được sang tay tích cực đến mức nào.\u003c/li>\u003cli>\u003cb>Tác động giá / trượt giá\u003c/b> — mức mà giá thực hiện của một lệnh có quy mô nhất định lệch khỏi giá trước giao dịch; là thước đo trực tiếp nhất với một nhà đầu tư lớn.\u003c/li>\u003cli>\u003cb>Khả năng phục hồi\u003c/b> — sổ lệnh được bổ sung và giá hồi phục nhanh đến đâu sau một giao dịch lớn.\u003c/li>\u003cli>\u003cb>Lượng cổ phần tự do lưu hành\u003c/b> — lượng nhỏ sẽ giới hạn thanh khoản một cách cấu trúc dù giao dịch có vẻ sôi động đến đâu.\u003c/li>\u003c/ul>\u003cp>\u003cb>Vì sao nó quan trọng.\u003c/b> Các chứng khoán kém thanh khoản giao dịch với một mức \u003cb>chiết khấu\u003c/b>, vì nhà đầu tư đòi bù đắp cho sự khó khăn khi thoát ra. Thanh khoản cũng \u003cb>phụ thuộc trạng thái\u003c/b>: nó bốc hơi đúng trong các thị trường căng thẳng, khi chênh lệch giá nới rộng, độ sâu sụp đổ và nhà đầu tư cần bán nhất — đó là lý do rủi ro thanh khoản phải được quản trị từ trước chứ không phải được mặc định là có.\u003c/p>","rubricVi":"Định nghĩa bao quát tốc độ, giá và chi phí (0,6) · ít nhất bốn chỉ báo được giải thích đúng (0,9) · chiết khấu thanh khoản và sự phụ thuộc trạng thái (0,5)."},{"id":"M6-02","ch":6,"type":"calc-essay","clo":"CLO3","marks":2,"exam":"final","q":"An investor buys 8,000 shares at VND 65,000 using 50% margin. Maintenance margin is 30%. (a) Compute equity, loan and the margin-call price. (b) At VND 45,000, is a call triggered, and what is the return on equity?","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Position value = 8,000 × 65,000 = \u003cb>VND 520 million\u003c/b>.\u003cbr>Equity = 50% × 520m = \u003cb>VND 260 million\u003c/b>; loan = \u003cb>VND 260 million\u003c/b>.\u003cbr>Margin call price = 65,000 × (1 − 0.50) ÷ (1 − 0.30) = 65,000 × 0.5 ÷ 0.7 = \u003cb>VND 46,429\u003c/b>.\u003c/p>\u003cp>(b) At VND 45,000: market value = 8,000 × 45,000 = \u003cb>VND 360 million\u003c/b>.\u003cbr>Equity = 360 − 260 = \u003cb>VND 100 million\u003c/b>.\u003cbr>Equity ratio = 100 ÷ 360 = \u003cb>27.8%\u003c/b>, which is below the 30% maintenance requirement — and VND 45,000 is below the call price of VND 46,429. \u003cb>A margin call is triggered.\u003c/b>\u003c/p>\u003cp>Return on equity = (100 − 260) ÷ 260 = \u003cb>−61.5%\u003c/b> (before interest costs).\u003c/p>\u003cp>By comparison the unlevered return would be (45,000 − 65,000) ÷ 65,000 = \u003cb>−30.8%\u003c/b> — the 2× leverage has exactly doubled the loss. The investor must now deposit funds or securities to restore the 30% ratio, failing which the broker will liquidate part or all of the position, crystallising the loss and removing any possibility of benefiting from a subsequent recovery.\u003c/p>","rubric":"(a) equity, loan and call price (0.8) · (b) equity, ratio and correct call conclusion (0.6) · levered return with the unlevered comparison (0.6).","qVi":"Một nhà đầu tư mua 8.000 cổ phần giá 65.000 đồng dùng ký quỹ 50%. Ký quỹ duy trì là 30%. (a) Tính vốn chủ, khoản vay và giá gọi ký quỹ. (b) Ở mức 45.000 đồng, có kích hoạt lệnh gọi không, và tỷ suất trên vốn chủ là bao nhiêu?","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Giá trị vị thế = 8.000 × 65.000 = \u003cb>520 triệu đồng\u003c/b>.\u003cbr>Vốn chủ = 50% × 520 triệu = \u003cb>260 triệu đồng\u003c/b>; khoản vay = \u003cb>260 triệu đồng\u003c/b>.\u003cbr>Giá gọi ký quỹ = 65.000 × (1 − 0,50) ÷ (1 − 0,30) = 65.000 × 0,5 ÷ 0,7 = \u003cb>46.429 đồng\u003c/b>.\u003c/p>\u003cp>(b) Ở mức 45.000 đồng: giá trị thị trường = 8.000 × 45.000 = \u003cb>360 triệu đồng\u003c/b>.\u003cbr>Vốn chủ = 360 − 260 = \u003cb>100 triệu đồng\u003c/b>.\u003cbr>Tỷ lệ vốn chủ = 100 ÷ 360 = \u003cb>27,8%\u003c/b>, dưới yêu cầu duy trì 30% — và 45.000 đồng thấp hơn giá gọi 46.429 đồng. \u003cb>Lệnh gọi ký quỹ được kích hoạt.\u003c/b>\u003c/p>\u003cp>Tỷ suất trên vốn chủ = (100 − 260) ÷ 260 = \u003cb>−61,5%\u003c/b> (trước chi phí lãi vay).\u003c/p>\u003cp>Để so sánh, tỷ suất không đòn bẩy sẽ là (45.000 − 65.000) ÷ 65.000 = \u003cb>−30,8%\u003c/b> — đòn bẩy 2× đã nhân đôi chính xác khoản lỗ. Nhà đầu tư nay phải nộp thêm tiền hoặc chứng khoán để khôi phục tỷ lệ 30%, nếu không công ty môi giới sẽ thanh lý một phần hoặc toàn bộ vị thế, hiện thực hóa khoản lỗ và loại bỏ mọi khả năng hưởng lợi từ một đợt hồi phục sau đó.\u003c/p>","rubricVi":"(a) vốn chủ, khoản vay và giá gọi (0,8) · (b) vốn chủ, tỷ lệ và kết luận đúng về lệnh gọi (0,6) · tỷ suất có đòn bẩy với so sánh không đòn bẩy (0,6)."},{"id":"M6-03","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the risks a securities firm faces in proprietary trading and the controls that manage them.","guide":"\u003cp>\u003cb>Model answer — risks.\u003c/b> \u003cb>Market risk\u003c/b> — losses from adverse price, rate or volatility movements on positions held. \u003cb>Liquidity risk\u003c/b> — inability to exit a position at a reasonable price, especially in a concentrated or illiquid holding. \u003cb>Concentration risk\u003c/b> from excessive exposure to a single security, sector or counterparty. \u003cb>Model risk\u003c/b>, where valuations or hedges depend on assumptions that fail. \u003cb>Operational risk\u003c/b> — errors, system failure and unauthorised or concealed trading. \u003cb>Regulatory and conduct risk\u003c/b> — breaching position limits, trading on inside information, market manipulation, or failing to keep proprietary activity properly separated from client business. \u003cb>Reputational risk\u003c/b> if the firm is seen to trade against its own clients.\u003c/p>\u003cp>\u003cb>Controls.\u003c/b> A board-approved \u003cb>risk appetite\u003c/b> translated into \u003cb>position, concentration and VaR limits\u003c/b>, monitored in real time with automatic escalation of breaches. \u003cb>Stress testing\u003c/b> against extreme scenarios, recognising that VaR says nothing about the tail. \u003cb>Stop-loss\u003c/b> discipline and defined exit rules. \u003cb>Segregation of duties\u003c/b> — traders may not value, confirm or settle their own trades — supported by \u003cb>independent price verification\u003c/b> and \u003cb>daily P&amp;L attribution\u003c/b>, so unexplained profit is investigated. \u003cb>Client order priority\u003c/b> with separate accounts, systems and personnel from brokerage. \u003cb>Mandatory block leave\u003c/b> so another person must run the book, a classic method of surfacing concealment. \u003cb>Surveillance\u003c/b> of trading around research publication and client orders. And \u003cb>deferred, adjustable remuneration\u003c/b> so that profit later shown to be illusory can be clawed back.\u003c/p>","rubric":"At least four risks correctly identified (0.8) · at least five controls (0.9) · segregation of duties and independent verification specifically (0.3).","qVi":"Giải thích các rủi ro mà một công ty chứng khoán đối mặt trong hoạt động tự doanh và các biện pháp kiểm soát chúng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các rủi ro.\u003c/b> \u003cb>Rủi ro thị trường\u003c/b> — tổn thất từ biến động bất lợi của giá, lãi suất hoặc độ biến động trên các vị thế đang nắm giữ. \u003cb>Rủi ro thanh khoản\u003c/b> — không thể thoát khỏi một vị thế ở mức giá hợp lý, nhất là với một khoản nắm giữ tập trung hoặc kém thanh khoản. \u003cb>Rủi ro tập trung\u003c/b> do phơi nhiễm quá mức với một chứng khoán, một ngành hoặc một đối tác. \u003cb>Rủi ro mô hình\u003c/b>, khi việc định giá hoặc phòng ngừa rủi ro phụ thuộc vào các giả định bị sai. \u003cb>Rủi ro vận hành\u003c/b> — sai sót, sự cố hệ thống và giao dịch trái phép hoặc bị che giấu. \u003cb>Rủi ro pháp lý và ứng xử\u003c/b> — vi phạm giới hạn vị thế, giao dịch dựa trên thông tin nội bộ, thao túng thị trường, hoặc không tách bạch đúng mức hoạt động tự doanh khỏi hoạt động khách hàng. \u003cb>Rủi ro danh tiếng\u003c/b> nếu công ty bị xem là giao dịch đối nghịch với chính khách hàng của mình.\u003c/p>\u003cp>\u003cb>Các biện pháp kiểm soát.\u003c/b> Một \u003cb>khẩu vị rủi ro\u003c/b> được hội đồng quản trị phê duyệt và chuyển thành \u003cb>giới hạn vị thế, tập trung và VaR\u003c/b>, được giám sát theo thời gian thực với việc tự động báo cáo vi phạm lên trên. \u003cb>Kiểm tra sức chịu đựng\u003c/b> trước các kịch bản cực đoan, nhận thức rằng VaR không nói gì về phần đuôi phân phối. Kỷ luật \u003cb>cắt lỗ\u003c/b> và các quy tắc thoát vị thế xác định. \u003cb>Phân tách nhiệm vụ\u003c/b> — người giao dịch không được định giá, xác nhận hay thanh toán giao dịch của chính mình — được hỗ trợ bởi \u003cb>kiểm chứng giá độc lập\u003c/b> và \u003cb>phân bổ lãi/lỗ hằng ngày\u003c/b>, để phần lợi nhuận không giải thích được sẽ bị điều tra. \u003cb>Ưu tiên lệnh khách hàng\u003c/b> với tài khoản, hệ thống và nhân sự tách biệt khỏi mảng môi giới. \u003cb>Nghỉ phép bắt buộc liên tục\u003c/b> để một người khác phải vận hành sổ giao dịch, một phương pháp kinh điển làm lộ ra việc che giấu. \u003cb>Giám sát\u003c/b> hoạt động giao dịch quanh thời điểm công bố nghiên cứu và quanh các lệnh của khách hàng. Và \u003cb>thù lao được trì hoãn, có thể điều chỉnh\u003c/b> để phần lợi nhuận về sau chứng tỏ là ảo có thể được thu hồi.\u003c/p>","rubricVi":"Nhận diện đúng ít nhất bốn rủi ro (0,8) · ít nhất năm biện pháp kiểm soát (0,9) · cụ thể là phân tách nhiệm vụ và kiểm chứng độc lập (0,3)."},{"id":"M6-04","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain how electronic trading has changed the brokerage business and how firms have responded.","guide":"\u003cp>\u003cb>Model answer — changes.\u003c/b> \u003cb>Commission compression.\u003c/b> Electronic execution removed most of the cost and skill from order handling, and price competition — culminating in zero-commission offerings in several markets — has driven brokerage commission toward zero as a revenue line. \u003cb>Disintermediation of the adviser\u003c/b>: clients place their own orders through platforms and access information directly, so the broker's traditional informational advantage has largely disappeared. \u003cb>Speed and scale\u003c/b> have become decisive, with volumes fragmenting across venues and algorithmic execution replacing manual working of orders. \u003cb>Retail participation\u003c/b> has expanded dramatically, bringing large numbers of less experienced investors into the market. And \u003cb>technology has become the principal fixed cost\u003c/b>, favouring scale and driving consolidation.\u003c/p>\u003cp>\u003cb>Responses.\u003c/b> Firms have shifted revenue toward \u003cb>financing\u003c/b> — margin lending and securities lending — which is now the principal monetisation of the retail relationship. They have added \u003cb>value-added services\u003c/b>: research, advisory, wealth management, structured products and derivatives. Some accept \u003cb>payment for order flow\u003c/b>, funding zero commissions but creating a best-execution conflict that regulators scrutinise or restrict. Others compete on \u003cb>platform quality\u003c/b> — speed, tools, data and user experience — or pursue \u003cb>scale\u003c/b> through consolidation, or specialise in segments where advice still commands a fee.\u003c/p>\u003cp>The strategic consequence is that a broker is now substantially a \u003cb>technology and financing\u003c/b> business rather than an execution intermediary — which also means its risks have shifted toward credit, operational and cyber risk.\u003c/p>","rubric":"At least four changes incl. commission compression and technology cost (0.8) · at least four responses incl. financing and value-added services (0.8) · strategic conclusion or the PFOF conflict (0.4).","qVi":"Giải thích giao dịch điện tử đã thay đổi ngành môi giới như thế nào và các công ty đã ứng phó ra sao.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các thay đổi.\u003c/b> \u003cb>Nén hoa hồng.\u003c/b> Thực hiện lệnh điện tử đã loại bỏ phần lớn chi phí và kỹ năng trong việc xử lý lệnh, và cạnh tranh về giá — đỉnh điểm là các sản phẩm miễn hoa hồng ở một số thị trường — đã đẩy hoa hồng môi giới về gần bằng không như một dòng doanh thu. \u003cb>Loại bỏ vai trò trung gian của người tư vấn\u003c/b>: khách hàng tự đặt lệnh qua nền tảng và tiếp cận thông tin trực tiếp, nên lợi thế thông tin truyền thống của công ty môi giới phần lớn đã biến mất. \u003cb>Tốc độ và quy mô\u003c/b> đã trở nên quyết định, với khối lượng phân mảnh qua nhiều sàn và việc thực hiện bằng thuật toán thay thế cho việc xử lý lệnh thủ công. \u003cb>Sự tham gia của nhà đầu tư cá nhân\u003c/b> đã mở rộng mạnh mẽ, đưa một lượng lớn nhà đầu tư ít kinh nghiệm vào thị trường. Và \u003cb>công nghệ đã trở thành chi phí cố định chính\u003c/b>, tạo lợi thế cho quy mô và thúc đẩy sự hợp nhất.\u003c/p>\u003cp>\u003cb>Cách ứng phó.\u003c/b> Các công ty đã chuyển doanh thu sang \u003cb>hoạt động tài trợ\u003c/b> — cho vay ký quỹ và cho vay chứng khoán — nay là cách chính để tiền tệ hóa quan hệ với khách hàng cá nhân. Họ bổ sung \u003cb>dịch vụ giá trị gia tăng\u003c/b>: nghiên cứu, tư vấn, quản lý gia sản, sản phẩm cấu trúc và phái sinh. Một số chấp nhận \u003cb>thanh toán cho dòng lệnh\u003c/b>, tài trợ cho việc miễn hoa hồng nhưng tạo ra một xung đột về thực hiện tốt nhất mà cơ quan quản lý soi xét hoặc hạn chế. Số khác cạnh tranh bằng \u003cb>chất lượng nền tảng\u003c/b> — tốc độ, công cụ, dữ liệu và trải nghiệm người dùng — hoặc theo đuổi \u003cb>quy mô\u003c/b> qua hợp nhất, hoặc chuyên môn hóa vào các phân khúc nơi tư vấn vẫn thu được phí.\u003c/p>\u003cp>Hệ quả chiến lược là một công ty môi giới nay về cơ bản là một doanh nghiệp \u003cb>công nghệ và tài trợ\u003c/b> chứ không phải một trung gian thực hiện lệnh — điều này cũng nghĩa là rủi ro của họ đã chuyển sang phía tín dụng, vận hành và an ninh mạng.\u003c/p>","rubricVi":"Ít nhất bốn thay đổi gồm nén hoa hồng và chi phí công nghệ (0,8) · ít nhất bốn cách ứng phó gồm tài trợ và dịch vụ giá trị gia tăng (0,8) · kết luận chiến lược hoặc xung đột về thanh toán cho dòng lệnh (0,4)."},{"id":"M6-05","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the arguments for and against permitting short selling in a developing market such as Vietnam.","guide":"\u003cp>\u003cb>Model answer — arguments in favour.\u003c/b> \u003cb>Price discovery\u003c/b>: without short selling only optimists can express a view, so prices embed only positive opinions and overvaluation persists. Short sellers incorporate negative information, making prices more accurate. \u003cb>Liquidity\u003c/b>: shorts add two-way flow and are essential to market making, since a dealer must be able to sell stock it does not own to quote continuously. \u003cb>Fraud detection\u003c/b>: short sellers have a financial incentive to investigate and expose accounting fraud and overstatement, and have historically done so ahead of regulators. \u003cb>Hedging and derivatives\u003c/b>: short selling underpins arbitrage, index and derivatives markets, without which those products cannot be priced or hedged efficiently.\u003c/p>\u003cp>\u003cb>Arguments against.\u003c/b> \u003cb>Amplification\u003c/b>: in a falling market short selling adds supply and can accelerate declines, particularly where margin calls are simultaneously forcing sales. \u003cb>Settlement risk\u003c/b> from naked short selling, where the seller has not located a borrow and may fail to deliver — a serious concern where the lending market is underdeveloped. \u003cb>Manipulation\u003c/b> risk, through rumour combined with short positions, in a market with a large, less experienced retail base. \u003cb>Infrastructure requirements\u003c/b>: short selling needs a functioning securities-lending market, reliable custody, effective surveillance and settlement discipline, which take time to build. \u003cb>Investor protection and confidence\u003c/b> concerns in a market where financial literacy is still developing.\u003c/p>\u003cp>\u003cb>Balanced conclusion.\u003c/b> The mainstream position is that short selling should be permitted but \u003cb>covered\u003c/b> — requiring a located borrow — and subject to disclosure of large positions, an eligible-securities list, and the capacity for temporary restrictions in stressed conditions. Vietnam's cautious approach reflects genuine infrastructure and protection concerns rather than an objection in principle, and liberalisation appropriately follows the development of the securities-lending and settlement framework.\u003c/p>","rubric":"At least three arguments in favour (0.7) · at least three against (0.7) · balanced conclusion identifying covered short selling with safeguards (0.6).","qVi":"Giải thích các lập luận ủng hộ và phản đối việc cho phép bán khống trong một thị trường đang phát triển như Việt Nam.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — lập luận ủng hộ.\u003c/b> \u003cb>Khám phá giá\u003c/b>: nếu không có bán khống thì chỉ những người lạc quan mới thể hiện được quan điểm, nên giá chỉ chứa đựng các ý kiến tích cực và tình trạng định giá quá cao kéo dài. Người bán khống đưa thông tin tiêu cực vào giá, làm giá chính xác hơn. \u003cb>Thanh khoản\u003c/b>: bán khống bổ sung dòng lệnh hai chiều và là thiết yếu với việc tạo lập thị trường, vì nhà tạo lập phải bán được cổ phiếu mình không sở hữu để yết giá liên tục. \u003cb>Phát hiện gian lận\u003c/b>: người bán khống có động cơ tài chính để điều tra và phơi bày gian lận kế toán cùng việc thổi phồng, và trong lịch sử đã làm điều đó trước cả cơ quan quản lý. \u003cb>Phòng ngừa rủi ro và phái sinh\u003c/b>: bán khống là nền tảng cho kinh doanh chênh lệch giá, thị trường chỉ số và phái sinh, thiếu nó thì các sản phẩm này không thể được định giá hay phòng ngừa rủi ro hiệu quả.\u003c/p>\u003cp>\u003cb>Lập luận phản đối.\u003c/b> \u003cb>Khuếch đại\u003c/b>: trong thị trường giảm, bán khống bổ sung nguồn cung và có thể đẩy nhanh đà giảm, đặc biệt khi các lệnh gọi ký quỹ đồng thời buộc phải bán. \u003cb>Rủi ro thanh toán\u003c/b> từ bán khống trần, khi người bán chưa xác định được nguồn vay và có thể không giao được chứng khoán — một mối lo nghiêm trọng khi thị trường cho vay chứng khoán còn kém phát triển. Rủi ro \u003cb>thao túng\u003c/b>, qua tin đồn kết hợp với các vị thế bán khống, trong một thị trường có nền nhà đầu tư cá nhân lớn và ít kinh nghiệm. \u003cb>Yêu cầu về hạ tầng\u003c/b>: bán khống cần một thị trường cho vay chứng khoán vận hành được, hoạt động lưu ký đáng tin cậy, giám sát hiệu quả và kỷ luật thanh toán, những thứ cần thời gian để xây dựng. Các mối lo về \u003cb>bảo vệ nhà đầu tư và niềm tin\u003c/b> trong một thị trường nơi hiểu biết tài chính còn đang phát triển.\u003c/p>\u003cp>\u003cb>Kết luận cân bằng.\u003c/b> Quan điểm chủ đạo là bán khống nên được cho phép nhưng phải \u003cb>có bảo đảm\u003c/b> — yêu cầu đã xác định được nguồn vay — và chịu nghĩa vụ công bố các vị thế lớn, một danh mục chứng khoán đủ điều kiện, và khả năng áp hạn chế tạm thời trong điều kiện căng thẳng. Cách tiếp cận thận trọng của Việt Nam phản ánh các mối lo thực sự về hạ tầng và bảo vệ nhà đầu tư chứ không phải sự phản đối về nguyên tắc, và việc nới lỏng một cách phù hợp sẽ theo sau sự phát triển của khuôn khổ cho vay chứng khoán và thanh toán.\u003c/p>","rubricVi":"Ít nhất ba lập luận ủng hộ (0,7) · ít nhất ba lập luận phản đối (0,7) · kết luận cân bằng nhận diện bán khống có bảo đảm kèm các biện pháp bảo vệ (0,6)."},{"id":"M6-06","ch":6,"type":"case","clo":"CLO3","marks":3,"exam":"final","q":"A securities firm's margin book has grown rapidly and is concentrated in a few mid-cap stocks with thin free floats. Analyse the risks and recommend action.","guide":"\u003cp>\u003cb>Model answer — risks.\u003c/b> (1) \u003cb>Correlated collateral deterioration.\u003c/b> Because many clients have borrowed against the same few stocks, a fall in those names hits the entire book simultaneously; the diversification the lender implicitly assumed does not exist. (2) \u003cb>Liquidation infeasibility.\u003c/b> With thin free floats, the firm's collateral may represent a large multiple of daily traded volume. In a force-sale it cannot realise the position at screen prices — its own selling moves the market against it, so realised recovery is far below the marked value. (3) \u003cb>Reflexivity.\u003c/b> Margin lending may itself have inflated these stocks: leveraged buying pushed prices up, higher prices supported larger loans, which financed further buying. Such a loop reverses violently. (4) \u003cb>Price-band trapping.\u003c/b> If the stocks lock limit-down, the firm cannot sell at any price for successive sessions while losses accumulate. (5) \u003cb>Client and legal risk\u003c/b> from force-sales and disputed calls, plus reputational damage. (6) \u003cb>Capital and funding risk\u003c/b>, since the firm funds these loans and may face its own liquidity pressure.\u003c/p>\u003cp>\u003cb>Recommended action.\u003c/b> \u003cb>Immediately\u003c/b>: quantify exposure per security as a multiple of average daily volume and of free float — the critical metric, not the loan's nominal size; stress-test recovery assuming realistic liquidation over several days at declining prices; and stop further lending against the concentrated names.\u003c/p>\u003cp>\u003cb>Structurally\u003c/b>: impose \u003cb>hard concentration limits\u003c/b> per security, per client and per group of related clients, and a limit expressed relative to free float and daily volume; review the \u003cb>eligible securities list\u003c/b>, removing or applying materially lower loan-to-value ratios to thin, volatile names; require additional margin for concentrated positions; and reduce existing exposure in an orderly, pre-emptive way rather than waiting for a forced sale.\u003c/p>\u003cp>\u003cb>Ongoing\u003c/b>: intra-day mark-to-market with early client alerts before the maintenance level is breached; monitoring of \u003cb>market-wide\u003c/b> margin balances, since a system-wide deleveraging will hit the firm's collateral regardless of its own prudence; and clear board reporting of concentration metrics. The governing principle is that in margin lending the binding constraint is not the value of the collateral but the firm's \u003cb>ability to sell it\u003c/b>.\u003c/p>","rubric":"At least four risks incl. correlated deterioration and liquidation infeasibility (1.2) · reflexivity or price-band trapping (0.3) · immediate actions incl. exposure relative to volume/float and stress testing (0.7) · structural limits and eligible-list revision (0.6) · closing principle (0.2).","qVi":"Danh mục cho vay ký quỹ của một công ty chứng khoán đã tăng nhanh và tập trung vào một vài cổ phiếu vốn hóa trung bình có lượng cổ phần tự do lưu hành mỏng. Phân tích các rủi ro và khuyến nghị hành động.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các rủi ro.\u003c/b> (1) \u003cb>Tài sản bảo đảm xấu đi có tương quan.\u003c/b> Vì nhiều khách hàng cùng vay dựa trên một vài cổ phiếu, một đợt giảm ở các mã đó tác động lên toàn bộ danh mục cùng lúc; sự đa dạng hóa mà bên cho vay ngầm giả định là không tồn tại. (2) \u003cb>Không thể thanh lý.\u003c/b> Với lượng cổ phần tự do lưu hành mỏng, tài sản bảo đảm của công ty có thể lớn gấp nhiều lần khối lượng giao dịch hằng ngày. Trong một đợt bán giải chấp, công ty không thể hiện thực hóa vị thế ở giá trên bảng — chính việc bán của họ đẩy thị trường đi ngược lại, nên mức thu hồi thực tế thấp hơn nhiều so với giá trị đã ghi nhận. (3) \u003cb>Tính phản thân.\u003c/b> Bản thân việc cho vay ký quỹ có thể đã thổi phồng các cổ phiếu này: mua bằng đòn bẩy đẩy giá lên, giá cao hơn hỗ trợ các khoản vay lớn hơn, và điều đó lại tài trợ cho việc mua thêm. Một vòng lặp như vậy đảo chiều rất dữ dội. (4) \u003cb>Bị kẹt bởi biên độ giá.\u003c/b> Nếu các cổ phiếu khóa ở giá sàn, công ty không thể bán ở bất kỳ mức giá nào qua nhiều phiên liên tiếp trong khi tổn thất tích lũy. (5) \u003cb>Rủi ro pháp lý và với khách hàng\u003c/b> từ các vụ bán giải chấp và lệnh gọi gây tranh chấp, cộng tổn hại danh tiếng. (6) \u003cb>Rủi ro vốn và huy động vốn\u003c/b>, vì công ty tài trợ cho các khoản vay này và có thể đối mặt áp lực thanh khoản của chính mình.\u003c/p>\u003cp>\u003cb>Hành động được khuyến nghị.\u003c/b> \u003cb>Ngay lập tức\u003c/b>: định lượng mức phơi nhiễm theo từng chứng khoán dưới dạng bội số của khối lượng giao dịch bình quân ngày và của lượng cổ phần tự do lưu hành — đây mới là chỉ tiêu then chốt, không phải giá trị danh nghĩa của khoản vay; kiểm tra sức chịu đựng về mức thu hồi với giả định thanh lý thực tế trong vài ngày ở các mức giá giảm dần; và dừng cho vay thêm đối với các mã đang tập trung.\u003c/p>\u003cp>\u003cb>Về cấu trúc\u003c/b>: áp \u003cb>giới hạn tập trung cứng\u003c/b> theo từng chứng khoán, từng khách hàng và từng nhóm khách hàng liên quan, cùng một giới hạn được biểu diễn tương đối so với lượng cổ phần tự do lưu hành và khối lượng giao dịch ngày; rà soát \u003cb>danh mục chứng khoán đủ điều kiện\u003c/b>, loại bỏ hoặc áp tỷ lệ cho vay trên giá trị tài sản bảo đảm thấp hơn hẳn với các mã mỏng, biến động mạnh; yêu cầu ký quỹ bổ sung với các vị thế tập trung; và giảm mức phơi nhiễm hiện hữu một cách có trật tự, chủ động, thay vì chờ tới một đợt bán bắt buộc.\u003c/p>\u003cp>\u003cb>Thường xuyên\u003c/b>: định giá lại theo thị trường trong phiên với cảnh báo sớm tới khách hàng trước khi mức duy trì bị vi phạm; giám sát dư nợ ký quỹ \u003cb>toàn thị trường\u003c/b>, vì một đợt giảm đòn bẩy toàn hệ thống sẽ tác động lên tài sản bảo đảm của công ty bất kể sự thận trọng của chính họ; và báo cáo rõ ràng lên hội đồng quản trị về các chỉ tiêu tập trung. Nguyên tắc chi phối là trong cho vay ký quỹ, ràng buộc quyết định không phải là giá trị của tài sản bảo đảm mà là \u003cb>khả năng bán được nó\u003c/b> của công ty.\u003c/p>","rubricVi":"Ít nhất bốn rủi ro gồm xấu đi có tương quan và không thể thanh lý (1,2) · tính phản thân hoặc bị kẹt bởi biên độ giá (0,3) · hành động ngay gồm phơi nhiễm tương đối với khối lượng/lượng lưu hành và kiểm tra sức chịu đựng (0,7) · giới hạn cấu trúc và rà soát danh mục đủ điều kiện (0,6) · nguyên tắc kết luận (0,2)."},{"id":"N1-01","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the seven core operations of an investment bank identified in the course.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Capital-raising support\u003c/b> — helping capital-deficit entities raise funds through the issuance of shares and bonds, and accessing specialised capital sources (Chapter 2). \u003cb>(2) M&amp;A support\u003c/b> — advising on mergers, acquisitions, joint ventures, strategic alliances, divestment and defence against hostile takeovers (Chapter 3). \u003cb>(3) Asset management\u003c/b> — advising on and managing client assets for a fee, for institutions and increasingly for wealthy individuals (Chapter 4). \u003cb>(4) Wholesale banking\u003c/b> — a higher-risk proprietary activity investing in alternatives: private equity, real estate, leveraged lending, syndicated loans and project finance. \u003cb>(5) Corporate advisory\u003c/b> — advising enterprises on conversion of business form, restructuring and listing (Chapter 5). \u003cb>(6) Research\u003c/b> — macro and micro analysis of the economy, industries, enterprises and securities to support client decisions. \u003cb>(7) Brokerage\u003c/b> — executing securities transactions for clients in the secondary market (Chapter 6).\u003c/p>\u003cp>The operations divide naturally into \u003cb>agency\u003c/b> work earning fees (capital raising, M&amp;A, advisory, asset management, brokerage, research) and \u003cb>principal\u003c/b> work earning spreads and trading gains (wholesale banking, market making within brokerage).\u003c/p>","rubric":"All seven operations named (1.0) · content of each correctly summarised (0.7) · agency/principal grouping (0.3).","qVi":"Giải thích bảy nghiệp vụ cốt lõi của một ngân hàng đầu tư được nhận diện trong học phần.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Hỗ trợ huy động vốn\u003c/b> — giúp các chủ thể thiếu vốn huy động vốn qua phát hành cổ phiếu và trái phiếu, và tiếp cận các nguồn vốn chuyên biệt (Chương 2). \u003cb>(2) Hỗ trợ M&amp;A\u003c/b> — tư vấn sáp nhập, thâu tóm, liên doanh, liên minh chiến lược, thoái vốn và phòng thủ trước thâu tóm thù địch (Chương 3). \u003cb>(3) Quản lý tài sản\u003c/b> — tư vấn và quản lý tài sản khách hàng để hưởng phí, cho các tổ chức và ngày càng cho cá nhân giàu có (Chương 4). \u003cb>(4) Ngân hàng bán buôn\u003c/b> — một hoạt động chính chủ rủi ro cao hơn, đầu tư vào các sản phẩm thay thế: vốn cổ phần tư nhân, bất động sản, cho vay có đòn bẩy, cho vay hợp vốn và tài trợ dự án. \u003cb>(5) Tư vấn doanh nghiệp\u003c/b> — tư vấn doanh nghiệp về chuyển đổi loại hình, tái cấu trúc và niêm yết (Chương 5). \u003cb>(6) Nghiên cứu\u003c/b> — phân tích vĩ mô và vi mô về nền kinh tế, ngành, doanh nghiệp và chứng khoán để hỗ trợ quyết định của khách hàng. \u003cb>(7) Môi giới\u003c/b> — thực hiện các giao dịch chứng khoán cho khách hàng trên thị trường thứ cấp (Chương 6).\u003c/p>\u003cp>Các nghiệp vụ phân chia tự nhiên thành công việc \u003cb>đại lý\u003c/b> kiếm phí (huy động vốn, M&amp;A, tư vấn, quản lý tài sản, môi giới, nghiên cứu) và công việc \u003cb>chính chủ\u003c/b> kiếm chênh lệch giá và lãi giao dịch (ngân hàng bán buôn, tạo lập thị trường trong môi giới).\u003c/p>","rubricVi":"Nêu tên đủ bảy nghiệp vụ (1,0) · tóm tắt đúng nội dung mỗi nghiệp vụ (0,7) · nhóm đại lý/chính chủ (0,3)."},{"id":"N1-02","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain how the sources of income of an investment bank differ from those of a commercial bank.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Both earn fees, an interest spread and investment gains, but in very different proportions and from different activities.\u003c/p>\u003cp>\u003cb>Fees.\u003c/b> The investment bank earns them from \u003cb>underwriting\u003c/b>, \u003cb>brokerage\u003c/b>, \u003cb>trusteeship and asset management\u003c/b>, \u003cb>advisory\u003c/b> and transaction services — all tied to discrete transactions or to assets under management. The commercial bank's fees are narrower: payments, account services and some advisory.\u003c/p>\u003cp>\u003cb>Interest spread.\u003c/b> For the investment bank this arises mainly in \u003cb>wholesale banking\u003c/b> — the difference between its lending and borrowing rates on leveraged and syndicated lending and margin loans. For the commercial bank the \u003cb>net interest margin\u003c/b> between deposit and lending rates is the dominant income source, not a secondary one.\u003c/p>\u003cp>\u003cb>Investment gains and losses.\u003c/b> The investment bank earns these from \u003cb>proprietary trading and wholesale banking\u003c/b>, taking deliberate market risk. The commercial bank's are generally incidental, arising from money-market, foreign-exchange and securities holdings maintained for liquidity and balance-sheet management.\u003c/p>\u003cp>The consequence is the difference in \u003cb>stability\u003c/b>: the commercial bank's income is anchored by a slow-turning loan book, while the investment bank's is dominated by transaction and market-dependent revenue that is far more volatile.\u003c/p>","rubric":"Three income categories addressed for both institutions (1.2) · correct identification of which dominates for each (0.5) · stability consequence (0.3).","qVi":"Giải thích nguồn thu nhập của một ngân hàng đầu tư khác với của một ngân hàng thương mại như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Cả hai đều kiếm phí, một khoản chênh lệch lãi và lãi đầu tư, nhưng theo tỷ trọng rất khác nhau và từ các hoạt động khác nhau.\u003c/p>\u003cp>\u003cb>Phí.\u003c/b> Ngân hàng đầu tư kiếm phí từ \u003cb>bảo lãnh\u003c/b>, \u003cb>môi giới\u003c/b>, \u003cb>nhận uỷ thác và quản lý tài sản\u003c/b>, \u003cb>tư vấn\u003c/b> và dịch vụ giao dịch — tất cả gắn với các giao dịch riêng lẻ hoặc với tài sản đang quản lý. Phí của ngân hàng thương mại hẹp hơn: thanh toán, dịch vụ tài khoản và một số tư vấn.\u003c/p>\u003cp>\u003cb>Chênh lệch lãi.\u003c/b> Đối với ngân hàng đầu tư, khoản này chủ yếu phát sinh trong \u003cb>ngân hàng bán buôn\u003c/b> — chênh lệch giữa lãi suất cho vay và đi vay trong cho vay có đòn bẩy, cho vay hợp vốn và vay ký quỹ. Đối với ngân hàng thương mại, \u003cb>b
