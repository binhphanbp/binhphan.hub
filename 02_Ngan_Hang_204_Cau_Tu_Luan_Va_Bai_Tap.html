iên lãi ròng\u003c/b> giữa lãi suất tiền gửi và cho vay là nguồn thu chủ đạo, không phải thứ yếu.\u003c/p>\u003cp>\u003cb>Lãi và lỗ đầu tư.\u003c/b> Ngân hàng đầu tư kiếm khoản này từ \u003cb>tự doanh và ngân hàng bán buôn\u003c/b>, chủ động gánh rủi ro thị trường. Của ngân hàng thương mại nói chung là ngẫu nhiên, phát sinh từ nắm giữ trên thị trường tiền tệ, ngoại hối và chứng khoán để duy trì thanh khoản và quản lý bảng cân đối.\u003c/p>\u003cp>Hệ quả là sự khác biệt về \u003cb>ổn định\u003c/b>: thu nhập của ngân hàng thương mại được neo bởi một danh mục cho vay quay vòng chậm, trong khi của ngân hàng đầu tư bị chi phối bởi doanh thu phụ thuộc giao dịch và thị trường, biến động lớn hơn nhiều.\u003c/p>","rubricVi":"Đề cập ba nhóm thu nhập cho cả hai định chế (1,2) · xác định đúng nhóm nào chiếm ưu thế cho mỗi bên (0,5) · hệ quả về ổn định (0,3)."},{"id":"N1-03","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what a Chinese wall is, why it exists and how it is enforced in practice.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>Chinese wall\u003c/b> (information barrier, or \u003ci>vách ngăn cứng\u003c/i>) is the mandatory separation between the \u003cb>private side\u003c/b> of an investment bank — advisory bankers who receive material non-public information from clients — and the \u003cb>public side\u003c/b>, comprising research, sales and trading staff who may act only on public information.\u003c/p>\u003cp>\u003cb>Why it exists.\u003c/b> The bank simultaneously holds client secrets and trades securities. Without separation, knowledge of an unannounced acquisition could be used to trade ahead of the market — insider dealing — or to bias research toward a banking client. Both would defraud investors, breach securities law and destroy the client trust on which the franchise depends. The wall makes the conflict \u003cb>structurally unworkable\u003c/b> rather than relying on individual restraint.\u003c/p>\u003cp>\u003cb>Enforcement in practice.\u003c/b> Physical separation of floors and access-controlled areas; segregated IT permissions and document storage; a \u003cb>control room\u003c/b> in compliance maintaining a confidential \u003cb>watch list\u003c/b> (to monitor) and a \u003cb>restricted list\u003c/b> (to prohibit research and proprietary trading); documented, time-limited \u003cb>wall-crossing\u003c/b> procedures placing any crossed individual under insider restrictions; personal-account dealing rules with pre-clearance; trade surveillance around announcements and research publication; and training with disciplinary consequences.\u003c/p>","rubric":"Definition with private/public sides (0.6) · rationale incl. insider dealing and research bias (0.6) · at least four enforcement mechanisms incl. the two lists and wall-crossing (0.8).","qVi":"Giải thích bức tường ngăn cách (Chinese wall) là gì, vì sao nó tồn tại và nó được thực thi trong thực tế như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>bức tường ngăn cách\u003c/b> (rào chắn thông tin, hay \u003ci>vách ngăn cứng\u003c/i>) là sự tách bạch bắt buộc giữa \u003cb>bên riêng tư\u003c/b> của ngân hàng đầu tư — các chuyên viên tư vấn nhận thông tin trọng yếu chưa công bố từ khách hàng — và \u003cb>bên công khai\u003c/b>, gồm nhân sự nghiên cứu, bán hàng và giao dịch chỉ được hành động dựa trên thông tin công khai.\u003c/p>\u003cp>\u003cb>Vì sao nó tồn tại.\u003c/b> Ngân hàng đồng thời nắm giữ bí mật của khách hàng và giao dịch chứng khoán. Nếu không tách bạch, hiểu biết về một thương vụ thâu tóm chưa công bố có thể bị dùng để giao dịch trước thị trường — giao dịch nội gián — hoặc để làm thiên lệch nghiên cứu theo hướng có lợi cho một khách hàng ngân hàng đầu tư. Cả hai đều lừa đảo nhà đầu tư, vi phạm luật chứng khoán và phá hủy sự tín nhiệm của khách hàng — nền tảng của thương hiệu. Bức tường làm cho xung đột trở nên \u003cb>bất khả thi về mặt cấu trúc\u003c/b> thay vì dựa vào sự tự kiềm chế của cá nhân.\u003c/p>\u003cp>\u003cb>Thực thi trong thực tế.\u003c/b> Phân tách vật lý sàn làm việc và các khu vực kiểm soát ra vào; phân quyền công nghệ thông tin và lưu trữ hồ sơ tách biệt; một \u003cb>phòng kiểm soát\u003c/b> trong bộ phận tuân thủ duy trì một \u003cb>danh sách theo dõi\u003c/b> bảo mật (để giám sát) và một \u003cb>danh sách hạn chế\u003c/b> (để cấm nghiên cứu và tự doanh); thủ tục \u003cb>vượt tường\u003c/b> có ghi chép, giới hạn thời gian, đặt bất kỳ cá nhân vượt tường nào dưới hạn chế nội bộ; quy tắc giao dịch tài khoản cá nhân với phê duyệt trước; giám sát giao dịch quanh các công bố và công bố nghiên cứu; và đào tạo kèm chế tài kỷ luật.\u003c/p>","rubricVi":"Định nghĩa với bên riêng tư/công khai (0,6) · lý do gồm giao dịch nội gián và thiên lệch nghiên cứu (0,6) · ít nhất bốn cơ chế thực thi gồm hai danh sách và vượt tường (0,8)."},{"id":"N2-01","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the four stages of the private-equity investment process after a fund has been raised.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Sourcing and screening.\u003c/b> The GP identifies candidate companies through its network, intermediaries and proprietary research, screening them against the fund's mandate — sector, size, geography and the availability of a credible value-creation plan and exit route.\u003c/p>\u003cp>\u003cb>(2) Due diligence and valuation.\u003c/b> Commercial, financial, legal, tax and operational diligence tests the investment thesis; the target is valued and the returns modelled, including the leverage the business can support and the sensitivity of the IRR to entry price, growth and exit multiple.\u003c/p>\u003cp>\u003cb>(3) Structuring, negotiation and completion.\u003c/b> The consideration, instrument and capital structure are settled; the shareholders' agreement establishes board representation, veto rights over key decisions, information rights and, for minority positions, protective terms such as liquidation preference and anti-dilution. Financing is arranged and the transaction completes.\u003c/p>\u003cp>\u003cb>(4) Value creation and exit.\u003c/b> During the holding period the sponsor drives operational improvement, add-on acquisitions and deleveraging, monitoring through the board. It then exits — by trade sale to a strategic buyer, secondary sale to another fund, IPO, or recapitalisation — since the fund has a finite life and must return capital to its limited partners.\u003c/p>","rubric":"Four stages in correct sequence (0.8) · substantive content in each (0.8) · exit routes and the finite-life driver (0.4).","qVi":"Giải thích bốn giai đoạn của quy trình đầu tư vốn cổ phần tư nhân sau khi một quỹ đã được huy động.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Tìm kiếm và sàng lọc.\u003c/b> GP nhận diện các công ty ứng viên qua mạng lưới, các trung gian và nghiên cứu riêng, sàng lọc chúng theo mệnh lệnh của quỹ — ngành, quy mô, địa lý và sự sẵn có của một kế hoạch tạo giá trị và lối thoái vốn đáng tin.\u003c/p>\u003cp>\u003cb>(2) Thẩm định và định giá.\u003c/b> Thẩm định thương mại, tài chính, pháp lý, thuế và vận hành kiểm định luận điểm đầu tư; công ty mục tiêu được định giá và lợi nhuận được mô hình hóa, gồm mức đòn bẩy doanh nghiệp có thể gánh và độ nhạy của IRR với giá vào, tăng trưởng và bội số thoái vốn.\u003c/p>\u003cp>\u003cb>(3) Cấu trúc, thương lượng và hoàn tất.\u003c/b> Khoản thanh toán, công cụ và cấu trúc vốn được chốt; thỏa thuận cổ đông thiết lập ghế hội đồng quản trị, quyền phủ quyết các quyết định then chốt, quyền thông tin và, đối với vị thế thiểu số, các điều khoản bảo vệ như ưu tiên thanh lý và chống pha loãng. Tài trợ được thu xếp và giao dịch hoàn tất.\u003c/p>\u003cp>\u003cb>(4) Tạo giá trị và thoái vốn.\u003c/b> Trong thời gian nắm giữ, nhà tài trợ thúc đẩy cải thiện vận hành, các thương vụ bổ trợ (add-on) và giảm đòn bẩy, giám sát qua hội đồng quản trị. Sau đó thoái vốn — bằng bán cho đối tác chiến lược, bán thứ cấp cho một quỹ khác, IPO, hoặc tái cấp vốn — vì quỹ có vòng đời hữu hạn và phải hoàn vốn cho các thành viên góp vốn.\u003c/p>","rubricVi":"Bốn giai đoạn theo đúng trình tự (0,8) · nội dung thực chất trong mỗi giai đoạn (0,8) · các lối thoái vốn và động lực vòng đời hữu hạn (0,4)."},{"id":"N2-02","ch":2,"type":"calc-essay","clo":"CLO1","marks":2,"exam":"final","q":"A company offers 20 million shares at VND 30,000 with a 5% gross spread. Demand is weak and the price is cut to VND 26,000 with the size reduced to 16 million shares. Compute the loss of net proceeds and comment.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Original plan:\u003c/b> gross = 20m × 30,000 = VND 600bn; fee = 5% × 600 = VND 30bn; net = \u003cb>VND 570 billion\u003c/b>.\u003c/p>\u003cp>\u003cb>Revised deal:\u003c/b> gross = 16m × 26,000 = VND 416bn; fee = 5% × 416 = VND 20.8bn; net = \u003cb>VND 395.2 billion\u003c/b>.\u003c/p>\u003cp>\u003cb>Loss of net proceeds\u003c/b> = 570 − 395.2 = \u003cb>VND 174.8 billion\u003c/b>, a reduction of \u003cb>30.7%\u003c/b>.\u003c/p>\u003cp>\u003cb>Comment.\u003c/b> The shortfall arises from two compounding decisions — a 13.3% price cut and a 20% size reduction — which together cut proceeds by nearly a third. The consequences for the issuer go beyond the cash: if the prospectus specified a use of proceeds, the investment programme must now be trimmed, deferred or funded with debt; and the lower price sets a \u003cb>reference valuation\u003c/b> that will constrain future issuance and may depress the aftermarket.\u003c/p>\u003cp>The alternative of postponing would have avoided the poor price but incurred wasted costs, signalled weakness, and required refreshed financial disclosure before returning. The choice therefore turns on whether the weak book reflects the \u003cb>valuation\u003c/b> — in which case repricing is correct — or a \u003cb>closed market\u003c/b>, in which case postponement is better. Note also that the underwriter's fee falls only VND 9.2bn while the issuer loses VND 174.8bn, so their incentives to complete are not symmetrical.\u003c/p>","rubric":"Both scenarios computed correctly (1.0) · loss and percentage (0.4) · comment on use of proceeds, reference valuation and the reprice-versus-postpone judgement (0.6).","qVi":"Một công ty chào 20 triệu cổ phần giá 30.000 đồng với phí bảo lãnh 5%. Nhu cầu yếu và giá bị cắt xuống 26.000 đồng với quy mô giảm còn 16 triệu cổ phần. Tính phần mất đi của số tiền thu ròng và bình luận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Kế hoạch ban đầu:\u003c/b> gộp = 20 triệu × 30.000 = 600 tỷ; phí = 5% × 600 = 30 tỷ; ròng = \u003cb>570 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Thương vụ điều chỉnh:\u003c/b> gộp = 16 triệu × 26.000 = 416 tỷ; phí = 5% × 416 = 20,8 tỷ; ròng = \u003cb>395,2 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Phần mất đi của tiền thu ròng\u003c/b> = 570 − 395,2 = \u003cb>174,8 tỷ đồng\u003c/b>, giảm \u003cb>30,7%\u003c/b>.\u003c/p>\u003cp>\u003cb>Bình luận.\u003c/b> Phần thiếu phát sinh từ hai quyết định cộng hưởng — cắt giá 13,3% và giảm quy mô 20% — cùng nhau cắt gần một phần ba số tiền thu. Hệ quả với tổ chức phát hành vượt ra ngoài tiền mặt: nếu bản cáo bạch đã nêu mục đích sử dụng vốn, chương trình đầu tư nay phải cắt gọn, hoãn lại hoặc tài trợ bằng nợ; và mức giá thấp hơn đặt một \u003cb>định giá tham chiếu\u003c/b> sẽ ràng buộc các đợt phát hành tương lai và có thể kéo giá thị trường thứ cấp xuống.\u003c/p>\u003cp>Phương án hoãn lại sẽ tránh được mức giá tồi nhưng chịu chi phí lãng phí, phát tín hiệu yếu, và cần công bố tài chính được làm mới trước khi quay lại. Lựa chọn do đó tùy thuộc sổ lệnh yếu phản ánh \u003cb>định giá\u003c/b> — khi đó định giá lại là đúng — hay một \u003cb>thị trường đóng cửa\u003c/b>, khi đó hoãn lại là tốt hơn. Cũng lưu ý phí của nhà bảo lãnh chỉ giảm 9,2 tỷ trong khi tổ chức phát hành mất 174,8 tỷ, nên động cơ hoàn tất của họ không đối xứng.\u003c/p>","rubricVi":"Tính đúng cả hai kịch bản (1,0) · phần mất và tỷ lệ phần trăm (0,4) · bình luận về sử dụng vốn, định giá tham chiếu và phán đoán định giá lại – hoãn lại (0,6)."},{"id":"N2-03","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the role of the syndicate in an underwriting and why issues are underwritten by a group rather than a single bank.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>syndicate\u003c/b> is the group of banks that jointly underwrite and distribute a securities issue. The \u003cb>lead manager (bookrunner)\u003c/b> runs the process — structuring, due diligence, documentation, building and controlling the book, pricing and allocation — and takes the largest fee share. \u003cb>Co-managers\u003c/b> and selling-group members contribute additional distribution for a smaller share.\u003c/p>\u003cp>\u003cb>Why a group rather than one bank.\u003c/b> (1) \u003cb>Risk sharing.\u003c/b> Under a firm commitment the underwriters buy the whole issue; spreading that obligation means no single balance sheet bears the full placement risk, and each participant's regulatory capital consumption is manageable. (2) \u003cb>Distribution reach.\u003c/b> No single bank has relationships with every relevant investor — different houses are strong with different institutions, geographies and investor types, so a syndicate reaches a wider book and achieves better price discovery. (3) \u003cb>Research coverage.\u003c/b> Each member typically initiates coverage after listing, giving the issuer a broader analyst following and improved secondary liquidity. (4) \u003cb>Relationship management.\u003c/b> The issuer can reward several banking relationships, and appointing a competitor's bank as co-manager can secure goodwill.\u003c/p>\u003cp>The trade-off is coordination cost and diluted accountability, which is why the bookrunner retains clear control of the book and the pricing decision.\u003c/p>","rubric":"Syndicate structure with bookrunner and co-manager roles (0.7) · at least three reasons for syndication (0.9) · trade-off and bookrunner control (0.4).","qVi":"Giải thích vai trò của tổ hợp bảo lãnh (syndicate) trong một đợt bảo lãnh và vì sao các đợt phát hành được bảo lãnh bởi một nhóm chứ không phải một ngân hàng duy nhất.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>tổ hợp bảo lãnh\u003c/b> là nhóm ngân hàng cùng bảo lãnh và phân phối một đợt phát hành chứng khoán. \u003cb>Nhà quản lý chính (quản lý sổ)\u003c/b> điều hành quy trình — cấu trúc, thẩm định, hồ sơ, dựng và kiểm soát sổ lệnh, định giá và phân bổ — và nhận phần phí lớn nhất. \u003cb>Các đồng quản lý\u003c/b> và thành viên nhóm bán đóng góp thêm phân phối để nhận phần nhỏ hơn.\u003c/p>\u003cp>\u003cb>Vì sao là một nhóm chứ không phải một ngân hàng.\u003c/b> (1) \u003cb>Chia sẻ rủi ro.\u003c/b> Theo cam kết chắc chắn, các nhà bảo lãnh mua trọn đợt phát hành; trải nghĩa vụ đó ra nghĩa là không một bảng cân đối nào gánh toàn bộ rủi ro phân phối, và mức tiêu tốn vốn theo quy định của mỗi bên là quản lý được. (2) \u003cb>Tầm phân phối.\u003c/b> Không một ngân hàng nào có quan hệ với mọi nhà đầu tư liên quan — các định chế khác nhau mạnh với các tổ chức, khu vực và loại nhà đầu tư khác nhau, nên một tổ hợp tiếp cận một sổ lệnh rộng hơn và đạt việc khám phá giá tốt hơn. (3) \u003cb>Phạm vi nghiên cứu.\u003c/b> Mỗi thành viên thường bắt đầu đưa ra khuyến nghị sau niêm yết, cho tổ chức phát hành một lượng chuyên viên phân tích theo dõi rộng hơn và thanh khoản thứ cấp cải thiện. (4) \u003cb>Quản lý quan hệ.\u003c/b> Tổ chức phát hành có thể tưởng thưởng nhiều quan hệ ngân hàng, và việc bổ nhiệm ngân hàng của một đối thủ làm đồng quản lý có thể tạo thiện chí.\u003c/p>\u003cp>Đánh đổi là chi phí phối hợp và trách nhiệm bị pha loãng, đó là lý do nhà quản lý sổ giữ quyền kiểm soát rõ ràng đối với sổ lệnh và quyết định định giá.\u003c/p>","rubricVi":"Cấu trúc tổ hợp với vai trò quản lý sổ và đồng quản lý (0,7) · ít nhất ba lý do lập tổ hợp (0,9) · đánh đổi và quyền kiểm soát của quản lý sổ (0,4)."},{"id":"N3-01","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the three valuation methods used in M&A and why they are presented together.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Comparable companies analysis\u003c/b> applies the trading multiples of similar listed peers — EV/EBITDA, P/E — to the target's own metrics. It reflects current market pricing but values a \u003cb>minority\u003c/b> stake, so it contains no control premium and imports whatever errors the market is currently making.\u003c/p>\u003cp>\u003cb>(2) Precedent transactions analysis\u003c/b> applies multiples actually paid in comparable past deals. Because those were control transactions, the multiples \u003cb>embed a control premium\u003c/b> and therefore typically exceed trading comps. The weakness is that past deals occurred in different market conditions and each had its own strategic rationale.\u003c/p>\u003cp>\u003cb>(3) Discounted cash flow\u003c/b> values the business intrinsically, as the present value of projected free cash flows discounted at WACC. It is theoretically the most complete and the only method that captures the target's specific future plan — but it is assumption-heavy and dominated by the terminal value, typically 60–80% of the total.\u003c/p>\u003cp>\u003cb>Why presented together.\u003c/b> No single method is authoritative: each rests on different assumptions and has a characteristic bias. Presenting them as a \u003cb>range\u003c/b> — the &ldquo;football field&rdquo; — communicates the genuine uncertainty rather than a spuriously precise point estimate. Just as importantly, the \u003cb>differences between the methods are diagnostic\u003c/b>: a DCF far above the comps suggests optimistic forecasts, while precedent multiples far above trading multiples indicate the size of premium the market has historically paid.\u003c/p>","rubric":"Three methods correctly described (0.9) · characteristic bias or limitation of each (0.6) · football-field rationale and the diagnostic value of divergence (0.5).","qVi":"Giải thích ba phương pháp định giá dùng trong M&A và vì sao chúng được trình bày cùng nhau.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Phân tích công ty so sánh\u003c/b> áp dụng bội số giao dịch của các công ty niêm yết tương tự — EV/EBITDA, P/E — vào chỉ tiêu của chính công ty mục tiêu. Nó phản ánh mức định giá thị trường hiện tại nhưng định giá một cổ phần \u003cb>thiểu số\u003c/b>, nên không chứa thặng dư kiểm soát và mang theo mọi sai lệch mà thị trường đang mắc phải.\u003c/p>\u003cp>\u003cb>(2) Phân tích giao dịch tiền lệ\u003c/b> áp dụng các bội số thực sự đã trả trong các thương vụ tương tự trong quá khứ. Vì đó là các giao dịch kiểm soát, các bội số này \u003cb>đã bao hàm thặng dư kiểm soát\u003c/b> và do đó thường vượt bội số giao dịch. Nhược điểm là các thương vụ quá khứ diễn ra trong điều kiện thị trường khác và mỗi thương vụ có lý do chiến lược riêng.\u003c/p>\u003cp>\u003cb>(3) Chiết khấu dòng tiền\u003c/b> định giá doanh nghiệp một cách nội tại, như giá trị hiện tại của dòng tiền tự do dự phóng chiết khấu theo WACC. Về lý thuyết đây là phương pháp đầy đủ nhất và là phương pháp duy nhất nắm bắt được kế hoạch tương lai cụ thể của công ty mục tiêu — nhưng nó nặng giả định và bị chi phối bởi giá trị cuối kỳ, thường chiếm 60–80% tổng giá trị.\u003c/p>\u003cp>\u003cb>Vì sao trình bày cùng nhau.\u003c/b> Không phương pháp nào là có thẩm quyền tuyệt đối: mỗi phương pháp dựa trên các giả định khác nhau và có một thiên lệch đặc trưng. Trình bày chúng như một \u003cb>khoảng giá trị\u003c/b> — biểu đồ &ldquo;sân bóng&rdquo; — truyền đạt sự bất định thực sự thay vì một ước lượng điểm chính xác giả tạo. Quan trọng không kém, \u003cb>sự khác biệt giữa các phương pháp có tính chẩn đoán\u003c/b>: một kết quả DCF cao hơn nhiều so với công ty so sánh gợi ý dự phóng lạc quan, còn bội số tiền lệ cao hơn nhiều bội số giao dịch cho thấy quy mô thặng dư mà thị trường đã trả trong lịch sử.\u003c/p>","rubricVi":"Mô tả đúng ba phương pháp (0,9) · thiên lệch hoặc hạn chế đặc trưng của mỗi phương pháp (0,6) · lý do biểu đồ sân bóng và giá trị chẩn đoán của sự khác biệt (0,5)."},{"id":"N3-02","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what happens in the second round of a sell-side auction and why access to information is staged.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> After first-round non-binding indications of interest, the seller shortlists a small number of bidders — typically three to five — who proceed to the \u003cb>second round\u003c/b>. They receive: \u003cb>management presentations\u003c/b>, allowing them to test the team and probe the business plan; access to the \u003cb>data room\u003c/b> for detailed due diligence across commercial, financial, tax, legal, environmental, HR and IT workstreams; site visits and expert sessions; and a draft \u003cb>purchase agreement\u003c/b> to mark up. The round concludes with \u003cb>final binding bids\u003c/b>, evaluated not on price alone but on certainty of financing, conditionality, the extent of the mark-up and speed to completion.\u003c/p>\u003cp>\u003cb>Why information is staged.\u003c/b> Disclosure is costly and irreversible. Revealing that a business is for sale unsettles employees, customers and suppliers, and competitors gain intelligence they retain whether or not they buy. So the seller releases information in proportion to demonstrated commitment: an anonymous teaser to all; the CIM only after an NDA; detailed and commercially sensitive material only to shortlisted bidders who have shown a credible price. The most sensitive data — customer names, contract terms, pricing — is withheld until last, often redacted or released only to a \u003cb>clean team\u003c/b> of advisers rather than to a competitor's operational staff. Staging also preserves \u003cb>competitive tension\u003c/b>, since no bidder learns how many rivals remain.\u003c/p>","rubric":"Second-round components incl. management presentations, data room and binding bids (0.8) · evaluation on more than price (0.3) · staged-disclosure rationale with the specific harms and clean-team protection (0.9).","qVi":"Giải thích điều gì diễn ra ở vòng hai của một cuộc đấu giá bên bán và vì sao việc tiếp cận thông tin được chia theo giai đoạn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Sau các ý định quan tâm không ràng buộc ở vòng một, bên bán lọc ra một số ít bên chào giá — thường ba đến năm — để vào \u003cb>vòng hai\u003c/b>. Họ nhận được: \u003cb>thuyết trình của ban điều hành\u003c/b>, cho phép họ kiểm chứng đội ngũ và thăm dò kế hoạch kinh doanh; quyền truy cập \u003cb>phòng dữ liệu\u003c/b> để thẩm định chi tiết qua các luồng thương mại, tài chính, thuế, pháp lý, môi trường, nhân sự và công nghệ thông tin; các chuyến thăm hiện trường và phiên làm việc với chuyên gia; và một dự thảo \u003cb>hợp đồng mua bán\u003c/b> để sửa đổi. Vòng này kết thúc bằng \u003cb>chào giá ràng buộc cuối cùng\u003c/b>, được đánh giá không chỉ theo giá mà còn theo sự chắc chắn của nguồn tài trợ, tính điều kiện, mức độ sửa đổi hợp đồng và tốc độ hoàn tất.\u003c/p>\u003cp>\u003cb>Vì sao thông tin được chia theo giai đoạn.\u003c/b> Việc công bố là tốn kém và không thể đảo ngược. Tiết lộ rằng một doanh nghiệp đang được rao bán làm bất an nhân viên, khách hàng và nhà cung cấp, còn đối thủ thu được thông tin tình báo mà họ giữ lại dù có mua hay không. Vậy nên bên bán phát hành thông tin tương ứng với mức cam kết đã thể hiện: teaser ẩn danh cho tất cả; CIM chỉ sau khi ký NDA; tài liệu chi tiết và nhạy cảm về thương mại chỉ cho các bên lọt danh sách ngắn đã đưa ra một mức giá đáng tin. Dữ liệu nhạy cảm nhất — tên khách hàng, điều khoản hợp đồng, giá bán — được giữ lại tới cuối, thường được che bớt hoặc chỉ phát hành cho một \u003cb>nhóm sạch\u003c/b> gồm các cố vấn thay vì cho nhân sự vận hành của đối thủ. Việc chia giai đoạn cũng bảo toàn \u003cb>sức ép cạnh tranh\u003c/b>, vì không bên nào biết còn bao nhiêu đối thủ.\u003c/p>","rubricVi":"Các cấu phần vòng hai gồm thuyết trình ban điều hành, phòng dữ liệu và chào giá ràng buộc (0,8) · đánh giá không chỉ theo giá (0,3) · lý do công bố theo giai đoạn với các tổn hại cụ thể và bảo vệ bằng nhóm sạch (0,9)."},{"id":"N3-03","ch":3,"type":"calc-essay","clo":"CLO1","marks":2,"exam":"final","q":"A sponsor acquires a company for VND 2,400bn using VND 1,700bn of debt. After 5 years debt is VND 800bn and enterprise value is VND 3,100bn. Compute entry equity, exit equity, money multiple and IRR, and identify the largest contributor to the return.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Entry:\u003c/b> equity = EV − debt = 2,400 − 1,700 = \u003cb>VND 700 billion\u003c/b>.\u003cbr>\u003cb>Exit:\u003c/b> equity = 3,100 − 800 = \u003cb>VND 2,300 billion\u003c/b>.\u003c/p>\u003cp>\u003cb>Money multiple\u003c/b> = 2,300 ÷ 700 = \u003cb>3.29×\u003c/b>.\u003cbr>\u003cb>IRR\u003c/b> = 3.29^(1/5) − 1 = 1.269 − 1 ≈ \u003cb>26.9%\u003c/b>.\u003c/p>\u003cp>\u003cb>Contributors.\u003c/b> Total equity gain = 2,300 − 700 = \u003cb>VND 1,600 billion\u003c/b>, from two sources:\u003c/p>\u003cul>\u003cli>\u003cb>Debt paydown\u003c/b>: debt fell from 1,700 to 800, transferring \u003cb>VND 900 billion\u003c/b> of enterprise value directly to equity.\u003c/li>\u003cli>\u003cb>Enterprise value growth\u003c/b>: EV rose from 2,400 to 3,100, adding \u003cb>VND 700 billion\u003c/b>.\u003c/li>\u003c/ul>\u003cp>The \u003cb>largest single contributor is deleveraging\u003c/b>, at VND 900bn or 56% of the total gain — the classic LBO pattern, in which the target's own cash flow repays debt and thereby converts enterprise value into equity value.\u003c/p>\u003cp>Note that the enterprise-value growth of VND 700bn would itself need decomposing between EBITDA growth and any change in the exit multiple: a return driven by EBITDA growth reflects operational execution, whereas one driven by multiple expansion is a bet on market conditions. Without that split the quality of the return cannot be judged.\u003c/p>","rubric":"Entry and exit equity (0.6) · MoM and IRR (0.6) · both contributors quantified with deleveraging identified as largest (0.5) · the further EBITDA-versus-multiple decomposition point (0.3).","qVi":"Một nhà tài trợ thâu tóm một công ty với 2.400 tỷ đồng, sử dụng 1.700 tỷ đồng nợ. Sau 5 năm nợ còn 800 tỷ và giá trị doanh nghiệp là 3.100 tỷ. Tính vốn chủ lúc vào, vốn chủ lúc ra, bội số tiền và IRR, và xác định yếu tố đóng góp lớn nhất vào lợi nhuận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Lúc vào:\u003c/b> vốn chủ = EV − nợ = 2.400 − 1.700 = \u003cb>700 tỷ đồng\u003c/b>.\u003cbr>\u003cb>Lúc ra:\u003c/b> vốn chủ = 3.100 − 800 = \u003cb>2.300 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Bội số tiền\u003c/b> = 2.300 ÷ 700 = \u003cb>3,29×\u003c/b>.\u003cbr>\u003cb>IRR\u003c/b> = 3,29^(1/5) − 1 = 1,269 − 1 ≈ \u003cb>26,9%\u003c/b>.\u003c/p>\u003cp>\u003cb>Các yếu tố đóng góp.\u003c/b> Tổng mức tăng vốn chủ = 2.300 − 700 = \u003cb>1.600 tỷ đồng\u003c/b>, từ hai nguồn:\u003c/p>\u003cul>\u003cli>\u003cb>Trả nợ\u003c/b>: nợ giảm từ 1.700 xuống 800, chuyển \u003cb>900 tỷ đồng\u003c/b> giá trị doanh nghiệp trực tiếp sang vốn chủ.\u003c/li>\u003cli>\u003cb>Tăng trưởng giá trị doanh nghiệp\u003c/b>: EV tăng từ 2.400 lên 3.100, cộng thêm \u003cb>700 tỷ đồng\u003c/b>.\u003c/li>\u003c/ul>\u003cp>\u003cb>Yếu tố đóng góp đơn lẻ lớn nhất là việc giảm đòn bẩy\u003c/b>, ở mức 900 tỷ hay 56% tổng mức tăng — mô hình LBO kinh điển, trong đó dòng tiền của chính công ty mục tiêu trả nợ và qua đó chuyển giá trị doanh nghiệp thành giá trị vốn chủ.\u003c/p>\u003cp>Lưu ý rằng mức tăng giá trị doanh nghiệp 700 tỷ tự nó cần được phân rã tiếp giữa tăng trưởng EBITDA và bất kỳ thay đổi nào của bội số lúc thoái vốn: một khoản lợi nhuận do tăng trưởng EBITDA dẫn dắt phản ánh năng lực thực thi vận hành, trong khi khoản do mở rộng bội số dẫn dắt là một cược vào điều kiện thị trường. Thiếu phần tách đó thì không thể đánh giá chất lượng của lợi nhuận.\u003c/p>","rubricVi":"Vốn chủ lúc vào và lúc ra (0,6) · bội số tiền và IRR (0,6) · cả hai yếu tố đóng góp được định lượng với việc giảm đòn bẩy được xác định là lớn nhất (0,5) · điểm về phân rã tiếp giữa EBITDA và bội số (0,3)."},{"id":"N4-01","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the difference between an open-end and a closed-end fund from the manager's perspective.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Open-end fund.\u003c/b> Units are continuously issued and redeemed at NAV, so the fund's size fluctuates with investor flows. For the manager this means: a \u003cb>liquidity constraint\u003c/b> — cash or liquid assets must be held to meet redemptions, creating a performance drag; \u003cb>forced transactions\u003c/b> at times not of the manager's choosing, since inflows must be invested and outflows funded regardless of whether prices are attractive; \u003cb>constraints on asset selection\u003c/b>, since illiquid holdings cannot safely be matched with daily dealing; and \u003cb>revenue volatility\u003c/b>, as AUM and therefore fees move with flows as well as performance. The compensation is that strong performance attracts inflows, growing the fee base.\u003c/p>\u003cp>\u003cb>Closed-end fund.\u003c/b> The unit count is fixed and units trade on the secondary market with \u003cb>no redemption obligation\u003c/b>. For the manager this means: \u003cb>stable capital\u003c/b> that cannot be withdrawn, permitting investment in \u003cb>illiquid assets\u003c/b> — property, infrastructure, private companies — and allowing positions to be held through volatility without forced selling; no cash drag; and \u003cb>predictable fee revenue\u003c/b>, since AUM moves only with performance.\u003c/p>\u003cp>The offsetting difficulties are that the fund cannot easily grow without a new issue, and that persistent trading at a \u003cb>discount to NAV\u003c/b> attracts investor criticism and activist pressure — a reputational problem the manager cannot fix through performance alone.\u003c/p>","rubric":"Open-end consequences incl. liquidity constraint and forced transactions (0.8) · closed-end stable capital permitting illiquid assets (0.7) · discount-to-NAV difficulty (0.5).","qVi":"Giải thích sự khác biệt giữa quỹ mở và quỹ đóng từ góc nhìn của nhà quản lý.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Quỹ mở.\u003c/b> Chứng chỉ được liên tục phát hành và mua lại theo NAV, nên quy mô quỹ biến động theo dòng vốn của nhà đầu tư. Với nhà quản lý điều này nghĩa là: một \u003cb>ràng buộc thanh khoản\u003c/b> — phải giữ tiền mặt hoặc tài sản thanh khoản để đáp ứng việc mua lại, tạo lực cản lên hiệu quả; \u003cb>giao dịch bắt buộc\u003c/b> vào những thời điểm không do nhà quản lý chọn, vì dòng vốn vào phải được đầu tư và dòng ra phải được tài trợ bất kể giá có hấp dẫn hay không; \u003cb>ràng buộc về lựa chọn tài sản\u003c/b>, vì các khoản nắm giữ kém thanh khoản không thể khớp an toàn với giao dịch hằng ngày; và \u003cb>doanh thu biến động\u003c/b>, khi AUM và do đó phí dịch chuyển theo cả dòng vốn lẫn hiệu quả. Bù lại, hiệu quả tốt thu hút dòng vốn vào, làm tăng nền tính phí.\u003c/p>\u003cp>\u003cb>Quỹ đóng.\u003c/b> Số chứng chỉ cố định và chứng chỉ giao dịch trên thị trường thứ cấp, \u003cb>không có nghĩa vụ mua lại\u003c/b>. Với nhà quản lý điều này nghĩa là: \u003cb>vốn ổn định\u003c/b> không thể bị rút ra, cho phép đầu tư vào \u003cb>tài sản kém thanh khoản\u003c/b> — bất động sản, hạ tầng, công ty tư nhân — và cho phép giữ vị thế xuyên qua biến động mà không bị buộc bán; không có lực cản từ tiền mặt; và \u003cb>doanh thu phí dự đoán được\u003c/b>, vì AUM chỉ dịch chuyển theo hiệu quả.\u003c/p>\u003cp>Các khó khăn đối trọng là quỹ không dễ tăng quy mô nếu không phát hành mới, và việc thường xuyên giao dịch ở mức \u003cb>chiết khấu so với NAV\u003c/b> thu hút chỉ trích của nhà đầu tư và áp lực từ các nhà đầu tư chủ động — một vấn đề danh tiếng mà nhà quản lý không thể khắc phục chỉ bằng hiệu quả đầu tư.\u003c/p>","rubricVi":"Hệ quả của quỹ mở gồm ràng buộc thanh khoản và giao dịch bắt buộc (0,8) · vốn ổn định của quỹ đóng cho phép nắm tài sản kém thanh khoản (0,7) · khó khăn về chiết khấu so với NAV (0,5)."},{"id":"N4-02","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what a hurdle rate is, how it operates in a fee calculation, and why investors insist on it.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>hurdle rate\u003c/b> (preferred return) is the minimum return an investor must receive before the manager may charge a \u003cb>performance fee\u003c/b>. It is typically expressed as an annual percentage — commonly 8% in private equity — and is agreed in the fund documentation.\u003c/p>\u003cp>\u003cb>How it operates.\u003c/b> The performance fee is charged only on the return \u003cb>in excess of\u003c/b> the hurdle: \u003ci>Performance fee = carry% × max(Gross return − Hurdle, 0)\u003c/i>. If a fund charges 20% carry over an 8% hurdle and returns 15% gross, the excess is 7% and the carry is 20% × 7% = 1.4%. If it returns 6%, the hurdle is not cleared and \u003cb>no carry arises at all\u003c/b> — though the management fee is still charged. In private equity the hurdle usually operates within a distribution waterfall: return of capital, then the preferred return to LPs, then a GP catch-up, then the 80/20 split.\u003c/p>\u003cp>\u003cb>Why investors insist on it.\u003c/b> Without a hurdle a manager would earn carry on returns achievable by simply being invested in a rising market — being paid for \u003cb>beta rather than skill\u003c/b>. The hurdle ensures the manager shares only in genuine outperformance and ranks the investor's return ahead of the manager's profit. It works alongside the \u003cb>high-water mark\u003c/b>, which prevents carry being charged twice on gains that merely recover an earlier loss.\u003c/p>","rubric":"Definition (0.4) · formula with a worked example including the below-hurdle case (0.8) · beta-versus-skill rationale (0.5) · relationship to the high-water mark or waterfall (0.3).","qVi":"Giải thích ngưỡng sinh lời là gì, nó vận hành thế nào trong công thức tính phí, và vì sao nhà đầu tư đòi hỏi phải có nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Ngưỡng sinh lời\u003c/b> (mức sinh lời ưu tiên) là mức lợi suất tối thiểu mà nhà đầu tư phải nhận được trước khi nhà quản lý được thu \u003cb>phí hiệu quả\u003c/b>. Nó thường được biểu diễn dưới dạng tỷ lệ phần trăm hằng năm — phổ biến là 8% trong vốn cổ phần tư nhân — và được thống nhất trong hồ sơ quỹ.\u003c/p>\u003cp>\u003cb>Cách vận hành.\u003c/b> Phí hiệu quả chỉ được thu trên phần lợi suất \u003cb>vượt quá\u003c/b> ngưỡng: \u003ci>Phí hiệu quả = tỷ lệ lãi thưởng × max(Lợi suất gộp − Ngưỡng, 0)\u003c/i>. Nếu một quỹ thu 20% lãi thưởng trên ngưỡng 8% và đạt lợi suất gộp 15%, phần vượt là 7% và lãi thưởng là 20% × 7% = 1,4%. Nếu quỹ đạt 6%, ngưỡng không được vượt qua và \u003cb>không phát sinh lãi thưởng nào\u003c/b> — dù phí quản lý vẫn được thu. Trong vốn cổ phần tư nhân, ngưỡng thường vận hành trong một mô hình thác nước phân phối: hoàn vốn, rồi mức sinh lời ưu tiên cho LP, rồi phần bù trừ cho GP, rồi chia 80/20.\u003c/p>\u003cp>\u003cb>Vì sao nhà đầu tư đòi hỏi nó.\u003c/b> Không có ngưỡng, nhà quản lý sẽ hưởng lãi thưởng trên những khoản lợi suất đạt được chỉ nhờ tham gia một thị trường đi lên — được trả cho \u003cb>beta chứ không phải kỹ năng\u003c/b>. Ngưỡng bảo đảm nhà quản lý chỉ chia sẻ phần hiệu quả vượt trội thực sự và xếp lợi suất của nhà đầu tư trước lợi nhuận của nhà quản lý. Nó hoạt động song hành với \u003cb>mốc cao nhất\u003c/b>, thứ ngăn việc thu lãi thưởng hai lần trên những khoản lãi chỉ đơn thuần bù đắp một khoản lỗ trước đó.\u003c/p>","rubricVi":"Định nghĩa (0,4) · công thức với ví dụ tính gồm trường hợp dưới ngưỡng (0,8) · lập luận beta so với kỹ năng (0,5) · quan hệ với mốc cao nhất hoặc mô hình thác nước (0,3)."},{"id":"N4-03","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what an investment policy statement should contain and why it should specify a benchmark in advance.","guide":"\u003cp>\u003cb>Model answer — contents.\u003c/b> The IPS records: the client's \u003cb>objectives\u003c/b> — required or target return and risk tolerance; the \u003cb>constraints\u003c/b> — time horizon, liquidity needs, tax position, legal and regulatory circumstances, and unique preferences such as excluded sectors; the \u003cb>strategic asset allocation\u003c/b> with permitted ranges; the \u003cb>benchmark\u003c/b>; permitted instruments and explicit prohibitions; the \u003cb>rebalancing\u003c/b> policy; reporting arrangements and frequency; and the \u003cb>review schedule\u003c/b>. It should also record the basis on which risk tolerance and capacity were assessed.\u003c/p>\u003cp>\u003cb>Why the benchmark must be specified in advance.\u003c/b> A benchmark chosen \u003ci>after\u003c/i> the event can flatter almost any outcome: a manager who underperformed equities can point to a bond index, or select the one sector index they happened to beat. Specifying it beforehand creates an \u003cb>objective, unavoidable standard\u003c/b> against which performance will be judged.\u003c/p>\u003cp>It also defines the mandate prospectively: the benchmark tells the manager which asset class and style they are expected to pursue, so departures from it are visible as \u003cb>style drift\u003c/b> and measurable as tracking error. And it protects the manager as much as the client — with an agreed benchmark, a manager who outperforms in a falling market can demonstrate that they did their job, rather than being judged against an absolute expectation that was never agreed.\u003c/p>","rubric":"At least six IPS contents (0.8) · retrospective-selection problem (0.6) · mandate definition, style drift and protection of the manager (0.6).","qVi":"Giải thích một tuyên bố chính sách đầu tư nên chứa những gì và vì sao nó nên xác định chỉ số tham chiếu từ trước.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — nội dung.\u003c/b> IPS ghi lại: \u003cb>mục tiêu\u003c/b> của khách hàng — lợi suất yêu cầu hoặc mục tiêu và khả năng chịu đựng rủi ro; các \u003cb>ràng buộc\u003c/b> — chân trời thời gian, nhu cầu thanh khoản, tình trạng thuế, hoàn cảnh pháp lý và quản lý, cùng các ưu tiên đặc thù như những ngành bị loại trừ; \u003cb>phân bổ tài sản chiến lược\u003c/b> với các biên độ cho phép; \u003cb>chỉ số tham chiếu\u003c/b>; các công cụ được phép và những điều cấm rõ ràng; chính sách \u003cb>tái cân bằng\u003c/b>; thu xếp báo cáo và tần suất; và \u003cb>lịch rà soát\u003c/b>. Nó cũng nên ghi lại cơ sở đánh giá khả năng chịu đựng và năng lực chịu rủi ro.\u003c/p>\u003cp>\u003cb>Vì sao chỉ số tham chiếu phải được xác định từ trước.\u003c/b> Một chỉ số tham chiếu được chọn \u003ci>sau\u003c/i> sự việc có thể tô hồng hầu như mọi kết quả: một nhà quản lý thua cổ phiếu có thể viện dẫn một chỉ số trái phiếu, hoặc chọn đúng một chỉsố ngành mà họ tình cờ vượt qua. Xác định nó từ trước tạo ra một \u003cb>chuẩn mực khách quan, không thể né tránh\u003c/b> để đánh giá hiệu quả.\u003c/p>\u003cp>Nó cũng định nghĩa mệnh lệnh một cách dự phóng: chỉ số tham chiếu cho nhà quản lý biết họ được kỳ vọng theo đuổi lớp tài sản và phong cách nào, nên các sai lệch khỏi nó hiện rõ dưới dạng \u003cb>trôi dạt phong cách\u003c/b> và đo lường được bằng sai số theo dõi. Và nó bảo vệ nhà quản lý không kém gì khách hàng — với một chỉ số tham chiếu đã thống nhất, một nhà quản lý vượt trội trong thị trường giảm có thể chứng minh rằng họ đã làm tốt công việc, thay vì bị đánh giá theo một kỳ vọng tuyệt đối chưa bao giờ được thống nhất.\u003c/p>","rubricVi":"Ít nhất sáu nội dung IPS (0,8) · vấn đề chọn hồi tố (0,6) · định nghĩa mệnh lệnh, trôi dạt phong cách và bảo vệ nhà quản lý (0,6)."},{"id":"N5-01","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the process of listing advisory from initial assessment to first trading day.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Assessment and gap analysis.\u003c/b> Test the company against the exchange's quantitative and qualitative criteria — charter capital, operating history, profitability and ROE, ownership dispersion, absence of overdue debts — and identify the gaps to be closed.\u003c/p>\u003cp>\u003cb>(2) Restructuring and preparation.\u003c/b> Address those gaps: convert the legal form if necessary, restructure ownership and group companies, clean up or formalise \u003cb>related-party transactions\u003c/b>, appoint a reputable auditor and restate accounts if required, appoint independent directors and establish an audit committee, and build the capability for continuous disclosure.\u003c/p>\u003cp>\u003cb>(3) Valuation, structure and timing.\u003c/b> Value the company using comparables, precedent transactions and DCF; decide the size and structure of the offering, the primary/secondary split, the choice of exchange and the timing relative to market conditions and the reporting calendar.\u003c/p>\u003cp>\u003cb>(4) Documentation and submission.\u003c/b> Prepare the listing application and \u003cb>prospectus\u003c/b> with audited financial statements and risk factors, supported by legal and financial due diligence; submit to the exchange and, where applicable, the State Securities Commission; respond to their queries.\u003c/p>\u003cp>\u003cb>(5) Marketing and pricing\u003c/b> where the listing is accompanied by an offering — roadshow, bookbuilding, pricing and allocation.\u003c/p>\u003cp>\u003cb>(6) First trading day\u003c/b>, followed by \u003cb>aftermarket support\u003c/b> and the transition to continuous disclosure, investor relations and periodic reporting.\u003c/p>","rubric":"Six stages in correct sequence (1.2) · substantive content in at least four (0.5) · post-listing obligations (0.3).","qVi":"Giải thích quy trình tư vấn niêm yết từ đánh giá ban đầu tới ngày giao dịch đầu tiên.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Đánh giá và phân tích khoảng trống.\u003c/b> Kiểm định công ty theo các tiêu chí định lượng và định tính của sở giao dịch — vốn điều lệ, lịch sử hoạt động, khả năng sinh lời và ROE, phân tán sở hữu, không có nợ quá hạn — và nhận diện các khoảng trống cần khép lại.\u003c/p>\u003cp>\u003cb>(2) Tái cấu trúc và chuẩn bị.\u003c/b> Xử lý các khoảng trống đó: chuyển đổi loại hình pháp lý nếu cần, tái cấu trúc sở hữu và các công ty trong tập đoàn, làm sạch hoặc chính thức hóa các \u003cb>giao dịch với bên liên quan\u003c/b>, bổ nhiệm một kiểm toán uy tín và trình bày lại báo cáo nếu cần, bổ nhiệm thành viên hội đồng quản trị độc lập và thiết lập ủy ban kiểm toán, và xây dựng năng lực công bố thông tin liên tục.\u003c/p>\u003cp>\u003cb>(3) Định giá, cấu trúc và thời điểm.\u003c/b> Định giá công ty bằng công ty so sánh, giao dịch tiền lệ và DCF; quyết định quy mô và cấu trúc đợt chào bán, tỷ lệ sơ cấp/thứ cấp, việc chọn sở giao dịch và thời điểm tương quan với điều kiện thị trường cùng lịch báo cáo.\u003c/p>\u003cp>\u003cb>(4) Hồ sơ và nộp.\u003c/b> Chuẩn bị hồ sơ niêm yết và \u003cb>bản cáo bạch\u003c/b> với báo cáo tài chính đã kiểm toán và các yếu tố rủi ro, được hỗ trợ bởi thẩm định pháp lý và tài chính; nộp cho sở giao dịch và, nơi áp dụng, cho Uỷ ban Chứng khoán Nhà nước; phản hồi các chất vấn của họ.\u003c/p>\u003cp>\u003cb>(5) Tiếp thị và định giá\u003c/b> khi việc niêm yết đi kèm một đợt chào bán — roadshow, dựng sổ, định giá và phân bổ.\u003c/p>\u003cp>\u003cb>(6) Ngày giao dịch đầu tiên\u003c/b>, tiếp theo là \u003cb>hỗ trợ thị trường thứ cấp\u003c/b> và việc chuyển sang công bố thông tin liên tục, quan hệ nhà đầu tư và báo cáo định kỳ.\u003c/p>","rubricVi":"Sáu giai đoạn theo đúng trình tự (1,2) · nội dung thực chất trong ít nhất bốn giai đoạn (0,5) · nghĩa vụ sau niêm yết (0,3)."},{"id":"N5-02","ch":5,"type":"calc-essay","clo":"CLO2","marks":2,"exam":"final","q":"A company has EBITDA of VND 450bn, EBIT of VND 300bn, net debt of VND 700bn and 120m shares. Peers trade at 9× EV/EBITDA and 13× EV/EBIT. Compute value per share on each basis and explain the difference.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>EV/EBITDA basis:\u003c/b> EV = 9 × 450 = VND 4,050bn; equity = 4,050 − 700 = VND 3,350bn; per share = 3,350bn ÷ 120m = \u003cb>VND 27,917\u003c/b>.\u003c/p>\u003cp>\u003cb>EV/EBIT basis:\u003c/b> EV = 13 × 300 = VND 3,900bn; equity = 3,900 − 700 = VND 3,200bn; per share = 3,200bn ÷ 120m = \u003cb>VND 26,667\u003c/b>.\u003c/p>\u003cp>\u003cb>The difference\u003c/b> is VND 1,250 per share, about 4.5% — the EBITDA basis giving the higher value.\u003c/p>\u003cp>\u003cb>Why they differ.\u003c/b> The two multiples capitalise different measures. EBITDA is struck \u003cb>before\u003c/b> depreciation and amortisation, so it ignores the consumption of the asset base; EBIT is struck \u003cb>after\u003c/b>, so it reflects the cost of maintaining the assets that generate the earnings. Here depreciation and amortisation is 450 − 300 = \u003cb>VND 150bn\u003c/b>, a substantial 33% of EBITDA, indicating a reasonably capital-intensive business.\u003c/p>\u003cp>The gap arises because the subject company's D&amp;A intensity differs from that implied by the peer multiples. For a capital-intensive company \u003cb>EV/EBIT is the more reliable measure\u003c/b>, since EBITDA systematically flatters firms that must reinvest heavily just to stand still — EV/(EBITDA − capex) is an equally defensible refinement. The practical response is to present both, explain the driver of the divergence, and state which is preferred and why, rather than silently choosing the higher one.\u003c/p>","rubric":"Both valuations computed correctly (1.0) · D&A quantified as the source of divergence (0.5) · reasoned preference for EV/EBIT in a capital-intensive business and the presentational point (0.5).","qVi":"Một công ty có EBITDA 450 tỷ đồng, EBIT 300 tỷ đồng, nợ ròng 700 tỷ đồng và 120 triệu cổ phần. Nhóm so sánh giao dịch ở 9× EV/EBITDA và 13× EV/EBIT. Tính giá trị mỗi cổ phần theo mỗi cơ sở và giải thích sự khác biệt.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Cơ sở EV/EBITDA:\u003c/b> EV = 9 × 450 = 4.050 tỷ đồng; vốn chủ = 4.050 − 700 = 3.350 tỷ đồng; mỗi cổ phần = 3.350 tỷ ÷ 120 triệu = \u003cb>27.917 đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Cơ sở EV/EBIT:\u003c/b> EV = 13 × 300 = 3.900 tỷ đồng; vốn chủ = 3.900 − 700 = 3.200 tỷ đồng; mỗi cổ phần = 3.200 tỷ ÷ 120 triệu = \u003cb>26.667 đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Sự khác biệt\u003c/b> là 1.250 đồng mỗi cổ phần, khoảng 4,5% — cơ sở EBITDA cho giá trị cao hơn.\u003c/p>\u003cp>\u003cb>Vì sao chúng khác nhau.\u003c/b> Hai bội số vốn hóa các chỉ tiêu khác nhau. EBITDA được tính \u003cb>trước\u003c/b> khấu hao, nên nó bỏ qua việc tiêu hao nền tài sản; EBIT được tính \u003cb>sau\u003c/b>, nên nó phản ánh chi phí duy trì các tài sản tạo ra lợi nhuận. Ở đây khấu hao là 450 − 300 = \u003cb>150 tỷ đồng\u003c/b>, chiếm 33% EBITDA — một tỷ trọng đáng kể, cho thấy một doanh nghiệp khá thâm dụng vốn.\u003c/p>\u003cp>Khoảng cách phát sinh vì mức độ thâm dụng khấu hao của công ty khác với mức ngụ ý bởi bội số của nhóm so sánh. Với một công ty thâm dụng vốn, \u003cb>EV/EBIT là thước đo đáng tin cậy hơn\u003c/b>, vì EBITDA tô hồng một cách có hệ thống các doanh nghiệp phải tái đầu tư nặng chỉ để đứng yên tại chỗ — EV/(EBITDA − chi tiêu vốn) là một cách tinh chỉnh cũng bảo vệ được không kém. Phản ứng thực tiễn là trình bày cả hai, giải thích yếu tố gây ra sự phân kỳ, và nêu rõ thước đo nào được ưu tiên cùng lý do, thay vì lặng lẽ chọn con số cao hơn.\u003c/p>","rubricVi":"Tính đúng cả hai mức định giá (1,0) · định lượng khấu hao là nguồn gốc của sự phân kỳ (0,5) · ưu tiên có lập luận cho EV/EBIT trong doanh nghiệp thâm dụng vốn và điểm về cách trình bày (0,5)."},{"id":"N5-03","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what capital restructuring is, why a company might undertake it, and the main constraints.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Capital restructuring\u003c/b> changes the composition of the right-hand side of the balance sheet — the mix of debt and equity, and the maturity and currency profile of liabilities — without necessarily altering the operating business.\u003c/p>\u003cp>\u003cb>Why undertake it.\u003c/b> To \u003cb>reduce the cost of capital\u003c/b> by substituting cheaper, tax-deductible debt for equity; to \u003cb>match\u003c/b> the maturity and currency of liabilities to the assets they fund, correcting a mismatch; to \u003cb>restore flexibility and debt capacity\u003c/b> where leverage has become excessive; to \u003cb>resolve\u003c/b> covenant breaches or an approaching refinancing wall; to \u003cb>return surplus capital\u003c/b> to shareholders through a buyback or dividend recapitalisation where the balance sheet is over-capitalised and depressing ROE; or to \u003cb>fund growth\u003c/b>. Typical transactions are recapitalisations, refinancing, dividend recaps, buybacks, rights issues and debt-for-equity swaps.\u003c/p>\u003cp>\u003cb>Constraints.\u003c/b> \u003cb>Financial distress costs\u003c/b> rise with leverage — lost customers and suppliers, forced asset sales, management distraction — and set the practical ceiling. \u003cb>Cash-flow volatility\u003c/b> determines how much fixed obligation the business can safely bear, so the optimum is lower for cyclical or asset-light firms. \u003cb>Covenants\u003c/b> in existing agreements may restrict further borrowing, asset sales or distributions. \u003cb>Rating implications\u003c/b> matter where the issuer needs continued market access. Market conditions determine whether debt or equity can actually be raised and on what terms. And \u003cb>shareholder approval\u003c/b> is required for issuance or large distributions.\u003c/p>","rubric":"Definition (0.4) · at least four purposes with example transactions (0.8) · at least four constraints incl. distress costs and covenants (0.8).","qVi":"Giải thích tái cấu trúc vốn là gì, vì sao một công ty có thể thực hiện nó, và các ràng buộc chính.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Tái cấu trúc vốn\u003c/b> thay đổi thành phần của phía bên phải bảng cân đối — tỷ lệ giữa nợ và vốn chủ, cùng cơ cấu kỳ hạn và loại tiền tệ của các nghĩa vụ nợ — mà không nhất thiết làm thay đổi hoạt động kinh doanh.\u003c/p>\u003cp>\u003cb>Vì sao thực hiện nó.\u003c/b> Để \u003cb>giảm chi phí vốn\u003c/b> bằng cách thay vốn chủ bằng nợ rẻ hơn, được khấu trừ thuế; để \u003cb>khớp\u003c/b> kỳ hạn và loại tiền tệ của nghĩa vụ nợ với tài sản mà chúng tài trợ, sửa một sự lệch pha; để \u003cb>khôi phục sự linh hoạt và năng lực vay nợ\u003c/b> khi đòn bẩy đã trở nên quá cao; để \u003cb>xử lý\u003c/b> việc vi phạm điều khoản ràng buộc hoặc một đợt tái tài trợ đang tới gần; để \u003cb>hoàn vốn dư thừa\u003c/b> cho cổ đông qua mua lại cổ phiếu hoặc tái cấp vốn để chia cổ tức khi bảng cân đối thừa vốn và làm giảm ROE; hoặc để \u003cb>tài trợ tăng trưởng\u003c/b>. Các giao dịch điển hình là tái cấp vốn, tái tài trợ, tái cấp vốn để chia cổ tức, mua lại cổ phiếu, phát hành quyền mua và hoán đổi nợ thành vốn chủ.\u003c/p>\u003cp>\u003cb>Các ràng buộc.\u003c/b> \u003cb>Chi phí kiệt quệ tài chính\u003c/b> tăng theo đòn bẩy — mất khách hàng và nhà cung cấp, buộc bán tài sản, ban điều hành bị phân tán — và đặt ra trần thực tế. \u003cb>Biến động dòng tiền\u003c/b> quyết định doanh nghiệp có thể gánh an toàn bao nhiêu nghĩa vụ cố định, nên điểm tối ưu thấp hơn với các doanh nghiệp có tính chu kỳ hoặc ít tài sản. \u003cb>Các điều khoản ràng buộc\u003c/b> trong các hợp đồng hiện hữu có thể hạn chế việc vay thêm, bán tài sản hoặc phân phối lợi nhuận. \u003cb>Hàm ý về xếp hạng tín nhiệm\u003c/b> quan trọng khi tổ chức phát hành cần duy trì khả năng tiếp cận thị trường. Điều kiện thị trường quyết định liệu nợ hay vốn chủ có thực sự huy động được hay không và với điều kiện nào. Và cần \u003cb>sự chấp thuận của cổ đông\u003c/b> đối với việc phát hành hoặc các khoản phân phối lớn.\u003c/p>","rubricVi":"Định nghĩa (0,4) · ít nhất bốn mục đích kèm giao dịch ví dụ (0,8) · ít nhất bốn ràng buộc gồm chi phí kiệt quệ và điều khoản ràng buộc (0,8)."},{"id":"N6-01","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the requirements imposed on market-making activity and why they exist.","guide":"\u003cp>\u003cb>Model answer — requirements.\u003c/b> A registered market maker typically must: maintain \u003cb>minimum capital\u003c/b> sufficient to carry inventory and absorb losses; \u003cb>quote continuously\u003c/b> on both the bid and the offer during defined periods of the trading session; quote within a \u003cb>maximum spread\u003c/b> and for at least a \u003cb>minimum size\u003c/b>; maintain a minimum \u003cb>presence ratio\u003c/b> — a proportion of the session during which compliant quotes are displayed; observe \u003cb>position and risk limits\u003c/b>; keep records permitting reconstruction of its quoting; and refrain from manipulative practices and from trading on inside information. It must also separate market-making inventory from any proprietary book and give client orders priority.\u003c/p>\u003cp>\u003cb>Why they exist.\u003c/b> A market maker enjoys advantages — it sees order flow, and in some markets receives fee rebates or designated status. The obligations are the consideration for those advantages. Without them a dealer would quote only when conditions were favourable and withdraw precisely when volatility rose, which is when liquidity is most needed. Mandating continuous two-sided quotes within a maximum spread and minimum size makes the liquidity \u003cb>dependable\u003c/b> rather than fair-weather.\u003c/p>\u003cp>The obligations also protect \u003cb>market quality and integrity\u003c/b>: they narrow spreads, reduce volatility, absorb temporary imbalances, and give smaller companies a viable market where natural two-way interest is thin — reducing the liquidity discount at which their shares would otherwise trade.\u003c/p>","rubric":"At least five requirements (1.0) · obligations as consideration for privileges and the fair-weather problem (0.6) · market-quality benefit incl. small-cap liquidity (0.4).","qVi":"Giải thích các yêu cầu áp đặt lên hoạt động tạo lập thị trường và vì sao chúng tồn tại.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các yêu cầu.\u003c/b> Một nhà tạo lập thị trường đã đăng ký thường phải: duy trì \u003cb>vốn tối thiểu\u003c/b> đủ để gánh tồn kho và hấp thụ tổn thất; \u003cb>yết giá liên tục\u003c/b> ở cả chiều mua và chiều bán trong các khoảng thời gian xác định của phiên giao dịch; yết trong một \u003cb>mức chênh lệch tối đa\u003c/b> và cho ít nhất một \u003cb>khối lượng tối thiểu\u003c/b>; duy trì một \u003cb>tỷ lệ hiện diện\u003c/b> tối thiểu — tỷ lệ thời gian của phiên trong đó các mức yết hợp lệ được hiển thị; tuân thủ \u003cb>giới hạn vị thế và rủi ro\u003c/b>; lưu trữ hồ sơ cho phép tái dựng việc yết giá của mình; và không thực hiện các hành vi thao túng cũng như không giao dịch dựa trên thông tin nội bộ. Họ cũng phải tách tồn kho tạo lập thị trường khỏi bất kỳ sổ tự doanh nào và dành ưu tiên cho lệnh khách hàng.\u003c/p>\u003cp>\u003cb>Vì sao chúng tồn tại.\u003c/b> Một nhà tạo lập thị trường được hưởng các lợi thế — họ nhìn thấy dòng lệnh, và ở một số thị trường được hoàn phí hoặc được cấp tư cách chỉ định. Các nghĩa vụ là phần đối ứng cho những lợi thế đó. Nếu không có chúng, một nhà tạo lập sẽ chỉ yết giá khi điều kiện thuận lợi và rút lui đúng lúc biến động tăng, tức là đúng lúc thanh khoản cần thiết nhất. Việc bắt buộc yết giá hai chiều liên tục trong một mức chênh lệch tối đa và khối lượng tối thiểu làm cho thanh khoản trở nên \u003cb>đáng tin cậy\u003c/b> chứ không phải chỉ có khi trời đẹp.\u003c/p>\u003cp>Các nghĩa vụ cũng bảo vệ \u003cb>chất lượng và tính liêm chính của thị trường\u003c/b>: chúng thu hẹp chênh lệch giá, giảm biến động, hấp thụ mất cân đối tạm thời, và tạo ra một thị trường khả thi cho các công ty nhỏ nơi nhu cầu hai chiều tự nhiên còn mỏng — làm giảm mức chiết khấu thanh khoản mà cổ phiếu của họ vốn dĩ phải chịu.\u003c/p>","rubricVi":"Ít nhất năm yêu cầu (1,0) · nghĩa vụ như phần đối ứng cho đặc quyền và vấn đề chỉ hoạt động khi thuận lợi (0,6) · lợi ích về chất lượng thị trường gồm thanh khoản cho cổ phiếu vốn hóa nhỏ (0,4)."},{"id":"N6-02","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the benefits and risks of margin lending from the investor's perspective.","guide":"\u003cp>\u003cb>Model answer — benefits.\u003c/b> \u003cb>Amplified returns\u003c/b>: leverage multiplies the percentage return on the investor's own equity, so at 2× leverage a 20% price rise produces roughly a 40% return on capital employed. \u003cb>Increased purchasing power\u003c/b>, allowing a larger position or greater diversification than the investor's own funds would permit. \u003cb>Flexibility\u003c/b>, since the facility can be drawn without selling existing holdings — avoiding crystallising a taxable gain or losing a position the investor wishes to keep. \u003cb>Speed\u003c/b>, allowing the investor to act on an opportunity before funds are available.\u003c/p>\u003cp>\u003cb>Risks.\u003c/b> \u003cb>Amplified losses\u003c/b> — the same leverage doubles or trebles the loss, and the investor can lose more than the market fall implies. \u003cb>Margin calls\u003c/b>: if equity falls below the maintenance requirement the investor must deposit funds at short notice, typically in a falling market when liquidity is scarcest. \u003cb>Forced liquidation\u003c/b> at the broker's discretion if the call is unmet — crystallising the loss at the worst moment and removing any chance of benefiting from a recovery. \u003cb>Interest cost\u003c/b>, which accrues regardless of performance and erodes returns. \u003cb>Loss of control\u003c/b> over the timing of exit. And a \u003cb>concentration trap\u003c/b> where the borrower has pledged the very securities they are leveraged into, so a fall hits collateral and position simultaneously.\u003c/p>\u003cp>The asymmetry is the key point: leverage magnifies both directions, but only the downside can force the investor out of the position entirely.\u003c/p>","rubric":"At least three benefits (0.6) · at least four risks incl. margin call and forced liquidation (0.9) · the asymmetry insight (0.5).","qVi":"Giải thích lợi ích và rủi ro của cho vay ký quỹ từ góc nhìn của nhà đầu tư.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — lợi ích.\u003c/b> \u003cb>Lợi nhuận được khuếch đại\u003c/b>: đòn bẩy nhân lên tỷ lệ phần trăm lợi nhuận trên vốn chủ của chính nhà đầu tư, nên ở đòn bẩy 2× một đợt tăng giá 20% tạo ra khoảng 40% lợi nhuận trên vốn đã bỏ ra. \u003cb>Tăng sức mua\u003c/b>, cho phép một vị thế lớn hơn hoặc mức đa dạng hóa cao hơn so với khả năng của vốn tự có. \u003cb>Tính linh hoạt\u003c/b>, vì hạn mức có thể được rút mà không phải bán các khoản đang nắm giữ — tránh việc hiện thực hóa một khoản lãi chịu thuế hoặc mất một vị thế mà nhà đầu tư muốn giữ. \u003cb>Tốc độ\u003c/b>, cho phép nhà đầu tư hành động trước một cơ hội trước khi có sẵn tiền.\u003c/p>\u003cp>\u003cb>Rủi ro.\u003c/b> \u003cb>Tổn thất được khuếch đại\u003c/b> — chính đòn bẩy đó nhân đôi hoặc nhân ba khoản lỗ, và nhà đầu tư có thể mất nhiều hơn mức mà đợt giảm của thị trường hàm ý. \u003cb>Lệnh gọi ký quỹ\u003c/b>: nếu vốn chủ giảm dưới yêu cầu duy trì, nhà đầu tư phải nộp tiền trong thời gian ngắn, thường là trong một thị trường đang giảm khi thanh khoản khan hiếm nhất. \u003cb>Thanh lý bắt buộc\u003c/b> theo quyết định của công ty môi giới nếu lệnh gọi không được đáp ứng — hiện thực hóa khoản lỗ vào thời điểm tồi tệ nhất và loại bỏ mọi cơ hội hưởng lợi từ một đợt hồi phục. \u003cb>Chi phí lãi vay\u003c/b>, phát sinh bất kể hiệu quả và bào mòn lợi nhuận. \u003cb>Mất quyền kiểm soát\u003c/b> về thời điểm thoát vị thế. Và một \u003cb>bẫy tập trung\u003c/b> khi người vay đã cầm cố chính những chứng khoán mà họ đang dùng đòn bẩy để nắm giữ, nên một đợt giảm tác động đồng thời lên cả tài sản bảo đảm lẫn vị thế.\u003c/p>\u003cp>Sự bất đối xứng là điểm then chốt: đòn bẩy khuếch đại cả hai chiều, nhưng chỉ chiều đi xuống mới có thể buộc nhà đầu tư phải rời khỏi vị thế hoàn toàn.\u003c/p>","rubricVi":"Ít nhất ba lợi ích (0,6) · ít nhất bốn rủi ro gồm lệnh gọi ký quỹ và thanh lý bắt buộc (0,9) · nhận thức về sự bất đối xứng (0,5)."},{"id":"N6-03","ch":6,"type":"case","clo":"CLO3","marks":3,"exam":"final","q":"A retail investor asks your advice on short selling a stock they believe is overvalued. Explain the mechanics, the risks, and what you would advise.","guide":"\u003cp>\u003cb>Model answer — mechanics.\u003c/b> The investor \u003cb>borrows\u003c/b> the shares through their broker from a lender — typically a fund or custodian — against collateral and a borrow fee. They \u003cb>sell\u003c/b> the borrowed shares in the market at today's price. Later they \u003cb>buy back\u003c/b> the same number of shares and \u003cb>return\u003c/b> them to the lender. Profit = sale price − repurchase price − borrow fee − any dividends that must be passed through to the lender. The position is margined and marked to market throughout.\u003c/p>\u003cp>\u003cb>Risks.\u003c/b> (1) \u003cb>Unlimited theoretical loss\u003c/b> — a long position can fall only to zero, but a shorted share can rise without bound; the loss is unbounded while the maximum gain is capped at 100%. (2) \u003cb>Time works against you\u003c/b> — the borrow fee accrues daily and can spike for hard-to-borrow stock, and all dividends must be paid across, whereas a long holder receives them. (3) \u003cb>Recall risk\u003c/b> — the lender may demand the shares back, forcing the investor to cover at a moment not of their choosing. (4) \u003cb>Short squeeze\u003c/b> — if the position is crowded, rising prices force many shorts to buy simultaneously, driving the price sharply higher. (5) \u003cb>Margin calls\u003c/b> as losses erode collateral. (6) \u003cb>Regulatory risk\u003c/b> — restrictions or bans may be imposed; in Vietnam covered short selling is restricted, so the transaction may not be available at all.\u003c/p>\u003cp>\u003cb>Advice.\u003c/b> First, establish whether short selling is \u003cb>permitted and available\u003c/b> for this security in this market — in Vietnam this is the threshold question and frequently ends the discussion. Second, assess \u003cb>suitability\u003c/b>: for a retail investor, an instrument with unbounded loss, ongoing carrying costs and forced-exit risk is rarely appropriate, and I would need to document that the risks were explained and understood. Third, note that being \u003cb>right about valuation is not sufficient\u003c/b> — the position must also be right about \u003ci>timing\u003c/i>, since an overvalued stock can remain overvalued longer than the investor can fund the position. Fourth, discuss \u003cb>alternatives\u003c/b> with defined maximum loss, such as simply not owning the stock, reducing exposure to the sector, or where available a put option, whose loss is capped at the premium. If the investor proceeds, insist on \u003cb>position sizing\u003c/b> that survives a large adverse move and on a predetermined stop.\u003c/p>","rubric":"Four-step mechanism with the profit formula (0.8) · at least four risks incl. unlimited loss and squeeze/recall (0.9) · availability and suitability assessment (0.6) · timing point and capped-loss alternatives (0.7).","qVi":"Một nhà đầu tư cá nhân hỏi ý kiến bạn về việc bán khống một cổ phiếu mà họ cho là bị định giá quá cao. Giải thích cơ chế, các rủi ro, và điều bạn sẽ tư vấn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — cơ chế.\u003c/b> Nhà đầu tư \u003cb>vay\u003c/b> cổ phần qua công ty môi giới từ một bên cho vay — thường là một quỹ hoặc ngân hàng lưu ký — để đổi lấy tài sản bảo đảm và một khoản phí vay. Họ \u003cb>bán\u003c/b> số cổ phần đã vay trên thị trường ở giá hôm nay. Sau đó họ \u003cb>mua lại\u003c/b> đúng số cổ phần đó và \u003cb>trả lại\u003c/b> cho bên cho vay. Lợi nhuận = giá bán − giá mua lại − phí vay − mọi khoản cổ tức phải trả lại cho bên cho vay. Vị thế được ký quỹ và định giá lại theo thị trường xuyên suốt.\u003c/p>\u003cp>\u003cb>Các rủi ro.\u003c/b> (1) \u003cb>Lỗ về lý thuyết là không giới hạn\u003c/b> — một vị thế mua chỉ có thể giảm về 0, nhưng một cổ phiếu bị bán khống có thể tăng vô hạn; khoản lỗ không có chặn trên trong khi khoản lãi tối đa bị chặn ở 100%. (2) \u003cb>Thời gian bất lợi cho bạn\u003c/b> — phí vay tích lũy hằng ngày và có thể tăng vọt với cổ phiếu khó vay, và mọi khoản cổ tức đều phải trả lại, trong khi người nắm giữ vị thế mua lại nhận được chúng. (3) \u003cb>Rủi ro thu hồi\u003c/b> — bên cho vay có thể đòi lại cổ phần, buộc nhà đầu tư phải mua bù vào thời điểm không do họ chọn. (4) \u003cb>Siết mua\u003c/b> — nếu vị thế đông đảo, giá tăng buộc nhiều người bán khống phải mua đồng thời, đẩy giá lên mạnh. (5) \u003cb>Lệnh gọi ký quỹ\u003c/b> khi tổn thất bào mòn tài sản bảo đảm. (6) \u003cb>Rủi ro pháp lý\u003c/b> — các hạn chế hoặc lệnh cấm có thể được áp đặt; tại Việt Nam bán khống có bảo đảm bị hạn chế, nên giao dịch này có thể hoàn toàn không khả dụng.\u003c/p>\u003cp>\u003cb>Lời tư vấn.\u003c/b> Thứ nhất, xác định xem bán khống có \u003cb>được phép và có khả dụng\u003c/b> cho chứng khoán này trên thị trường này hay không — tại Việt Nam đây là câu hỏi ngưỡng và thường kết thúc luôn cuộc thảo luận. Thứ hai, đánh giá \u003cb>tính phù hợp\u003c/b>: với một nhà đầu tư cá nhân, một công cụ có mức lỗ không chặn trên, chi phí nắm giữ liên tục và rủi ro bị buộc thoát vị thế hiếm khi là phù hợp, và tôi sẽ cần ghi chép rằng các rủi ro đã được giải thích và được hiểu. Thứ ba, lưu ý rằng \u003cb>đúng về định giá là chưa đủ\u003c/b> — vị thế còn phải đúng cả về \u003ci>thời điểm\u003c/i>, vì một cổ phiếu bị định giá quá cao có thể duy trì tình trạng đó lâu hơn khả năng tài trợ vị thế của nhà đầu tư. Thứ tư, thảo luận các \u003cb>phương án thay thế\u003c/b> có mức lỗ tối đa xác định, chẳng hạn đơn giản là không sở hữu cổ phiếu đó, giảm mức phơi nhiễm với ngành, hoặc nơi có sẵn thì dùng một quyền chọn bán, với khoản lỗ bị chặn ở mức phí quyền chọn. Nếu nhà đầu tư vẫn tiến hành, hãy yêu cầu \u003cb>định cỡ vị thế\u003c/b> đủ sức chịu một biến động bất lợi lớn và một mức cắt lỗ định trước.\u003c/p>","rubricVi":"Cơ chế bốn bước với công thức lợi nhuận (0,8) · ít nhất bốn rủi ro gồm lỗ không giới hạn và siết mua/thu hồi (0,9) · đánh giá tính khả dụng và tính phù hợp (0,6) · điểm về thời điểm và các phương án có mức lỗ chặn trên (0,7)."},{"id":"IB-C2","ch":2,"type":"case","clo":"CLO2, CLO3","marks":8,"q":"\u003cp>\u003cb>\"They are selling shares at a 38% discount — we are being robbed.\"\u003c/b>\u003c/p>\n\u003cp>Hoàng Minh Corporation (figures constructed for teaching) has \u003cb>100 million shares\u003c/b> trading at \u003cb>40,000 đ\u003c/b>. To fund a new plant the board announces a \u003cb>1-for-4 rights issue at 25,000 đ\u003c/b>: every shareholder may buy one new share for every four held.\u003c/p>\n\u003cp>A retail shareholder writes to the board: \u003ci>\"You are issuing shares at 25,000 when the market price is 40,000. That is a 38% discount and it transfers my money to whoever buys the new shares. I demand the issue be priced at market.\"\u003c/i>\u003c/p>\n\u003cp>\u003cb>Required.\u003c/b>\u003c/p>\n\u003col>\n\u003cli>\u003cb>(2 marks)\u003c/b> Compute the theoretical ex-rights price (TERP) and the value of one right.\u003c/li>\n\u003cli>\u003cb>(3 marks)\u003c/b> A shareholder holds 4 shares before the issue. Show her total wealth (a) before, (b) after, if she exercises her right, and (c) after, if she lets the right lapse. Is the shareholder's complaint correct?\u003c/li>\n\u003cli>\u003cb>(2 marks)\u003c/b> If the discount does not harm shareholders, why do issuers bother with one at all? Give two reasons.\u003c/li>\n\u003cli>\u003cb>(1 mark)\u003c/b> The bank proposes a \u003ci>standby underwriting\u003c/i> arrangement. What risk does that transfer, and from whom to whom?\u003c/li>\n\u003c/ol>","guide":"\u003cp>\u003cb>Part 1.\u003c/b> New shares issued = 100m × ¼ = \u003cb>25 million\u003c/b>.\u003c/p>\n\u003cp>TERP = (100m × 40,000 + 25m × 25,000) ÷ 125m = (4,000,000m + 625,000m) ÷ 125m = \u003cb>37,000 đ\u003c/b>.\u003c/p>\n\u003cp>Value of one right = (TERP − subscription price) × ratio = (37,000 − 25,000) × ¼ = \u003cb>3,000 đ\u003c/b> per existing share held.\u003c/p>\n\u003cp>\u003cb>Part 2.\u003c/b>\u003c/p>\n\u003cul>\n\u003cli>\u003cb>(a) Before:\u003c/b> 4 × 40,000 = \u003cb>160,000 đ\u003c/b>\u003c/li>\n\u003cli>\u003cb>(b) Exercises:\u003c/b> she now owns 5 shares worth 37,000 each = 185,000 đ, but paid 25,000 for the new one. Net wealth = 185,000 − 25,000 = \u003cb>160,000 đ\u003c/b>. Equivalently: 4 × 37,000 + (37,000 − 25,000) = 148,000 + 12,000 = 160,000 đ.\u003c/li>\n\u003cli>\u003cb>(c) Lets it lapse:\u003c/b> 4 × 37,000 = \u003cb>148,000 đ\u003c/b>. She has lost exactly \u003cb>12,000 đ\u003c/b> — which is 4 × 3,000, the value of the rights she threw away.\u003c/li>\n\u003c/ul>\n\u003cp>The complaint is \u003cb>wrong\u003c/b>, and it is wrong in an instructive way. The discount does not transfer wealth \u003ci>from\u003c/i> shareholders \u003ci>to\u003c/i> anyone, because in a rights issue the buyers of the cheap shares \u003cb>are\u003c/b> the existing shareholders, in exact proportion to what they already own. Her wealth is identical to the đồng whether the issue is priced at 25,000 or at 39,000; only the split between share price and right value changes.\u003c/p>\n\u003cp>What \u003ci>would\u003c/i> harm her is a discounted issue placed with outsiders — that is a placing, not a rights issue, and the distinction is the whole point of pre-emption rights.\u003c/p>\n\u003cp>The one real danger for her is \u003cb>inaction\u003c/b>. A shareholder who ignores the letter loses 12,000 đ. This is why underwriters and registrars chase retail holders, and why many markets require unexercised rights to be sold on the shareholder's behalf.\u003c/p>\n\u003cp>\u003cb>Part 3.\u003c/b> Two reasons a discount is nevertheless used:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Take-up insurance.\u003c/b> The offer period runs for weeks, and the market price moves during it. If the price fell below the subscription price the issue would fail entirely, because no one pays 39,000 for what the market sells at 37,500. A deep discount buys a margin of safety against that.\u003c/li>\n\u003cli>\u003cb>Underwriting cost.\u003c/b> The underwriter's fee prices the probability of being left holding unsubscribed shares. A deeper discount lowers that probability and therefore lowers the fee — the discount is, in effect, paid to shareholders themselves rather than to the bank.\u003c/li>\n\u003c/ul>\n\u003cp>A third acceptable answer: a discount improves the optics of take-up, and a visibly well-subscribed issue supports the aftermarket.\u003c/p>\n\u003cp>\u003cb>Part 4.\u003c/b> Standby underwriting transfers the risk of \u003cb>under-subscription\u003c/b> — the risk that shareholders do not take up their rights — from the \u003cb>issuer\u003c/b> to the \u003cb>underwriting bank\u003c/b>, which commits to buy whatever is left at the subscription price.\u003c/p>\n\u003cp>The issuer therefore knows its proceeds with certainty at signing. The bank charges for that certainty and manages the exposure by sub-underwriting to institutions. Note the incentive this creates: the bank prefers a \u003ci>deeper\u003c/i> discount than the issuer does, because a deeper discount makes its commitment safer. Whose interest the pricing recommendation actually serves is a fair question for the board to ask.\u003c/p>\n\u003cp class=\"small muted\">\u003cb>Where to look it up.\u003c/b> Rights issue mechanics and pre-emption rules in Vietnam: Law on Securities and the implementing decrees; issuer disclosures on HOSE/HNX for recent rights issues.\u003c/p>","rubric":"Part 1: TERP 1.0; value of a right 1.0. Part 2: three wealth figures 1.5; explicit statement that (a) and (b) are equal 0.75; identifying that the loss in (c) equals the value of the rights forgone 0.75. An answer that agrees with the shareholder's complaint scores zero for this part. Part 3: 1.0 per reason. Part 4: naming under-subscription risk and both parties 1.0; the observation about the bank's incentive earns credit if the rest is complete.","qVi":"\u003cp>\u003cb>\"Họ bán cổ phiếu với mức chiết khấu 38% — chúng tôi đang bị cướp.\"\u003c/b>\u003c/p>\n\u003cp>Tổng công ty Hoàng Minh (số liệu dựng cho mục đích giảng dạy) có \u003cb>100 triệu cổ phiếu\u003c/b> đang giao dịch ở giá \u003cb>40.000 đ\u003c/b>. Để tài trợ cho một nhà máy mới, hội đồng quản trị công bố \u003cb>đợt chào bán cổ phiếu cho cổ đông hiện hữu theo tỷ lệ 4:1, giá 25.000 đ\u003c/b>: cứ sở hữu bốn cổ phiếu thì cổ đông được quyền mua một cổ phiếu mới.\u003c/p>\n\u003cp>Một cổ đông cá nhân viết thư cho hội đồng quản trị: \u003ci>\"Các ông phát hành cổ phiếu giá 25.000 trong khi giá thị trường là 40.000. Đó là mức chiết khấu 38%, và nó chuyển tiền của tôi sang túi bất kỳ ai mua cổ phiếu mới. Tôi yêu cầu đợt phát hành phải được định giá theo giá thị trường.\"\u003c/i>\u003c/p>\n\u003cp>\u003cb>Yêu cầu.\u003c/b>\u003c/p>\n\u003col>\n\u003cli>\u003cb>(2 điểm)\u003c/b> Tính giá lý thuyết sau khi thực hiện quyền (TERP) và giá trị của một quyền mua.\u003c/li>\n\u003cli>\u003cb>(3 điểm)\u003c/b> Một cổ đông nắm 4 cổ phiếu trước đợt phát hành. Hãy tính tổng tài sản của bà (a) trước đợt phát hành, (b) sau đợt phát hành nếu bà thực hiện quyền, và (c) sau đợt phát hành nếu bà để quyền hết hạn. Lời phàn nàn của cổ đông có đúng không?\u003c/li>\n\u003cli>\u003cb>(2 điểm)\u003c/b> Nếu mức chiết khấu không gây hại cho cổ đông, tại sao tổ chức phát hành vẫn phải chiết khấu? Nêu hai lý do.\u003c/li>\n\u003cli>\u003cb>(1 điểm)\u003c/b> Ngân hàng đề xuất hình thức \u003ci>bảo lãnh dự phòng (standby underwriting)\u003c/i>. Hình thức này chuyển giao rủi ro gì, từ ai sang ai?\u003c/li>\n\u003c/ol>","guideVi":"\u003cp>\u003cb>Phần 1.\u003c/b> Số cổ phiếu mới phát hành = 100 triệu × ¼ = \u003cb>25 triệu\u003c/b>.\u003c/p>\n\u003cp>TERP = (100 triệu × 40.000 + 25 triệu × 25.000) ÷ 125 triệu = (4.000 tỷ + 625 tỷ) ÷ 125 triệu = \u003cb>37.000 đ\u003c/b>.\u003c/p>\n\u003cp>Giá trị một quyền = (TERP − giá mua) × tỷ lệ = (37.000 − 25.000) × ¼ = \u003cb>3.000 đ\u003c/b> cho mỗi cổ phiếu hiện hữu đang nắm giữ.\u003c/p>\n\u003cp>\u003cb>Phần 2.\u003c/b>\u003c/p>\n\u003cul>\n\u003cli>\u003cb>(a) Trước:\u003c/b> 4 × 40.000 = \u003cb>160.000 đ\u003c/b>\u003c/li>\n\u003cli>\u003cb>(b) Thực hiện quyền:\u003c/b> bà sở hữu 5 cổ phiếu, mỗi cổ phiếu trị giá 37.000 = 185.000 đ, nhưng đã trả 25.000 cho cổ phiếu mới. Tài sản ròng = 185.000 − 25.000 = \u003cb>160.000 đ\u003c/b>. Tương đương: 4 × 37.000 + (37.000 − 25.000) = 148.000 + 12.000 = 160.000 đ.\u003c/li>\n\u003cli>\u003cb>(c) Để quyền hết hạn:\u003c/b> 4 × 37.000 = \u003cb>148.000 đ\u003c/b>. Bà mất đúng \u003cb>12.000 đ\u003c/b> — bằng 4 × 3.000, giá trị các quyền mua bà đã bỏ phí.\u003c/li>\n\u003c/ul>\n\u003cp>Lời phàn nàn là \u003cb>sai\u003c/b>, và sai theo một cách rất đáng học. Mức chiết khấu không chuyển tài sản \u003ci>từ\u003c/i> cổ đông \u003ci>sang\u003c/i> ai cả, vì trong đợt chào bán cho cổ đông hiện hữu, người mua cổ phiếu giá rẻ \u003cb>chính là\u003c/b> các cổ đông hiện hữu, theo đúng tỷ lệ họ đang sở hữu. Tài sản của bà giữ nguyên đến từng đồng dù giá phát hành là 25.000 hay 39.000; chỉ có cách chia giữa giá cổ phiếu và giá trị quyền mua là thay đổi.\u003c/p>\n\u003cp>Điều \u003ci>thực sự\u003c/i> gây hại cho bà là một đợt phát hành có chiết khấu bán cho người ngoài — đó là phát hành riêng lẻ (placing), không phải chào bán cho cổ đông hiện hữu, và sự khác biệt này chính là ý nghĩa của quyền ưu tiên mua trước.\u003c/p>\n\u003cp>Mối nguy thực sự duy nhất với bà là \u003cb>không làm gì\u003c/b>. Cổ đông bỏ qua thông báo sẽ mất 12.000 đ. Đó là lý do tổ chức bảo lãnh và đơn vị quản lý sổ cổ đông phải liên hệ, đốc thúc cổ đông cá nhân, và vì sao nhiều thị trường quy định quyền mua chưa thực hiện phải được bán thay cho cổ đông.\u003c/p>\n\u003cp>\u003cb>Phần 3.\u003c/b> Hai lý do vẫn dùng mức chiết khấu:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Bảo hiểm cho tỷ lệ đăng ký mua.\u003c/b> Thời gian chào bán kéo dài nhiều tuần và giá thị trường biến động trong thời gian đó. Nếu giá giảm xuống dưới giá phát hành, đợt phát hành sẽ thất bại hoàn toàn, vì không ai trả 39.000 cho thứ mà thị trường đang bán 37.500. Chiết khấu sâu tạo ra biên an toàn trước rủi ro đó.\u003c/li>\n\u003cli>\u003cb>Chi phí bảo lãnh.\u003c/b> Phí bảo lãnh phản ánh xác suất tổ chức bảo lãnh phải ôm số cổ phiếu không được đăng ký mua. Chiết khấu sâu hơn làm giảm xác suất đó và do đó giảm phí — về thực chất, khoản chiết khấu được trả cho chính cổ đông thay vì cho ngân hàng.\u003c/li>\n\u003c/ul>\n\u003cp>Câu trả lời thứ ba được chấp nhận: chiết khấu làm tỷ lệ đăng ký mua trông đẹp hơn, và một đợt phát hành được đăng ký mua rõ ràng là thành công sẽ hỗ trợ giá sau phát hành.\u003c/p>\n\u003cp>\u003cb>Phần 4.\u003c/b> Bảo lãnh dự phòng chuyển rủi ro \u003cb>không được đăng ký mua hết\u003c/b> — rủi ro cổ đông không thực hiện quyền — từ \u003cb>tổ chức phát hành\u003c/b> sang \u003cb>ngân hàng bảo lãnh\u003c/b>, bên cam kết mua toàn bộ phần còn lại ở giá phát hành.\u003c/p>\n\u003cp>Nhờ vậy tổ chức phát hành biết chắc số tiền thu được ngay khi ký kết. Ngân hàng tính phí cho sự chắc chắn đó và quản lý rủi ro bằng cách bảo lãnh lại (sub-underwriting) cho các tổ chức khác. Lưu ý động cơ phát sinh: ngân hàng muốn mức chiết khấu \u003ci>sâu hơn\u003c/i> so với tổ chức phát hành, vì chiết khấu sâu hơn làm cam kết của ngân hàng an toàn hơn. Khuyến nghị định giá thực sự phục vụ lợi ích của ai là câu hỏi chính đáng mà hội đồng quản trị nên đặt ra.\u003c/p>\n\u003cp class=\"small muted\">\u003cb>Tra cứu ở đâu.\u003c/b> Cơ chế chào bán cho cổ đông hiện hữu và quy định về quyền ưu tiên mua tại Việt Nam: Luật Chứng khoán và các nghị định hướng dẫn; công bố thông tin của tổ chức phát hành trên HOSE/HNX về các đợt phát hành quyền mua gần đây.\u003c/p>","rubricVi":"Phần 1: TERP 1,0; giá trị một quyền 1,0. Phần 2: ba con số tài sản 1,5; nêu rõ (a) và (b) bằng nhau 0,75; chỉ ra khoản lỗ ở (c) bằng giá trị các quyền bị bỏ phí 0,75. Bài làm đồng tình với lời phàn nàn của cổ đông được 0 điểm phần này. Phần 3: 1,0 cho mỗi lý do. Phần 4: nêu đúng rủi ro không được đăng ký mua hết và cả hai bên 1,0; nhận xét về động cơ của ngân hàng được cộng điểm nếu các ý khác đã đầy đủ."},{"id":"IB-C3","ch":3,"type":"case","clo":"CLO3","marks":8,"q":"\u003cp>\u003cb>Will the deal add to earnings per share?\u003c/b>\u003c/p>\n\u003cp>Đại Long is considering an all-share acquisition of Tân Hoà (figures constructed for teaching).\u003c/p>\n\u003ctable class=\"tbl\">\u003ctr>\u003cth>\u003c/th>\u003cth>Đại Long (buyer)\u003c/th>\u003cth>Tân Hoà (target)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Net profit\u003c/td>\u003ctd>900 bn đ\u003c/td>\u003ctd>240 bn đ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Shares outstanding\u003c/td>\u003ctd>300 million\u003c/td>\u003ctd>120 million\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Share price\u003c/td>\u003ctd>60,000 đ\u003c/td>\u003ctd>25,000 đ\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>The offer is \u003cb>a 30% premium, paid entirely in Đại Long shares\u003c/b>. Assume no synergies at first.\u003c/p>\n\u003cp>\u003cb>Required.\u003c/b>\u003c/p>\n\u003col>\n\u003cli>\u003cb>(2 marks)\u003c/b> Compute EPS and P/E for each company before the deal.\u003c/li>\n\u003cli>\u003cb>(3 marks)\u003c/b> Compute the offer price per share, the total consideration, the number of new Đại Long shares issued, and the combined EPS. Is the deal accretive or dilutive, and by how much?\u003c/li>\n\u003cli>\u003cb>(2 marks)\u003c/b> State
