structure also protects investors against the \u003cb>insolvency\u003c/b> of the fund management company: because the assets are held by the custodian in the fund's name and segregated from the manager's own balance sheet, they are not available to the manager's creditors. Independence is what makes the custodian's compliance monitoring credible — a supervisor within the same group, or dependent on the manager for its revenue, could not meaningfully challenge it.\u003c/p>","rubric":"Custody and compliance-monitoring roles (0.8) · separation of decision-making from possession, requiring collusion for fraud (0.7) · insolvency protection through segregation (0.5).","qVi":"Giải thích vai trò của ngân hàng giám sát (lưu ký) trong một quỹ đại chúng và vì sao tính độc lập của nó quan trọng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Ngân hàng giám sát\u003c/b> nắm giữ tài sản của quỹ dưới hình thức \u003cb>lưu ký, tách biệt khỏi tài sản của công ty quản lý quỹ\u003c/b>, và giám sát việc nhà quản lý tuân thủ điều lệ quỹ, bản cáo bạch và các quy định áp dụng. Nó thường cũng kiểm chứng việc tính NAV, xác nhận việc mua và mua lại chứng chỉ được xử lý đúng, và báo cáo các vi phạm cho cơ quan quản lý.\u003c/p>\u003cp>\u003cb>Vì sao tính độc lập quan trọng.\u003c/b> Cơ chế này tách bạch việc \u003cb>ra quyết định\u003c/b> khỏi việc \u003cb>nắm giữ\u003c/b>. Nhà quản lý quyết định mua bán gì nhưng không bao giờ nắm giữ tài sản hay tiền; ngân hàng lưu ký nắm giữ chúng nhưng không có quyền quyết định đầu tư. Do đó không bên nào một mình có thể chiếm dụng tài sản của khách hàng — một hành vi gian lận sẽ đòi hỏi sự thông đồng giữa hai định chế được quản lý riêng biệt.\u003c/p>\u003cp>Cấu trúc này cũng bảo vệ nhà đầu tư trước rủi ro \u003cb>mất khả năng thanh toán\u003c/b> của công ty quản lý quỹ: vì tài sản do ngân hàng lưu ký nắm giữ dưới tên quỹ và tách biệt khỏi bảng cân đối của công ty quản lý, chúng không thuộc phạm vi đòi nợ của các chủ nợ của công ty quản lý. Tính độc lập là thứ khiến việc giám sát tuân thủ của ngân hàng lưu ký trở nên đáng tin — một đơn vị giám sát trong cùng tập đoàn, hoặc phụ thuộc vào công ty quản lý về doanh thu, sẽ không thể phản biện một cách có ý nghĩa.\u003c/p>","rubricVi":"Vai trò lưu ký và giám sát tuân thủ (0,8) · tách bạch ra quyết định khỏi nắm giữ, đòi hỏi thông đồng mới gian lận được (0,7) · bảo vệ trước mất khả năng thanh toán nhờ tách bạch tài sản (0,5)."},{"id":"K4-02","ch":4,"type":"calc-essay","clo":"CLO2","marks":2,"exam":"final","q":"A fund has AUM of VND 2,400bn, charges 1.8% management fee and 20% carry over a 9% hurdle, and returns 16% gross. Compute the performance fee percentage, the investor's net return and the manager's total revenue.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Excess return over the hurdle = 16% − 9% = \u003cb>7%\u003c/b>.\u003c/p>\u003cp>Performance fee = 20% × 7% = \u003cb>1.4%\u003c/b> of AUM.\u003c/p>\u003cp>Investor's net return = 16% − 1.8% − 1.4% = \u003cb>12.8%\u003c/b>.\u003c/p>\u003cp>Manager's revenue:\u003cbr>Management fee = 1.8% × 2,400bn = \u003cb>VND 43.2 billion\u003c/b>\u003cbr>Performance fee = 1.4% × 2,400bn = \u003cb>VND 33.6 billion\u003c/b>\u003cbr>Total = \u003cb>VND 76.8 billion\u003c/b>.\u003c/p>\u003cp>Note that the total fee load of 3.2% consumed one fifth of the gross return. Had the fund returned only 9%, no carry would have arisen and the investor would have netted 7.2% — while the manager would still have collected VND 43.2bn in management fees. This asymmetry is why AUM, rather than performance, is the primary driver of an asset manager's revenue.\u003c/p>","rubric":"Excess and performance fee percentage (0.6) · net return (0.5) · both revenue components and total (0.6) · observation on fee load or the below-hurdle case (0.3).","qVi":"Một quỹ có AUM 2.400 tỷ đồng, thu phí quản lý 1,8% và lãi thưởng 20% trên ngưỡng 9%, đạt lợi suất gộp 16%. Tính tỷ lệ phí hiệu quả, lợi suất ròng của nhà đầu tư và tổng doanh thu của nhà quản lý.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Lợi suất vượt ngưỡng = 16% − 9% = \u003cb>7%\u003c/b>.\u003c/p>\u003cp>Phí hiệu quả = 20% × 7% = \u003cb>1,4%\u003c/b> trên AUM.\u003c/p>\u003cp>Lợi suất ròng của nhà đầu tư = 16% − 1,8% − 1,4% = \u003cb>12,8%\u003c/b>.\u003c/p>\u003cp>Doanh thu của nhà quản lý:\u003cbr>Phí quản lý = 1,8% × 2.400 tỷ = \u003cb>43,2 tỷ đồng\u003c/b>\u003cbr>Phí hiệu quả = 1,4% × 2.400 tỷ = \u003cb>33,6 tỷ đồng\u003c/b>\u003cbr>Tổng = \u003cb>76,8 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Lưu ý tổng gánh nặng phí 3,2% đã tiêu tốn một phần năm lợi suất gộp. Nếu quỹ chỉ đạt 9%, sẽ không phát sinh lãi thưởng và nhà đầu tư nhận ròng 7,2% — trong khi nhà quản lý vẫn thu 43,2 tỷ đồng phí quản lý. Sự bất đối xứng này là lý do AUM, chứ không phải hiệu quả, là yếu tố chính dẫn dắt doanh thu của một công ty quản lý tài sản.\u003c/p>","rubricVi":"Phần vượt ngưỡng và tỷ lệ phí hiệu quả (0,6) · lợi suất ròng (0,5) · cả hai cấu phần doanh thu và tổng (0,6) · nhận xét về gánh nặng phí hoặc trường hợp dưới ngưỡng (0,3)."},{"id":"K4-03","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what tracking error measures and why it is the key metric for both passive and active managers, in different ways.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Tracking error\u003c/b> is the standard deviation of the difference between the portfolio's returns and the benchmark's returns — that is, the volatility of \u003cb>active return\u003c/b>. It measures how far, and how consistently, the portfolio deviates from its benchmark.\u003c/p>\u003cp>\u003cb>For a passive manager\u003c/b> it is the primary measure of \u003cb>success or failure\u003c/b>. The objective is replication, so any deviation is error: a well-run index fund should show tracking error of only a few basis points, arising from fees, cash drag, sampling and transaction costs. High tracking error in a passive fund means it is failing at its only job.\u003c/p>\u003cp>\u003cb>For an active manager\u003c/b> tracking error is not error but \u003cb>the risk budget\u003c/b>. Deviation from the benchmark is the entire point — a manager who does not deviate cannot outperform. Here it is the \u003cb>denominator\u003c/b> of the information ratio, IR = active return ÷ tracking error, which measures how efficiently the manager converts active risk into active return. It is also a \u003cb>mandate constraint\u003c/b>: an IPS may cap tracking error, and exceeding it is a compliance breach regardless of the return achieved.\u003c/p>\u003cp>So the same statistic is a measure of failure in one context and of deliberate, budgeted risk-taking in the other.\u003c/p>","rubric":"Correct definition as volatility of active return (0.6) · passive interpretation as error with typical magnitude (0.5) · active interpretation as risk budget, IR denominator and mandate limit (0.7) · the contrast drawn (0.2).","qVi":"Giải thích sai số theo dõi đo điều gì và vì sao nó là thước đo then chốt cho cả nhà quản lý thụ động lẫn chủ động, theo những cách khác nhau.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Sai số theo dõi\u003c/b> là độ lệch chuẩn của chênh lệch giữa lợi suất danh mục và lợi suất chỉ số tham chiếu — tức là độ biến động của \u003cb>lợi suất chủ động\u003c/b>. Nó đo danh mục lệch khỏi chỉ số tham chiếu bao xa và nhất quán đến mức nào.\u003c/p>\u003cp>\u003cb>Với nhà quản lý thụ động\u003c/b>, đó là thước đo chính của \u003cb>thành công hay thất bại\u003c/b>. Mục tiêu là sao chép, nên mọi độ lệch đều là sai số: một quỹ chỉ số vận hành tốt chỉ nên có sai số theo dõi vài điểm cơ bản, phát sinh từ phí, tiền mặt nhàn rỗi, việc lấy mẫu và chi phí giao dịch. Sai số theo dõi cao trong một quỹ thụ động nghĩa là nó đang thất bại ở công việc duy nhất của mình.\u003c/p>\u003cp>\u003cb>Với nhà quản lý chủ động\u003c/b>, sai số theo dõi không phải sai lầm mà là \u003cb>ngân sách rủi ro\u003c/b>. Lệch khỏi chỉ số tham chiếu chính là toàn bộ mục đích — một nhà quản lý không lệch thì không thể vượt trội. Ở đây nó là \u003cb>mẫu số\u003c/b> của tỷ số thông tin, IR = lợi suất chủ động ÷ sai số theo dõi, đo nhà quản lý chuyển hóa rủi ro chủ động thành lợi suất chủ động hiệu quả ra sao. Nó cũng là một \u003cb>ràng buộc trong mệnh lệnh\u003c/b>: một IPS có thể đặt trần sai số theo dõi, và vượt trần là vi phạm tuân thủ bất kể lợi suất đạt được.\u003c/p>\u003cp>Vậy nên cùng một chỉ tiêu thống kê lại là thước đo thất bại trong bối cảnh này và là việc chấp nhận rủi ro có chủ đích, có ngân sách trong bối cảnh kia.\u003c/p>","rubricVi":"Định nghĩa đúng là độ biến động của lợi suất chủ động (0,6) · diễn giải thụ động như sai số với độ lớn điển hình (0,5) · diễn giải chủ động như ngân sách rủi ro, mẫu số IR và giới hạn mệnh lệnh (0,7) · nêu được sự tương phản (0,2)."},{"id":"K4-04","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the difference between an advisory mandate and a discretionary mandate, and when each is appropriate.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Under an \u003cb>advisory mandate\u003c/b> the manager \u003cb>recommends\u003c/b> and the client \u003cb>decides\u003c/b>: no transaction occurs without the client's specific instruction. Under a \u003cb>discretionary mandate\u003c/b> the manager may \u003cb>trade without pre-approval\u003c/b> of each transaction, within the objectives, constraints and permitted ranges agreed in the investment policy statement.\u003c/p>\u003cp>\u003cb>When advisory is appropriate.\u003c/b> Where the client has the knowledge, time and appetite to be involved; where they wish to retain control over each decision; where holdings carry personal significance — a founder's stake, an inherited holding; and where the relationship is being established and trust is still developing.\u003c/p>\u003cp>\u003cb>When discretionary is appropriate.\u003c/b> Where \u003cb>timely execution\u003c/b> matters and delay would harm the client — rebalancing in volatile markets, acting on a fast-moving opportunity; where the client lacks the time or expertise; where the portfolio is complex or spans many markets; and where consistency across many similar clients is required.\u003c/p>\u003cp>The critical point is that discretion does \u003cb>not\u003c/b> mean unlimited authority. It operates strictly within the IPS: anything outside the agreed objectives, constraints, permitted instruments or ranges requires the client's specific authority and an amendment to the IPS. Acting outside it is a mandate breach whether or not the outcome was favourable.\u003c/p>","rubric":"Both mandates correctly defined (0.7) · appropriate circumstances for each (0.8) · discretion bounded by the IPS and breach point (0.5).","qVi":"Giải thích sự khác biệt giữa mệnh lệnh tư vấn và mệnh lệnh ủy thác toàn quyền, và khi nào mỗi loại là phù hợp.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Theo \u003cb>mệnh lệnh tư vấn\u003c/b>, nhà quản lý \u003cb>khuyến nghị\u003c/b> và khách hàng \u003cb>quyết định\u003c/b>: không giao dịch nào diễn ra mà không có chỉ thị cụ thể của khách hàng. Theo \u003cb>mệnh lệnh ủy thác toàn quyền\u003c/b>, nhà quản lý được \u003cb>giao dịch mà không cần phê duyệt trước\u003c/b> từng giao dịch, trong phạm vi mục tiêu, ràng buộc và biên độ đã thống nhất trong tuyên bố chính sách đầu tư.\u003c/p>\u003cp>\u003cb>Khi nào tư vấn là phù hợp.\u003c/b> Khi khách hàng có kiến thức, thời gian và mong muốn tham gia; khi họ muốn giữ quyền kiểm soát từng quyết định; khi các khoản nắm giữ mang ý nghĩa cá nhân — cổ phần của nhà sáng lập, một khoản thừa kế; và khi quan hệ mới được thiết lập và lòng tin còn đang hình thành.\u003c/p>\u003cp>\u003cb>Khi nào ủy thác toàn quyền là phù hợp.\u003c/b> Khi \u003cb>thực hiện kịp thời\u003c/b> là quan trọng và sự chậm trễ sẽ gây hại cho khách hàng — tái cân bằng trong thị trường biến động, hành động trước một cơ hội diễn biến nhanh; khi khách hàng thiếu thời gian hoặc chuyên môn; khi danh mục phức tạp hoặc trải trên nhiều thị trường; và khi cần sự nhất quán giữa nhiều khách hàng tương tự.\u003c/p>\u003cp>Điểm then chốt là quyền quyết định \u003cb>không\u003c/b> có nghĩa là thẩm quyền vô hạn. Nó vận hành nghiêm ngặt trong phạm vi IPS: bất cứ điều gì nằm ngoài mục tiêu, ràng buộc, công cụ được phép hoặc biên độ đã thống nhất đều cần thẩm quyền cụ thể của khách hàng và một sửa đổi IPS. Hành động ngoài phạm vi đó là vi phạm mệnh lệnh dù kết quả có thuận lợi hay không.\u003c/p>","rubricVi":"Định nghĩa đúng cả hai mệnh lệnh (0,7) · hoàn cảnh phù hợp cho mỗi loại (0,8) · quyền quyết định bị giới hạn bởi IPS và điểm về vi phạm (0,5)."},{"id":"K4-05","ch":4,"type":"case","clo":"CLO2","marks":3,"exam":"final","q":"A fund manager's largest holding falls 40% after an accounting scandal. Redemption requests surge. Analyse the manager's obligations and the options available.","guide":"\u003cp>\u003cb>Model answer — obligations.\u003c/b> (1) \u003cb>Fair treatment of all unitholders\u003c/b>, both those redeeming and those remaining. Meeting redemptions by selling the most liquid holdings first would leave continuing investors with a concentrated, illiquid residue — a transfer of value from those who stay to those who leave. (2) \u003cb>Accurate valuation\u003c/b>: the affected holding must be valued properly, and if it is suspended or its price is unreliable, a fair-value process with the supervisory bank's involvement is required — striking NAV on a stale price would let redeemers exit at an overstated value. (3) \u003cb>Disclosure\u003c/b> to investors and the regulator of the position and its impact. (4) \u003cb>Adherence to the fund charter\u003c/b> on redemption terms and any liquidity tools. (5) \u003cb>Review of the investment process\u003c/b> — why was the position so large, and were concentration limits observed?\u003c/p>\u003cp>\u003cb>Options.\u003c/b> Meet redemptions from \u003cb>cash and liquid buffers\u003c/b> first, if adequate. Sell assets on a \u003cb>pro-rata slice\u003c/b> basis across the portfolio rather than only the liquid names, preserving the mix for continuing holders. Apply \u003cb>swing pricing\u003c/b> so that the dealing costs caused by redeeming investors are borne by them rather than by those remaining. If the outflow threatens orderly management, apply a \u003cb>redemption gate\u003c/b> limiting the proportion redeemed in a period, or in extremis \u003cb>suspend dealing\u003c/b> — but only if the charter permits it, with prompt regulatory notification and clear communication, since suspension is a serious step that traps investors.\u003c/p>\u003cp>\u003cb>Judgement.\u003c/b> The manager should act on valuation first, then meet redemptions in the way that least disadvantages continuing investors, escalating to gates or suspension only when orderly realisation is genuinely impossible. The episode should also trigger a review of concentration limits, since the underlying failure was allowing a single holding to become large enough to cause this.\u003c/p>","rubric":"Fair-treatment obligation with the value-transfer mechanism (0.8) · valuation and disclosure duties (0.6) · at least three options incl. pro-rata slicing and swing pricing (0.9) · gates/suspension as last resort with charter and regulator (0.4) · concentration-limit review (0.3).","qVi":"Khoản nắm giữ lớn nhất của một nhà quản lý quỹ giảm 40% sau một bê bối kế toán. Yêu cầu mua lại chứng chỉ tăng vọt. Phân tích các nghĩa vụ của nhà quản lý và các phương án khả dụng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các nghĩa vụ.\u003c/b> (1) \u003cb>Đối xử công bằng với mọi nhà đầu tư\u003c/b>, cả người rút ra lẫn người ở lại. Đáp ứng yêu cầu mua lại bằng cách bán trước các khoản nắm giữ thanh khoản nhất sẽ để lại cho nhà đầu tư ở lại một phần dư tập trung và kém thanh khoản — một sự chuyển giá trị từ người ở lại sang người rút ra. (2) \u003cb>Định giá chính xác\u003c/b>: khoản nắm giữ bị ảnh hưởng phải được định giá đúng, và nếu nó bị đình chỉ giao dịch hoặc giá không đáng tin, cần một quy trình định giá hợp lý có sự tham gia của ngân hàng giám sát — xác định NAV theo một mức giá lỗi thời sẽ cho phép người rút ra thoát ở mức giá bị thổi phồng. (3) \u003cb>Công bố thông tin\u003c/b> cho nhà đầu tư và cơ quan quản lý về tình hình và tác động của nó. (4) \u003cb>Tuân thủ điều lệ quỹ\u003c/b> về điều khoản mua lại và mọi công cụ thanh khoản. (5) \u003cb>Rà soát quy trình đầu tư\u003c/b> — vì sao vị thế lại lớn đến vậy, và các giới hạn tập trung có được tuân thủ không?\u003c/p>\u003cp>\u003cb>Các phương án.\u003c/b> Đáp ứng yêu cầu mua lại từ \u003cb>tiền mặt và bộ đệm thanh khoản\u003c/b> trước, nếu đủ. Bán tài sản theo \u003cb>lát cắt tỷ lệ\u003c/b> trên toàn danh mục thay vì chỉ bán các mã thanh khoản, giữ nguyên cơ cấu cho người ở lại. Áp dụng \u003cb>định giá điều chỉnh (swing pricing)\u003c/b> để chi phí giao dịch do người rút ra gây nên được chính họ gánh chứ không phải người ở lại. Nếu dòng vốn ra đe dọa việc quản lý có trật tự, áp dụng một \u003cb>cổng chặn mua lại\u003c/b> giới hạn tỷ lệ được rút trong một kỳ, hoặc trong tình huống cực đoan \u003cb>tạm dừng giao dịch\u003c/b> — nhưng chỉ khi điều lệ cho phép, kèm thông báo kịp thời cho cơ quan quản lý và truyền thông rõ ràng, vì tạm dừng là một bước nghiêm trọng khiến nhà đầu tư bị kẹt.\u003c/p>\u003cp>\u003cb>Phán đoán.\u003c/b> Nhà quản lý nên xử lý việc định giá trước, rồi đáp ứng yêu cầu mua lại theo cách ít gây bất lợi nhất cho nhà đầu tư ở lại, chỉ leo thang tới cổng chặn hay tạm dừng khi việc bán tài sản có trật tự thực sự bất khả thi. Sự việc cũng nên kích hoạt một cuộc rà soát các giới hạn tập trung, vì thất bại nền tảng là đã để một khoản nắm giữ đơn lẻ lớn đến mức gây ra tình huống này.\u003c/p>","rubricVi":"Nghĩa vụ đối xử công bằng với cơ chế chuyển giá trị (0,8) · nghĩa vụ định giá và công bố (0,6) · ít nhất ba phương án gồm lát cắt tỷ lệ và định giá điều chỉnh (0,9) · cổng chặn/tạm dừng như phương án cuối cùng kèm điều lệ và cơ quan quản lý (0,4) · rà soát giới hạn tập trung (0,3)."},{"id":"K5-01","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain Porter's five forces and how the framework informs a valuation.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The five forces determine the structural profitability of an industry:\u003c/p>\u003cul>\u003cli>\u003cb>Rivalry among existing competitors\u003c/b> — intensified by high fixed costs, undifferentiated products, many similar-sized players and slow growth.\u003c/li>\u003cli>\u003cb>Threat of new entrants\u003c/b> — restrained by barriers such as capital requirements, scale economies, brand, regulation and control of distribution.\u003c/li>\u003cli>\u003cb>Threat of substitutes\u003c/b> — alternative ways for the customer to meet the same need, which caps the price the industry can charge.\u003c/li>\u003cli>\u003cb>Bargaining power of buyers\u003c/b> — strong where buyers are few, large, price-sensitive and face low switching costs.\u003c/li>\u003cli>\u003cb>Bargaining power of suppliers\u003c/b> — strong where suppliers are concentrated, their input is critical, or switching is costly.\u003c/li>\u003c/ul>\u003cp>\u003cb>How it informs a valuation.\u003c/b> The forces determine whether an industry can \u003cb>sustain\u003c/b> above-normal returns, and therefore discipline the model's key assumptions. Weak rivalry and high entry barriers support assumptions of durable margins and a long fade period before returns decline to the cost of capital — which directly supports a higher \u003cb>terminal growth rate\u003c/b> and terminal value. Strong buyer power or a serious substitute threat implies margin compression, so forecast margins should decline and the terminal assumptions should be conservative. A DCF projecting expanding margins in an industry with intensifying rivalry and falling barriers is internally inconsistent — the framework is what exposes that inconsistency.\u003c/p>","rubric":"Five forces correctly named with a driver for each (1.0) · link to sustainability of returns (0.4) · explicit connection to margin, fade and terminal assumptions (0.6).","qVi":"Giải thích năm lực lượng của Porter và khung này cung cấp thông tin cho một cuộc định giá như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Năm lực lượng quyết định khả năng sinh lời mang tính cấu trúc của một ngành:\u003c/p>\u003cul>\u003cli>\u003cb>Cạnh tranh giữa các đối thủ hiện hữu\u003c/b> — gay gắt hơn khi chi phí cố định cao, sản phẩm không khác biệt, nhiều đối thủ cùng cỡ và tăng trưởng chậm.\u003c/li>\u003cli>\u003cb>Mối đe dọa từ đối thủ mới gia nhập\u003c/b> — bị kìm hãm bởi các rào cản như yêu cầu vốn, lợi thế kinh tế theo quy mô, thương hiệu, quy định pháp lý và việc kiểm soát kênh phân phối.\u003c/li>\u003cli>\u003cb>Mối đe dọa từ sản phẩm thay thế\u003c/b> — những cách khác để khách hàng đáp ứng cùng một nhu cầu, điều này đặt trần cho mức giá mà ngành có thể thu.\u003c/li>\u003cli>\u003cb>Sức mạnh thương lượng của người mua\u003c/b> — mạnh khi người mua ít, lớn, nhạy cảm về giá và chi phí chuyển đổi thấp.\u003c/li>\u003cli>\u003cb>Sức mạnh thương lượng của nhà cung cấp\u003c/b> — mạnh khi nhà cung cấp tập trung, đầu vào của họ là thiết yếu, hoặc việc chuyển đổi tốn kém.\u003c/li>\u003c/ul>\u003cp>\u003cb>Cung cấp thông tin cho định giá ra sao.\u003c/b> Các lực lượng quyết định liệu một ngành có thể \u003cb>duy trì\u003c/b> lợi nhuận vượt mức bình thường hay không, và do đó tạo kỷ luật cho các giả định then chốt của mô hình. Cạnh tranh yếu và rào cản gia nhập cao ủng hộ giả định về biên lợi nhuận bền vững và một giai đoạn suy giảm dài trước khi lợi nhuận về bằng chi phí vốn — điều này trực tiếp ủng hộ một \u003cb>tốc độ tăng trưởng cuối kỳ\u003c/b> và giá trị cuối kỳ cao hơn. Sức mạnh người mua lớn hoặc mối đe dọa thay thế nghiêm trọng hàm ý biên lợi nhuận bị nén, nên biên lợi nhuận dự phóng nên giảm dần và các giả định cuối kỳ nên thận trọng. Một mô hình DCF dự phóng biên lợi nhuận mở rộng trong một ngành có cạnh tranh gay gắt hơn và rào cản đang giảm là mâu thuẫn nội tại — khung phân tích chính là thứ bộc lộ mâu thuẫn đó.\u003c/p>","rubricVi":"Nêu đúng năm lực lượng kèm một yếu tố dẫn dắt cho mỗi lực lượng (1,0) · liên hệ tới tính bền vững của lợi nhuận (0,4) · kết nối tường minh tới giả định về biên lợi nhuận, suy giảm dần và cuối kỳ (0,6)."},{"id":"K5-02","ch":5,"type":"calc-essay","clo":"CLO2","marks":2,"exam":"final","q":"A company has net income of VND 420bn, revenue VND 3,500bn, total assets VND 2,800bn and equity VND 1,400bn. Compute the DuPont components and ROE, and comment on the quality of the return.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Net margin = 420 ÷ 3,500 = \u003cb>12.0%\u003c/b>\u003cbr>Asset turnover = 3,500 ÷ 2,800 = \u003cb>1.25×\u003c/b>\u003cbr>Equity multiplier = 2,800 ÷ 1,400 = \u003cb>2.0×\u003c/b>\u003c/p>\u003cp>ROE = 12.0% × 1.25 × 2.0 = \u003cb>30.0%\u003c/b>\u003cbr>\u003ci>Check:\u003c/i> 420 ÷ 1,400 = 30.0% ✓\u003c/p>\u003cp>\u003cb>Comment.\u003c/b> A 30% ROE is strong, and the decomposition shows it is \u003cb>well balanced\u003c/b>: a healthy 12% net margin combined with efficient asset use at 1.25× turnover, and only \u003cb>moderate\u003c/b> leverage of 2.0× (equivalent to debt being half of total assets). The return is therefore driven principally by \u003cb>operating performance\u003c/b> rather than by financial gearing.\u003c/p>\u003cp>This matters for quality. A company reporting the same 30% ROE from a 6% margin, 1.0× turnover and 5.0× leverage would be generating its return largely through balance-sheet risk — vulnerable to a downturn, to rising interest rates and to covenant pressure. Comparing two firms on ROE alone would rank them equally; DuPont reveals that this company's return is more sustainable and lower risk.\u003c/p>","rubric":"Three components computed (0.9) · ROE with cross-check (0.4) · interpretation identifying operating rather than leverage-driven return (0.4) · quality contrast with a leveraged alternative (0.3).","qVi":"Một công ty có lợi nhuận ròng 420 tỷ đồng, doanh thu 3.500 tỷ đồng, tổng tài sản 2.800 tỷ đồng và vốn chủ 1.400 tỷ đồng. Tính các cấu phần DuPont và ROE, và bình luận về chất lượng của khoản lợi nhuận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Biên lợi nhuận ròng = 420 ÷ 3.500 = \u003cb>12,0%\u003c/b>\u003cbr>Vòng quay tài sản = 3.500 ÷ 2.800 = \u003cb>1,25×\u003c/b>\u003cbr>Hệ số nhân vốn chủ = 2.800 ÷ 1.400 = \u003cb>2,0×\u003c/b>\u003c/p>\u003cp>ROE = 12,0% × 1,25 × 2,0 = \u003cb>30,0%\u003c/b>\u003cbr>\u003ci>Kiểm chứng:\u003c/i> 420 ÷ 1.400 = 30,0% ✓\u003c/p>\u003cp>\u003cb>Bình luận.\u003c/b> ROE 30% là mạnh, và phép phân rã cho thấy nó \u003cb>cân đối tốt\u003c/b>: biên lợi nhuận ròng lành mạnh 12% kết hợp với việc sử dụng tài sản hiệu quả ở mức 1,25× vòng quay, và đòn bẩy chỉ \u003cb>vừa phải\u003c/b> ở 2,0× (tương đương nợ chiếm một nửa tổng tài sản). Khoản lợi nhuận do đó chủ yếu được dẫn dắt bởi \u003cb>hiệu quả hoạt động\u003c/b> chứ không phải bởi đòn bẩy tài chính.\u003c/p>\u003cp>Điều này quan trọng về mặt chất lượng. Một công ty báo cáo cùng ROE 30% nhưng từ biên lợi nhuận 6%, vòng quay 1,0× và đòn bẩy 5,0× sẽ tạo ra lợi nhuận phần lớn thông qua rủi ro bảng cân đối — dễ tổn thương trước suy thoái, trước lãi suất tăng và trước áp lực từ điều khoản ràng buộc. So sánh hai doanh nghiệp chỉ bằng ROE sẽ xếp chúng ngang nhau; DuPont bộc lộ rằng lợi nhuận của công ty này bền vững hơn và rủi ro thấp hơn.\u003c/p>","rubricVi":"Tính ba cấu phần (0,9) · ROE kèm phép kiểm chứng (0,4) · diễn giải nhận diện lợi nhuận do hoạt động chứ không do đòn bẩy dẫn dắt (0,4) · so sánh chất lượng với một phương án đòn bẩy cao (0,3)."},{"id":"K5-03","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the concept of the equity value bridge and why each adjustment is made.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The bridge converts \u003cb>enterprise value\u003c/b> — the value of the operating business, belonging to all providers of capital — into \u003cb>equity value\u003c/b>, which belongs to shareholders alone.\u003c/p>\u003cp>\u003cb>Equity value = EV − net debt − minority interest − preferred + non-operating assets\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>Less net debt\u003c/b> (total debt minus cash): debtholders rank ahead of shareholders, so their claim is deducted. Cash is netted off because it could be used to repay debt.\u003c/li>\u003cli>\u003cb>Less minority interest\u003c/b>: where the company consolidates a subsidiary it does not wholly own, EV reflects 100% of that subsidiary's operations, but the portion attributable to outside shareholders does not belong to the parent's equity holders.\u003c/li>\u003cli>\u003cb>Less preferred stock\u003c/b>: preferred ranks ahead of common equity and is economically debt-like.\u003c/li>\u003cli>\u003cb>Plus non-operating assets\u003c/b>: surplus land, investment portfolios or minority stakes generate no EBITDA, so a multiple applied to operating EBITDA does not capture them. They must be added at fair value or they would be valued at zero.\u003c/li>\u003c/ul>\u003cp>Dividing by \u003cb>diluted\u003c/b> shares — including options, warrants and convertibles that are in the money — then gives value per share. The governing principle is \u003cb>consistency\u003c/b>: any item whose income is excluded from the earnings measure must be valued separately, and any claim ranking ahead of common equity must be deducted, or the result double-counts.\u003c/p>","rubric":"Correct bridge formula (0.5) · reason for each of net debt, minorities and preferred (0.8) · non-operating assets added with the reason (0.4) · diluted shares and the consistency principle (0.3).","qVi":"Giải thích khái niệm cầu nối giá trị vốn chủ và vì sao mỗi khoản điều chỉnh được thực hiện.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Cầu nối chuyển \u003cb>giá trị doanh nghiệp\u003c/b> — giá trị của hoạt động kinh doanh, thuộc về mọi bên cung cấp vốn — thành \u003cb>giá trị vốn chủ\u003c/b>, thứ chỉ thuộc về cổ đông.\u003c/p>\u003cp>\u003cb>Giá trị vốn chủ = EV − nợ ròng − lợi ích cổ đông thiểu số − cổ phần ưu đãi + tài sản ngoài hoạt động kinh doanh\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>Trừ nợ ròng\u003c/b> (tổng nợ trừ tiền mặt): chủ nợ xếp trước cổ đông, nên quyền đòi của họ bị trừ đi. Tiền mặt được cấn trừ vì nó có thể được dùng để trả nợ.\u003c/li>\u003cli>\u003cb>Trừ lợi ích cổ đông thiểu số\u003c/b>: khi công ty hợp nhất một công ty con mà mình không sở hữu toàn bộ, EV phản ánh 100% hoạt động của công ty con đó, nhưng phần thuộc về cổ đông bên ngoài không thuộc về cổ đông của công ty mẹ.\u003c/li>\u003cli>\u003cb>Trừ cổ phần ưu đãi\u003c/b>: cổ phần ưu đãi xếp trước vốn cổ phần phổ thông và về kinh tế mang tính chất nợ.\u003c/li>\u003cli>\u003cb>Cộng tài sản ngoài hoạt động kinh doanh\u003c/b>: đất dư thừa, danh mục đầu tư hoặc cổ phần thiểu số không tạo ra EBITDA, nên một bội số áp lên EBITDA từ hoạt động kinh doanh không nắm bắt được chúng. Chúng phải được cộng theo giá trị hợp lý, nếu không sẽ bị định giá bằng 0.\u003c/li>\u003c/ul>\u003cp>Chia cho số cổ phần \u003cb>pha loãng\u003c/b> — bao gồm quyền chọn, chứng quyền và công cụ chuyển đổi đang có lãi — sẽ cho ra giá trị mỗi cổ phần. Nguyên tắc chi phối là \u003cb>tính nhất quán\u003c/b>: bất kỳ khoản mục nào có thu nhập bị loại khỏi chỉ tiêu lợi nhuận đều phải được định giá riêng, và bất kỳ quyền đòi nào xếp trước vốn cổ phần phổ thông đều phải bị trừ, nếu không kết quả sẽ bị tính hai lần.\u003c/p>","rubricVi":"Công thức cầu nối đúng (0,5) · lý do cho từng khoản nợ ròng, lợi ích cổ đông thiểu số và cổ phần ưu đãi (0,8) · cộng tài sản ngoài hoạt động kinh doanh kèm lý do (0,4) · cổ phần pha loãng và nguyên tắc nhất quán (0,3)."},{"id":"K5-04","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what the conglomerate discount is, why it arises, and how it is remedied.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>conglomerate discount\u003c/b> is the tendency of a diversified group to trade at a market value \u003cb>below the sum of the values of its individual businesses\u003c/b> if each were valued on its own sector's multiples.\u003c/p>\u003cp>\u003cb>Why it arises.\u003c/b> (1) \u003cb>Opacity\u003c/b> — consolidated reporting makes it hard for investors to assess each business separately, and cross-subsidy between divisions can conceal weak performers. (2) \u003cb>Investors can diversify more cheaply themselves\u003c/b> by holding several focused companies, so they will not pay a premium for a diversification they do not need. (3) \u003cb>Capital misallocation\u003c/b> — internal capital markets may fund weaker divisions that would fail to attract external finance. (4) \u003cb>Management attention is spread thin\u003c/b> across unrelated businesses. (5) Analysts and index funds specialise by sector, so a conglomerate attracts a narrower and less expert investor base.\u003c/p>\u003cp>\u003cb>Remedies.\u003c/b> The analytical starting point is a \u003cb>sum-of-the-parts (SOTP)\u003c/b> valuation, valuing each division on its own peer multiples and aggregating, to quantify the gap. The structural responses are then a \u003cb>spin-off\u003c/b> (distributing a subsidiary's shares to existing holders, raising no cash but letting the market value it independently), an \u003cb>equity carve-out\u003c/b> (selling a minority stake by IPO, raising cash and establishing a market price while retaining control), or an outright \u003cb>divestiture\u003c/b> for cash. Improved segmental disclosure can narrow, though rarely eliminate, the discount.\u003c/p>","rubric":"Definition (0.4) · at least three causes (0.8) · SOTP as the quantifying tool (0.3) · at least two structural remedies correctly described (0.5).","qVi":"Giải thích chiết khấu tập đoàn là gì, vì sao nó phát sinh, và cách khắc phục nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Chiết khấu tập đoàn\u003c/b> là xu hướng một tập đoàn đa ngành giao dịch ở mức giá thị trường \u003cb>thấp hơn tổng giá trị của từng doanh nghiệp thành viên\u003c/b> nếu mỗi doanh nghiệp được định giá theo bội số của ngành mình.\u003c/p>\u003cp>\u003cb>Vì sao nó phát sinh.\u003c/b> (1) \u003cb>Sự mờ đục\u003c/b> — báo cáo hợp nhất khiến nhà đầu tư khó đánh giá riêng từng doanh nghiệp, và trợ cấp chéo giữa các bộ phận có thể che giấu những đơn vị yếu kém. (2) \u003cb>Nhà đầu tư có thể tự đa dạng hóa rẻ hơn\u003c/b> bằng cách nắm giữ nhiều công ty tập trung, nên họ sẽ không trả thêm cho một sự đa dạng hóa mà họ không cần. (3) \u003cb>Phân bổ vốn sai\u003c/b> — thị trường vốn nội bộ có thể tài trợ cho các bộ phận yếu vốn dĩ không thu hút được vốn bên ngoài. (4) \u003cb>Sự chú ý của ban điều hành bị dàn mỏng\u003c/b> qua các doanh nghiệp không liên quan. (5) Chuyên viên phân tích và quỹ chỉ số chuyên môn hóa theo ngành, nên một tập đoàn thu hút một nền nhà đầu tư hẹp hơn và ít am hiểu hơn.\u003c/p>\u003cp>\u003cb>Cách khắc phục.\u003c/b> Điểm khởi đầu về phân tích là một cuộc định giá \u003cb>tổng các bộ phận (SOTP)\u003c/b>, định giá mỗi bộ phận theo bội số của nhóm so sánh riêng và cộng lại, để định lượng khoảng chênh. Các phản ứng về cấu trúc sau đó là một \u003cb>chia tách (spin-off)\u003c/b> (phân phối cổ phần của công ty con cho cổ đông hiện hữu, không huy động tiền mặt nhưng để thị trường định giá nó độc lập), một \u003cb>chào bán một phần vốn chủ (carve-out)\u003c/b> (bán một tỷ lệ thiểu số qua IPO, huy động tiền mặt và thiết lập một mức giá thị trường trong khi vẫn giữ quyền kiểm soát), hoặc \u003cb>thoái vốn\u003c/b> hoàn toàn để lấy tiền mặt. Cải thiện công bố thông tin theo bộ phận có thể thu hẹp, dù hiếm khi xóa bỏ, mức chiết khấu.\u003c/p>","rubricVi":"Định nghĩa (0,4) · ít nhất ba nguyên nhân (0,8) · SOTP như công cụ định lượng (0,3) · ít nhất hai biện pháp cấu trúc được mô tả đúng (0,5)."},{"id":"K5-05","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain why a company might trade below its book value, and what an analyst should investigate.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A price-to-book ratio below 1.0 means the market values the company at less than its accounting net assets. There are three broad explanations.\u003c/p>\u003cp>\u003cb>(1) Returns below the cost of equity.\u003c/b> This is the most common and most rational reason. If ROE is persistently below the cost of equity, each unit of book equity \u003cb>destroys\u003c/b> value, so the market rationally discounts it. A firm earning 5% on equity against a 13% cost of equity should trade well below book — the residual income model formalises this.\u003c/p>\u003cp>\u003cb>(2) Assets are overstated.\u003c/b> Book value may not reflect economic reality: receivables may be uncollectible, inventory obsolete, goodwill from past acquisitions impaired but not yet written down, or fixed assets carried above recoverable value. The market may simply be marking assets the accounts have not.\u003c/p>\u003cp>\u003cb>(3) Distress, governance or liquidity.\u003c/b> Expected financial distress, doubts about minority shareholders' access to the assets, or a very thin free float can all depress price independently of asset quality.\u003c/p>\u003cp>\u003cb>What to investigate.\u003c/b> Compare ROE with the cost of equity over several years; test asset quality — receivable ageing, inventory turnover, goodwill impairment testing, the age and utilisation of fixed assets; check for off-balance-sheet or contingent liabilities; assess leverage, covenant headroom and refinancing risk; and examine governance and related-party transactions. The key question is whether the discount reflects a \u003cb>genuine value problem\u003c/b> or a \u003cb>mispricing\u003c/b> — only the latter is an opportunity.\u003c/p>","rubric":"ROE below cost of equity as the primary explanation (0.7) · asset overstatement (0.4) · distress/governance/liquidity (0.3) · at least four specific investigations and the closing judgement (0.6).","qVi":"Giải thích vì sao một công ty có thể giao dịch dưới giá trị sổ sách của nó, và chuyên viên phân tích nên điều tra điều gì.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Hệ số giá trên giá trị sổ sách dưới 1,0 nghĩa là thị trường định giá công ty thấp hơn tài sản ròng theo kế toán. Có ba nhóm giải thích rộng.\u003c/p>\u003cp>\u003cb>(1) Lợi nhuận thấp hơn chi phí vốn chủ.\u003c/b> Đây là lý do phổ biến nhất và hợp lý nhất. Nếu ROE dai dẳng thấp hơn chi phí vốn chủ, mỗi đơn vị vốn chủ sổ sách đang \u003cb>phá hủy\u003c/b> giá trị, nên thị trường chiết khấu nó một cách hợp lý. Một doanh nghiệp đạt 5% trên vốn chủ so với chi phí vốn chủ 13% lẽ ra phải giao dịch thấp hơn nhiều so với giá trị sổ sách — mô hình thu nhập thặng dư chính thức hóa điều này.\u003c/p>\u003cp>\u003cb>(2) Tài sản bị thổi phồng.\u003c/b> Giá trị sổ sách có thể không phản ánh thực tế kinh tế: khoản phải thu có thể không thu được, hàng tồn kho lỗi thời, lợi thế thương mại từ các thương vụ trong quá khứ đã suy giảm nhưng chưa được ghi giảm, hoặc tài sản cố định được ghi nhận cao hơn giá trị có thể thu hồi. Thị trường có thể chỉ đơn giản đang định giá lại những tài sản mà sổ sách chưa làm.\u003c/p>\u003cp>\u003cb>(3) Kiệt quệ, quản trị hoặc thanh khoản.\u003c/b> Kiệt quệ tài chính dự kiến, nghi ngờ về khả năng cổ đông thiểu số tiếp cận được tài sản, hoặc lượng cổ phần tự do lưu hành rất mỏng đều có thể kéo giá xuống độc lập với chất lượng tài sản.\u003c/p>\u003cp>\u003cb>Cần điều tra gì.\u003c/b> So sánh ROE với chi phí vốn chủ qua nhiều năm; kiểm định chất lượng tài sản — tuổi nợ phải thu, vòng quay hàng tồn kho, kiểm tra suy giảm lợi thế thương mại, tuổi và mức sử dụng của tài sản cố định; kiểm tra các nghĩa vụ ngoài bảng cân đối hoặc tiềm tàng; đánh giá đòn bẩy, dư địa điều khoản ràng buộc và rủi ro tái tài trợ; và xem xét quản trị cùng các giao dịch với bên liên quan. Câu hỏi then chốt là mức chiết khấu phản ánh một \u003cb>vấn đề giá trị thực sự\u003c/b> hay một \u003cb>sự định giá sai\u003c/b> — chỉ trường hợp sau mới là cơ hội.\u003c/p>","rubricVi":"ROE thấp hơn chi phí vốn chủ là giải thích chính (0,7) · tài sản bị thổi phồng (0,4) · kiệt quệ/quản trị/thanh khoản (0,3) · ít nhất bốn nội dung điều tra cụ thể và phán đoán kết luận (0,6)."},{"id":"K5-06","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the difference between operational restructuring and capital restructuring, with two examples of each.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Operational (corporate) restructuring\u003c/b> changes \u003cb>what the company owns and how it is organised\u003c/b> — the asset side and the business portfolio. Its purpose is to sharpen strategic focus, exit underperforming or non-core activities, and allow the market to value the remaining businesses properly. \u003ci>Examples:\u003c/i> a \u003cb>divestiture\u003c/b>, selling a non-core division for cash; and a \u003cb>spin-off\u003c/b>, distributing a subsidiary's shares to existing shareholders so that two differently-valued businesses can be priced independently. (Carve-outs, split-offs and liquidation are equally valid.)\u003c/p>\u003cp>\u003cb>Capital restructuring\u003c/b> changes the \u003cb>financing mix\u003c/b> — the liability and equity side — usually without altering the operating business at all. Its purpose is to optimise the cost of capital, match the maturity and currency of liabilities to the assets they fund, restore flexibility, or return capital to shareholders. \u003ci>Examples:\u003c/i> a \u003cb>dividend recapitalisation\u003c/b>, borrowing to fund a large distribution to shareholders; and a \u003cb>debt-for-equity swap\u003c/b>, in which creditors exchange claims for shares to reduce an unsustainable debt burden. (Refinancing, share buybacks and rights issues are equally valid.)\u003c/p>\u003cp>The essential distinction: operational restructuring changes the \u003cb>business\u003c/b>; capital restructuring changes only \u003cb>who finances it and on what terms\u003c/b>. The two are often combined — a divestiture may fund a debt reduction — but the analytical questions they answer are different.\u003c/p>","rubric":"Both types correctly defined by which side of the balance sheet they affect (0.8) · two valid examples of each (0.8) · the summarising distinction (0.4).","qVi":"Giải thích sự khác biệt giữa tái cấu trúc hoạt động và tái cấu trúc vốn, với hai ví dụ mỗi loại.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Tái cấu trúc hoạt động (tái cấu trúc doanh nghiệp)\u003c/b> thay đổi \u003cb>những gì công ty sở hữu và cách nó được tổ chức\u003c/b> — phía tài sản và danh mục kinh doanh. Mục đích là làm sắc nét trọng tâm chiến lược, rút khỏi các hoạt động kém hiệu quả hoặc không cốt lõi, và để thị trường định giá đúng các mảng còn lại. \u003ci>Ví dụ:\u003c/i> một cuộc \u003cb>thoái vốn\u003c/b>, bán một bộ phận không cốt lõi để lấy tiền mặt; và một cuộc \u003cb>chia tách\u003c/b>, phân phối cổ phần của công ty con cho cổ đông hiện hữu để hai doanh nghiệp có mức định giá khác nhau được định giá độc lập. (Chào bán một phần, tách cổ phần và thanh lý đều là những ví dụ hợp lệ.)\u003c/p>\u003cp>\u003cb>Tái cấu trúc vốn\u003c/b> thay đổi \u003cb>cơ cấu tài trợ\u003c/b> — phía nợ và vốn chủ — thường mà không làm thay đổi hoạt động kinh doanh chút nào. Mục đích là tối ưu hóa chi phí vốn, khớp kỳ hạn và loại tiền tệ của nghĩa vụ nợ với tài sản mà chúng tài trợ, khôi phục sự linh hoạt, hoặc hoàn vốn cho cổ đông. \u003ci>Ví dụ:\u003c/i> một cuộc \u003cb>tái cấp vốn để chia cổ tức\u003c/b>, vay nợ để tài trợ một khoản phân phối lớn cho cổ đông; và một cuộc \u003cb>hoán đổi nợ thành vốn chủ\u003c/b>, trong đó chủ nợ đổi quyền đòi lấy cổ phần để giảm gánh nặng nợ không bền vững. (Tái tài trợ, mua lại cổ phiếu và phát hành quyền mua đều là những ví dụ hợp lệ.)\u003c/p>\u003cp>Sự phân biệt cốt yếu: tái cấu trúc hoạt động thay đổi \u003cb>doanh nghiệp\u003c/b>; tái cấu trúc vốn chỉ thay đổi \u003cb>ai tài trợ cho nó và với điều kiện gì\u003c/b>. Hai loại thường được kết hợp — một cuộc thoái vốn có thể tài trợ cho việc giảm nợ — nhưng các câu hỏi phân tích mà chúng trả lời là khác nhau.\u003c/p>","rubricVi":"Định nghĩa đúng cả hai loại theo phía nào của bảng cân đối bị tác động (0,8) · hai ví dụ hợp lệ mỗi loại (0,8) · phân biệt tổng kết (0,4)."},{"id":"K6-01","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the difference between price priority and time priority, and how a call auction price is determined.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> In continuous matching the exchange applies two rules in sequence. \u003cb>Price priority\u003c/b> comes first: among buy orders the \u003cb>highest\u003c/b> bid is matched first, and among sell orders the \u003cb>lowest\u003c/b> ask — the most aggressive prices trade first, since they are most willing to transact. \u003cb>Time priority\u003c/b> then breaks ties: among orders at the \u003cb>same\u003c/b> price, the one entered \u003cb>earlier\u003c/b> is matched first. This ordering rewards both aggressive pricing and early commitment of liquidity, and it makes the queue predictable and fair.\u003c/p>\u003cp>\u003cb>Call auction.\u003c/b> Rather than matching continuously, orders accumulate over a period and are matched at a \u003cb>single price\u003c/b>. The system determines the price at which the \u003cb>greatest volume can be executed\u003c/b>; where several prices would produce the same volume, tie-breaking rules apply, typically minimising the surplus imbalance and referencing the previous price. All trades then execute at that one price regardless of the limits individually submitted, so buyers bidding above it and sellers offering below it receive price improvement. \u003cb>ATO\u003c/b> orders participate only in the opening auction and \u003cb>ATC\u003c/b> orders only in the closing auction, and these take precedence over limit orders at the same price.\u003c/p>","rubric":"Price priority stated correctly for both sides (0.6) · time priority as tie-breaker (0.4) · volume-maximising auction price and single execution price (0.7) · ATO/ATC precedence (0.3).","qVi":"Giải thích sự khác biệt giữa ưu tiên về giá và ưu tiên về thời gian, và giá trong phiên khớp lệnh định kỳ được xác định như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Trong khớp lệnh liên tục, sở giao dịch áp dụng hai quy tắc theo trình tự. \u003cb>Ưu tiên về giá\u003c/b> đến trước: trong các lệnh mua, lệnh có giá \u003cb>cao nhất\u003c/b> được khớp trước, và trong các lệnh bán, lệnh có giá \u003cb>thấp nhất\u003c/b> — các mức giá quyết liệt nhất được giao dịch trước, vì chúng sẵn sàng giao dịch nhất. \u003cb>Ưu tiên về thời gian\u003c/b> sau đó phá thế hòa: trong các lệnh ở \u003cb>cùng\u003c/b> một mức giá, lệnh được nhập \u003cb>sớm hơn\u003c/b> sẽ khớp trước. Trình tự này tưởng thưởng cả việc chào giá quyết liệt lẫn việc cam kết thanh khoản sớm, và làm cho hàng đợi trở nên dự đoán được và công bằng.\u003c/p>\u003cp>\u003cb>Phiên khớp lệnh định kỳ.\u003c/b> Thay vì khớp liên tục, các lệnh được tích lũy trong một khoảng thời gian và được khớp ở một \u003cb>mức giá duy nhất\u003c/b>. Hệ thống xác định mức giá mà tại đó \u003cb>khối lượng khớp lớn nhất\u003c/b> có thể được thực hiện; khi nhiều mức giá cho cùng một khối lượng, các quy tắc phá thế hòa được áp dụng, thường là tối thiểu hóa phần dư mất cân đối và tham chiếu mức giá trước đó. Mọi giao dịch sau đó được thực hiện ở đúng mức giá đó bất kể các mức giới hạn đã nộp riêng lẻ, nên người mua đặt cao hơn mức đó và người bán chào thấp hơn mức đó đều được cải thiện giá. Lệnh \u003cb>ATO\u003c/b> chỉ tham gia phiên mở cửa và lệnh \u003cb>ATC\u003c/b> chỉ tham gia phiên đóng cửa, và các lệnh này được ưu tiên hơn lệnh giới hạn ở cùng mức giá.\u003c/p>","rubricVi":"Nêu đúng ưu tiên về giá cho cả hai chiều (0,6) · ưu tiên về thời gian như cơ chế phá thế hòa (0,4) · giá phiên định kỳ tối đa hóa khối lượng và một mức giá thực hiện duy nhất (0,7) · ưu tiên của ATO/ATC (0,3)."},{"id":"K6-02","ch":6,"type":"calc-essay","clo":"CLO3","marks":2,"exam":"final","q":"A stock's reference price is VND 84,000 with a ±7% band. (a) Compute the ceiling and floor. (b) The stock opens limit-up and stays there with no sellers. Explain the consequence for investors.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Ceiling = 84,000 × 1.07 = \u003cb>VND 89,880\u003c/b>\u003cbr>Floor = 84,000 × 0.93 = \u003cb>VND 78,120\u003c/b>\u003cbr>(Both are then rounded to the applicable tick size.)\u003c/p>\u003cp>(b) &ldquo;Limit-up with no sellers&rdquo; means the price has reached the ceiling of VND 89,880 and there is buying interest at that price but no one willing to sell. The consequences are:\u003c/p>\u003cul>\u003cli>\u003cb>Almost no trading occurs.\u003c/b> The quoted price is at the ceiling but volume is negligible, so the price is not a genuine market-clearing price — it is simply the highest the rules permit.\u003c/li>\u003cli>\u003cb>Buyers cannot obtain stock\u003c/b> at any price the rules allow, however much they are willing to pay. Their orders queue by time priority.\u003c/li>\u003cli>\u003cb>Price discovery is delayed.\u003c/b> If material news justifies a move larger than 7%, the market cannot express it in one session; the stock may lock limit-up for several consecutive sessions until the price approaches fair value.\u003c/li>\u003cli>\u003cb>Liquidity is impaired precisely when it is most needed.\u003c/b> The mirror case, limit-down with no buyers, is more serious: holders cannot exit at any price, and leveraged investors facing margin calls cannot sell to meet them, so collateral cannot be realised.\u003c/li>\u003c/ul>\u003cp>This is the fundamental trade-off of price bands: they dampen disorderly volatility and give participants time to absorb information, but at the cost of delaying genuine price discovery and, in extreme cases, trapping investors.\u003c/p>","rubric":"(a) both figures (0.6) · (b) negligible volume and inability to transact (0.6) · delayed price discovery over multiple sessions (0.4) · the limit-down mirror case and margin implication (0.4).","qVi":"Một cổ phiếu có giá tham chiếu 84.000 đồng với biên độ ±7%. (a) Tính giá trần và giá sàn. (b) Cổ phiếu mở cửa ở giá trần và giữ nguyên ở đó mà không có người bán. Giải thích hệ quả đối với nhà đầu tư.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Giá trần = 84.000 × 1,07 = \u003cb>89.880 đồng\u003c/b>\u003cbr>Giá sàn = 84.000 × 0,93 = \u003cb>78.120 đồng\u003c/b>\u003cbr>(Cả hai sau đó được làm tròn theo bước giá áp dụng.)\u003c/p>\u003cp>(b) &ldquo;Trần không người bán&rdquo; nghĩa là giá đã chạm mức trần 89.880 đồng và có nhu cầu mua ở mức giá đó nhưng không ai sẵn sàng bán. Các hệ quả là:\u003c/p>\u003cul>\u003cli>\u003cb>Gần như không có giao dịch nào diễn ra.\u003c/b> Giá yết ở mức trần nhưng khối lượng không đáng kể, nên mức giá đó không phải là một mức giá cân bằng thị trường thực sự — nó chỉ đơn giản là mức cao nhất mà quy định cho phép.\u003c/li>\u003cli>\u003cb>Người mua không thể mua được cổ phiếu\u003c/b> ở bất kỳ mức giá nào mà quy định cho phép, dù họ sẵn lòng trả bao nhiêu. Lệnh của họ xếp hàng theo ưu tiên thời gian.\u003c/li>\u003cli>\u003cb>Việc khám phá giá bị trì hoãn.\u003c/b> Nếu tin tức trọng yếu biện minh cho một chuyển động lớn hơn 7%, thị trường không thể thể hiện điều đó trong một phiên; cổ phiếu có thể khóa ở giá trần qua nhiều phiên liên tiếp cho tới khi giá tiệm cận giá trị hợp lý.\u003c/li>\u003cli>\u003cb>Thanh khoản bị suy giảm đúng lúc cần nhất.\u003c/b> Trường hợp đối xứng, sàn không người mua, còn nghiêm trọng hơn: người nắm giữ không thể thoát ra ở bất kỳ mức giá nào, và nhà đầu tư dùng đòn bẩy đang đối mặt lệnh gọi ký quỹ không thể bán để đáp ứng, nên tài sản bảo đảm không thể được hiện thực hóa.\u003c/li>\u003c/ul>\u003cp>Đây là sự đánh đổi căn bản của biên độ giá: chúng làm dịu biến động hỗn loạn và cho người tham gia thời gian hấp thụ thông tin, nhưng với cái giá là trì hoãn việc khám phá giá thực sự và, trong các trường hợp cực đoan, giam giữ nhà đầu tư.\u003c/p>","rubricVi":"(a) cả hai con số (0,6) · (b) khối lượng không đáng kể và việc không thể giao dịch (0,6) · trì hoãn khám phá giá qua nhiều phiên (0,4) · trường hợp đối xứng sàn không người mua và hàm ý về ký quỹ (0,4)."},{"id":"K6-03","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain what a central counterparty does and how it reduces risk in securities settlement.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>central counterparty (CCP)\u003c/b> interposes itself between the two sides of every trade through \u003cb>novation\u003c/b>: the original contract between buyer and seller is replaced by two contracts, so the CCP becomes \u003cb>buyer to every seller and seller to every buyer\u003c/b>.\u003c/p>\u003cp>\u003cb>How this reduces risk.\u003c/b> (1) \u003cb>Counterparty risk is transformed.\u003c/b> Each participant is exposed only to the CCP — a heavily regulated, well-capitalised institution — rather than to a large number of individual counterparties whose creditworthiness it cannot assess. (2) \u003cb>Multilateral netting\u003c/b> dramatically reduces the number and value of obligations to be settled: a participant's many purchases and sales in the same security net to a single delivery obligation, cutting both settlement volume and liquidity requirements. (3) \u003cb>Margining\u003c/b> — the CCP collects initial margin against potential future exposure and variation margin against daily price movements, so losses are collateralised before they crystallise. (4) A \u003cb>default fund\u003c/b> and a defined default waterfall — the defaulter's margin first, then its contribution, then the CCP's own capital, then mutualised contributions — absorb a member failure in an orderly way. (5) \u003cb>Standardisation\u003c/b> of processes and timetables reduces operational risk.\u003c/p>\u003cp>The caveat is that risk is \u003cb>concentrated\u003c/b> rather than eliminated: the CCP itself becomes systemically critical, which is why its margin models, membership standards and default arrangements are so closely regulated.\u003c/p>","rubric":"Novation correctly explained (0.6) · at least three risk-reduction mechanisms incl. netting and margining (0.9) · default waterfall or standardisation (0.2) · concentration caveat (0.3).","qVi":"Giải thích đối tác bù trừ trung tâm làm gì và nó giảm rủi ro trong thanh toán chứng khoán như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>đối tác bù trừ trung tâm (CCP)\u003c/b> đặt mình vào giữa hai bên của mọi giao dịch thông qua \u003cb>thế quyền (novation)\u003c/b>: hợp đồng ban đầu giữa người mua và người bán được thay bằng hai hợp đồng, nên CCP trở thành \u003cb>người mua đối với mọi người bán và người bán đối với mọi người mua\u003c/b>.\u003c/p>\u003cp>\u003cb>Cách điều này giảm rủi ro.\u003c/b> (1) \u003cb>Rủi ro đối tác được chuyển hóa.\u003c/b> Mỗi thành viên chỉ chịu rủi ro đối với CCP — một định chế được quản lý chặt chẽ và có vốn dồi dào — thay vì đối với một số lượng lớn các đối tác riêng lẻ mà họ không thể đánh giá được mức tín nhiệm. (2) \u003cb>Bù trừ đa phương\u003c/b> làm giảm đáng kể số lượng và giá trị các nghĩa vụ phải thanh toán: nhiều giao dịch mua và bán của một thành viên trên cùng một chứng khoán được bù trừ thành một nghĩa vụ chuyển giao duy nhất, cắt giảm cả khối lượng thanh toán lẫn yêu cầu thanh khoản. (3) \u003cb>Ký quỹ\u003c/b> — CCP thu ký quỹ ban đầu để phòng rủi ro tương lai tiềm tàng và ký quỹ biến đổi để phòng biến động giá hằng ngày, nên các khoản lỗ được bảo đảm bằng tài sản trước khi chúng thành hiện thực. (4) Một \u003cb>quỹ bảo đảm\u003c/b> và một trình tự xử lý vỡ nợ xác định — ký quỹ của bên vỡ nợ trước, rồi phần đóng góp của họ, rồi vốn của chính CCP, rồi phần đóng góp chung — hấp thụ sự đổ vỡ của một thành viên một cách có trật tự. (5) \u003cb>Chuẩn hóa\u003c/b> quy trình và lịch trình làm giảm rủi ro vận hành.\u003c/p>\u003cp>Lưu ý là rủi ro được \u003cb>tập trung\u003c/b> chứ không bị loại bỏ: bản thân CCP trở nên có tầm quan trọng hệ thống, đó là lý do các mô hình ký quỹ, tiêu chuẩn thành viên và cơ chế xử lý vỡ nợ của nó được quản lý chặt chẽ đến vậy.\u003c/p>","rubricVi":"Giải thích đúng thế quyền (0,6) · ít nhất ba cơ chế giảm rủi ro gồm bù trừ và ký quỹ (0,9) · trình tự xử lý vỡ nợ hoặc chuẩn hóa (0,2) · lưu ý về sự tập trung rủi ro (0,3)."},{"id":"K6-04","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain why securities lending exists from the lender's perspective, and the risks the lender accepts.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Why lenders lend.\u003c/b> The typical lender is a long-term holder — a pension fund, mutual fund, insurer or custodian acting for them — holding securities it does not intend to sell. Lending generates an \u003cb>incremental borrow fee\u003c/b> on assets that would otherwise sit idle, improving the portfolio's return at apparently low effort. The fee can be material for scarce, hard-to-borrow stock. Lenders also receive \u003cb>collateral\u003c/b> — cash or high-quality securities, typically exceeding the value of the loaned stock — which can itself be reinvested for additional return, and they retain the \u003cb>economic\u003c/b> benefits of ownership, since dividends are passed through by the borrower.\u003c/p>\u003cp>\u003cb>Risks accepted.\u003c/b> (1) \u003cb>Counterparty risk\u003c/b> — the borrower may fail to return the securities; collateral must then be liquidated, and it may prove insufficient if prices have moved. (2) \u003cb>Collateral reinvestment risk\u003c/b> — historically the largest source of loss: cash collateral reinvested in instruments that fall in value or become illiquid leaves the lender short even though the stock lending itself performed as intended. (3) \u003cb>Loss of voting rights\u003c/b> during the loan, since legal title passes to the borrower — a governance concern if a contested vote arises, requiring recall. (4) \u003cb>Operational and legal risk\u003c/b> in recall, corporate actions and tax treatment. (5) \u003cb>Reputational risk\u003c/b>, since the lender is facilitating short selling of a security it holds, which may conflict with its own or its clients' interests.\u003c/p>","rubric":"Fee income on idle assets with collateral and dividend pass-through (0.7) · at least three risks incl. counterparty and collateral reinvestment (0.9) · loss of voting rights or reputational point (0.4).","qVi":"Giải thích vì sao cho vay chứng khoán tồn tại từ góc nhìn của bên cho vay, và các rủi ro mà bên cho vay chấp nhận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Vì sao bên cho vay cho vay.\u003c/b> Bên cho vay điển hình là một nhà nắm giữ dài hạn — quỹ hưu trí, quỹ tương hỗ, công ty bảo hiểm hoặc ngân hàng lưu ký hành động thay họ — nắm giữ chứng khoán mà họ không có ý định bán. Cho vay tạo ra một khoản \u003cb>phí vay tăng thêm\u003c/b> trên các tài sản vốn dĩ nằm không, cải thiện lợi suất danh mục với công sức có vẻ nhỏ. Khoản phí có thể đáng kể với cổ phiếu khan hiếm, khó vay. Bên cho vay cũng nhận \u003cb>tài sản bảo đảm\u003c/b> — tiền mặt hoặc chứng khoán chất lượng cao, thường vượt giá trị cổ phiếu cho vay — thứ tự nó có thể được tái đầu tư để sinh thêm lợi nhuận, và họ vẫn giữ các lợi ích \u003cb>kinh tế\u003c/b> của quyền sở hữu, vì cổ tức được người vay trả lại.\u003c/p>\u003cp>\u003cb>Các rủi ro chấp nhận.\u003c/b> (1) \u003cb>Rủi ro đối tác\u003c/b> — người vay có thể không trả lại được chứng khoán; khi đó tài sản bảo đảm phải được thanh lý, và có thể không đủ nếu giá đã dịch chuyển. (2) \u003cb>Rủi ro tái đầu tư tài sản bảo đảm\u003c/b> — trong lịch sử là nguồn tổn thất lớn nhất: tiền mặt làm tài sản bảo đảm được tái đầu tư vào các công cụ giảm giá trị hoặc trở nên kém thanh khoản khiến bên cho vay bị thiếu hụt dù bản thân việc cho vay chứng khoán diễn ra đúng như dự kiến. (3) \u003cb>Mất quyền biểu quyết\u003c/b> trong thời gian cho vay, vì quyền sở hữu pháp lý chuyển sang người vay — một mối lo về quản trị nếu phát sinh một cuộc biểu quyết gây tranh cãi, đòi hỏi phải thu hồi. (4) \u003cb>Rủi ro vận hành và pháp lý\u003c/b> trong việc thu hồi, các quyền lợi doanh nghiệp và xử lý thuế. (5) \u003cb>Rủi ro danh tiếng\u003c/b>, vì bên cho vay đang tạo điều kiện cho việc bán khống một chứng khoán mà chính họ nắm giữ, điều có thể xung đột với lợi ích của chính họ hoặc của khách hàng họ.\u003c/p>","rubricVi":"Thu nhập phí trên tài sản nằm không kèm tài sản bảo đảm và việc trả lại cổ tức (0,7) · ít nhất ba rủi ro gồm đối tác và tái đầu tư tài sản bảo đảm (0,9) · mất quyền biểu quyết hoặc điểm về danh tiếng (0,4)."},{"id":"K6-05","ch":6,"type":"case","clo":"CLO3","marks":3,"exam":"final","q":"A retail client complains that their leveraged position was force-sold at the market low without adequate warning, and demands compensation. Analyse the firm's position and what should have been in place.","guide":"\u003cp>\u003cb>Model answer — analysing the firm's position.\u003c/b> The firm's defence rests on whether it followed a \u003cb>documented, contractually agreed process\u003c/b>. The key questions are: (1) Did the \u003cb>margin agreement\u003c/b> clearly disclose the initial and maintenance margin requirements, the circumstances in which a call would be made, the time allowed to respond, and the firm's right to liquidate \u003cb>without further notice\u003c/b> if the call was unmet? (2) Was the client's \u003cb>understanding assessed\u003c/b> at onboarding — were they suitable for leveraged trading, and was risk disclosure given and acknowledged? (3) Was the \u003cb>call actually issued\u003c/b>, through the agreed channels, with an auditable record of despatch and timing? (4) Was the \u003cb>liquidation itself\u003c/b> conducted properly — only to the extent necessary to restore the ratio, at prices obtainable in the market, without preferring the firm's own interests?\u003c/p>\u003cp>If all of these are documented and were followed, the client's loss is the consequence of leverage they contracted for, and compensation is not owed — the force-sale occurring at a market low is inherent to the pro-cyclical nature of margin lending, not evidence of fault. If any link is missing — particularly proof that the call was sent and time allowed — the firm is exposed.\u003c/p>\u003cp>\u003cb>What should have been in place.\u003c/b> A clear, signed margin agreement with explicit liquidation rights; suitability assessment and risk warnings at onboarding, appropriate to a retail client; automated \u003cb>intra-day monitoring\u003c/b> with alerts to the client as the equity ratio approaches the maintenance level, not only once breached; a documented \u003cb>call procedure\u003c/b> with defined timelines and multiple contact channels, fully logged; a \u003cb>liquidation policy\u003c/b> specifying that only the necessary amount is sold, with records of execution prices against market prices at the time; conservative loan-to-value ratios and an eligible-securities list limiting exposure to volatile stock; and a complaints procedure. The wider lesson is that margin lending's legal defensibility rests almost entirely on the quality of the audit trail.\u003c/p>","rubric":"At least three of the four key questions identified (1.0) · reasoned conclusion linking documentation to liability (0.6) · at least five specific controls that should have existed (1.0) · audit-trail lesson (0.4).","qVi":"Một khách hàng cá nhân khiếu nại rằng vị thế dùng đòn bẩy của họ đã bị bán giải chấp ngay tại đáy thị trường mà không được cảnh báo đầy đủ, và đòi bồi thường. Phân tích vị thế pháp lý của công ty và những gì lẽ ra phải có.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — phân tích vị thế của công ty.\u003c/b> Lập luận bảo vệ của công ty dựa vào việc họ có tuân theo một \u003cb>quy trình đã được ghi chép và thỏa thuận trong hợp đồng\u003c/b> hay không. Các câu hỏi then chốt là: (1) \u003cb>Hợp đồng ký quỹ\u003c/b> có nêu rõ các yêu cầu ký quỹ ban đầu và duy trì, các trường hợp phát sinh lệnh gọi, thời hạn được phép phản hồi, và quyền của công ty được thanh lý \u003cb>mà không cần thông báo thêm\u003c/b> nếu lệnh gọi không được đáp ứng hay không? (2) \u003cb>Mức độ hiểu biết của khách hàng có được đánh giá\u003c/b> khi mở tài khoản — họ có phù hợp với giao dịch dùng đòn bẩy không, và việc công bố rủi ro đã được đưa ra và xác nhận chưa? (3) \u003cb>Lệnh gọi có thực sự được phát hành\u003c/b> qua các kênh đã thỏa thuận, với hồ sơ có thể kiểm chứng về việc gửi và thời điểm hay không? (4) \u003cb>Bản thân việc thanh lý\u003c/b> có được thực hiện đúng cách — chỉ ở mức cần thiết để khôi phục tỷ lệ, ở các mức giá có thể đạt được trên thị trường, không ưu tiên lợi ích của chính công ty?\u003c/p>\u003cp>Nếu tất cả những điều này đều được ghi chép và đã được tuân thủ, khoản lỗ của khách hàng là hệ quả của đòn bẩy mà họ đã ký kết, và không phải bồi thường — việc bán giải chấp diễn ra tại đáy thị trường là bản chất của tính thuận chu kỳ trong cho vay ký quỹ, không phải bằng chứng của lỗi. Nếu thiếu bất kỳ mắt xích nào — đặc biệt là bằng chứng rằng lệnh gọi đã được gửi và thời hạn đã được cho — thì công ty gặp rủi ro.\u003c/p>\u003cp>\u003cb>Những gì lẽ ra phải có.\u003c/b> Một hợp đồng ký quỹ rõ ràng, có chữ ký, với quyền thanh lý được nêu tường minh; đánh giá tính phù hợp và cảnh báo rủi ro khi mở tài khoản, tương xứng với một khách hàng cá nhân; \u003cb>giám sát trong phiên\u003c/b> tự động với cảnh báo tới khách hàng khi tỷ lệ vốn chủ tiến gần mức duy trì, chứ không chỉ khi đã vi phạm; một \u003cb>quy trình gọi ký quỹ\u003c/b> có ghi chép với thời hạn xác định và nhiều kênh liên lạc, được lưu vết đầy đủ; một \u003cb>chính sách thanh lý\u003c/b> quy định chỉ bán đúng khối lượng cần thiết, kèm hồ sơ về giá thực hiện đối chiếu với giá thị trường tại thời điểm đó; tỷ lệ cho vay trên giá trị tài sản bảo đảm thận trọng và một danh mục chứng khoán đủ điều kiện giới hạn rủi ro với cổ phiếu biến động mạnh; và một quy trình xử lý khiếu nại. Bài học rộng hơn là khả năng bảo vệ pháp lý của hoạt động cho vay ký quỹ gần như hoàn toàn dựa vào chất lượng của dấu vết kiểm toán.\u003c/p>","rubricVi":"Nhận diện ít nhất ba trong bốn câu hỏi then chốt (1,0) · kết luận có lập luận liên hệ hồ sơ với trách nhiệm (0,6) · ít nhất năm biện pháp kiểm soát cụ thể lẽ ra phải có (1,0) · bài học về dấu vết kiểm toán (0,4)."},{"id":"M1-01","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain why investment banking income is less stable than commercial banking income.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Commercial banking income is dominated by the \u003cb>net interest margin\u003c/b> on a loan book that turns over slowly. Loans are contracted for years, so interest income accrues steadily and is largely insulated from short-term market sentiment.\u003c/p>\u003cp>Investment banking income is \u003cb>transaction-based\u003c/b>: advisory fees are earned only when a deal completes, underwriting spreads only when an issue is placed, and trading revenue depends on market volumes and price movements. All of these depend on \u003cb>confidence\u003c/b>. In a downturn IPOs are pulled, M&amp;A is postponed and issuance windows close, so several revenue lines fall together — they are positively correlated with the same underlying driver rather than diversifying one another.\u003c/p>\u003cp>The instability is amplified by the \u003cb>cost base\u003c/b>. Compensation is the largest expense and is sticky in the short run, because the franchise depends on retaining people. Revenue therefore falls faster than costs, and profit swings far more than revenue — high operating leverage in a business whose revenue is inherently cyclical.\u003c/p>","rubric":"Contrast of interest margin with transaction income (0.8) · correlation of revenue lines with confidence (0.6) · fixed compensation base and operating leverage (0.6).","qVi":"Giải thích vì sao thu nhập của ngân hàng đầu tư kém ổn định hơn thu nhập của ngân hàng thương mại.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Thu nhập của ngân hàng thương mại bị chi phối bởi \u003cb>biên lãi ròng\u003c/b> trên một danh mục cho vay quay vòng chậm. Các khoản vay được ký kết cho nhiều năm, nên thu nhập lãi tích lũy đều đặn và phần lớn được cách ly khỏi tâm lý thị trường ngắn hạn.\u003c/p>\u003cp>Thu nhập của ngân hàng đầu tư dựa trên \u003cb>giao dịch\u003c/b>: phí tư vấn chỉ có khi thương vụ hoàn tất, chênh lệch bảo lãnh chỉ có khi một đợt phát hành được phân phối, và doanh thu giao dịch phụ thuộc khối lượng thị trường và biến động giá. Tất cả đều phụ thuộc vào \u003cb>niềm tin\u003c/b>. Trong suy thoái, IPO bị rút, M&amp;A bị hoãn và cửa sổ phát hành đóng lại, nên nhiều dòng doanh thu cùng giảm — chúng tương quan dương với cùng một yếu tố nền tảng chứ không đa dạng hóa cho nhau.\u003c/p>\u003cp>Sự bất ổn được khuếch đại bởi \u003cb>chi phí nền\u003c/b>. Thù lao là chi phí lớn nhất và dính chặt trong ngắn hạn, vì thương hiệu phụ thuộc vào việc giữ người. Doanh thu do đó giảm nhanh hơn chi phí, và lợi nhuận dao động mạnh hơn nhiều so với doanh thu — đòn bẩy hoạt động cao trong một ngành có doanh thu vốn dĩ mang tính chu kỳ.\u003c/p>","rubricVi":"So sánh biên lãi với thu nhập giao dịch (0,8) · tương quan các dòng doanh thu với niềm tin (0,6) · nền thù lao cố định và đòn bẩy hoạt động (0,6)."},{"id":"M1-02","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the trustee and servicer functions of an investment bank.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>trustee\u003c/b> function involves acting on the client's behalf under a trust or mandate: executing transactions the client has decided upon, and managing investments where discretion has been delegated. It is an \u003cb>agency\u003c/b> function — the bank holds or manages assets for the benefit of another, owes fiduciary-type duties of loyalty and care, and is paid a fee. In debt markets a trustee also acts for bondholders collectively, monitoring covenants and enforcing the indenture on their behalf.\u003c/p>\u003cp>The \u003cb>servicer\u003c/b> function is the provision of \u003cb>prime brokerage\u003c/b> to hedge funds and other professional investors. It bundles the operational and financing infrastructure a fund needs but does not wish to build: \u003cb>financing\u003c/b> of positions through margin lending, \u003cb>securities lending\u003c/b> to support short selling, \u003cb>clearing and settlement\u003c/b>, \u003cb>custody\u003c/b> of assets, consolidated \u003cb>reporting\u003c/b>, and capital introduction to potential investors.\u003c/p>\u003cp>Both are agency functions earning fees rather than spreads, but prime brokerage does expose the bank to \u003cb>credit risk\u003c/b> on the financing it extends — as the 2021 Archegos losses demonstrated, a prime broker's exposure to a single leveraged client can be substantial.\u003c/p>","rubric":"Trustee role incl. execution and discretionary management (0.7) · at least four prime-brokerage services (0.8) · agency classification and the credit-risk caveat (0.5).","qVi":"Giải thích chức năng nhận uỷ thác và chức năng cung cấp dịch vụ của một ngân hàng đầu tư.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Chức năng \u003cb>nhận uỷ thác\u003c/b> gồm hành động thay mặt khách hàng theo một hợp đồng uỷ thác hoặc mệnh lệnh: thực hiện các giao dịch khách hàng đã quyết định, và quản lý khoản đầu tư khi quyền quyết định được ủy quyền. Đây là chức năng \u003cb>đại lý\u003c/b> — ngân hàng nắm giữ hoặc quản lý tài sản vì lợi ích của người khác, có nghĩa vụ trung thành và cẩn trọng kiểu tín thác, và được trả phí. Trên thị trường nợ, người nhận uỷ thác còn hành động thay mặt tập thể trái chủ, giám sát các điều khoản ràng buộc và thực thi khế ước phát hành thay họ.\u003c/p>\u003cp>Chức năng \u003cb>cung cấp dịch vụ\u003c/b> là việc cung cấp \u003cb>môi giới trọn gói (prime brokerage)\u003c/b> cho quỹ đầu cơ và các nhà đầu tư chuyên nghiệp khác. Nó gộp lại hạ tầng vận hành và tài trợ mà một quỹ cần nhưng không muốn tự xây: \u003cb>tài trợ\u003c/b> vị thế qua vay ký quỹ, \u003cb>cho vay chứng khoán\u003c/b> để hỗ trợ bán khống, \u003cb>bù trừ và thanh toán\u003c/b>, \u003cb>lưu ký\u003c/b> tài sản, \u003cb>báo cáo\u003c/b> hợp nhất, và giới thiệu vốn cho các nhà đầu tư tiềm năng.\u003c/p>\u003cp>Cả hai đều là chức năng đại lý kiếm phí thay vì chênh lệch giá, nhưng môi giới trọn gói khiến ngân hàng chịu \u003cb>rủi ro tín dụng\u003c/b> trên khoản tài trợ nó cấp — như tổn thất Archegos năm 2021 cho thấy, mức rủi ro của một nhà môi giới trọn gói đối với một khách hàng dùng đòn bẩy duy nhất có thể rất lớn.\u003c/p>","rubricVi":"Vai trò nhận uỷ thác gồm thực hiện và quản lý ủy thác toàn quyền (0,7) · ít nhất bốn dịch vụ môi giới trọn gói (0,8) · phân loại đại lý và lưu ý rủi ro tín dụng (0,5)."},{"id":"M1-03","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what is meant by 'the investment bank rents out its balance sheet' and give two examples.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The phrase captures the fact that clients frequently need not advice but the temporary use of someone else's \u003cb>capital and risk-bearing capacity\u003c/b>. The bank commits its own balance sheet for a period, absorbs a risk the client cannot or will not carry, and charges for doing so.\u003c/p>\u003cp>\u003cb>Example 1 — firm-commitment underwriting.\u003c/b> The issuer needs certainty that it will receive a known sum on a known date. The bank purchases the entire issue at an agreed price and resells it, holding whatever it cannot place. It has lent its balance sheet to absorb \u003cb>placement risk\u003c/b>, and the gross spread is the rent.\u003c/p>\u003cp>\u003cb>Example 2 — market making.\u003c/b> An investor wishing to sell immediately needs a counterparty now, not when a natural buyer appears. The dealer buys the stock into its own inventory and carries it until it can be offloaded, absorbing \u003cb>inventory and adverse-selection risk\u003c/b>. The bid-ask spread is the rent.\u003c/p>\u003cp>(\u003ci>Bridge financing\u003c/i> in M&amp;A and \u003ci>margin lending\u003c/i> are equally valid examples.) In each case the economic service is the same: converting the client's uncertainty into certainty by taking the risk onto the bank's own book — which is why these activities consume regulatory capital and why post-crisis capital rules reduced the industry's willingness to supply them.\u003c/p>","rubric":"Correct interpretation of the phrase (0.6) · two valid examples with the specific risk absorbed (0.9) · link to capital consumption or regulation (0.5).","qVi":"Giải thích câu 'ngân hàng đầu tư cho thuê bảng cân đối của mình' nghĩa là gì và cho hai ví dụ.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Câu này nắm bắt thực tế rằng khách hàng thường không cần lời khuyên mà cần việc sử dụng tạm thời \u003cb>vốn và năng lực gánh rủi ro\u003c/b> của người khác. Ngân hàng cam kết bảng cân đối của mình trong một khoảng thời gian, hấp thụ một rủi ro mà khách hàng không thể hoặc không muốn gánh, và thu phí cho việc đó.\u003c/p>\u003cp>\u003cb>Ví dụ 1 — bảo lãnh theo cam kết chắc chắn.\u003c/b> Tổ chức phát hành cần chắc chắn rằng mình sẽ nhận được một khoản tiền đã biết vào một ngày đã biết. Ngân hàng mua trọn đợt phát hành ở mức giá đã thỏa thuận và bán lại, giữ phần nào không bán được. Nó đã cho thuê bảng cân đối để hấp thụ \u003cb>rủi ro phân phối\u003c/b>, và chênh lệch bảo lãnh chính là tiền thuê.\u003c/p>\u003cp>\u003cb>Ví dụ 2 — tạo lập thị trường.\u003c/b> Một nhà đầu tư muốn bán ngay lập tức cần một đối tác vào lúc này, không phải khi một người mua tự nhiên xuất hiện. Nhà tự doanh mua cổ phiếu vào tồn kho của mình và giữ cho tới khi có thể đẩy đi, hấp thụ \u003cb>rủi ro tồn kho và lựa chọn bất lợi\u003c/b>. Chênh lệch giá đặt mua – chào bán chính là tiền thuê.\u003c/p>\u003cp>(\u003ci>Tài trợ bắc cầu\u003c/i> trong M&amp;A và \u003ci>vay ký quỹ\u003c/i> đều là những ví dụ hợp lệ.) Trong mỗi trường hợp, dịch vụ kinh tế là như nhau: chuyển sự bất định của khách hàng thành sự chắc chắn bằng cách gánh rủi ro lên sổ của chính ngân hàng — đó là lý do các hoạt động này tiêu tốn vốn theo quy định và vì sao các quy tắc vốn hậu khủng hoảng đã giảm sự sẵn lòng cung cấp chúng của ngành.\u003c/p>","rubricVi":"Giải nghĩa đúng câu nói (0,6) · hai ví dụ hợp lệ với rủi ro cụ thể được hấp thụ (0,9) · liên hệ tới tiêu tốn vốn hoặc quy định (0,5)."},{"id":"M1-04","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Describe the responsibilities of the middle office and explain why it must be independent of the front office.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>middle office\u003c/b> measures and controls the risk the front office takes. Its principal functions are \u003cb>market and credit risk management\u003c/b> (setting and monitoring limits, computing VaR, running stress tests); \u003cb>compliance\u003c/b> (surveillance, conflicts management, regulatory reporting, maintaining restricted and watch lists); \u003cb>treasury\u003c/b> (funding and liquidity management); and \u003cb>product control\u003c/b> (independent price verification and daily P&amp;L attribution).\u003c/p>\u003cp>\u003cb>Why independence is essential.\u003c/b> Front-office staff are compensated on the revenue they report, so they have a direct financial interest in the valuations and risk figures the middle office produces. If a trader could mark their own positions, set their own limits, or influence those who do, then losses could be concealed and limits breached without consequence — the pattern common to every major rogue-trading loss.\u003c/p>\u003cp>Independence therefore requires separate \u003cb>reporting lines\u003c/b> (to the chief risk officer and ultimately the board, not to the desk head), separate \u003cb>compensation\u003c/b> not linked to desk revenue, and the \u003cb>authority\u003c/b> to escalate and to halt activity. Segregation of duties — traders cannot value, confirm or settle their own trades — is the specific control this independence exists to guarantee.\u003c/p>","rubric":"At least three middle-office functions (0.7) · conflict arising from revenue-linked pay (0.6) · independent reporting lines, compensation and authority, plus segregation of duties (0.7).","qVi":"Mô tả trách nhiệm của khối giữa và giải thích vì sao nó phải độc lập với khối trước.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Khối giữa\u003c/b> đo lường và kiểm soát rủi ro mà khối trước gánh chịu. Các chức năng chính là \u003cb>quản trị rủi ro thị trường và tín dụng\u003c/b> (đặt và giám sát hạn mức, tính VaR, chạy kiểm tra sức chịu đựng); \u003cb>tuân thủ\u003c/b> (giám sát, quản lý xung đột, báo cáo cơ quan quản lý, duy trì danh sách hạn chế và theo dõi); \u003cb>ngân quỹ\u003c/b> (quản lý vốn và thanh khoản); và \u003cb>kiểm soát sản phẩm\u003c/b> (kiểm chứng giá độc lập và phân bổ lãi/lỗ hằng ngày).\u003c/p>\u003cp>\u003cb>Vì sao độc lập là thiết yếu.\u003c/b> Nhân sự khối trước được trả công theo doanh thu họ báo cáo, nên họ có lợi ích tài chính trực tiếp trong các con số định giá và rủi ro mà khối giữa lập ra. Nếu một nhà giao dịch có thể tự định giá vị thế của mình, tự đặt hạn mức, hoặc ảnh hưởng đến người làm việc đó, thì tổn thất có thể bị che giấu và hạn mức bị vượt mà không có hậu quả — đúng mô hình chung của mọi tổn thất giao dịch gian lận lớn.\u003c/p>\u003cp>Do đó độc lập đòi hỏi \u003cb>tuyến báo cáo\u003c/b> riêng (lên giám đốc rủi ro và cuối cùng lên hội đồng quản trị, không lên trưởng bàn giao dịch), \u003cb>thù lao\u003c/b> riêng không gắn với doanh thu bàn giao dịch, và \u003cb>thẩm quyền\u003c/b> báo cáo lên trên và dừng hoạt động. Phân tách nhiệm vụ — nhà giao dịch không được tự định giá, xác nhận hay thanh toán giao dịch của chính mình — là biện pháp kiểm soát cụ thể mà sự độc lập này tồn tại để bảo đảm.\u003c/p>","rubricVi":"Ít nhất ba chức năng khối giữa (0,7) · xung đột phát sinh từ thù lao gắn doanh thu (0,6) · tuyến báo cáo, thù lao và thẩm quyền độc lập, cùng phân tách nhiệm vụ (0,7)."},{"id":"M1-05","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the role of credit rating agencies in the operating environment of an investment bank.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Role.\u003c/b> Rating agencies assess an issuer's or an instrument's creditworthiness and publish an opinion in a standardised symbol. In a debt issue the rating is the principal determinant of the \u003cb>credit spread\u003c/b>, and therefore of the coupon the issuer pays. It also determines the \u003cb>investor base\u003c/b>, because many institutional mandates permit only investment-grade holdings, and it feeds into regulatory capital calculations for holders.\u003c/p>\u003cp>\u003cb>How the bank interacts with them.\u003c/b> \u003cb>Rating advisory\u003c/b> is a core DCM service: preparing the issuer's presentation, modelling the effect of the proposed structure on key ratios, and anticipating the agencies' questions. The bank also structures instruments to achieve a target rating.\u003c/p>\u003cp>\u003cb>The recognised weakness\u003c/b> is the \u003cb>issuer-pays\u003c/b> model: the entity being rated pays for the rating, creating an incentive to compete for business by being accommodating. This conflict contributed materially to the 2008 crisis, when structured products carried ratings that proved unjustified. Post-crisis reforms addressed disclosure of methodologies, conflict management and reduced regulatory reliance on ratings — but the essential conflict remains, which is why an analyst should treat a rating as one input rather than as a substitute for independent credit analysis.\u003c/p>","rubric":"Rating's effect on spread and investor base (0.7) · rating
