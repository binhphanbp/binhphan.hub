advisory as a bank service (0.5) · issuer-pays conflict with the 2008 illustration and the analytical implication (0.8).","qVi":"Giải thích vai trò của các tổ chức xếp hạng tín nhiệm trong môi trường hoạt động của một ngân hàng đầu tư.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Vai trò.\u003c/b> Tổ chức xếp hạng đánh giá mức độ tín nhiệm của một tổ chức phát hành hoặc một công cụ và công bố ý kiến bằng một ký hiệu chuẩn hóa. Trong một đợt phát hành nợ, mức xếp hạng là yếu tố quyết định chính của \u003cb>chênh lệch tín dụng\u003c/b>, và do đó của lãi suất coupon mà tổ chức phát hành trả. Nó cũng quyết định \u003cb>nền nhà đầu tư\u003c/b>, vì nhiều mệnh lệnh đầu tư của tổ chức chỉ cho phép nắm giữ hạng đầu tư, và nó tham gia vào tính toán vốn theo quy định cho bên nắm giữ.\u003c/p>\u003cp>\u003cb>Ngân hàng tương tác với họ như thế nào.\u003c/b> \u003cb>Tư vấn xếp hạng\u003c/b> là một dịch vụ DCM cốt lõi: chuẩn bị bài trình bày của tổ chức phát hành, mô hình hóa tác động của cấu trúc đề xuất lên các hệ số then chốt, và lường trước câu hỏi của các tổ chức xếp hạng. Ngân hàng cũng cấu trúc các công cụ để đạt một mức xếp hạng mục tiêu.\u003c/p>\u003cp>\u003cb>Điểm yếu được thừa nhận\u003c/b> là mô hình \u003cb>tổ chức phát hành trả phí\u003c/b>: chủ thể được xếp hạng trả tiền cho việc xếp hạng, tạo động cơ cạnh tranh giành hợp đồng bằng cách dễ dãi. Xung đột này đã góp phần đáng kể vào khủng hoảng 2008, khi các sản phẩm cấu trúc mang mức xếp hạng hóa ra không có cơ sở. Cải cách hậu khủng hoảng xử lý việc công bố phương pháp, quản lý xung đột và giảm sự phụ thuộc của quy định vào xếp hạng — nhưng xung đột cốt yếu vẫn còn, đó là lý do một chuyên viên phân tích nên coi mức xếp hạng là một dữ liệu đầu vào chứ không phải thay thế cho phân tích tín dụng độc lập.\u003c/p>","rubricVi":"Tác động của xếp hạng lên chênh lệch và nền nhà đầu tư (0,7) · tư vấn xếp hạng như một dịch vụ của ngân hàng (0,5) · xung đột tổ chức phát hành trả phí với minh họa 2008 và hàm ý phân tích (0,8)."},{"id":"M1-06","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what 'material non-public information' means and the obligations it creates.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Information is \u003cb>material\u003c/b> if a reasonable investor would consider it important in making an investment decision — that is, if its disclosure would be likely to affect the security's price. It is \u003cb>non-public\u003c/b> until it has been disseminated to the market generally and the market has had an opportunity to absorb it. Typical examples are an unannounced acquisition, an unpublished earnings result, an impending regulatory decision, or the loss of a major contract.\u003c/p>\u003cp>\u003cb>Obligations.\u003c/b> A person in possession of MNPI must \u003cb>not trade\u003c/b> in the affected securities, must \u003cb>not cause or encourage others to trade\u003c/b> (tipping), and must \u003cb>not disclose\u003c/b> the information outside the barrier without proper authorisation. Where the information arrives inadvertently, the correct response is to notify \u003cb>compliance immediately\u003c/b> so the security can be placed on the restricted list. Institutionally the obligations are discharged through the \u003cb>information barrier\u003c/b> between private and public sides, documented \u003cb>wall-crossing\u003c/b> procedures, restricted and watch lists, personal-account dealing rules and trade surveillance.\u003c/p>\u003cp>Breach is not merely an ethical failure: insider dealing is a \u003cb>criminal or administrative offence\u003c/b> in most jurisdictions, including Vietnam, and exposes both the individual and the firm to sanction and severe reputational damage.\u003c/p>","rubric":"Both limbs of the definition with examples (0.7) · three obligations — not trade, not tip, not disclose — plus escalation (0.7) · institutional controls and the legal consequence (0.6).","qVi":"Giải thích 'thông tin trọng yếu chưa công bố' nghĩa là gì và các nghĩa vụ mà nó tạo ra.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Thông tin là \u003cb>trọng yếu\u003c/b> nếu một nhà đầu tư hợp lý coi nó là quan trọng trong việc ra quyết định đầu tư — tức là nếu việc công bố nó có khả năng ảnh hưởng đến giá chứng khoán. Nó là \u003cb>chưa công bố\u003c/b> cho tới khi được phổ biến ra thị trường nói chung và thị trường có cơ hội hấp thụ nó. Ví dụ điển hình là một thương vụ thâu tóm chưa công bố, một kết quả lợi nhuận chưa công bố, một quyết định quản lý sắp tới, hoặc việc mất một hợp đồng lớn.\u003c/p>\u003cp>\u003cb>Các nghĩa vụ.\u003c/b> Người nắm giữ thông tin trọng yếu chưa công bố phải \u003cb>không giao dịch\u003c/b> chứng khoán liên quan, phải \u003cb>không gây ra hoặc khuyến khích người khác giao dịch\u003c/b> (mách nước), và phải \u003cb>không tiết lộ\u003c/b> thông tin ra ngoài rào chắn nếu không được phép đúng thẩm quyền. Khi thông tin đến một cách vô tình, phản ứng đúng là báo \u003cb>tuân thủ ngay lập tức\u003c/b> để đưa chứng khoán vào danh sách hạn chế. Về mặt thể chế, các nghĩa vụ được thực thi qua \u003cb>rào chắn thông tin\u003c/b> giữa bên riêng tư và bên công khai, thủ tục \u003cb>vượt tường\u003c/b> có ghi chép, danh sách hạn chế và theo dõi, quy tắc giao dịch tài khoản cá nhân và giám sát giao dịch.\u003c/p>\u003cp>Vi phạm không chỉ là thất bại đạo đức: giao dịch nội gián là \u003cb>tội hình sự hoặc vi phạm hành chính\u003c/b> ở hầu hết các nước, kể cả Việt Nam, và khiến cả cá nhân lẫn công ty đối mặt chế tài và tổn hại danh tiếng nghiêm trọng.\u003c/p>","rubricVi":"Cả hai vế của định nghĩa với ví dụ (0,7) · ba nghĩa vụ — không giao dịch, không mách nước, không tiết lộ — cùng báo cáo lên trên (0,7) · biện pháp kiểm soát thể chế và hệ quả pháp lý (0,6)."},{"id":"M1-07","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain how the investment banking industry differs between the United States, continental Europe and Vietnam.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>United States.\u003c/b> Historically characterised by \u003cb>legal separation\u003c/b>: Glass-Steagall (1933) forced firms to choose between commercial and investment banking, creating the standalone Wall Street investment bank. Gramm-Leach-Bliley (1999) repealed the separation, and the 2008 crisis then eliminated the independent model when Goldman Sachs and Morgan Stanley became bank holding companies. Supervision sits with the SEC and, since 2008, also the Federal Reserve.\u003c/p>\u003cp>\u003cb>Continental Europe.\u003c/b> Predominantly the \u003cb>universal banking\u003c/b> model, in which a single institution has long provided both commercial and investment banking services, with no equivalent of the Glass-Steagall separation. Supervision centres on the \u003cb>central bank\u003c/b>. Britain is the exception within Europe, having developed specialised merchant and investment banks separately from clearing banks.\u003c/p>\u003cp>\u003cb>Vietnam.\u003c/b> The functions are performed not by entities called investment banks but by \u003cb>securities companies\u003c/b> (SSI, HSC and others), \u003cb>fund management companies\u003c/b> (VFM and others) and \u003cb>partially universal banks\u003c/b> — commercial banks conducting securities activity through separately licensed subsidiaries. Securities investment companies are provided for in law but are not established in practice. Supervision is by the \u003cb>State Securities Commission\u003c/b> under the Law on Securities, with each operation — brokerage, proprietary trading, underwriting, advisory — separately licensed and subject to its own minimum charter capital.\u003c/p>","rubric":"US separation-repeal-conversion sequence with supervisor (0.7) · European universal model with the UK exception (0.5) · Vietnamese entities, SSC supervision and per-operation licensing (0.8).","qVi":"Giải thích ngành ngân hàng đầu tư khác nhau như thế nào giữa Hoa Kỳ, châu Âu lục địa và Việt Nam.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Hoa Kỳ.\u003c/b> Trong lịch sử đặc trưng bởi \u003cb>sự tách bạch pháp lý\u003c/b>: Glass-Steagall (1933) buộc các định chế phải chọn giữa ngân hàng thương mại và ngân hàng đầu tư, tạo ra ngân hàng đầu tư độc lập của Phố Wall. Gramm-Leach-Bliley (1999) bãi bỏ sự tách bạch, và khủng hoảng 2008 sau đó xóa sổ mô hình độc lập khi Goldman Sachs và Morgan Stanley trở thành công ty mẹ ngân hàng. Việc giám sát thuộc về SEC và, từ 2008, cả Cục Dự trữ Liên bang.\u003c/p>\u003cp>\u003cb>Châu Âu lục địa.\u003c/b> Chủ yếu là mô hình \u003cb>ngân hàng đa năng\u003c/b>, trong đó một định chế duy nhất từ lâu đã cung cấp cả dịch vụ ngân hàng thương mại lẫn ngân hàng đầu tư, không có tương đương với sự tách bạch kiểu Glass-Steagall. Việc giám sát tập trung ở \u003cb>ngân hàng trung ương\u003c/b>. Anh là ngoại lệ trong châu Âu, đã phát triển các ngân hàng thương gia và ngân hàng đầu tư chuyên biệt tách khỏi các ngân hàng thanh toán bù trừ.\u003c/p>\u003cp>\u003cb>Việt Nam.\u003c/b> Các chức năng được thực hiện không phải bởi các thực thể gọi là ngân hàng đầu tư mà bởi \u003cb>công ty chứng khoán\u003c/b> (SSI, HSC và những công ty khác), \u003cb>công ty quản lý quỹ\u003c/b> (VFM và những công ty khác) và \u003cb>ngân hàng đa năng một phần\u003c/b> — các ngân hàng thương mại thực hiện hoạt động chứng khoán qua các công ty con được cấp phép riêng. Công ty đầu tư chứng khoán được quy định trong luật nhưng không được thành lập trên thực tế. Việc giám sát do \u003cb>Uỷ ban Chứng khoán Nhà nước\u003c/b> thực hiện theo Luật Chứng khoán, với mỗi nghiệp vụ — môi giới, tự doanh, bảo lãnh, tư vấn — được cấp phép riêng và chịu mức vốn điều lệ tối thiểu riêng.\u003c/p>","rubricVi":"Chuỗi tách bạch – bãi bỏ – chuyển đổi ở Hoa Kỳ với cơ quan giám sát (0,7) · mô hình đa năng châu Âu với ngoại lệ Anh (0,5) · các thực thể Việt Nam, giám sát của UBCKNN và cấp phép theo từng nghiệp vụ (0,8)."},{"id":"M1-08","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain why an investment bank's advisory business is described as reputation-dependent, and how reputation is built and lost.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Why it depends on reputation.\u003c/b> Advisory services cannot be inspected before purchase. A client choosing an adviser for a once-in-a-generation transaction cannot test the quality of judgement in advance, and the consequences of poor advice are severe and irreversible. The client must also hand over its most sensitive information. In these conditions the client selects on \u003cb>credibility\u003c/b> — evidence of past execution, sector expertise, discretion and independence — because that is the only signal available.\u003c/p>\u003cp>\u003cb>How reputation is built.\u003c/b> Slowly, through completed transactions that stand up over time; through league-table position as visible evidence of mandate flow; through published research and sector expertise; through senior bankers' individual track records and relationships; and through demonstrated discretion — clients notice when a bank does \u003ci>not\u003c/i> leak.\u003c/p>\u003cp>\u003cb>How it is lost.\u003c/b> Quickly and often through a single episode: a leak of confidential information; a conflict handled badly, such as research shaped to win a mandate; a mis-sold product; a regulatory finding or public enforcement action; or a high-profile transaction that destroys client value. Because the asset is intangible and the loss is abrupt, a bank may rationally \u003cb>decline a profitable mandate\u003c/b> whose reputational risk outweighs the fee — the fee is earned once, whereas reputation determines the flow of all future mandates.\u003c/p>","rubric":"Credence-good argument incl. inability to inspect quality and sensitivity of information (0.8) · at least three ways reputation is built (0.5) · at least three ways it is lost, with the asymmetry and the declining-a-mandate implication (0.7).","qVi":"Giải thích vì sao mảng tư vấn của một ngân hàng đầu tư được mô tả là phụ thuộc vào danh tiếng, và danh tiếng được xây dựng và đánh mất như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Vì sao nó phụ thuộc vào danh tiếng.\u003c/b> Dịch vụ tư vấn không thể kiểm tra trước khi mua. Một khách hàng chọn cố vấn cho một giao dịch cả thế hệ mới có một lần không thể kiểm chứng trước chất lượng phán đoán, và hậu quả của lời khuyên tồi là nghiêm trọng và không thể đảo ngược. Khách hàng còn phải trao đi thông tin nhạy cảm nhất của mình. Trong điều kiện đó, khách hàng lựa chọn dựa trên \u003cb>uy tín\u003c/b> — bằng chứng về thực thi trong quá khứ, chuyên môn ngành, sự kín đáo và độc lập — vì đó là tín hiệu duy nhất có sẵn.\u003c/p>\u003cp>\u003cb>Danh tiếng được xây dựng như thế nào.\u003c/b> Chậm rãi, qua các giao dịch hoàn tất trụ vững theo thời gian; qua vị trí bảng xếp hạng như bằng chứng hữu hình về dòng hợp đồng; qua nghiên cứu được công bố và chuyên môn ngành; qua thành tích cá nhân và quan hệ của các chuyên viên tư vấn cấp cao; và qua sự kín đáo được chứng minh — khách hàng để ý khi một ngân hàng \u003ci>không\u003c/i> làm rò rỉ.\u003c/p>\u003cp>\u003cb>Danh tiếng bị đánh mất như thế nào.\u003c/b> Nhanh chóng và thường qua một sự việc duy nhất: một vụ rò rỉ thông tin bảo mật; một xung đột xử lý tồi, chẳng hạn nghiên cứu bị nắn để giành hợp đồng; một sản phẩm bán sai; một kết luận của cơ quan quản lý hoặc một hành động cưỡng chế công khai; hoặc một giao dịch nổi bật phá hủy giá trị của khách hàng. Vì tài sản này vô hình và mất mát đến đột ngột, một ngân hàng có thể hợp lý \u003cb>từ chối một hợp đồng sinh lời\u003c/b> mà rủi ro danh tiếng lớn hơn khoản phí — khoản phí kiếm được một lần, còn danh tiếng quyết định dòng chảy của mọi hợp đồng tương lai.\u003c/p>","rubricVi":"Lập luận về hàng hóa tín nhiệm gồm không thể kiểm tra chất lượng và sự nhạy cảm của thông tin (0,8) · ít nhất ba cách danh tiếng được xây dựng (0,5) · ít nhất ba cách nó bị đánh mất, với tính bất đối xứng và hàm ý từ chối hợp đồng (0,7)."},{"id":"M1-09","ch":1,"type":"case","clo":"CLO1","marks":3,"exam":"final","q":"A bank is asked to advise a state-owned enterprise on its equitization while another team in the same bank is advising a private investor interested in buying a stake. Analyse the problem and the options.","guide":"\u003cp>\u003cb>Model answer — the problem.\u003c/b> This is a direct \u003cb>conflict of interest\u003c/b>: the bank would be advising the \u003cb>seller\u003c/b> (the SOE and, behind it, the State) on maximising value while advising a \u003cb>prospective buyer\u003c/b> on acquiring the same asset at the lowest price. The two mandates are in irreconcilable opposition on the central issue — price.\u003c/p>\u003cp>The problem is aggravated by three features. First, the \u003cb>information asymmetry\u003c/b>: the sell-side team will hold detailed non-public information about the enterprise's valuation, its floor price and the State's flexibility, which would be of extraordinary value to the buy-side team. Second, the \u003cb>public interest\u003c/b>: equitization involves the disposal of state assets, where undervaluation transfers public wealth to private buyers and attracts intense scrutiny and potential criminal liability. Third, \u003cb>appearance\u003c/b>: even if the barrier holds perfectly, the perception that a single adviser stood on both sides may taint the transaction and expose all parties to challenge.\u003c/p>\u003cp>\u003cb>Options.\u003c/b> (1) \u003cb>Decline one mandate.\u003c/b> This is the cleanest response and, given the public-interest dimension, the appropriate default — normally declining the buy-side role, since the sell-side mandate carries the public duty. (2) \u003cb>Accept only with full informed consent from both clients\u003c/b>, supported by a rigorous information barrier: physically and systemically separated teams, separate document storage, no shared personnel including at senior and support level, and independent supervision of each team. Even then, consent from the State-side client may not be obtainable or appropriate. (3) \u003cb>Chinese-walled teams with an independent adviser\u003c/b> appointed for one side. (4) In practice, transparent \u003cb>competitive bidding\u003c/b> is the strongest protection for the seller regardless of adviser arrangements, since a genuine auction reveals value that no valuation opinion can guarantee.\u003c/p>\u003cp>\u003cb>Recommendation.\u003c/b> Decline the buy-side mandate. The reputational and legal exposure in a state-asset disposal is disproportionate to the fee, and the conflict goes to the central term of the transaction rather than to a peripheral matter.\u003c/p>","rubric":"Conflict correctly identified as opposed interests on price (0.8) · information asymmetry, public-interest and appearance aggravators (0.9) · at least three options incl. declining and barriers with informed consent (0.9) · reasoned recommendation (0.4).","qVi":"Một ngân hàng được yêu cầu tư vấn cho một doanh nghiệp nhà nước về việc cổ phần hóa, trong khi một nhóm khác trong cùng ngân hàng đang tư vấn cho một nhà đầu tư tư nhân quan tâm mua cổ phần. Phân tích vấn đề và các phương án.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — vấn đề.\u003c/b> Đây là một \u003cb>xung đột lợi ích\u003c/b> trực tiếp: ngân hàng vừa tư vấn cho \u003cb>bên bán\u003c/b> (doanh nghiệp nhà nước và, đứng sau, Nhà nước) về việc tối đa hóa giá trị, vừa tư vấn cho một \u003cb>người mua tiềm năng\u003c/b> về việc thâu tóm chính tài sản đó ở mức giá thấp nhất. Hai hợp đồng đối nghịch không thể dung hòa ở vấn đề trung tâm — giá.\u003c/p>\u003cp>Vấn đề trầm trọng thêm bởi ba đặc điểm. Thứ nhất, \u003cb>bất đối xứng thông tin\u003c/b>: nhóm bên bán sẽ nắm thông tin chưa công bố chi tiết về định giá doanh nghiệp, giá sàn và sự linh hoạt của Nhà nước, những thứ vô cùng giá trị với nhóm bên mua. Thứ hai, \u003cb>lợi ích công\u003c/b>: cổ phần hóa liên quan đến việc chuyển nhượng tài sản nhà nước, nơi định giá thấp chuyển của cải công sang người mua tư nhân và thu hút sự giám sát gắt gao cùng trách nhiệm hình sự tiềm tàng. Thứ ba, \u003cb>hình thức bên ngoài\u003c/b>: ngay cả khi rào chắn giữ vững hoàn hảo, nhận thức rằng một cố vấn duy nhất đứng ở cả hai phía có thể làm hoen ố giao dịch và khiến mọi bên đối mặt sự khiếu nại.\u003c/p>\u003cp>\u003cb>Các phương án.\u003c/b> (1) \u003cb>Từ chối một hợp đồng.\u003c/b> Đây là phản ứng sạch nhất và, do có yếu tố lợi ích công, là mặc định phù hợp — thường là từ chối vai trò bên mua, vì hợp đồng bên bán mang nghĩa vụ công. (2) \u003cb>Chỉ nhận với sự đồng thuận trên cơ sở thông tin đầy đủ từ cả hai khách hàng\u003c/b>, được hỗ trợ bằng một rào chắn thông tin nghiêm ngặt: các nhóm tách biệt về vật lý và hệ thống, lưu trữ hồ sơ riêng, không chung nhân sự kể cả cấp cao và cấp hỗ trợ, và giám sát độc lập mỗi nhóm. Ngay cả khi đó, sự đồng thuận từ khách hàng phía Nhà nước có thể không đạt được hoặc không phù hợp. (3) \u003cb>Các nhóm được ngăn bằng bức tường với một cố vấn độc lập\u003c/b> được chỉ định cho một bên. (4) Trên thực tế, \u003cb>đấu giá cạnh tranh\u003c/b> minh bạch là sự bảo vệ mạnh nhất cho bên bán bất kể sắp xếp cố vấn, vì một cuộc đấu giá thực sự bộc lộ giá trị mà không một ý kiến định giá nào bảo đảm được.\u003c/p>\u003cp>\u003cb>Khuyến nghị.\u003c/b> Từ chối hợp đồng bên mua. Rủi ro danh tiếng và pháp lý trong việc chuyển nhượng tài sản nhà nước là không tương xứng với khoản phí, và xung đột chạm tới điều khoản trung tâm của giao dịch chứ không phải một vấn đề ngoại vi.\u003c/p>","rubricVi":"Nhận diện đúng xung đột là lợi ích đối nghịch về giá (0,8) · các yếu tố làm trầm trọng: bất đối xứng thông tin, lợi ích công và hình thức bên ngoài (0,9) · ít nhất ba phương án gồm từ chối và rào chắn với đồng thuận đầy đủ (0,9) · khuyến nghị có lập luận (0,4)."},{"id":"M2-01","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the purpose of the prospectus and the liability attaching to it.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Purpose.\u003c/b> The prospectus is the formal disclosure document by which an issuer offers securities to the public. Its function is to place investors in a position to make an \u003cb>informed investment decision\u003c/b>, by disclosing all information material to that decision. It also creates a single authoritative source of information, so that all investors receive the same disclosure at the same time — which is why promotional statements outside it are restricted during the \u003cb>quiet period\u003c/b>.\u003c/p>\u003cp>\u003cb>Contents\u003c/b> typically include a description of the business and its markets; audited financial statements and management's discussion of them; the offering terms and the intended \u003cb>use of proceeds\u003c/b>; \u003cb>risk factors\u003c/b>; details of management, governance and major shareholders; related-party transactions; and material contracts and litigation.\u003c/p>\u003cp>\u003cb>Liability.\u003c/b> The document carries statutory liability for material misstatement or omission. Responsibility attaches to the \u003cb>issuer\u003c/b> and its \u003cb>directors\u003c/b>, and in most regimes also to the \u003cb>underwriters\u003c/b> — which is precisely why underwriters conduct their own due diligence and obtain comfort letters from auditors and legal opinions. Their exposure is the mechanism that makes the disclosure credible: the bank is staking its own liability on the accuracy of what the issuer says.\u003c/p>","rubric":"Informed-decision purpose and equal disclosure (0.6) · at least four content items incl. risk factors and use of proceeds (0.6) · liability of issuer, directors and underwriters, linked to due diligence (0.8).","qVi":"Giải thích mục đích của bản cáo bạch và trách nhiệm pháp lý gắn với nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Mục đích.\u003c/b> Bản cáo bạch là tài liệu công bố chính thức qua đó tổ chức phát hành chào bán chứng khoán ra công chúng. Chức năng của nó là đặt nhà đầu tư vào vị thế ra một \u003cb>quyết định đầu tư có đầy đủ thông tin\u003c/b>, bằng cách công bố mọi thông tin trọng yếu đối với quyết định đó. Nó cũng tạo ra một nguồn thông tin có thẩm quyền duy nhất, để mọi nhà đầu tư nhận cùng một công bố vào cùng một thời điểm — đó là lý do các phát ngôn quảng bá ngoài nó bị hạn chế trong \u003cb>thời kỳ im lặng\u003c/b>.\u003c/p>\u003cp>\u003cb>Nội dung\u003c/b> thường gồm mô tả hoạt động kinh doanh và các thị trường của nó; báo cáo tài chính đã kiểm toán và phần thảo luận của ban điều hành; điều khoản chào bán và mục đích \u003cb>sử dụng vốn thu được\u003c/b>; \u003cb>các yếu tố rủi ro\u003c/b>; thông tin về ban điều hành, quản trị và cổ đông lớn; giao dịch với bên liên quan; và các hợp đồng trọng yếu cùng tranh chấp.\u003c/p>\u003cp>\u003cb>Trách nhiệm pháp lý.\u003c/b> Tài liệu mang trách nhiệm pháp lý theo luật đối với việc trình bày sai hoặc bỏ sót thông tin trọng yếu. Trách nhiệm gắn với \u003cb>tổ chức phát hành\u003c/b> và các \u003cb>thành viên hội đồng quản trị\u003c/b>, và ở hầu hết các chế độ pháp lý cũng gắn với \u003cb>nhà bảo lãnh\u003c/b> — đó chính là lý do nhà bảo lãnh tự thực hiện thẩm định và lấy thư bảo đảm từ kiểm toán và ý kiến pháp lý. Rủi ro của họ là cơ chế khiến việc công bố trở nên đáng tin: ngân hàng đặt trách nhiệm pháp lý của chính mình lên tính chính xác của những gì tổ chức phát hành nói.\u003c/p>","rubricVi":"Mục đích ra quyết định có thông tin và công bố ngang bằng (0,6) · ít nhất bốn nội dung gồm yếu tố rủi ro và sử dụng vốn (0,6) · trách nhiệm của tổ chức phát hành, thành viên HĐQT và nhà bảo lãnh, gắn với thẩm định (0,8)."},{"id":"M2-02","ch":2,"type":"calc-essay","clo":"CLO1","marks":2,"exam":"midterm","q":"A company with 80 million shares trading at VND 55,000 makes a 1-for-5 rights issue at VND 35,000. Compute the funds raised, the TERP, the value of a right, and the total market capitalisation before and after.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> New shares = 80m ÷ 5 = \u003cb>16 million\u003c/b>.\u003cbr>Funds raised = 16m × 35,000 = \u003cb>VND 560 billion\u003c/b>.\u003c/p>\u003cp>TERP = (5 × 55,000 + 1 × 35,000) ÷ 6 = (275,000 + 35,000) ÷ 6 = 310,000 ÷ 6 = \u003cb>VND 51,667\u003c/b>.\u003c/p>\u003cp>Value of one right = 55,000 − 51,667 = \u003cb>VND 3,333\u003c/b>.\u003c/p>\u003cp>\u003cb>Market capitalisation:\u003c/b>\u003cbr>Before = 80m × 55,000 = \u003cb>VND 4,400 billion\u003c/b>\u003cbr>After = 96m × 51,667 = \u003cb>VND 4,960 billion\u003c/b>\u003cbr>Increase = VND 560 billion — \u003cb>exactly the cash raised\u003c/b>.\u003c/p>\u003cp>This confirms the internal consistency of the calculation: a rights issue neither creates nor destroys value at the moment of issue. The company's market capitalisation rises by precisely the new cash injected, and the share price falls to the TERP only because the same total value is now spread over more shares. Whether value is subsequently created depends entirely on what the company does with the VND 560 billion.\u003c/p>","rubric":"New shares and funds raised (0.5) · TERP (0.5) · value of right (0.4) · both market caps with the reconciliation to funds raised (0.6).","qVi":"Một công ty có 80 triệu cổ phần giao dịch ở 55.000 đồng thực hiện phát hành quyền mua tỷ lệ 1:5 ở giá 35.000 đồng. Tính số tiền huy động, TERP, giá trị một quyền, và tổng vốn hóa thị trường trước và sau.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Cổ phần mới = 80 triệu ÷ 5 = \u003cb>16 triệu\u003c/b>.\u003cbr>Số tiền huy động = 16 triệu × 35.000 = \u003cb>560 tỷ đồng\u003c/b>.\u003c/p>\u003cp>TERP = (5 × 55.000 + 1 × 35.000) ÷ 6 = (275.000 + 35.000) ÷ 6 = 310.000 ÷ 6 = \u003cb>51.667 đồng\u003c/b>.\u003c/p>\u003cp>Giá trị một quyền = 55.000 − 51.667 = \u003cb>3.333 đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Vốn hóa thị trường:\u003c/b>\u003cbr>Trước = 80 triệu × 55.000 = \u003cb>4.400 tỷ đồng\u003c/b>\u003cbr>Sau = 96 triệu × 51.667 = \u003cb>4.960 tỷ đồng\u003c/b>\u003cbr>Phần tăng = 560 tỷ đồng — \u003cb>đúng bằng số tiền huy động\u003c/b>.\u003c/p>\u003cp>Điều này xác nhận tính nhất quán nội tại của phép tính: một đợt phát hành quyền mua không tạo cũng không phá hủy giá trị tại thời điểm phát hành. Vốn hóa thị trường của công ty tăng đúng bằng lượng tiền mặt mới được bơm vào, và giá cổ phần rơi xuống TERP chỉ vì cùng một tổng giá trị nay được trải trên nhiều cổ phần hơn. Việc giá trị có được tạo ra sau đó hay không hoàn toàn phụ thuộc vào công ty làm gì với 560 tỷ đồng đó.\u003c/p>","rubricVi":"Cổ phần mới và tiền huy động (0,5) · TERP (0,5) · giá trị quyền (0,4) · cả hai vốn hóa với việc đối chiếu về số tiền huy động (0,6)."},{"id":"M2-03","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the advantages and disadvantages of becoming a public company.","guide":"\u003cp>\u003cb>Model answer — advantages.\u003c/b> \u003cb>Access to capital\u003c/b> on better terms and in larger amounts, both at IPO and through subsequent issuance. \u003cb>Liquidity\u003c/b> and an observable market price for existing shareholders, enabling partial monetisation and providing a valuation for estate and succession purposes. \u003cb>Currency for acquisitions\u003c/b> — listed shares can be offered as consideration — and for \u003cb>employee incentives\u003c/b> through share schemes. \u003cb>Reputation and credibility\u003c/b> with banks, customers, suppliers and regulators. \u003cb>Governance discipline\u003c/b>, which although a cost is also a benefit in professionalising the company.\u003c/p>\u003cp>\u003cb>Disadvantages.\u003c/b> The \u003cb>cost\u003c/b> of the offering itself — underwriting spread, legal, audit and listing fees — and of continuing compliance. \u003cb>Continuous disclosure\u003c/b> obligations, including of information a private company would prefer to keep from competitors. \u003cb>Short-term pressure\u003c/b> from the market and analysts, which may distort decision-making away from long-term investment. \u003cb>Dilution\u003c/b> and loss of absolute control, with exposure to activist investors and to \u003cb>takeover\u003c/b>. Greater \u003cb>personal responsibility and scrutiny\u003c/b> for directors. And the burden falls disproportionately on smaller companies, for which fixed compliance costs are proportionately larger.\u003c/p>\u003cp>The decision therefore turns on the amount of capital genuinely needed, the owners' tolerance for disclosure and dilution, and whether the company is operationally and organisationally ready.\u003c/p>","rubric":"At least four advantages (0.7) · at least four disadvantages (0.8) · balanced concluding judgement on the decision criteria (0.5).","qVi":"Giải thích các lợi thế và bất lợi của việc trở thành công ty đại chúng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — lợi thế.\u003c/b> \u003cb>Tiếp cận vốn\u003c/b> với điều kiện tốt hơn và ở quy mô lớn hơn, cả tại IPO lẫn qua các đợt phát hành sau. \u003cb>Thanh khoản\u003c/b> và một mức giá thị trường quan sát được cho cổ đông hiện hữu, cho phép hiện thực hóa một phần và cung cấp một định giá cho mục đích thừa kế và chuyển giao. \u003cb>Phương tiện cho thâu tóm\u003c/b> — cổ phần niêm yết có thể được chào làm khoản thanh toán — và cho \u003cb>khích lệ người lao động\u003c/b> qua các chương trình cổ phần. \u003cb>Danh tiếng và uy tín\u003c/b> với ngân hàng, khách hàng, nhà cung cấp và cơ quan quản lý. \u003cb>Kỷ luật quản trị\u003c/b>, tuy là một chi phí nhưng cũng là một lợi ích trong việc chuyên nghiệp hóa công ty.\u003c/p>\u003cp>\u003cb>Bất lợi.\u003c/b> \u003cb>Chi phí\u003c/b> của chính đợt chào bán — phí bảo lãnh, pháp lý, kiểm toán và niêm yết — và của tuân thủ liên tục. Nghĩa vụ \u003cb>công bố liên tục\u003c/b>, kể cả các thông tin mà một công ty tư nhân muốn giữ khỏi đối thủ. \u003cb>Áp lực ngắn hạn\u003c/b> từ thị trường và chuyên viên phân tích, có thể làm lệch quyết định khỏi đầu tư dài hạn. \u003cb>Pha loãng\u003c/b> và mất kiểm soát tuyệt đối, với rủi ro trước nhà đầu tư chủ động và \u003cb>thâu tóm\u003c/b>. \u003cb>Trách nhiệm và sự giám sát cá nhân\u003c/b> lớn hơn đối với thành viên hội đồng quản trị. Và gánh nặng rơi không cân xứng lên các công ty nhỏ hơn, khi chi phí tuân thủ cố định chiếm tỷ trọng lớn hơn.\u003c/p>\u003cp>Quyết định do đó tùy thuộc lượng vốn thực sự cần, khả năng chịu đựng công bố và pha loãng của chủ sở hữu, và liệu công ty đã sẵn sàng về vận hành và tổ chức hay chưa.\u003c/p>","rubricVi":"Ít nhất bốn lợi thế (0,7) · ít nhất bốn bất lợi (0,8) · phán đoán kết luận cân bằng về tiêu chí quyết định (0,5)."},{"id":"M2-04","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what venture capital is and why it requires a portfolio approach.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Venture capital\u003c/b> is the financing of early-stage, high-growth companies in \u003cb>staged rounds\u003c/b> — seed, Series A, B, C — in exchange for a \u003cb>minority\u003c/b> equity stake with protective and control rights, and without leverage. The investor supplies not only capital but governance, networks, recruitment and strategic support, and expects to exit within roughly five to ten years through an IPO or trade sale.\u003c/p>\u003cp>\u003cb>Why a portfolio approach is essential.\u003c/b> The return distribution is extremely \u003cb>skewed\u003c/b>. Most early-stage companies fail entirely or return little; a minority return the capital invested; and a very small number produce outcomes many times the investment. Because the failures are frequent and the winners rare, no individual investment can be relied upon — the expected return of any single company is dominated by a low-probability, high-magnitude outcome.\u003c/p>\u003cp>A fund must therefore hold enough investments that the probability of capturing at least one outsized winner becomes high, which is why VC funds typically hold twenty to forty positions. It also explains two characteristic practices: \u003cb>staged financing\u003c/b>, which allows the investor to abandon failing companies cheaply and concentrate follow-on capital on those succeeding, and the acceptance of a high failure rate as a \u003cb>designed feature\u003c/b> of the model rather than evidence of poor selection. Judging a VC fund by the proportion of investments that fail is therefore a category error; it should be judged on the fund-level multiple and IRR.\u003c/p>","rubric":"Definition incl. staged rounds, minority stake, no leverage (0.6) · skewed return distribution requiring diversification (0.7) · staged financing and failure rate as design, with the evaluation implication (0.7).","qVi":"Giải thích đầu tư mạo hiểm là gì và vì sao nó đòi hỏi cách tiếp cận theo danh mục.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Đầu tư mạo hiểm\u003c/b> là việc tài trợ cho các công ty giai đoạn đầu, tăng trưởng cao theo các \u003cb>vòng gọi vốn theo giai đoạn\u003c/b> — hạt giống, Series A, B, C — để đổi lấy cổ phần \u003cb>thiểu số\u003c/b> kèm các quyền bảo vệ và kiểm soát, và không dùng đòn bẩy. Nhà đầu tư cung cấp không chỉ vốn mà cả quản trị, mạng lưới, tuyển dụng và hỗ trợ chiến lược, và kỳ vọng thoái vốn trong khoảng năm đến mười năm qua IPO hoặc bán cho đối tác chiến lược.\u003c/p>\u003cp>\u003cb>Vì sao cách tiếp cận danh mục là thiết yếu.\u003c/b> Phân phối lợi nhuận cực kỳ \u003cb>lệch\u003c/b>. Phần lớn công ty giai đoạn đầu thất bại hoàn toàn hoặc trả về rất ít; một số ít trả về vốn đã đầu tư; và một số rất nhỏ tạo ra kết quả gấp nhiều lần khoản đầu tư. Vì thất bại xảy ra thường xuyên còn người thắng thì hiếm, không thể trông cậy vào bất kỳ khoản đầu tư đơn lẻ nào — lợi nhuận kỳ vọng của bất kỳ công ty đơn lẻ nào bị chi phối bởi một kết quả xác suất thấp, biên độ cao.\u003c/p>\u003cp>Một quỹ do đó phải nắm đủ nhiều khoản đầu tư để xác suất bắt được ít nhất một người thắng lớn trở nên cao, đó là lý do các quỹ mạo hiểm thường nắm hai mươi đến bốn mươi vị thế. Nó cũng giải thích hai thực hành đặc trưng: \u003cb>tài trợ theo giai đoạn\u003c/b>, cho phép nhà đầu tư từ bỏ các công ty thất bại một cách rẻ và tập trung vốn tiếp theo vào các công ty đang thành công, và việc chấp nhận tỷ lệ thất bại cao như một \u003cb>đặc tính có chủ đích\u003c/b> của mô hình chứ không phải bằng chứng của việc lựa chọn kém. Đánh giá một quỹ mạo hiểm theo tỷ lệ khoản đầu tư thất bại do đó là một sai lầm về bản chất; nó nên được đánh giá theo bội số và IRR ở cấp quỹ.\u003c/p>","rubricVi":"Định nghĩa gồm vòng theo giai đoạn, cổ phần thiểu số, không đòn bẩy (0,6) · phân phối lợi nhuận lệch đòi hỏi đa dạng hóa (0,7) · tài trợ theo giai đoạn và tỷ lệ thất bại như thiết kế, với hàm ý đánh giá (0,7)."},{"id":"M2-05","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what determines whether an issuer chooses equity or debt to raise capital.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The choice turns on several considerations.\u003c/p>\u003cp>\u003cb>Cost and tax.\u003c/b> Debt is cheaper because it is senior and less risky to the investor, and its interest is \u003cb>tax-deductible\u003c/b>, whereas dividends are not. This favours debt where the issuer has taxable profits to shelter.\u003c/p>\u003cp>\u003cb>Financial risk and capacity.\u003c/b> Debt creates \u003cb>fixed obligations\u003c/b>. A company with volatile cash flows, high operating leverage or heavy capital expenditure has limited capacity to bear them; a stable, cash-generative business has more. Existing leverage, covenant headroom and rating targets constrain how much further debt is available.\u003c/p>\u003cp>\u003cb>Dilution and control.\u003c/b> Equity dilutes existing shareholders' ownership, earnings per share and voting control — a decisive consideration for a family or founder-controlled company. Debt does not.\u003c/p>\u003cp>\u003cb>Signalling.\u003c/b> Under \u003cb>pecking-order\u003c/b> reasoning, issuing equity signals that management may consider the shares overvalued, so equity issues often meet a negative share-price reaction; debt issuance carries no such signal. Firms therefore prefer internal funds first, then debt, and issue equity last.\u003c/p>\u003cp>\u003cb>Purpose and market conditions.\u003c/b> Long-lived, tangible assets suit debt with matched maturity; uncertain, intangible or growth investment suits equity, which requires no fixed servicing. Finally, the practical question of which market is \u003cb>open\u003c/b> and on what terms often determines timing.\u003c/p>","rubric":"Tax shield and relative cost (0.5) · cash-flow capacity and existing leverage (0.5) · dilution and control (0.4) · pecking-order signalling (0.3) · asset-matching or market conditions (0.3).","qVi":"Giải thích điều gì quyết định việc một tổ chức phát hành chọn vốn chủ hay nợ để huy động vốn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Lựa chọn tùy thuộc vào nhiều cân nhắc.\u003c/p>\u003cp>\u003cb>Chi phí và thuế.\u003c/b> Nợ rẻ hơn vì có thứ tự ưu tiên cao và ít rủi ro hơn cho nhà đầu tư, và lãi của nó được \u003cb>khấu trừ thuế\u003c/b>, còn cổ tức thì không. Điều này thiên về nợ khi tổ chức phát hành có lợi nhuận chịu thuế để che chắn.\u003c/p>\u003cp>\u003cb>Rủi ro tài chính và năng lực.\u003c/b> Nợ tạo ra \u003cb>nghĩa vụ cố định\u003c/b>. Một công ty có dòng tiền biến động, đòn bẩy hoạt động cao hoặc chi tiêu vốn nặng có năng lực gánh nợ hạn chế; một doanh nghiệp ổn định, sinh dòng tiền thì nhiều hơn. Đòn bẩy hiện có, dư địa điều khoản ràng buộc và mục tiêu xếp hạng ràng buộc lượng nợ có thể vay thêm.\u003c/p>\u003cp>\u003cb>Pha loãng và kiểm soát.\u003c/b> Vốn chủ pha loãng sở hữu, lợi nhuận trên mỗi cổ phần và quyền biểu quyết của cổ đông hiện hữu — một cân nhắc quyết định với công ty do gia đình hoặc nhà sáng lập kiểm soát. Nợ thì không.\u003c/p>\u003cp>\u003cb>Phát tín hiệu.\u003c/b> Theo lập luận \u003cb>trật tự phân hạng (pecking order)\u003c/b>, phát hành vốn chủ phát tín hiệu rằng ban điều hành có thể coi cổ phần đang bị định giá cao, nên phát hành vốn chủ thường gặp phản ứng giá tiêu cực; phát hành nợ không mang tín hiệu đó. Doanh nghiệp do đó ưu tiên vốn nội bộ trước, rồi đến nợ, và phát hành vốn chủ cuối cùng.\u003c/p>\u003cp>\u003cb>Mục đích và điều kiện thị trường.\u003c/b> Tài sản dài hạn, hữu hình phù hợp với nợ có kỳ hạn khớp; đầu tư bất định, vô hình hoặc tăng trưởng phù hợp với vốn chủ vốn không đòi hỏi trả nợ cố định. Cuối cùng, câu hỏi thực tế thị trường nào đang \u003cb>mở\u003c/b> và với điều kiện gì thường quyết định thời điểm.\u003c/p>","rubricVi":"Lá chắn thuế và chi phí tương đối (0,5) · năng lực dòng tiền và đòn bẩy hiện có (0,5) · pha loãng và kiểm soát (0,4) · tín hiệu trật tự phân hạng (0,3) · khớp tài sản hoặc điều kiện thị trường (0,3)."},{"id":"M2-06","ch":2,"type":"case","clo":"CLO1","marks":3,"exam":"final","q":"An underwriter's book is only 70% covered two days before pricing. Analyse the options and their consequences for each party.","guide":"\u003cp>\u003cb>Model answer — the problem.\u003c/b> An undersubscribed book means demand at the marketed price range is insufficient. Proceeding unchanged would leave the underwriter holding unsold stock (under a firm commitment) and would almost certainly produce a weak aftermarket, damaging the issuer's reputation and every investor allocated.\u003c/p>\u003cp>\u003cb>Options and consequences.\u003c/b>\u003c/p>\u003cp>(1) \u003cb>Reduce the price\u003c/b>, pricing below or at the bottom of the range. \u003ci>Issuer:\u003c/i> raises less capital and accepts a lower valuation, which also sets a low reference for future issuance. \u003ci>Investors:\u003c/i> better entry price, so demand should firm. \u003ci>Underwriter:\u003c/i> smaller fee but materially reduced placement risk. This is the most common response.\u003c/p>\u003cp>(2) \u003cb>Reduce the size\u003c/b> of the offering, selling fewer shares at the intended price. \u003ci>Issuer:\u003c/i> preserves the valuation but raises less than planned, which may not fund its stated use of proceeds — a problem if the prospectus specified an investment programme. \u003ci>Underwriter:\u003c/i> risk reduced; the smaller free float may impair aftermarket liquidity.\u003c/p>\u003cp>(3) \u003cb>Combine\u003c/b> a modest price reduction with a modest size reduction — often the practical compromise.\u003c/p>\u003cp>(4) \u003cb>Postpone\u003c/b> the offering. \u003ci>Issuer:\u003c/i> avoids a bad price but incurs wasted cost, signals weakness to the market, and must refresh its financial disclosure before returning. \u003ci>Underwriter:\u003c/i> avoids loss but earns nothing after substantial work.\u003c/p>\u003cp>(5) \u003cb>Proceed unchanged.\u003c/b> Rarely defensible: the underwriter absorbs the shortfall and then sells into the market, depressing the price and harming allocated investors — reputationally damaging to both bank and issuer.\u003c/p>\u003cp>\u003cb>Judgement.\u003c/b> The correct course depends on whether the shortfall reflects \u003cb>price\u003c/b> or \u003cb>market conditions\u003c/b>. If investors like the company but not the valuation, reprice. If the whole market is closed, postpone. The underwriter's duty is to give the issuer an honest reading of the book, even though a completed deal earns a fee and a postponed one does not — a genuine conflict, since the bank is paid on completion.\u003c/p>","rubric":"Problem correctly framed (0.4) · at least four options (1.0) · consequences traced for issuer, investors and underwriter (1.0) · reasoned judgement incl. the completion-fee conflict (0.6).","qVi":"Sổ lệnh của một nhà bảo lãnh chỉ được bao phủ 70% hai ngày trước khi định giá. Phân tích các phương án và hệ quả của chúng đối với mỗi bên.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — vấn đề.\u003c/b> Một sổ lệnh không được đăng ký đủ nghĩa là nhu cầu ở khoảng giá đã tiếp thị là không đủ. Tiến hành không thay đổi sẽ để nhà bảo lãnh giữ cổ phần không bán được (theo cam kết chắc chắn) và gần như chắc chắn tạo ra một thị trường thứ cấp yếu, làm tổn hại danh tiếng của tổ chức phát hành và mọi nhà đầu tư được phân bổ.\u003c/p>\u003cp>\u003cb>Các phương án và hệ quả.\u003c/b>\u003c/p>\u003cp>(1) \u003cb>Giảm giá\u003c/b>, định giá dưới hoặc ở đáy khoảng. \u003ci>Tổ chức phát hành:\u003c/i> huy động được ít vốn hơn và chấp nhận định giá thấp hơn, cũng đặt một tham chiếu thấp cho các đợt phát hành tương lai. \u003ci>Nhà đầu tư:\u003c/i> giá vào tốt hơn, nên nhu cầu sẽ vững lên. \u003ci>Nhà bảo lãnh:\u003c/i> phí nhỏ hơn nhưng rủi ro phân phối giảm đáng kể. Đây là phản ứng phổ biến nhất.\u003c/p>\u003cp>(2) \u003cb>Giảm quy mô\u003c/b> đợt chào bán, bán ít cổ phần hơn ở mức giá dự kiến. \u003ci>Tổ chức phát hành:\u003c/i> bảo toàn định giá nhưng huy động được ít hơn kế hoạch, điều này có thể không tài trợ đủ mục đích sử dụng vốn đã nêu — một vấn đề nếu bản cáo bạch đã nêu một chương trình đầu tư. \u003ci>Nhà bảo lãnh:\u003c/i> rủi ro giảm; lượng cổ phần tự do lưu hành nhỏ hơn có thể làm suy yếu thanh khoản thị trường thứ cấp.\u003c/p>\u003cp>(3) \u003cb>Kết hợp\u003c/b> giảm giá vừa phải với giảm quy mô vừa phải — thường là giải pháp dung hòa thực tế.\u003c/p>\u003cp>(4) \u003cb>Hoãn\u003c/b> đợt chào bán. \u003ci>Tổ chức phát hành:\u003c/i> tránh một mức giá tồi nhưng chịu chi phí lãng phí, phát tín hiệu yếu ra thị trường, và phải làm mới công bố tài chính trước khi quay lại. \u003ci>Nhà bảo lãnh:\u003c/i> tránh lỗ nhưng không thu được gì sau nhiều công sức.\u003c/p>\u003cp>(5) \u003cb>Tiến hành không thay đổi.\u003c/b> Hiếm khi bào chữa được: nhà bảo lãnh hấp thụ phần thiếu rồi bán ra thị trường, làm giá sụt và tổn hại các nhà đầu tư được phân bổ — gây tổn hại danh tiếng cho cả ngân hàng lẫn tổ chức phát hành.\u003c/p>\u003cp>\u003cb>Phán đoán.\u003c/b> Hướng đúng tùy thuộc phần thiếu phản ánh \u003cb>giá\u003c/b> hay \u003cb>điều kiện thị trường\u003c/b>. Nếu nhà đầu tư thích công ty nhưng không thích định giá, hãy định giá lại. Nếu cả thị trường đóng cửa, hãy hoãn. Nghĩa vụ của nhà bảo lãnh là cho tổ chức phát hành một cách đọc sổ lệnh trung thực, dù một thương vụ hoàn tất có phí còn một thương vụ hoãn thì không — một xung đột thực sự, vì ngân hàng được trả khi hoàn tất.\u003c/p>","rubricVi":"Khung hóa đúng vấn đề (0,4) · ít nhất bốn phương án (1,0) · truy hệ quả cho tổ chức phát hành, nhà đầu tư và nhà bảo lãnh (1,0) · phán đoán có lập luận gồm xung đột về phí hoàn tất (0,6)."},{"id":"M3-01","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the difference between a strategic buyer and a financial buyer in an M&A auction.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>strategic buyer\u003c/b> is an operating company, usually in the same or an adjacent industry. Its motive is \u003cb>industrial\u003c/b>: it acquires to realise \u003cb>synergies\u003c/b> — removing duplicated costs, gaining market access, securing supply or acquiring technology. It generally intends to hold indefinitely and to integrate the target into its own operations.\u003c/p>\u003cp>A \u003cb>financial buyer\u003c/b> is a private-equity sponsor. Its motive is \u003cb>financial return\u003c/b> over a defined horizon of roughly three to seven years. It has no operations to combine with the target, so it cannot capture synergies; its returns come from \u003cb>leverage and deleveraging\u003c/b>, operational improvement, and exit multiple.\u003c/p>\u003cp>\u003cb>Consequences for the auction.\u003c/b> Strategic buyers can usually \u003cb>pay more\u003c/b>, because synergies are value only they can realise, and they are less constrained by financing markets. Financial buyers are disciplined by the arithmetic of their required IRR and by what lenders will advance, so their price is effectively capped by the debt market.\u003c/p>\u003cp>But strategic buyers bring drawbacks for the seller: they are competitors, so sharing sensitive information in diligence is dangerous if the deal fails; they may face \u003cb>competition clearance\u003c/b> risk and longer timetables; and integration may mean job losses, which matters where management or the State is the seller. Financial buyers typically offer \u003cb>speed, certainty and confidentiality\u003c/b>, and often retain management. A well-run process therefore runs both types in parallel, managing information carefully and using the tension between them.\u003c/p>","rubric":"Both types correctly characterised by motive and horizon (0.8) · synergy capacity explaining higher strategic pricing and the debt-market cap on sponsors (0.6) · at least two offsetting considerations (0.6).","qVi":"Giải thích sự khác biệt giữa người mua chiến lược và người mua tài chính trong một cuộc đấu giá M&A.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Người mua chiến lược\u003c/b> là một công ty hoạt động, thường trong cùng ngành hoặc ngành lân cận. Động cơ của họ mang tính \u003cb>công nghiệp\u003c/b>: họ mua để hiện thực hóa \u003cb>cộng hưởng\u003c/b> — loại bỏ chi phí trùng lặp, giành khả năng tiếp cận thị trường, bảo đảm nguồn cung hoặc thâu tóm công nghệ. Họ thường có ý định nắm giữ vô thời hạn và hợp nhất công ty mục tiêu vào hoạt động của chính mình.\u003c/p>\u003cp>\u003cb>Người mua tài chính\u003c/b> là một nhà tài trợ vốn cổ phần tư nhân. Động cơ của họ là \u003cb>lợi nhuận tài chính\u003c/b> trong một chân trời xác định khoảng ba đến bảy năm. Họ không có hoạt động để kết hợp với công ty mục tiêu, nên không thể nắm bắt cộng hưởng; lợi nhuận của họ đến từ \u003cb>đòn bẩy và việc giảm đòn bẩy\u003c/b>, cải thiện vận hành, và bội số lúc thoái vốn.\u003c/p>\u003cp>\u003cb>Hệ quả với cuộc đấu giá.\u003c/b> Người mua chiến lược thường có thể \u003cb>trả cao hơn\u003c/b>, vì cộng hưởng là giá trị chỉ họ mới hiện thực hóa được, và họ ít bị ràng buộc bởi thị trường tài trợ. Người mua tài chính bị kỷ luật bởi phép tính IRR yêu cầu của họ và bởi mức bên cho vay sẵn sàng cấp, nên mức giá của họ thực tế bị chặn trên bởi thị trường nợ.\u003c/p>\u003cp>Nhưng người mua chiến lược mang lại những bất lợi cho bên bán: họ là đối thủ, nên chia sẻ thông tin nhạy cảm trong thẩm định là nguy hiểm nếu thương vụ đổ bể; họ có thể đối mặt rủi ro \u003cb>chấp thuận về cạnh tranh\u003c/b> và thời gian dài hơn; và việc hợp nhất có thể đồng nghĩa với mất việc làm, điều này quan trọng khi bên bán là ban điều hành hoặc Nhà nước. Người mua tài chính thường mang lại \u003cb>tốc độ, sự chắc chắn và bảo mật\u003c/b>, và thường giữ lại ban điều hành. Một quy trình được điều hành tốt do đó chạy song song cả hai loại, quản lý thông tin cẩn thận và tận dụng sức ép giữa họ.\u003c/p>","rubricVi":"Đặc trưng đúng cả hai loại theo động cơ và chân trời (0,8) · năng lực cộng hưởng giải thích mức giá cao hơn của bên chiến lược và trần thị trường nợ với nhà tài trợ (0,6) · ít nhất hai cân nhắc đối trọng (0,6)."},{"id":"M3-02","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain what a teaser and a Confidential Information Memorandum are, and why they are separate documents.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>teaser\u003c/b> is a short document, usually one or two pages, circulated to potential buyers at the start of a sell-side process. It is \u003cb>anonymous\u003c/b> — it describes the business generically ('a leading Vietnamese consumer goods manufacturer with revenue of approximately VND 1,500 billion') without naming it. Its purpose is to generate interest and identify which parties are worth engaging.\u003c/p>\u003cp>The \u003cb>Confidential Information Memorandum (CIM)\u003c/b> is the substantive marketing document, typically fifty to a hundred pages, released only after a recipient has signed a \u003cb>non-disclosure agreement\u003c/b>. It identifies the company and describes its history, products, markets, competitive position, management, operations and detailed historical and projected financials.\u003c/p>\u003cp>\u003cb>Why they are separate.\u003c/b> The separation implements a \u003cb>staged disclosure\u003c/b> principle. At the outset the seller does not know who is genuinely interested, and revealing that the business is for sale is itself damaging: employees may leave, customers and suppliers may reconsider, and competitors gain intelligence. The anonymous teaser tests interest at minimal cost. Only parties who declare interest and accept binding confidentiality obligations receive identifying and commercially sensitive information. Information is then released progressively — CIM, then management presentations, then the data room — with the most sensitive material withheld until late, particularly from competitors.\u003c/p>","rubric":"Teaser described incl. anonymity and purpose (0.6) · CIM described incl. NDA gate and contents (0.6) · staged-disclosure rationale with the specific harms of premature disclosure (0.8).","qVi":"Giải thích bản teaser và Bản ghi nhớ Thông tin Bảo mật (CIM) là gì, và vì sao chúng là hai tài liệu tách biệt.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Teaser\u003c/b> là một tài liệu ngắn, thường một hoặc hai trang, được lưu hành tới những người mua tiềm năng khi bắt đầu một quy trình bên bán. Nó \u003cb>ẩn danh\u003c/b> — mô tả doanh nghiệp một cách khái quát ('một nhà sản xuất hàng tiêu dùng hàng đầu Việt Nam với doanh thu khoảng 1.500 tỷ đồng') mà không nêu tên. Mục đích là tạo sự quan tâm và nhận diện bên nào đáng để tiếp xúc.\u003c/p>\u003cp>\u003cb>Bản ghi nhớ Thông tin Bảo mật (CIM)\u003c/b> là tài liệu tiếp thị thực chất, thường năm mươi đến một trăm trang, chỉ được phát hành sau khi người nhận đã ký một \u003cb>thỏa thuận bảo mật\u003c/b>. Nó nêu danh tính công ty và mô tả lịch sử, sản phẩm, thị trường, vị thế cạnh tranh, ban điều hành, hoạt động cùng số liệu tài chính lịch sử và dự phóng chi tiết.\u003c/p>\u003cp>\u003cb>Vì sao chúng tách biệt.\u003c/b> Sự tách biệt hiện thực hóa nguyên tắc \u003cb>công bố theo giai đoạn\u003c/b>. Ở thời điểm đầu, bên bán chưa biết ai thực sự quan tâm, và việc tiết lộ rằng doanh nghiệp đang được rao bán tự nó đã gây hại: nhân viên có thể ra đi, khách hàng và nhà cung cấp có thể cân nhắc lại, và đối thủ thu được thông tin tình báo. Bản teaser ẩn danh kiểm tra mức quan tâm với chi phí tối thiểu. Chỉ những bên bày tỏ quan tâm và chấp nhận nghĩa vụ bảo mật ràng buộc mới nhận được thông tin định danh và nhạy cảm về thương mại. Thông tin sau đó được phát hành dần — CIM, rồi thuyết trình của ban điều hành, rồi phòng dữ liệu — với tài liệu nhạy cảm nhất được giữ lại tới giai đoạn muộn, đặc biệt với đối thủ.\u003c/p>","rubricVi":"Mô tả teaser gồm tính ẩn danh và mục đích (0,6) · mô tả CIM gồm chốt chặn NDA và nội dung (0,6) · lý do công bố theo giai đoạn với các tổn hại cụ thể của việc công bố sớm (0,8)."},{"id":"M3-03","ch":3,"type":"calc-essay","clo":"CLO1","marks":3,"exam":"midterm","q":"Acquirer P has EPS VND 4,500, 120m shares, price VND 72,000. Target Q has net income VND 216bn, 90m shares, unaffected price VND 18,000. P offers a 33% premium, 70% in shares and 30% in cash at 5.5% after-tax cost. Synergies after tax are VND 45bn. Compute pro forma EPS and accretion, and state the breakeven synergy level.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Offer price = 18,000 × 1.33 = \u003cb>VND 23,940\u003c/b>.\u003cbr>Equity purchase price = 23,940 × 90m = \u003cb>VND 2,154.6bn\u003c/b>.\u003c/p>\u003cp>Share consideration = 70% × 2,154.6 = VND 1,508.22bn → new shares = 1,508.22bn ÷ 72,000 = \u003cb>20.947m\u003c/b>.\u003cbr>Cash consideration = 30% × 2,154.6 = VND 646.38bn → after-tax interest = 5.5% × 646.38 = \u003cb>VND 35.55bn\u003c/b>.\u003c/p>\u003cp>P's net income = 4,500 × 120m = \u003cb>VND 540bn\u003c/b>.\u003cbr>Pro forma net income = 540 + 216 + 45 − 35.55 = \u003cb>VND 765.45bn\u003c/b>.\u003cbr>Pro forma shares = 120 + 20.947 = \u003cb>140.947m\u003c/b>.\u003cbr>Pro forma EPS = 765.45bn ÷ 140.947m = \u003cb>VND 5,431\u003c/b>.\u003cbr>Accretion = 5,431 ÷ 4,500 − 1 = \u003cb>+20.7% accretive\u003c/b>.\u003c/p>\u003cp>\u003cb>Breakeven synergies.\u003c/b> For EPS to be unchanged at VND 4,500, pro forma net income must equal 4,500 × 140.947m = \u003cb>VND 634.26bn\u003c/b>.\u003cbr>Required synergies = 634.26 − 540 − 216 + 35.55 = \u003cb>−VND 86.19bn\u003c/b>.\u003c/p>\u003cp>The breakeven is \u003cb>negative\u003c/b>, meaning the transaction is accretive even with \u003cb>zero\u003c/b> synergies — indeed it would tolerate VND 86bn of negative synergies before diluting. The reason is visible in the multiples: P trades at 72,000 ÷ 4,500 = \u003cb>16.0×\u003c/b> earnings while paying 2,154.6 ÷ 216 = \u003cb>10.0×\u003c/b> for Q. Issuing shares valued at 16× to buy earnings costing 10× is accretive on arithmetic alone. The caution remains that accretion is not value creation: whether the 33% premium is justified depends on the present value of the synergies, not on the EPS outcome.\u003c/p>","rubric":"Offer price and purchase value (0.5) · new shares and interest (0.6) · pro forma NI, shares, EPS (0.8) · accretion (0.3) · breakeven synergy computed and correctly interpreted as negative (0.5) · P/E explanation and accretion≠value caveat (0.3).","qVi":"Bên thâu tóm P có EPS 4.500 đồng, 120 triệu cổ phần, giá 72.000 đồng. Công ty mục tiêu Q có lợi nhuận ròng 216 tỷ đồng, 90 triệu cổ phần, giá chưa bị ảnh hưởng 18.000 đồng. P chào mức thặng dư 33%, 70% bằng cổ phần và 30% bằng tiền mặt với chi phí 5,5% sau thuế. Cộng hưởng sau thuế là 45 tỷ đồng. Tính EPS hợp nhất và mức tăng lãi, và nêu mức cộng hưởng hòa vốn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Giá chào mua = 18.000 × 1,33 = \u003cb>23.940 đồng\u003c/b>.\u003cbr>Giá mua vốn chủ = 23.940 × 90 triệu = \u003cb>2.154,6 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Thanh toán bằng cổ phần = 70% × 2.154,6 = 1.508,22 tỷ → cổ phần mới = 1.508,22 tỷ ÷ 72.000 = \u003cb>20,947 triệu\u003c/b>.\u003cbr>Thanh toán bằng tiền mặt = 30% × 2.154,6 = 646,38 tỷ → lãi vay sau thuế = 5,5% × 646,38 = \u003cb>35,55 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Lợi nhuận ròng của P = 4.500 × 120 triệu = \u003cb>540 tỷ đồng\u003c/b>.\u003cbr>Lợi nhuận ròng hợp nhất = 540 + 216 + 45 − 35,55 = \u003cb>765,45 tỷ đồng\u003c/b>.\u003cbr>Cổ phần hợp nhất = 120 + 20,947 = \u003cb>140,947 triệu\u003c/b>.\u003cbr>EPS hợp nhất = 765,45 tỷ ÷ 140,947 triệu = \u003cb>5.431 đồng\u003c/b>.\u003cbr>Mức tăng lãi = 5.431 ÷ 4.500 − 1 = \u003cb>+20,7% tăng lãi\u003c/b>.\u003c/p>\u003cp>\u003cb>Cộng hưởng hòa vốn.\u003c/b> Để EPS không đổi ở 4.500 đồng, lợi nhuận ròng hợp nhất phải bằng 4.500 × 140,947 triệu = \u003cb>634,26 tỷ đồng\u003c/b>.\u003cbr>Cộng hưởng cần thiết = 634,26 − 540 − 216 + 35,55 = \u003cb>−86,19 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Mức hòa vốn là \u003cb>âm\u003c/b>, nghĩa là giao dịch vẫn tăng lãi ngay cả khi cộng hưởng bằng \u003cb>không\u003c/b> — thực tế nó chịu được tới 86 tỷ đồng cộng hưởng âm trước khi làm giảm lãi. Lý do hiện rõ trong các bội số: P giao dịch ở 72.000 ÷ 4.500 = \u003cb>16,0×\u003c/b> lợi nhuận trong khi trả 2.154,6 ÷ 216 = \u003cb>10,0×\u003c/b> cho Q. Phát hành cổ phần được định giá 16× để mua lợi nhuận có giá 10× là tăng lãi thuần túy về số học. Điểm cần cẩn trọng vẫn là tăng lãi không phải tạo giá trị: việc mức thặng dư 33% có chính đáng hay không phụ thuộc vào giá trị hiện tại của các cộng hưởng, chứ không phải vào kết quả EPS.\u003c/p>","rubricVi":"Giá chào mua và giá trị mua lại (0,5) · cổ phần mới và lãi vay (0,6) · lợi nhuận ròng, cổ phần, EPS hợp nhất (0,8) · mức tăng lãi (0,3) · cộng hưởng hòa vốn được tính và diễn giải đúng là âm (0,5) · giải thích P/E và lưu ý tăng lãi ≠ giá trị (0,3)."},{"id":"M3-04","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the role of the investment bank on each side of an M&A transaction.","guide":"\u003cp>\u003cb>Model answer — sell-side.\u003c/b> The bank's objective is to maximise price and certainty for the seller. It prepares the business for sale and advises on readiness and timing; performs the \u003cb>valuation\u003c/b> and sets expectations; designs the \u003cb>process\u003c/b>, choosing between a broad auction and a targeted approach; prepares the teaser and CIM; identifies and approaches the buyer universe; manages the data room and due-diligence process; evaluates and compares bids on price, certainty, financing and conditionality; runs the negotiation to preserve \u003cb>competitive tension\u003c/b>; and supports signing and closing. It may also provide a \u003cb>fairness opinion\u003c/b> to the board.\u003c/p>\u003cp>\u003cb>Buy-side.\u003c/b> The bank's objective is to secure the target on the best terms and with acceptable risk. It helps define acquisition criteria and \u003cb>screens targets\u003c/b>; makes the approach; values the target standalone and with \u003cb>synergies\u003c/b>; coordinates the due-diligence workstreams; advises on \u003cb>structure\u003c/b> — share versus asset purchase, consideration mix — and arranges or advises on \u003cb>financing\u003c/b>; models \u003cb>accretion/dilution\u003c/b> and pro forma leverage; conducts the negotiation; and supports regulatory clearance and integration planning.\u003c/p>\u003cp>\u003cb>Common to both:\u003c/b> the bank supplies valuation expertise, process management, market intelligence, negotiating experience and — importantly — an intermediary who can explore positions without the principals losing face. Fees are typically a \u003cb>success fee\u003c/b> contingent on completion, sometimes with a retainer, which itself creates an incentive toward completion that the adviser must manage honestly.\u003c/p>","rubric":"At least five sell-side activities (0.7) · at least five buy-side activities (0.7) · common contributions and the success-fee incentive (0.6).","qVi":"Giải thích vai trò của ngân hàng đầu tư ở mỗi phía của một giao dịch M&A.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — bên bán.\u003c/b> Mục tiêu của ngân hàng là tối đa hóa giá và sự chắc chắn cho bên bán. Ngân hàng chuẩn bị doanh nghiệp để bán và tư vấn về mức độ sẵn sàng cùng thời điểm; thực hiện \u003cb>định giá\u003c/b> và thiết lập kỳ vọng; thiết kế \u003cb>quy trình\u003c/b>, lựa chọn giữa đấu giá rộng và tiếp cận có mục tiêu; chuẩn bị teaser và CIM; nhận diện và tiếp cận nhóm người mua; quản lý phòng dữ liệu và quá trình thẩm định; đánh giá và so sánh các chào giá về giá, sự chắc chắn, nguồn tài trợ và tính điều kiện; điều hành thương lượng để giữ \u003cb>sức ép cạnh tranh\u003c/b>; và hỗ trợ ký kết cùng hoàn tất. Ngân hàng cũng có thể cung cấp một \u003cb>ý kiến về tính công bằng\u003c/b> cho hội đồng quản trị.\u003c/p>\u003cp>\u003cb>Bên mua.\u003c/b> Mục tiêu của ngân hàng là giành được công ty mục tiêu với điều khoản tốt nhất và rủi ro chấp nhận được. Ngân hàng giúp xác định tiêu chí thâu tóm và \u003cb>sàng lọc mục tiêu\u003c/b>; thực hiện việc tiếp cận; định giá công ty mục tiêu độc lập và cộng \u003cb>cộng hưởng\u003c/b>; điều phối các luồng công việc thẩm định; tư vấn về \u003cb>cấu trúc\u003c/b> — mua cổ phần hay mua tài sản, cơ cấu thanh toán — và thu xếp hoặc tư vấn về \u003cb>tài trợ\u003c/b>; mô hình hóa \u003cb>tăng/giảm lãi\u003c/b> và đòn bẩy hợp nhất; tiến hành thương lượng; và hỗ trợ xin chấp thuận của cơ quan quản lý cùng lập kế hoạch hợp nhất.\u003c/p>\u003cp>\u003cb>Điểm chung của cả hai:\u003c/b> ngân hàng cung cấp chuyên môn định giá, quản lý quy trình, thông tin thị trường, kinh nghiệm thương lượng và — quan trọng — một trung gian có thể thăm dò lập trường mà các bên chính không mất thể diện. Phí thường là \u003cb>phí thành công\u003c/b> phụ thuộc vào việc hoàn tất, đôi khi kèm một khoản phí giữ chỗ, điều này tự nó tạo động cơ hướng tới việc hoàn tất mà nhà tư vấn phải quản lý một cách trung thực.\u003c/p>","rubricVi":"Ít nhất năm hoạt động bên bán (0,7) · ít nhất năm hoạt động bên mua (0,7) · đóng góp chung và động cơ phí thành công (0,6)."},{"id":"M3-05","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the main problems that cause post-merger integration to fail and how they can be mitigated.","guide":"\u003cp>\u003cb>Model answer — problems.\u003c/b> (1) \u003cb>Culture clash\u003c/b> — incompatible norms, decision-making styles and expectations, which in people-dependent businesses drives the departure of exactly the staff whose capability was being acquired. (2) \u003cb>Loss of key personnel\u003c/b>, often to competitors, taking client relationships with them. (3) \u003cb>Systems and data incompatibility\u003c/b>, where migration proves far longer and costlier than assumed, disrupting service. (4) \u003cb>Customer disruption\u003c/b> — uncertainty during integration invites competitors to approach the combined entity's customers. (5) \u003cb>Unclear governance\u003c/b> — ambiguity about who decides what, producing paralysis. (6) \u003cb>Synergy targets without ownership\u003c/b>, announced to the market but assigned to no one accountable. (7) \u003cb>Management distraction\u003c/b> from running the underlying businesses.\u003c/p>\u003cp>\u003cb>Mitigation.\u003c/b> Begin integration planning \u003cb>before signing\u003c/b>, not after closing. Establish \u003cb>Day-1 readiness\u003c/b> so that customers, staff and systems experience continuity from the first day. Put \u003cb>retention packages\u003c/b> and clear roles in place for identified key staff, communicated early. Define \u003cb>governance and reporting lines\u003c/b> immediately, so decision rights are unambiguous. Create a \u003cb>synergy tracker\u003c/b> assigning each target a value, a named owner and a deadline, reported regularly to a steering committee. Communicate actively and honestly with customers, suppliers and employees. Address culture explicitly rather than assuming it will resolve itself. And realistically resource the integration, recognising that costs to achieve are substantial and must have been deducted when the premium was justified.\u003c/p>","rubric":"At least four failure causes (0.8) · at least four mitigations (0.8) · pre-signing planning and the synergy-tracker discipline (0.4).","qVi":"Giải thích các vấn đề chính khiến việc hợp nhất sau sáp nhập thất bại và cách khắc phục chúng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các vấn đề.\u003c/b> (1) \u003cb>Xung đột văn hóa\u003c/b> — chuẩn mực, phong cách ra quyết định và kỳ vọng không tương thích, điều này trong các doanh nghiệp phụ thuộc con người đẩy đi đúng những nhân sự có năng lực mà thương vụ nhắm tới. (2) \u003cb>Mất nhân sự chủ chốt\u003c/b>, thường sang đối thủ, mang theo quan hệ khách hàng. (3) \u003cb>Hệ thống và dữ liệu không tương thích\u003c/b>, khi việc chuyển đổi hóa ra lâu và tốn kém hơn nhiều so với giả định, gây gián đoạn dịch vụ. (4) \u003cb>Gián đoạn khách hàng\u003c/b> — sự bất định trong quá trình hợp nhất mời gọi đối thủ tiếp cận khách hàng của thực thể hợp nhất. (5) \u003cb>Quản trị không rõ ràng\u003c/b> — mơ hồ về việc ai quyết định điều gì, gây tê liệt. (6) \u003cb>Mục tiêu cộng hưởng không có người chịu trách nhiệm\u003c/b>, được công bố ra thị trường nhưng không giao cho ai chịu trách nhiệm. (7) \u003cb>Ban điều hành bị phân tán\u003c/b> khỏi việc điều hành các doanh nghiệp nền tảng.\u003c/p>\u003cp>\u003cb>Khắc phục.\u003c/b> Bắt đầu lập kế hoạch hợp nhất \u003cb>trước khi ký\u003c/b>, không phải sau khi hoàn tất. Thiết lập \u003cb>sự sẵn sàng cho Ngày 1\u003c/b> để khách hàng, nhân viên và hệ thống trải nghiệm sự liên tục ngay từ ngày đầu. Đặt \u003cb>gói giữ chân\u003c/b> và vai trò rõ ràng cho nhân sự chủ chốt đã được nhận diện, truyền đạt sớm. Xác định \u003cb>quản trị và tuyến báo cáo\u003c/b> ngay lập tức, để quyền quyết định không mơ hồ. Lập một \u003cb>bảng theo dõi cộng hưởng\u003c/b> gán cho mỗi mục tiêu một giá trị, một người chịu trách nhiệm có tên và một hạn chót, báo cáo định kỳ lên ban chỉ đạo. Trao đổi chủ động và trung thực với khách hàng, nhà cung cấp và người lao động. Xử lý vấn đề văn hóa một cách tường minh thay vì cho rằng nó tự giải quyết. Và bố trí nguồn lực thực tế cho việc hợp nhất, nhận thức rằng chi phí để đạt được là đáng kể và lẽ ra đã phải được trừ đi khi biện minh cho mức thặng dư.\u003c/p>","rubricVi":"Ít nhất bốn nguyên nhân thất bại (0,8) · ít nhất bốn biện pháp khắc phục (0,8) · lập kế hoạch trước khi ký và kỷ luật bảng theo dõi cộng hưởng (0,4)."},{"id":"M3-06","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what a fairness opinion is, what it does and does not say, and why boards obtain one.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>fairness opinion\u003c/b> is a written opinion from a financial adviser stating that the consideration to be paid or received in a transaction is \u003cb>fair, from a financial point of view\u003c/b>, to a specified party — usually the target's shareholders. It is supported by the adviser's valuation analysis across the standard methodologies, and it is normally delivered to the board at the meeting at which the transaction is approved.\u003c/p>\u003cp>\u003cb>What it does not say.\u003c/b> It does \u003cb>not\u003c/b> say the transaction is a good idea, that it is the best available alternative, or that a higher price could not have been obtained. It does not opine on the strategic merits, on the likelihood of realising synergies, on the allocation of consideration among classes of shareholder, or on how any individual shareholder should vote. It addresses only whether the \u003cb>financial terms\u003c/b> fall within a range the adviser considers fair, at a point in time and on stated assumptions.\u003c/p>\u003cp>\u003cb>Why boards obtain one.\u003c/b> Directors owe fiduciary duties, and in a change-of-control transaction their decision will be scrutinised and may be litigated. A fairness opinion evidences that the board \u003cb>informed itself\u003c/b> by obtaining independent professional advice before deciding — supporting the discharge of the duty of care. It is therefore as much a governance and litigation-protection instrument as a valuation one.\u003c/p>\u003cp>The recognised weakness is that the adviser giving the opinion is frequently also earning a \u003cb>success fee\u003c/b> on completion, creating an incentive to find the terms fair. Better practice is to obtain the opinion from an \u003cb>independent\u003c/b> adviser not receiving a contingent fee.\u003c/p>","rubric":"Correct definition incl. 'from a financial point of view' (0.5) · at least three things it does not address (0.6) · fiduciary/litigation rationale (0.5) · contingent-fee conflict and the independent-adviser remedy (0.4).","qVi":"Giải thích ý kiến về tính công bằng (fairness opinion) là gì, nó nói và không nói điều gì, và vì sao hội đồng quản trị lấy nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Ý kiến về tính công bằng\u003c/b> là một ý kiến bằng văn bản của một cố vấn tài chính khẳng định rằng khoản thanh toán sẽ trả hoặc nhận trong một giao dịch là \u003cb>công bằng, xét từ góc độ tài chính\u003c/b>, đối với một bên được nêu rõ — thường là cổ đông của công ty mục tiêu. Nó được hỗ trợ bởi phân tích định giá của cố vấn qua các phương pháp chuẩn, và thường được gửi tới hội đồng quản trị tại cuộc họp phê duyệt giao dịch.\u003c/p>\u003cp>\u003cb>Điều nó không nói.\u003c/b> Nó \u003cb>không\u003c/b> nói rằng giao dịch là một ý hay, rằng đó là phương án tốt nhất hiện có, hay rằng không thể đạt được mức giá cao hơn. Nó không đưa ra ý kiến về giá trị chiến lược, về khả năng hiện thực hóa cộng hưởng, về việc phân bổ khoản thanh toán giữa các loại cổ đông, hay về việc một cổ đông cụ thể nên bỏ phiếu thế nào. Nó chỉ đề cập liệu \u003cb>các điều khoản tài chính\u003c/b> có nằm trong một khoảng mà cố vấn coi là công bằng hay không, tại một thời điểm và trên các giả định đã nêu.\u003c/p>\u003cp>\u003cb>Vì sao hội đồng lấy nó.\u003c/b> Thành viên hội đồng có nghĩa vụ tín thác, và trong một giao dịch thay đổi quyền kiểm soát, quyết định của họ sẽ bị soi xét và có thể bị kiện. Ý kiến về tính công bằng là bằng chứng rằng hội đồng đã \u003cb>tự trang bị thông tin\u003c/b> bằng cách lấy tư vấn chuyên môn độc lập trước khi quyết định — hỗ trợ việc hoàn thành nghĩa vụ cẩn trọng. Nó do đó vừa là một công cụ quản trị và phòng vệ pháp lý, vừa là một công cụ định giá.\u003c/p>\u003cp>Điểm yếu được thừa nhận là cố vấn đưa ra ý kiến thường cũng đang hưởng một \u003cb>phí thành công\u003c/b> khi hoàn tất, tạo động cơ kết luận rằng các điều khoản là công bằng. Thực hành tốt hơn là lấy ý kiến từ một cố vấn \u003cb>độc lập\u003c/b> không nhận phí phụ thuộc kết quả.\u003c/p>","rubricVi":"Định nghĩa đúng gồm cụm 'từ góc độ tài chính' (0,5) · ít nhất ba điều nó không đề cập (0,6) · lý do nghĩa vụ tín thác/phòng vệ pháp lý (0,5) · xung đột phí phụ thuộc và biện pháp cố vấn độc lập (0,4)."},{"id":"M4-01","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what asset allocation is and why it is considered the most important investment decision.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Asset allocation\u003c/b> is the division of a portfolio among broad asset classes — equities, bonds, cash, real estate and alternatives. \u003cb>Strategic\u003c/b> asset allocation sets the long-run target weights reflecting the investor's objectives and constraints; \u003cb>tactical\u003c/b> asset allocation makes shorter-term deviations around those targets within permitted ranges.\u003c/p>\u003cp>\u003cb>Why it dominates.\u003c/b> Decades of empirical research find that the strategic allocation explains the great majority of the \u003cb>variability of a portfolio's returns over time\u003c/b> — far more than security selection or market timing. The reason is structural: asset classes have distinct and persistent risk-return characteristics and are imperfectly correlated with one another, so the mix determines the portfolio's fundamental risk exposure. Within an asset class, individual securities move largely together with that class, so selection decisions operate on a much smaller residual.\u003c/p>\u003cp>The practical implications are that the allocation decision should be made \u003cb>first\u003c/b> and with the most care; that it must follow directly from the objectives and constraints recorded in the IPS; that it should be reviewed when circumstances change rather than in response to market movements; and that \u003cb>rebalancing\u003c/b> is necessary, because market movements cause drift away from the intended risk profile.\u003c/p>\u003cp>A caveat: the finding concerns variability of returns \u003ci>over time\u003c/i> for a given portfolio, and is sometimes overstated as explaining differences in return \u003ci>between\u003c/i> managers, where selection matters more.\u003c/p>","rubric":"Definition with strategic/tactical distinction (0.6) · empirical finding with the correlation-based reason (0.7) · practical implications incl. rebalancing (0.5) · precision about what the finding claims (0.2).","qVi":"Giải thích phân bổ tài sản là gì và vì sao nó được coi là quyết định đầu tư quan trọng nhất.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Phân bổ tài sản\u003c/b> là việc chia danh mục giữa các lớp tài sản lớn — cổ phiếu, trái phiếu, tiền mặt, bất động sản và các sản phẩm thay thế. Phân bổ tài sản \u003cb>chiến lược\u003c/b> đặt các tỷ trọng mục tiêu dài hạn phản ánh mục tiêu và ràng buộc của nhà đầu tư; phân bổ tài sản \u003cb>chiến thuật\u003c/b> tạo các độ lệch ngắn hạn quanh các mục tiêu đó trong biên độ cho phép.\u003c/p>\u003cp>\u003cb>Vì sao nó chi phối.\u003c/b> Nhiều thập niên nghiên cứu thực nghiệm cho thấy phân bổ chiến lược giải thích phần lớn \u003cb>sự biến thiên của lợi suất danh mục theo thời gian\u003c/b> — nhiều hơn hẳn so với lựa chọn chứng khoán hay canh thời điểm thị trường. Lý do mang tính cấu trúc: các lớp tài sản có đặc tính rủi ro – lợi suất riêng biệt và dai dẳng, và tương quan không hoàn hảo với nhau, nên cơ cấu quyết định mức phơi nhiễm rủi ro nền tảng của danh mục. Trong một lớp tài sản, các chứng khoán riêng lẻ phần lớn di chuyển cùng lớp đó, nên các quyết định lựa chọn chỉ tác động lên một phần dư nhỏ hơn nhiều.\u003c/p>\u003cp>Các hàm ý thực tiễn là quyết định phân bổ nên được đưa ra \u003cb>trước tiên\u003c/b> và với sự cẩn trọng nhất; rằng nó phải xuất phát trực tiếp từ các mục tiêu và ràng buộc ghi trong IPS; rằng nó nên được rà soát khi hoàn cảnh thay đổi chứ không phải để phản ứng với biến động thị trường; và rằng \u003cb>tái cân bằng\u003c/b> là cần thiết, vì biến động thị trường gây trôi dạt khỏi hồ sơ rủi ro dự định.\u003c/p>\u003cp>Một lưu ý: phát hiện này nói về sự biến thiên của lợi suất \u003ci>theo thời gian\u003c/i> đối với một danh mục cho trước, và đôi khi bị nói quá thành giải thích khác biệt lợi suất \u003ci>giữa\u003c/i> các nhà quản lý, nơi việc lựa chọn quan trọng hơn.\u003c/p>","rubricVi":"Định nghĩa với phân biệt chiến lược/chiến thuật (0,6) · phát hiện thực nghiệm với lý do dựa trên tương quan (0,7) · hàm ý thực tiễn gồm tái cân bằng (0,5) · sự chính xác về điều mà phát hiện khẳng định (0,2)."},{"id":"M4-02","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what an exchange-traded fund is and how its price stays close to net asset value.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> An \u003cb>ETF\u003c/b> is an open-end pooled investment vehicle whose units are \u003cb>listed and traded intraday on an exchange\u003c/b>, like a share. Most track an index, though active ETFs exist. Investors buy and sell on the exchange from other investors at market prices, rather than subscribing and redeeming with the fund at NAV as in a conventional open-end fund.\u003c/p>\u003cp>\u003cb>How price tracks NAV.\u003c/b> The mechanism is arbitrage by \u003cb>authorised participants (APs)\u003c/b> — large institutions with the right to transact directly with the fund in large blocks called \u003cb>creation units\u003c/b>, usually \u003cb>in kind\u003c/b> by delivering or receiving the underlying basket of securities.\u003c/p>\u003cp>If the ETF's market price rises \u003cb>above\u003c/b> NAV, an AP buys the underlying basket, delivers it to the fund in exchange for new ETF units, and sells those units in the market at the higher price, capturing the difference. The selling pressure pushes the price down toward NAV, and the supply of units expands. If the price falls \u003cb>below\u003c/b> NAV, the AP buys ETF units cheaply in the market, redeems them with the fund for the underlying basket, and sells the securities — buying pressure lifts the price toward NAV and units are cancelled.\u003c/p>\u003cp>This arbitrage keeps price and NAV closely aligned, and the in-kind mechanism also makes ETFs tax-efficient and avoids forced selling. Note that it works only while the underlying basket is liquid and priceable — in stressed markets, or for ETFs holding illiquid assets, discounts can open up because the arbitrage becomes difficult or risky to execute.\u003c/p>","rubric":"Definition incl. intraday exchange trading (0.5) · AP creation/redemption mechanism (0.5) · both arbitrage directions traced correctly (0.7) · limitation in stressed or illiquid markets (0.3).","qVi":"Giải thích quỹ hoán đổi danh mục (ETF) là gì và giá của nó bám sát giá trị tài sản ròng như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>ETF\u003c/b> là một công cụ đầu tư tập thể dạng mở với chứng chỉ được \u003cb>niêm yết và giao dịch trong phiên trên sở giao dịch\u003c/b>, giống như một cổ phiếu. Phần lớn ETF mô phỏng một chỉ số, dù cũng tồn tại ETF chủ động. Nhà đầu tư mua và bán trên sở giao dịch từ các nhà đầu tư khác ở giá thị trường, thay vì mua và bán lại với quỹ theo NAV như trong một quỹ mở truyền thống.\u003c/p>\u003cp>\u003cb>Giá bám NAV như thế nào.\u003c/b> Cơ chế là kinh doanh chênh lệch giá bởi \u003cb>thành viên lập quỹ được ủy quyền (AP)\u003c/b> — các định chế lớn có quyền giao dịch trực tiếp với quỹ theo các lô lớn gọi là \u003cb>đơn vị tạo lập\u003c/b>, thường \u003cb>bằng hiện vật\u003c/b> qua việc giao hoặc nhận rổ chứng khoán cơ sở.\u003c/p>\u003cp>Nếu giá thị trường của ETF tăng \u003cb>trên\u003c/b> NAV, một AP mua rổ chứng khoán cơ sở, giao cho quỹ để đổi lấy chứng chỉ ETF mới, rồi bán các chứng chỉ đó ra thị trường ở mức giá cao hơn, thu về phần chênh lệch. Áp lực bán đẩy giá xuống về phía NAV, và nguồn cung chứng chỉ mở rộng. Nếu giá rơi \u003cb>dưới\u003c/b> NAV, AP mua chứng chỉ ETF giá rẻ trên thị trường, hoàn trả cho quỹ để lấy rổ chứng khoán cơ sở, rồi bán các chứng khoán đó — áp lực mua nâng giá về phía NAV và chứng chỉ bị hủy.\u003c/p>\u003cp>Cơ chế chênh lệch giá này giữ giá và NAV bám sát nhau, và cơ chế bằng hiện vật cũng khiến ETF hiệu quả về thuế và tránh được việc buộc phải bán tài sản. Lưu ý nó chỉ vận hành chừng nào rổ chứng khoán cơ sở còn thanh khoản và định giá được — trong thị trường căng thẳng, hoặc với các ETF nắm giữ tài sản kém thanh khoản, mức chiết khấu có thể mở ra vì việc chênh lệch giá trở nên khó hoặc rủi ro khi thực hiện.\u003c/p>","rubricVi":"Định nghĩa gồm giao dịch trong phiên trên sở (0,5) · cơ chế tạo lập/hoàn trả của AP (0,5) · truy đúng cả hai chiều chênh lệch giá (0,7) · hạn chế trong thị trường căng thẳng hoặc kém thanh khoản (0,3)."},{"id":"M4-03","ch":4,"type":"calc-essay","clo":"CLO2","marks":2,"exam":"final","q":"A portfolio returned 13% with volatility 18% and tracking error 4%; its benchmark returned 10%; the risk-free rate is 5%. Compute the Sharpe ratio and information ratio, and state which is more relevant if this is the client's only investment.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Sharpe ratio = (13 − 5) ÷ 18 = 8 ÷ 18 = \u003cb>0.44\u003c/b>.\u003cbr>Information ratio = (13 − 10) ÷ 4 = 3 ÷ 4 = \u003cb>0.75\u003c/b>.\u003c/p>\u003cp>\u003cb>Which is more relevant.\u003c/b> If this portfolio is the client's \u003cb>only\u003c/b> investment, the \u003cb>Sharpe ratio\u003c/b> is the appropriate criterion. The reason is that the client experiences the \u003cb>total volatility\u003c/b> of their wealth — both the systematic risk of being in the market and any specific ris
