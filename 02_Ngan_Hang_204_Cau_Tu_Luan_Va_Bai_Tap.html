h khoản chỉ trong vài ngày.\u003c/p>","rubricVi":"Chiều của ngân hàng thương mại với khẩu hiệu đúng (0,6) · chiều của ngân hàng đầu tư (0,6) · cơ chế vốn có bảo đảm (0,4) · hệ quả cho sự ổn định bảng cân đối (0,4)."},{"id":"H1-02","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Distinguish the broker, dealer and market-maker functions, and explain how each is compensated.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>broker\u003c/b> acts as \u003cb>agent\u003c/b>: it matches buyers and sellers, executes the client's instruction and never takes the other side. It holds no position and bears no market risk, and is compensated by \u003cb>commission\u003c/b>.\u003c/p>\u003cp>A \u003cb>dealer\u003c/b> acts as \u003cb>principal\u003c/b>: it buys and sells for its own account, taking positions and bearing market risk. It is compensated by \u003cb>trading gains\u003c/b> on price movements.\u003c/p>\u003cp>A \u003cb>market maker\u003c/b> is a dealer with a continuous obligation: it quotes two-sided prices and stands ready to buy at its bid and sell at its ask, supplying immediacy from its own inventory. It is compensated by the \u003cb>bid-ask spread\u003c/b>, where Ask = Bid + spread, which must cover inventory risk, adverse selection and processing costs.\u003c/p>\u003cp>The essential distinction is agency versus principal: the broker earns a fee for a service, while the dealer and market maker earn a spread for accepting risk onto their own balance sheet.\u003c/p>","rubric":"Three functions correctly distinguished (1.0) · correct compensation for each (0.6) · agency/principal framing (0.4).","qVi":"Phân biệt các chức năng môi giới, tự doanh và tạo lập thị trường, và giải thích cách mỗi chức năng được trả công.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Môi giới\u003c/b> hành động với vai trò \u003cb>đại lý\u003c/b>: kết nối bên mua và bên bán, thực hiện chỉ thị của khách hàng và không bao giờ đứng ở chiều đối ứng. Nó không nắm giữ vị thế và không gánh rủi ro thị trường, và được trả bằng \u003cb>hoa hồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Tự doanh\u003c/b> hành động với vai trò \u003cb>chính chủ\u003c/b>: mua bán cho tài khoản của chính mình, mở vị thế và gánh rủi ro thị trường. Nó được trả bằng \u003cb>lãi giao dịch\u003c/b> từ biến động giá.\u003c/p>\u003cp>\u003cb>Tạo lập thị trường\u003c/b> là một nhà tự doanh với nghĩa vụ liên tục: yết giá hai chiều và luôn sẵn sàng mua theo giá đặt mua và bán theo giá chào bán, cung cấp tính tức thời từ tồn kho của chính mình. Nó được trả bằng \u003cb>chênh lệch giá đặt mua – chào bán\u003c/b>, với Giá chào bán = Giá đặt mua + chênh lệch, khoản này phải bù đắp rủi ro tồn kho, lựa chọn bất lợi và chi phí xử lý.\u003c/p>\u003cp>Sự phân biệt cốt yếu là đại lý so với chính chủ: môi giới hưởng phí cho một dịch vụ, còn tự doanh và tạo lập thị trường hưởng chênh lệch giá vì chấp nhận rủi ro lên bảng cân đối của chính mình.\u003c/p>","rubricVi":"Phân biệt đúng ba chức năng (1,0) · cách trả công đúng cho mỗi chức năng (0,6) · khung đại lý/chính chủ (0,4)."},{"id":"H1-03","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what is meant by the 'operating environment' of an investment bank and why the bank depends on other professional firms.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The operating environment is the ecosystem of counterparties and constraints within which the bank executes transactions: law firms, audit firms, tax advisors, credit rating agencies, commercial banks, custody and settlement providers, and research and due-diligence firms — all sitting inside a domestic and international legal framework and prevailing economic and social conditions.\u003c/p>\u003cp>\u003cb>Why the dependence exists.\u003c/b> No transaction can be completed by the bank alone. Legal enforceability requires \u003cb>law firms\u003c/b>; the credibility of financial information requires independent \u003cb>auditors\u003c/b>; the pricing of debt requires a \u003cb>rating agency\u003c/b>; the transfer of ownership requires \u003cb>custody and settlement\u003c/b>; and the buyer's confidence requires independent \u003cb>due diligence\u003c/b>. Each supplies a specialist verification the bank is not permitted, qualified or independent enough to provide itself.\u003c/p>\u003cp>Crucially, several of these parties exist to provide \u003cb>independent\u003c/b> assurance. The bank is an interested party — it earns a fee if the deal completes — so the market relies on third parties whose duty runs elsewhere.\u003c/p>","rubric":"Ecosystem listed with the legal/economic framing (0.8) · at least three dependencies explained (0.8) · independence insight (0.4).","qVi":"Giải thích 'môi trường hoạt động' của một ngân hàng đầu tư nghĩa là gì và vì sao ngân hàng phụ thuộc vào các hãng chuyên môn khác.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Môi trường hoạt động là hệ sinh thái các đối tác và ràng buộc mà trong đó ngân hàng thực hiện giao dịch: hãng luật, hãng kiểm toán, tư vấn thuế, tổ chức xếp hạng tín nhiệm, ngân hàng thương mại, đơn vị lưu ký và thanh toán, cùng các hãng nghiên cứu và thẩm định — tất cả nằm trong khuôn khổ pháp lý trong nước và quốc tế cùng bối cảnh kinh tế – xã hội hiện hành.\u003c/p>\u003cp>\u003cb>Vì sao có sự phụ thuộc.\u003c/b> Không giao dịch nào có thể được ngân hàng hoàn tất một mình. Tính thực thi pháp lý cần \u003cb>hãng luật\u003c/b>; độ tin cậy của thông tin tài chính cần \u003cb>kiểm toán\u003c/b> độc lập; việc định giá nợ cần một \u003cb>tổ chức xếp hạng\u003c/b>; việc chuyển quyền sở hữu cần \u003cb>lưu ký và thanh toán\u003c/b>; và niềm tin của bên mua cần \u003cb>thẩm định\u003c/b> độc lập. Mỗi bên cung cấp một sự kiểm chứng chuyên môn mà bản thân ngân hàng không được phép, không đủ năng lực hoặc không đủ độc lập để tự làm.\u003c/p>\u003cp>Quan trọng là nhiều bên trong số này tồn tại để cung cấp sự bảo đảm \u003cb>độc lập\u003c/b>. Ngân hàng là một bên có lợi ích — nó hưởng phí nếu thương vụ hoàn tất — nên thị trường dựa vào bên thứ ba có nghĩa vụ hướng về nơi khác.\u003c/p>","rubricVi":"Liệt kê hệ sinh thái với khung pháp lý/kinh tế (0,8) · giải thích ít nhất ba sự phụ thuộc (0,8) · nhận thức về tính độc lập (0,4)."},{"id":"H1-04","ch":1,"type":"case","clo":"CLO1","marks":3,"exam":"final","q":"A junior banker is asked by a client to 'adjust' a projection in a pitch book to support a higher valuation. Analyse the ethical and professional issues and state the correct course of action.","guide":"\u003cp>\u003cb>Model answer — issues.\u003c/b> (1) \u003cb>Misrepresentation.\u003c/b> Presenting a projection the banker believes unsupportable, in a document intended to influence investment or transaction decisions, is a misrepresentation regardless of who requested it. (2) \u003cb>Diligence and reasonable basis.\u003c/b> Analysis must rest on a defensible foundation; an assumption inserted to reach a predetermined answer has none. (3) \u003cb>Duty to third parties.\u003c/b> Pitch materials may reach investors, boards or counterparties who will rely on them, so the harm extends beyond the client. (4) \u003cb>Client pressure is not a defence.\u003c/b> The client's wish does not transfer the professional obligation, and a banker who complies exposes both themselves and the firm to regulatory and civil liability. (5) \u003cb>Career and cultural pressure\u003c/b> — a junior facing a senior client request is the classic setting for an ethical failure.\u003c/p>\u003cp>\u003cb>Correct course of action.\u003c/b> Do not make the change as instructed. Distinguish clearly between (a) presenting the client's \u003cb>own\u003c/b> projections, explicitly labelled and sourced as management's case, which is legitimate, and (b) the bank asserting a projection as its own analysis, which must be defensible. Offer legitimate alternatives: run the higher figure as a clearly labelled \u003cb>sensitivity or upside scenario\u003c/b> alongside a base case, with the assumptions stated. Document the request and the response. Escalate to the supervising senior banker and, if pressure continues, to \u003cb>compliance\u003c/b> — this is precisely what escalation channels exist for. If the firm's culture punishes refusal, the obligation to the integrity of the analysis nonetheless remains.\u003c/p>","rubric":"At least three issues incl. misrepresentation and reasonable basis (1.2) · rejection of the client-pressure defence (0.4) · the management-case vs bank-analysis distinction (0.6) · sensitivity alternative, documentation and escalation (0.8).","qVi":"Một chuyên viên tư vấn cấp thấp được khách hàng yêu cầu 'điều chỉnh' một dự phóng trong tài liệu chào (pitch book) để hỗ trợ một mức định giá cao hơn. Phân tích các vấn đề đạo đức và nghề nghiệp, và nêu hướng hành động đúng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các vấn đề.\u003c/b> (1) \u003cb>Trình bày sai.\u003c/b> Trình bày một dự phóng mà chuyên viên tin là không có cơ sở, trong một tài liệu nhằm ảnh hưởng đến quyết định đầu tư hay giao dịch, là hành vi trình bày sai bất kể ai yêu cầu. (2) \u003cb>Cần mẫn và cơ sở hợp lý.\u003c/b> Phân tích phải dựa trên nền tảng bảo vệ được; một giả định được nhét vào để đạt tới một đáp án định trước thì không có nền tảng nào. (3) \u003cb>Nghĩa vụ với bên thứ ba.\u003c/b> Tài liệu chào có thể đến tay nhà đầu tư, hội đồng quản trị hoặc đối tác — những người sẽ tin vào nó, nên tổn hại vượt ra ngoài khách hàng. (4) \u003cb>Áp lực từ khách hàng không phải là lý do biện hộ.\u003c/b> Mong muốn của khách hàng không chuyển giao nghĩa vụ nghề nghiệp, và một chuyên viên tuân theo sẽ khiến cả bản thân lẫn công ty đối mặt trách nhiệm pháp lý và dân sự. (5) \u003cb>Áp lực sự nghiệp và văn hóa\u003c/b> — một người cấp thấp đối diện yêu cầu của một khách hàng cấp cao là bối cảnh kinh điển dẫn tới thất bại đạo đức.\u003c/p>\u003cp>\u003cb>Hướng hành động đúng.\u003c/b> Không thực hiện thay đổi như được chỉ đạo. Phân biệt rõ giữa (a) trình bày dự phóng của \u003cb>chính\u003c/b> khách hàng, được ghi nhãn và dẫn nguồn rõ là kịch bản của ban điều hành, điều này hợp lệ, và (b) việc ngân hàng khẳng định một dự phóng như phân tích của chính mình, điều này phải bảo vệ được. Đề xuất các phương án hợp lệ: chạy con số cao hơn như một \u003cb>kịch bản độ nhạy hoặc kịch bản khả quan\u003c/b> được ghi nhãn rõ ràng bên cạnh kịch bản cơ sở, với các giả định được nêu ra. Ghi chép lại yêu cầu và phản hồi. Báo cáo lên chuyên viên tư vấn cấp cao phụ trách và, nếu áp lực tiếp diễn, lên \u003cb>tuân thủ\u003c/b> — đó chính là lý do các kênh báo cáo tồn tại. Nếu văn hóa công ty trừng phạt việc từ chối, nghĩa vụ với sự liêm chính của phân tích vẫn còn nguyên.\u003c/p>","rubricVi":"Ít nhất ba vấn đề gồm trình bày sai và cơ sở hợp lý (1,2) · bác bỏ lý do biện hộ về áp lực khách hàng (0,4) · phân biệt kịch bản của ban điều hành so với phân tích của ngân hàng (0,6) · phương án độ nhạy, ghi chép và báo cáo (0,8)."},{"id":"H1-05","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain three trends currently reshaping the investment-banking industry.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (1) \u003cb>A barbell market structure.\u003c/b> A few global universal banks with large balance sheets sit at one end and many independent advisory boutiques at the other, while mid-tier full-service firms are squeezed — unable to match either the balance sheet or the focused senior attention.\u003c/p>\u003cp>(2) \u003cb>The separation of advice from capital.\u003c/b> Boutiques such as Lazard, Evercore and Rothschild win major M&A mandates without financing capability, competing on independence precisely because they do not also want to lend to the buyer.\u003c/p>\u003cp>(3) \u003cb>The growth of private capital.\u003c/b> Private equity and private credit increasingly substitute for public issuance, so companies stay private longer and a growing share of fee income comes from private markets rather than public underwriting.\u003c/p>\u003cp>(4) \u003cb>Electronification.\u003c/b> Automated execution has compressed secondary-market spreads and commissions, making scale and technology decisive in the markets business and pushing brokers toward financing and value-added services for revenue.\u003c/p>\u003cp>(5) \u003cb>Tighter capital and liquidity rules\u003c/b> (Basel III, Dodd-Frank) have structurally lowered leverage and therefore industry ROE, from the 20–30% of the 2000s to roughly 8–12%.\u003c/p>\u003cp>(Any three, properly explained, earn full marks.)\u003c/p>","rubric":"Three genuine trends (1.2) · each explained with a mechanism or example rather than merely named (0.8).","qVi":"Giải thích ba xu hướng đang định hình lại ngành ngân hàng đầu tư hiện nay.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (1) \u003cb>Cấu trúc thị trường hình quả tạ.\u003c/b> Một vài ngân hàng đa năng toàn cầu với bảng cân đối lớn ở một đầu và nhiều hãng tư vấn độc lập chuyên biệt (boutique) ở đầu kia, trong khi các hãng dịch vụ đầy đủ ở tầng giữa bị ép — không thể sánh được với bảng cân đối lẫn sự tập trung chuyên môn cấp cao.\u003c/p>\u003cp>(2) \u003cb>Sự tách bạch giữa tư vấn và vốn.\u003c/b> Các boutique như Lazard, Evercore và Rothschild giành các hợp đồng M&A lớn mà không có năng lực tài trợ, cạnh tranh bằng tính độc lập chính vì họ không đồng thời muốn cho bên mua vay.\u003c/p>\u003cp>(3) \u003cb>Sự tăng trưởng của vốn tư nhân.\u003c/b> Vốn cổ phần tư nhân và tín dụng tư nhân ngày càng thay thế cho phát hành công khai, nên doanh nghiệp giữ tư nhân lâu hơn và một tỷ trọng thu nhập từ phí ngày càng lớn đến từ thị trường tư nhân thay vì bảo lãnh phát hành công khai.\u003c/p>\u003cp>(4) \u003cb>Điện tử hóa.\u003c/b> Thực hiện giao dịch tự động đã nén chênh lệch giá và hoa hồng trên thị trường thứ cấp, khiến quy mô và công nghệ trở nên quyết định trong mảng thị trường và đẩy các nhà môi giới hướng tới tài trợ và dịch vụ giá trị gia tăng để tạo doanh thu.\u003c/p>\u003cp>(5) \u003cb>Quy tắc chặt hơn về vốn và thanh khoản\u003c/b> (Basel III, Dodd-Frank) đã hạ đòn bẩy một cách cấu trúc và do đó hạ ROE của ngành, từ 20–30% những năm 2000 xuống còn khoảng 8–12%.\u003c/p>\u003cp>(Bất kỳ ba xu hướng nào, giải thích đúng, đều được điểm tối đa.)\u003c/p>","rubricVi":"Ba xu hướng thực sự (1,2) · mỗi xu hướng được giải thích bằng một cơ chế hoặc ví dụ chứ không chỉ nêu tên (0,8)."},{"id":"H2-01","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain what underwriting is and why an issuer is willing to pay a gross spread for it.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Underwriting\u003c/b> is the commitment by an investment bank to purchase, or to place, a new issue of securities and resell it to investors. In a firm commitment the bank buys the entire issue at an agreed price and is left holding whatever it cannot resell.\u003c/p>\u003cp>\u003cb>Why the issuer pays.\u003c/b> The bank supplies two things the issuer does not have. First, a \u003cb>balance sheet\u003c/b> willing to absorb \u003cb>placement risk\u003c/b>: the issuer receives certain proceeds at a known price on a known date, and can therefore commit to the investment or acquisition the funds are intended for. Second, a \u003cb>distribution network\u003c/b> — established relationships with institutional investors that the issuer could not assemble itself, together with the credibility the bank's involvement confers.\u003c/p>\u003cp>The bank also contributes \u003cb>valuation and structuring advice\u003c/b>, regulatory execution and aftermarket support through the greenshoe. The gross spread — typically 3–7% for an IPO, well under 1% for investment-grade debt — is the price of transferring risk and renting distribution, and it rises with the risk the bank absorbs.\u003c/p>","rubric":"Definition incl. firm commitment (0.6) · risk transfer and certainty of proceeds (0.6) · distribution and credibility (0.5) · spread varies with risk (0.3).","qVi":"Giải thích bảo lãnh phát hành là gì và vì sao tổ chức phát hành sẵn lòng trả một khoản phí bảo lãnh cho nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Bảo lãnh phát hành\u003c/b> là cam kết của một ngân hàng đầu tư mua, hoặc phân phối, một đợt phát hành chứng khoán mới và bán lại cho nhà đầu tư. Trong cam kết chắc chắn, ngân hàng mua trọn đợt phát hành ở giá đã thỏa thuận và giữ lại phần nào không bán được.\u003c/p>\u003cp>\u003cb>Vì sao tổ chức phát hành trả phí.\u003c/b> Ngân hàng cung cấp hai thứ mà tổ chức phát hành không có. Thứ nhất, một \u003cb>bảng cân đối\u003c/b> sẵn lòng hấp thụ \u003cb>rủi ro phân phối\u003c/b>: tổ chức phát hành nhận được số tiền thu chắc chắn ở một mức giá đã biết vào một ngày đã biết, và do đó có thể cam kết với khoản đầu tư hay thâu tóm mà số tiền đó nhắm tới. Thứ hai, một \u003cb>mạng lưới phân phối\u003c/b> — các quan hệ đã thiết lập với nhà đầu tư tổ chức mà tổ chức phát hành không thể tự tập hợp, cùng với uy tín mà sự tham gia của ngân hàng đem lại.\u003c/p>\u003cp>Ngân hàng cũng đóng góp \u003cb>tư vấn định giá và cấu trúc\u003c/b>, thực thi pháp lý và hỗ trợ thị trường thứ cấp qua greenshoe. Phí bảo lãnh — thường 3–7% cho một IPO, dư 1% cho nợ hạng đầu tư — là giá của việc chuyển giao rủi ro và thuê phân phối, và nó tăng theo rủi ro mà ngân hàng hấp thụ.\u003c/p>","rubricVi":"Định nghĩa gồm cam kết chắc chắn (0,6) · chuyển giao rủi ro và sự chắc chắn về tiền thu (0,6) · phân phối và uy tín (0,5) · phí thay đổi theo rủi ro (0,3)."},{"id":"H2-02","ch":2,"type":"calc-essay","clo":"CLO1","marks":2,"exam":"midterm","q":"A company issues 15 million shares at VND 36,000 with a 5.5% gross spread and no greenshoe. Compute gross proceeds, the underwriting fee and net proceeds, and state who receives the fee.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Gross proceeds = 15,000,000 × 36,000 = \u003cb>VND 540 billion\u003c/b>.\u003cbr>Underwriting fee = 5.5% × 540bn = \u003cb>VND 29.7 billion\u003c/b>.\u003cbr>Net proceeds to the issuer = 540 − 29.7 = \u003cb>VND 510.3 billion\u003c/b>.\u003c/p>\u003cp>The fee is received by the \u003cb>underwriting syndicate\u003c/b> and divided into three components: the \u003cb>management fee\u003c/b> to the lead manager/bookrunner for running the process, the \u003cb>underwriting fee\u003c/b> compensating the members for assuming placement risk in proportion to their commitments, and the \u003cb>selling concession\u003c/b> paid to whichever member actually places the shares. The bookrunner takes the largest overall share because it controls the book, the pricing and the allocation.\u003c/p>","rubric":"Three figures correct (1.2) · syndicate identified with the three fee components (0.8).","qVi":"Một công ty phát hành 15 triệu cổ phần giá 36.000 đồng với phí bảo lãnh 5,5% và không có greenshoe. Tính số tiền thu gộp, phí bảo lãnh và số tiền thu ròng, và nêu ai nhận phí.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Số tiền thu gộp = 15.000.000 × 36.000 = \u003cb>540 tỷ đồng\u003c/b>.\u003cbr>Phí bảo lãnh = 5,5% × 540 tỷ = \u003cb>29,7 tỷ đồng\u003c/b>.\u003cbr>Số tiền thu ròng của tổ chức phát hành = 540 − 29,7 = \u003cb>510,3 tỷ đồng\u003c/b>.\u003c/p>\u003cp>Phí được \u003cb>tổ hợp bảo lãnh\u003c/b> nhận và chia thành ba phần: \u003cb>phí quản lý\u003c/b> cho nhà quản lý chính/quản lý sổ vì điều hành quy trình, \u003cb>phí bảo lãnh\u003c/b> bù đắp cho các thành viên vì đảm nhận rủi ro phân phối theo tỷ lệ cam kết, và \u003cb>hoa hồng bán\u003c/b> trả cho thành viên nào thực sự phân phối cổ phần. Nhà quản lý sổ nhận phần lớn nhất tổng thể vì kiểm soát sổ lệnh, việc định giá và việc phân bổ.\u003c/p>","rubricVi":"Ba con số đúng (1,2) · nhận diện tổ hợp bảo lãnh với ba thành phần phí (0,8)."},{"id":"H2-03","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the role of the roadshow and bookbuilding in an IPO, and how they determine the final price.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>roadshow\u003c/b> is a marketing programme, typically one to two weeks, in which management presents the equity story to institutional investors in a series of group and one-to-one meetings, accompanied by the underwriters' sales force. Its purpose is to build understanding and demand, and to allow investors to test management directly.\u003c/p>\u003cp>\u003cb>Bookbuilding\u003c/b> runs in parallel. Underwriters collect \u003cb>indications of interest\u003c/b> from investors specifying both the quantity sought and the price at which they would buy. Aggregating these builds a \u003cb>demand curve\u003c/b> for the issue.\u003c/p>\u003cp>\u003cb>Determining the price.\u003c/b> The book reveals how much demand exists at each level within the marketed range, and equally important, the \u003cb>quality\u003c/b> of that demand — long-only institutions intending to hold are valued more highly than short-term accounts. The final price is set where the deal is comfortably covered by high-quality demand, deliberately a little below the clearing price so the aftermarket trades up. Allocation then favours investors judged likely to be stable holders. This discretion over price and allocation is a source of underwriter influence and a recognised conflict of interest with the issuer.\u003c/p>","rubric":"Roadshow purpose (0.5) · bookbuilding producing a demand curve (0.6) · pricing below clearing plus demand quality and allocation (0.7) · conflict noted (0.2).","qVi":"Giải thích vai trò của roadshow và dựng sổ trong một đợt IPO, và cách chúng xác định giá cuối cùng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Roadshow\u003c/b> là một chương trình tiếp thị, thường một đến hai tuần, trong đó ban điều hành trình bày câu chuyện vốn chủ tới các nhà đầu tư tổ chức qua một loạt cuộc gặp nhóm và một–một, có sự tháp tùng của lực lượng bán hàng của nhà bảo lãnh. Mục đích là xây dựng sự hiểu biết và nhu cầu, và cho phép nhà đầu tư kiểm chứng ban điều hành trực tiếp.\u003c/p>\u003cp>\u003cb>Dựng sổ\u003c/b> chạy song song. Nhà bảo lãnh thu thập \u003cb>chỉ báo quan tâm\u003c/b> từ nhà đầu tư, nêu cả khối lượng muốn mua và mức giá họ sẵn sàng mua. Tổng hợp lại dựng thành một \u003cb>đường cầu\u003c/b> cho đợt phát hành.\u003c/p>\u003cp>\u003cb>Xác định giá.\u003c/b> Sổ lệnh cho thấy có bao nhiêu nhu cầu ở mỗi mức trong khoảng đã tiếp thị, và quan trọng không kém, \u003cb>chất lượng\u003c/b> của nhu cầu đó — các tổ chức chỉ mua để giữ (long-only) được đánh giá cao hơn các tài khoản ngắn hạn. Giá cuối cùng được đặt ở nơi thương vụ được nhu cầu chất lượng cao bao phủ thoải mái, có chủ đích thấp hơn một chút so với giá cân bằng để thị trường thứ cấp tăng giá. Việc phân bổ sau đó ưu ái các nhà đầu tư được đánh giá là người nắm giữ ổn định. Quyền tùy nghi về giá và phân bổ này là một nguồn ảnh hưởng của nhà bảo lãnh và là một xung đột lợi ích được thừa nhận với tổ chức phát hành.\u003c/p>","rubricVi":"Mục đích roadshow (0,5) · dựng sổ tạo ra đường cầu (0,6) · định giá dưới giá cân bằng cùng chất lượng nhu cầu và phân bổ (0,7) · nêu xung đột (0,2)."},{"id":"H2-04","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Compare equity underwriting with bond underwriting across four dimensions.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Gross spread.\u003c/b> Equity is high — typically 3–7% for an IPO; debt is low — often under 1%, and a fraction of that for investment-grade issuers.\u003c/p>\u003cp>\u003cb>(2) Volume and frequency.\u003c/b> Equity issuance is episodic and comparatively rare for any one company; debt issuance is high-volume and repetitive, since bonds mature and must be refinanced. DCM is therefore a higher-volume, lower-margin business.\u003c/p>\u003cp>\u003cb>(3) Core analysis.\u003c/b> Equity underwriting turns on \u003cb>growth and valuation\u003c/b> — the equity story, forecasts and the multiple. Debt underwriting turns on \u003cb>credit\u003c/b> — probability of default and recovery, summarised in the rating, which largely sets the spread over the benchmark.\u003c/p>\u003cp>\u003cb>(4) Investor base and effect on the issuer.\u003c/b> Equity is placed with equity funds and dilutes existing ownership but creates no fixed obligation. Debt is placed with insurers, pension funds and bond funds, does not dilute, but creates fixed interest and principal obligations with covenants — while the interest is tax-deductible.\u003c/p>","rubric":"Four dimensions with the correct direction of contrast (1.6) · at least two supporting figures or specifics (0.4).","qVi":"So sánh bảo lãnh phát hành cổ phần với bảo lãnh phát hành trái phiếu theo bốn khía cạnh.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Phí bảo lãnh.\u003c/b> Cổ phần cao — thường 3–7% cho một IPO; nợ thấp — thường dư 1%, và chỉ một phần nhỏ của mức đó với tổ chức phát hành hạng đầu tư.\u003c/p>\u003cp>\u003cb>(2) Khối lượng và tần suất.\u003c/b> Phát hành cổ phần diễn ra từng đợt và tương đối hiếm với bất kỳ công ty nào; phát hành nợ có khối lượng lớn và lặp đi lặp lại, vì trái phiếu đáo hạn và phải tái tài trợ. DCM do đó là một mảng khối lượng lớn, biên thấp.\u003c/p>\u003cp>\u003cb>(3) Phân tích cốt lõi.\u003c/b> Bảo lãnh cổ phần xoay quanh \u003cb>tăng trưởng và định giá\u003c/b> — câu chuyện vốn chủ, dự phóng và bội số. Bảo lãnh nợ xoay quanh \u003cb>tín dụng\u003c/b> — xác suất vỡ nợ và mức thu hồi, tóm gọn trong mức xếp hạng, thứ quyết định phần lớn chênh lệch so với chuẩn.\u003c/p>\u003cp>\u003cb>(4) Nền nhà đầu tư và tác động lên tổ chức phát hành.\u003c/b> Cổ phần được phân phối cho các quỹ cổ phần và pha loãng sở hữu hiện hữu nhưng không tạo nghĩa vụ cố định. Nợ được phân phối cho công ty bảo hiểm, quỹ hưu trí và quỹ trái phiếu, không pha loãng, nhưng tạo nghĩa vụ lãi và gốc cố định kèm điều khoản ràng buộc — trong khi lãi vay được khấu trừ thuế.\u003c/p>","rubricVi":"Bốn khía cạnh với đúng chiều của so sánh (1,6) · ít nhất hai con số hoặc chi tiết hỗ trợ (0,4)."},{"id":"H2-05","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the '2 and 20' fee structure and how the hurdle rate and high-water mark protect investors.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>&ldquo;2 and 20&rdquo;\u003c/b> describes the general partner's compensation: a \u003cb>2% annual management fee\u003c/b>, charged on committed (later invested) capital to fund the firm's operations regardless of performance, plus \u003cb>20% carried interest\u003c/b> — a share of the fund's profits.\u003c/p>\u003cp>\u003cb>The hurdle rate\u003c/b> (preferred return, commonly 8% per annum) is the threshold return limited partners must receive before the GP participates in any profit. It ensures the manager is paid for genuine outperformance rather than merely for deploying capital in a rising market, and it ranks LPs ahead of the GP in the distribution waterfall.\u003c/p>\u003cp>\u003cb>The high-water mark\u003c/b> records the highest value on which performance fees have already been paid. After a loss, no further carry may be charged until that previous peak is exceeded. Without it a manager who lost 20% and then gained 20% would collect carry on the recovery — being paid twice for the same gains and rewarded for volatility rather than skill. A \u003cb>clawback\u003c/b> performs the equivalent function across a fund's life, requiring the GP to repay carry received early if later losses show it was overpaid.\u003c/p>","rubric":"Both fee components incl. the base for the management fee (0.7) · hurdle purpose (0.6) · high-water mark with a worked illustration (0.5) · clawback (0.2).","qVi":"Giải thích cấu trúc phí '2 và 20' và cách ngưỡng sinh lời và mốc cao nhất bảo vệ nhà đầu tư.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>&ldquo;2 và 20&rdquo;\u003c/b> mô tả thù lao của thành viên quản lý: một \u003cb>phí quản lý 2%/năm\u003c/b>, thu trên vốn cam kết (sau là vốn đã đầu tư) để tài trợ vận hành của công ty bất kể hiệu quả, cộng \u003cb>20% lãi thưởng\u003c/b> — một phần của lợi nhuận quỹ.\u003c/p>\u003cp>\u003cb>Ngưỡng sinh lời\u003c/b> (mức sinh lời ưu tiên, thường 8%/năm) là mức lợi nhuận ngưỡng mà thành viên góp vốn phải nhận trước khi GP tham gia chia bất kỳ lợi nhuận nào. Nó bảo đảm nhà quản lý được trả cho hiệu quả vượt trội thực sự chứ không phải chỉ vì đã giải ngân vốn trong một thị trường đi lên, và nó xếp LP trước GP trong thác nước phân phối.\u003c/p>\u003cp>\u003cb>Mốc cao nhất\u003c/b> ghi lại giá trị cao nhất mà phí hiệu quả đã được trả trên đó. Sau một khoản lỗ, không được thu thêm lãi thưởng cho tới khi vượt qua đỉnh trước đó. Không có nó, một nhà quản lý lỗ 20% rồi lãi 20% sẽ thu lãi thưởng trên phần hồi phục — được trả hai lần cho cùng một khoản lãi và được thưởng cho sự biến động thay vì kỹ năng. Một \u003cb>điều khoản thu hồi (clawback)\u003c/b> thực hiện chức năng tương đương xuyên suốt vòng đời quỹ, buộc GP hoàn lại lãi thưởng đã nhận sớm nếu các khoản lỗ về sau cho thấy đã bị trả thừa.\u003c/p>","rubricVi":"Cả hai thành phần phí gồm cơ sở tính phí quản lý (0,7) · mục đích ngưỡng (0,6) · mốc cao nhất với minh họa tính toán (0,5) · thu hồi (0,2)."},{"id":"H3-01","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Distinguish horizontal, vertical and conglomerate combinations, giving the strategic rationale and a principal risk of each.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Horizontal\u003c/b> — combining firms in the same industry and stage of production. \u003ci>Rationale:\u003c/i> scale economies, market share, cost synergies from removing duplication. \u003ci>Risk:\u003c/i> competition-authority scrutiny, since the combination directly reduces the number of competitors and may require divestiture remedies.\u003c/p>\u003cp>\u003cb>Vertical\u003c/b> — combining with a supplier or customer along the supply chain. \u003ci>Rationale:\u003c/i> security of supply or distribution, capture of the margin previously paid to the counterparty, and control of quality or technology. \u003ci>Risk:\u003c/i> loss of flexibility and of the discipline of market pricing; the acquired unit may become a captive supplier with weakening competitiveness, and other customers may withdraw from a supplier now owned by their competitor.\u003c/p>\u003cp>\u003cb>Conglomerate\u003c/b> — combining unrelated businesses. \u003ci>Rationale:\u003c/i> diversification of earnings, deployment of surplus cash, access to growth markets. \u003ci>Risk:\u003c/i> the \u003cb>conglomerate discount\u003c/b> — investors can diversify more cheaply themselves and penalise the opacity and cross-subsidy of a group whose parts they cannot value separately; management attention is also spread thin.\u003c/p>","rubric":"Three forms correctly defined (0.6) · rationale for each (0.6) · a genuine risk for each incl. the conglomerate discount (0.8).","qVi":"Phân biệt kết hợp theo chiều ngang, chiều dọc và kiểu tập đoàn, nêu lý do chiến lược và một rủi ro chính của mỗi loại.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Chiều ngang\u003c/b> — kết hợp các doanh nghiệp trong cùng ngành và cùng công đoạn sản xuất. \u003ci>Lý do:\u003c/i> lợi thế kinh tế theo quy mô, thị phần, cộng hưởng chi phí từ việc loại bỏ trùng lặp. \u003ci>Rủi ro:\u003c/i> sự giám sát của cơ quan cạnh tranh, vì việc kết hợp trực tiếp làm giảm số lượng đối thủ và có thể phải thoái vốn để khắc phục.\u003c/p>\u003cp>\u003cb>Chiều dọc\u003c/b> — kết hợp với một nhà cung cấp hoặc khách hàng dọc chuỗi cung ứng. \u003ci>Lý do:\u003c/i> bảo đảm nguồn cung hoặc phân phối, giành lấy biên lợi nhuận trước đây trả cho đối tác, và kiểm soát chất lượng hoặc công nghệ. \u003ci>Rủi ro:\u003c/i> mất tính linh hoạt và mất kỷ luật của giá thị trường; đơn vị được mua có thể trở thành nhà cung cấp bị lệ thuộc với năng lực cạnh tranh suy yếu, và các khách hàng khác có thể rút khỏi một nhà cung cấp nay thuộc sở hữu của đối thủ họ.\u003c/p>\u003cp>\u003cb>Tập đoàn\u003c/b> — kết hợp các doanh nghiệp không liên quan. \u003ci>Lý do:\u003c/i> đa dạng hóa lợi nhuận, triển khai tiền mặt dư thừa, tiếp cận thị trường tăng trưởng. \u003ci>Rủi ro:\u003c/i> \u003cb>chiết khấu tập đoàn\u003c/b> — nhà đầu tư có thể tự đa dạng hóa rẻ hơn và trừng phạt sự mờ đục cùng trợ cấp chéo của một tập đoàn mà họ không định giá riêng từng phần được; sự chú ý của ban điều hành cũng bị dàn mỏng.\u003c/p>","rubricVi":"Định nghĩa đúng ba hình thức (0,6) · lý do cho mỗi hình thức (0,6) · một rủi ro thực sự cho mỗi hình thức gồm chiết khấu tập đoàn (0,8)."},{"id":"H3-02","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain what due diligence covers in an M&A transaction and how its findings affect the transaction.","guide":"\u003cp>\u003cb>Model answer — coverage.\u003c/b> \u003cb>Commercial:\u003c/b> market size and growth, customer concentration, competitive position, pipeline. \u003cb>Financial:\u003c/b> quality of earnings, normalised working capital, debt-like items, forecast credibility. \u003cb>Tax:\u003c/b> exposures, structuring, historic compliance. \u003cb>Legal:\u003c/b> title to assets and shares, material contracts and change-of-control clauses, litigation, permits and licences. \u003cb>Environmental\u003c/b>, \u003cb>HR\u003c/b> (key personnel, pensions, labour liabilities) and \u003cb>IT/operational\u003c/b> complete the scope.\u003c/p>\u003cp>\u003cb>Effect on the transaction.\u003c/b> Findings feed through four channels. (1) \u003cb>Price\u003c/b> — identified liabilities, overstated earnings or unfunded obligations reduce the amount offered. (2) \u003cb>Contractual protection\u003c/b> — specific \u003cb>indemnities\u003c/b> for known risks, broader \u003cb>warranties\u003c/b> for unknown ones, escrow or retention of part of the price, or warranty and indemnity insurance. (3) \u003cb>Conditions precedent\u003c/b> — matters that must be resolved before closing, such as obtaining a consent or terminating a contract. (4) \u003cb>Walking away\u003c/b> — if diligence reveals a problem that cannot be priced or protected against, the correct outcome is to abandon the transaction. Findings also shape the integration plan.\u003c/p>","rubric":"At least five coverage areas (0.8) · at least three of the four effect channels (0.9) · walk-away/integration point (0.3).","qVi":"Giải thích thẩm định trong một giao dịch M&A bao gồm những gì và các phát hiện của nó ảnh hưởng đến giao dịch ra sao.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — phạm vi.\u003c/b> \u003cb>Thương mại:\u003c/b> quy mô và tăng trưởng thị trường, mức độ tập trung khách hàng, vị thế cạnh tranh, danh mục cơ hội. \u003cb>Tài chính:\u003c/b> chất lượng lợi nhuận, vốn lưu động chuẩn hóa, các khoản mang tính nợ, độ tin cậy của dự phóng. \u003cb>Thuế:\u003c/b> các rủi ro, cấu trúc, việc tuân thủ trong quá khứ. \u003cb>Pháp lý:\u003c/b> quyền sở hữu tài sản và cổ phần, các hợp đồng trọng yếu và điều khoản thay đổi quyền kiểm soát, tranh chấp, giấy phép. \u003cb>Môi trường\u003c/b>, \u003cb>nhân sự\u003c/b> (nhân sự chủ chốt, hưu trí, nghĩa vụ lao động) và \u003cb>công nghệ thông tin/vận hành\u003c/b> hoàn tất phạm vi.\u003c/p>\u003cp>\u003cb>Tác động lên giao dịch.\u003c/b> Các phát hiện đi qua bốn kênh. (1) \u003cb>Giá\u003c/b> — nghĩa vụ nợ được nhận diện, lợi nhuận bị thổi phồng hoặc nghĩa vụ chưa được tài trợ làm giảm số tiền chào ra. (2) \u003cb>Bảo vệ bằng hợp đồng\u003c/b> — \u003cb>bồi hoàn\u003c/b> cụ thể cho rủi ro đã biết, \u003cb>bảo đảm\u003c/b> rộng hơn cho rủi ro chưa biết, ký quỹ hoặc giữ lại một phần giá, hoặc bảo hiểm bảo đảm và bồi hoàn. (3) \u003cb>Điều kiện tiên quyết\u003c/b> — những vấn đề phải được giải quyết trước khi hoàn tất, như xin được một chấp thuận hoặc chấm dứt một hợp đồng. (4) \u003cb>Rút lui\u003c/b> — nếu thẩm định phát hiện một vấn đề không thể định giá hay bảo vệ được, kết quả đúng là từ bỏ giao dịch. Các phát hiện cũng định hình kế hoạch hợp nhất.\u003c/p>","rubricVi":"Ít nhất năm mảng phạm vi (0,8) · ít nhất ba trong bốn kênh tác động (0,9) · điểm về rút lui/hợp nhất (0,3)."},{"id":"H3-03","ch":3,"type":"calc-essay","clo":"CLO1","marks":3,"exam":"midterm","q":"Company X has 150m shares at VND 30,000 and net income VND 540bn. It acquires Company Y (60m shares, unaffected price VND 20,000, net income VND 180bn) at a 35% premium, funded 100% in cash borrowed at 6% after tax. Compute the offer price, consideration, interest, pro forma EPS and accretion, and comment.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Offer price = 20,000 × 1.35 = \u003cb>VND 27,000\u003c/b>.\u003cbr>Total consideration = 27,000 × 60m = \u003cb>VND 1,620bn\u003c/b> (all cash, all borrowed).\u003cbr>After-tax interest = 6% × 1,620 = \u003cb>VND 97.2bn\u003c/b>.\u003c/p>\u003cp>X's standalone EPS = 540bn ÷ 150m = \u003cb>VND 3,600\u003c/b>.\u003cbr>Pro forma net income = 540 + 180 − 97.2 = \u003cb>VND 622.8bn\u003c/b>.\u003cbr>Shares are unchanged at \u003cb>150m\u003c/b>, since no equity was issued.\u003cbr>Pro forma EPS = 622.8bn ÷ 150m = \u003cb>VND 4,152\u003c/b>.\u003cbr>Accretion = 4,152 ÷ 3,600 − 1 = \u003cb>+15.3% accretive\u003c/b>.\u003c/p>\u003cp>\u003cb>Comment.\u003c/b> The deal is strongly accretive because it is \u003cb>all-cash\u003c/b>: no new shares dilute the denominator, and the earnings acquired comfortably exceed the financing cost. Test it directly — the target's earnings yield on the price paid is 180 ÷ 1,620 = \u003cb>11.1%\u003c/b>, against an after-tax borrowing cost of \u003cb>6%\u003c/b>. Acquiring an 11.1% yield with 6% money necessarily raises EPS.\u003c/p>\u003cp>Two cautions. First, accretion is \u003cb>not\u003c/b> value creation: no synergies were assumed, and whether the 35% premium is justified depends on the present value of benefits not captured here. Second, the transaction adds VND 1,620bn of debt, materially raising leverage and financial risk; the analysis should be accompanied by pro forma leverage and interest-coverage ratios and a downside case in which the target's earnings disappoint.\u003c/p>","rubric":"Offer price and consideration (0.7) · interest and pro forma NI (0.8) · EPS and accretion (0.9) · earnings-yield-versus-cost-of-debt test (0.4) · leverage and accretion≠value cautions (0.2).","qVi":"Công ty X có 150 triệu cổ phần ở giá 30.000 đồng và lợi nhuận ròng 540 tỷ đồng. X thâu tóm Công ty Y (60 triệu cổ phần, giá chưa bị ảnh hưởng 20.000 đồng, lợi nhuận ròng 180 tỷ đồng) với mức thặng dư 35%, tài trợ 100% bằng tiền mặt đi vay lãi suất 6% sau thuế. Tính giá chào mua, khoản thanh toán, lãi vay, EPS hợp nhất và mức tăng lãi, rồi bình luận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Giá chào mua = 20.000 × 1,35 = \u003cb>27.000 đồng\u003c/b>.\u003cbr>Tổng khoản thanh toán = 27.000 × 60 triệu = \u003cb>1.620 tỷ đồng\u003c/b> (toàn bộ tiền mặt, toàn bộ đi vay).\u003cbr>Lãi vay sau thuế = 6% × 1.620 = \u003cb>97,2 tỷ đồng\u003c/b>.\u003c/p>\u003cp>EPS độc lập của X = 540 tỷ ÷ 150 triệu = \u003cb>3.600 đồng\u003c/b>.\u003cbr>Lợi nhuận ròng hợp nhất = 540 + 180 − 97,2 = \u003cb>622,8 tỷ đồng\u003c/b>.\u003cbr>Số cổ phần không đổi ở \u003cb>150 triệu\u003c/b>, vì không phát hành thêm vốn chủ.\u003cbr>EPS hợp nhất = 622,8 tỷ ÷ 150 triệu = \u003cb>4.152 đồng\u003c/b>.\u003cbr>Mức tăng lãi = 4.152 ÷ 3.600 − 1 = \u003cb>+15,3% tăng lãi\u003c/b>.\u003c/p>\u003cp>\u003cb>Bình luận.\u003c/b> Thương vụ tăng lãi mạnh vì nó \u003cb>hoàn toàn bằng tiền mặt\u003c/b>: không có cổ phần mới nào pha loãng mẫu số, và lợi nhuận mua được vượt thoải mái chi phí tài trợ. Kiểm chứng trực tiếp — tỷ suất lợi nhuận của công ty mục tiêu trên giá phải trả là 180 ÷ 1.620 = \u003cb>11,1%\u003c/b>, so với chi phí vay sau thuế \u003cb>6%\u003c/b>. Mua một tỷ suất 11,1% bằng tiền có giá 6% tất yếu làm tăng EPS.\u003c/p>\u003cp>Hai điểm cần cẩn trọng. Thứ nhất, tăng lãi \u003cb>không\u003c/b> phải là tạo giá trị: không có cộng hưởng nào được giả định, và việc mức thặng dư 35% có chính đáng hay không phụ thuộc vào giá trị hiện tại của các lợi ích chưa được tính ở đây. Thứ hai, giao dịch bổ sung 1.620 tỷ đồng nợ, làm tăng đáng kể đòn bẩy và rủi ro tài chính; phân tích nên đi kèm các hệ số đòn bẩy và khả năng trả lãi hợp nhất cùng một kịch bản xấu trong đó lợi nhuận của công ty mục tiêu gây thất vọng.\u003c/p>","rubricVi":"Giá chào mua và khoản thanh toán (0,7) · lãi vay và lợi nhuận ròng hợp nhất (0,8) · EPS và mức tăng lãi (0,9) · phép thử tỷ suất lợi nhuận so với chi phí nợ (0,4) · lưu ý đòn bẩy và tăng lãi ≠ giá trị (0,2)."},{"id":"H3-04","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain what a leveraged buyout is and why the target's cash flow characteristics matter more than its growth rate.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>leveraged buyout\u003c/b> is the acquisition of a company by a financial sponsor using a high proportion of debt, which is secured on and \u003cb>serviced from the target's own cash flows\u003c/b>. The sponsor contributes a comparatively small equity cheque; returns come from three levers — repaying debt (which transfers enterprise value to equity), growing EBITDA, and any change in the exit multiple.\u003c/p>\u003cp>\u003cb>Why cash flow dominates growth.\u003c/b> The debt imposes \u003cb>fixed, contractual\u003c/b> obligations: interest must be paid and covenants met every period, irrespective of trading conditions. A company with modest but highly predictable cash generation can support substantial leverage safely. A fast-growing company whose cash flow is volatile, or which consumes cash through heavy capital expenditure and working-capital investment, cannot — growth that is not yet cash-generative provides nothing with which to service debt, and a single weak period can breach a covenant or trigger default.\u003c/p>\u003cp>This is why the textbook's selection criteria lead with strong and predictable free cash flow, a defensible market position and \u003cb>low capital-expenditure\u003c/b> requirements, and why cyclical or capital-hungry businesses make poor LBO candidates however attractive their growth prospects.\u003c/p>","rubric":"Definition incl. servicing from target cash flow and the three return levers (0.8) · fixed obligations versus volatility argument (0.8) · link to selection criteria incl. low capex (0.4).","qVi":"Giải thích thâu tóm bằng đòn bẩy (LBO) là gì và vì sao đặc điểm dòng tiền của công ty mục tiêu quan trọng hơn tốc độ tăng trưởng của nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Thâu tóm bằng đòn bẩy\u003c/b> là việc một nhà tài trợ tài chính mua một công ty bằng một tỷ trọng nợ cao, được bảo đảm bằng và \u003cb>trả từ chính dòng tiền của công ty mục tiêu\u003c/b>. Nhà tài trợ bỏ ra một khoản vốn chủ tương đối nhỏ; lợi nhuận đến từ ba đòn bẩy — trả nợ (chuyển giá trị doanh nghiệp sang vốn chủ), tăng trưởng EBITDA, và bất kỳ thay đổi nào của bội số lúc thoái vốn.\u003c/p>\u003cp>\u003cb>Vì sao dòng tiền lấn át tăng trưởng.\u003c/b> Nợ áp đặt nghĩa vụ \u003cb>cố định, theo hợp đồng\u003c/b>: lãi phải trả và các điều khoản ràng buộc phải được đáp ứng mỗi kỳ, bất kể điều kiện kinh doanh. Một công ty sinh tiền khiêm tốn nhưng rất dự đoán được có thể gánh đòn bẩy đáng kể một cách an toàn. Một công ty tăng trưởng nhanh nhưng dòng tiền biến động, hoặc ngốn tiền qua chi tiêu vốn nặng và đầu tư vốn lưu động, thì không thể — tăng trưởng chưa sinh tiền không cung cấp gì để trả nợ, và chỉ một kỳ yếu kém có thể vi phạm điều khoản ràng buộc hoặc kích hoạt vỡ nợ.\u003c/p>\u003cp>Đây là lý do các tiêu chí lựa chọn trong giáo trình dẫn đầu bằng dòng tiền tự do mạnh và dự đoán được, vị thế thị trường bảo vệ được và \u003cb>nhu cầu chi tiêu vốn thấp\u003c/b>, và vì sao các doanh nghiệp có tính chu kỳ hoặc ngốn vốn là ứng viên LBO kém dù triển vọng tăng trưởng có hấp dẫn đến đâu.\u003c/p>","rubricVi":"Định nghĩa gồm việc trả nợ từ dòng tiền công ty mục tiêu và ba đòn bẩy lợi nhuận (0,8) · lập luận nghĩa vụ cố định so với biến động (0,8) · liên hệ tới tiêu chí lựa chọn gồm chi tiêu vốn thấp (0,4)."},{"id":"H3-05","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the difference between a friendly and a hostile takeover and the additional difficulties a hostile bidder faces.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>friendly\u003c/b> takeover is negotiated with and recommended by the target's board, which grants access to due diligence and cooperates on structuring, regulatory filings and integration planning. A \u003cb>hostile\u003c/b> approach bypasses the board — typically through a \u003cb>tender offer\u003c/b> made directly to shareholders, or a \u003cb>proxy contest\u003c/b> to replace directors with nominees who will approve the deal.\u003c/p>\u003cp>\u003cb>Additional difficulties for a hostile bidder.\u003c/b> (1) \u003cb>No due diligence\u003c/b> — the bidder must value the target on public information alone, so it bears the risk of undisclosed liabilities and must either price that risk in or accept it. (2) \u003cb>Defensive tactics\u003c/b> — poison pills, staggered boards, supermajority provisions, white knights and litigation raise the cost and duration. (3) \u003cb>Higher price\u003c/b> — hostile bids typically require a larger premium to persuade shareholders against their board's advice, and publicity may attract competing bidders. (4) \u003cb>Financing is harder\u003c/b> to arrange without certainty of outcome or access to information. (5) \u003cb>Integration risk\u003c/b> — management and key staff of an unwilling target frequently leave, taking with them the capability that was being acquired.\u003c/p>\u003cp>For these reasons hostile deals are rarer, more expensive and more likely to fail.\u003c/p>","rubric":"Clear distinction incl. tender offer and proxy contest (0.6) · at least four difficulties (1.0) · conclusion on rarity/cost (0.4).","qVi":"Giải thích sự khác biệt giữa thâu tóm thân thiện và thâu tóm thù địch và những khó khăn bổ sung mà bên chào mua thù địch phải đối mặt.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Thâu tóm \u003cb>thân thiện\u003c/b> được thương lượng với và được hội đồng quản trị công ty mục tiêu khuyến nghị, hội đồng cho phép tiếp cận thẩm định và hợp tác về cấu trúc, hồ sơ pháp lý và lập kế hoạch hợp nhất. Một tiếp cận \u003cb>thù địch\u003c/b> bỏ qua hội đồng — thường qua một \u003cb>chào mua công khai\u003c/b> gửi thẳng tới cổ đông, hoặc một \u003cb>cuộc tranh giành ủy quyền\u003c/b> để thay thế thành viên hội đồng bằng người sẽ chấp thuận thương vụ.\u003c/p>\u003cp>\u003cb>Khó khăn bổ sung cho bên chào mua thù địch.\u003c/b> (1) \u003cb>Không có thẩm định\u003c/b> — bên chào mua phải định giá công ty mục tiêu chỉ dựa trên thông tin công khai, nên gánh rủi ro về các nghĩa vụ chưa công bố và phải hoặc tính rủi ro đó vào giá hoặc chấp nhận nó. (2) \u003cb>Chiến thuật phòng thủ\u003c/b> — viên thuốc độc, hội đồng bầu so le, điều khoản đa số tuyệt đối, hiệp sĩ trắng và kiện tụng làm tăng chi phí và kéo dài thời gian. (3) \u003cb>Giá cao hơn\u003c/b> — chào mua thù địch thường cần mức thặng dư lớn hơn để thuyết phục cổ đông đi ngược lời khuyên của hội đồng, và sự công khai có thể thu hút các bên chào mua cạnh tranh. (4) \u003cb>Tài trợ khó thu xếp hơn\u003c/b> khi không có sự chắc chắn về kết quả hoặc không tiếp cận được thông tin. (5) \u003cb>Rủi ro hợp nhất\u003c/b> — ban điều hành và nhân sự chủ chốt của một công ty mục tiêu không sẵn lòng thường ra đi, mang theo chính năng lực mà thương vụ nhắm tới.\u003c/p>\u003cp>Vì những lý do đó, các thương vụ thù địch hiếm hơn, tốn kém hơn và dễ thất bại hơn.\u003c/p>","rubricVi":"Phân biệt rõ gồm chào mua công khai và tranh giành ủy quyền (0,6) · ít nhất bốn khó khăn (1,0) · kết luận về mức độ hiếm/chi phí (0,4)."},{"id":"H4-01","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the difference between risk tolerance and risk capacity, and why a wealth manager must assess both.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Risk tolerance\u003c/b> is the client's \u003ci>psychological willingness\u003c/i> to accept volatility and the possibility of loss — an attitude, revealed by questioning and by past behaviour in falling markets. \u003cb>Risk capacity\u003c/b> is the client's \u003ci>objective financial ability\u003c/i> to absorb loss without compromising their goals, determined by wealth, income, time horizon, liabilities and dependants.\u003c/p>\u003cp>\u003cb>Why both matter.\u003c/b> They can diverge in either direction. A young professional with a long horizon and secure income may have \u003cb>high capacity but low tolerance\u003c/b> — advising an over-conservative portfolio would fail to meet their long-term goals, so the manager's task is education and gradual risk-taking. Conversely a retiree drawing income may have \u003cb>low capacity but high tolerance\u003c/b> — enthusiasm for risk cannot change the fact that a large loss cannot be recovered from future earnings.\u003c/p>\u003cp>The governing rule is that the portfolio must be constrained by the \u003cb>lower\u003c/b> of the two. Recommending risk the client cannot financially absorb is unsuitable however willing they are, and this reasoning must be documented in the investment policy statement — both to protect the client and to evidence the basis of the advice.\u003c/p>","rubric":"Both definitions correct (0.8) · divergence illustrated in both directions (0.7) · lower-of-the-two rule and documentation (0.5).","qVi":"Giải thích sự khác biệt giữa khả năng chịu đựng rủi ro và năng lực chịu rủi ro, và vì sao nhà quản lý gia sản phải đánh giá cả hai.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Khả năng chịu đựng rủi ro\u003c/b> là \u003ci>sự sẵn lòng về mặt tâm lý\u003c/i> của khách hàng trong việc chấp nhận biến động và khả năng thua lỗ — một thái độ, được bộc lộ qua phỏng vấn và qua hành vi trong quá khứ ở các thị trường giảm. \u003cb>Năng lực chịu rủi ro\u003c/b> là \u003ci>khả năng tài chính khách quan\u003c/i> của khách hàng để hấp thụ tổn thất mà không ảnh hưởng tới mục tiêu của họ, được quyết định bởi tài sản, thu nhập, chân trời thời gian, nghĩa vụ nợ và người phụ thuộc.\u003c/p>\u003cp>\u003cb>Vì sao cả hai đều quan trọng.\u003c/b> Chúng có thể phân kỳ theo cả hai hướng. Một người trẻ có chuyên môn với chân trời dài và thu nhập ổn định có thể có \u003cb>năng lực cao nhưng khả năng chịu đựng thấp\u003c/b> — tư vấn một danh mục quá thận trọng sẽ không đạt được mục tiêu dài hạn của họ, nên nhiệm vụ của nhà quản lý là giáo dục và nâng dần mức rủi ro. Ngược lại, một người về hưu đang rút thu nhập có thể có \u003cb>năng lực thấp nhưng khả năng chịu đựng cao\u003c/b> — sự hào hứng với rủi ro không thể thay đổi thực tế rằng một khoản lỗ lớn không thể bù đắp từ thu nhập tương lai.\u003c/p>\u003cp>Quy tắc chi phối là danh mục phải bị ràng buộc bởi mức \u003cb>thấp hơn\u003c/b> trong hai yếu tố. Khuyến nghị mức rủi ro mà khách hàng không thể hấp thụ về tài chính là không phù hợp dù họ có sẵn lòng đến đâu, và lập luận này phải được ghi chép trong tuyên bố chính sách đầu tư — vừa để bảo vệ khách hàng vừa để chứng minh cơ sở của lời khuyên.\u003c/p>","rubricVi":"Định nghĩa đúng cả hai (0,8) · minh họa sự phân kỳ theo cả hai hướng (0,7) · quy tắc lấy mức thấp hơn và việc ghi chép (0,5)."},{"id":"H4-02","ch":4,"type":"calc-essay","clo":"CLO2","marks":2,"exam":"final","q":"A fund has assets of VND 5,600bn, liabilities of VND 240bn and 200 million units. (a) Compute NAV per unit. (b) An investor subscribes VND 500m with a 1% entry fee — how many units do they receive? (c) Explain why NAV is struck daily.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) NAV = (5,600 − 240) ÷ 200m = 5,360bn ÷ 200m = \u003cb>VND 26,800 per unit\u003c/b>.\u003c/p>\u003cp>(b) Entry fee = 1% × 500m = VND 5m, so the amount invested = \u003cb>VND 495m\u003c/b>.\u003cbr>Units issued = 495,000,000 ÷ 26,800 = \u003cb>18,470 units\u003c/b> (approximately).\u003c/p>\u003cp>(c) NAV is struck daily because it is the price at which \u003cb>subscriptions and redemptions\u003c/b> transact in an open-end fund. Daily valuation ensures that investors entering or leaving do so at a price reflecting the current value of the underlying assets, so that neither they nor the continuing investors are advantaged — an out-of-date NAV would allow subscribers to buy assets cheaply or redeemers to extract more than their share, diluting those who remain. It is also the base for calculating the management fee and for reporting performance to investors and the regulator.\u003c/p>","rubric":"(a) 0.6 · (b) 0.7 with the fee correctly deducted before division · (c) dealing price and fairness between entering, exiting and continuing investors (0.7).","qVi":"Một quỹ có tài sản 5.600 tỷ đồng, nợ phải trả 240 tỷ đồng và 200 triệu chứng chỉ. (a) Tính NAV mỗi chứng chỉ. (b) Một nhà đầu tư mua 500 triệu đồng với phí vào 1% — họ nhận được bao nhiêu chứng chỉ? (c) Giải thích vì sao NAV được xác định hằng ngày.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) NAV = (5.600 − 240) ÷ 200 triệu = 5.360 tỷ ÷ 200 triệu = \u003cb>26.800 đồng mỗi chứng chỉ\u003c/b>.\u003c/p>\u003cp>(b) Phí vào = 1% × 500 triệu = 5 triệu đồng, nên số tiền được đầu tư = \u003cb>495 triệu đồng\u003c/b>.\u003cbr>Số chứng chỉ phát hành = 495.000.000 ÷ 26.800 = \u003cb>18.470 chứng chỉ\u003c/b> (xấp xỉ).\u003c/p>\u003cp>(c) NAV được xác định hằng ngày vì đó là mức giá mà việc \u003cb>mua và mua lại chứng chỉ\u003c/b> được thực hiện trong một quỹ mở. Định giá hằng ngày bảo đảm nhà đầu tư vào hoặc ra làm điều đó ở mức giá phản ánh giá trị hiện tại của tài sản cơ sở, để cả họ lẫn các nhà đầu tư ở lại đều không bị lợi hay thiệt — một NAV lỗi thời sẽ cho phép người mua vào mua tài sản với giá rẻ hoặc người rút ra lấy nhiều hơn phần của mình, làm loãng những người ở lại. Nó cũng là cơ sở để tính phí quản lý và để báo cáo hiệu quả cho nhà đầu tư và cơ quan quản lý.\u003c/p>","rubricVi":"(a) 0,6 · (b) 0,7 với việc trừ phí đúng trước khi chia · (c) giá giao dịch và sự công bằng giữa nhà đầu tư vào, ra và ở lại (0,7)."},{"id":"H4-03","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain why an asset manager's revenue is considered high quality by a universal bank, and identify the main threat to it.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Why it is high quality.\u003c/b> Management fees are charged as a percentage of AUM and accrue \u003cb>continuously and automatically\u003c/b>, independently of whether any transaction occurs. The revenue is therefore \u003cb>recurring and predictable\u003c/b>, in contrast with advisory and underwriting fees that are earned per deal and collapse when markets close, and with trading income that is volatile by nature. It also scales: because the cost base grows more slowly than assets, incremental AUM is highly profitable. For a universal bank this stabilises group earnings across the cycle and is capitalised by the market at a higher multiple than transaction income.\u003c/p>\u003cp>\u003cb>The main threat.\u003c/b> \u003cb>Fee compression driven by passive investing.\u003c/b> Because most active managers underperform their benchmark after fees, capital has migrated to index funds and ETFs charging a few basis points. This reduces average revenue per unit of AUM, so a manager can grow assets and still see revenue fall. The consequences are consolidation in pursuit of scale, and a barbell in which cheap passive products and genuinely differentiated alternatives (which retain performance fees) prosper while expensive, undifferentiated active funds are squeezed. Secondary threats are outflow risk from poor performance and rising regulatory and distribution costs.\u003c/p>","rubric":"Recurring, AUM-linked and scalable, contrasted with transaction income (1.0) · fee compression identified with its mechanism (0.7) · consequence or secondary threat (0.3).","qVi":"Giải thích vì sao doanh thu của một công ty quản lý tài sản được ngân hàng đa năng coi là chất lượng cao, và nhận diện mối đe dọa chính đối với nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Vì sao nó chất lượng cao.\u003c/b> Phí quản lý được thu theo tỷ lệ phần trăm trên AUM và tích lũy \u003cb>liên tục và tự động\u003c/b>, không phụ thuộc vào việc có giao dịch nào diễn ra hay không. Doanh thu do đó \u003cb>định kỳ và dự đoán được\u003c/b>, tương phản với phí tư vấn và bảo lãnh vốn được thu theo từng thương vụ và sụp đổ khi thị trường đóng cửa, và với thu nhập giao dịch vốn biến động về bản chất. Nó cũng mở rộng theo quy mô: vì chi phí nền tăng chậm hơn tài sản, AUM tăng thêm sinh lời rất cao. Với một ngân hàng đa năng, điều này ổn định lợi nhuận tập đoàn xuyên chu kỳ và được thị trường định giá ở bội số cao hơn so với thu nhập giao dịch.\u003c/p>\u003cp>\u003cb>Mối đe dọa chính.\u003c/b> \u003cb>Nén phí do đầu tư thụ động dẫn dắt.\u003c/b> Vì phần lớn nhà quản lý chủ động thua chỉ số tham chiếu sau phí, vốn đã dịch chuyển sang quỹ chỉ số và ETF chỉ thu vài điểm cơ bản. Điều này làm giảm doanh thu bình quân trên mỗi đơn vị AUM, nên một nhà quản lý có thể tăng tài sản mà vẫn thấy doanh thu giảm. Hệ quả là sự hợp nhất để theo đuổi quy mô, và một cấu trúc hình quả tạ trong đó các sản phẩm thụ động giá rẻ và các sản phẩm thay thế thực sự khác biệt (vẫn giữ được phí hiệu quả) cùng thịnh vượng, còn các quỹ chủ động đắt đỏ và không khác biệt bị ép. Các mối đe dọa thứ cấp là rủi ro dòng vốn ra do hiệu quả kém và chi phí pháp lý cùng phân phối tăng lên.\u003c/p>","rubricVi":"Định kỳ, gắn với AUM và mở rộng theo quy mô, đối chiếu với thu nhập giao dịch (1,0) · nhận diện nén phí kèm cơ chế của nó (0,7) · hệ quả hoặc mối đe dọa thứ cấp (0,3)."},{"id":"H4-04","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Describe the three phases of the portfolio management process and give two activities in each.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Planning.\u003c/b> Identify the client's objectives — required return and risk tolerance — and constraints: time horizon, liquidity needs, tax position, legal and regulatory circumstances and unique preferences. Record them in the \u003cb>investment policy statement\u003c/b>, and select an appropriate benchmark. \u003ci>Activities:\u003c/i> client profiling and risk assessment; drafting the IPS and agreeing the strategic asset allocation and benchmark.\u003c/p>\u003cp>\u003cb>(2) Execution.\u003c/b> Translate the policy into a portfolio. \u003ci>Activities:\u003c/i> implementing the strategic asset allocation and any tactical tilts within permitted ranges; security selection within each asset class and trading with attention to best execution and transaction costs.\u003c/p>\u003cp>\u003cb>(3) Feedback.\u003c/b> Monitor and adjust. \u003ci>Activities:\u003c/i> monitoring the portfolio and the client's circumstances, and rebalancing to target weights as market movements cause drift; measuring performance against the benchmark and conducting attribution analysis to separate allocation from selection effects.\u003c/p>\u003cp>The process is a continuous loop, not a sequence: feedback returns to planning whenever the client's circumstances or capital-market expectations change.\u003c/p>","rubric":"Three phases correctly named (0.6) · two valid activities in each (1.0) · continuous-loop point (0.4).","qVi":"Mô tả ba giai đoạn của quy trình quản lý danh mục và cho hai hoạt động trong mỗi giai đoạn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Lập kế hoạch.\u003c/b> Xác định mục tiêu của khách hàng — lợi suất yêu cầu và khả năng chịu đựng rủi ro — và các ràng buộc: chân trời thời gian, nhu cầu thanh khoản, tình trạng thuế, hoàn cảnh pháp lý và quản lý cùng các ưu tiên đặc thù. Ghi lại chúng trong \u003cb>tuyên bố chính sách đầu tư\u003c/b>, và chọn một chỉ số tham chiếu phù hợp. \u003ci>Hoạt động:\u003c/i> lập hồ sơ khách hàng và đánh giá rủi ro; soạn IPS và thống nhất phân bổ tài sản chiến lược cùng chỉ số tham chiếu.\u003c/p>\u003cp>\u003cb>(2) Thực thi.\u003c/b> Chuyển chính sách thành một danh mục. \u003ci>Hoạt động:\u003c/i> triển khai phân bổ tài sản chiến lược và bất kỳ điều chỉnh chiến thuật nào trong biên độ cho phép; lựa chọn chứng khoán trong từng lớp tài sản và giao dịch với sự chú ý tới thực hiện tốt nhất và chi phí giao dịch.\u003c/p>\u003cp>\u003cb>(3) Phản hồi.\u003c/b> Giám sát và điều chỉnh. \u003ci>Hoạt động:\u003c/i> giám sát danh mục và hoàn cảnh của khách hàng, và tái cân bằng về tỷ trọng mục tiêu khi biến động thị trường gây trôi dạt; đo lường hiệu quả so với chỉ số tham chiếu và phân tích đóng góp để tách tác động của phân bổ khỏi tác động của lựa chọn.\u003c/p>\u003cp>Quy trình là một vòng lặp liên tục, không phải một chuỗi tuần tự: phản hồi quay lại lập kế hoạch bất cứ khi nào hoàn cảnh của khách hàng hoặc kỳ vọng về thị trường vốn thay đổi.\u003c/p>","rubricVi":"Nêu đúng ba giai đoạn (0,6) · hai hoạt động hợp lệ trong mỗi giai đoạn (1,0) · điểm về vòng lặp liên tục (0,4)."},{"id":"H5-01","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain why EV/EBITDA is capital-structure neutral and when this matters most.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Enterprise value\u003c/b> is the value of the whole operating business, claimed by all providers of capital: EV = equity value + net debt + minority interest + preferred. \u003cb>EBITDA\u003c/b> is earnings \u003ci>before\u003c/i> interest, tax, depreciation and amortisation — that is, before any payment to debt holders. Numerator and denominator are therefore consistent: both are measured before the effects of financing. Changing the debt/equity mix alters equity value and net debt in offsetting directions and does not change EBITDA, so the multiple is unaffected. It is in this sense \u003cb>capital-structure neutral\u003c/b>.\u003c/p>\u003cp>\u003cb>By contrast\u003c/b>, the P/E ratio takes price (an equity claim) over earnings \u003ci>after\u003c/i> interest. A more leveraged company pays more interest, reducing net income, and its equity is riskier, so its P/E reflects its financing decisions as well as its operations.\u003c/p>\u003cp>\u003cb>When it matters most:\u003c/b> comparing companies with materially different leverage; valuing a target in an M&A or LBO context where the acquirer will change the capital structure entirely; comparing across countries with different financing norms and tax treatment; and valuing loss-making or heavily indebted firms where net income is negative or meaningless. The caution is that EBITDA ignores the capital expenditure needed to sustain the business, so for capital-intensive firms EV/EBIT or EV/(EBITDA − capex) discriminates better.\u003c/p>","rubric":"Consistency of numerator and denominator explained (0.8) · P/E contrast (0.5) · at least three situations where it matters (0.5) · capex limitation (0.2).","qVi":"Giải thích vì sao EV/EBITDA trung lập với cấu trúc vốn và khi nào điều này quan trọng nhất.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Giá trị doanh nghiệp\u003c/b> là giá trị của toàn bộ hoạt động kinh doanh, thuộc về mọi bên cung cấp vốn: EV = giá trị vốn chủ + nợ ròng + lợi ích cổ đông thiểu số + cổ phần ưu đãi. \u003cb>EBITDA\u003c/b> là lợi nhuận \u003ci>trước\u003c/i> lãi vay, thuế, khấu hao — tức là trước mọi khoản trả cho chủ nợ. Tử số và mẫu số do đó nhất quán: cả hai đều được đo trước tác động của việc tài trợ. Thay đổi tỷ lệ nợ/vốn chủ làm thay đổi giá trị vốn chủ và nợ ròng theo hai chiều bù trừ nhau và không làm thay đổi EBITDA, nên bội số không bị ảnh hưởng. Theo nghĩa này nó \u003cb>trung lập với cấu trúc vốn\u003c/b>.\u003c/p>\u003cp>\u003cb>Ngược lại\u003c/b>, hệ số P/E lấy giá (một quyền đòi trên vốn chủ) chia cho lợi nhuận \u003ci>sau\u003c/i> lãi vay. Một công ty có đòn bẩy cao hơn trả nhiều lãi hơn, làm giảm lợi nhuận ròng, và vốn chủ của nó rủi ro hơn, nên P/E của nó phản ánh cả quyết định tài trợ lẫn hoạt động kinh doanh.\u003c/p>\u003cp>\u003cb>Khi nào quan trọng nhất:\u003c/b> so sánh các công ty có mức đòn bẩy khác nhau đáng kể; định giá một công ty mục tiêu trong bối cảnh M&A hoặc LBO nơi bên thâu tóm sẽ thay đổi hoàn toàn cấu trúc vốn; so sánh giữa các quốc gia có thông lệ tài trợ và cách xử lý thuế khác nhau; và định giá các doanh nghiệp thua lỗ hoặc nợ nặng nơi lợi nhuận ròng âm hoặc vô nghĩa. Lưu ý là EBITDA bỏ qua chi tiêu vốn cần thiết để duy trì doanh nghiệp, nên với các doanh nghiệp thâm dụng vốn thì EV/EBIT hoặc EV/(EBITDA − chi tiêu vốn) phân biệt tốt hơn.\u003c/p>","rubricVi":"Giải thích tính nhất quán của tử số và mẫu số (0,8) · so sánh với P/E (0,5) · ít nhất ba tình huống nơi nó quan trọng (0,5) · hạn chế về chi tiêu vốn (0,2)."},{"id":"H5-02","ch":5,"type":"calc-essay","clo":"CLO2","marks":3,"exam":"final","q":"A company has EBITDA of VND 750bn, net debt of VND 1,500bn, minority interest of VND 200bn and 400m diluted shares. Peers trade at a median 8.5× EV/EBITDA. (a) Compute the implied value per share. (b) The company also holds VND 300bn of non-operating investments. Explain how this changes the answer and recompute.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Implied EV = 8.5 × 750 = \u003cb>VND 6,375bn\u003c/b>.\u003cbr>Equity value = EV − net debt − minority interest = 6,375 − 1,500 − 200 = \u003cb>VND 4,675bn\u003c/b>.\u003cbr>Value per share = 4,675bn ÷ 400m = \u003cb>VND 11,688\u003c/b>.\u003c/p>\u003cp>(b) \u003cb>Non-operating assets must be added separately.\u003c/b> The EV/EBITDA multiple was applied to \u003cb>operating\u003c/b> EBITDA, so the enterprise value it produces reflects only the \u003cb>operating\u003c/b> business. Investments that generate no EBITDA — surplus land, minority stakes, investment portfolios, excess cash — contribute nothing to that figure and would otherwise be valued at zero, understating the company.\u003c/p>\u003cp>Revised equity value = 6,375 − 1,500 − 200 + 300 = \u003cb>VND 4,975bn\u003c/b>.\u003cbr>Revised value per share = 4,975bn ÷ 400m = \u003cb>VND 12,438\u003c/b> — an increase of VND 750 per share.\u003c/p>\u003cp>The general principle is that the bridge from enterprise to equity value must capture \u003cb>every\u003c/b> non-operating claim and asset: subtract net debt, minorities and preferred; add non-operating assets and surplus cash. Consistency is essential — any income these assets generate must also be excluded from EBITDA, or their value would be double-counted.\u003c/p>","rubric":"(a) EV, equity and per share with minority correctly deducted (1.3) · (b) reasoning that the multiple values only operating earnings (0.9) · recomputed figures (0.5) · consistency/double-counting caution (0.3).","qVi":"Một công ty có EBITDA 750 tỷ đồng, nợ ròng 1.500 tỷ đồng, lợi ích cổ đông thiểu số 200 tỷ đồng và 400 triệu cổ phần pha loãng. Nhóm so sánh giao dịch ở trung vị 8,5× EV/EBITDA. (a) Tính giá trị mỗi cổ phần ngụ ý. (b) Công ty còn nắm 300 tỷ đồng các khoản đầu tư ngoài hoạt động kinh doanh. Giải thích điều này thay đổi đáp án ra sao và tính lại.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) EV ngụ ý = 8,5 × 750 = \u003cb>6.375 tỷ đồng\u003c/b>.\u003cbr>Giá trị vốn chủ = EV − nợ ròng − lợi ích cổ đông thiểu số = 6.375 − 1.500 − 200 = \u003cb>4.675 tỷ đồng\u003c/b>.\u003cbr>Giá trị mỗi cổ phần = 4.675 tỷ ÷ 400 triệu = \u003cb>11.688 đồng\u003c/b>.\u003c/p>\u003cp>(b) \u003cb>Tài sản ngoài hoạt động kinh doanh phải được cộng riêng.\u003c/b> Bội số EV/EBITDA đã được áp dụng lên EBITDA \u003cb>từ hoạt động kinh doanh\u003c/b>, nên giá trị doanh nghiệp mà nó tạo ra chỉ phản ánh \u003cb>hoạt động kinh doanh\u003c/b>. Các khoản đầu tư không tạo ra EBITDA — đất dư thừa, cổ phần thiểu số, danh mục đầu tư, tiền mặt dư — không đóng góp gì vào con số đó và nếu không sẽ bị định giá bằng 0, làm giảm giá trị công ty.\u003c/p>\u003cp>Giá trị vốn chủ điều chỉnh = 6.375 − 1.500 − 200 + 300 = \u003cb>4.975 tỷ đồng\u003c/b>.\u003cbr>Giá trị mỗi cổ phần điều chỉnh = 4.975 tỷ ÷ 400 triệu = \u003cb>12.438 đồng\u003c/b> — tăng 750 đồng mỗi cổ phần.\u003c/p>\u003cp>Nguyên tắc chung là cầu nối từ giá trị doanh nghiệp sang giá trị vốn chủ phải nắm bắt \u003cb>mọi\u003c/b> quyền đòi và tài sản ngoài hoạt động kinh doanh: trừ nợ ròng, lợi ích cổ đông thiểu số và cổ phần ưu đãi; cộng tài sản ngoài hoạt động kinh doanh và tiền mặt dư. Tính nhất quán là thiết yếu — mọi thu nhập mà các tài sản này tạo ra cũng phải được loại khỏi EBITDA, nếu không giá trị của chúng sẽ bị tính hai lần.\u003c/p>","rubricVi":"(a) EV, vốn chủ và giá mỗi cổ phần với việc trừ đúng lợi ích cổ đông thiểu số (1,3) · (b) lập luận rằng bội số chỉ định giá lợi nhuận từ hoạt động kinh doanh (0,9) · các con số tính lại (0,5) · lưu ý về tính nhất quán/tính hai lần (0,3)."},{"id":"H5-03","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what corporate governance is and three specific reforms that would raise a Vietnamese company's valuation before an IPO.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Corporate governance\u003c/b> is the system of rules, practices and processes by which a company is directed and controlled — how the interests of managers, controlling shareholders, minority shareholders, creditors and other stakeholders are balanced and enforced. Economically it determines how reliably the company's cash flows actually reach outside investors.\u003c/p>\u003cp>\u003cb>Three reforms.\u003c/b> (1) \u003cb>Appoint genuinely independent directors and separate the chair from the chief executive.\u003c/b> In a company with a dominant founder this is the single clearest signal that management can be challenged, and it directly addresses the concentration of power investors fear.\u003c/p>\u003cp>(2) \u003cb>Formalise or eliminate related-party transactions.\u003c/b> Dealings with entities connected to the controlling family are the principal channel through which value is diverted from minorities. Identifying them, unwinding those that are unnecessary and placing the remainder on documented arm's-length terms with independent approval removes the largest single source of investor discount.\u003c/p>\u003cp>(3) \u003cb>Strengthen audit and disclosure.\u003c/b> Appoint a reputable external auditor, establish an \u003cb>audit committee\u003c/b> with real authority and an internal audit function reporting to it, and build the capability for timely, accurate — ideally bilingual — reporting to international standards.\u003c/p>\u003cp>The commercial argument is direct: these measures close the \u003cb>governance discount\u003c/b>, so a higher multiple is achieved at IPO. The work pays for itself in the offer price.\u003c/p>","rubric":"Definition incl. the cash-flow-reaching-investors point (0.6) · three specific reforms (0.9) · explicit link to the governance discount and IPO pricing (0.5).","qVi":"Giải thích quản trị công ty là gì và ba cải cách cụ thể sẽ làm tăng định giá của một công ty Việt Nam trước khi IPO.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Quản trị công ty\u003c/b> là hệ thống các quy tắc, thông lệ và quy trình mà theo đó một công ty được định hướng và kiểm soát — cách lợi ích của ban điều hành, cổ đông kiểm soát, cổ đông thiểu số, chủ nợ và các bên liên quan khác được cân bằng và thực thi. Về kinh tế, nó quyết định mức độ đáng tin cậy mà dòng tiền của công ty thực sự đến được với nhà đầu tư bên ngoài.\u003c/p>\u003cp>\u003cb>Ba cải cách.\u003c/b> (1) \u003cb>Bổ nhiệm thành viên hội đồng quản trị độc lập thực chất và tách chủ tịch khỏi tổng giám đốc.\u003c/b> Trong một công ty có nhà sáng lập chi phối, đây là tín hiệu rõ ràng nhất rằng ban điều hành có thể bị phản biện, và nó xử lý trực tiếp sự tập trung quyền lực mà nhà đầu tư lo ngại.\u003c/p>\u003cp>(2) \u003cb>Chính thức hóa hoặc loại bỏ các giao dịch với bên liên quan.\u003c/b> Các giao dịch với những thực thể liên quan tới gia đình kiểm soát là kênh chính qua đó giá trị bị chuyển khỏi cổ đông thiểu số. Nhận diện chúng, gỡ bỏ những giao dịch không cần thiết và đưa phần còn lại về điều kiện thị trường có ghi chép, kèm phê duyệt độc lập, sẽ loại bỏ nguồn chiết khấu lớn nhất của nhà đầu tư.\u003c/p>\u003cp>(3) \u003cb>Tăng cường kiểm toán và công bố thông tin.\u003c/b> Bổ nhiệm một kiểm toán độc lập uy tín, thiết lập một \u003cb>ủy ban kiểm toán\u003c/b> có thẩm quyền thực và một chức năng kiểm toán nội bộ báo cáo lên ủy ban đó, và xây dựng năng lực báo cáo kịp thời, chính xác — lý tưởng là song ngữ — theo chuẩn mực quốc tế.\u003c/p>\u003cp>Lập luận thương mại rất trực tiếp: các biện pháp này khép lại \u003cb>chiết khấu quản trị\u003c/b>, nên một bội số cao hơn được đạt tại IPO. Công việc này tự nó sinh lời qua giá chào bán.\u003c/p>","rubricVi":"Định nghĩa gồm điểm về dòng tiền đến được với nhà đầu tư (0,6) · ba cải cách cụ thể (0,9) · liên hệ tường minh tới chiết khấu quản trị và giá IPO (0,5)."},{"id":"H5-04","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the trade-off theory of capital structure and why the optimal level of debt differs between a utility company and a software company.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Trade-off theory\u003c/b> holds that firm value rises with leverage because interest is \u003cb>tax-deductible\u003c/b>, creating a tax shield, and because debt is senior and therefore cheaper than equity — so WACC = (E/V)r\u003csub>e\u003c/sub> + (D/V)r\u003csub>d\u003c/sub>(1−t) initially falls. Beyond a point, expected \u003cb>financial-distress costs\u003c/b> — lost customers and suppliers, forced asset sales at a discount, management distraction, eventual bankruptcy costs — together with rising required returns on both debt and equity outweigh the shield, and WACC turns upward. The optimum is where the marginal tax benefit equals the marginal expected distress cost.\u003c/p>\u003cp>\u003cb>Why the optimum differs.\u003c/b> A \u003cb>utility\u003c/b> has highly predictable, regulated cash flows and large tangible, re-deployable assets that serve as collateral. The probability of distress at any given leverage is low and recovery in distress is high, so the expected cost of distress is small and the optimum sits at high leverage — utilities routinely carry substantial debt.\u003c/p>\u003cp>A \u003cb>software company\u003c/b> has volatile, less predictable revenue and few tangible assets: its value is in intangibles and people, which cannot easily be pledged and which \u003cb>evaporate\u003c/b> in distress as staff and customers leave. Both the probability and the cost of distress are high, and it may also have insufficient taxable profit to use the shield. Its optimum is therefore low or zero leverage — which is why such firms typically hold net cash.\u003c/p>","rubric":"Tax shield and WACC mechanics (0.6) · distress costs and the marginal condition (0.5) · utility case (0.4) · software case incl. intangible/human capital evaporating (0.5).","qVi":"Giải thích lý thuyết đánh đổi về cấu trúc vốn và vì sao mức nợ tối ưu khác nhau giữa một công ty tiện ích và một công ty phần mềm.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Lý thuyết đánh đổi\u003c/b> cho rằng giá trị doanh nghiệp tăng theo đòn bẩy vì lãi vay được \u003cb>khấu trừ thuế\u003c/b>, tạo ra lá chắn thuế, và vì nợ có thứ tự ưu tiên cao nên rẻ hơn vốn chủ — do đó WACC = (E/V)r\u003csub>e\u003c/sub> + (D/V)r\u003csub>d\u003c/sub>(1−t) ban đầu giảm. Vượt một điểm, \u003cb>chi phí kiệt quệ tài chính\u003c/b> dự kiến — mất khách hàng và nhà cung cấp, buộc bán tài sản với giá chiết khấu, ban điều hành bị phân tán, cuối cùng là chi phí phá sản — cùng với tỷ suất sinh lời đòi hỏi tăng lên trên cả nợ lẫn vốn chủ sẽ lấn át lá chắn thuế, và WACC quay đầu đi lên. Điểm tối ưu là nơi lợi ích thuế biên bằng chi phí kiệt quệ dự kiến biên.\u003c/p>\u003cp>\u003cb>Vì sao điểm tối ưu khác nhau.\u003c/b> Một \u003cb>công ty tiện ích\u003c/b> có dòng tiền rất dự đoán được, được điều tiết, và tài sản hữu hình lớn có thể tái sử dụng làm tài sản bảo đảm. Xác suất kiệt quệ ở bất kỳ mức đòn bẩy nào cũng thấp và mức thu hồi khi kiệt quệ thì cao, nên chi phí kiệt quệ dự kiến nhỏ và điểm tối ưu nằm ở mức đòn bẩy cao — các công ty tiện ích thường xuyên gánh nợ đáng kể.\u003c/p>\u003cp>Một \u003cb>công ty phần mềm\u003c/b> có doanh thu biến động, ít dự đoán được và ít tài sản hữu hình: giá trị của nó nằm ở tài sản vô hình và con người, những thứ không dễ đem cầm cố và \u003cb>bốc hơi\u003c/b> khi kiệt quệ vì nhân sự và khách hàng ra đi. Cả xác suất lẫn chi phí kiệt quệ đều cao, và công ty cũng có thể không đủ lợi nhuận chịu thuế để dùng lá chắn. Điểm tối ưu của nó do đó là đòn bẩy thấp hoặc bằng không — đó là lý do các doanh nghiệp như vậy thường giữ vị thế tiền mặt ròng.\u003c/p>","rubricVi":"Lá chắn thuế và cơ chế WACC (0,6) · chi phí kiệt quệ và điều kiện biên (0,5) · trường hợp công ty tiện ích (0,4) · trường hợp công ty phần mềm gồm việc tài sản vô hình/vốn con người bốc hơi (0,5)."},{"id":"H6-01","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the brokerage process from receipt of an order to settlement, and the duties the broker owes at each stage.","guide":"\u003cp>\u003cb>Model answer — process and duties.\u003c/b> (1) \u003cb>Account opening\u003c/b> — client identification, brokerage contract, risk profiling and registration with the depository. \u003ci>Duty:\u003c/i> know your client, and assess suitability for retail investors.\u003c/p>\u003cp>(2) \u003cb>Deposit\u003c/b> of funds and securities into designated accounts. \u003ci>Duty:\u003c/i> \u003cb>segregation\u003c/b> of client assets from the firm's own, so they are protected if the firm fails.\u003c/p>\u003cp>(3) \u003cb>Order receipt\u003c/b> — in person, by telephone or online, with verification of available purchasing power or securities balance. \u003ci>Duty:\u003c/i> accurate recording and an audit trail of the instruction.\u003c/p>\u003cp>(4) \u003cb>Order entry\u003c/b> into the exchange system. \u003ci>Duty:\u003c/i> \u003cb>client priority\u003c/b> — client orders ahead of the firm's own, with no front-running — and prompt, accurate entry.\u003c/p>\u003cp>(5) \u003cb>Matching\u003c/b> by the exchange under price-then-time priority, and confirmation to the client. \u003ci>Duty:\u003c/i> \u003cb>best execution\u003c/b>, taking reasonable steps to obtain the most favourable available terms.\u003c/p>\u003cp>(6) \u003cb>Clearing and settlement\u003c/b> through the depository on the T+n cycle. \u003ci>Duty:\u003c/i> timely settlement and correct handling of the client's assets.\u003c/p>\u003cp>(7) \u003cb>Reporting\u003c/b> — confirmations and account statements. \u003ci>Duty:\u003c/i> accurate, timely reporting and confidentiality of client information throughout.\u003c/p>","rubric":"Seven stages in correct order (1.0) · a correct duty attached to at least five stages (0.8) · confidentiality or audit trail mentioned (0.2).","qVi":"Giải thích quy trình môi giới từ khi nhận lệnh tới thanh toán, và các nghĩa vụ mà công ty môi giới phải thực hiện ở mỗi bước.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — quy trình và nghĩa vụ.\u003c/b> (1) \u003cb>Mở tài khoản\u003c/b> — nhận diện khách hàng, hợp đồng môi giới, lập hồ sơ rủi ro và đăng ký với trung tâm lưu ký. \u003ci>Nghĩa vụ:\u003c/i> hiểu rõ khách hàng, và đánh giá tính phù hợp đối với nhà đầu tư cá nhân.\u003c/p>\u003cp>(2) \u003cb>Nộp\u003c/b> tiền và chứng khoán vào các tài khoản được chỉ định. \u003ci>Nghĩa vụ:\u003c/i> \u003cb>tách bạch\u003c/b> tài sản khách hàng khỏi tài sản của công ty, để chúng được bảo vệ nếu công ty đổ vỡ.\u003c/p>\u003cp>(3) \u003cb>Nhận lệnh\u003c/b> — trực tiếp, qua điện thoại hoặc trực tuyến, có kiểm tra sức mua khả dụng hoặc số dư chứng khoán. \u003ci>Nghĩa vụ:\u003c/i> ghi nhận chính xác và có dấu vết kiểm toán về chỉ thị.\u003c/p>\u003cp>(4) \u003cb>Nhập lệnh\u003c/b> vào hệ thống của sở giao dịch. \u003ci>Nghĩa vụ:\u003c/i> \u003cb>ưu tiên khách hàng\u003c/b> — lệnh khách hàng trước lệnh của chính công ty, không giao dịch chạy trước lệnh — và nhập lệnh kịp thời, chính xác.\u003c/p
