ẫu.\u003c/b> \u003cb>Bên riêng tư\u003c/b> gồm nhân sự khối ngân hàng đầu tư nhận thông tin trọng yếu chưa công bố (MNPI) từ khách hàng — chẳng hạn hiểu biết về một thương vụ thâu tóm hoặc phát hành chưa công bố. \u003cb>Bên công khai\u003c/b> gồm nhân sự nghiên cứu, bán hàng và giao dịch, những người chỉ được hành động dựa trên thông tin đã công khai.\u003c/p>\u003cp>\u003cb>Ba biện pháp kiểm soát.\u003c/b> (1) \u003cb>Phân tách vật lý và hệ thống\u003c/b> — sàn làm việc riêng, khu vực kiểm soát ra vào và phân quyền công nghệ thông tin tách biệt để hồ sơ bên riêng tư không thể bị nhân sự bên công khai tiếp cận. (2) \u003cb>Danh sách hạn chế và danh sách theo dõi\u003c/b> do phòng kiểm soát duy trì, cấm công bố nghiên cứu và tự doanh đối với các chứng khoán liên quan. (3) \u003cb>Thủ tục vượt tường\u003c/b> — một quy trình có ghi chép, giới hạn thời gian, qua đó một nhân sự bên công khai được cố ý biến thành người nội bộ và bị áp đặt hạn chế giao dịch cho tới khi thông tin được công khai. Các biện pháp hỗ trợ gồm giám sát giao dịch quanh thời điểm công bố, quy tắc giao dịch tài khoản cá nhân và đào tạo nhân sự.\u003c/p>","rubricVi":"Định nghĩa đúng cả hai bên với MNPI (0,8) · ba biện pháp kiểm soát thực sự (1,0) · một biện pháp hỗ trợ hoặc lý do (0,2)."},{"id":"G1-02","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the role of investment banks for enterprises, for investors and for the economy.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>For enterprises:\u003c/b> they enable efficient capital raising through the issuance of shares and bonds, and they advise and support restructuring, listing and M&A, thereby increasing competitiveness. \u003cb>For investors:\u003c/b> they supply research products and services, securities brokerage and investment advice, and asset-management vehicles that give access to diversification and professional management. \u003cb>For the economy:\u003c/b> they support the smooth circulation of capital from savers to those who can deploy it productively, improve price discovery and market liquidity, and thereby contribute to economic development.\u003c/p>\u003cp>The unifying point is intermediation: the bank reduces the information and transaction costs that would otherwise prevent savings reaching productive investment.\u003c/p>","rubric":"Three constituencies with at least two roles each (1.5) · unifying intermediation insight (0.5).","qVi":"Giải thích vai trò của ngân hàng đầu tư đối với doanh nghiệp, đối với nhà đầu tư và đối với nền kinh tế.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Đối với doanh nghiệp:\u003c/b> giúp huy động vốn hiệu quả qua phát hành cổ phiếu và trái phiếu, đồng thời tư vấn và hỗ trợ tái cấu trúc, niêm yết và M&A, qua đó nâng cao năng lực cạnh tranh. \u003cb>Đối với nhà đầu tư:\u003c/b> cung cấp sản phẩm và dịch vụ nghiên cứu, môi giới chứng khoán và tư vấn đầu tư, cùng các công cụ quản lý tài sản cho phép tiếp cận sự đa dạng hóa và quản lý chuyên nghiệp. \u003cb>Đối với nền kinh tế:\u003c/b> hỗ trợ dòng vốn luân chuyển thông suốt từ người tiết kiệm tới người có thể sử dụng nó hiệu quả, cải thiện việc khám phá giá và thanh khoản thị trường, qua đó góp phần phát triển kinh tế.\u003c/p>\u003cp>Điểm thống nhất là chức năng trung gian: ngân hàng giảm chi phí thông tin và giao dịch — thứ nếu không sẽ cản trở tiết kiệm đến được với đầu tư hiệu quả.\u003c/p>","rubricVi":"Ba nhóm đối tượng với ít nhất hai vai trò mỗi nhóm (1,5) · nhận thức thống nhất về vai trò trung gian (0,5)."},{"id":"G1-03","ch":1,"type":"case","clo":"CLO1","marks":3,"exam":"final","q":"A securities company's research head is told by the CEO that a 'sell' rating on a company the firm is about to advise on an IPO would be 'unhelpful'. Analyse the issues and state what should happen.","guide":"\u003cp>\u003cb>Model answer — issues.\u003c/b> This is the classic \u003cb>research–investment banking conflict\u003c/b>. The pressure asks the analyst to subordinate an independent judgement to the firm's fee interest, which breaches \u003cb>Independence and Objectivity\u003c/b> and, if a misleading rating is published, \u003cb>Misrepresentation\u003c/b> and the duty of a reasonable basis. Investors relying on the report would be misled; the firm faces regulatory sanction, civil liability and severe reputational damage. Historically this conduct produced the global analyst settlements and the current separation rules.\u003c/p>\u003cp>\u003cb>What should happen.\u003c/b> The rating must be determined solely by the analysis and its documented basis. Structurally: research reporting lines and compensation must be separate from banking revenue; bankers must not review or approve ratings before publication; the security should go on the \u003cb>restricted list\u003c/b> once the firm is mandated, suspending research rather than altering it; any banking relationship must be \u003cb>disclosed\u003c/b> in the report. The research head should decline, document the approach, and escalate to compliance — which should treat an instruction of this kind as a reportable incident. If the firm's culture makes this untenable, the analyst's obligation remains to the integrity of the analysis, not to the mandate.\u003c/p>","rubric":"Conflict correctly identified with the standards engaged (1.0) · consequences for investors and firm (0.6) · structural remedies incl. restricted list and disclosure (1.0) · escalation/documentation (0.4).","qVi":"Trưởng bộ phận nghiên cứu của một công ty chứng khoán được tổng giám đốc nói rằng khuyến nghị 'bán' đối với một công ty mà công ty sắp tư vấn IPO sẽ là 'không hữu ích'. Phân tích các vấn đề và nêu điều nên xảy ra.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các vấn đề.\u003c/b> Đây là \u003cb>xung đột kinh điển giữa nghiên cứu và ngân hàng đầu tư\u003c/b>. Áp lực này đòi chuyên viên phân tích đặt phán đoán độc lập dưới lợi ích phí của công ty, vi phạm \u003cb>Tính độc lập và khách quan\u003c/b> và, nếu công bố một khuyến nghị gây hiểu lầm, vi phạm \u003cb>Nghĩa vụ không trình bày sai\u003c/b> và nghĩa vụ có cơ sở hợp lý. Nhà đầu tư tin vào báo cáo sẽ bị đánh lừa; công ty đối mặt chế tài của cơ quan quản lý, trách nhiệm dân sự và tổn hại danh tiếng nghiêm trọng. Trong lịch sử, hành vi kiểu này đã dẫn tới các dàn xếp toàn cầu về chuyên viên phân tích và các quy tắc tách bạch hiện hành.\u003c/p>\u003cp>\u003cb>Điều nên xảy ra.\u003c/b> Khuyến nghị phải được quyết định hoàn toàn bởi phân tích và cơ sở được ghi chép của nó. Về mặt cấu trúc: tuyến báo cáo và thù lao của nghiên cứu phải tách khỏi doanh thu ngân hàng đầu tư; chuyên viên tư vấn không được xem hay phê duyệt khuyến nghị trước khi công bố; chứng khoán nên được đưa vào \u003cb>danh sách hạn chế\u003c/b> ngay khi công ty nhận hợp đồng, tạm dừng nghiên cứu chứ không sửa đổi nó; mọi quan hệ ngân hàng đầu tư phải được \u003cb>công bố\u003c/b> trong báo cáo. Trưởng bộ phận nghiên cứu nên từ chối, ghi chép lại cách tiếp cận, và báo cáo lên tuân thủ — bộ phận này nên coi một chỉ đạo kiểu này là một sự cố phải báo cáo. Nếu văn hóa công ty khiến điều này bất khả thi, nghĩa vụ của chuyên viên phân tích vẫn là với sự liêm chính của phân tích, không phải với hợp đồng.\u003c/p>","rubricVi":"Nhận diện đúng xung đột với các chuẩn mực liên quan (1,0) · hệ quả cho nhà đầu tư và công ty (0,6) · biện pháp cấu trúc gồm danh sách hạn chế và công bố (1,0) · báo cáo/ghi chép (0,4)."},{"id":"G1-04","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain why the 2008 crisis ended the independent Wall Street investment bank model.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The model depended on \u003cb>high leverage funded by short-term secured borrowing\u003c/b> against securities collateral. When asset values became uncertain in 2007–08, two things failed simultaneously: the collateral ceased to be reliably liquid, and counterparties lost confidence in the firms' names. Repo funding therefore evaporated within days — a classic run, but on a wholesale rather than a retail liability.\u003c/p>\u003cp>Because these firms had no deposit base and no access to central-bank liquidity, they had no lender of last resort. The outcomes followed directly: \u003cb>Bear Stearns\u003c/b> was absorbed by JPMorgan, \u003cb>Lehman Brothers\u003c/b> failed, \u003cb>Merrill Lynch\u003c/b> was acquired by Bank of America, and \u003cb>Goldman Sachs\u003c/b> and \u003cb>Morgan Stanley\u003c/b> converted into \u003cb>bank holding companies\u003c/b> — accepting Federal Reserve supervision and tighter capital and liquidity rules in exchange for access to its facilities.\u003c/p>\u003cp>The lesson is structural: an institution funding illiquid or opaque assets with very short-term borrowing is solvent only while the market believes it is.\u003c/p>","rubric":"Leverage plus short-term secured funding identified as the vulnerability (0.8) · absence of a lender of last resort (0.4) · the five outcomes (0.6) · structural lesson (0.2).","qVi":"Giải thích vì sao khủng hoảng 2008 chấm dứt mô hình ngân hàng đầu tư độc lập của Phố Wall.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Mô hình này phụ thuộc vào \u003cb>đòn bẩy cao được tài trợ bằng vay ngắn hạn có bảo đảm\u003c/b> đối ứng với tài sản bảo đảm là chứng khoán. Khi giá trị tài sản trở nên bất định trong giai đoạn 2007–08, hai điều đổ vỡ cùng lúc: tài sản bảo đảm không còn thanh khoản đáng tin cậy, và đối tác mất niềm tin vào tên tuổi của các định chế. Vốn repo do đó bốc hơi trong vài ngày — một vụ tháo chạy kinh điển, nhưng đối với nghĩa vụ nợ bán buôn thay vì bán lẻ.\u003c/p>\u003cp>Vì các định chế này không có nền tiền gửi và không tiếp cận được thanh khoản của ngân hàng trung ương, họ không có người cho vay cuối cùng. Kết cục nối tiếp trực tiếp: \u003cb>Bear Stearns\u003c/b> bị JPMorgan thâu tóm, \u003cb>Lehman Brothers\u003c/b> sụp đổ, \u003cb>Merrill Lynch\u003c/b> bị Bank of America mua lại, và \u003cb>Goldman Sachs\u003c/b> cùng \u003cb>Morgan Stanley\u003c/b> chuyển thành \u003cb>công ty mẹ ngân hàng\u003c/b> — chấp nhận sự giám sát của Cục Dự trữ Liên bang và các quy tắc chặt hơn về vốn và thanh khoản để đổi lấy quyền tiếp cận các công cụ của cơ quan này.\u003c/p>\u003cp>Bài học mang tính cấu trúc: một định chế tài trợ cho tài sản kém thanh khoản hoặc mờ đục bằng vay rất ngắn hạn chỉ có khả năng thanh toán chừng nào thị trường còn tin rằng nó có.\u003c/p>","rubricVi":"Xác định đòn bẩy cộng tài trợ ngắn hạn có bảo đảm là điểm yếu (0,8) · thiếu người cho vay cuối cùng (0,4) · năm kết cục (0,6) · bài học cấu trúc (0,2)."},{"id":"G2-01","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain the greenshoe (over-allotment) option: how it works, and why it stabilises the aftermarket without exposing the underwriter to loss.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The greenshoe permits underwriters to allot up to \u003cb>15% more shares\u003c/b> than the base deal. To do so they sell short — allocating shares they do not yet hold — creating a short position equal to the over-allotment.\u003c/p>\u003cp>\u003cb>If the price falls\u003c/b> below the offer price after listing, the underwriters buy shares \u003cb>in the market\u003c/b> to cover the short. That buying supports the price, and because they repurchase below the offer price at which they sold, the covering is profitable rather than loss-making. \u003cb>If the price rises\u003c/b>, buying in the market would be costly, so instead they \u003cb>exercise the option\u003c/b> and take the additional shares from the issuer at the offer price, covering the short at exactly the price at which they sold.\u003c/p>\u003cp>Either way the short is covered at or below the sale price, so the underwriter is not exposed — which is precisely why it can afford to support the price. The issuer benefits from a more orderly aftermarket, and receives additional proceeds if the option is exercised.\u003c/p>","rubric":"15% and the short position (0.6) · both price scenarios handled correctly (0.9) · explicit reason there is no loss exposure (0.5).","qVi":"Giải thích quyền chọn greenshoe (vượt mức): cách nó vận hành, và vì sao nó bình ổn thị trường thứ cấp mà không khiến nhà bảo lãnh chịu lỗ.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Greenshoe cho phép nhà bảo lãnh phân bổ thêm tối đa \u003cb>15% cổ phần\u003c/b> so với thương vụ cơ bản. Để làm vậy họ bán khống — phân bổ cổ phần chưa nắm giữ — tạo ra một vị thế bán bằng phần vượt mức.\u003c/p>\u003cp>\u003cb>Nếu giá rơi\u003c/b> xuống dưới giá chào bán sau niêm yết, nhà bảo lãnh mua cổ phần \u003cb>trên thị trường\u003c/b> để đóng vị thế bán. Việc mua đó đỡ giá, và vì họ mua lại dưới giá chào bán mà họ đã bán, việc đóng vị thế có lãi chứ không lỗ. \u003cb>Nếu giá tăng\u003c/b>, mua trên thị trường sẽ tốn kém, nên thay vào đó họ \u003cb>thực hiện quyền chọn\u003c/b> và nhận cổ phần bổ sung từ tổ chức phát hành ở giá chào bán, đóng vị thế bán đúng bằng giá họ đã bán.\u003c/p>\u003cp>Trong cả hai trường hợp, vị thế bán được đóng ở mức giá bằng hoặc thấp hơn giá bán, nên nhà bảo lãnh không bị rủi ro — đó chính là lý do họ có thể đỡ giá. Tổ chức phát hành hưởng lợi từ một thị trường thứ cấp trật tự hơn, và nhận thêm tiền thu nếu quyền chọn được thực hiện.\u003c/p>","rubricVi":"15% và vị thế bán (0,6) · xử lý đúng cả hai kịch bản giá (0,9) · nêu rõ lý do không có rủi ro lỗ (0,5)."},{"id":"G2-02","ch":2,"type":"calc-essay","clo":"CLO1","marks":3,"exam":"final","q":"A company with 60 million shares outstanding trading at VND 45,000 announces a 1-for-3 rights issue at VND 30,000. (a) Compute the funds raised, the TERP and the value of a right. (b) A shareholder owns 3,000 shares. Show that subscribing and selling the rights leave them equally well off.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) New shares = 60m ÷ 3 = \u003cb>20m\u003c/b>; funds raised = 20m × 30,000 = \u003cb>VND 600bn\u003c/b>.\u003cbr>TERP = (3 × 45,000 + 1 × 30,000) ÷ 4 = 165,000 ÷ 4 = \u003cb>VND 41,250\u003c/b>.\u003cbr>Value of a right = 45,000 − 41,250 = \u003cb>VND 3,750\u003c/b>.\u003c/p>\u003cp>(b) The shareholder starts with 3,000 × 45,000 = \u003cb>VND 135m\u003c/b> and is entitled to 1,000 new shares.\u003c/p>\u003cp>\u003ci>Subscribe:\u003c/i> pays 1,000 × 30,000 = VND 30m, then holds 4,000 shares at TERP 41,250 = VND 165m. Net position = 165 − 30 = \u003cb>VND 135m\u003c/b>.\u003c/p>\u003cp>\u003ci>Sell the rights:\u003c/i> keeps 3,000 shares at 41,250 = VND 123.75m, plus 1,000 rights sold at 3,750 = VND 3.75m. Total = \u003cb>VND 127.5m\u003c/b>… plus the VND 7.5m of cash not spent is not applicable here, so the correct comparison is wealth held: 123.75 + 3.75 = \u003cb>VND 127.5m\u003c/b> against an original 135m — the shortfall of 7.5m is exactly the VND 30m they chose not to invest less the 22.5m of value that investment would have carried. Expressed properly: in both cases the shareholder's wealth \u003ci>excluding\u003c/i> the new cash they choose to commit is 127.5m + (30m committed → 37.5m of share value), i.e. neither route creates or destroys value; only the shareholder who does \u003cb>nothing\u003c/b> loses, forfeiting the VND 3.75m per right.\u003c/p>","rubric":"(a) three figures correct (1.5) · (b) both routes worked with consistent wealth comparison (1.0) · conclusion that only inaction destroys value (0.5).","qVi":"Một công ty có 60 triệu cổ phần đang lưu hành giao dịch ở 45.000 đồng công bố phát hành quyền mua tỷ lệ 1:3 ở giá 30.000 đồng. (a) Tính số tiền huy động, TERP và giá trị một quyền. (b) Một cổ đông sở hữu 3.000 cổ phần. Chứng minh rằng đăng ký mua và bán quyền để họ ở vị thế tài sản như nhau.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Cổ phần mới = 60 triệu ÷ 3 = \u003cb>20 triệu\u003c/b>; số tiền huy động = 20 triệu × 30.000 = \u003cb>600 tỷ đồng\u003c/b>.\u003cbr>TERP = (3 × 45.000 + 1 × 30.000) ÷ 4 = 165.000 ÷ 4 = \u003cb>41.250 đồng\u003c/b>.\u003cbr>Giá trị một quyền = 45.000 − 41.250 = \u003cb>3.750 đồng\u003c/b>.\u003c/p>\u003cp>(b) Cổ đông khởi đầu với 3.000 × 45.000 = \u003cb>135 triệu đồng\u003c/b> và được quyền mua 1.000 cổ phần mới.\u003c/p>\u003cp>\u003ci>Đăng ký mua:\u003c/i> trả 1.000 × 30.000 = 30 triệu, sau đó nắm 4.000 cổ phần theo TERP 41.250 = 165 triệu. Vị thế ròng = giá trị cổ phần 165 triệu, đã bỏ ra 30 triệu tiền mặt mới, nên tài sản gốc còn lại = 165 − 30 = \u003cb>135 triệu đồng\u003c/b>.\u003c/p>\u003cp>\u003ci>Bán quyền:\u003c/i> giữ 3.000 cổ phần theo TERP 41.250 = 123,75 triệu, cộng 1.000 quyền bán ở 3.750 = 3,75 triệu. Tổng tài sản = 123,75 + 3,75 = \u003cb>127,5 triệu đồng\u003c/b>, cộng với 7,5 triệu tiền mặt không phải bỏ ra để mua (so với phương án đăng ký) → tổng bằng 135 triệu.\u003c/p>\u003cp>Kết luận: cả hai phương án đều bảo toàn tài sản của cổ đông ở mức 135 triệu (khi tính cả tiền mặt không dùng đến); chỉ cổ đông \u003cb>không làm gì\u003c/b> bị thiệt, đánh mất 3.750 đồng mỗi quyền.\u003c/p>","rubricVi":"(a) ba con số đúng (1,5) · (b) trình bày cả hai phương án với so sánh tài sản nhất quán (1,0) · kết luận chỉ sự thụ động mới phá hủy giá trị (0,5)."},{"id":"G2-03","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Distinguish the three pricing methods for a share offering and state when each is appropriate.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Fixed price:\u003c/b> the price is set and published before subscription opens. It is simple, transparent and cheap, suiting small offerings, retail-oriented deals and markets where institutional demand cannot be reliably gathered — but it is set blind to demand and therefore risks mispricing in either direction.\u003c/p>\u003cp>\u003cb>Bookbuilding:\u003c/b> underwriters market a price range and collect price-and-quantity indications from institutions, building a demand curve from which the final price and allocations are set. It gives the best price discovery and allocation control, and is the standard for offerings of size, at the cost of time, expense and the underwriter's discretion over who receives shares.\u003c/p>\u003cp>\u003cb>Auction:\u003c/b> investors submit bids and shares are allocated from the highest bid downward. It maximises transparency and reduces underwriter discretion and underpricing, but it can deter institutional investors who receive no allocation preference, and demand can be erratic without a marketing process.\u003c/p>","rubric":"Three methods correctly described (1.2) · appropriate circumstances for each (0.6) · a genuine drawback of each (0.2).","qVi":"Phân biệt ba phương pháp định giá cho một đợt chào bán cổ phần và nêu khi nào mỗi phương pháp là phù hợp.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Giá cố định:\u003c/b> giá được ấn định và công bố trước khi mở đăng ký. Nó đơn giản, minh bạch và rẻ, phù hợp với các đợt chào bán nhỏ, thiên về nhà đầu tư cá nhân và các thị trường nơi không thể thu thập đáng tin cậy nhu cầu tổ chức — nhưng nó được đặt mà không thấy nhu cầu nên có nguy cơ định giá sai theo cả hai hướng.\u003c/p>\u003cp>\u003cb>Dựng sổ:\u003c/b> nhà bảo lãnh tiếp thị một khoảng giá và thu thập chỉ báo về giá và khối lượng từ các tổ chức, dựng một đường cầu từ đó ấn định giá cuối cùng và các phân bổ. Nó cho việc khám phá giá và kiểm soát phân bổ tốt nhất, và là chuẩn cho các đợt chào bán có quy mô, đổi lại là thời gian, chi phí và quyền tùy nghi của nhà bảo lãnh về việc ai nhận cổ phần.\u003c/p>\u003cp>\u003cb>Đấu giá:\u003c/b> nhà đầu tư nộp giá đặt và cổ phần được phân bổ từ mức giá cao nhất trở xuống. Nó tối đa hóa minh bạch và giảm quyền tùy nghi của nhà bảo lãnh cùng mức định giá thấp, nhưng có thể làm nản lòng các nhà đầu tư tổ chức vốn không được ưu tiên phân bổ, và nhu cầu có thể thất thường khi không có quá trình tiếp thị.\u003c/p>","rubricVi":"Mô tả đúng ba phương pháp (1,2) · hoàn cảnh phù hợp cho mỗi phương pháp (0,6) · một nhược điểm thực sự của mỗi phương pháp (0,2)."},{"id":"G2-04","ch":2,"type":"case","clo":"CLO1","marks":3,"exam":"final","q":"A profitable family company needs capital to fund expansion. Compare a bank loan, a private placement and an IPO, and recommend a route with reasons.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Bank loan:\u003c/b> fastest and cheapest to arrange, no ownership dilution and no public disclosure — but it creates fixed obligations, requires security and covenants, is limited in size by debt capacity, and increases financial risk in a downturn. Suitable where the amount is moderate and cash flows are stable and predictable.\u003c/p>\u003cp>\u003cb>Private placement:\u003c/b> raises equity without public disclosure, is quicker and cheaper than an IPO, and can introduce a strategic investor bringing expertise, governance and market access. Costs are a lower price (an illiquidity discount and no competitive price discovery), a concentrated new shareholder with negotiated protective rights, and some loss of autonomy. Suitable where the family wants growth capital and outside expertise but is not ready for public scrutiny.\u003c/p>\u003cp>\u003cb>IPO:\u003c/b> gives access to the largest pool of capital, an observable market price, liquidity for the family and shares usable as acquisition and incentive currency. Costs are the highest: listing and continuing compliance expense, extensive continuous disclosure, pressure for short-term results, dilution and takeover exposure, and a demanding readiness programme.\u003c/p>\u003cp>\u003cb>Recommendation.\u003c/b> For a first significant expansion I would recommend a \u003cb>private placement to a strategic investor\u003c/b>, with a bank facility alongside if cash flows support it. It raises equity without the cost and disclosure burden of listing, and the discipline of an institutional shareholder — audited accounts, a functioning board, cleaned-up related-party transactions — is precisely the preparation an IPO later requires. The family retains control now and preserves the listing option, having already closed much of the governance discount. The decision should turn on the amount required, the family's tolerance for disclosure and dilution, and whether it can currently meet listing conditions.\u003c/p>","rubric":"Three routes with balanced advantages and drawbacks (1.5) · reasoned recommendation (0.8) · decision criteria stated (0.7).","qVi":"Một công ty gia đình làm ăn có lãi cần vốn để tài trợ mở rộng. So sánh vay ngân hàng, chào bán riêng lẻ và IPO, và khuyến nghị một hướng đi kèm lý do.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Vay ngân hàng:\u003c/b> nhanh và rẻ nhất để thu xếp, không pha loãng sở hữu và không phải công bố công khai — nhưng tạo ra nghĩa vụ cố định, cần tài sản bảo đảm và điều khoản ràng buộc, bị giới hạn quy mô bởi năng lực vay nợ, và làm tăng rủi ro tài chính khi suy thoái. Phù hợp khi số tiền vừa phải và dòng tiền ổn định, dự đoán được.\u003c/p>\u003cp>\u003cb>Chào bán riêng lẻ:\u003c/b> huy động vốn chủ mà không phải công bố công khai, nhanh và rẻ hơn IPO, và có thể đưa vào một nhà đầu tư chiến lược mang lại chuyên môn, quản trị và khả năng tiếp cận thị trường. Chi phí là giá thấp hơn (chiết khấu thanh khoản và không có khám phá giá cạnh tranh), một cổ đông mới tập trung với các quyền bảo vệ được thương lượng, và mất một phần tự chủ. Phù hợp khi gia đình muốn vốn tăng trưởng và chuyên môn bên ngoài nhưng chưa sẵn sàng cho sự giám sát công khai.\u003c/p>\u003cp>\u003cb>IPO:\u003c/b> cho tiếp cận nguồn vốn lớn nhất, một mức giá thị trường quan sát được, thanh khoản cho gia đình và cổ phần dùng làm phương tiện thâu tóm và khích lệ. Chi phí cao nhất: chi phí niêm yết và tuân thủ liên tục, công bố liên tục sâu rộng, áp lực về kết quả ngắn hạn, pha loãng và rủi ro bị thâu tóm, và một chương trình chuẩn bị đòi hỏi khắt khe.\u003c/p>\u003cp>\u003cb>Khuyến nghị.\u003c/b> Với lần mở rộng lớn đầu tiên, tôi khuyến nghị \u003cb>chào bán riêng lẻ cho một nhà đầu tư chiến lược\u003c/b>, kèm một hạn mức vay ngân hàng nếu dòng tiền cho phép. Nó huy động vốn chủ mà không gánh chi phí và nghĩa vụ công bố của niêm yết, và kỷ luật của một cổ đông tổ chức — báo cáo được kiểm toán, một hội đồng quản trị vận hành, làm sạch các giao dịch với bên liên quan — chính là sự chuẩn bị mà IPO về sau đòi hỏi. Gia đình vẫn giữ kiểm soát bây giờ và bảo toàn lựa chọn niêm yết, khi đã khép lại phần lớn khoảng chiết khấu do quản trị. Quyết định nên tùy thuộc số tiền cần, khả năng chịu đựng công bố và pha loãng của gia đình, và liệu công ty hiện có đáp ứng được điều kiện niêm yết hay không.\u003c/p>","rubricVi":"Ba hướng đi với lợi thế và nhược điểm cân bằng (1,5) · khuyến nghị có lập luận (0,8) · nêu tiêu chí quyết định (0,7)."},{"id":"G3-01","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain what synergies are, distinguish cost from revenue synergies, and explain how synergies should be treated in valuing a target.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Synergies\u003c/b> are the value created by combining two businesses that neither could achieve alone — the amount by which the combined entity is worth more than the sum of the parts.\u003c/p>\u003cp>\u003cb>Cost synergies\u003c/b> come from removing duplication: overlapping head-office and administrative functions, combined procurement volume, consolidated facilities and distribution, and shared systems. They are largely within management's control, can be scheduled, and are therefore comparatively reliable. \u003cb>Revenue synergies\u003c/b> come from cross-selling, wider distribution, bundled offerings and pricing power. They depend on customer behaviour and competitor response, are slower to appear, and are routinely discounted heavily — often to near zero — by the market.\u003c/p>\u003cp>\u003cb>Treatment in valuation.\u003c/b> Value the target \u003cb>standalone\u003c/b> first, then value the synergies separately, net of the \u003cb>costs to achieve\u003c/b> them (restructuring, redundancy, systems integration) and on a realistic phasing, discounted to present value. The premium offered is then tested against that present value: the deal creates value for the acquirer only if PV(synergies) exceeds the premium. Because synergies are the acquirer's contribution, disciplined buyers avoid paying the seller for all of them.\u003c/p>","rubric":"Definition (0.4) · cost vs revenue with reliability contrast (0.8) · standalone-plus-synergy method, costs to achieve, and the premium test (0.8).","qVi":"Giải thích cộng hưởng là gì, phân biệt cộng hưởng chi phí với cộng hưởng doanh thu, và giải thích cộng hưởng nên được xử lý thế nào khi định giá công ty mục tiêu.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Cộng hưởng\u003c/b> là giá trị được tạo ra từ việc kết hợp hai doanh nghiệp mà không bên nào tự đạt được — phần mà thực thể hợp nhất có giá trị cao hơn tổng các bộ phận.\u003c/p>\u003cp>\u003cb>Cộng hưởng chi phí\u003c/b> đến từ việc loại bỏ trùng lặp: các chức năng trụ sở và hành chính chồng chéo, gộp khối lượng mua sắm, hợp nhất cơ sở vật chất và phân phối, và dùng chung hệ thống. Chúng phần lớn trong tầm kiểm soát của ban điều hành, có thể lên lịch, và do đó tương đối đáng tin cậy. \u003cb>Cộng hưởng doanh thu\u003c/b> đến từ bán chéo, phân phối rộng hơn, gói sản phẩm và sức mạnh định giá. Chúng phụ thuộc hành vi khách hàng và phản ứng của đối thủ, xuất hiện chậm hơn, và thường bị thị trường chiết khấu mạnh — thường về gần bằng không.\u003c/p>\u003cp>\u003cb>Xử lý trong định giá.\u003c/b> Định giá công ty mục tiêu \u003cb>độc lập\u003c/b> trước, rồi định giá cộng hưởng riêng, trừ đi \u003cb>chi phí để đạt được\u003c/b> chúng (tái cấu trúc, cắt giảm nhân sự, tích hợp hệ thống) và theo một lộ trình thực tế, chiết khấu về giá trị hiện tại. Mức thặng dư chào ra sau đó được kiểm định trước giá trị hiện tại đó: thương vụ chỉ tạo giá trị cho bên thâu tóm nếu PV(cộng hưởng) vượt mức thặng dư. Vì cộng hưởng là đóng góp của bên thâu tóm, người mua có kỷ luật tránh trả cho bên bán toàn bộ phần đó.\u003c/p>","rubricVi":"Định nghĩa (0,4) · so sánh chi phí và doanh thu với độ tin cậy (0,8) · phương pháp độc lập cộng cộng hưởng, chi phí để đạt được, và phép kiểm định thặng dư (0,8)."},{"id":"G3-02","ch":3,"type":"calc-essay","clo":"CLO1","marks":3,"exam":"midterm","q":"Company A (P/E 20×, EPS VND 2,500, 100m shares) acquires Company B (net income VND 200bn) in an all-share deal at a P/E of 15×. Ignore synergies. (a) Compute the purchase price and shares issued. (b) Compute pro forma EPS and the accretion. (c) Explain the result using the P/E rule.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A's share price = 20 × 2,500 = \u003cb>VND 50,000\u003c/b>; A's net income = 2,500 × 100m = \u003cb>VND 250bn\u003c/b>.\u003c/p>\u003cp>(a) Purchase price = 15 × 200bn = \u003cb>VND 3,000bn\u003c/b>. Shares issued = 3,000bn ÷ 50,000 = \u003cb>60m shares\u003c/b>.\u003c/p>\u003cp>(b) Pro forma net income = 250 + 200 = \u003cb>VND 450bn\u003c/b>. Pro forma shares = 100 + 60 = \u003cb>160m\u003c/b>.\u003cbr>Pro forma EPS = 450bn ÷ 160m = \u003cb>VND 2,812.5\u003c/b>.\u003cbr>Accretion = 2,812.5 ÷ 2,500 − 1 = \u003cb>+12.5% accretive\u003c/b>.\u003c/p>\u003cp>(c) \u003cb>P/E rule.\u003c/b> In an all-share transaction with no synergies, the deal is accretive whenever the acquirer's own P/E \u003cb>exceeds\u003c/b> the P/E it pays. Here A trades at 20× and pays 15×, so it issues shares the market values at 20 times earnings in order to buy earnings costing only 15 times — each new share brings in more earnings than it dilutes. The 12.5% accretion follows arithmetically from the 20× versus 15× gap.\u003c/p>\u003cp>The caution is that this is an \u003cb>accounting\u003c/b> outcome, not proof of value creation: no synergies were assumed, so nothing real was created. A high-multiple acquirer can manufacture EPS growth simply by issuing paper for lower-multiple earnings — which is why analysts test whether the target's growth and quality genuinely justify the multiple paid.\u003c/p>","rubric":"(a) price and shares (1.0) · (b) pro forma EPS and accretion (1.2) · (c) P/E rule applied and the accretion≠value caveat (0.8).","qVi":"Công ty A (P/E 20×, EPS 2.500 đồng, 100 triệu cổ phần) thâu tóm Công ty B (lợi nhuận ròng 200 tỷ đồng) trong một thương vụ hoàn toàn bằng cổ phần ở P/E 15×. Bỏ qua cộng hưởng. (a) Tính giá mua và số cổ phần phát hành. (b) Tính EPS hợp nhất và mức tăng lãi. (c) Giải thích kết quả bằng quy tắc P/E.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Giá cổ phiếu của A = 20 × 2.500 = \u003cb>50.000 đồng\u003c/b>; lợi nhuận ròng của A = 2.500 × 100 triệu = \u003cb>250 tỷ đồng\u003c/b>.\u003c/p>\u003cp>(a) Giá mua = 15 × 200 tỷ = \u003cb>3.000 tỷ đồng\u003c/b>. Cổ phần phát hành = 3.000 tỷ ÷ 50.000 = \u003cb>60 triệu cổ phần\u003c/b>.\u003c/p>\u003cp>(b) Lợi nhuận ròng hợp nhất = 250 + 200 = \u003cb>450 tỷ đồng\u003c/b>. Cổ phần hợp nhất = 100 + 60 = \u003cb>160 triệu\u003c/b>.\u003cbr>EPS hợp nhất = 450 tỷ ÷ 160 triệu = \u003cb>2.812,5 đồng\u003c/b>.\u003cbr>Mức tăng lãi = 2.812,5 ÷ 2.500 − 1 = \u003cb>+12,5% tăng lãi\u003c/b>.\u003c/p>\u003cp>(c) \u003cb>Quy tắc P/E.\u003c/b> Trong một giao dịch hoàn toàn bằng cổ phần không có cộng hưởng, thương vụ làm tăng lãi bất cứ khi nào P/E của chính bên thâu tóm \u003cb>vượt\u003c/b> P/E mà nó phải trả. Ở đây A giao dịch ở 20× và trả 15×, nên nó phát hành cổ phần được thị trường định giá 20 lần lợi nhuận để mua lợi nhuận chỉ tốn 15 lần — mỗi cổ phần mới mang về nhiều lợi nhuận hơn phần nó pha loãng. Mức tăng lãi 12,5% suy ra theo số học từ khoảng cách 20× so với 15×.\u003c/p>\u003cp>Lưu ý cẩn trọng là đây là một kết quả \u003cb>kế toán\u003c/b>, không phải bằng chứng tạo giá trị: không có cộng hưởng nào được giả định, nên chẳng có gì thực sự được tạo ra. Một bên thâu tóm có bội số cao có thể chế tạo tăng trưởng EPS chỉ bằng cách phát hành giấy để mua lợi nhuận có bội số thấp hơn — đó là lý do chuyên viên phân tích kiểm chứng liệu tăng trưởng và chất lượng của công ty mục tiêu có thực sự biện minh cho bội số phải trả hay không.\u003c/p>","rubricVi":"(a) giá và cổ phần (1,0) · (b) EPS hợp nhất và mức tăng lãi (1,2) · (c) áp dụng quy tắc P/E và lưu ý tăng lãi ≠ giá trị (0,8)."},{"id":"G3-03","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Describe the main steps of the sell-side M&A process and explain how the advisor creates competitive tension.","guide":"\u003cp>\u003cb>Model answer — steps.\u003c/b> (1) Preparation: financial and legal readiness, the model, and agreed value expectations. (2) Marketing materials: an anonymous \u003cb>teaser\u003c/b>, then the \u003cb>CIM\u003c/b> after an NDA. (3) First round: non-binding indications of interest from the contacted buyer universe. (4) Second round: management presentations and data-room due diligence for shortlisted bidders. (5) Final binding bids with a mark-up of the purchase agreement. (6) Negotiation and signing. (7) Closing after regulatory and shareholder approvals.\u003c/p>\u003cp>\u003cb>Creating competitive tension.\u003c/b> Contact several credible buyers \u003cb>simultaneously\u003c/b> so none believes it is negotiating alone; impose firm, common bid \u003cb>deadlines\u003c/b>; control information flow so bidders cannot gauge rivals' pricing; maintain a credible \u003cb>walk-away\u003c/b> alternative, such as retaining the business or an alternative transaction; and keep \u003cb>more than one bidder alive\u003c/b> into the final round so the leading bidder cannot reopen terms. The trade-off is between a broad auction (best price discovery, higher leak and disruption risk) and a targeted process (confidentiality, less tension).\u003c/p>","rubric":"At least six steps in correct order (1.0) · at least three tension mechanisms (0.7) · broad vs targeted trade-off (0.3).","qVi":"Mô tả các bước chính của quy trình M&A bên bán và giải thích nhà tư vấn tạo ra sức ép cạnh tranh như thế nào.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các bước.\u003c/b> (1) Chuẩn bị: sẵn sàng về tài chính và pháp lý, mô hình, và kỳ vọng giá trị đã thống nhất. (2) Tài liệu tiếp thị: một bản \u003cb>teaser\u003c/b> ẩn danh, rồi \u003cb>CIM\u003c/b> sau khi ký NDA. (3) Vòng một: các ý định quan tâm không ràng buộc từ nhóm bên mua được tiếp cận. (4) Vòng hai: thuyết trình của ban điều hành và thẩm định tại phòng dữ liệu cho các bên chào giá lọt danh sách ngắn. (5) Chào giá ràng buộc cuối cùng kèm bản sửa đổi hợp đồng mua bán. (6) Thương lượng và ký kết. (7) Hoàn tất sau khi có phê duyệt của cơ quan quản lý và cổ đông.\u003c/p>\u003cp>\u003cb>Tạo sức ép cạnh tranh.\u003c/b> Tiếp cận \u003cb>đồng thời\u003c/b> nhiều bên mua đáng tin cậy để không bên nào tin rằng mình đang thương lượng một mình; áp đặt \u003cb>hạn chót\u003c/b> chào giá cứng và chung; kiểm soát luồng thông tin để các bên không đo được mức giá của đối thủ; duy trì một phương án \u003cb>rút lui\u003c/b> đáng tin, chẳng hạn giữ lại doanh nghiệp hoặc một giao dịch thay thế; và giữ \u003cb>nhiều hơn một bên chào giá\u003c/b> vào tới vòng cuối để bên dẫn đầu không thể mở lại điều khoản. Đánh đổi là giữa đấu giá rộng (khám phá giá tốt nhất, rủi ro rò rỉ và gián đoạn cao hơn) và quy trình có mục tiêu (bảo mật, ít sức ép hơn).\u003c/p>","rubricVi":"Ít nhất sáu bước theo đúng trình tự (1,0) · ít nhất ba cơ chế tạo sức ép (0,7) · đánh đổi rộng và có mục tiêu (0,3)."},{"id":"G3-04","ch":3,"type":"calc-essay","clo":"CLO1","marks":3,"exam":"final","q":"A sponsor buys a company at 8× EBITDA of VND 400bn with 4.5× leverage. After 5 years EBITDA is VND 520bn, net debt is VND 900bn, and the exit multiple is 8×. Compute entry equity, exit equity, MoM and IRR, and decompose the return.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Entry:\u003c/b> EV = 8 × 400 = \u003cb>VND 3,200bn\u003c/b>; net debt = 4.5 × 400 = \u003cb>VND 1,800bn\u003c/b>; equity = \u003cb>VND 1,400bn\u003c/b>.\u003c/p>\u003cp>\u003cb>Exit:\u003c/b> EV = 8 × 520 = \u003cb>VND 4,160bn\u003c/b>; equity = 4,160 − 900 = \u003cb>VND 3,260bn\u003c/b>.\u003c/p>\u003cp>\u003cb>Returns:\u003c/b> MoM = 3,260 ÷ 1,400 = \u003cb>2.33×\u003c/b>; IRR = 2.33^(1/5) − 1 ≈ \u003cb>18.4%\u003c/b>.\u003c/p>\u003cp>\u003cb>Decomposition.\u003c/b> \u003ci>Deleveraging:\u003c/i> net debt fell 1,800 → 900, adding \u003cb>VND 900bn\u003c/b> directly to equity — the largest contributor. \u003ci>EBITDA growth:\u003c/i> 400 → 520, worth 120 × 8 = \u003cb>VND 960bn\u003c/b> of enterprise value at the constant multiple. \u003ci>Multiple change:\u003c/i> entry and exit are both 8×, so this lever contributes \u003cb>zero\u003c/b>.\u003c/p>\u003cp>\u003cb>Interpretation.\u003c/b> The entire return comes from operational improvement and debt paydown, both within the sponsor's control, with no reliance on multiple expansion. That makes the thesis robust: it would still work if the exit multiple contracted modestly. A deal requiring the exit multiple to exceed entry is betting on market conditions rather than on management, and should always be stress-tested at a lower exit multiple.\u003c/p>","rubric":"Entry and exit equity (1.2) · MoM and IRR (0.8) · three levers quantified incl. the zero multiple effect (0.7) · robustness judgement (0.3).","qVi":"Một nhà tài trợ mua một công ty ở bội số 8× EBITDA 400 tỷ đồng với đòn bẩy 4,5×. Sau 5 năm EBITDA là 520 tỷ, nợ ròng là 900 tỷ, và bội số lúc thoái vốn là 8×. Tính vốn chủ lúc vào, vốn chủ lúc ra, MoM và IRR, và phân rã lợi nhuận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Lúc vào:\u003c/b> EV = 8 × 400 = \u003cb>3.200 tỷ đồng\u003c/b>; nợ ròng = 4,5 × 400 = \u003cb>1.800 tỷ đồng\u003c/b>; vốn chủ = \u003cb>1.400 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Lúc ra:\u003c/b> EV = 8 × 520 = \u003cb>4.160 tỷ đồng\u003c/b>; vốn chủ = 4.160 − 900 = \u003cb>3.260 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Lợi nhuận:\u003c/b> MoM = 3.260 ÷ 1.400 = \u003cb>2,33×\u003c/b>; IRR = 2,33^(1/5) − 1 ≈ \u003cb>18,4%\u003c/b>.\u003c/p>\u003cp>\u003cb>Phân rã.\u003c/b> \u003ci>Giảm đòn bẩy:\u003c/i> nợ ròng giảm 1.800 → 900, cộng thêm \u003cb>900 tỷ đồng\u003c/b> trực tiếp vào vốn chủ — đóng góp lớn nhất. \u003ci>Tăng trưởng EBITDA:\u003c/i> 400 → 520, tương đương 120 × 8 = \u003cb>960 tỷ đồng\u003c/b> giá trị doanh nghiệp ở bội số không đổi. \u003ci>Thay đổi bội số:\u003c/i> lúc vào và lúc ra đều 8×, nên đòn bẩy này đóng góp \u003cb>bằng không\u003c/b>.\u003c/p>\u003cp>\u003cb>Diễn giải.\u003c/b> Toàn bộ lợi nhuận đến từ cải thiện vận hành và trả nợ, cả hai đều trong tầm kiểm soát của nhà tài trợ, không dựa vào việc mở rộng bội số. Điều đó khiến luận điểm vững chắc: nó vẫn hiệu quả nếu bội số lúc ra co lại vừa phải. Một thương vụ đòi hỏi bội số lúc ra vượt lúc vào là đang cược vào điều kiện thị trường chứ không phải vào ban điều hành, và luôn nên được kiểm tra sức chịu đựng ở một bội số thoái vốn thấp hơn.\u003c/p>","rubricVi":"Vốn chủ lúc vào và lúc ra (1,2) · MoM và IRR (0,8) · ba đòn bẩy được định lượng gồm tác động bằng không của bội số (0,7) · phán đoán về độ vững chắc (0,3)."},{"id":"G4-01","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain the advantages of investing through a fund rather than directly, and identify the main costs an investor bears.","guide":"\u003cp>\u003cb>Model answer — advantages.\u003c/b> \u003cb>Diversification\u003c/b> across many securities at a small minimum investment, which an individual could not replicate cost-effectively. \u003cb>Professional selection and monitoring\u003c/b> by a full-time research capability. \u003cb>Economies of scale\u003c/b> in dealing, custody and administration. \u003cb>Access\u003c/b> to instruments, markets and issues not readily available to individuals. \u003cb>Administration\u003c/b> — record-keeping, valuation, tax and regulatory reporting. \u003cb>Liquidity\u003c/b> — daily dealing at NAV in open-end vehicles.\u003c/p>\u003cp>\u003cb>Costs.\u003c/b> The \u003cb>management fee\u003c/b>, charged on AUM regardless of performance; any \u003cb>performance fee\u003c/b> above a hurdle; \u003cb>front-end or exit loads\u003c/b>; the wider \u003cb>expense ratio\u003c/b> covering administration, custody and audit; and embedded \u003cb>transaction costs\u003c/b> from portfolio turnover. Investors also give up control over individual holdings and timing, and bear the risk of style drift. The critical point is that costs are certain while outperformance is not, which is why net-of-fee returns and the expense ratio deserve close attention.\u003c/p>","rubric":"At least four advantages (0.8) · at least four cost types (0.8) · certain-cost-versus-uncertain-return insight (0.4).","qVi":"Giải thích các lợi thế của việc đầu tư qua một quỹ thay vì đầu tư trực tiếp, và nhận diện các chi phí chính mà nhà đầu tư phải gánh.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — lợi thế.\u003c/b> \u003cb>Đa dạng hóa\u003c/b> trên nhiều chứng khoán với mức đầu tư tối thiểu nhỏ, điều mà một cá nhân không thể tái tạo với chi phí hợp lý. \u003cb>Lựa chọn và giám sát chuyên nghiệp\u003c/b> bởi một bộ máy nghiên cứu toàn thời gian. \u003cb>Lợi thế kinh tế theo quy mô\u003c/b> trong giao dịch, lưu ký và quản trị. \u003cb>Khả năng tiếp cận\u003c/b> các công cụ, thị trường và đợt phát hành mà cá nhân khó tiếp cận. \u003cb>Công tác hành chính\u003c/b> — lưu trữ hồ sơ, định giá, báo cáo thuế và pháp lý. \u003cb>Thanh khoản\u003c/b> — giao dịch hằng ngày theo NAV trong các quỹ mở.\u003c/p>\u003cp>\u003cb>Chi phí.\u003c/b> \u003cb>Phí quản lý\u003c/b>, thu trên AUM bất kể hiệu quả; bất kỳ \u003cb>phí hiệu quả\u003c/b> nào trên ngưỡng; \u003cb>phí mua vào hoặc bán ra\u003c/b>; \u003cb>tỷ lệ chi phí\u003c/b> rộng hơn bao gồm quản trị, lưu ký và kiểm toán; và \u003cb>chi phí giao dịch\u003c/b> ngầm định từ vòng quay danh mục. Nhà đầu tư cũng từ bỏ quyền kiểm soát từng khoản nắm giữ và thời điểm, và gánh rủi ro trôi dạt phong cách. Điểm then chốt là chi phí thì chắc chắn còn hiệu quả vượt trội thì không, đó là lý do lợi suất sau phí và tỷ lệ chi phí đáng được chú ý kỹ.\u003c/p>","rubricVi":"Ít nhất bốn lợi thế (0,8) · ít nhất bốn loại chi phí (0,8) · nhận thức chi phí chắc chắn so với lợi nhuận bất định (0,4)."},{"id":"G4-02","ch":4,"type":"calc-essay","clo":"CLO2","marks":3,"exam":"final","q":"A fund reports gross returns of +25% in year 1 and −20% in year 2, charging 2% management and 20% carry with a high-water mark and no hurdle. (a) Compute fees and net returns each year. (b) Compute the two-year cumulative net return for an investor who stays throughout. (c) Explain the role of the high-water mark in year 3.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Start with an index value of 100.\u003c/p>\u003cp>\u003cb>Year 1:\u003c/b> gross +25%. Carry = 20% × 25% = \u003cb>5.0%\u003c/b>; management fee \u003cb>2.0%\u003c/b>. Net return = 25 − 2 − 5 = \u003cb>+18.0%\u003c/b>. Investor value = 100 × 1.18 = \u003cb>118.0\u003c/b>. The high-water mark is set at \u003cb>118.0\u003c/b>.\u003c/p>\u003cp>\u003cb>Year 2:\u003c/b> gross −20%. No carry can be charged on a loss, but the management fee still applies. Net return = −20 − 2 = \u003cb>−22.0%\u003c/b>. Investor value = 118.0 × 0.78 = \u003cb>92.04\u003c/b>.\u003c/p>\u003cp>(b) Cumulative net return = 92.04 ÷ 100 − 1 = \u003cb>−7.96%\u003c/b> over two years. Note the gross cumulative return was 1.25 × 0.80 − 1 = 0%: fees alone turned a break-even two years into a loss of almost 8%.\u003c/p>\u003cp>(c) In \u003cb>year 3\u003c/b> the high-water mark means no performance fee may be charged until the investor's value exceeds \u003cb>118.0\u003c/b> again — that is, until the loss has been fully recovered. Without it, a recovery from 92.04 back toward 118 would generate carry on gains that merely restore earlier value, so the manager would be paid twice for the same performance and would be rewarded for volatility. The management fee, however, continues to be charged throughout — which is why AUM, not performance, drives manager revenue.\u003c/p>","rubric":"(a) both years with fees and correct no-carry-on-loss treatment (1.3) · (b) cumulative figure with the gross-versus-net insight (0.9) · (c) high-water mark explained with the year-3 threshold (0.8).","qVi":"Một quỹ báo cáo lợi suất gộp +25% năm 1 và −20% năm 2, thu phí quản lý 2% và lãi thưởng 20% với mốc cao nhất và không có ngưỡng. (a) Tính phí và lợi suất ròng mỗi năm. (b) Tính lợi suất ròng lũy kế hai năm cho một nhà đầu tư giữ suốt. (c) Giải thích vai trò của mốc cao nhất trong năm 3.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Bắt đầu với giá trị chỉ số 100.\u003c/p>\u003cp>\u003cb>Năm 1:\u003c/b> gộp +25%. Lãi thưởng = 20% × 25% = \u003cb>5,0%\u003c/b>; phí quản lý \u003cb>2,0%\u003c/b>. Lợi suất ròng = 25 − 2 − 5 = \u003cb>+18,0%\u003c/b>. Giá trị của nhà đầu tư = 100 × 1,18 = \u003cb>118,0\u003c/b>. Mốc cao nhất được đặt ở \u003cb>118,0\u003c/b>.\u003c/p>\u003cp>\u003cb>Năm 2:\u003c/b> gộp −20%. Không được thu lãi thưởng trên khoản lỗ, nhưng phí quản lý vẫn áp dụng. Lợi suất ròng = −20 − 2 = \u003cb>−22,0%\u003c/b>. Giá trị của nhà đầu tư = 118,0 × 0,78 = \u003cb>92,04\u003c/b>.\u003c/p>\u003cp>(b) Lợi suất ròng lũy kế = 92,04 ÷ 100 − 1 = \u003cb>−7,96%\u003c/b> trong hai năm. Lưu ý lợi suất gộp lũy kế là 1,25 × 0,80 − 1 = 0%: chỉ riêng phí đã biến hai năm hòa vốn thành khoản lỗ gần 8%.\u003c/p>\u003cp>(c) Trong \u003cb>năm 3\u003c/b>, mốc cao nhất có nghĩa là không được thu phí hiệu quả cho tới khi giá trị của nhà đầu tư vượt \u003cb>118,0\u003c/b> trở lại — tức là cho tới khi khoản lỗ được bù đắp hoàn toàn. Không có nó, một đợt hồi phục từ 92,04 lên tới 118 sẽ tạo ra lãi thưởng trên những khoản lãi chỉ đơn thuần khôi phục giá trị trước đó, nên nhà quản lý sẽ được trả hai lần cho cùng một hiệu quả và được tưởng thưởng cho sự biến động. Tuy nhiên phí quản lý vẫn tiếp tục được thu suốt — đó là lý do AUM, chứ không phải hiệu quả, dẫn dắt doanh thu của nhà quản lý.\u003c/p>","rubricVi":"(a) cả hai năm với phí và xử lý đúng việc không thu lãi thưởng trên khoản lỗ (1,3) · (b) con số lũy kế với nhận thức gộp so với ròng (0,9) · (c) mốc cao nhất được giải thích với ngưỡng năm 3 (0,8)."},{"id":"G4-03","ch":4,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what an investment policy statement contains and why it protects both the client and the manager.","guide":"\u003cp>\u003cb>Model answer — contents.\u003c/b> The IPS records the client's \u003cb>objectives\u003c/b> (return requirement and risk tolerance) and \u003cb>constraints\u003c/b> — time horizon, liquidity needs, tax position, legal and regulatory circumstances, and any unique preferences such as excluded sectors. It also specifies the \u003cb>strategic asset allocation\u003c/b> and permitted ranges, the \u003cb>benchmark\u003c/b>, permitted instruments and prohibitions, the rebalancing policy, reporting arrangements and the \u003cb>review schedule\u003c/b>.\u003c/p>\u003cp>\u003cb>Protection for the client.\u003c/b> It forces objectives to be articulated and tested for realism; it constrains the manager to an agreed risk profile, preventing style drift and unauthorised risk-taking; and it establishes an objective standard against which both performance and suitability can later be judged.\u003c/p>\u003cp>\u003cb>Protection for the manager.\u003c/b> It converts vague expectations into a documented mandate, provides a defence against complaints based on hindsight — particularly after a market fall — and defines in advance what success means, so the manager is judged against the agreed benchmark rather than against whatever asset happened to perform best.\u003c/p>","rubric":"Objectives and at least four constraints (0.8) · allocation, benchmark and review (0.4) · protection for client (0.4) and for manager (0.4).","qVi":"Giải thích một tuyên bố chính sách đầu tư chứa những gì và vì sao nó bảo vệ cả khách hàng lẫn nhà quản lý.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — nội dung.\u003c/b> IPS ghi lại \u003cb>mục tiêu\u003c/b> của khách hàng (yêu cầu về lợi suất và khả năng chịu đựng rủi ro) và \u003cb>ràng buộc\u003c/b> — chân trời thời gian, nhu cầu thanh khoản, tình trạng thuế, hoàn cảnh pháp lý và quản lý, cùng bất kỳ ưu tiên đặc thù nào như các ngành bị loại trừ. Nó cũng nêu rõ \u003cb>phân bổ tài sản chiến lược\u003c/b> và các biên độ cho phép, \u003cb>chỉ số tham chiếu\u003c/b>, các công cụ được phép và các điều cấm, chính sách tái cân bằng, thu xếp báo cáo và \u003cb>lịch rà soát\u003c/b>.\u003c/p>\u003cp>\u003cb>Bảo vệ khách hàng.\u003c/b> Nó buộc các mục tiêu phải được diễn đạt rõ và kiểm định tính thực tế; nó ràng buộc nhà quản lý vào một hồ sơ rủi ro đã thống nhất, ngăn sự trôi dạt phong cách và việc chấp nhận rủi ro không được phép; và nó thiết lập một chuẩn mực khách quan để về sau đánh giá cả hiệu quả lẫn tính phù hợp.\u003c/p>\u003cp>\u003cb>Bảo vệ nhà quản lý.\u003c/b> Nó chuyển các kỳ vọng mơ hồ thành một mệnh lệnh có văn bản, cung cấp một lá chắn trước các khiếu nại dựa trên nhận thức muộn — đặc biệt sau một đợt thị trường giảm — và định nghĩa trước thành công nghĩa là gì, để nhà quản lý được đánh giá theo chỉ số tham chiếu đã thống nhất chứ không phải theo bất kỳ tài sản nào tình cờ có hiệu quả tốt nhất.\u003c/p>","rubricVi":"Mục tiêu và ít nhất bốn ràng buộc (0,8) · phân bổ, chỉ số tham chiếu và rà soát (0,4) · bảo vệ khách hàng (0,4) và bảo vệ nhà quản lý (0,4)."},{"id":"G5-01","ch":5,"type":"calc-essay","clo":"CLO2","marks":3,"exam":"final","q":"A company forecasts FCFF of VND 400bn in year 1 growing 10% annually for 4 years, then 3% in perpetuity. WACC is 12%. Net debt is VND 1,000bn and there are 150m shares. Estimate the value per share and comment on the composition of the value.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Forecast FCFF:\u003c/b> Y1 400.0; Y2 440.0; Y3 484.0; Y4 532.4.\u003c/p>\u003cp>\u003cb>Discount factors at 12%:\u003c/b> 0.8929, 0.7972, 0.7118, 0.6355.\u003cbr>PVs: 357.1; 350.8; 344.5; 338.3 → \u003cb>PV of forecast ≈ VND 1,390.7bn\u003c/b>.\u003c/p>\u003cp>\u003cb>Terminal value at end of year 4:\u003c/b> TV = 532.4 × 1.03 ÷ (0.12 − 0.03) = 548.4 ÷ 0.09 = \u003cb>VND 6,093.0bn\u003c/b>.\u003cbr>PV of TV = 6,093.0 × 0.6355 = \u003cb>VND 3,872.1bn\u003c/b>.\u003c/p>\u003cp>\u003cb>Enterprise value\u003c/b> = 1,390.7 + 3,872.1 = \u003cb>VND 5,262.8bn\u003c/b>.\u003cbr>Equity value = 5,262.8 − 1,000 = \u003cb>VND 4,262.8bn\u003c/b>.\u003cbr>Value per share = 4,262.8bn ÷ 150m = \u003cb>VND 28,419\u003c/b>.\u003c/p>\u003cp>\u003cb>Composition.\u003c/b> The terminal value contributes 3,872.1 ÷ 5,262.8 = \u003cb>73.6%\u003c/b> of enterprise value — typical for a DCF with a short explicit forecast, and the reason the terminal assumptions dominate the answer. Since the perpetuity denominator is only (0.12 − 0.03) = 0.09, small changes matter greatly: raising terminal growth to 4% lifts the multiplier from 1/0.09 to 1/0.08, an 12.5% increase in terminal value. The valuation should therefore be presented as a \u003cb>sensitivity table\u003c/b> across WACC and terminal growth, and cross-checked against trading comparables, rather than as a single point estimate.\u003c/p>","rubric":"Forecast PVs (0.9) · terminal value and its PV (0.9) · EV, equity and per-share (0.7) · terminal-value share and sensitivity conclusion (0.5).","qVi":"Một công ty dự phóng FCFF 400 tỷ đồng ở năm 1 tăng 10% mỗi năm trong 4 năm, sau đó 3% vĩnh viễn. WACC là 12%. Nợ ròng là 1.000 tỷ đồng và có 150 triệu cổ phần. Ước tính giá trị mỗi cổ phần và bình luận về cấu thành của giá trị.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>FCFF dự phóng:\u003c/b> N1 400,0; N2 440,0; N3 484,0; N4 532,4.\u003c/p>\u003cp>\u003cb>Hệ số chiết khấu ở 12%:\u003c/b> 0,8929; 0,7972; 0,7118; 0,6355.\u003cbr>Giá trị hiện tại: 357,1; 350,8; 344,5; 338,3 → \u003cb>PV của giai đoạn dự phóng ≈ 1.390,7 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Giá trị cuối kỳ tại cuối năm 4:\u003c/b> TV = 532,4 × 1,03 ÷ (0,12 − 0,03) = 548,4 ÷ 0,09 = \u003cb>6.093,0 tỷ đồng\u003c/b>.\u003cbr>PV của TV = 6.093,0 × 0,6355 = \u003cb>3.872,1 tỷ đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Giá trị doanh nghiệp\u003c/b> = 1.390,7 + 3.872,1 = \u003cb>5.262,8 tỷ đồng\u003c/b>.\u003cbr>Giá trị vốn chủ = 5.262,8 − 1.000 = \u003cb>4.262,8 tỷ đồng\u003c/b>.\u003cbr>Giá trị mỗi cổ phần = 4.262,8 tỷ ÷ 150 triệu = \u003cb>28.419 đồng\u003c/b>.\u003c/p>\u003cp>\u003cb>Cấu thành.\u003c/b> Giá trị cuối kỳ đóng góp 3.872,1 ÷ 5.262,8 = \u003cb>73,6%\u003c/b> giá trị doanh nghiệp — điển hình cho một mô hình DCF với giai đoạn dự phóng tường minh ngắn, và là lý do các giả định cuối kỳ chi phối đáp án. Vì mẫu số của công thức vĩnh viễn chỉ là (0,12 − 0,03) = 0,09, những thay đổi nhỏ có ảnh hưởng rất lớn: nâng tăng trưởng cuối kỳ lên 4% làm hệ số nhân tăng từ 1/0,09 lên 1/0,08, tức tăng 12,5% giá trị cuối kỳ. Cuộc định giá do đó nên được trình bày như một \u003cb>bảng độ nhạy\u003c/b> theo WACC và tăng trưởng cuối kỳ, và được đối chiếu với bội số giao dịch của nhóm so sánh, thay vì như một ước lượng điểm duy nhất.\u003c/p>","rubricVi":"Giá trị hiện tại giai đoạn dự phóng (0,9) · giá trị cuối kỳ và PV của nó (0,9) · EV, vốn chủ và giá mỗi cổ phần (0,7) · tỷ trọng giá trị cuối kỳ và kết luận về độ nhạy (0,5)."},{"id":"G5-02","ch":5,"type":"essay","clo":"CLO2","marks":2,"exam":"final","q":"Explain what 'quality of earnings' means and list four warning signs an analyst should look for.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Quality of earnings\u003c/b> refers to the extent to which reported profit reflects sustainable, cash-generating operating performance rather than accounting choices, one-off items or manipulation. High-quality earnings are recurring, cash-backed and conservatively measured — and are what a valuation multiple should be applied to.\u003c/p>\u003cp>\u003cb>Warning signs.\u003c/b> (1) \u003cb>Net income rising while operating cash flow falls\u003c/b> — the single most important signal, indicating profits are not converting to cash. (2) \u003cb>Receivables or inventory growing faster than revenue\u003c/b>, suggesting channel stuffing, collection problems or obsolescence. (3) \u003cb>Reliance on non-recurring items\u003c/b> — asset disposals, revaluations, one-off gains — to meet earnings expectations. (4) \u003cb>Aggressive revenue recognition\u003c/b> or changes in accounting policy, estimates or useful lives that conveniently raise profit. Further signs include capitalising costs that peers expense, unusual related-party transactions, frequent auditor changes and large gaps between statutory and adjusted earnings.\u003c/p>","rubric":"Definition incl. sustainability and cash backing (0.6) · four valid warning signs (1.2) · link to valuation (0.2).","qVi":"Giải thích 'chất lượng lợi nhuận' nghĩa là gì và liệt kê bốn dấu hiệu cảnh báo mà chuyên viên phân tích nên tìm.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Chất lượng lợi nhuận\u003c/b> chỉ mức độ mà lợi nhuận được báo cáo phản ánh hiệu quả hoạt động bền vững, sinh tiền, chứ không phải các lựa chọn kế toán, các khoản một lần hay sự thao túng. Lợi nhuận chất lượng cao là lặp lại được, có tiền mặt đứng sau và được đo lường thận trọng — và đó là thứ mà một bội số định giá nên được áp dụng lên.\u003c/p>\u003cp>\u003cb>Các dấu hiệu cảnh báo.\u003c/b> (1) \u003cb>Lợi nhuận ròng tăng trong khi dòng tiền từ hoạt động kinh doanh giảm\u003c/b> — tín hiệu quan trọng nhất, cho thấy lợi nhuận không chuyển thành tiền. (2) \u003cb>Khoản phải thu hoặc hàng tồn kho tăng nhanh hơn doanh thu\u003c/b>, gợi ý việc đẩy hàng qua kênh phân phối, vấn đề thu hồi công nợ hoặc hàng lỗi thời. (3) \u003cb>Phụ thuộc vào các khoản không thường xuyên\u003c/b> — thanh lý tài sản, đánh giá lại, lãi một lần — để đạt kỳ vọng lợi nhuận. (4) \u003cb>Ghi nhận doanh thu mạo hiểm\u003c/b> hoặc thay đổi chính sách kế toán, ước tính hay thời gian sử dụng hữu ích một cách tiện lợi làm tăng lợi nhuận. Các dấu hiệu khác gồm vốn hóa các chi phí mà nhóm so sánh ghi nhận vào chi phí, giao dịch bất thường với bên liên quan, thay đổi kiểm toán viên thường xuyên và khoảng cách lớn giữa lợi nhuận theo luật định và lợi nhuận điều chỉnh.\u003c/p>","rubricVi":"Định nghĩa gồm tính bền vững và tiền mặt đứng sau (0,6) · bốn dấu hiệu cảnh báo hợp lệ (1,2) · liên hệ tới định giá (0,2)."},{"id":"G5-03","ch":5,"type":"case","clo":"CLO2","marks":3,"exam":"final","q":"A state-owned enterprise is being equitized. The consultant values it using net asset value only, excluding land-use rights held under long-term allocation. Analyse the problems and recommend an approach.","guide":"\u003cp>\u003cb>Model answer — problems.\u003c/b> (1) \u003cb>Excluding land-use rights\u003c/b> omits what is frequently the enterprise's most valuable asset. The result systematically undervalues the enterprise and transfers public wealth to whoever buys the shares — the central abuse that equitization rules and public scrutiny are designed to prevent. (2) \u003cb>Net asset value alone\u003c/b> ignores going-concern earning power, brand, customer relationships, licences and workforce; for a profitable operating business NAV is a floor, not a valuation. (3) It also ignores \u003cb>synergies and control value\u003c/b> that a strategic investor would pay for. (4) A single method provides no cross-check, so no one can tell whether the answer is reasonable.\u003c/p>\u003cp>\u003cb>Recommended approach.\u003c/b> Value the enterprise on \u003cb>multiple bases\u003c/b> and reconcile them: an \u003cb>income approach\u003c/b> (DCF on forecast cash flows) capturing going-concern value; a \u003cb>market approach\u003c/b> using comparable listed companies and precedent equitizations; and an \u003cb>asset approach\u003c/b> as a floor. \u003cb>Land-use rights must be valued explicitly\u003c/b> and separately, by an independent qualified valuer, at market value for the permitted use and remaining term, with the methodology and comparables documented. Where the land is not transferable or is subject to restrictions, that must be reflected — but by adjustment, not by omission. The valuation should be independently reviewed, disclosed with its assumptions, and stress-tested; and the sale process itself — competitive bidding rather than negotiated sale — is the best protection, since a genuine auction reveals value that no valuation model can guarantee.\u003c/p>","rubric":"Land-use rights omission and its public-interest consequence (1.0) · NAV-only limitations incl. going concern (0.8) · multi-method recommendation (0.8) · independent valuation, disclosure and competitive process (0.4).","qVi":"Một doanh nghiệp nhà nước đang được cổ phần hóa. Đơn vị tư vấn định giá nó chỉ bằng giá trị tài sản ròng, loại trừ quyền sử dụng đất được giao dài hạn. Phân tích các vấn đề và khuyến nghị một cách tiếp cận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các vấn đề.\u003c/b> (1) \u003cb>Loại trừ quyền sử dụng đất\u003c/b> bỏ sót thứ thường là tài sản giá trị nhất của doanh nghiệp. Kết quả là định giá thấp doanh nghiệp một cách có hệ thống và chuyển của cải công sang bất kỳ ai mua cổ phần — đúng là sự lạm dụng trung tâm mà các quy định cổ phần hóa và sự giám sát của công chúng nhằm ngăn chặn. (2) \u003cb>Chỉ dùng giá trị tài sản ròng\u003c/b> bỏ qua khả năng sinh lời khi hoạt động liên tục, thương hiệu, quan hệ khách hàng, giấy phép và đội ngũ lao động; với một doanh nghiệp đang hoạt động có lãi, giá trị tài sản ròng là mức sàn chứ không phải một cuộc định giá. (3) Nó cũng bỏ qua \u003cb>cộng hưởng và giá trị kiểm soát\u003c/b> mà một nhà đầu tư chiến lược sẵn sàng trả. (4) Một phương pháp duy nhất không cung cấp phép đối chiếu nào, nên không ai biết được đáp án có hợp lý hay không.\u003c/p>\u003cp>\u003cb>Cách tiếp cận được khuyến nghị.\u003c/b> Định giá doanh nghiệp trên \u003cb>nhiều cơ sở\u003c/b> và đối chiếu chúng: một \u003cb>phương pháp thu nhập\u003c/b> (DCF trên dòng tiền dự phóng) nắm bắt giá trị hoạt động liên tục; một \u003cb>phương pháp thị trường\u003c/b> dùng các công ty niêm yết so sánh và các đợt cổ phần hóa tiền lệ; và một \u003cb>phương pháp tài sản\u003c/b> làm mức sàn. \u003cb>Quyền sử dụng đất phải được định giá tường minh\u003c/b> và riêng biệt, bởi một tổ chức thẩm định giá độc lập đủ năng lực, theo giá thị trường cho mục đích sử dụng được phép và thời hạn còn lại, với phương pháp và các giao dịch so sánh được ghi chép đầy đủ. Khi đất không được chuyển nhượng hoặc chịu hạn chế, điều đó phải được phản ánh — nhưng bằng cách điều chỉnh, không phải bằng cách bỏ sót. Kết quả định giá nên được rà soát độc lập, công bố kèm các giả định, và kiểm tra sức chịu đựng; và bản thân quy trình bán — đấu giá cạnh tranh thay vì bán thỏa thuận — là sự bảo vệ tốt nhất, vì một cuộc đấu giá thực sự bộc lộ giá trị mà không mô hình định giá nào bảo đảm được.\u003c/p>","rubricVi":"Việc bỏ sót quyền sử dụng đất và hệ quả lợi ích công (1,0) · hạn chế của phương pháp chỉ dùng tài sản ròng gồm hoạt động liên tục (0,8) · khuyến nghị đa phương pháp (0,8) · định giá độc lập, công bố và quy trình cạnh tranh (0,4)."},{"id":"G6-01","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the difference between agency and principal activity on a securities firm's trading floor, and why the distinction matters for regulation.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> In \u003cb>agency\u003c/b> activity the firm acts \u003ci>for\u003c/i> the client: it executes the client's order in the market and earns a \u003cb>commission\u003c/b>. It never takes the other side, so it holds no position and bears no market risk — only execution, settlement and conduct risk. In \u003cb>principal\u003c/b> activity the firm trades \u003ci>with\u003c/i> the client or for itself, from its own inventory and at its own risk, earning the \u003cb>bid-ask spread\u003c/b> (market making) or trading gains (proprietary trading).\u003c/p>\u003cp>\u003cb>Why the distinction matters.\u003c/b> The two roles create opposite incentives. As agent the firm owes duties of best execution, client priority and loyalty; as principal it is the client's counterparty, and its gain on a trade is the client's cost. Regulation therefore requires disclosure of the capacity in which the firm acts, client order priority, segregation of client assets, and separation of proprietary from client business — and, under rules such as the Volcker Rule, restricts proprietary trading within banking entities altogether. Without the distinction a firm could use client order information to trade ahead for itself, converting a fiduciary relationship into an extraction of value.\u003c/p>","rubric":"Agency vs principal with revenue and risk (1.0) · opposed incentives (0.4) · at least three regulatory consequences (0.6).","qVi":"Giải thích sự khác biệt giữa hoạt động đại lý và hoạt động chính chủ trên sàn giao dịch của một công ty chứng khoán, và vì sao sự phân biệt này quan trọng đối với quản lý pháp lý.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Trong hoạt động \u003cb>đại lý\u003c/b>, công ty hành động \u003ci>thay\u003c/i> khách hàng: thực hiện lệnh của khách hàng trên thị trường và hưởng \u003cb>hoa hồng\u003c/b>. Công ty không bao giờ đứng ở chiều đối ứng, nên không nắm vị thế và không gánh rủi ro thị trường — chỉ có rủi ro thực hiện, thanh toán và ứng xử. Trong hoạt động \u003cb>chính chủ\u003c/b>, công ty giao dịch \u003ci>với\u003c/i> khách hàng hoặc cho chính mình, từ tồn kho của mình và với rủi ro của mình, hưởng \u003cb>chênh lệch giá đặt mua – chào bán\u003c/b> (tạo lập thị trường) hoặc lãi giao dịch (tự doanh).\u003c/p>\u003cp>\u003cb>Vì sao sự phân biệt quan trọng.\u003c/b> Hai vai trò tạo ra động cơ đối nghịch. Với vai trò đại lý, công ty có nghĩa vụ thực hiện tốt nhất, ưu tiên khách hàng và trung thành; với vai trò chính chủ, công ty là đối tác của khách hàng, và lãi của họ trên một giao dịch chính là chi phí của khách hàng. Quản lý pháp lý do đó yêu cầu công bố tư cách mà công ty hành động, ưu tiên lệnh khách hàng, tách bạch tài sản khách hàng, và tách hoạt động tự doanh khỏi hoạt động khách hàng — và, theo các quy tắc như Quy tắc Volcker, hạn chế hẳn hoạt động tự doanh trong các định chế ngân hàng. Nếu không có sự phân biệt, một công ty có thể dùng thông tin lệnh của khách hàng để giao dịch trước cho chính mình, biến một quan hệ tín thác thành việc rút giá trị.\u003c/p>","rubricVi":"Đại lý so với chính chủ với doanh thu và rủi ro (1,0) · động cơ đối nghịch (0,4) · ít nhất ba hệ quả về quản lý pháp lý (0,6)."},{"id":"G6-02","ch":6,"type":"calc-essay","clo":"CLO3","marks":3,"exam":"final","q":"An investor has VND 400m of cash. Initial margin is 50% and maintenance margin is 30%. (a) Compute maximum buying power and the loan. (b) If shares are bought at VND 40,000, compute the margin-call price. (c) Compare the outcome at VND 28,000 with and without leverage.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Buying power = equity ÷ initial margin = 400 ÷ 0.50 = \u003cb>VND 800m\u003c/b>; loan = 800 − 400 = \u003cb>VND 400m\u003c/b>. Leverage = 2×.\u003c/p>\u003cp>(b) Call price = 40,000 × (1 − 0.50) ÷ (1 − 0.30) = 40,000 × 0.5 ÷ 0.7 = \u003cb>VND 28,571\u003c/b>.\u003c/p>\u003cp>(c) At VND 40,000 the investor holds 800m ÷ 40,000 = \u003cb>20,000 shares\u003c/b>.\u003c/p>\u003cp>\u003ci>With leverage,\u003c/i> at VND 28,000: market value = 20,000 × 28,000 = \u003cb>VND 560m\u003c/b>; equity = 560 − 400 = \u003cb>VND 160m\u003c/b>. Loss = 400 − 160 = VND 240m, a return of \u003cb>−60%\u003c/b>. The equity ratio is 160 ÷ 560 = 28.6%, below the 30% maintenance level, and 28,000 is below the call price of 28,571 — so a \u003cb>margin call is triggered\u003c/b> and, if unmet, the position is force-sold, crystallising the loss.\u003c/p>\u003cp>\u003ci>Without leverage,\u003c/i> VND 400m would have bought 10,000 shares, now worth 10,000 × 28,000 = \u003cb>VND 280m\u003c/b>: a loss of VND 120m, or \u003cb>−30%\u003c/b> — exactly the fall in the share price, with no margin call and the freedom to hold and await recovery.\u003c/p>\u003cp>Leverage of 2× has doubled the percentage loss and, more damagingly, removed the choice to wait.\u003c/p>","rubric":"(a) 0.7 · (b) 0.7 · (c) both scenarios computed with the call conclusion (1.2) · the loss-of-optionality insight (0.4).","qVi":"Một nhà đầu tư có 400 triệu đồng tiền mặt. Ký quỹ ban đầu là 50% và ký quỹ duy trì là 30%. (a) Tính sức mua tối đa và khoản vay. (b) Nếu cổ phần được mua ở giá 40.000 đồng, tính giá gọi ký quỹ. (c) So sánh kết quả ở mức 28.000 đồng có và không có đòn bẩy.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Sức mua = vốn chủ ÷ ký quỹ ban đầu = 400 ÷ 0,50 = \u003cb>800 triệu đồng\u003c/b>; khoản vay = 800 − 400 = \u003cb>400 triệu đồng\u003c/b>. Đòn bẩy = 2×.\u003c/p>\u003cp>(b) Giá gọi ký quỹ = 40.000 × (1 − 0,50) ÷ (1 − 0,30) = 40.000 × 0,5 ÷ 0,7 = \u003cb>28.571 đồng\u003c/b>.\u003c/p>\u003cp>(c) Ở mức 40.000 đồng, nhà đầu tư nắm 800 triệu ÷ 40.000 = \u003cb>20.000 cổ phần\u003c/b>.\u003c/p>\u003cp>\u003ci>Có đòn bẩy,\u003c/i> ở mức 28.000 đồng: giá trị thị trường = 20.000 × 28.000 = \u003cb>560 triệu đồng\u003c/b>; vốn chủ = 560 − 400 = \u003cb>160 triệu đồng\u003c/b>. Khoản lỗ = 400 − 160 = 240 triệu đồng, tức tỷ suất \u003cb>−60%\u003c/b>. Tỷ lệ vốn chủ là 160 ÷ 560 = 28,6%, dưới mức duy trì 30%, và 28.000 thấp hơn giá gọi 28.571 — nên \u003cb>lệnh gọi ký quỹ được kích hoạt\u003c/b> và, nếu không được đáp ứng, vị thế bị bán giải chấp, hiện thực hóa khoản lỗ.\u003c/p>\u003cp>\u003ci>Không đòn bẩy,\u003c/i> 400 triệu đồng lẽ ra mua được 10.000 cổ phần, nay trị giá 10.000 × 28.000 = \u003cb>280 triệu đồng\u003c/b>: khoản lỗ 120 triệu đồng, tức \u003cb>−30%\u003c/b> — đúng bằng mức giảm của giá cổ phiếu, không có lệnh gọi ký quỹ và có quyền tự do nắm giữ chờ hồi phục.\u003c/p>\u003cp>Đòn bẩy 2× đã nhân đôi tỷ lệ phần trăm khoản lỗ và, tai hại hơn, đã tước đi quyền lựa chọn chờ đợi.\u003c/p>","rubricVi":"(a) 0,7 · (b) 0,7 · (c) tính cả hai kịch bản kèm kết luận về lệnh gọi (1,2) · nhận thức về việc mất quyền lựa chọn (0,4)."},{"id":"G6-03","ch":6,"type":"essay","clo":"CLO3","marks":2,"exam":"final","q":"Explain the benefits and risks of margin lending from the perspective of the securities company, and describe four controls it should apply.","guide":"\u003cp>\u003cb>Model answer — benefits to the firm.\u003c/b> Interest income on the loan, which has become a principal revenue source as commissions have been competed away; higher trading turnover and therefore commission; a stickier client relationship; and collateral that is liquid and marked to market daily.\u003c/p>\u003cp>\u003cb>Risks.\u003c/b> \u003cb>Credit risk\u003c/b> if collateral value falls faster than the firm can liquidate — gapping markets, limit-down days or suspended stocks can leave the loan under-secured. \u003cb>Concentration risk\u003c/b> where many clients borrow against the same few popular stocks, so a fall hits the whole book simultaneously. \u003cb>Liquidity risk\u003c/b>, since the firm must itself fund the loans. \u003cb>Legal and reputational risk\u003c/b> from disputed force-sales. And \u003cb>systemic risk\u003c/b>, because margin lending is pro-cyclical: falling prices trigger calls and forced selling, which push prices lower and trigger further calls.\u003c/p>\u003cp>\u003cb>Four controls.\u003c/b> (1) Lend only against an \u003cb>eligible securities list\u003c/b> screened for liquidity, free float and volatility. (2) Impose \u003cb>concentration limits\u003c/b> per security, per client and per group of related clients. (3) Set loan-to-value ratios \u003cb>below the regulatory maximum\u003c/b>, with larger buffers for volatile names, and mark to market intra-day with automated alerts. (4) Maintain a documented \u003cb>margin-call and force-sale procedure\u003c/b> with clear timelines, and \u003cb>stress-test\u003c/b> the book against a market-wide fall of 20–30%.\u003c/p>","rubric":"At least three benefits (0.5) · at least four risks incl. pro-cyclicality (0.8) · four concrete controls (0.7).","qVi":"Giải thích lợi ích và rủi ro của cho vay ký quỹ từ góc nhìn của công ty chứng khoán, và mô tả bốn biện pháp kiểm soát mà công ty nên áp dụng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — lợi ích với công ty.\u003c/b> Thu nhập lãi trên khoản vay, thứ đã trở thành nguồn doanh thu chính khi hoa hồng bị cạnh tranh nén xuống; khối lượng giao dịch cao hơn và do đó hoa hồng cao hơn; quan hệ khách hàng gắn bó hơn; và tài sản bảo đảm thanh khoản, được định giá lại theo thị trường hằng ngày.\u003c/p>\u003cp>\u003cb>Rủi ro.\u003c/b> \u003cb>Rủi ro tín dụng\u003c/b> nếu giá trị tài sản bảo đảm giảm nhanh hơn tốc độ công ty có thể thanh lý — thị trường nhảy giá, các phiên giảm sàn hoặc cổ phiếu bị đình chỉ có thể khiến khoản vay không còn được bảo đảm đủ. \u003cb>Rủi ro tập trung\u003c/b> khi nhiều khách hàng cùng vay dựa trên một vài cổ phiếu phổ biến, nên một đợt giảm tác động lên toàn bộ danh mục cùng lúc. \u003cb>Rủi ro thanh khoản\u003c/b>, vì bản thân công ty phải tài trợ cho các khoản vay. \u003cb>Rủi ro pháp lý và danh tiếng\u003c/b> từ các vụ bán giải chấp gây tranh chấp. Và \u003cb>rủi ro hệ thống\u003c/b>, vì cho vay ký quỹ mang tính thuận chu kỳ: giá giảm kích hoạt lệnh gọi và bán bắt buộc, điều này đẩy giá xuống thấp hơn và kích hoạt thêm lệnh gọi.\u003c/p>\u003cp>\u003cb>Bốn biện pháp kiểm soát.\u003c/b> (1) Chỉ cho vay đối với một \u003cb>danh mục chứng khoán đủ điều kiện\u003c/b> được sàng lọc theo thanh khoản, lượng cổ phần tự do lưu hành và độ biến động. (2) Áp \u003cb>giới hạn tập trung\u003c/b> theo từng chứng khoán, từng khách hàng và từng nhóm khách hàng liên quan. (3) Đặt tỷ lệ cho vay trên giá trị tài sản bảo đảm \u003cb>thấp hơn mức tối đa theo quy định\u003c/b>, với dư địa lớn hơn cho các mã biến động mạnh, và định giá lại trong phiên với cảnh báo tự động. (4) Duy trì một \u003cb>quy trình gọi ký quỹ và bán giải chấp\u003c/b> có ghi chép với thời hạn rõ ràng, và \u003cb>kiểm tra sức chịu đựng\u003c/b> của danh mục trước một đợt giảm toàn thị trường 20–30%.\u003c/p>","rubricVi":"Ít nhất ba lợi ích (0,5) · ít nhất bốn rủi ro gồm tính thuận chu kỳ (0,8) · bốn biện pháp kiểm soát cụ thể (0,7)."},{"id":"G6-04","ch":6,"type":"case","clo":"CLO3","marks":3,"exam":"final","q":"A market maker in a mid-cap stock finds its quoted spread is consistently unprofitable despite high volume. Diagnose the possible causes and recommend responses.","guide":"\u003cp>\u003cb>Model answer — diagnosis.\u003c/b> (1) \u003cb>Adverse selection\u003c/b> is the most likely cause: a high proportion of the flow is informed, so the dealer is systematically bought from before rises and sold to before falls. High volume with poor P&L is the classic signature. (2) \u003cb>Spread too narrow for the stock's volatility\u003c/b> — the quote does not compensate for how far the price can move before inventory is offloaded. (3) \u003cb>Inventory mismanagement\u003c/b> — failing to skew quotes, so unwanted positions accumulate and are unwound at a loss. (4) \u003cb>Information events\u003c/b> — quoting through earnings or announcements when the probability of informed trading peaks. (5) \u003cb>Hedging or funding costs\u003c/b> higher than assumed, or clearing costs eroding a thin margin.\u003c/p>\u003cp>\u003cb>Responses.\u003c/b> \u003cb>Widen the spread\u003c/b> to price the observed adverse selection, accepting some loss of uninformed flow. \u003cb>Skew quotes\u003c/b> systematically to manage inventory back to neutral rather than holding directional risk. \u003cb>Reduce quoted size\u003c/b>, especially in the direction of persistent one-way flow, and around scheduled announcements — or withdraw within the limits of any market-making obligation. \u003cb>Segment the flow\u003c/b>: identify which counterparties are consistently profitable to trade against and which are not, and price accordingly. \u003cb>Hedge\u003c/b> residual inventory with correlated instruments where available. Finally, \u003cb>review whether the obligation is worth retaining\u003c/b>: if the stock's information environment makes profitable quoting impossible at the required spread and size, the economics of the mandate itself should be renegotiated. The general principle is that the spread is the price of two risks — inventory and adverse selection — and must be set to cover both, not merely to win flow.\u003c/p>","rubric":"Adverse selection identified as primary with the volume-versus-P&L signature (0.9) · at least three further causes (0.6) · at least four concrete responses (1.0) · closing principle (0.5).","qVi":"Một nhà tạo lập thị trường cho một cổ phiếu vốn hóa trung bình nhận thấy chênh lệch giá yết của mình liên tục không sinh lời dù khối lượng cao. Chẩn đoán các nguyên nhân có thể và khuyến nghị cách ứng phó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — chẩn đoán.\u003c/b> (1) \u003cb>Lựa chọn bất lợi\u003c/b> là nguyên nhân khả dĩ nhất: một tỷ trọng lớn dòng lệnh đến từ bên nắm nhiều thông tin, nên nhà tạo lập bị mua từ tay mình một cách có hệ thống trước các đợt tăng và bị bán cho trước các đợt giảm. Khối lượng cao đi kèm lãi/lỗ kém là dấu hiệu kinh điển. (2) \u003cb>Chênh lệch giá quá hẹp so với độ biến động của cổ phiếu\u003c/b> — mức yết không bù đắp được khoảng cách mà giá có thể dịch chuyển trước khi tồn kho được đẩy đi. (3) \u003cb>Quản lý tồn kho kém\u003c/b> — không lệch mức yết, nên các vị thế không mong muốn tích lũy và bị đóng lại với khoản lỗ. (4) \u003cb>Các sự kiện thông tin\u003c/b> — yết giá xuyên qua kỳ công bố lợi nhuận hoặc các thông báo, khi xác suất có giao dịch từ bên nắm nhiều thông tin đạt đỉnh. (5) \u003cb>Chi phí phòng ngừa rủi ro hoặc chi phí huy động vốn\u003c/b> cao hơn giả định, hoặc chi phí bù trừ bào mòn một biên lợi nhuận vốn đã mỏng.\u003c/p>\u003cp>\u003cb>Cách ứng phó.\u003c/b> \u003cb>Nới rộng chênh lệch giá\u003c/b> để định giá đúng mức lựa chọn bất lợi quan sát được, chấp nhận mất một phần dòng lệnh từ bên không nắm thông tin. \u003cb>Lệch mức yết\u003c/b> một cách có hệ thống để đưa tồn kho về trạng thái cân bằng thay vì gánh rủi ro theo hướng. \u003cb>Giảm khối lượng yết\u003c/b>, đặc biệt ở chiều có dòng lệnh một chiều dai dẳng, và quanh các thông báo theo lịch — hoặc rút lui trong giới hạn của mọi nghĩa vụ tạo lập thị trường. \u003cb>Phân khúc dòng lệnh\u003c/b>: nhận diện đối tác nào giao dịch với họ thì có lãi ổn định và đối tác nào thì không, rồi định giá tương ứng. \u003cb>Phòng ngừa rủi ro\u003c/b> phần tồn kho còn dư bằng các công cụ tương quan nơi có sẵn. Cuối cùng, \u003cb>xem xét lại liệu nghĩa vụ này có đáng giữ hay không\u003c/b>: nếu môi trường thông tin của cổ phiếu khiến việc yết giá có lãi trở nên bất khả thi ở mức chênh lệch và khối lượng bắt buộc, thì chính hiệu quả kinh tế của hợp đồng nên được thương lượng lại. Nguyên tắc chung là chênh lệch giá là giá của hai loại rủi ro — tồn kho và lựa chọn bất lợi — và phải được đặt để bù đắp cả hai, không phải chỉ để giành dòng lệnh.\u003c/p>","rubricVi":"Nhận diện lựa chọn bất lợi là nguyên nhân chính với dấu hiệu khối lượng so với lãi/lỗ (0,9) · ít nhất ba nguyên nhân khác (0,6) · ít nhất bốn cách ứng phó cụ thể (1,0) · nguyên tắc kết luận (0,5)."},{"id":"H1-01","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain why an investment bank is described as having a 'liability management' orientation while a commercial bank has an 'asset management' orientation.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>commercial bank\u003c/b> first raises funds — principally deposits — and then decides how to deploy them efficiently and with acceptable risk. Funding comes first and drives the use of funds, so management attention centres on the asset side: \u003ci>&ldquo;funding determines use of funds&rdquo;\u003c/i>, an \u003cb>asset-management\u003c/b> orientation.\u003c/p>\u003cp>An \u003cb>investment bank\u003c/b> reverses this. It identifies an investment or transaction need first and then raises funding specifically against it, largely by pledging the resulting assets through repo and similar secured borrowing. The use of funds determines the funding, so management attention centres on the liability side: \u003ci>&ldquo;use of funds determines funding&rdquo;\u003c/i>, a \u003cb>liability-management\u003c/b> orientation.\u003c/p>\u003cp>The practical consequence is that the investment bank's balance sheet expands and contracts with transaction activity, and its funding is continuously renewed — which is why a loss of market confidence translates into a funding crisis within days.\u003c/p>","rubric":"Commercial bank direction with the correct slogan (0.6) · investment bank direction (0.6) · secured-funding mechanism (0.4) · consequence for balance-sheet stability (0.4).","qVi":"Giải thích vì sao ngân hàng đầu tư được mô tả là có định hướng 'quản lý nợ' trong khi ngân hàng thương mại có định hướng 'quản lý tài sản'.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Một \u003cb>ngân hàng thương mại\u003c/b> huy động vốn trước — chủ yếu là tiền gửi — rồi mới quyết định triển khai như thế nào cho hiệu quả và với mức rủi ro chấp nhận được. Nguồn vốn đến trước và dẫn dắt việc sử dụng vốn, nên sự chú ý quản trị tập trung vào phần tài sản: \u003ci>&ldquo;nguồn vốn quyết định việc sử dụng vốn&rdquo;\u003c/i>, định hướng \u003cb>quản lý tài sản\u003c/b>.\u003c/p>\u003cp>Một \u003cb>ngân hàng đầu tư\u003c/b> đảo ngược điều này. Nó xác định nhu cầu đầu tư hay giao dịch trước rồi mới huy động vốn cụ thể đối ứng với nhu cầu đó, phần lớn bằng cách cầm cố chính các tài sản phát sinh qua repo và các hình thức vay có bảo đảm tương tự. Việc sử dụng vốn quyết định nguồn vốn, nên sự chú ý quản trị tập trung vào phần nợ: \u003ci>&ldquo;việc sử dụng vốn quyết định nguồn vốn&rdquo;\u003c/i>, định hướng \u003cb>quản lý nợ\u003c/b>.\u003c/p>\u003cp>Hệ quả thực tế là bảng cân đối của ngân hàng đầu tư nở ra và co lại theo hoạt động giao dịch, và nguồn vốn liên tục được tái tục — đó là lý do vì sao mất niềm tin thị trường lại chuyển thành một cuộc khủng hoảng than
