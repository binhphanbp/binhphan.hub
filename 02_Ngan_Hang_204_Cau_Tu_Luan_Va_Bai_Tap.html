remia\u003c/b>, so blanket resistance may itself destroy shareholder value — the defensible position is to use defences as \u003cb>bargaining leverage\u003c/b> to raise the price, not to defeat every bid.\u003c/p>","rubric":"At least four preventive and three reactive tactics correctly described (1.8) · clear preventive/reactive distinction (0.5) · fiduciary analysis incl. entrenchment risk and fairness opinion (1.2) · balanced conclusion citing evidence (0.5).","qVi":"Bạn tư vấn cho hội đồng quản trị một công ty niêm yết Việt Nam vừa nhận được một lời đề nghị thâu tóm không mời và dưới giá trị. Giải thích các chiến thuật phòng thủ khả dụng, phân biệt biện pháp phòng ngừa với biện pháp ứng phó, và tư vấn cho hội đồng về các cân nhắc nghĩa vụ tín thác.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — biện pháp phòng ngừa.\u003c/b> \u003ci>Viên thuốc độc\u003c/i> (kế hoạch quyền mua) pha loãng bên chào mua vượt ngưỡng; \u003ci>hội đồng quản trị bầu so le\u003c/i> khiến giành kiểm soát cần hai kỳ đại hội; \u003ci>điều khoản đa số tuyệt đối\u003c/i> trong điều lệ; \u003ci>chiếc dù vàng\u003c/i> làm tăng chi phí thay đổi quyền kiểm soát; \u003ci>sở hữu chéo\u003c/i> với các bên thân thiện.\u003c/p>\u003cp>\u003cb>Chiến thuật ứng phó / phản công.\u003c/b> \u003ci>Hiệp sĩ trắng\u003c/i> — mời một bên chào mua thân thiện hơn trả giá cao hơn; \u003ci>viên ngọc quý\u003c/i> — bán hoặc trao quyền chọn với tài sản mà bên chào mua thèm muốn nhất; \u003ci>Pac-Man\u003c/i> — chào mua ngược lại chính kẻ tấn công; \u003ci>tiền chuộc (greenmail)\u003c/i> — mua lại cổ phần của kẻ tấn công với giá thặng dư; \u003ci>kiện tụng và khiếu nại pháp lý\u003c/i> để kéo dài thời gian; \u003ci>tái cấu trúc vốn\u003c/i> với cổ tức đặc biệt để làm công ty mục tiêu kém hấp dẫn.\u003c/p>\u003cp>\u003cb>Cân nhắc nghĩa vụ tín thác.\u003c/b> Nghĩa vụ của hội đồng hướng tới \u003cb>công ty và cổ đông\u003c/b>, không phải bảo toàn vị trí của ban điều hành. Hội đồng nên: (i) lấy một \u003cb>định giá độc lập và ý kiến về tính công bằng\u003c/b> để xác lập liệu lời chào mua có thực sự định giá thấp công ty hay không; (ii) ghi chép rằng mọi biện pháp phòng thủ là phản ứng tương xứng với một mối đe dọa thực, không phải sự cố thủ; (iii) quản lý xung đột — các thành viên hội đồng và lãnh đạo có chiếc dù vàng hoặc vai trò tiếp diễn nên rút khỏi các quyết định then chốt; (iv) cân nhắc liệu một cuộc đấu giá có mang lại giá trị tốt hơn cho cổ đông so với việc kháng cự; (v) tuân thủ nghĩa vụ công bố và đối xử bình đẳng với cổ đông. Thực nghiệm cho thấy phòng thủ mạnh (đặc biệt hội đồng bầu so le) gắn với \u003cb>mức thặng dư thực nhận thấp hơn\u003c/b>, nên kháng cự toàn diện tự nó có thể phá hủy giá trị cổ đông — lập trường bảo vệ được là dùng phòng thủ như \u003cb>đòn bẩy thương lượng\u003c/b> để nâng giá, chứ không phải để đánh bại mọi lời chào mua.\u003c/p>","rubricVi":"Mô tả đúng ít nhất bốn biện pháp phòng ngừa và ba biện pháp ứng phó (1,8) · phân biệt rõ phòng ngừa/ứng phó (0,5) · phân tích nghĩa vụ tín thác gồm rủi ro cố thủ và ý kiến công bằng (1,2) · kết luận cân bằng có dẫn bằng chứng (0,5)."},{"id":"E4-3","ch":4,"type":"essay","clo":"CLO2","marks":4,"exam":"final","q":"Describe the operations of investment fund management: raising capital for the fund, investing the capital, and the supporting arrangements. Distinguish open-end funds, closed-end funds and ETFs.","guide":"\u003cp>\u003cb>Model answer — raising capital.\u003c/b> Design the fund (objective, strategy, benchmark, fee schedule, term); obtain regulatory approval and appoint the \u003cb>supervisory bank / custodian\u003c/b>; prepare the prospectus and fund charter; distribute units through the manager's channels, securities companies, banks or advisors. Public funds must meet a minimum capital raised and a minimum number of investors to be established.\u003c/p>\u003cp>\u003cb>Investing the capital.\u003c/b> Apply the mandate and benchmark → strategic asset allocation and tactical tilts → security selection driven by research → execution with best execution and cost control → risk control through diversification and regulatory limits (single-issuer caps, restrictions on borrowing and lending) → monitoring and rebalancing.\u003c/p>\u003cp>\u003cb>Supporting arrangements.\u003c/b> Independent custody and supervision of assets; daily valuation and \u003cb>NAV per unit = (total assets − total liabilities) ÷ units outstanding\u003c/b>; processing of subscriptions and redemptions; reporting to investors and the regulator with audited annual accounts; and fee collection (management fee, and performance fee where permitted, subject to a hurdle and high-water mark).\u003c/p>\u003cp>\u003cb>Fund types.\u003c/b> An \u003cb>open-end fund\u003c/b> continuously issues and redeems units at NAV, so its size fluctuates with flows and it must hold liquidity for redemptions. A \u003cb>closed-end fund\u003c/b> has a fixed number of units traded on the secondary market with \u003cb>no redemption obligation\u003c/b>, so it can hold illiquid assets but its price may deviate from NAV (trading at a discount or premium). An \u003cb>ETF\u003c/b> is an open-end structure whose units trade intraday on an exchange, with the market price kept close to NAV by \u003cb>authorised-participant arbitrage\u003c/b> through in-kind creation and redemption.\u003c/p>","rubric":"Raising capital incl. custodian and prospectus (1.0) · investment process (1.0) · NAV formula and supporting arrangements (1.0) · three fund types correctly distinguished (1.0).","qVi":"Mô tả các nghiệp vụ quản lý quỹ đầu tư: huy động vốn cho quỹ, đầu tư số vốn đó, và các thu xếp hỗ trợ. Phân biệt quỹ mở, quỹ đóng và ETF.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — huy động vốn.\u003c/b> Thiết kế quỹ (mục tiêu, chiến lược, chỉ số tham chiếu, biểu phí, thời hạn); xin phê duyệt của cơ quan quản lý và chỉ định \u003cb>ngân hàng giám sát / lưu ký\u003c/b>; chuẩn bị bản cáo bạch và điều lệ quỹ; phân phối chứng chỉ quỹ qua kênh của công ty quản lý, công ty chứng khoán, ngân hàng hoặc nhà tư vấn. Quỹ đại chúng phải đạt mức vốn huy động tối thiểu và số nhà đầu tư tối thiểu để được thành lập.\u003c/p>\u003cp>\u003cb>Đầu tư số vốn.\u003c/b> Áp dụng mệnh lệnh đầu tư và chỉ số tham chiếu → phân bổ tài sản chiến lược và điều chỉnh chiến thuật → lựa chọn chứng khoán dựa trên nghiên cứu → thực hiện giao dịch với nguyên tắc thực hiện tốt nhất và kiểm soát chi phí → kiểm soát rủi ro qua đa dạng hóa và các giới hạn theo quy định (trần với một tổ chức phát hành, hạn chế vay và cho vay) → giám sát và tái cân bằng.\u003c/p>\u003cp>\u003cb>Các thu xếp hỗ trợ.\u003c/b> Lưu ký và giám sát tài sản độc lập; định giá hằng ngày và \u003cb>NAV mỗi chứng chỉ = (tổng tài sản − tổng nợ phải trả) ÷ số chứng chỉ đang lưu hành\u003c/b>; xử lý việc mua và mua lại chứng chỉ quỹ; báo cáo cho nhà đầu tư và cơ quan quản lý kèm báo cáo thường niên đã kiểm toán; và thu phí (phí quản lý, và phí hiệu quả nơi được phép, tuân theo ngưỡng và mốc cao nhất).\u003c/p>\u003cp>\u003cb>Các loại quỹ.\u003c/b> Một \u003cb>quỹ mở\u003c/b> liên tục phát hành và mua lại chứng chỉ theo NAV, nên quy mô biến động theo dòng vốn và quỹ phải giữ thanh khoản để đáp ứng việc mua lại. Một \u003cb>quỹ đóng\u003c/b> có số chứng chỉ cố định giao dịch trên thị trường thứ cấp và \u003cb>không có nghĩa vụ mua lại\u003c/b>, nên có thể nắm giữ tài sản kém thanh khoản nhưng giá có thể lệch khỏi NAV (giao dịch ở mức chiết khấu hoặc thặng dư). Một \u003cb>ETF\u003c/b> là cấu trúc quỹ mở với chứng chỉ giao dịch trong phiên trên sở giao dịch, giá thị trường được giữ sát NAV nhờ \u003cb>kinh doanh chênh lệch giá của thành viên lập quỹ được ủy quyền\u003c/b>.\u003c/p>","rubricVi":"Huy động vốn gồm ngân hàng lưu ký và bản cáo bạch (1,0) · quy trình đầu tư (1,0) · công thức NAV và các thu xếp hỗ trợ (1,0) · phân biệt đúng ba loại quỹ (1,0)."},{"id":"E4-4","ch":4,"type":"calc-essay","clo":"CLO2","marks":3,"exam":"final","q":"A fund has AUM of VND 1,000 billion, charges a 1.75% management fee and 20% carry over a 7% hurdle, and delivers a gross return of 12%. (a) Compute the performance fee, the investor's net return and the manager's total revenue. (b) Explain how the answer changes if the gross return is 5%. (c) Explain the purpose of a high-water mark.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Excess over hurdle = 12% − 7% = 5%; performance fee = 20% × 5% = \u003cb>1.0%\u003c/b>. Investor net return = 12% − 1.75% − 1.0% = \u003cb>9.25%\u003c/b>. Manager revenue = (1.75% + 1.0%) × 1,000 = \u003cb>VND 27.5 billion\u003c/b>.\u003c/p>\u003cp>(b) At a 5% gross return the hurdle of 7% is \u003cb>not cleared\u003c/b>, so no carry is earned. Investor net return = 5% − 1.75% = \u003cb>3.25%\u003c/b>, and manager revenue falls to 1.75% × 1,000 = \u003cb>VND 17.5 billion\u003c/b>. Note that the management fee is charged regardless of performance — which is precisely why gathering and retaining AUM, not just generating returns, drives an asset manager's profitability.\u003c/p>\u003cp>(c) A \u003cb>high-water mark\u003c/b> records the highest NAV on which performance fees have already been paid; no further carry may be charged until the NAV exceeds that previous peak. Without it, a manager who loses 20% in one year and gains 20% the next would collect carry on the recovery — charging twice for the same gains and rewarding volatility rather than skill. Together with the hurdle it aligns the manager's incentives with the investor's.\u003c/p>","rubric":"(a) three figures correct (1.2) · (b) zero carry recognised with both figures and the AUM insight (1.0) · (c) high-water mark purpose with a numerical illustration (0.8).","qVi":"Một quỹ có AUM 1.000 tỷ đồng, thu phí quản lý 1,75% và lãi thưởng 20% trên ngưỡng 7%, đạt lợi suất gộp 12%. (a) Tính phí hiệu quả, lợi suất ròng của nhà đầu tư và tổng doanh thu của nhà quản lý. (b) Giải thích đáp án thay đổi ra sao nếu lợi suất gộp là 5%. (c) Giải thích mục đích của mốc cao nhất.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Phần vượt ngưỡng = 12% − 7% = 5%; phí hiệu quả = 20% × 5% = \u003cb>1,0%\u003c/b>. Lợi suất ròng của nhà đầu tư = 12% − 1,75% − 1,0% = \u003cb>9,25%\u003c/b>. Doanh thu của nhà quản lý = (1,75% + 1,0%) × 1.000 = \u003cb>27,5 tỷ đồng\u003c/b>.\u003c/p>\u003cp>(b) Ở lợi suất gộp 5%, ngưỡng 7% \u003cb>không được vượt qua\u003c/b>, nên không phát sinh lãi thưởng. Lợi suất ròng của nhà đầu tư = 5% − 1,75% = \u003cb>3,25%\u003c/b>, và doanh thu của nhà quản lý giảm còn 1,75% × 1.000 = \u003cb>17,5 tỷ đồng\u003c/b>. Lưu ý phí quản lý được thu bất kể hiệu quả — đó chính là lý do việc thu hút và giữ chân AUM, chứ không chỉ tạo ra lợi nhuận, mới dẫn dắt khả năng sinh lời của một công ty quản lý tài sản.\u003c/p>\u003cp>(c) \u003cb>Mốc cao nhất\u003c/b> ghi lại NAV cao nhất mà phí hiệu quả đã được trả trên đó; không được thu thêm lãi thưởng cho tới khi NAV vượt qua đỉnh trước đó. Không có nó, một nhà quản lý lỗ 20% trong một năm rồi lãi 20% năm sau sẽ thu lãi thưởng trên phần hồi phục — thu hai lần cho cùng một khoản lãi và tưởng thưởng cho sự biến động thay vì kỹ năng. Cùng với ngưỡng sinh lời, nó gắn kết động cơ của nhà quản lý với nhà đầu tư.\u003c/p>","rubricVi":"(a) ba con số đúng (1,2) · (b) nhận ra lãi thưởng bằng 0 với cả hai con số và nhận thức về AUM (1,0) · (c) mục đích mốc cao nhất với minh họa bằng số (0,8)."},{"id":"E5-3","ch":5,"type":"essay","clo":"CLO2","marks":4,"exam":"final","q":"Explain the equitization of a state-owned enterprise: its purpose, the steps in the process, and the principal valuation difficulty. Why is this step so heavily scrutinised?","guide":"\u003cp>\u003cb>Model answer — purpose.\u003c/b> Equitization (cổ phần hóa) converts an SOE into a joint-stock company and sells part of the state's holding, in order to mobilise capital from outside investors, improve governance and operating efficiency through private ownership and outside directors, reduce the state's fiscal burden, and deepen the securities market. Legally it is also the only route by which the enterprise can later issue shares publicly and list, since only a joint-stock company may do so.\u003c/p>\u003cp>\u003cb>Process.\u003c/b> (1) Establish the steering committee and assisting team. (2) Inventory and classify assets; settle financial matters and outstanding obligations. (3) \u003cb>Value the enterprise\u003c/b>. (4) Prepare and obtain approval of the equitization plan — charter capital, and allocation of shares among the state, strategic investors, employees/trade union and the public. (5) Sell shares by IPO through the exchange, by sale to strategic investors, and by preferential sale to employees. (6) Register the joint-stock company, hold the first General Meeting of Shareholders and hand over. (7) Register for trading or listing.\u003c/p>\u003cp>\u003cb>The valuation difficulty.\u003c/b> The contested elements are \u003cb>land-use rights\u003c/b>, brand value and goodwill. Land-use rights are frequently the largest single item of value and the hardest to price: their value depends on location, permitted use and the duration and form of the allocation, and there may be no comparable market transaction.\u003c/p>\u003cp>\u003cb>Why it is scrutinised.\u003c/b> Because the valuation determines how much public wealth transfers to private buyers. Undervaluation transfers state assets cheaply to insiders or strategic investors — a recurring source of loss and of prosecution; overvaluation makes the offering fail and wastes the process. The advisor's methodology must therefore be transparent, defensible and independently reviewable.\u003c/p>","rubric":"Purpose incl. legal precondition for listing (1.0) · at least five process steps in order (1.4) · land-use-rights valuation problem identified (1.0) · public-interest rationale for scrutiny (0.6).","qVi":"Giải thích việc cổ phần hóa một doanh nghiệp nhà nước: mục đích, các bước trong quy trình, và khó khăn định giá chính. Vì sao bước này bị giám sát chặt chẽ đến vậy?","guideVi":"\u003cp>\u003cb>Bài giải mẫu — mục đích.\u003c/b> Cổ phần hóa chuyển một doanh nghiệp nhà nước thành công ty cổ phần và bán một phần sở hữu của Nhà nước, nhằm huy động vốn từ nhà đầu tư bên ngoài, cải thiện quản trị và hiệu quả vận hành thông qua sở hữu tư nhân và thành viên hội đồng quản trị bên ngoài, giảm gánh nặng ngân sách của Nhà nước, và làm sâu thêm thị trường chứng khoán. Về pháp lý, đó cũng là con đường duy nhất để doanh nghiệp về sau có thể phát hành cổ phần ra công chúng và niêm yết, vì chỉ công ty cổ phần mới được làm vậy.\u003c/p>\u003cp>\u003cb>Quy trình.\u003c/b> (1) Thành lập ban chỉ đạo và tổ giúp việc. (2) Kiểm kê và phân loại tài sản; xử lý các vấn đề tài chính và nghĩa vụ tồn đọng. (3) \u003cb>Định giá doanh nghiệp\u003c/b>. (4) Lập và trình phê duyệt phương án cổ phần hóa — vốn điều lệ, và phân bổ cổ phần giữa Nhà nước, nhà đầu tư chiến lược, người lao động/công đoàn và công chúng. (5) Bán cổ phần qua IPO trên sở giao dịch, bán cho nhà đầu tư chiến lược, và bán ưu đãi cho người lao động. (6) Đăng ký công ty cổ phần, tổ chức Đại hội đồng cổ đông lần đầu và bàn giao. (7) Đăng ký giao dịch hoặc niêm yết.\u003c/p>\u003cp>\u003cb>Khó khăn định giá.\u003c/b> Các cấu phần gây tranh cãi là \u003cb>quyền sử dụng đất\u003c/b>, giá trị thương hiệu và lợi thế thương mại. Quyền sử dụng đất thường là khoản giá trị đơn lẻ lớn nhất và khó định giá nhất: giá trị của nó phụ thuộc vị trí, mục đích sử dụng được phép, thời hạn và hình thức giao đất, và có thể không có giao dịch thị trường tương đương.\u003c/p>\u003cp>\u003cb>Vì sao bị giám sát.\u003c/b> Vì việc định giá quyết định bao nhiêu của cải công chuyển sang người mua tư nhân. Định giá thấp chuyển tài sản nhà nước với giá rẻ sang người trong cuộc hoặc nhà đầu tư chiến lược — một nguồn thất thoát và truy tố tái diễn; định giá cao khiến đợt chào bán thất bại và lãng phí cả quy trình. Phương pháp của nhà tư vấn do đó phải minh bạch, bảo vệ được và có thể được rà soát độc lập.\u003c/p>","rubricVi":"Mục đích gồm điều kiện tiên quyết pháp lý để niêm yết (1,0) · ít nhất năm bước quy trình theo trình tự (1,4) · nhận diện vấn đề định giá quyền sử dụng đất (1,0) · lý do lợi ích công của việc giám sát (0,6)."},{"id":"E5-4","ch":5,"type":"essay","clo":"CLO2","marks":4,"exam":"final","q":"A profitable, family-controlled company plans to list. Explain the listing conditions and process, evaluate the advantages and disadvantages of listing for this owner, and explain what governance restructuring you would recommend beforehand.","guide":"\u003cp>\u003cb>Model answer — conditions and process.\u003c/b> Conditions typically cover charter capital (≥ VND 30 billion), operating history as a joint-stock company, profitability (ROE ≥ 5%, profitable years, no accumulated losses), ownership dispersion (≥ 15% of voting shares held by ≥ 100 non-major shareholders), absence of long-overdue debts, and lock-up undertakings from insiders. The advisory process runs: eligibility assessment and gap analysis → restructuring and preparation → valuation and choice of exchange and timing → dossier and prospectus → submission and approval → first trading day → ongoing disclosure and investor relations.\u003c/p>\u003cp>\u003cb>Advantages for this owner:\u003c/b> access to capital on better terms and a public market price for the shares; liquidity and partial monetisation for the family; reputation and credibility with banks, customers and partners; shares usable as acquisition currency and for employee incentives; a framework for succession.\u003c/p>\u003cp>\u003cb>Disadvantages:\u003c/b> the cost of listing and continuing compliance; extensive continuous disclosure, including of matters a family firm may prefer private; pressure for short-term results and exposure to market sentiment; dilution and loss of absolute control, with exposure to takeover; and personal liability and scrutiny for directors.\u003c/p>\u003cp>\u003cb>Governance restructuring recommended beforehand:\u003c/b> appoint genuinely \u003cb>independent directors\u003c/b> and separate the roles of chair and chief executive; establish \u003cb>audit, remuneration and nomination committees\u003c/b> with real authority; appoint a reputable external auditor and build an internal audit function reporting to the audit committee; clean up and formalise \u003cb>related-party transactions\u003c/b>, which in a family firm are the single greatest investor concern; strengthen disclosure capability, including bilingual reporting; and introduce minority-protection provisions in the charter. The commercial argument is direct: closing the \u003cb>governance discount\u003c/b> raises the multiple achieved at IPO, so this work pays for itself.\u003c/p>","rubric":"Conditions with figures (1.0) · process (0.8) · balanced advantages and disadvantages specific to a family owner (1.2) · concrete governance recommendations linked to valuation (1.0).","qVi":"Một công ty do gia đình kiểm soát, làm ăn có lãi, dự định niêm yết. Giải thích các điều kiện và quy trình niêm yết, đánh giá lợi thế và bất lợi của việc niêm yết đối với chủ sở hữu này, và giải thích bạn sẽ khuyến nghị tái cấu trúc quản trị thế nào trước đó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — điều kiện và quy trình.\u003c/b> Các điều kiện thường bao gồm vốn điều lệ (≥ 30 tỷ đồng), lịch sử hoạt động dưới hình thức công ty cổ phần, khả năng sinh lời (ROE ≥ 5%, các năm có lãi, không có lỗ lũy kế), phân tán sở hữu (≥ 15% cổ phiếu có quyền biểu quyết do ≥ 100 cổ đông không phải cổ đông lớn nắm giữ), không có nợ quá hạn kéo dài, và cam kết hạn chế chuyển nhượng từ người nội bộ. Quy trình tư vấn diễn ra: đánh giá điều kiện và phân tích khoảng trống → tái cấu trúc và chuẩn bị → định giá và chọn sở giao dịch cùng thời điểm → hồ sơ và bản cáo bạch → nộp và phê duyệt → ngày giao dịch đầu tiên → công bố thông tin liên tục và quan hệ nhà đầu tư.\u003c/p>\u003cp>\u003cb>Lợi thế đối với chủ sở hữu này:\u003c/b> tiếp cận vốn với điều kiện tốt hơn và một mức giá thị trường công khai cho cổ phần; thanh khoản và hiện thực hóa một phần cho gia đình; danh tiếng và uy tín với ngân hàng, khách hàng và đối tác; cổ phần dùng làm phương tiện thâu tóm và khích lệ người lao động; một khuôn khổ cho việc kế thừa.\u003c/p>\u003cp>\u003cb>Bất lợi:\u003c/b> chi phí niêm yết và tuân thủ liên tục; công bố liên tục sâu rộng, kể cả những vấn đề mà một công ty gia đình muốn giữ riêng tư; áp lực về kết quả ngắn hạn và rủi ro trước tâm lý thị trường; pha loãng và mất kiểm soát tuyệt đối, kèm rủi ro bị thâu tóm; và trách nhiệm cá nhân cùng sự giám sát đối với thành viên hội đồng quản trị.\u003c/p>\u003cp>\u003cb>Tái cấu trúc quản trị được khuyến nghị trước đó:\u003c/b> bổ nhiệm \u003cb>thành viên hội đồng quản trị độc lập\u003c/b> thực chất và tách vai trò chủ tịch khỏi tổng giám đốc; thiết lập các \u003cb>ủy ban kiểm toán, thù lao và đề cử\u003c/b> có thẩm quyền thực; bổ nhiệm một kiểm toán độc lập uy tín và xây dựng chức năng kiểm toán nội bộ báo cáo lên ủy ban kiểm toán; làm sạch và chính thức hóa các \u003cb>giao dịch với bên liên quan\u003c/b>, thứ mà trong một công ty gia đình là mối lo lớn nhất của nhà đầu tư; tăng cường năng lực công bố thông tin, kể cả báo cáo song ngữ; và đưa các điều khoản bảo vệ cổ đông thiểu số vào điều lệ. Lập luận thương mại rất trực tiếp: khép lại \u003cb>chiết khấu quản trị\u003c/b> làm tăng bội số đạt được lúc IPO, nên công việc này tự nó sinh lời.\u003c/p>","rubricVi":"Điều kiện với con số (1,0) · quy trình (0,8) · lợi thế và bất lợi cân bằng, cụ thể cho một chủ sở hữu gia đình (1,2) · khuyến nghị quản trị cụ thể gắn với định giá (1,0)."},{"id":"E6-4","ch":6,"type":"essay","clo":"CLO3","marks":4,"exam":"final","q":"Explain the brokerage process from account opening to settlement, describe the main order types used on Vietnamese exchanges, and explain the matching priority rules.","guide":"\u003cp>\u003cb>Model answer — process.\u003c/b> (1) \u003cb>Open the account\u003c/b> — client identification, brokerage contract, risk profiling and registration with the depository. (2) \u003cb>Deposit\u003c/b> funds and securities into the designated accounts. (3) \u003cb>Receive the order\u003c/b> — in person, by telephone or online — and verify available purchasing power or securities balance. (4) \u003cb>Enter the order\u003c/b> into the exchange's trading system. (5) \u003cb>Matching\u003c/b> by the exchange and confirmation to the client. (6) \u003cb>Clearing and settlement\u003c/b> through the depository on the T+n cycle. (7) \u003cb>Reporting\u003c/b> and account statements. Throughout, the broker owes duties of best execution, segregation of client assets and client order priority.\u003c/p>\u003cp>\u003cb>Order types.\u003c/b> \u003cb>LO\u003c/b> (limit order) executes at the stated price or better — certainty of price but not of execution. \u003cb>MP / MTL\u003c/b> (market order) executes at the best available price — certainty of execution but not of price; any unexecuted remainder is typically converted to a limit order or cancelled. \u003cb>ATO\u003c/b> (at-the-open) participates only in the opening call auction and has priority over LO orders in that matching. \u003cb>ATC\u003c/b> (at-the-close) participates only in the closing call auction. Prices must lie within the daily band between the \u003cb>floor\u003c/b> and the \u003cb>ceiling\u003c/b> around the reference price.\u003c/p>\u003cp>\u003cb>Matching priority.\u003c/b> \u003cb>Price priority first\u003c/b> — the highest bid and the lowest ask are matched first. \u003cb>Then time priority\u003c/b> — among orders at the same price, the one entered earlier is matched first. In call auctions the system selects the price that maximises executed volume, with ATO/ATC orders taking precedence over limit orders at the same price.\u003c/p>","rubric":"Seven-step process in order (1.4) · four order types with correct behaviour (1.4) · price-then-time priority stated correctly (0.8) · duties/price band mentioned (0.4).","qVi":"Giải thích quy trình môi giới từ mở tài khoản tới thanh toán, mô tả các loại lệnh chính dùng trên các sở giao dịch Việt Nam, và giải thích các quy tắc ưu tiên khớp lệnh.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — quy trình.\u003c/b> (1) \u003cb>Mở tài khoản\u003c/b> — nhận diện khách hàng, hợp đồng môi giới, lập hồ sơ rủi ro và đăng ký với trung tâm lưu ký. (2) \u003cb>Nộp\u003c/b> tiền và chứng khoán vào các tài khoản được chỉ định. (3) \u003cb>Nhận lệnh\u003c/b> — trực tiếp, qua điện thoại hoặc trực tuyến — và kiểm tra sức mua khả dụng hoặc số dư chứng khoán. (4) \u003cb>Nhập lệnh\u003c/b> vào hệ thống giao dịch của sở. (5) \u003cb>Khớp lệnh\u003c/b> bởi sở giao dịch và xác nhận cho khách hàng. (6) \u003cb>Bù trừ và thanh toán\u003c/b> qua trung tâm lưu ký theo chu kỳ T+n. (7) \u003cb>Báo cáo\u003c/b> và sao kê tài khoản. Xuyên suốt, công ty môi giới có nghĩa vụ thực hiện tốt nhất, tách bạch tài sản khách hàng và ưu tiên lệnh khách hàng.\u003c/p>\u003cp>\u003cb>Các loại lệnh.\u003c/b> \u003cb>LO\u003c/b> (lệnh giới hạn) thực hiện ở mức giá đã nêu hoặc tốt hơn — chắc chắn về giá nhưng không chắc chắn về việc khớp. \u003cb>MP / MTL\u003c/b> (lệnh thị trường) thực hiện ở mức giá tốt nhất hiện có — chắc chắn khớp nhưng không chắc chắn về giá; phần chưa khớp thường được chuyển thành lệnh giới hạn hoặc bị hủy. \u003cb>ATO\u003c/b> (lệnh mở cửa) chỉ tham gia phiên khớp lệnh định kỳ mở cửa và được ưu tiên hơn lệnh LO trong lần khớp đó. \u003cb>ATC\u003c/b> (lệnh đóng cửa) chỉ tham gia phiên khớp lệnh định kỳ đóng cửa. Giá phải nằm trong biên độ ngày giữa \u003cb>giá sàn\u003c/b> và \u003cb>giá trần\u003c/b> quanh giá tham chiếu.\u003c/p>\u003cp>\u003cb>Ưu tiên khớp lệnh.\u003c/b> \u003cb>Ưu tiên về giá trước\u003c/b> — lệnh mua giá cao nhất và lệnh bán giá thấp nhất được khớp trước. \u003cb>Rồi ưu tiên về thời gian\u003c/b> — trong các lệnh cùng mức giá, lệnh nhập trước được khớp trước. Trong phiên khớp lệnh định kỳ, hệ thống chọn mức giá làm tối đa hóa khối lượng khớp, với lệnh ATO/ATC được ưu tiên hơn lệnh giới hạn ở cùng mức giá.\u003c/p>","rubricVi":"Quy trình bảy bước theo trình tự (1,4) · bốn loại lệnh với hành vi đúng (1,4) · nêu đúng ưu tiên giá rồi thời gian (0,8) · đề cập nghĩa vụ/biên độ giá (0,4)."},{"id":"E6-5","ch":6,"type":"case","clo":"CLO3","marks":4,"exam":"final","q":"A securities company wishes to expand its margin lending book significantly. Explain how margin lending works, quantify the risk with an example, and advise the board on the risk-management framework and the systemic concerns a regulator would raise.","guide":"\u003cp>\u003cb>Model answer — mechanics.\u003c/b> Margin lending is a loan from the securities company to a client to buy securities, secured by the securities in the client's account. The \u003cb>initial margin\u003c/b> is the client's required equity contribution; the \u003cb>maintenance margin\u003c/b> is the minimum equity ratio thereafter. Buying power = Equity ÷ initial margin%; equity = market value − loan; and the \u003cb>margin call price = purchase price × (1 − initial margin) ÷ (1 − maintenance margin)\u003c/b>. Positions are marked to market daily; if equity falls below the maintenance level the firm issues a \u003cb>margin call\u003c/b>, and if it is unmet the firm \u003cb>force-sells\u003c/b>.\u003c/p>\u003cp>\u003cb>Quantified example.\u003c/b> A client buys at VND 50,000 with 50% initial and 30% maintenance margin. Call price = 50,000 × 0.50 ÷ 0.70 = \u003cb>VND 35,714\u003c/b>. Leverage is 2×, so a −20% price move produces roughly a \u003cb>−40%\u003c/b> return on the client's equity; a −29% move wipes out more than half of it and triggers the call.\u003c/p>\u003cp>\u003cb>Risk-management framework.\u003c/b> Lend only against an \u003cb>eligible securities list\u003c/b> screened for liquidity, free float and volatility; impose \u003cb>concentration limits\u003c/b> per security, per client and per group of related clients; set loan-to-value ratios below the regulatory maximum with buffers for volatile names; mark to market intra-day with automated alerts; define and enforce a documented margin-call and force-sale procedure with clear timelines; stress-test the book against a market-wide fall (e.g. −20% and −30%); monitor the firm's own funding liquidity, since the book must be financed; and ensure legal enforceability of the collateral.\u003c/p>\u003cp>\u003cb>Systemic concerns.\u003c/b> Margin lending is \u003cb>pro-cyclical\u003c/b>: falling prices trigger calls, forced selling pushes prices lower and triggers further calls — a downward spiral that can turn a correction into a crash. Concentration in a few popular stocks means many clients are forced to sell the same names simultaneously. Regulators therefore cap margin ratios directly, restrict eligible securities, and treat the aggregate margin balance as a macro-prudential indicator. The board should recognise that the revenue is attractive precisely because the risk is real, and size the book accordingly.\u003c/p>","rubric":"Mechanics with correct formulae (1.0) · worked numerical example incl. call price and levered return (1.0) · at least four concrete controls (1.2) · pro-cyclicality and macro-prudential argument (0.8).","qVi":"Một công ty chứng khoán muốn mở rộng đáng kể danh mục cho vay ký quỹ. Giải thích cho vay ký quỹ vận hành thế nào, định lượng rủi ro bằng một ví dụ, và tư vấn cho hội đồng quản trị về khuôn khổ quản trị rủi ro cùng các quan ngại hệ thống mà cơ quan quản lý sẽ nêu.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — cơ chế.\u003c/b> Cho vay ký quỹ là một khoản vay từ công ty chứng khoán cho khách hàng để mua chứng khoán, được bảo đảm bằng chính chứng khoán trong tài khoản khách hàng. \u003cb>Ký quỹ ban đầu\u003c/b> là phần vốn chủ khách hàng phải đóng góp; \u003cb>ký quỹ duy trì\u003c/b> là tỷ lệ vốn chủ tối thiểu sau đó. Sức mua = Vốn chủ ÷ tỷ lệ ký quỹ ban đầu; vốn chủ = giá trị thị trường − khoản vay; và \u003cb>giá gọi ký quỹ = giá mua × (1 − ký quỹ ban đầu) ÷ (1 − ký quỹ duy trì)\u003c/b>. Vị thế được định giá lại theo thị trường hằng ngày; nếu vốn chủ giảm dưới mức duy trì, công ty phát hành một \u003cb>lệnh gọi ký quỹ\u003c/b>, và nếu không được đáp ứng thì công ty \u003cb>bán giải chấp\u003c/b>.\u003c/p>\u003cp>\u003cb>Ví dụ định lượng.\u003c/b> Một khách hàng mua ở giá 50.000 đồng với ký quỹ ban đầu 50% và duy trì 30%. Giá gọi ký quỹ = 50.000 × 0,50 ÷ 0,70 = \u003cb>35.714 đồng\u003c/b>. Đòn bẩy là 2×, nên một biến động giá −20% tạo ra khoảng \u003cb>−40%\u003c/b> tỷ suất trên vốn chủ của khách hàng; một biến động −29% quét sạch hơn một nửa vốn chủ và kích hoạt lệnh gọi.\u003c/p>\u003cp>\u003cb>Khuôn khổ quản trị rủi ro.\u003c/b> Chỉ cho vay đối với một \u003cb>danh mục chứng khoán đủ điều kiện\u003c/b> được sàng lọc theo thanh khoản, lượng cổ phần tự do lưu hành và độ biến động; áp \u003cb>giới hạn tập trung\u003c/b> theo từng chứng khoán, từng khách hàng và từng nhóm khách hàng liên quan; đặt tỷ lệ cho vay trên giá trị tài sản bảo đảm thấp hơn mức tối đa theo quy định, kèm dư địa lớn hơn cho các mã biến động mạnh; định giá lại trong phiên với cảnh báo tự động; xác định và thực thi một quy trình gọi ký quỹ và bán giải chấp có ghi chép với thời hạn rõ ràng; kiểm tra sức chịu đựng của danh mục trước một đợt giảm toàn thị trường (ví dụ −20% và −30%); giám sát thanh khoản huy động vốn của chính công ty, vì danh mục này phải được tài trợ; và bảo đảm tính thực thi pháp lý của tài sản bảo đảm.\u003c/p>\u003cp>\u003cb>Quan ngại hệ thống.\u003c/b> Cho vay ký quỹ mang tính \u003cb>thuận chu kỳ\u003c/b>: giá giảm kích hoạt lệnh gọi, việc bán bắt buộc đẩy giá xuống thấp hơn và kích hoạt thêm lệnh gọi — một vòng xoáy đi xuống có thể biến một đợt điều chỉnh thành một cú sụp đổ. Sự tập trung vào một vài cổ phiếu phổ biến nghĩa là nhiều khách hàng buộc phải bán cùng những mã đó cùng lúc. Cơ quan quản lý do đó đặt trần trực tiếp cho tỷ lệ ký quỹ, hạn chế danh mục chứng khoán đủ điều kiện, và coi tổng dư nợ ký quỹ toàn thị trường là một chỉ báo an toàn vĩ mô. Hội đồng quản trị nên nhận thức rằng doanh thu hấp dẫn chính vì rủi ro là có thật, và định cỡ danh mục cho tương xứng.\u003c/p>","rubricVi":"Cơ chế với công thức đúng (1,0) · ví dụ tính toán gồm giá gọi ký quỹ và tỷ suất có đòn bẩy (1,0) · ít nhất bốn biện pháp kiểm soát cụ thể (1,2) · tính thuận chu kỳ và lập luận an toàn vĩ mô (0,8)."},{"id":"F1-01","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"State three definitions of investment banking from different authors and derive a single working definition of your own.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003ci>Shiller (2008):\u003c/i> investment banking means the underwriting of securities — arranging the issuance of stocks and bonds by corporations. \u003ci>Dictionary of Banking and Finance (cited by Giri, 2017):\u003c/i> a bank that underwrites new issues and advises corporations on their financial affairs; \u003ci>Bloomberg\u003c/i> adds mergers and reorganisations, broking and trading for its own account. \u003ci>Stowell &amp; Stowell (2024):\u003c/i> an Investment Banking Division serving issuers with financing, M&amp;A advice and lending, and a Trading Division serving institutional investors with new issues, execution, market making and lending. \u003ci>Caselli et al. (2021):\u003c/i> no single global definition exists — the business is defined by fee-earning capital-market activity, in contrast with the commercial bank's interest margin.\u003c/p>\u003cp>\u003cb>Working definition.\u003c/b> An investment bank is an organisation that helps clients raise capital by underwriting the issuance of securities; provides brokerage, research, restructuring and M&amp;A advisory; manages assets; and conducts proprietary trading, private equity and venture capital investment. The narrow definitions capture underwriting only; the broad definition must add advisory, trading and asset management.\u003c/p>","rubric":"Three sourced definitions (1.2) · coherent synthesis distinguishing narrow from broad scope (0.8).","qVi":"Nêu ba định nghĩa về ngân hàng đầu tư của các tác giả khác nhau và rút ra một định nghĩa làm việc của riêng bạn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003ci>Shiller (2008):\u003c/i> ngân hàng đầu tư nghĩa là bảo lãnh phát hành chứng khoán — thu xếp việc phát hành cổ phiếu và trái phiếu của doanh nghiệp. \u003ci>Dictionary of Banking and Finance (Giri, 2017 dẫn lại):\u003c/i> ngân hàng bảo lãnh các đợt phát hành mới và tư vấn tài chính cho doanh nghiệp; \u003ci>Bloomberg\u003c/i> bổ sung sáp nhập, tái tổ chức, môi giới và giao dịch cho chính mình. \u003ci>Stowell &amp; Stowell (2024):\u003c/i> Khối Ngân hàng đầu tư phục vụ tổ chức phát hành bằng tài trợ, tư vấn M&amp;A và cho vay; Khối Giao dịch phục vụ nhà đầu tư tổ chức bằng chứng khoán mới phát hành, thực hiện giao dịch, tạo lập thị trường và cho vay. \u003ci>Caselli và cộng sự (2021):\u003c/i> chưa có định nghĩa toàn cầu duy nhất — hoạt động này được nhận diện bởi việc thu phí trên thị trường vốn, khác với chênh lệch lãi suất của ngân hàng thương mại.\u003c/p>\u003cp>\u003cb>Định nghĩa làm việc.\u003c/b> Ngân hàng đầu tư là một tổ chức giúp khách hàng huy động vốn bằng cách bảo lãnh phát hành chứng khoán; cung cấp môi giới, nghiên cứu, tái cấu trúc và tư vấn M&amp;A; quản lý tài sản; và thực hiện tự doanh, đầu tư vốn cổ phần tư nhân và đầu tư mạo hiểm. Các định nghĩa hẹp chỉ nắm bắt phần bảo lãnh phát hành; định nghĩa rộng phải thêm tư vấn, giao dịch và quản lý tài sản.\u003c/p>","rubricVi":"Ba định nghĩa có nguồn (1,2) · tổng hợp mạch lạc phân biệt phạm vi hẹp và rộng (0,8)."},{"id":"F1-02","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Explain why an investment bank cannot fund itself the way a commercial bank does, and describe the two funding sources it relies on instead.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> An investment bank is not licensed to accept deposits from the public — the defining legal and economic constraint. It therefore cannot access the cheap, sticky, deposit-insured funding base of a commercial bank.\u003c/p>\u003cp>Its \u003cb>largest\u003c/b> source is \u003cb>secured borrowing\u003c/b>: repurchase agreements (repo), sell-and-buy-back transactions, securities lending, short selling and margin agreements, all collateralised by highly liquid securities. Its \u003cb>second\u003c/b> source is \u003cb>unsecured borrowing\u003c/b>: loans from commercial banks and the issuance of bonds, notes and commercial paper. Equity — charter capital, reserves and retained earnings — completes the structure.\u003c/p>\u003cp>The consequence is fragility: secured funding is available in size and cheaply only while the collateral remains liquid and the firm's name is good. In a crisis both conditions fail simultaneously, which is precisely how Bear Stearns and Lehman Brothers lost access to funding in 2008.\u003c/p>","rubric":"Deposit prohibition stated (0.5) · secured borrowing identified as largest with examples (0.8) · unsecured borrowing (0.4) · fragility insight (0.3).","qVi":"Giải thích vì sao ngân hàng đầu tư không thể huy động vốn theo cách của ngân hàng thương mại, và mô tả hai nguồn vốn nó dựa vào thay thế.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Ngân hàng đầu tư không được cấp phép nhận tiền gửi từ công chúng — ràng buộc pháp lý và kinh tế mang tính định nghĩa. Do đó nó không thể tiếp cận nền vốn rẻ, ổn định và được bảo hiểm tiền gửi như ngân hàng thương mại.\u003c/p>\u003cp>Nguồn \u003cb>lớn nhất\u003c/b> là \u003cb>đi vay có tài sản bảo đảm\u003c/b>: hợp đồng mua lại (repo), giao dịch bán và mua lại, cho vay chứng khoán, bán khống và hợp đồng ký quỹ, tất cả được bảo đảm bằng chứng khoán thanh khoản cao. Nguồn \u003cb>thứ hai\u003c/b> là \u003cb>đi vay không bảo đảm\u003c/b>: vay từ ngân hàng thương mại và phát hành trái phiếu, tín phiếu và thương phiếu. Vốn chủ — vốn điều lệ, quỹ dự trữ và lợi nhuận giữ lại — hoàn tất cấu trúc.\u003c/p>\u003cp>Hệ quả là sự mong manh: vốn có bảo đảm chỉ dồi dào và rẻ chừng nào tài sản bảo đảm còn thanh khoản và tên tuổi của công ty còn tốt. Trong khủng hoảng, cả hai điều kiện này cùng đổ vỡ, đó chính là cách Bear Stearns và Lehman Brothers mất khả năng tiếp cận vốn năm 2008.\u003c/p>","rubricVi":"Nêu lệnh cấm nhận tiền gửi (0,5) · xác định đi vay có bảo đảm là nguồn lớn nhất kèm ví dụ (0,8) · đi vay không bảo đảm (0,4) · nhận thức về sự mong manh (0,3)."},{"id":"F1-03","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"both","q":"Describe the six functions of an investment bank and classify each as an agency or a principal function.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Broker\u003c/b> — acts as agent matching buyers and sellers for a commission (\u003ci>agency\u003c/i>). \u003cb>Dealer\u003c/b> — buys and sells for its own account, profiting from price movements (\u003ci>principal\u003c/i>). \u003cb>Market maker\u003c/b> — quotes continuous two-sided prices, earning the spread, where Ask = Bid + spread (\u003ci>principal\u003c/i>). \u003cb>Trustee\u003c/b> — executes transactions decided by the client and manages investments under mandate (\u003ci>agency\u003c/i>). \u003cb>Advisor\u003c/b> — advises on issuance, equitization, M&amp;A, strategy and joint ventures (\u003ci>agency\u003c/i>). \u003cb>Servicer\u003c/b> — supplies prime brokerage to hedge funds: financing, clearing, custody, securities lending (\u003ci>agency\u003c/i>).\u003c/p>\u003cp>Agency functions earn fees with little balance-sheet risk; principal functions earn spreads while carrying inventory and market risk. Almost every conflict-of-interest and regulatory issue in the course arises where the two meet.\u003c/p>","rubric":"Six functions correctly described (1.2) · correct agency/principal classification (0.5) · fee-versus-spread insight (0.3).","qVi":"Mô tả sáu chức năng của ngân hàng đầu tư và phân loại mỗi chức năng là chức năng đại lý hay chức năng chính chủ.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Môi giới\u003c/b> — hành động với vai trò đại lý, kết nối bên mua và bên bán để hưởng hoa hồng (\u003ci>đại lý\u003c/i>). \u003cb>Tự doanh\u003c/b> — mua bán cho tài khoản của chính mình, kiếm lời từ biến động giá (\u003ci>chính chủ\u003c/i>). \u003cb>Tạo lập thị trường\u003c/b> — yết giá hai chiều liên tục, hưởng chênh lệch giá, với Giá chào bán = Giá đặt mua + chênh lệch (\u003ci>chính chủ\u003c/i>). \u003cb>Nhận uỷ thác\u003c/b> — thực hiện các giao dịch do khách hàng quyết định và quản lý khoản đầu tư theo mệnh lệnh (\u003ci>đại lý\u003c/i>). \u003cb>Tư vấn\u003c/b> — tư vấn phát hành, cổ phần hóa, M&amp;A, chiến lược và liên doanh (\u003ci>đại lý\u003c/i>). \u003cb>Cung cấp dịch vụ\u003c/b> — cung cấp môi giới trọn gói cho quỹ đầu cơ: tài trợ, bù trừ, lưu ký, cho vay chứng khoán (\u003ci>đại lý\u003c/i>).\u003c/p>\u003cp>Các chức năng đại lý kiếm phí với ít rủi ro bảng cân đối; các chức năng chính chủ kiếm chênh lệch giá trong khi gánh tồn kho và rủi ro thị trường. Gần như mọi vấn đề xung đột lợi ích và pháp lý trong học phần đều phát sinh ở nơi hai loại này gặp nhau.\u003c/p>","rubricVi":"Mô tả đúng sáu chức năng (1,2) · phân loại đúng đại lý/chính chủ (0,5) · nhận thức phí so với chênh lệch giá (0,3)."},{"id":"F1-04","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Explain the significance of the Glass-Steagall Act of 1933 and of its repeal in 1999, giving one concrete example of the consequence of each.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Glass-Steagall (1933)\u003c/b> separated commercial from investment banking after the 1929 crash: Federal Reserve member banks were barred from issuing, underwriting, selling or distributing securities, and firms principally engaged in investment banking could not own member banks. \u003ci>Consequence:\u003c/i> large houses had to choose — J.P. Morgan &amp; Co. remained a commercial bank while senior staff left to found \u003cb>Morgan Stanley &amp; Co.\u003c/b>\u003c/p>\u003cp>\u003cb>Gramm-Leach-Bliley (1999)\u003c/b>, the Financial Services Modernization Act, repealed the mandatory separation and allowed commercial banks back into securities and insurance. \u003ci>Consequence:\u003c/i> \u003cb>Citigroup\u003c/b> (formed from the 1998 Citicorp–Travelers merger) could retain Travelers' Salomon Brothers investment-banking arm rather than divest it, and \u003cb>Chase Manhattan\u003c/b> merged with \u003cb>J.P. Morgan\u003c/b> in 2000.\u003c/p>\u003cp>The pendulum swung back with \u003cb>Dodd-Frank (2010)\u003c/b>, which imposed capital, liquidity, stress-testing and the Volcker restriction on proprietary trading.\u003c/p>","rubric":"Glass-Steagall content and effect (0.7) · GLB content and effect (0.7) · one correct concrete example each (0.6).","qVi":"Giải thích ý nghĩa của Đạo luật Glass-Steagall năm 1933 và của việc bãi bỏ nó năm 1999, cho một ví dụ cụ thể về hệ quả của mỗi sự kiện.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Glass-Steagall (1933)\u003c/b> tách ngân hàng thương mại khỏi ngân hàng đầu tư sau sụp đổ năm 1929: các ngân hàng thành viên của Cục Dự trữ Liên bang bị cấm phát hành, bảo lãnh, bán hoặc phân phối chứng khoán, và các định chế chủ yếu làm ngân hàng đầu tư không được sở hữu ngân hàng thành viên. \u003ci>Hệ quả:\u003c/i> các định chế lớn phải lựa chọn — J.P. Morgan &amp; Co. giữ mảng ngân hàng thương mại còn nhân sự cấp cao ra đi lập nên \u003cb>Morgan Stanley &amp; Co.\u003c/b>\u003c/p>\u003cp>\u003cb>Gramm-Leach-Bliley (1999)\u003c/b>, Đạo luật Hiện đại hóa Dịch vụ Tài chính, bãi bỏ sự tách bạch bắt buộc và cho phép ngân hàng thương mại trở lại mảng chứng khoán và bảo hiểm. \u003ci>Hệ quả:\u003c/i> \u003cb>Citigroup\u003c/b> (hình thành từ vụ sáp nhập Citicorp–Travelers năm 1998) có thể giữ lại mảng ngân hàng đầu tư Salomon Brothers của Travelers thay vì phải thoái vốn, và \u003cb>Chase Manhattan\u003c/b> sáp nhập với \u003cb>J.P. Morgan\u003c/b> năm 2000.\u003c/p>\u003cp>Con lắc lại đảo chiều với \u003cb>Dodd-Frank (2010)\u003c/b>, đạo luật áp đặt yêu cầu về vốn, thanh khoản, kiểm tra sức chịu đựng và hạn chế Volcker đối với hoạt động tự doanh.\u003c/p>","rubricVi":"Nội dung và tác động của Glass-Steagall (0,7) · nội dung và tác động của GLB (0,7) · một ví dụ cụ thể đúng cho mỗi bên (0,6)."},{"id":"F1-05","ch":1,"type":"case","clo":"CLO1","marks":3,"exam":"final","q":"Explain the CFA Institute's core ethical values and apply them to two situations: (a) an analyst who receives a gift from a company he covers, and (b) a banker who tells a friend about an unannounced deal.","guide":"\u003cp>\u003cb>Model answer — core values.\u003c/b> Members must act with integrity, competence, diligence, respect and in an ethical manner with the public, clients, employers, employees and colleagues; place the \u003cb>integrity of the profession and the interests of clients above their own\u003c/b>; use reasonable care and independent professional judgement; and promote the integrity of capital markets.\u003c/p>\u003cp>\u003cb>(a) Gift from a covered company.\u003c/b> This engages \u003cb>Independence and Objectivity\u003c/b>. A gift of more than token value from a subject company creates a reasonable perception that judgement is compromised. Correct conduct: decline the gift, or if it is token, disclose it to the employer and record it. Firms typically impose a monetary threshold and a written register. The test is not whether the analyst \u003ci>feels\u003c/i> influenced but whether a reasonable investor would doubt the report's independence.\u003c/p>\u003cp>\u003cb>(b) Telling a friend about an unannounced deal.\u003c/b> This engages \u003cb>Material Nonpublic Information\u003c/b>. The banker sits on the private side and holds inside information; disclosing it to anyone outside the wall — and enabling trading on it — is both a Code breach and, in most jurisdictions including Vietnam, a securities-law offence. Correct conduct: do not disclose; if disclosure occurs inadvertently, notify compliance immediately so the security can be placed on a restricted list. The firm's controls are the information barrier, wall-crossing procedures, restricted lists and surveillance.\u003c/p>","rubric":"Core values stated (0.8) · (a) independence/objectivity with the reasonable-perception test and remedy (1.1) · (b) MNPI breach, legal consequence and remedy (1.1).","qVi":"Giải thích các giá trị đạo đức cốt lõi của Viện CFA và áp dụng chúng vào hai tình huống: (a) một chuyên viên phân tích nhận quà từ một công ty mà anh ta theo dõi, và (b) một chuyên viên tư vấn kể cho bạn mình về một thương vụ chưa công bố.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các giá trị cốt lõi.\u003c/b> Thành viên phải hành động chính trực, có năng lực, cần mẫn, tôn trọng và có đạo đức với công chúng, khách hàng, người sử dụng lao động, nhân viên và đồng nghiệp; đặt \u003cb>sự liêm chính của nghề nghiệp và lợi ích của khách hàng lên trên lợi ích của bản thân\u003c/b>; sử dụng sự thận trọng hợp lý và phán đoán chuyên môn độc lập; và thúc đẩy sự liêm chính của thị trường vốn.\u003c/p>\u003cp>\u003cb>(a) Quà từ công ty được theo dõi.\u003c/b> Điều này liên quan đến \u003cb>Tính độc lập và khách quan\u003c/b>. Một món quà có giá trị hơn mức tượng trưng từ công ty là đối tượng phân tích tạo ra nhận thức hợp lý rằng phán đoán đã bị ảnh hưởng. Ứng xử đúng: từ chối món quà, hoặc nếu chỉ mang tính tượng trưng thì công bố với người sử dụng lao động và ghi nhận lại. Các công ty thường đặt ngưỡng giá trị và một sổ đăng ký bằng văn bản. Phép thử không phải là chuyên viên phân tích có \u003ci>cảm thấy\u003c/i> bị ảnh hưởng hay không mà là liệu một nhà đầu tư hợp lý có nghi ngờ tính độc lập của báo cáo hay không.\u003c/p>\u003cp>\u003cb>(b) Kể cho bạn về một thương vụ chưa công bố.\u003c/b> Điều này liên quan đến \u003cb>Thông tin trọng yếu chưa công bố\u003c/b>. Chuyên viên tư vấn thuộc bên riêng tư và nắm thông tin nội bộ; tiết lộ nó cho bất kỳ ai ngoài bức tường — và tạo điều kiện giao dịch dựa trên đó — vừa vi phạm Bộ quy tắc, vừa là hành vi phạm luật chứng khoán ở hầu hết các nước, kể cả Việt Nam. Ứng xử đúng: không tiết lộ; nếu vô tình tiết lộ, báo ngay cho bộ phận tuân thủ để đưa chứng khoán vào danh sách hạn chế. Các biện pháp kiểm soát của công ty là rào chắn thông tin, thủ tục vượt tường, danh sách hạn chế và giám sát.\u003c/p>","rubricVi":"Nêu các giá trị cốt lõi (0,8) · (a) tính độc lập/khách quan với phép thử nhận thức hợp lý và cách xử lý (1,1) · (b) vi phạm thông tin trọng yếu chưa công bố, hệ quả pháp lý và cách xử lý (1,1)."},{"id":"F1-06","ch":1,"type":"essay","clo":"CLO1","marks":2,"exam":"final","q":"Identify the participants that make up the operating environment of an investment bank and explain the contribution of any four of them to a transaction.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The ecosystem comprises law firms, audit firms, tax advisors, credit rating agencies, commercial banks, custody and settlement providers, and research and due-diligence firms — all operating within a domestic and international legal framework and prevailing economic and social conditions.\u003c/p>\u003cp>\u003cb>Four contributions.\u003c/b> \u003ci>Law firms\u003c/i> draft the transaction documents, obtain regulatory clearance and conduct legal due diligence. \u003ci>Audit firms\u003c/i> provide audited financial statements, financial due diligence and comfort letters supporting the prospectus. \u003ci>Credit rating agencies\u003c/i> assign the rating that largely determines the credit spread and therefore the coupon on a debt issue. \u003ci>Custody and settlement providers\u003c/i> hold the securities and clear and settle the trades, without which no transfer of ownership is completed. (Commercial banks supplying bridge finance, or commercial due-diligence consultants, are equally acceptable answers.)\u003c/p>","rubric":"At least six participants listed (0.8) · four contributions explained accurately (1.0) · legal/economic framing (0.2).","qVi":"Nhận diện các chủ thể tạo nên môi trường hoạt động của một ngân hàng đầu tư và giải thích đóng góp của bất kỳ bốn chủ thể nào trong một giao dịch.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Hệ sinh thái gồm các hãng luật, hãng kiểm toán, tư vấn thuế, tổ chức xếp hạng tín nhiệm, ngân hàng thương mại, đơn vị lưu ký và thanh toán, cùng các hãng nghiên cứu và thẩm định — tất cả hoạt động trong khuôn khổ pháp lý trong nước và quốc tế cùng bối cảnh kinh tế – xã hội hiện hành.\u003c/p>\u003cp>\u003cb>Bốn đóng góp.\u003c/b> \u003ci>Hãng luật\u003c/i> soạn thảo hồ sơ giao dịch, xin chấp thuận của cơ quan quản lý và thực hiện thẩm định pháp lý. \u003ci>Hãng kiểm toán\u003c/i> cung cấp báo cáo tài chính đã kiểm toán, thẩm định tài chính và thư bảo đảm hỗ trợ bản cáo bạch. \u003ci>Tổ chức xếp hạng tín nhiệm\u003c/i> ấn định mức xếp hạng — thứ quyết định phần lớn chênh lệch tín dụng và do đó lãi suất coupon của một đợt phát hành nợ. \u003ci>Đơn vị lưu ký và thanh toán\u003c/i> nắm giữ chứng khoán và bù trừ, thanh toán các giao dịch, thiếu họ thì không hoàn tất được việc chuyển quyền sở hữu. (Ngân hàng thương mại cung cấp tài trợ bắc cầu, hoặc chuyên gia thẩm định thương mại, cũng là những câu trả lời chấp nhận được.)\u003c/p>","rubricVi":"Liệt kê ít nhất sáu chủ thể (0,8) · giải thích chính xác bốn đóng góp (1,0) · khung pháp lý/kinh tế (0,2)."},{"id":"F2-01","ch":2,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Distinguish a public offering from a private placement, and state two advantages and two disadvantages of private placement for the issuer.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> A \u003cb>public offering\u003c/b> is made widely to the public, requires registration with the State Securities Commission and full prospectus disclosure, and is typically followed by listing. A \u003cb>private placement\u003c/b> is offered to a limited number of professional or strategic investors, carries lighter disclosure, and the securities are subject to transfer restrictions for a defined period.\u003c/p>\u003cp>\u003cb>Advantages of private placement:\u003c/b> speed and materially lower cost; confidentiality, since sensitive information is not published; the ability to bring in a strategic investor who adds expertise, governance or market access; and fewer ongoing obligations.\u003c/p>\u003cp>\u003cb>Disadvantages:\u003c/b> a lower price, because investors demand an illiquidity discount and there is no competitive price discovery; a narrow investor base and concentrated ownership; transfer restrictions reducing liquidity; and possible loss of control or negotiated protective rights for the incoming investor.\u003c/p>","rubric":"Correct distinction incl. registration and transfer restrictions (0.8) · two valid advantages (0.6) · two valid disadvantages (0.6).","qVi":"Phân biệt chào bán ra công chúng với chào bán riêng lẻ, và nêu hai lợi thế và hai bất lợi của chào bán riêng lẻ đối với tổ chức phát hành.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Chào bán ra công chúng\u003c/b> được thực hiện rộng rãi cho công chúng, cần đăng ký với Uỷ ban Chứng khoán Nhà nước và công bố đầy đủ bản cáo bạch, và thường được tiếp nối bằng niêm yết. \u003cb>Chào bán riêng lẻ\u003c/b> được chào cho một số hạn chế nhà đầu tư chuyên nghiệp hoặc chiến lược, có nghĩa vụ công bố nhẹ hơn, và chứng khoán chịu hạn chế chuyển nhượng trong một thời hạn xác định.\u003c/p>\u003cp>\u003cb>Lợi thế của chào bán riêng lẻ:\u003c/b> nhanh và chi phí thấp hơn hẳn; giữ được bảo mật vì thông tin nhạy cảm không bị công bố; khả năng đưa vào một nhà đầu tư chiến lược bổ sung chuyên môn, quản trị hoặc khả năng tiếp cận thị trường; và ít nghĩa vụ định kỳ hơn.\u003c/p>\u003cp>\u003cb>Bất lợi:\u003c/b> giá thấp hơn, vì nhà đầu tư đòi chiết khấu thanh khoản và không có việc khám phá giá cạnh tranh; nền nhà đầu tư hẹp và sở hữu tập trung; hạn chế chuyển nhượng làm giảm thanh khoản; và có thể mất quyền kiểm soát hoặc phải thương lượng các quyền bảo vệ cho nhà đầu tư mới.\u003c/p>","rubricVi":"Phân biệt đúng gồm đăng ký và hạn chế chuyển nhượng (0,8) · hai lợi thế hợp lệ (0,6) · hai bất lợi hợp lệ (0,6)."},{"id":"F2-02","ch":2,"type":"calc-essay","clo":"CLO1","marks":3,"exam":"both","q":"A company with 40 million shares trading at VND 50,000 announces a 1-for-4 rights issue at a subscription price of VND 30,000. (a) Compute the theoretical ex-rights price. (b) Compute the value of one right. (c) Explain what happens to a shareholder who neither subscribes nor sells the rights, and why rights are made tradable.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) For every 4 existing shares the holder may buy 1 new share.\u003cbr>TERP = (4 × 50,000 + 1 × 30,000) ÷ 5 = 230,000 ÷ 5 = \u003cb>VND 46,000\u003c/b>.\u003c/p>\u003cp>(b) Value of one right = cum-rights price − TERP = 50,000 − 46,000 = \u003cb>VND 4,000\u003c/b>. Equivalently (TERP − subscription price) ÷ N = (46,000 − 30,000) ÷ 4 = 4,000.\u003c/p>\u003cp>(c) The market price falls from 50,000 to the TERP of 46,000 on the ex-rights date. A holder who \u003cb>subscribes\u003c/b> is compensated because the new shares are bought below TERP. A holder who \u003cb>sells the rights\u003c/b> receives 4,000 per right, which offsets the price fall. A holder who does \u003cb>nothing\u003c/b> suffers the price fall with no compensation — the value of the lapsed right is simply lost, and their proportional ownership is diluted. Rights are made tradable precisely so that shareholders who cannot or do not wish to contribute new capital can still realise the value of their pre-emption entitlement rather than have it expropriated.\u003c/p>","rubric":"(a) 1.0 with method shown · (b) 0.8 · (c) dilution, the three outcomes, and the rationale for tradability (1.2).","qVi":"Một công ty có 40 triệu cổ phần đang giao dịch ở 50.000 đồng công bố phát hành quyền mua tỷ lệ 1:4 với giá đăng ký 30.000 đồng. (a) Tính giá lý thuyết sau khi tách quyền. (b) Tính giá trị của một quyền. (c) Giải thích điều gì xảy ra với một cổ đông không đăng ký cũng không bán quyền, và vì sao quyền được làm cho có thể chuyển nhượng.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Cứ 4 cổ phần hiện hữu, cổ đông được mua 1 cổ phần mới.\u003cbr>TERP = (4 × 50.000 + 1 × 30.000) ÷ 5 = 230.000 ÷ 5 = \u003cb>46.000 đồng\u003c/b>.\u003c/p>\u003cp>(b) Giá trị một quyền = giá kèm quyền − TERP = 50.000 − 46.000 = \u003cb>4.000 đồng\u003c/b>. Tương đương (TERP − giá đăng ký) ÷ N = (46.000 − 30.000) ÷ 4 = 4.000.\u003c/p>\u003cp>(c) Giá thị trường rơi từ 50.000 xuống TERP 46.000 vào ngày tách quyền. Cổ đông \u003cb>đăng ký mua\u003c/b> được bù đắp vì cổ phần mới được mua dưới TERP. Cổ đông \u003cb>bán quyền\u003c/b> nhận 4.000 mỗi quyền, bù cho phần giá giảm. Cổ đông \u003cb>không làm gì\u003c/b> chịu phần giá giảm mà không được bù — giá trị của quyền bị bỏ lỡ đơn giản là mất đi, và tỷ lệ sở hữu của họ bị pha loãng. Quyền được làm cho có thể chuyển nhượng chính là để những cổ đông không thể hoặc không muốn góp thêm vốn vẫn hiện thực hóa được giá trị của quyền ưu tiên mua thay vì bị tước đoạt.\u003c/p>","rubricVi":"(a) 1,0 có trình bày cách tính · (b) 0,8 · (c) pha loãng, ba kết cục, và lý do quyền có thể chuyển nhượng (1,2)."},{"id":"F2-03","ch":2,"type":"essay","clo":"CLO1","marks":3,"exam":"final","q":"Describe the four ways of classifying share-issuance methods and give an example of each category.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) By offering round.\u003c/b> \u003ci>Initial issuance (IPO)\u003c/i> — the first offering of shares to the public; \u003ci>secondary/seasoned issuance\u003c/i> — subsequent offerings by an already-public company.\u003c/p>\u003cp>\u003cb>(2) By target investor.\u003c/b> \u003ci>Public offering\u003c/i> to the public at large; \u003ci>private placement\u003c/i> to a limited number of professional or strategic investors; \u003ci>rights issue\u003c/i> to existing shareholders in proportion to holdings; \u003ci>ESOP\u003c/i> to employees.\u003c/p>\u003cp>\u003cb>(3) By pricing method.\u003c/b> \u003ci>Fixed price\u003c/i> — the price is set and published before subscription, which is simple but risks mispricing; \u003ci>bookbuilding\u003c/i> — underwriters collect price-and-quantity indications from institutions to build a demand curve and then set the price; \u003ci>auction\u003c/i> — investors bid and shares are allocated from the highest bid downwards.\u003c/p>\u003cp>\u003cb>(4) By distribution method.\u003c/b> \u003ci>Direct issuance\u003c/i> by the issuer itself, or \u003ci>issuance through an underwriting intermediary\u003c/i>, which is the norm for any offering of size because it supplies distribution and, in a firm commitment, absorbs placement risk.\u003c/p>","rubric":"Four axes correctly named (1.2) · at least two sub-categories with explanation under each (1.4) · valid examples (0.4).","qVi":"Mô tả bốn cách phân loại phương thức phát hành cổ phần và cho một ví dụ của mỗi nhóm.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Theo vòng phát hành.\u003c/b> \u003ci>Phát hành lần đầu (IPO)\u003c/i> — lần chào bán cổ phần đầu tiên ra công chúng; \u003ci>phát hành thêm/tiếp theo\u003c/i> — các đợt chào bán sau của một công ty đã đại chúng.\u003c/p>\u003cp>\u003cb>(2) Theo nhà đầu tư mục tiêu.\u003c/b> \u003ci>Chào bán ra công chúng\u003c/i> cho công chúng rộng rãi; \u003ci>chào bán riêng lẻ\u003c/i> cho một số hạn chế nhà đầu tư chuyên nghiệp hoặc chiến lược; \u003ci>phát hành quyền mua\u003c/i> cho cổ đông hiện hữu theo tỷ lệ nắm giữ; \u003ci>ESOP\u003c/i> cho người lao động.\u003c/p>\u003cp>\u003cb>(3) Theo phương pháp định giá.\u003c/b> \u003ci>Giá cố định\u003c/i> — giá được ấn định và công bố trước khi đăng ký, đơn giản nhưng có nguy cơ định giá sai; \u003ci>dựng sổ\u003c/i> — nhà bảo lãnh thu thập chỉ báo về giá và khối lượng từ các tổ chức để dựng đường cầu rồi mới ấn định giá; \u003ci>đấu giá\u003c/i> — nhà đầu tư đặt giá và cổ phần được phân bổ từ mức giá cao nhất trở xuống.\u003c/p>\u003cp>\u003cb>(4) Theo phương thức phân phối.\u003c/b> \u003ci>Phát hành trực tiếp\u003c/i> bởi chính tổ chức phát hành, hoặc \u003ci>phát hành qua một trung gian bảo lãnh\u003c/i>, đây là thông lệ với mọi đợt phát hành có quy mô vì nó cung cấp phân phối và, trong cam kết chắc chắn, hấp thụ rủi ro phân phối.\u003c/p>","rubricVi":"Nêu đúng bốn trục (1,2) · ít nhất hai tiểu nhóm có giải thích dưới mỗi trục (1,4) · ví dụ hợp lệ (0,4)."},{"id":"F2-04","ch":2,"type":"essay","clo":"CLO1","marks":3,"exam":"final","q":"Compare firm-commitment, best-efforts, bought-deal and standby underwriting by reference to the bank's undertaking, who bears placement risk, and the fee the issuer should expect to pay.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Firm commitment:\u003c/b> the bank buys the entire issue at an agreed price and resells it; \u003cb>the bank\u003c/b> bears placement risk and is left with anything unsold; the issuer pays a full gross spread but receives certainty of proceeds. \u003cb>Best efforts:\u003c/b> the bank agrees only to use its best efforts to sell; \u003cb>the issuer\u003c/b> bears the risk that the offering is only partly placed; the fee is correspondingly lower. \u003cb>Bought deal:\u003c/b> the bank buys the whole block immediately, often overnight and without bookbuilding; \u003cb>the bank\u003c/b> bears the highest risk because it has no demand information, so it prices the block at a discount that compensates it. \u003cb>Standby:\u003c/b> in a rights issue the bank agrees to purchase whatever is left unsubscribed; the bank bears \u003cb>residual\u003c/b> risk only, so the fee sits between best efforts and firm commitment.\u003c/p>\u003cp>\u003cb>Principle:\u003c/b> the gross spread rises with the risk the bank absorbs. The issuer is buying certainty, and the price of certainty is the discount plus the spread.\u003c/p>","rubric":"Four types with correct undertaking (1.2) · correct risk-bearer in each (1.0) · fee-rises-with-risk principle articulated (0.8).","qVi":"So sánh bảo lãnh cam kết chắc chắn, nỗ lực tối đa, mua đứt (bought deal) và bảo lãnh dự phòng (standby) theo cam kết của ngân hàng, ai gánh rủi ro phân phối, và mức phí tổ chức phát hành phải chờ đợi.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Cam kết chắc chắn:\u003c/b> ngân hàng mua trọn đợt phát hành ở giá đã thỏa thuận và bán lại; \u003cb>ngân hàng\u003c/b> gánh rủi ro phân phối và giữ lại phần không bán được; tổ chức phát hành trả phí đầy đủ nhưng nhận được sự chắc chắn về số tiền thu. \u003cb>Nỗ lực tối đa:\u003c/b> ngân hàng chỉ cam kết cố gắng hết sức để bán; \u003cb>tổ chức phát hành\u003c/b> gánh rủi ro đợt chào bán chỉ được phân phối một phần; phí tương ứng thấp hơn. \u003cb>Mua đứt:\u003c/b> ngân hàng mua ngay trọn khối, thường qua đêm và không dựng sổ; \u003cb>ngân hàng\u003c/b> gánh rủi ro cao nhất vì không có thông tin về nhu cầu, nên định giá khối đó ở mức chiết khấu để bù đắp. \u003cb>Dự phòng:\u003c/b> trong phát hành quyền mua, ngân hàng cam kết mua phần không được đăng ký; ngân hàng chỉ gánh rủi ro \u003cb>còn dư\u003c/b>, nên phí nằm giữa nỗ lực tối đa và cam kết chắc chắn.\u003c/p>\u003cp>\u003cb>Nguyên tắc:\u003c/b> phí bảo lãnh tăng theo rủi ro mà ngân hàng hấp thụ. Tổ chức phát hành đang mua sự chắc chắn, và giá của sự chắc chắn là mức chiết khấu cộng phí.\u003c/p>","rubricVi":"Bốn loại với cam kết đúng (1,2) · đúng bên gánh rủi ro mỗi loại (1,0) · nêu rõ nguyên tắc phí tăng theo rủi ro (0,8)."},{"id":"F2-05","ch":2,"type":"calc-essay","clo":"CLO1","marks":3,"exam":"final","q":"An issuer offers 25 million shares at VND 42,000 with a gross spread of 4.5% and a 15% greenshoe that is fully exercised. Shares close the first day at VND 52,000. (a) Compute total shares, gross proceeds, the underwriting fee and net proceeds. (b) Compute the money left on the table. (c) Discuss whose interests underpricing serves.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Greenshoe = 15% × 25m = 3.75m, so total shares = \u003cb>28.75m\u003c/b>.\u003cbr>Gross proceeds = 28.75m × 42,000 = \u003cb>VND 1,207.5 billion\u003c/b>.\u003cbr>Fee = 4.5% × 1,207.5 = \u003cb>VND 54.34 billion\u003c/b>.\u003cbr>Net to issuer = 1,207.5 − 54.34 = \u003cb>VND 1,153.16 billion\u003c/b>.\u003c/p>\u003cp>(b) Money left on the table = 28.75m × (52,000 − 42,000) = \u003cb>VND 287.5 billion\u003c/b> — roughly five times the underwriting fee.\u003c/p>\u003cp>(c) Underpricing transfers value from the \u003cb>issuer\u003c/b> (which raises less than the market would have paid) to the \u003cb>investors allocated shares\u003c/b>, who record an immediate gain. It also serves the \u003cb>underwriter\u003c/b>: a cheaper deal is easier to place, reducing its placement risk, and the allocations reward its institutional distribution clients whose future business it wants. This is a structural conflict of interest with the client it advises. Defences include a genuine bookbuilding process, transparency of the allocation policy, and the issuer negotiating the price range with more than one adviser. Some underpricing is nevertheless rational compensation for valuation uncertainty in a first-time issue.\u003c/p>","rubric":"(a) four figures correct (1.2) · (b) 0.6 · (c) all three parties identified with the conflict and a balanced conclusion (1.2).","qVi":"Một tổ chức phát hành chào 25 triệu cổ phần giá 42.000 đồng với phí bảo lãnh 4,5% và greenshoe 15% được thực hiện toàn bộ. Cổ phiếu đóng cửa ngày đầu tiên ở 52.000 đồng. (a) Tính tổng số cổ phần, số tiền thu gộp, phí bảo lãnh và số tiền thu ròng. (b) Tính số tiền bỏ lại trên bàn. (c) Thảo luận việc định giá thấp phục vụ lợi ích của ai.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Greenshoe = 15% × 25 triệu = 3,75 triệu, nên tổng cổ phần = \u003cb>28,75 triệu\u003c/b>.\u003cbr>Số tiền thu gộp = 28,75 triệu × 42.000 = \u003cb>1.207,5 tỷ đồng\u003c/b>.\u003cbr>Phí = 4,5% × 1.207,5 = \u003cb>54,34 tỷ đồng\u003c/b>.\u003cbr>Thu ròng của tổ chức phát hành = 1.207,5 − 54,34 = \u003cb>1.153,16 tỷ đồng\u003c/b>.\u003c/p>\u003cp>(b) Tiền bỏ lại trên bàn = 28,75 triệu × (52.000 − 42.000) = \u003cb>287,5 tỷ đồng\u003c/b> — gấp khoảng năm lần phí bảo lãnh.\u003c/p>\u003cp>(c) Định giá thấp chuyển giá trị từ \u003cb>tổ chức phát hành\u003c/b> (huy động được ít hơn mức thị trường trả) sang \u003cb>các nhà đầu tư được phân bổ cổ phần\u003c/b>, những người ghi nhận lãi ngay lập tức. Nó cũng phục vụ \u003cb>nhà bảo lãnh\u003c/b>: một thương vụ rẻ dễ phân phối hơn, giảm rủi ro phân phối, và các phân bổ tưởng thưởng khách hàng phân phối tổ chức mà họ muốn có việc trong tương lai. Đây là một xung đột lợi ích mang tính cấu trúc với khách hàng mà họ tư vấn. Các biện pháp phòng vệ gồm một quy trình dựng sổ thực chất, minh bạch chính sách phân bổ, và việc tổ chức phát hành thương lượng khoảng giá với nhiều hơn một cố vấn. Dù vậy, một mức định giá thấp nhất định vẫn là khoản bù đắp hợp lý cho sự bất định về định giá của một đợt phát hành lần đầu.\u003c/p>","rubricVi":"(a) bốn con số đúng (1,2) · (b) 0,6 · (c) nhận diện đủ ba bên với xung đột và kết luận cân bằng (1,2)."},{"id":"F2-06","ch":2,"type":"essay","clo":"CLO1","marks":3,"exam":"final","q":"Explain the structure of a private-equity fund and describe the four stages of the profit waterfall.","guide":"\u003cp>\u003cb>Model answer — structure.\u003c/b> A private fund is a partnership with a finite life of about ten years. \u003cb>Limited partners (LPs)\u003c/b> — pension funds, insurers, endowments and sovereign funds — commit capital and enjoy limited liability but take no part in management. The \u003cb>general partner (GP)\u003c/b> sources, executes and manages investments. Capital is \u003ci>committed\u003c/i> at closing and \u003ci>drawn down\u003c/i> in tranches as deals are found, so the LP's cash is not idle.\u003c/p>\u003cp>\u003cb>The waterfall.\u003c/b> (1) \u003cb>Return of capital\u003c/b> — 100% of distributions go to LPs until their drawn capital is repaid. (2) \u003cb>Preferred return (hurdle)\u003c/b> — LPs receive a threshold return, commonly 8% per annum, before the GP shares in profit. (3) \u003cb>Catch-up\u003c/b> — the GP then receives a large share, often 100%, of further distributions until it has received its agreed percentage of total profit. (4) \u003cb>Split\u003c/b> — remaining profits are divided in the agreed ratio, classically \u003cb>80% LP / 20% GP\u003c/b>. The 20% is the \u003cb>carried interest\u003c/b>; the GP also charges a management fee of about 2% of committed capital, hence &ldquo;2 and 20&rdquo;. A high-water mark or clawback prevents the GP retaining carry on gains later reversed.\u003c/p>","rubric":"LP/GP roles and commitment-drawdown mechanics (1.2) · four waterfall stages in correct order (1.4) · hurdle, carry and clawback correctly explained (0.4).","qVi":"Giải thích cấu trúc của một quỹ đầu tư vốn cổ phần tư nhân và mô tả bốn bước của mô hình thác nước phân chia lợi nhuận.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — cấu trúc.\u003c/b> Một quỹ tư nhân là một hình thức hợp danh có vòng đời hữu hạn khoảng mười năm. \u003cb>Thành viên góp vốn (LP)\u003c/b> — quỹ hưu trí, công ty bảo hiểm, quỹ hiến tặng và quỹ đầu tư quốc gia — cam kết vốn và hưởng trách nhiệm hữu hạn nhưng không tham gia quản lý. \u003cb>Thành viên quản lý (GP)\u003c/b> tìm kiếm, thực hiện và quản lý các khoản đầu tư. Vốn được \u003ci>cam kết\u003c/i> lúc đóng quỹ và được \u003ci>rút theo đợt\u003c/i> khi tìm được thương vụ, nên tiền của LP không nằm không.\u003c/p>\u003cp>\u003cb>Mô hình thác nước.\u003c/b> (1) \u003cb>Hoàn vốn\u003c/b> — 100% các khoản phân phối về LP cho tới khi hoàn trả xong vốn đã rút của họ. (2) \u003cb>Mức sinh lời ưu tiên (ngưỡng)\u003c/b> — LP nhận một mức sinh lời ngưỡng, thường 8%/năm, trước khi GP được chia lợi nhuận. (3) \u003cb>Bù trừ (catch-up)\u003c/b> — GP sau đó nhận một phần lớn, thường 100%, của các khoản phân phối tiếp theo cho tới khi nhận đủ tỷ lệ đã thỏa thuận trên tổng lợi nhuận. (4) \u003cb>Chia phần\u003c/b> — lợi nhuận còn lại được chia theo tỷ lệ đã thỏa thuận, kinh điển là \u003cb>80% LP / 20% GP\u003c/b>. Phần 20% là \u003cb>lãi thưởng\u003c/b>; GP cũng thu phí quản lý khoảng 2% vốn cam kết, do đó gọi là &ldquo;2 và 20&rdquo;. Mốc cao nhất hoặc điều khoản thu hồi ngăn GP giữ lãi thưởng trên các khoản lãi về sau bị đảo ngược.\u003c/p>","rubricVi":"Vai trò LP/GP và cơ chế cam kết – rút vốn (1,2) · bốn bước thác nước theo đúng thứ tự (1,4) · ngưỡng, lãi thưởng và thu hồi được giải thích đúng (0,4)."},{"id":"F3-01","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"Distinguish a merger, a consolidation and an acquisition, and explain the difference between a share purchase and an asset purchase.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> In a \u003cb>merger (sáp nhập)\u003c/b> one or more companies transfer all assets, rights and obligations to another \u003ci>existing\u003c/i> company and then cease to exist; the receiving company survives. In a \u003cb>consolidation (hợp nhất)\u003c/b> two or more companies combine to form an entirely \u003ci>new\u003c/i> company and all the originals cease to exist. In an \u003cb>acquisition (mua lại)\u003c/b> one company buys shares or assets sufficient to control another, which may continue to exist as a subsidiary.\u003c/p>\u003cp>\u003cb>Share purchase vs asset purchase.\u003c/b> A share purchase transfers the company itself, so \u003ci>all\u003c/i> liabilities travel with it, including undisclosed and contingent ones; it is simpler and usually preferred by sellers as a clean exit. An asset purchase transfers only selected assets and the liabilities the buyer \u003ci>expressly assumes\u003c/i>, allowing the buyer to cherry-pick and often to step up the tax basis of the assets; sellers dislike it because it can be taxed twice and leaves them with the residual shell.\u003c/p>","rubric":"Three forms correctly distinguished (1.0) · share vs asset on liabilities, tax and party preference (1.0).","qVi":"Phân biệt sáp nhập, hợp nhất và mua lại, và giải thích sự khác biệt giữa mua cổ phần và mua tài sản.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Trong \u003cb>sáp nhập\u003c/b>, một hoặc nhiều công ty chuyển toàn bộ tài sản, quyền và nghĩa vụ sang một công ty \u003ci>đang tồn tại\u003c/i> khác rồi chấm dứt tồn tại; công ty nhận vẫn tồn tại. Trong \u003cb>hợp nhất\u003c/b>, hai hoặc nhiều công ty kết hợp để lập nên một công ty \u003ci>hoàn toàn mới\u003c/i> và tất cả các công ty ban đầu đều chấm dứt tồn tại. Trong \u003cb>mua lại\u003c/b>, một công ty mua cổ phần hoặc tài sản đủ để kiểm soát một công ty khác, và công ty đó có thể vẫn tồn tại như một công ty con.\u003c/p>\u003cp>\u003cb>Mua cổ phần và mua tài sản.\u003c/b> Mua cổ phần chuyển giao chính công ty, nên \u003ci>toàn bộ\u003c/i> nghĩa vụ nợ đi kèm, kể cả các khoản chưa công bố và tiềm tàng; cách này đơn giản hơn và thường được bên bán ưa chuộng vì cho một lối thoát sạch sẽ. Mua tài sản chỉ chuyển giao các tài sản được chọn và những nghĩa vụ mà bên mua \u003ci>đồng ý tiếp nhận rõ ràng\u003c/i>, cho phép bên mua chọn lọc và thường được nâng cơ sở tính thuế của tài sản; bên bán không thích vì có thể bị đánh thuế hai lần và để lại cho họ phần vỏ còn dư.\u003c/p>","rubricVi":"Phân biệt đúng ba hình thức (1,0) · mua cổ phần và mua tài sản theo nghĩa vụ nợ, thuế và sở thích của các bên (1,0)."},{"id":"F3-02","ch":3,"type":"essay","clo":"CLO1","marks":2,"exam":"midterm","q":"List four motives of the buyer and four motives of the seller in an M&A transaction, and explain why buyer motives must be tested against the premium paid.","guide":"\u003cp>\u003cb>Model answer — buyer motives:\u003c/b> cost and revenue synergies and economies of scale; rapid access to markets, technology, licences or talent; vertical control of the supply chain; tax and financial engineering or deployment of surplus cash; eliminating a competitor and increasing market power; and — less legitimately — managerial empire-building (an agency motive).\u003c/p>\u003cp>\u003cb>Seller motives:\u003c/b> liquidity, monetising an illiquid holding; succession where there is no capable heir or manager; capturing a premium at a favourable point in the cycle; inability to fund the next stage of growth; exit from a non-core or loss-making business; and financial distress or creditor pressure.\u003c/p>\u003cp>\u003cb>Why motives must be tested against the premium.\u003c/b> Every motive expresses a \u003ci>benefit\u003c/i>, but the buyer pays for it on day one through the control premium, typically 20–40%. Value is created only if the \u003cb>present value of the benefits exceeds the premium\u003c/b>. Because synergies are deferred and uncertain — revenue synergies especially — a plausible strategic rationale is not sufficient; it must be quantified. This is why acquirers on average earn approximately zero abnormal returns while target shareholders capture the premium.\u003c/p>","rubric":"Four buyer motives (0.6) · four seller motives (0.6) · premium test articulated with the empirical finding (0.8).","qVi":"Liệt kê bốn động cơ của bên mua và bốn động cơ của bên bán trong một giao dịch M&A, và giải thích vì sao động cơ của bên mua phải được kiểm định trước mức thặng dư phải trả.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — động cơ bên mua:\u003c/b> cộng hưởng chi phí và doanh thu cùng lợi thế kinh tế theo quy mô; tiếp cận nhanh thị trường, công nghệ, giấy phép hoặc nhân tài; kiểm soát theo chiều dọc chuỗi cung ứng; kỹ thuật thuế và tài chính hoặc triển khai tiền mặt dư thừa; loại bỏ một đối thủ và tăng sức mạnh thị trường; và — kém chính đáng hơn — xây dựng đế chế của ban điều hành (động cơ người đại diện).\u003c/p>\u003cp>\u003cb>Động cơ bên bán:\u003c/b> thanh khoản, hiện thực hóa một khoản nắm giữ kém thanh khoản; chuyển giao thế hệ khi không có người kế thừa hay quản lý đủ năng lực; nắm bắt mức thặng dư tại một điểm thuận lợi của chu kỳ; không đủ khả năng tài trợ giai đoạn tăng trưởng tiếp theo; thoát khỏi một mảng không cốt lõi hoặc thua lỗ; và kiệt quệ tài chính hoặc áp lực từ chủ nợ.\u003c/p>\u003cp>\u003cb>Vì sao động cơ phải được kiểm định trước mức thặng dư.\u003c/b> Mọi động cơ đều diễn đạt một \u003ci>lợi ích\u003c/i>, nhưng bên mua trả cho lợi ích đó ngay ngày đầu tiên qua mức thặng dư kiểm soát, thường 20–40%. Giá trị chỉ được tạo ra nếu \u003cb>giá trị hiện tại của các lợi ích vượt mức thặng dư\u003c/b>. Vì cộng hưởng bị trì hoãn và bất định — nhất là cộng hưởng doanh thu — một lý do chiến lược nghe hợp lý là chưa đủ; nó phải được định lượng. Đây là lý do bên mua trung bình đạt lợi suất bất thường xấp xỉ 0 trong khi cổ đông công ty mục tiêu thâu tóm phần thặng dư.\u003c/p>","rubricVi":"Bốn động cơ bên mua (0,6) · bốn động cơ bên bán (0,6) · nêu rõ phép kiểm định thặng dư kèm phát hiện thực nghiệm (0,8)."},{"id":"F3-03","ch":3,"type":"essay","clo":"CLO1","marks":3,"exam":"midterm","q":"Set out the main steps a buyer takes in an M&A transaction and explain the purpose of due diligence and what it covers.","guide":"\u003cp>\u003cb>Model answer — buy-side steps.\u003c/b> (1) \u003cb>Strategy and screening\u003c/b> — define acquisition criteria and build a target list. (2) \u003cb>Approach and valuation\u003c/b> — value the target standalone and then with synergies. (3) \u003cb>Due diligence\u003c/b>. (4) \u003cb>Structuring and financing\u003c/b> — choose the consideration and arrange funding. (5) \u003cb>Negotiation\u003c/b> — price, representations and warranties, indemnities, earn-outs, break fees and conditions precedent. (6) \u003cb>Signing, regulatory approval and closing\u003c/b>. (7) \u003cb>Integration\u003c/b>, planned before signing rather than after closing.\u003c/p>\u003cp>\u003cb>Purpose of due diligence.\u003c/b> To verify the assumptions on which the price rests and to identify risks and liabilities before the buyer is committed. It determines whether to proceed, at what price, and with what contractual protection.\u003c/p>\u003cp>\u003cb>Coverage:\u003c/b> \u003ci>commercial\u003c/i> (market, customers, competitive position), \u003ci>financial\u003c/i> (quality of earnings, working capital, debt-like items), \u003ci>tax\u003c/i>, \u003ci>legal\u003c/i> (title, contracts, litigation, permits), \u003ci>environmental\u003c/i>, \u003ci>HR\u003c/i> (key staff, pensions, labour liabilities) and \u003ci>IT/operational\u003c/i>. Findings feed directly into the price, the warranty and indemnity package, and specific conditions precedent.\u003c/p>","rubric":"At least six buy-side steps in order (1.2) · purpose of DD (0.6) · at least five coverage areas and the link to price/warranties (1.2).","qVi":"Trình bày các bước chính mà bên mua thực hiện trong một giao dịch M&A và giải thích mục đích của thẩm định cùng phạm vi của nó.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các bước bên mua.\u003c/b> (1) \u003cb>Chiến lược và sàng lọc\u003c/b> — xác định tiêu chí thâu tóm và lập danh sách mục tiêu. (2) \u003cb>Tiếp cận và định giá\u003c/b> — định giá công ty mục tiêu độc lập rồi cộng thêm cộng hưởng. (3) \u003cb>Thẩm định\u003c/b>. (4) \u003cb>Cấu trúc và tài trợ\u003c/b> — chọn hình thức thanh toán và thu xếp nguồn vốn. (5) \u003cb>Thương lượng\u003c/b> — giá, cam đoan và bảo đảm, bồi hoàn, khoản thanh toán theo kết quả, phí phá vỡ hợp đồng và điều kiện tiên quyết. (6) \u003cb>Ký kết, phê duyệt của cơ quan quản lý và hoàn tất\u003c/b>. (7) \u003cb>Hợp nhất\u003c/b>, được lập kế hoạch trước khi ký chứ không phải sau khi hoàn tất.\u003c/p>\u003cp>\u003cb>Mục đích của thẩm định.\u003c/b> Kiểm chứng các giả định làm nền cho mức giá và nhận diện rủi ro cùng nghĩa vụ nợ trước khi bên mua bị ràng buộc. Nó quyết định có tiếp tục hay không, ở mức giá nào, và với sự bảo vệ hợp đồng ra sao.\u003c/p>\u003cp>\u003cb>Phạm vi:\u003c/b> \u003ci>thương mại\u003c/i> (thị trường, khách hàng, vị thế cạnh tranh), \u003ci>tài chính\u003c/i> (chất lượng lợi nhuận, vốn lưu động, các khoản mang t
