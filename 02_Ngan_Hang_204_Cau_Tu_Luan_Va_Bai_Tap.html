<style>

:root {
  --ink: #2a1823; --muted: #826577; --bg: #fdf8fa; --card: #ffffff;
  --line: #f0dce6; --brand: #d44d82; --brand-dark: #a62c5e; --brand-soft: #fdf0f6;
  --ok: #129676; --ok-soft: #eefbf6; --warn: #d47533; --warn-soft: #fff6ef;
  --danger: #dc3c59; --danger-soft: #fff1f4;
}
html::-webkit-scrollbar { width: 12px; height: 12px; }
html::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
html::-webkit-scrollbar-track, html::-webkit-scrollbar-corner { background: #fdf8fa; }
html::-webkit-scrollbar-thumb { background: #e7b5cb; border: 3px solid #fdf8fa; border-radius: 999px; min-height: 40px; }
html::-webkit-scrollbar-thumb:hover { background: #d44d82; border-width: 2px; }
body *::-webkit-scrollbar { width: 8px; height: 8px; }
body *::-webkit-scrollbar-button { display: none; }
body *::-webkit-scrollbar-track { background: transparent; }
body *::-webkit-scrollbar-thumb { background: rgba(212,77,130,.28); border: 2px solid transparent; background-clip: padding-box; border-radius: 999px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.65; font-size: 15px; -webkit-font-smoothing: antialiased; }
.top-header { background: linear-gradient(135deg, #fff5f9 0%, #fce8f2 55%, #f5ecff 100%); color: var(--ink); border-bottom: 1px solid var(--line); padding: 22px 30px; display: flex; align-items: center; gap: 16px; }
.hub-header-emblem { width: 32px; height: 50px; flex-shrink: 0; display: inline-flex; filter: drop-shadow(0 2px 5px rgba(31,51,104,.14)); }
.hub-header-emblem svg { width: 100%; height: 100%; display: block; }
.top-header h1 { font-size: 20.5px; font-weight: 700; letter-spacing: -0.02em; color: #2a1823; margin-bottom: 4px; }
.top-header p { color: var(--muted); font-size: 13.5px; }
.toolbar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgba(120,45,82,.05); }
.toolbar select, .toolbar input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-size: 13.5px; background: #fff; color: var(--ink); outline: none; }
.toolbar select:focus, .toolbar input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.toolbar input { flex: 1; min-width: 200px; }
.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s ease; }
.btn:hover { border-color: #f5c6dc; color: var(--brand-dark); background: var(--brand-soft); }
.btn.primary { background: linear-gradient(180deg, #e26295, #c83f76); border-color: var(--brand); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.container { max-width: 1060px; margin: 0 auto; padding: 24px 20px 80px; }
.ch-banner { margin: 26px 0 14px; padding: 13px 18px; background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #f5c6dc; border-left: 4px solid var(--brand); border-radius: 10px; font-size: 16.5px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(90,35,62,.04); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 650; }
.b-blue { background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #f5c6dc; }
.b-green { background: var(--ok-soft); color: #0c6e56; border: 1px solid #b2ebd9; }
.b-amber { background: var(--warn-soft); color: #9c4c16; border: 1px solid #fbd7bd; }
.b-red { background: var(--danger-soft); color: #a31d37; border: 1px solid #fecdd6; }
.b-gray { background: #fbf2f6; color: var(--muted); border: 1px solid var(--line); }
.en-sub { color: var(--muted); font-size: 0.92em; font-style: italic; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
th, td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; vertical-align: top; }
th { background: #fbf2f6; font-weight: 650; }
.expl { margin-top: 11px; background: #fbf2f6 !important; border: 1px solid var(--line) !important; border-left: 3px solid var(--brand) !important; border-radius: 9px; padding: 11px 14px; font-size: 13.5px; }
@media print {
  body { background: #fff; font-size: 12.5px; color: #000; }
  .toolbar, .no-print { display: none !important; }
  .top-header { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000; padding: 10px 0; }
  .ch-banner { background: #f8fafc !important; color: #000 !important; border: 1px solid #94a3b8; break-after: avoid; }
  .card { box-shadow: none; border: 1px solid #cbd5e1; break-inside: avoid; margin-bottom: 10px; padding: 12px 14px; }
  .container { max-width: 100%; padding: 10px 0; }
}

.q-box { background: #f8fafc; border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 8px; padding: 12px 15px; margin: 10px 0; font-weight: 500; }
.ans-box { margin-top: 12px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px; padding: 14px 18px; font-size: 14px; }
.ans-box p { margin-bottom: 9px; }
.rubric { margin-top: 10px; padding-top: 9px; border-top: 1px dashed #93c5fd; font-size: 12.5px; color: #334155; }
.hidden { display: none !important; }
</style>
</head>

const ESSAYS = [{"id":"E1-1","ch":1,"type":"essay","clo":"CLO1","marks":2,"q":"Define investment banking and explain three ways in which it differs from commercial banking.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> An investment bank is a financial intermediary that helps corporations, governments and institutions raise capital and execute strategic transactions, and that trades and manages financial assets. It does not take retail deposits.\u003c/p>\u003cp>Three differences: (1) \u003cb>Funding and product.\u003c/b> A commercial bank funds itself with deposits and earns the interest spread on loans; an investment bank earns fees, underwriting and trading spreads, and management fees. (2) \u003cb>Client and risk.\u003c/b> Commercial banking is credit-risk driven with a diversified retail/SME base; investment banking is transaction- and market-risk driven with a concentrated institutional client base. (3) \u003cb>Earnings profile.\u003c/b> Commercial banking income is comparatively stable and annuity-like; investment banking fee income is highly cyclical because it depends on deal and issuance volumes. A fourth acceptable point: regulation and deposit insurance apply to deposit-takers, while investment banks face capital-markets conduct and capital rules.\u003c/p>","rubric":"Definition correct incl. 'no retail deposits' (0.5) · three valid, clearly explained differences (1.2) · use of correct terminology (0.3).","qVi":"Định nghĩa ngân hàng đầu tư và giải thích ba điểm khác biệt của nó so với ngân hàng thương mại.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Ngân hàng đầu tư là một trung gian tài chính giúp doanh nghiệp, chính phủ và các tổ chức huy động vốn và thực hiện các giao dịch chiến lược, đồng thời giao dịch và quản lý tài sản tài chính. Nó không nhận tiền gửi bán lẻ.\u003c/p>\u003cp>Ba điểm khác biệt: (1) \u003cb>Cách huy động vốn và sản phẩm.\u003c/b> Ngân hàng thương mại tự huy động vốn bằng tiền gửi và hưởng chênh lệch lãi vay; ngân hàng đầu tư kiếm phí, phí bảo lãnh, chênh lệch giao dịch và phí quản lý. (2) \u003cb>Khách hàng và rủi ro.\u003c/b> Ngân hàng thương mại lấy rủi ro tín dụng làm trọng tâm với nền khách hàng bán lẻ/doanh nghiệp vừa và nhỏ đa dạng; ngân hàng đầu tư lấy rủi ro giao dịch và rủi ro thị trường làm trọng tâm với nền khách hàng tổ chức tập trung. (3) \u003cb>Hình thái lợi nhuận.\u003c/b> Thu nhập của ngân hàng thương mại tương đối ổn định và đều đặn như tiền niên kim; thu nhập từ phí của ngân hàng đầu tư có tính chu kỳ rất cao vì phụ thuộc vào khối lượng thương vụ và phát hành. Một điểm thứ tư có thể chấp nhận: quy định pháp lý và bảo hiểm tiền gửi áp dụng cho tổ chức nhận tiền gửi, còn ngân hàng đầu tư chịu các quy tắc về ứng xử trên thị trường vốn và về vốn.\u003c/p>","rubricVi":"Định nghĩa đúng bao gồm 'không nhận tiền gửi bán lẻ' (0,5) · ba khác biệt hợp lệ, giải thích rõ ràng (1,2) · dùng thuật ngữ đúng (0,3)."},{"id":"E1-2","ch":1,"type":"essay","clo":"CLO1","marks":2,"q":"Describe the front-, middle- and back-office structure of a modern investment bank, giving an example function of each, and explain why the 'Chinese wall' exists.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>front office\u003c/b> generates revenue and faces clients: M&A advisory, ECM/DCM, sales &amp; trading, research, asset management. The \u003cb>middle office\u003c/b> measures and controls risk: market and credit risk management, compliance, treasury, product control. The \u003cb>back office\u003c/b> processes and records: settlement, clearing, custody, finance, technology, HR.\u003c/p>\u003cp>The front office is further split into a \u003cb>private side\u003c/b> (advisory bankers who hold material non-public information about clients) and a \u003cb>public side\u003c/b> (sales, trading, research). The Chinese wall is the mandatory information barrier between them. Without it, knowledge of an unannounced acquisition could be used to trade ahead of the market — insider dealing — or to bias research. It is a legal and regulatory requirement, enforced by physical separation, restricted systems access, wall-crossing procedures and restricted lists.\u003c/p>","rubric":"Three tiers correctly identified with valid examples (1.0) · private/public side distinction (0.5) · correct legal rationale for the wall (0.5).","qVi":"Mô tả cơ cấu khối trước, khối giữa và khối sau của một ngân hàng đầu tư hiện đại, cho ví dụ một chức năng của mỗi khối, và giải thích vì sao tồn tại 'bức tường ngăn cách' (Chinese wall).","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Khối trước (front office)\u003c/b> tạo doanh thu và tiếp xúc khách hàng: tư vấn M&A, ECM/DCM, bán hàng &amp; giao dịch, nghiên cứu, quản lý tài sản. \u003cb>Khối giữa (middle office)\u003c/b> đo lường và kiểm soát rủi ro: quản trị rủi ro thị trường và tín dụng, tuân thủ, ngân quỹ, kiểm soát sản phẩm. \u003cb>Khối sau (back office)\u003c/b> xử lý và ghi sổ: thanh toán, bù trừ, lưu ký, tài chính, công nghệ, nhân sự.\u003c/p>\u003cp>Khối trước còn được chia thành \u003cb>bên riêng tư\u003c/b> (chuyên viên tư vấn nắm thông tin trọng yếu chưa công bố về khách hàng) và \u003cb>bên công khai\u003c/b> (bán hàng, giao dịch, nghiên cứu). Bức tường ngăn cách là rào chắn thông tin bắt buộc giữa hai bên. Nếu không có nó, hiểu biết về một thương vụ thâu tóm chưa công bố có thể bị dùng để giao dịch trước thị trường — giao dịch nội gián — hoặc để làm thiên lệch nghiên cứu. Đây là yêu cầu pháp lý và quản lý, được thực thi bằng phân tách vật lý, hạn chế truy cập hệ thống, thủ tục vượt tường và danh sách hạn chế.\u003c/p>","rubricVi":"Ba cấp được nhận diện đúng kèm ví dụ hợp lệ (1,0) · phân biệt bên riêng tư/công khai (0,5) · lý do pháp lý đúng của bức tường (0,5)."},{"id":"E1-3","ch":1,"type":"calc-essay","clo":"CLO1","marks":2,"q":"A company is financed 65% equity and 35% debt. The risk-free rate is 3%, the equity risk premium 5.5%, its equity beta 1.2, its pre-tax cost of debt 7% and the corporate tax rate 20%. (a) Compute the cost of equity. (b) Compute the after-tax cost of debt. (c) Compute the WACC. (d) Explain what happens to WACC if the company issues more debt, and why this cannot continue indefinitely.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) r\u003csub>e\u003c/sub> = r\u003csub>f\u003c/sub> + β(ERP) = 3% + 1.2 × 5.5% = \u003cb>9.6%\u003c/b>. (b) r\u003csub>d\u003c/sub>(1−t) = 7% × (1 − 0.20) = \u003cb>5.6%\u003c/b>. (c) WACC = 0.65 × 9.6% + 0.35 × 5.6% = 6.24% + 1.96% = \u003cb>8.20%\u003c/b>.\u003c/p>\u003cp>(d) Substituting cheaper after-tax debt for equity initially \u003cb>lowers\u003c/b> WACC, because interest is tax-deductible (the tax shield) and debt is senior and therefore cheaper. This cannot continue indefinitely: as leverage rises, equity becomes riskier so beta and r\u003csub>e\u003c/sub> increase; lenders demand a higher r\u003csub>d\u003c/sub>; and expected costs of financial distress (lost customers, forced asset sales, bankruptcy costs) grow. Beyond an optimal range these effects outweigh the tax shield and WACC turns upward — the trade-off theory of capital structure.\u003c/p>","rubric":"(a) 0.4 · (b) 0.4 · (c) 0.5 · (d) tax-shield benefit and rising distress/return costs (0.7).","qVi":"Một công ty được tài trợ 65% vốn chủ và 35% nợ. Lãi suất phi rủi ro là 3%, phần bù rủi ro vốn chủ 5,5%, beta vốn chủ 1,2, chi phí nợ trước thuế 7% và thuế suất doanh nghiệp 20%. (a) Tính chi phí vốn chủ. (b) Tính chi phí nợ sau thuế. (c) Tính WACC. (d) Giải thích điều gì xảy ra với WACC nếu công ty phát hành thêm nợ, và vì sao điều đó không thể tiếp diễn vô hạn.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) r\u003csub>e\u003c/sub> = r\u003csub>f\u003c/sub> + β(ERP) = 3% + 1,2 × 5,5% = \u003cb>9,6%\u003c/b>. (b) r\u003csub>d\u003c/sub>(1−t) = 7% × (1 − 0,20) = \u003cb>5,6%\u003c/b>. (c) WACC = 0,65 × 9,6% + 0,35 × 5,6% = 6,24% + 1,96% = \u003cb>8,20%\u003c/b>.\u003c/p>\u003cp>(d) Thay vốn chủ đắt đỏ bằng nợ sau thuế rẻ hơn ban đầu \u003cb>làm giảm\u003c/b> WACC, vì lãi vay được khấu trừ thuế (lá chắn thuế) và nợ có thứ tự ưu tiên cao hơn nên rẻ hơn. Điều này không thể tiếp diễn vô hạn: khi đòn bẩy tăng, vốn chủ trở nên rủi ro hơn nên beta và r\u003csub>e\u003c/sub> tăng; bên cho vay đòi r\u003csub>d\u003c/sub> cao hơn; và chi phí kiệt quệ tài chính dự kiến (mất khách hàng, buộc phải bán tài sản, chi phí phá sản) tăng lên. Vượt một khoảng tối ưu, các tác động này lấn át lá chắn thuế và WACC quay đầu đi lên — lý thuyết đánh đổi về cấu trúc vốn.\u003c/p>","rubricVi":"(a) 0,4 · (b) 0,4 · (c) 0,5 · (d) lợi ích lá chắn thuế và chi phí kiệt quệ/tỷ suất sinh lời tăng (0,7)."},{"id":"E2-1","ch":2,"type":"essay","clo":"CLO1","marks":3,"q":"Walk through the main stages of an IPO from mandate to aftermarket stabilization, and explain at which point placement risk transfers from the issuer to the underwriter.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> Stages: (1) \u003cb>Mandate / bake-off\u003c/b> — banks pitch valuation and strategy; the issuer appoints bookrunners. (2) \u003cb>Due diligence and structuring\u003c/b> — business, financial and legal review; decide the primary/secondary split. (3) \u003cb>Registration\u003c/b> — file the prospectus with the regulator. (4) \u003cb>Valuation and price range\u003c/b> — comparable companies, precedent transactions and DCF produce an indicative range. (5) \u003cb>Roadshow\u003c/b> — management markets to institutions. (6) \u003cb>Bookbuilding\u003c/b> — underwriters collect price-and-size demand indications, building a demand curve. (7) \u003cb>Pricing and allocation\u003c/b> — the final price is set, generally at a deliberate discount to expected trading value, and shares are allocated. (8) \u003cb>Aftermarket stabilization\u003c/b> — the greenshoe supports the price for roughly 30 days.\u003c/p>\u003cp>\u003cb>Risk transfer:\u003c/b> in a firm-commitment deal, placement risk passes to the underwriter when the underwriting agreement is signed at pricing — the bank purchases the shares and is left holding any it cannot resell. Before that moment the risk sits with the issuer, and under a best-efforts structure it never transfers at all.\u003c/p>","rubric":"All main stages in correct sequence (1.5) · correct identification of risk transfer at pricing/signing (1.0) · firm-commitment vs best-efforts contrast (0.5).","qVi":"Trình bày các giai đoạn chính của một đợt IPO từ trao thầu đến bình ổn giá thị trường thứ cấp, và giải thích tại thời điểm nào rủi ro phân phối chuyển từ tổ chức phát hành sang nhà bảo lãnh.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Các giai đoạn: (1) \u003cb>Trao thầu / thi tuyển (bake-off)\u003c/b> — các ngân hàng trình bày định giá và chiến lược; tổ chức phát hành chỉ định nhà quản lý sổ. (2) \u003cb>Thẩm định và cấu trúc\u003c/b> — rà soát kinh doanh, tài chính và pháp lý; quyết định tỷ lệ phát hành sơ cấp/thứ cấp. (3) \u003cb>Đăng ký\u003c/b> — nộp bản cáo bạch cho cơ quan quản lý. (4) \u003cb>Định giá và khoảng giá\u003c/b> — công ty so sánh, giao dịch tiền lệ và DCF cho ra một khoảng giá tham khảo. (5) \u003cb>Roadshow\u003c/b> — ban điều hành tiếp thị tới các tổ chức. (6) \u003cb>Dựng sổ (bookbuilding)\u003c/b> — nhà bảo lãnh thu thập các chỉ báo nhu cầu về giá và khối lượng, dựng đường cầu. (7) \u003cb>Định giá và phân bổ\u003c/b> — giá cuối cùng được ấn định, thường ở mức chiết khấu có chủ đích so với giá trị giao dịch kỳ vọng, và cổ phần được phân bổ. (8) \u003cb>Bình ổn thị trường thứ cấp\u003c/b> — quyền greenshoe hỗ trợ giá trong khoảng 30 ngày.\u003c/p>\u003cp>\u003cb>Chuyển giao rủi ro:\u003c/b> trong thương vụ cam kết chắc chắn, rủi ro phân phối chuyển sang nhà bảo lãnh khi hợp đồng bảo lãnh được ký lúc định giá — ngân hàng mua cổ phần và giữ lại phần nào không bán được. Trước thời điểm đó rủi ro thuộc về tổ chức phát hành, và theo cấu trúc nỗ lực tối đa thì rủi ro không bao giờ chuyển giao.\u003c/p>","rubricVi":"Đủ các giai đoạn chính theo đúng trình tự (1,5) · xác định đúng thời điểm chuyển giao rủi ro lúc định giá/ký hợp đồng (1,0) · so sánh cam kết chắc chắn với nỗ lực tối đa (0,5)."},{"id":"E2-2","ch":2,"type":"calc-essay","clo":"CLO1","marks":3,"q":"A company issues 8 million shares at $25.00 with a 7% gross spread and a 15% greenshoe that is fully exercised. (a) Compute the maximum greenshoe shares. (b) Compute total gross proceeds. (c) Compute the underwriting fee and the net proceeds to the issuer. (d) Explain the purpose of the greenshoe and who benefits from IPO underpricing.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Greenshoe = 15% × 8m = \u003cb>1.2m shares\u003c/b>; total = \u003cb>9.2m shares\u003c/b>. (b) Gross proceeds = 9.2m × $25 = \u003cb>$230m\u003c/b>. (c) Fee = 7% × $230m = \u003cb>$16.1m\u003c/b>; net to issuer = 230 − 16.1 = \u003cb>$213.9m\u003c/b>.\u003c/p>\u003cp>(d) The greenshoe (over-allotment option) lets underwriters sell up to 15% more shares than the base deal, creating a short position. If the price falls below the offer price they buy back in the market, supporting the price; if it rises they exercise the option and take shares from the issuer at the offer price. It therefore stabilizes the aftermarket without exposing the bank to loss.\u003c/p>\u003cp>On \u003cb>underpricing\u003c/b>: pricing below expected trading value transfers value from the issuer (which raises less than it could — 'money left on the table') to the allocated investors, who enjoy an immediate gain. The underwriter benefits indirectly, since it can reward its distribution clients and reduce its own placement risk — a genuine conflict of interest with the issuer it advises.\u003c/p>","rubric":"(a) 0.5 · (b) 0.5 · (c) 0.75 · (d) greenshoe mechanism (0.75) and underpricing beneficiaries/conflict (0.5).","qVi":"Một công ty phát hành 8 triệu cổ phần giá 25,00 USD với phí bảo lãnh 7% và quyền greenshoe 15% được thực hiện toàn bộ. (a) Tính số cổ phần greenshoe tối đa. (b) Tính tổng số tiền thu gộp. (c) Tính phí bảo lãnh và số tiền thu ròng của tổ chức phát hành. (d) Giải thích mục đích của greenshoe và ai hưởng lợi từ việc định giá thấp IPO.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Greenshoe = 15% × 8 triệu = \u003cb>1,2 triệu cổ phần\u003c/b>; tổng = \u003cb>9,2 triệu cổ phần\u003c/b>. (b) Số tiền thu gộp = 9,2 triệu × 25 USD = \u003cb>230 triệu USD\u003c/b>. (c) Phí = 7% × 230 triệu = \u003cb>16,1 triệu USD\u003c/b>; thu ròng của tổ chức phát hành = 230 − 16,1 = \u003cb>213,9 triệu USD\u003c/b>.\u003c/p>\u003cp>(d) Greenshoe (quyền chọn vượt mức) cho phép nhà bảo lãnh bán thêm tối đa 15% cổ phần so với thương vụ cơ bản, tạo ra một vị thế bán. Nếu giá rơi xuống dưới giá chào bán, họ mua lại trên thị trường để đỡ giá; nếu giá tăng, họ thực hiện quyền chọn và nhận cổ phần từ tổ chức phát hành ở giá chào bán. Do đó nó bình ổn thị trường thứ cấp mà không khiến ngân hàng chịu lỗ.\u003c/p>\u003cp>Về \u003cb>định giá thấp\u003c/b>: định giá dưới giá trị giao dịch kỳ vọng chuyển giá trị từ tổ chức phát hành (huy động được ít hơn mức có thể — 'tiền bỏ lại trên bàn') sang các nhà đầu tư được phân bổ, những người có lãi ngay lập tức. Nhà bảo lãnh hưởng lợi gián tiếp, vì có thể tưởng thưởng khách hàng phân phối của mình và giảm rủi ro phân phối của chính mình — một xung đột lợi ích thực sự với tổ chức phát hành mà họ tư vấn.\u003c/p>","rubricVi":"(a) 0,5 · (b) 0,5 · (c) 0,75 · (d) cơ chế greenshoe (0,75) và người hưởng lợi/xung đột của định giá thấp (0,5)."},{"id":"E2-3","ch":2,"type":"essay","clo":"CLO1","marks":2,"q":"Compare private equity and venture capital across stage, control, leverage and return profile, and explain the '2 and 20' fee structure including the role of the hurdle rate.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Venture capital\u003c/b> finances early-stage, high-growth companies, takes \u003cb>minority\u003c/b> stakes, uses \u003cb>no leverage\u003c/b>, and expects most investments to fail while a few large winners drive the fund's return. \u003cb>Buyout private equity\u003c/b> acquires \u003cb>control\u003c/b> of mature, cash-generative businesses using substantial \u003cb>leverage\u003c/b> (LBO); returns come from debt paydown, EBITDA growth and multiple expansion, with a low but costly failure rate.\u003c/p>\u003cp>\u003cb>2 and 20:\u003c/b> the general partner charges a 2% annual management fee (on committed, later invested, capital) to fund operations, plus 20% \u003cb>carried interest\u003c/b> on profits. The \u003cb>hurdle rate\u003c/b> (preferred return, commonly 8%) is the threshold return limited partners must receive before the GP shares in any profit; it aligns incentives by ensuring the GP is paid for genuine outperformance rather than for merely deploying capital. A high-water mark or clawback prevents the GP from being paid twice on the same gains.\u003c/p>","rubric":"Four comparison dimensions handled correctly (1.0) · fee structure explained (0.5) · role/purpose of the hurdle (0.5).","qVi":"So sánh vốn cổ phần tư nhân (private equity) và đầu tư mạo hiểm (venture capital) theo giai đoạn, quyền kiểm soát, đòn bẩy và hình thái lợi nhuận, và giải thích cấu trúc phí '2 và 20' bao gồm vai trò của ngưỡng sinh lời.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Đầu tư mạo hiểm\u003c/b> tài trợ cho các công ty giai đoạn đầu, tăng trưởng cao, nắm giữ cổ phần \u003cb>thiểu số\u003c/b>, \u003cb>không dùng đòn bẩy\u003c/b>, và kỳ vọng phần lớn khoản đầu tư thất bại trong khi một vài người thắng lớn dẫn dắt lợi nhuận của quỹ. \u003cb>Vốn cổ phần tư nhân mua đứt (buyout)\u003c/b> thâu tóm \u003cb>quyền kiểm soát\u003c/b> các doanh nghiệp trưởng thành, sinh dòng tiền, sử dụng đòn bẩy \u003cb>đáng kể\u003c/b> (LBO); lợi nhuận đến từ trả nợ, tăng trưởng EBITDA và mở rộng bội số, với tỷ lệ thất bại thấp nhưng tốn kém.\u003c/p>\u003cp>\u003cb>2 và 20:\u003c/b> thành viên quản lý (GP) thu phí quản lý 2%/năm (trên vốn cam kết, sau đó là vốn đã đầu tư) để vận hành, cộng 20% \u003cb>lãi thưởng (carried interest)\u003c/b> trên lợi nhuận. \u003cb>Ngưỡng sinh lời\u003c/b> (mức sinh lời ưu tiên, thường 8%) là mức lợi nhuận mà thành viên góp vốn (LP) phải nhận trước khi GP được chia lợi nhuận; nó gắn kết động cơ bằng cách bảo đảm GP được thưởng cho hiệu quả vượt trội thực sự chứ không phải chỉ vì đã giải ngân vốn. Mốc cao nhất (high-water mark) hoặc điều khoản thu hồi (clawback) ngăn GP được trả hai lần trên cùng một khoản lãi.\u003c/p>","rubricVi":"Bốn chiều so sánh xử lý đúng (1,0) · giải thích cấu trúc phí (0,5) · vai trò/mục đích của ngưỡng sinh lời (0,5)."},{"id":"E3-1","ch":3,"type":"essay","clo":"CLO1","marks":4,"q":"Explain the difference between the sell-side (auction) and buy-side M&A processes, describing the advisor's role in each and how a sell-side advisor creates competitive tension.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The \u003cb>sell-side\u003c/b> advisor runs a structured auction to maximise price and certainty for the seller: preparation and valuation; a one-page anonymous \u003cb>teaser\u003c/b>; NDAs; the \u003cb>CIM\u003c/b>; a first round producing non-binding indications of interest; a second round with management presentations and data-room due diligence; final binding bids with mark-ups of the purchase agreement; negotiation, signing and closing.\u003c/p>\u003cp>The \u003cb>buy-side\u003c/b> advisor works for the acquirer: sourcing and screening targets against a strategic filter, valuing the target standalone plus synergies, coordinating due diligence, structuring the consideration and arranging financing, negotiating terms, and supporting integration planning.\u003c/p>\u003cp>\u003cb>Competitive tension\u003c/b> is created by running a genuine multi-party process: contacting several credible buyers simultaneously, imposing firm bid deadlines, keeping bidders uncertain about rivals' price levels, maintaining a credible walk-away alternative, and preserving optionality by keeping more than one bidder alive to the final round. The trade-off is between a broad auction (maximum price discovery, higher leak and disruption risk) and a targeted process (confidentiality, less tension).\u003c/p>","rubric":"Sell-side stages accurate (1.3) · buy-side activities accurate (1.2) · competitive tension mechanisms (1.0) · broad vs targeted trade-off (0.5).","qVi":"Giải thích sự khác biệt giữa quy trình M&A bên bán (đấu giá) và bên mua, mô tả vai trò của nhà tư vấn trong mỗi quy trình và cách nhà tư vấn bên bán tạo ra sức ép cạnh tranh.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Nhà tư vấn \u003cb>bên bán\u003c/b> điều hành một cuộc đấu giá có cấu trúc để tối đa hóa giá và sự chắc chắn cho người bán: chuẩn bị và định giá; một bản \u003cb>giới thiệu vắn tắt (teaser)\u003c/b> ẩn danh một trang; ký NDA; bản \u003cb>CIM\u003c/b>; vòng một cho ra các ý định quan tâm không ràng buộc; vòng hai với thuyết trình của ban điều hành và thẩm định tại phòng dữ liệu; chào giá ràng buộc cuối cùng kèm bản sửa đổi hợp đồng mua bán; thương lượng, ký kết và hoàn tất.\u003c/p>\u003cp>Nhà tư vấn \u003cb>bên mua\u003c/b> làm việc cho bên thâu tóm: tìm kiếm và sàng lọc công ty mục tiêu theo bộ lọc chiến lược, định giá công ty mục tiêu độc lập cộng với cộng hưởng, điều phối thẩm định, cấu trúc khoản thanh toán và thu xếp tài trợ, thương lượng điều khoản, và hỗ trợ lập kế hoạch hợp nhất.\u003c/p>\u003cp>\u003cb>Sức ép cạnh tranh\u003c/b> được tạo ra bằng cách vận hành một quy trình nhiều bên thực chất: tiếp cận đồng thời nhiều bên mua đáng tin cậy, áp đặt hạn chót chào giá cứng, giữ cho các bên chào giá không biết mức giá của đối thủ, duy trì một phương án rút lui đáng tin, và bảo toàn tính linh hoạt bằng cách giữ nhiều hơn một bên chào giá tới vòng cuối. Đánh đổi là giữa đấu giá rộng (khám phá giá tối đa, rủi ro rò rỉ và gián đoạn cao hơn) và quy trình có mục tiêu (bảo mật, ít sức ép hơn).\u003c/p>","rubricVi":"Các bước bên bán chính xác (1,3) · các hoạt động bên mua chính xác (1,2) · cơ chế tạo sức ép cạnh tranh (1,0) · đánh đổi rộng và có mục tiêu (0,5)."},{"id":"E3-2","ch":3,"type":"calc-essay","clo":"CLO1","marks":4,"q":"Acquirer A has EPS of $4.00, 100m shares and a share price of $60. Target T has net income of $150m, 50m shares and an unaffected price of $40. A offers a 25% premium, funding 60% in stock and 40% in cash borrowed at 4.5% after tax. After-tax synergies are $20m. (a) Compute the offer price and purchase equity value. (b) Compute new shares issued and after-tax interest. (c) Compute pro forma EPS and accretion/dilution. (d) Explain what would make the deal dilutive.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Offer price = $40 × 1.25 = \u003cb>$50.00\u003c/b>; purchase equity value = $50 × 50m = \u003cb>$2,500m\u003c/b>.\u003c/p>\u003cp>(b) Stock consideration = 60% × 2,500 = $1,500m → new shares = 1,500/60 = \u003cb>25m\u003c/b>. Cash = 40% × 2,500 = $1,000m → after-tax interest = 4.5% × 1,000 = \u003cb>$45m\u003c/b>.\u003c/p>\u003cp>(c) Acquirer NI = $4.00 × 100m = $400m. Pro forma NI = 400 + 150 + 20 − 45 = \u003cb>$525m\u003c/b>. Pro forma shares = 100 + 25 = \u003cb>125m\u003c/b>. Pro forma EPS = 525/125 = \u003cb>$4.20\u003c/b>. Accretion = 4.20/4.00 − 1 = \u003cb>+5.0% (accretive)\u003c/b>.\u003c/p>\u003cp>(d) The deal turns dilutive if: the premium rises so more shares must be issued or more debt raised; the stock proportion increases while the acquirer's P/E is below the P/E paid (A's P/E = 60/4 = 15×; the P/E paid = 2,500/150 = 16.7×, so the stock component alone is dilutive and is being rescued by cheap debt and synergies); the cost of debt rises above the target's earnings yield; or synergies fail to materialise. Sensitivity analysis on premium, mix and synergies is therefore standard.\u003c/p>","rubric":"(a) 0.7 · (b) 0.8 · (c) 1.5 with correct pro forma EPS and % · (d) at least three valid drivers of dilution incl. P/E logic (1.0).","qVi":"Bên thâu tóm A có EPS 4,00 USD, 100 triệu cổ phần và giá cổ phiếu 60 USD. Công ty mục tiêu T có lợi nhuận ròng 150 triệu USD, 50 triệu cổ phần và giá chưa bị ảnh hưởng 40 USD. A chào mức thặng dư 25%, tài trợ 60% bằng cổ phiếu và 40% bằng tiền mặt đi vay với lãi suất 4,5% sau thuế. Cộng hưởng sau thuế là 20 triệu USD. (a) Tính giá chào mua và giá trị vốn chủ mua lại. (b) Tính số cổ phần mới phát hành và lãi vay sau thuế. (c) Tính EPS hợp nhất dự kiến và mức tăng/giảm lãi. (d) Giải thích điều gì sẽ khiến thương vụ làm giảm lãi.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Giá chào mua = 40 USD × 1,25 = \u003cb>50,00 USD\u003c/b>; giá trị vốn chủ mua lại = 50 USD × 50 triệu = \u003cb>2.500 triệu USD\u003c/b>.\u003c/p>\u003cp>(b) Thanh toán bằng cổ phiếu = 60% × 2.500 = 1.500 triệu USD → cổ phần mới = 1.500/60 = \u003cb>25 triệu\u003c/b>. Tiền mặt = 40% × 2.500 = 1.000 triệu USD → lãi vay sau thuế = 4,5% × 1.000 = \u003cb>45 triệu USD\u003c/b>.\u003c/p>\u003cp>(c) Lợi nhuận ròng của A = 4,00 USD × 100 triệu = 400 triệu USD. Lợi nhuận ròng hợp nhất = 400 + 150 + 20 − 45 = \u003cb>525 triệu USD\u003c/b>. Cổ phần hợp nhất = 100 + 25 = \u003cb>125 triệu\u003c/b>. EPS hợp nhất = 525/125 = \u003cb>4,20 USD\u003c/b>. Mức tăng lãi = 4,20/4,00 − 1 = \u003cb>+5,0% (tăng lãi)\u003c/b>.\u003c/p>\u003cp>(d) Thương vụ chuyển sang giảm lãi nếu: mức thặng dư tăng khiến phải phát hành thêm cổ phần hoặc vay thêm nợ; tỷ trọng cổ phiếu tăng trong khi P/E của bên thâu tóm thấp hơn P/E phải trả (P/E của A = 60/4 = 15×; P/E phải trả = 2.500/150 = 16,7×, nên riêng phần thanh toán bằng cổ phiếu đã làm giảm lãi và đang được cứu bởi nợ rẻ cùng cộng hưởng); chi phí nợ vượt lên trên tỷ suất lợi nhuận trên giá của công ty mục tiêu; hoặc cộng hưởng không thành hiện thực. Phân tích độ nhạy theo thặng dư, cơ cấu thanh toán và cộng hưởng do đó là chuẩn mực.\u003c/p>","rubricVi":"(a) 0,7 · (b) 0,8 · (c) 1,5 với EPS hợp nhất và % đúng · (d) ít nhất ba yếu tố hợp lệ gây giảm lãi gồm logic P/E (1,0)."},{"id":"E3-3","ch":3,"type":"essay","clo":"CLO1","marks":4,"q":"Analyze why many acquisitions fail to create value for the acquirer despite a sound strategic rationale, and describe three anti-takeover defenses, evaluating whether they help or harm target shareholders.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Why deals fail.\u003c/b> (1) \u003cb>Overpayment\u003c/b> — competitive auctions and managerial over-confidence (hubris) push the premium above the value of realisable synergies; the premium is paid on day one, the synergies are uncertain and deferred. (2) \u003cb>Overestimated synergies\u003c/b> — especially revenue synergies, which depend on customer behaviour; cost synergies are more reliable. (3) \u003cb>Integration failure\u003c/b> — incompatible systems, culture clash, loss of key staff and customer disruption. (4) \u003cb>Agency problems\u003c/b> — empire-building rewarded by size-linked pay. Empirically, target shareholders capture most of the announced value while acquirers earn approximately zero or slightly negative abnormal returns.\u003c/p>\u003cp>\u003cb>Defenses.\u003c/b> \u003ci>Poison pill\u003c/i>: crossing an ownership threshold triggers discounted share purchases by other holders, diluting the bidder — forces negotiation with the board. \u003ci>Staggered board\u003c/i>: only part of the board is elected annually, so control requires two annual meetings — a strong deterrent. \u003ci>White knight\u003c/i>: the target invites a friendlier bidder to outbid the hostile one.\u003c/p>\u003cp>\u003cb>Evaluation.\u003c/b> Defenses can \u003cb>help\u003c/b> shareholders by strengthening the board's bargaining position and extracting a higher premium, and by preventing coercive or two-tier offers. They can \u003cb>harm\u003c/b> shareholders by entrenching weak management and denying a value-enhancing premium; the empirical evidence associates strong defenses (particularly staggered boards) with lower realised premia and weaker governance. The answer therefore depends on whether the board acts as a bargaining agent or as an entrenched incumbent.\u003c/p>","rubric":"At least three well-argued causes of failure with empirical evidence (1.8) · three defenses correctly described (1.2) · balanced two-sided evaluation (1.0).","qVi":"Phân tích vì sao nhiều thương vụ thâu tóm không tạo được giá trị cho bên mua dù lý do chiến lược hợp lý, và mô tả ba biện pháp chống thâu tóm, đánh giá chúng giúp ích hay gây hại cho cổ đông công ty mục tiêu.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Vì sao thương vụ thất bại.\u003c/b> (1) \u003cb>Trả giá quá cao\u003c/b> — đấu giá cạnh tranh và sự tự tin thái quá của ban điều hành (hubris) đẩy mức thặng dư vượt giá trị các cộng hưởng khả thi; thặng dư được trả ngay ngày đầu tiên, còn cộng hưởng thì bất định và trì hoãn. (2) \u003cb>Ước tính cộng hưởng quá lạc quan\u003c/b> — nhất là cộng hưởng doanh thu, vốn phụ thuộc hành vi khách hàng; cộng hưởng chi phí đáng tin cậy hơn. (3) \u003cb>Thất bại hợp nhất\u003c/b> — hệ thống không tương thích, xung đột văn hóa, mất nhân sự chủ chốt và gián đoạn khách hàng. (4) \u003cb>Vấn đề người đại diện\u003c/b> — xây dựng đế chế được tưởng thưởng bởi thù lao gắn với quy mô. Thực nghiệm cho thấy cổ đông công ty mục tiêu thâu tóm phần lớn giá trị được công bố trong khi bên mua trung bình đạt lợi suất bất thường xấp xỉ 0 hoặc âm nhẹ.\u003c/p>\u003cp>\u003cb>Các biện pháp phòng thủ.\u003c/b> \u003ci>Viên thuốc độc (poison pill)\u003c/i>: vượt một ngưỡng sở hữu sẽ kích hoạt quyền mua cổ phần giá chiết khấu cho các cổ đông khác, pha loãng bên chào mua — buộc phải thương lượng với hội đồng quản trị. \u003ci>Hội đồng quản trị bầu so le\u003c/i>: chỉ một phần hội đồng được bầu mỗi năm, nên giành quyền kiểm soát cần hai kỳ đại hội — một biện pháp răn đe mạnh. \u003ci>Hiệp sĩ trắng\u003c/i>: công ty mục tiêu mời một bên chào mua thân thiện hơn để trả giá cao hơn bên thù địch.\u003c/p>\u003cp>\u003cb>Đánh giá.\u003c/b> Các biện pháp phòng thủ có thể \u003cb>giúp\u003c/b> cổ đông bằng cách củng cố vị thế thương lượng của hội đồng và giành mức thặng dư cao hơn, và bằng cách ngăn các chào mua cưỡng ép hoặc hai tầng. Chúng có thể \u003cb>gây hại\u003c/b> cho cổ đông bằng cách bảo vệ ban điều hành yếu kém và tước đi mức thặng dư gia tăng giá trị; bằng chứng thực nghiệm gắn phòng thủ mạnh (đặc biệt hội đồng bầu so le) với mức thặng dư thực nhận thấp hơn và quản trị yếu hơn. Câu trả lời do đó tùy thuộc hội đồng hành động như một đại diện thương lượng hay như một đương nhiệm cố thủ.\u003c/p>","rubricVi":"Ít nhất ba nguyên nhân thất bại được lập luận tốt kèm bằng chứng thực nghiệm (1,8) · mô tả đúng ba biện pháp phòng thủ (1,2) · đánh giá hai chiều cân bằng (1,0)."},{"id":"E4-1","ch":4,"type":"essay","clo":"CLO2","marks":3,"q":"Explain the two main revenue lines in asset management and why AUM growth drives franchise value. Discuss how the rise of passive investing has changed the economics.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> The two lines are (1) the \u003cb>management fee\u003c/b>, a recurring percentage of assets under management charged regardless of performance, and (2) the \u003cb>performance fee (carry)\u003c/b>, a share of profits above a hurdle, which is contingent and volatile.\u003c/p>\u003cp>\u003cb>AUM drives value\u003c/b> because management-fee revenue scales directly and mechanically with assets, while the cost base (portfolio managers, research, systems) rises far more slowly — so incremental AUM is highly profitable. Revenue is also recurring and predictable, which is why universal banks value asset management as a stabiliser against cyclical advisory and trading income. AUM grows through market appreciation and through net inflows; retention matters as much as performance.\u003c/p>\u003cp>\u003cb>Passive investing\u003c/b> has compressed fees industry-wide. Because most active managers underperform their benchmark after fees, capital has migrated to index funds and ETFs charging a few basis points. Consequences: falling average revenue per unit of AUM; consolidation to achieve scale; a 'barbell' outcome in which cheap passive beta and genuinely differentiated alternatives (which retain carry) both prosper while mediocre, expensive active funds are squeezed; and greater emphasis on distribution and advice as sources of value.\u003c/p>","rubric":"Two revenue lines correctly explained (1.0) · AUM scaling logic incl. cost base (1.0) · informed discussion of passive-driven fee compression (1.0).","qVi":"Giải thích hai dòng doanh thu chính trong quản lý tài sản và vì sao tăng trưởng AUM dẫn dắt giá trị thương hiệu. Thảo luận việc đầu tư thụ động lên ngôi đã thay đổi kinh tế học của ngành ra sao.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> Hai dòng doanh thu là (1) \u003cb>phí quản lý\u003c/b>, một tỷ lệ phần trăm định kỳ trên tài sản đang quản lý, thu bất kể hiệu quả, và (2) \u003cb>phí hiệu quả (lãi thưởng)\u003c/b>, một phần lợi nhuận vượt ngưỡng, mang tính điều kiện và biến động.\u003c/p>\u003cp>\u003cb>AUM dẫn dắt giá trị\u003c/b> vì doanh thu phí quản lý tăng trực tiếp và cơ học theo tài sản, trong khi chi phí nền (nhà quản lý danh mục, nghiên cứu, hệ thống) tăng chậm hơn nhiều — nên AUM tăng thêm sinh lời rất cao. Doanh thu cũng định kỳ và dự đoán được, đó là lý do các ngân hàng đa năng coi trọng quản lý tài sản như một yếu tố ổn định trước thu nhập tư vấn và giao dịch mang tính chu kỳ. AUM tăng qua tăng giá thị trường và qua dòng vốn ròng vào; việc giữ chân khách hàng quan trọng ngang với hiệu quả đầu tư.\u003c/p>\u003cp>\u003cb>Đầu tư thụ động\u003c/b> đã nén phí trên toàn ngành. Vì phần lớn nhà quản lý chủ động thua chỉ số tham chiếu sau phí, vốn đã dịch chuyển sang quỹ chỉ số và ETF chỉ thu vài điểm cơ bản. Hệ quả: doanh thu bình quân trên mỗi đơn vị AUM giảm; hợp nhất để đạt quy mô; một kết cục hình 'quả tạ' trong đó beta thụ động giá rẻ và các sản phẩm thay thế thực sự khác biệt (vẫn giữ được lãi thưởng) cùng thịnh vượng, còn các quỹ chủ động tầm thường và đắt đỏ bị ép; và sự nhấn mạnh lớn hơn vào phân phối và tư vấn như nguồn giá trị.\u003c/p>","rubricVi":"Giải thích đúng hai dòng doanh thu (1,0) · logic mở rộng theo AUM gồm chi phí nền (1,0) · thảo luận có hiểu biết về nén phí do đầu tư thụ động (1,0)."},{"id":"E4-2","ch":4,"type":"calc-essay","clo":"CLO2","marks":3,"q":"A fund with $800m AUM charges a 2% management fee and 20% carry over an 8% hurdle. In year 1 the gross return is 15%; in year 2 it is 5%. (a) Compute the investor's net return in each year. (b) Compute the manager's revenue in each year. (c) Explain the purpose of a high-water mark.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Year 1:\u003c/b> excess over hurdle = 15% − 8% = 7%; carry = 20% × 7% = 1.4%. Net return = 15% − 2% − 1.4% = \u003cb>11.6%\u003c/b>. Manager revenue = (2% + 1.4%) × $800m = \u003cb>$27.2m\u003c/b>.\u003c/p>\u003cp>\u003cb>Year 2:\u003c/b> gross 5% is below the 8% hurdle, so carry = \u003cb>0\u003c/b>. Net return = 5% − 2% = \u003cb>3.0%\u003c/b>. Manager revenue = 2% × $800m = \u003cb>$16m\u003c/b>.\u003c/p>\u003cp>(c) A \u003cb>high-water mark\u003c/b> records the highest NAV on which performance fees have already been paid. After a loss, no carry may be charged until the NAV exceeds that previous peak. Without it a manager could lose 20% one year, gain 20% the next and collect carry on the recovery — charging twice for the same gains and rewarding volatility rather than skill. It protects investors and aligns incentives, working alongside the hurdle rate.\u003c/p>","rubric":"(a) both years correct incl. zero carry below hurdle (1.2) · (b) both revenue figures (0.8) · (c) high-water mark purpose with a clear example (1.0).","qVi":"Một quỹ có AUM 800 triệu USD thu phí quản lý 2% và lãi thưởng 20% trên ngưỡng 8%. Năm 1 lợi suất gộp là 15%; năm 2 là 5%. (a) Tính lợi suất ròng của nhà đầu tư mỗi năm. (b) Tính doanh thu của nhà quản lý mỗi năm. (c) Giải thích mục đích của mốc cao nhất (high-water mark).","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Năm 1:\u003c/b> phần vượt ngưỡng = 15% − 8% = 7%; lãi thưởng = 20% × 7% = 1,4%. Lợi suất ròng = 15% − 2% − 1,4% = \u003cb>11,6%\u003c/b>. Doanh thu của nhà quản lý = (2% + 1,4%) × 800 triệu USD = \u003cb>27,2 triệu USD\u003c/b>.\u003c/p>\u003cp>\u003cb>Năm 2:\u003c/b> lợi suất gộp 5% thấp hơn ngưỡng 8%, nên lãi thưởng = \u003cb>0\u003c/b>. Lợi suất ròng = 5% − 2% = \u003cb>3,0%\u003c/b>. Doanh thu của nhà quản lý = 2% × 800 triệu USD = \u003cb>16 triệu USD\u003c/b>.\u003c/p>\u003cp>(c) \u003cb>Mốc cao nhất\u003c/b> ghi lại NAV cao nhất mà phí hiệu quả đã được trả trên đó. Sau một khoản lỗ, không được thu lãi thưởng cho tới khi NAV vượt qua đỉnh trước đó. Không có nó, một nhà quản lý có thể lỗ 20% một năm, lãi 20% năm sau và thu lãi thưởng trên phần hồi phục — thu hai lần cho cùng một khoản lãi và tưởng thưởng cho sự biến động thay vì kỹ năng. Nó bảo vệ nhà đầu tư và gắn kết động cơ, hoạt động song hành với ngưỡng sinh lời.\u003c/p>","rubricVi":"(a) đúng cả hai năm gồm lãi thưởng bằng 0 khi dưới ngưỡng (1,2) · (b) cả hai con số doanh thu (0,8) · (c) mục đích mốc cao nhất với ví dụ rõ ràng (1,0)."},{"id":"E5-1","ch":5,"type":"calc-essay","clo":"CLO2","marks":4,"q":"A company has EBITDA of $120m, net debt of $200m, 50m diluted shares and EPS of $3.00. Peers trade at a median 9.0× EV/EBITDA and a median 16× P/E. (a) Compute the implied enterprise value, equity value and value per share using EV/EBITDA. (b) Compute the implied price using P/E. (c) Explain why the two results differ and which you would rely on. (d) Explain why the median is used rather than the mean.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Implied EV = 9.0 × $120m = \u003cb>$1,080m\u003c/b>. Equity value = 1,080 − 200 = \u003cb>$880m\u003c/b>. Value per share = 880/50 = \u003cb>$17.60\u003c/b>.\u003c/p>\u003cp>(b) Implied price = 16 × $3.00 = \u003cb>$48.00\u003c/b>.\u003c/p>\u003cp>(c) The two differ because they capitalise different quantities. EV/EBITDA values the entire business \u003cb>before\u003c/b> financing and is capital-structure neutral; the equity value is then derived by subtracting net debt. P/E capitalises earnings \u003cb>after\u003c/b> interest and tax, so it embeds the subject company's leverage and tax position. A large gap of this size implies the subject is far more leveraged than its peers (its net debt is deducted in method (a) but the peers' P/E reflects their own, lower, leverage), or that EPS contains non-recurring gains. I would rely on \u003cb>EV/EBITDA\u003c/b> for cross-company comparison and treat the P/E result as a cross-check only after adjusting peers to a comparable capital structure and normalising EPS for one-off items.\u003c/p>\u003cp>(d) The \u003cb>median\u003c/b> is used because peer sets are small and multiples are bounded below by zero but unbounded above, so distributions are right-skewed. One peer with temporarily depressed EBITDA (a very high multiple) can drag the mean far from the typical peer; the median is robust to such outliers.\u003c/p>","rubric":"(a) 1.2 · (b) 0.5 · (c) capital-structure explanation and reasoned choice (1.5) · (d) outlier/skew argument (0.8).","qVi":"Một công ty có EBITDA 120 triệu USD, nợ ròng 200 triệu USD, 50 triệu cổ phần pha loãng và EPS 3,00 USD. Nhóm so sánh giao dịch ở trung vị 9,0× EV/EBITDA và trung vị 16× P/E. (a) Tính giá trị doanh nghiệp ngụ ý, giá trị vốn chủ và giá trị mỗi cổ phần theo EV/EBITDA. (b) Tính giá ngụ ý theo P/E. (c) Giải thích vì sao hai kết quả khác nhau và bạn sẽ dựa vào kết quả nào. (d) Giải thích vì sao dùng trung vị chứ không phải trung bình.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) EV ngụ ý = 9,0 × 120 triệu USD = \u003cb>1.080 triệu USD\u003c/b>. Giá trị vốn chủ = 1.080 − 200 = \u003cb>880 triệu USD\u003c/b>. Giá trị mỗi cổ phần = 880/50 = \u003cb>17,60 USD\u003c/b>.\u003c/p>\u003cp>(b) Giá ngụ ý = 16 × 3,00 USD = \u003cb>48,00 USD\u003c/b>.\u003c/p>\u003cp>(c) Hai kết quả khác nhau vì chúng vốn hóa những đại lượng khác nhau. EV/EBITDA định giá toàn bộ doanh nghiệp \u003cb>trước\u003c/b> chi phí tài trợ và trung lập với cấu trúc vốn; giá trị vốn chủ sau đó được suy ra bằng cách trừ nợ ròng. P/E vốn hóa lợi nhuận \u003cb>sau\u003c/b> lãi vay và thuế, nên nó bao hàm đòn bẩy và tình trạng thuế của chính công ty. Một khoảng cách lớn cỡ này hàm ý công ty có đòn bẩy cao hơn nhiều so với nhóm so sánh (nợ ròng của nó được trừ trong phương pháp (a) trong khi P/E của nhóm so sánh phản ánh đòn bẩy thấp hơn của chính họ), hoặc EPS chứa các khoản lãi không thường xuyên. Tôi sẽ dựa vào \u003cb>EV/EBITDA\u003c/b> để so sánh giữa các công ty và chỉ coi kết quả P/E như một phép đối chiếu sau khi điều chỉnh nhóm so sánh về một cấu trúc vốn tương đương và chuẩn hóa EPS cho các khoản một lần.\u003c/p>\u003cp>(d) Dùng \u003cb>trung vị\u003c/b> vì nhóm so sánh nhỏ và bội số bị chặn dưới bởi 0 nhưng không có chặn trên, nên phân phối lệch phải. Một công ty so sánh có EBITDA tạm thời suy giảm (bội số rất cao) có thể kéo số trung bình rời xa mức điển hình; trung vị chống được các giá trị ngoại lai như vậy.\u003c/p>","rubricVi":"(a) 1,2 · (b) 0,5 · (c) giải thích về cấu trúc vốn và lựa chọn có lập luận (1,5) · (d) lập luận về giá trị ngoại lai/độ lệch (0,8)."},{"id":"E5-2","ch":5,"type":"essay","clo":"CLO2","marks":4,"q":"Analyze when capital restructuring (changing the debt/equity mix) increases firm value and what limits it. Illustrate with the credit metrics a lender would monitor.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Why leverage can add value.\u003c/b> Debt is cheaper than equity (it is senior and less risky) and interest is tax-deductible, creating a \u003cb>tax shield\u003c/b> worth approximately t × D in a simple setting. Substituting debt for equity therefore lowers WACC = (E/V)r\u003csub>e\u003c/sub> + (D/V)r\u003csub>d\u003c/sub>(1−t) and raises firm value. Leverage can also impose discipline on management by committing free cash flow to debt service, reducing the agency cost of free cash flow.\u003c/p>\u003cp>\u003cb>What limits it.\u003c/b> As leverage rises: equity becomes riskier so beta and r\u003csub>e\u003c/sub> increase; lenders demand higher r\u003csub>d\u003c/sub> and tighter covenants; and expected \u003cb>financial distress costs\u003c/b> grow — lost customers and suppliers, higher input prices, forced asset sales at a discount, management distraction and eventual bankruptcy costs. There is also a loss of \u003cb>financial flexibility\u003c/b>: a highly levered firm cannot fund an attractive investment or survive a downturn. Beyond an optimum the marginal distress cost exceeds the marginal tax benefit and WACC turns upward (trade-off theory). The optimum is lower for firms with volatile cash flows, few tangible assets and high growth options.\u003c/p>\u003cp>\u003cb>Metrics monitored:\u003c/b> leverage = net debt / EBITDA (investment grade typically under ~3×; leveraged credits 4–6×+); interest coverage = EBIT / interest (comfortable above ~5×, stressed below ~2×); also fixed-charge cover, free cash flow / debt, and the debt maturity profile. Covenants are written directly against these ratios, so a restructuring must leave headroom against them.\u003c/p>","rubric":"Tax shield and WACC mechanics (1.2) · at least three limiting factors incl. distress costs and flexibility (1.5) · correct metrics with indicative thresholds (0.8) · recognition that the optimum varies by business risk (0.5).","qVi":"Phân tích khi nào tái cấu trúc vốn (thay đổi tỷ lệ nợ/vốn chủ) làm tăng giá trị doanh nghiệp và điều gì giới hạn nó. Minh họa bằng các chỉ tiêu tín dụng mà bên cho vay theo dõi.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Vì sao đòn bẩy có thể tạo thêm giá trị.\u003c/b> Nợ rẻ hơn vốn chủ (nó có thứ tự ưu tiên cao và ít rủi ro hơn) và lãi vay được khấu trừ thuế, tạo ra một \u003cb>lá chắn thuế\u003c/b> trị giá xấp xỉ t × D trong một khung đơn giản. Thay vốn chủ bằng nợ do đó làm giảm WACC = (E/V)r\u003csub>e\u003c/sub> + (D/V)r\u003csub>d\u003c/sub>(1−t) và làm tăng giá trị doanh nghiệp. Đòn bẩy cũng có thể tạo kỷ luật cho ban điều hành bằng cách cam kết dòng tiền tự do vào việc trả nợ, giảm chi phí người đại diện của dòng tiền tự do.\u003c/p>\u003cp>\u003cb>Điều gì giới hạn nó.\u003c/b> Khi đòn bẩy tăng: vốn chủ trở nên rủi ro hơn nên beta và r\u003csub>e\u003c/sub> tăng; bên cho vay đòi r\u003csub>d\u003c/sub> cao hơn và điều khoản ràng buộc chặt hơn; và \u003cb>chi phí kiệt quệ tài chính\u003c/b> dự kiến tăng lên — mất khách hàng và nhà cung cấp, giá đầu vào cao hơn, buộc bán tài sản với giá chiết khấu, ban điều hành bị phân tán và cuối cùng là chi phí phá sản. Còn có sự mất \u003cb>linh hoạt tài chính\u003c/b>: một doanh nghiệp đòn bẩy cao không thể tài trợ một khoản đầu tư hấp dẫn hoặc sống sót qua suy thoái. Vượt một điểm tối ưu, chi phí kiệt quệ biên vượt lợi ích thuế biên và WACC quay đầu đi lên (lý thuyết đánh đổi). Điểm tối ưu thấp hơn với các doanh nghiệp có dòng tiền biến động, ít tài sản hữu hình và nhiều quyền chọn tăng trưởng.\u003c/p>\u003cp>\u003cb>Các chỉ tiêu được theo dõi:\u003c/b> đòn bẩy = nợ ròng / EBITDA (hạng đầu tư thường dưới ~3×; tín dụng có đòn bẩy 4–6× trở lên); khả năng trả lãi = EBIT / chi phí lãi vay (thoải mái trên ~5×, căng thẳng dưới ~2×); ngoài ra còn có hệ số bao phủ nghĩa vụ cố định, dòng tiền tự do / nợ, và cơ cấu kỳ hạn nợ. Các điều khoản ràng buộc được viết trực tiếp theo các hệ số này, nên một cuộc tái cấu trúc phải để lại dư địa so với chúng.\u003c/p>","rubricVi":"Lá chắn thuế và cơ chế WACC (1,2) · ít nhất ba yếu tố giới hạn gồm chi phí kiệt quệ và tính linh hoạt (1,5) · chỉ tiêu đúng với ngưỡng tham khảo (0,8) · nhận thức rằng điểm tối ưu thay đổi theo rủi ro kinh doanh (0,5)."},{"id":"E6-1","ch":6,"type":"essay","clo":"CLO3","marks":3,"q":"Distinguish agency brokerage, market making and proprietary trading by how each earns revenue and the risk it takes. Explain why a market maker widens its spread.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Agency brokerage:\u003c/b> the firm acts for the client, executing orders in the market and earning a \u003cb>commission\u003c/b>. It never takes the other side, so it bears no market risk — only operational, settlement and compliance risk (best execution, client asset segregation, no front-running).\u003c/p>\u003cp>\u003cb>Market making:\u003c/b> the firm acts as \u003cb>principal\u003c/b>, quoting two-sided prices and trading from its own inventory. It earns the \u003cb>bid-ask spread\u003c/b> in return for supplying immediacy, and bears inventory risk, adverse-selection risk and order-processing costs.\u003c/p>\u003cp>\u003cb>Proprietary trading:\u003c/b> the firm deploys its \u003cb>own capital\u003c/b> to profit from price movements, earning \u003cb>trading gains\u003c/b> and bearing full directional market risk. The distinction from market making is intent — facilitating client flow versus expressing a view; the Volcker Rule restricts most prop trading precisely because that line is hard to police.\u003c/p>\u003cp>\u003cb>Why spreads widen:\u003c/b> when volatility rises (inventory can move against the dealer faster), when volume/depth is thin (harder to offload a position), when the dealer suspects \u003cb>informed\u003c/b> trading (adverse selection), when its inventory is already unbalanced, and when funding or capital costs rise. The spread is therefore a direct, observable measure of market liquidity.\u003c/p>","rubric":"Three activities correctly distinguished by revenue and risk (1.8) · at least three valid reasons for spread widening (0.9) · spread as liquidity measure (0.3).","qVi":"Phân biệt môi giới đại lý, tạo lập thị trường và tự doanh theo cách mỗi hoạt động tạo doanh thu và rủi ro mà nó gánh chịu. Giải thích vì sao một nhà tạo lập thị trường nới rộng chênh lệch giá.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Môi giới đại lý:\u003c/b> công ty hành động thay khách hàng, thực hiện lệnh trên thị trường và hưởng \u003cb>hoa hồng\u003c/b>. Nó không bao giờ đứng ở chiều đối ứng, nên không gánh rủi ro thị trường — chỉ có rủi ro vận hành, thanh toán và tuân thủ (thực hiện tốt nhất, tách bạch tài sản khách hàng, không giao dịch chạy trước lệnh).\u003c/p>\u003cp>\u003cb>Tạo lập thị trường:\u003c/b> công ty hành động với vai trò \u003cb>chính chủ\u003c/b>, yết giá hai chiều và giao dịch từ tồn kho của chính mình. Nó hưởng \u003cb>chênh lệch giá đặt mua – chào bán\u003c/b> để đổi lấy việc cung cấp tính tức thời, và gánh rủi ro tồn kho, rủi ro lựa chọn bất lợi và chi phí xử lý lệnh.\u003c/p>\u003cp>\u003cb>Tự doanh:\u003c/b> công ty triển khai \u003cb>vốn của chính mình\u003c/b> để kiếm lời từ biến động giá, hưởng \u003cb>lãi giao dịch\u003c/b> và gánh toàn bộ rủi ro thị trường theo hướng. Sự phân biệt với tạo lập thị trường nằm ở ý định — hỗ trợ dòng lệnh khách hàng so với thể hiện một quan điểm; Quy tắc Volcker hạn chế phần lớn hoạt động tự doanh chính vì ranh giới đó khó giám sát.\u003c/p>\u003cp>\u003cb>Vì sao chênh lệch giá nới rộng:\u003c/b> khi biến động tăng (tồn kho có thể chuyển động bất lợi nhanh hơn), khi khối lượng/độ sâu mỏng (khó đẩy vị thế đi hơn), khi nhà tạo lập nghi ngờ có giao dịch từ bên \u003cb>nắm nhiều thông tin\u003c/b> (lựa chọn bất lợi), khi tồn kho của họ đã mất cân bằng, và khi chi phí vốn hoặc chi phí huy động tăng. Chênh lệch giá do đó là một thước đo trực tiếp, quan sát được, của tính thanh khoản thị trường.\u003c/p>","rubricVi":"Phân biệt đúng ba hoạt động theo doanh thu và rủi ro (1,8) · ít nhất ba lý do hợp lệ khiến chênh lệch giá nới rộng (0,9) · chênh lệch giá như thước đo thanh khoản (0,3)."},{"id":"E6-2","ch":6,"type":"calc-essay","clo":"CLO3","marks":3,"q":"An investor buys 2,000 shares at $60 with a 50% initial margin and a 30% maintenance margin. (a) Compute the equity posted and the loan. (b) Compute the margin-call price. (c) If the price falls to $40, compute the account equity and state whether a call is triggered. (d) Compute the investor's return on equity at $40 and compare with the unlevered return.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> (a) Position value = 2,000 × $60 = $120,000. Equity posted = 50% × 120,000 = \u003cb>$60,000\u003c/b>; loan = \u003cb>$60,000\u003c/b>.\u003c/p>\u003cp>(b) Call price = P × (1 − initial)/(1 − maintenance) = 60 × 0.50/0.70 = \u003cb>$42.86\u003c/b>.\u003c/p>\u003cp>(c) At $40: market value = 2,000 × 40 = $80,000; equity = 80,000 − 60,000 = \u003cb>$20,000\u003c/b>, which is 20,000/80,000 = \u003cb>25%\u003c/b> of market value — below the 30% maintenance requirement, and $40 is below the $42.86 call price, so a \u003cb>margin call is triggered\u003c/b>. The investor must deposit cash or securities to restore 30% equity, or the broker will liquidate the position.\u003c/p>\u003cp>(d) Levered return = (20,000 − 60,000)/60,000 = \u003cb>−66.7%\u003c/b> (ignoring interest). Unlevered return = (40 − 60)/60 = \u003cb>−33.3%\u003c/b>. Leverage of 2× has exactly doubled the loss — the symmetric counterpart of doubling a gain, and the reason margin lending is a risk-managed product.\u003c/p>","rubric":"(a) 0.5 · (b) 0.7 · (c) equity, ratio and correct call conclusion (1.0) · (d) both returns with leverage interpretation (0.8).","qVi":"Một nhà đầu tư mua 2.000 cổ phần giá 60 USD với tỷ lệ ký quỹ ban đầu 50% và tỷ lệ duy trì 30%. (a) Tính vốn chủ đã nộp và khoản vay. (b) Tính giá gọi ký quỹ bổ sung. (c) Nếu giá giảm về 40 USD, tính vốn chủ tài khoản và nêu có kích hoạt lệnh gọi hay không. (d) Tính tỷ suất sinh lời trên vốn chủ của nhà đầu tư ở mức 40 USD và so sánh với tỷ suất khi không dùng đòn bẩy.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> (a) Giá trị vị thế = 2.000 × 60 USD = 120.000 USD. Vốn chủ đã nộp = 50% × 120.000 = \u003cb>60.000 USD\u003c/b>; khoản vay = \u003cb>60.000 USD\u003c/b>.\u003c/p>\u003cp>(b) Giá gọi ký quỹ = P × (1 − ký quỹ ban đầu)/(1 − ký quỹ duy trì) = 60 × 0,50/0,70 = \u003cb>42,86 USD\u003c/b>.\u003c/p>\u003cp>(c) Ở 40 USD: giá trị thị trường = 2.000 × 40 = 80.000 USD; vốn chủ = 80.000 − 60.000 = \u003cb>20.000 USD\u003c/b>, tức 20.000/80.000 = \u003cb>25%\u003c/b> giá trị thị trường — dưới mức duy trì 30%, và 40 USD thấp hơn giá gọi 42,86 USD, nên \u003cb>lệnh gọi ký quỹ được kích hoạt\u003c/b>. Nhà đầu tư phải nộp thêm tiền hoặc chứng khoán để khôi phục tỷ lệ 30%, nếu không công ty môi giới sẽ bán giải chấp vị thế.\u003c/p>\u003cp>(d) Tỷ suất có đòn bẩy = (20.000 − 60.000)/60.000 = \u003cb>−66,7%\u003c/b> (chưa tính lãi vay). Tỷ suất không đòn bẩy = (40 − 60)/60 = \u003cb>−33,3%\u003c/b>. Đòn bẩy 2× đã nhân đôi đúng khoản lỗ — mặt đối xứng của việc nhân đôi khoản lãi, và là lý do cho vay ký quỹ là một sản phẩm cần quản trị rủi ro.\u003c/p>","rubricVi":"(a) 0,5 · (b) 0,7 · (c) vốn chủ, tỷ lệ và kết luận đúng về lệnh gọi (1,0) · (d) cả hai tỷ suất với diễn giải về đòn bẩy (0,8)."},{"id":"E6-3","ch":6,"type":"essay","clo":"CLO3","marks":3,"exam":"final","q":"Explain how securities lending enables short selling, identify the costs and risks to the short seller, and discuss why regulators monitor short selling closely.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>Mechanism.\u003c/b> A lender (typically a fund or custodian holding a long-term position) lends shares against collateral and a borrow fee. The short seller (1) borrows the shares, (2) sells them in the market at today's price, (3) later buys them back, and (4) returns them to the lender. Profit = sale price − repurchase price − borrow fee − any dividends that must be passed through to the lender.\u003c/p>\u003cp>\u003cb>Costs and risks.\u003c/b> The borrow fee (which can spike for hard-to-borrow stocks); dividend and corporate-action pass-throughs; margin/collateral requirements on the position; \u003cb>unlimited theoretical loss\u003c/b>, since the price can rise without bound while a long position can only fall to zero; \u003cb>recall risk\u003c/b>, if the lender demands the shares back, forcing the short to cover at a bad moment; and \u003cb>short squeeze\u003c/b> risk, where rising prices force crowded shorts to buy simultaneously, driving prices higher still.\u003c/p>\u003cp>\u003cb>Why regulators care.\u003c/b> Short selling aids price discovery, corrects overvaluation and adds liquidity, and shorts have historically exposed frauds. But it can amplify falls in a crisis, and naked shorting (selling without arranging a borrow) risks settlement failure. Regulators therefore impose locate/borrow requirements, disclosure of large short positions, and sometimes temporary bans. Vietnam restricts covered short selling and regulates margin ratios directly as a macro-prudential tool.\u003c/p>","rubric":"Four-step mechanism with correct profit formula (1.2) · at least three costs/risks incl. unlimited loss and recall/squeeze (1.0) · balanced regulatory discussion (0.8).","qVi":"Giải thích cho vay chứng khoán tạo điều kiện cho bán khống như thế nào, nhận diện các chi phí và rủi ro đối với người bán khống, và thảo luận vì sao cơ quan quản lý giám sát bán khống chặt chẽ.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>Cơ chế.\u003c/b> Bên cho vay (thường là một quỹ hoặc ngân hàng lưu ký nắm giữ vị thế dài hạn) cho vay cổ phần để đổi lấy tài sản bảo đảm và một khoản phí vay. Người bán khống (1) vay cổ phần, (2) bán chúng trên thị trường ở giá hôm nay, (3) sau đó mua lại, và (4) trả lại cho bên cho vay. Lợi nhuận = giá bán − giá mua lại − phí vay − mọi khoản cổ tức phải trả lại cho bên cho vay.\u003c/p>\u003cp>\u003cb>Chi phí và rủi ro.\u003c/b> Phí vay (có thể tăng vọt với các cổ phiếu khó vay); các khoản cổ tức và quyền lợi doanh nghiệp phải trả lại; yêu cầu ký quỹ/tài sản bảo đảm trên vị thế; \u003cb>khoản lỗ về lý thuyết là không giới hạn\u003c/b>, vì giá có thể tăng vô hạn trong khi vị thế mua chỉ có thể giảm về 0; \u003cb>rủi ro thu hồi\u003c/b>, nếu bên cho vay đòi lại cổ phần, buộc người bán khống phải mua bù vào thời điểm bất lợi; và rủi ro \u003cb>siết mua (short squeeze)\u003c/b>, khi giá tăng buộc các vị thế bán khống đông đảo phải mua đồng thời, đẩy giá lên cao hơn nữa.\u003c/p>\u003cp>\u003cb>Vì sao cơ quan quản lý quan tâm.\u003c/b> Bán khống hỗ trợ khám phá giá, điều chỉnh tình trạng định giá quá cao và bổ sung thanh khoản, và những người bán khống trong lịch sử đã phơi bày các vụ gian lận. Nhưng nó có thể khuếch đại đà giảm trong khủng hoảng, và bán khống trần (bán mà không thu xếp vay) tạo rủi ro mất khả năng thanh toán giao dịch. Cơ quan quản lý do đó áp đặt yêu cầu xác định nguồn vay, công bố các vị thế bán khống lớn, và đôi khi cấm tạm thời. Việt Nam hạn chế bán khống có bảo đảm và điều tiết trực tiếp tỷ lệ ký quỹ như một công cụ an toàn vĩ mô.\u003c/p>","rubricVi":"Cơ chế bốn bước với công thức lợi nhuận đúng (1,2) · ít nhất ba chi phí/rủi ro gồm lỗ không giới hạn và thu hồi/siết mua (1,0) · thảo luận cân bằng về quản lý (0,8)."},{"id":"E1-4","ch":1,"type":"essay","clo":"CLO1","marks":4,"exam":"midterm","q":"Compare an investment bank with a commercial bank across the six criteria used in the course: business model, sources of income, method of raising funds, asset–liability management orientation, financial leverage and legal framework.","guide":"\u003cp>\u003cb>Model answer.\u003c/b> \u003cb>(1) Business model.\u003c/b> The IB channels capital from surplus to deficit units through the capital market; capital reaches the issuer and the \u003cb>investment risk stays with the investor\u003c/b>. The CB interposes its balance sheet — takes deposits, makes loans, and absorbs the \u003cb>credit risk\u003c/b> itself.\u003c/p>\u003cp>\u003cb>(2) Income.\u003c/b> IB: fees (underwriting, brokerage, trusteeship and asset management, advisory, transactions), interest spread in wholesale banking, and proprietary trading P&amp;L. CB: net interest margin plus payment and service fees.\u003c/p>\u003cp>\u003cb>(3) Raising funds.\u003c/b> The IB's key disadvantage is that it \u003cb>may not take public deposits\u003c/b>. Its largest source is \u003cb>secured borrowing\u003c/b> — repo, sell-and-buy-back, securities lending, short selling, margin agreements — collateralised by liquid securities; the second is unsecured borrowing (bank loans, bonds, notes, commercial paper); then equity. The CB funds itself principally with customer deposits.\u003c/p>\u003cp>\u003cb>(4) ALM orientation.\u003c/b> The CB raises funds first and then decides deployment — \u003ci>funding determines use of funds\u003c/i>, an \u003cb>asset-management\u003c/b> orientation. The IB raises funding only against actual investment needs — \u003ci>use of funds determines funding\u003c/i>, a \u003cb>liability-management\u003c/b> orientation.\u003c/p>\u003cp>\u003cb>(5) Leverage.\u003c/b> The CB is low-leverage: many assets are loans and long-held investments, and leverage is constrained by Basel capital-adequacy ratios. The IB is high-leverage because most assets are liquid and readily pledged. Accepting and controlling high leverage is the core art of managing an IB.\u003c/p>\u003cp>\u003cb>(6) Legal framework.\u003c/b> Supervisor varies: the US SEC (and, after 2008, also the Federal Reserve); the central bank in Europe; the \u003cb>State Securities Commission\u003c/b> in Vietnam. Add the summary differences: IB operates mainly in the capital market with low profit stability and high operating risk; the CB in the money market with high stability and lower risk.\u003c/p>","rubric":"All six criteria addressed (3.0 — 0.5 each) · correct direction of each contrast (0.6) · Vietnamese supervisory context (0.4).","qVi":"So sánh ngân hàng đầu tư với ngân hàng thương mại theo sáu tiêu chí được dùng trong học phần: mô hình hoạt động, nguồn thu nhập, cách huy động vốn, định hướng quản lý tài sản – nợ, đòn bẩy tài chính và khuôn khổ pháp lý.","guideVi":"\u003cp>\u003cb>Bài giải mẫu.\u003c/b> \u003cb>(1) Mô hình hoạt động.\u003c/b> Ngân hàng đầu tư dẫn vốn từ chủ thể thừa vốn sang chủ thể thiếu vốn qua thị trường vốn; vốn đến với tổ chức phát hành còn \u003cb>rủi ro đầu tư vẫn thuộc về nhà đầu tư\u003c/b>. Ngân hàng thương mại đặt bảng cân đối của mình vào giữa — nhận tiền gửi, cho vay và tự gánh \u003cb>rủi ro tín dụng\u003c/b>.\u003c/p>\u003cp>\u003cb>(2) Thu nhập.\u003c/b> Ngân hàng đầu tư: phí (bảo lãnh, môi giới, nhận uỷ thác và quản lý tài sản, tư vấn, giao dịch), chênh lệch lãi trong hoạt động ngân hàng bán buôn, và lãi/lỗ từ tự doanh. Ngân hàng thương mại: biên lãi ròng cộng phí thanh toán và dịch vụ.\u003c/p>\u003cp>\u003cb>(3) Huy động vốn.\u003c/b> Bất lợi then chốt của ngân hàng đầu tư là \u003cb>không được nhận tiền gửi công chúng\u003c/b>. Nguồn lớn nhất là \u003cb>đi vay có tài sản bảo đảm\u003c/b> — repo, bán và mua lại, cho vay chứng khoán, bán khống, hợp đồng ký quỹ — được bảo đảm bằng chứng khoán thanh khoản cao; nguồn thứ hai là đi vay không bảo đảm (vay ngân hàng, trái phiếu, tín phiếu, thương phiếu); rồi đến vốn chủ. Ngân hàng thương mại huy động vốn chủ yếu bằng tiền gửi khách hàng.\u003c/p>\u003cp>\u003cb>(4) Định hướng quản lý tài sản – nợ.\u003c/b> Ngân hàng thương mại huy động vốn trước rồi mới quyết định sử dụng — \u003ci>nguồn vốn quyết định việc sử dụng vốn\u003c/i>, định hướng \u003cb>quản lý tài sản\u003c/b>. Ngân hàng đầu tư chỉ huy động vốn khi có nhu cầu đầu tư thực tế — \u003ci>việc sử dụng vốn quyết định nguồn vốn\u003c/i>, định hướng \u003cb>quản lý nợ\u003c/b>.\u003c/p>\u003cp>\u003cb>(5) Đòn bẩy.\u003c/b> Ngân hàng thương mại có đòn bẩy thấp: nhiều tài sản là khoản cho vay và khoản đầu tư nắm giữ lâu, và đòn bẩy bị ràng buộc bởi hệ số an toàn vốn theo Basel. Ngân hàng đầu tư có đòn bẩy cao vì phần lớn tài sản thanh khoản và dễ đem cầm cố. Chấp nhận và kiểm soát đòn bẩy cao là nghệ thuật cốt lõi của việc quản lý ngân hàng đầu tư.\u003c/p>\u003cp>\u003cb>(6) Khuôn khổ pháp lý.\u003c/b> Cơ quan giám sát khác nhau: SEC ở Hoa Kỳ (và, sau 2008, cả Cục Dự trữ Liên bang); ngân hàng trung ương ở châu Âu; \u003cb>Uỷ ban Chứng khoán Nhà nước\u003c/b> ở Việt Nam. Bổ sung các khác biệt tổng hợp: ngân hàng đầu tư hoạt động chủ yếu trên thị trường vốn với mức ổn định lợi nhuận thấp và rủi ro hoạt động cao; ngân hàng thương mại hoạt động trên thị trường tiền tệ với mức ổn định cao và rủi ro thấp hơn.\u003c/p>","rubricVi":"Đề cập đủ sáu tiêu chí (3,0 — mỗi tiêu chí 0,5) · đúng chiều của mỗi so sánh (0,6) · bối cảnh giám sát tại Việt Nam (0,4)."},{"id":"E1-5","ch":1,"type":"case","clo":"CLO1","marks":4,"exam":"final","q":"A Vietnamese securities company operates brokerage, proprietary trading, underwriting and research under one roof. Identify the conflicts of interest that arise between these divisions and design the control framework you would recommend.","guide":"\u003cp>\u003cb>Model answer — conflicts.\u003c/b> (i) \u003cb>Research vs. investment banking\u003c/b>: pressure to publish favourable reports to win or protect an underwriting or advisory mandate. (ii) \u003cb>Research vs. proprietary trading\u003c/b>: pressure to publish reports that benefit the firm's own book — for example a 'buy' recommendation while the desk sells. (iii) \u003cb>Proprietary trading vs. brokerage\u003c/b>: the temptation to front-run client orders, or to allocate favourable fills to the firm. (iv) \u003cb>Investment banking vs. asset management\u003c/b>: placing an underwritten issue into managed client portfolios to clear inventory. (v) \u003cb>Underwriting vs. investors\u003c/b>: allocation of hot IPO shares to favoured accounts.\u003c/p>\u003cp>\u003cb>Control framework.\u003c/b> (1) An \u003cb>information barrier\u003c/b> separating the \u003cb>private side\u003c/b> (investment-banking staff holding material non-public information) from the \u003cb>public side\u003c/b> (research, sales and trading), enforced physically and in system access, with documented \u003cb>wall-crossing\u003c/b> procedures and a restricted/watch list maintained by a control room. (2) \u003cb>Client order priority\u003c/b> — client orders execute ahead of the firm's; separate accounts, order books and personnel for proprietary trading. (3) \u003cb>Research independence\u003c/b> — research reporting lines and compensation separated from banking revenue; no pre-publication review by bankers; mandatory disclosure of banking relationships in reports. (4) \u003cb>Allocation policy\u003c/b> — a written, objective IPO allocation policy with records. (5) \u003cb>Personal account dealing\u003c/b> rules and pre-clearance. (6) \u003cb>Compliance monitoring\u003c/b> — surveillance of trading around research publication and around mandates, plus internal audit. (7) \u003cb>Governance\u003c/b> — an independent compliance function reporting to the board, and staff training with disciplinary consequences.\u003c/p>","rubric":"At least four genuine conflicts correctly identified (1.6) · information barrier and private/public side explained (1.0) · at least four concrete controls (1.0) · governance/enforcement point (0.4).","qVi":"Một công ty chứng khoán Việt Nam thực hiện môi giới, tự doanh, bảo lãnh phát hành và nghiên cứu dưới cùng một mái nhà. Nhận diện các xung đột lợi ích phát sinh giữa các bộ phận này và thiết kế khuôn khổ kiểm soát mà bạn khuyến nghị.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các xung đột.\u003c/b> (i) \u003cb>Nghiên cứu và ngân hàng đầu tư\u003c/b>: áp lực công bố báo cáo thuận lợi để giành hoặc giữ hợp đồng bảo lãnh hay tư vấn. (ii) \u003cb>Nghiên cứu và tự doanh\u003c/b>: áp lực công bố báo cáo có lợi cho sổ giao dịch của chính công ty — chẳng hạn khuyến nghị 'mua' trong khi bàn giao dịch đang bán. (iii) \u003cb>Tự doanh và môi giới\u003c/b>: cám dỗ giao dịch chạy trước lệnh của khách hàng (front-running), hoặc phân bổ các lệnh khớp có lợi cho công ty. (iv) \u003cb>Ngân hàng đầu tư và quản lý tài sản\u003c/b>: đưa một đợt phát hành đã bảo lãnh vào danh mục khách hàng đang quản lý để giải phóng tồn kho. (v) \u003cb>Bảo lãnh và nhà đầu tư\u003c/b>: phân bổ cổ phần IPO 'nóng' cho các tài khoản được ưu ái.\u003c/p>\u003cp>\u003cb>Khuôn khổ kiểm soát.\u003c/b> (1) Một \u003cb>rào chắn thông tin\u003c/b> tách \u003cb>bên riêng tư\u003c/b> (nhân sự ngân hàng đầu tư nắm thông tin trọng yếu chưa công bố) khỏi \u003cb>bên công khai\u003c/b> (nghiên cứu, bán hàng và giao dịch), thực thi bằng phân tách vật lý và truy cập hệ thống, với thủ tục \u003cb>vượt tường\u003c/b> có ghi chép và một danh sách hạn chế/theo dõi do phòng kiểm soát duy trì. (2) \u003cb>Ưu tiên lệnh khách hàng\u003c/b> — lệnh khách hàng được khớp trước lệnh của công ty; tài khoản, sổ lệnh và nhân sự riêng cho tự doanh. (3) \u003cb>Độc lập của nghiên cứu\u003c/b> — tuyến báo cáo và thù lao của bộ phận nghiên cứu tách khỏi doanh thu ngân hàng đầu tư; chuyên viên tư vấn không được xem trước khi công bố; bắt buộc công bố quan hệ ngân hàng đầu tư trong báo cáo. (4) \u003cb>Chính sách phân bổ\u003c/b> — chính sách phân bổ IPO bằng văn bản, khách quan, có lưu vết. (5) Quy tắc \u003cb>giao dịch tài khoản cá nhân\u003c/b> và phê duyệt trước. (6) \u003cb>Giám sát tuân thủ\u003c/b> — theo dõi giao dịch quanh thời điểm công bố nghiên cứu và quanh các hợp đồng, cùng kiểm toán nội bộ. (7) \u003cb>Quản trị\u003c/b> — chức năng tuân thủ độc lập báo cáo lên hội đồng quản trị, và đào tạo nhân sự kèm chế tài kỷ luật.\u003c/p>","rubricVi":"Nhận diện đúng ít nhất bốn xung đột thực sự (1,6) · giải thích rào chắn thông tin và bên riêng tư/công khai (1,0) · ít nhất bốn biện pháp kiểm soát cụ thể (1,0) · điểm về quản trị/thực thi (0,4)."},{"id":"E2-4","ch":2,"type":"essay","clo":"CLO1","marks":4,"exam":"midterm","q":"A Vietnamese joint-stock company intends to make an initial public offering. Set out the conditions it must satisfy under the Law on Securities 2019, classify the issuance methods available to it, and describe the issuance process.","guide":"\u003cp>\u003cb>Model answer — conditions.\u003c/b> Paid-up \u003cb>charter capital of at least VND 30 billion\u003c/b> by book value at registration; \u003cb>profitable operations in the two preceding years\u003c/b> with no accumulated losses to the year of registration; an offering and capital-use plan approved by the General Meeting of Shareholders; at least \u003cb>15% of voting shares sold to at least 100 non-major shareholders\u003c/b> (with an adjusted proportion for larger charter capital); a commitment by major shareholders to hold at least 20% of charter capital for at least one year; the issuer is not under criminal prosecution; an \u003cb>securities company advising on the registration dossier\u003c/b> (unless the issuer is itself a securities company) — the 2019 Law requires an adviser, not an underwriter; and a commitment to list or register for trading after the offering. A depository account and a blocked escrow account for proceeds are also required.\u003c/p>\u003cp>\u003cb>Classification of methods.\u003c/b> \u003ci>By offering round\u003c/i>: initial (IPO) vs. secondary/seasoned. \u003ci>By target investor\u003c/i>: public offering, private placement, rights issue to existing shareholders, ESOP. \u003ci>By pricing method\u003c/i>: fixed price, bookbuilding, auction. \u003ci>By distribution method\u003c/i>: direct issuance vs. issuance through an underwriting intermediary.\u003c/p>\u003cp>\u003cb>Process.\u003c/b> Preparation and appointment of the underwriter → due diligence (legal, financial, business) → registration dossier and prospectus filed with the SSC → valuation and price range → roadshow and bookbuilding → pricing, distribution and allocation → reporting of results, share registration and listing → aftermarket stabilisation using the greenshoe (up to 15% of the base deal).\u003c/p>","rubric":"At least five conditions with correct thresholds (1.5) · all four classification axes (1.3) · process in correct sequence (1.2).","qVi":"Một công ty cổ phần Việt Nam dự định phát hành cổ phiếu lần đầu ra công chúng. Trình bày các điều kiện phải đáp ứng theo Luật Chứng khoán 2019, phân loại các phương thức phát hành khả dụng, và mô tả quy trình phát hành.","guideVi":"\u003cp>\u003cb>Bài giải mẫu — các điều kiện.\u003c/b> \u003cb>Vốn điều lệ đã góp từ 30 tỷ đồng trở lên\u003c/b> tính theo giá trị sổ sách tại thời điểm đăng ký; \u003cb>hoạt động kinh doanh có lãi trong hai năm liền trước\u003c/b> và không có lỗ lũy kế tính đến năm đăng ký; phương án phát hành và sử dụng vốn được Đại hội đồng cổ đông thông qua; tối thiểu \u003cb>15% số cổ phiếu có quyền biểu quyết được bán cho ít nhất 100 cổ đông không phải cổ đông lớn\u003c/b> (tỷ lệ điều chỉnh theo mức vốn điều lệ lớn hơn); cam kết của cổ đông lớn nắm giữ ít nhất 20% vốn điều lệ trong tối thiểu một năm; tổ chức phát hành không đang bị truy cứu trách nhiệm hình sự; có \u003cb>công ty chứng khoán tư vấn hồ sơ đăng ký chào bán\u003c/b> (trừ khi tổ chức phát hành tự là công ty chứng khoán) — Luật 2019 đòi hỏi tổ chức tư vấn, không bắt buộc tổ chức bảo lãnh; và cam kết niêm yết hoặc đăng ký giao dịch sau đợt phát hành. Cũng cần một tài khoản lưu ký và một tài khoản phong tỏa để nhận tiền thu.\u003c/p>\u003cp>\u003cb>Phân loại các phương thức.\u003c/b> \u003ci>Theo vòng phát hành\u003c/i>: lần đầu (IPO) và phát hành thêm/tiếp theo. \u003ci>Theo nhà đầu tư mục tiêu\u003c/i>: chào bán ra công chúng, chào bán riêng lẻ, phát hành quyền mua cho cổ đông hiện hữu, ESOP. \u003ci>Theo phương pháp định giá\u003c/i>: giá cố định, dựng sổ, đấu giá. \u003ci>Theo phương thức phân phối\u003c/i>: phát hành trực tiếp và phát hành qua trung gian bảo lãnh.\u003c/p>\u003cp>\u003cb>Quy trình.\u003c/b> Chuẩn bị và chỉ định nhà bảo lãnh → thẩm định (pháp lý, tài chính, kinh doanh) → hồ sơ đăng ký và bản cáo bạch nộp UBCKNN → định giá và khoảng giá → roadshow và dựng sổ → định giá, phân phối và phân bổ → báo cáo kết quả, đăng ký chứng khoán và niêm yết → bình ổn thị trường thứ cấp dùng greenshoe (tối đa 15% thương vụ cơ bản).\u003c/p>","rubricVi":"Ít nhất năm điều kiện với ngưỡng đúng (1,5) · đủ bốn trục phân loại (1,3) · quy trình theo đúng trình tự (1,2)."},{"id":"E3-4","ch":3,"type":"case","clo":"CLO1","marks":4,"exam":"midterm","q":"You advise the board of a listed Vietnamese company that has received an unsolicited, below-value takeover approach. Explain the defensive tactics available, distinguishing preventive from reactive measures, and advise the board on the fiduciary considerations.","guide":"\u003cp>\u003cb>Model answer — preventive defences.\u003c/b> \u003ci>Poison pill\u003c/i> (rights plan) diluting a bidder that crosses a threshold; \u003ci>staggered board\u003c/i> so control requires two annual meetings; \u003ci>supermajority provisions\u003c/i> in the charter; \u003ci>golden parachutes\u003c/i> raising the cost of a change of control; \u003ci>cross-shareholdings\u003c/i> with friendly parties.\u003c/p>\u003cp>\u003cb>Reactive / counter-attack tactics.\u003c/b> \u003ci>White knight\u003c/i> — invite a friendlier bidder to outbid; \u003ci>crown jewel\u003c/i> — sell or option the asset the bidder most wants; \u003ci>Pac-Man\u003c/i> — counter-bid for the raider; \u003ci>greenmail\u003c/i> — repurchase the raider's stake at a premium; \u003ci>litigation and regulatory challenge\u003c/i> to gain time; \u003ci>recapitalisation\u003c/i> with a special dividend to make the target less attractive.\u003c/p>\u003cp>\u003cb>Fiduciary considerations.\u003c/b> The board's duty runs to the \u003cb>company and its shareholders\u003c/b>, not to preserving management's positions. It should: (i) obtain an independent \u003cb>valuation and fairness opinion\u003c/b> to establish whether the offer genuinely undervalues the company; (ii) document that any defence is a proportionate response to a real threat, not entrenchment; (iii) manage conflicts — directors and executives with parachutes or continuing roles should be recused from key decisions; (iv) consider whether an auction would obtain better value for shareholders than resistance; (v) comply with disclosure obligations and equal treatment of shareholders. Empirically, strong defences (especially staggered boards) are associated with \u003cb>lower realised p
