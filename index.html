<nav class="mob-tabbar" id="mobTabbar" aria-label="Điều hướng di động">
  <div class="mob-tab-glider" id="mobTabGlider" aria-hidden="true">
    <span class="mob-glider-lamp"></span>
    <span class="mob-glider-cone"></span>
  </div>
  <button type="button" class="mob-tab active" data-mtab="home">
    <span class="mob-tab-ico" id="mtIcoHome"></span>
    <span class="mob-tab-lbl" data-mlbl="home">Tổng quan</span>
  </button>
  <button type="button" class="mob-tab" data-mtab="chapter">
    <span class="mob-tab-ico" id="mtIcoChapter"></span>
    <span class="mob-tab-lbl" data-mlbl="chapter">Bài giảng</span>
  </button>
  <button type="button" class="mob-tab" data-mtab="bank">
    <span class="mob-tab-ico" id="mtIcoBank"></span>
    <span class="mob-tab-lbl" data-mlbl="bank">Trắc nghiệm</span>
  </button>
  <button type="button" class="mob-tab" data-mtab="exam">
    <span class="mob-tab-ico" id="mtIcoExam"></span>
    <span class="mob-tab-lbl" data-mlbl="exam">Thi thử</span>
    <span class="mob-tab-dot hidden" id="mobExamDot"></span>
  </button>
  <button type="button" class="mob-tab" data-mtab="more">
    <span class="mob-tab-ico" id="mtIcoMore"></span>
    <span class="mob-tab-lbl" data-mlbl="more">Danh mục</span>
    <span class="mob-tab-badge hidden" id="mobWrongBadge"></span>
  </button>
</nav>

<!-- Floating Scroll-to-Top Progress Ring -->
<button type="button" class="scroll-fab" id="scrollFab" data-tip="Cuộn mượt lên đầu trang" data-tip-pos="left" aria-label="Lên đầu trang">
  <svg class="fab-ring" viewBox="0 0 38 38" aria-hidden="true">
    <circle cx="19" cy="19" r="17" fill="none" stroke="var(--border)" stroke-width="2.2"/>
    <circle id="scrollFabArc" cx="19" cy="19" r="17" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="106.8"/>
  </svg>
  <span id="scrollFabIcon"></span>
</button>

<!-- Floating Text-Selection Study Popover -->
<div class="sel-popover" id="selPopover" role="toolbar" aria-label="Công cụ học nhanh đoạn văn bản">
  <button type="button" class="sel-act" id="selBtnHl"><span id="selIcoHl"></span> <span>Tô sáng</span></button>
  <span class="sel-sep"></span>
  <button type="button" class="sel-act" id="selBtnFind"><span id="selIcoFind"></span> <span>Tra đề</span></button>
  <span class="sel-sep"></span>
  <button type="button" class="sel-act" id="selBtnSpeak"><span id="selIcoSpeak"></span> <span>Đọc</span></button>
  <span class="sel-sep"></span>
  <button type="button" class="sel-act" id="selBtnCopy"><span id="selIcoCopy"></span> <span id="selLblCopy">Chép</span></button>
</div>

<!-- Zero-Latency Gliding Custom Tooltip -->
<div class="float-tip" id="floatTip" role="tooltip"></div>

<!-- Audio Reader Bar -->
<div class="tts-bar hidden" id="ttsBar">
  <span id="ttsIcon"></span>
  <span id="ttsLabel" class="mono small" style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  <select class="sel mono" id="ttsSpeed" style="height:26px;padding:0 6px;font-size:0.75rem">
    <option value="0.85">0.85x</option>
    <option value="1" selected>1.0x</option>
    <option value="1.2">1.2x</option>
    <option value="1.5">1.5x</option>
  </select>
  <button type="button" class="btn btn-sm btn-icon" id="ttsPauseBtn" aria-label="Tạm dừng / Tiếp tục"></button>
  <button type="button" class="btn btn-sm btn-icon btn-danger" id="ttsStopBtn" aria-label="Dừng đọc"></button>
</div>

<!-- Global Academic Search & Command Studio (Ctrl + K) -->
<div class="overlay hidden" id="cmdOverlay">
  <div class="cmd-dialog" role="dialog" aria-modal="true" aria-label="Tìm kiếm toàn cục học phần BAF736">
    <div class="cmd-bar">
      <span id="cmdBarIcon" class="muted" style="display:inline-flex"></span>
      <input type="search" id="cmdInput" placeholder="Tìm bài giảng, công thức, câu hỏi (có dấu hoặc không dấu: dung so, WACC, LBO...)" autocomplete="off">
      <button type="button" class="cmd-clear-btn hidden" id="cmdClearBtn" aria-label="Xoá từ khoá"></button>
      <span class="kbd desk-kbd-hint">ESC</span>
      <button type="button" class="btn btn-ghost btn-sm mob-only-btn" id="cmdCloseBtn">Đóng</button>
    </div>
    <div class="cmd-scope-bar hidden" id="cmdScopeBar"></div>
    <div class="cmd-results" id="cmdResults"></div>
    <div class="cmd-foot desk-kbd-hint" id="cmdFoot">
      <div class="cmd-foot-hints">
        <span><span class="kbd">↑</span> <span class="kbd">↓</span> Di chuyển</span>
        <span><span class="kbd">Tab</span> Lọc nhóm</span>
        <span><span class="kbd">Enter</span> Mở ngay</span>
      </div>
      <span class="mono" id="cmdStatsTxt"></span>
    </div>
  </div>
</div>

<!-- Custom Confirmation Modal -->
<div class="overlay overlay-center hidden" id="confirmOverlay">
  <div class="modal-card">
    <h3 id="confirmTitle" style="font-size:1.05rem;font-weight:650;margin-bottom:8px"></h3>
    <p id="confirmDesc" class="small muted" style="line-height:1.6;margin-bottom:20px"></p>
    <div id="confirmPinZone" class="hidden" style="margin:-6px 0 16px">
      <input type="password" inputmode="numeric" autocomplete="new-password" class="inp mono" id="confirmPinInput" placeholder="Nhập mã khoá bảo vệ..." style="width:100%;height:38px;letter-spacing:0.14em">
      <div id="confirmPinErr" class="small hidden" style="color:var(--err);margin-top:6px;font-weight:550"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="confirmCancelBtn">Huỷ</button>
      <button type="button" class="btn btn-primary" id="confirmOkBtn">Xác nhận</button>
    </div>
  </div>
</div>

<!-- SVG Diagram Zoom Lightbox -->
<div class="overlay overlay-center hidden" id="lightboxOverlay">
  <div class="lightbox-card">
    <div class="lightbox-head">
      <b id="lightboxTitle" style="font-size:0.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>
      <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
        <button type="button" class="btn btn-sm btn-icon mono" id="lbZoomOut" aria-label="Thu nhỏ">-</button>
        <button type="button" class="btn btn-sm mono" id="lbZoomReset" style="min-width:52px;padding:0 7px">100%</button>
        <button type="button" class="btn btn-sm btn-icon mono" id="lbZoomIn" aria-label="Phóng to">+</button>
        <button type="button" class="btn btn-sm" id="lightboxClose">Đóng</button>
      </div>
    </div>
    <div class="lightbox-body" id="lightboxBody"></div>
  </div>
</div>

<!-- Subtle Toast Notification -->
<div class="toast" id="appToast"></div>
